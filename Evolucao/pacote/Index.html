      '<form class="config-form" id="form-excluir-campo">'
      + tituloDoPainel('Excluir "' + campo.rotulo + '"', 'Não tem desfazer')
      + '<p class="config-aviso forte">O campo sai do formulário de '
      + '<strong>todos</strong> os canais que o usam e deixa de ser '
      + 'perguntado. Isto não se desfaz pela tela.</p>'
      + caixaDeMarcar('apagar-coluna',
        'Apagar também a coluna "' + campo.cabecalho + '" da planilha', false)
      + '<p class="config-explica">Desmarcado, a coluna fica onde está, com '
      + 'tudo o que já foi digitado nela — o sistema só para de gravar ali. '
      + 'Marcado, a coluna sai da aba e <strong>o que estava gravado nela em '
      + 'todos os casos vai embora com ela</strong>.</p>'
      + '<div class="config-acoes">'
      + '<button type="submit" class="botao vazado perigo">Excluir</button>'
      + '<button type="button" class="botao vazado" id="desistir-exclusao">'
      + 'Desistir</button>'
      + '</div></form>';

    elemento('desistir-exclusao').addEventListener('click', function () {
      desenharPainelDoCampo(campo);
    });
    elemento('form-excluir-campo').addEventListener('submit', function (evento) {
      evento.preventDefault();
      var apagarAColuna = marcado('apagar-coluna');
      comSenhaDeAdministrador(function () {
        Servidor.chamar('excluirCampo', canalEscolhido, campo.id, apagarAColuna)
          .entao(function (saiu) {
            escolhido = null;
            avisarSalvo('Campo "' + saiu.rotulo + '" excluído.'
              + (saiu.colunaApagada
                ? ' A coluna "' + saiu.cabecalho + '" saiu da planilha, com '
                  + saiu.linhasComValor + ' valor(es).'
                : ' A coluna "' + saiu.cabecalho + '" continua na planilha.'));
            carregarCampos();
          })
          .senao(mostrarErroNoPainel);
      });
    });
  }

  function avisoDaColuna(campo) {
    if (campo.colunaExiste) return '';
    return '<p class="config-aviso">A coluna <strong>'
      + escapar(campo.cabecalho) + '</strong> não existe mais na planilha. '
      + 'O campo continua cadastrado, mas nada será gravado nele até a coluna '
      + 'voltar com esse nome exato.</p>';
  }

  function salvarCampo(campo) {
    var envio = {
      id: campo.id,
      rotulo: valorDe('rotulo'),
      descricao: valorDe('descricao'),
      secao: valorDe('secao'),
      tipo: valorDe('tipo'),
      mascara: valorDe('mascara'),
      catalogo: valorDe('catalogo'),
      listaDe: valorDe('listaDe'),
      obrigatorio: marcado('obrigatorio'),
      ativo: marcado('ativo'),
      mostrarSe: lerACondicao(),
      obrigatorioSe: lerACondicao('obrigatorioSe')
    };
    Servidor.chamar('salvarCampo', envio)
      .entao(function () { avisarSalvo(); carregarCampos(); })
      .senao(mostrarErroNoPainel);
  }

  function abrirCampoNovo() {
    escolhido = null;
    desenharCampos();

    elemento('config-painel').innerHTML = '<form class="config-form" id="form-novo">'
      + tituloDoPainel('Campo novo', 'Cria uma coluna na planilha')
      + '<p class="config-aviso forte">Isto escreve na base de produção e '
      + '<strong>não tem desfazer</strong>. A coluna nasce no fim da aba, com '
      + 'o nome que você der aqui.</p>'
      + campoDeTexto('rotulo', 'Nome do campo', '',
        'Serve de rótulo na tela e de cabeçalho na planilha.')
      + campoDeTexto('secao', 'Seção do formulário', 'Geral', '')
      + campoDeTexto('descricao', 'Dica embaixo do campo', '', '')
      + caixaDeOpcoes('tipo', 'Tipo', dados.opcoes.tipos, 'texto', '')
      + campoDeTexto('mascara', 'Máscara', '', '')
      + caixaDeSimNao('obrigatorio', 'Obrigatório', false)
      + '<div class="config-acoes">'
      + '<button type="submit" class="botao">Criar coluna</button>'
      + '<button type="button" class="botao vazado" id="desistir">Desistir</button>'
      + '</div></form>';

    elemento('desistir').addEventListener('click', function () {
      painelVazio('Escolha um campo para ver as propriedades dele.');
    });
    elemento('form-novo').addEventListener('submit', function (evento) {
      evento.preventDefault();
      var envio = {
        rotulo: valorDe('rotulo'),
        secao: valorDe('secao'),
        descricao: valorDe('descricao'),
        tipo: valorDe('tipo'),
        mascara: valorDe('mascara'),
        obrigatorio: marcado('obrigatorio')
      };
      comSenhaDeAdministrador(function () {
        Servidor.chamar('criarCampo', canalEscolhido, envio)
          .entao(function (criada) {
            avisarSalvo('Coluna "' + criada.cabecalho + '" criada em '
              + criada.canal + '.');
            carregarCampos();
          })
          .senao(mostrarErroNoPainel);
      });
    });
  }

  function carregarUsuarios() {
    aguarde('Lendo o cadastro…');
    Servidor.chamar('listarNiveisDeAcesso')
      .entao(function (niveis) {
        dados.niveis = niveis;
        Servidor.chamar('listarCatalogo', 'CARGO', '')
          .entao(function (cargos) {
            dados.cargos = cargos;
            Servidor.chamar('listarUsuarios')
              .entao(function (usuarios) {
                dados.usuarios = usuarios;
                desenharUsuarios();
              })
              .senao(falhou);
          })
          .senao(falhou);
      })
      .senao(falhou);
  }

  function desenharUsuarios() {
    if (respostaAtrasada('usuarios')) return;
    var linhas = dados.usuarios.map(function (usuario) {
      return '<li class="config-item' + (escolhido && escolhido.id === usuario.id
        ? ' atual' : '') + (usuario.ativo ? '' : ' desligado') + '">'
        + '<button type="button" class="abrir" data-usuario="'
        + escapar(usuario.id) + '">'
        + '<span class="nome">' + escapar(usuario.nome) + '</span>'
        + '<span class="detalhe">' + escapar(usuario.email) + ' · '
        + escapar(usuario.nivelAcesso)
        + (usuario.cargo && usuario.cargo !== 'Sem cargo'
          ? ' · ' + escapar(usuario.cargo) : '')

        + ' · ' + escapar(usuario.canal || 'todos os canais')
        + (usuario.ativo ? '' : ' · sem acesso') + '</span></button></li>';
    }).join('');

    elemento('config-lista').innerHTML = '<div class="config-cabeca">'
      + '<span class="config-titulo">' + dados.usuarios.length + ' pessoas</span>'
      + '<button type="button" class="botao pequeno" id="novo-usuario">'
      + 'Cadastrar pessoa</button></div>'
      + '<p class="config-explica">Cadastrar alguém aqui é, literalmente, dar '
      + 'acesso: a pessoa entra com a conta Google dela, sem senha própria.</p>'
      + '<ul class="config-itens">' + linhas + '</ul>';

    ligarCliques('[data-usuario]', function (botao) {
      escolhido = { id: botao.getAttribute('data-usuario') };
      desenharUsuarios();
    });
    elemento('novo-usuario').addEventListener('click', function () {
      escolhido = null;
      desenharUsuarios();
      desenharPainelDoUsuario(null);
    });

    if (escolhido) {
      desenharPainelDoUsuario(acharNaLista(dados.usuarios, escolhido.id));
    } else painelVazio('Escolha uma pessoa, ou cadastre uma nova.');
  }

  function caixaDeCanalDaPessoa(escolhida) {
    var canais = pacoteDoSistema.canais || [];
    return '<label class="config-campo"><span>Canal</span>'
      + '<select id="cfg-canal-da-pessoa">'
      + '<option value=""' + (escolhida ? '' : ' selected') + '>'
      + '— todos os canais —</option>'
      + canais.map(function (canal) {
        return '<option value="' + escapar(canal.id) + '"'
          + (texto(canal.id) === texto(escolhida) ? ' selected' : '') + '>'
          + escapar(canal.nome) + '</option>';
      }).join('') + '</select>'
      + '<em>O canal é também a EQUIPE da pessoa: quem está no mesmo canal '
      + 'é a equipe dela na Produtividade RECC. Quem administra fica em "todos os '
      + 'canais" — pode cadastrar em qualquer uma e delegar, e não entra em '
      + 'equipe nenhuma.</em></label>';
  }

  function caixaDeDisponibilidade(escolhida) {
    var opcoes = resumo.disponibilidades || [];
    if (!opcoes.length) return '';

    var atual = texto(escolhida) || resumo.disponibilidadeQueRecebe;
    return '<label class="config-campo"><span>Recebendo casos</span>'
      + '<select id="cfg-disponibilidade">'
      + opcoes.map(function (opcao) {
        return '<option value="' + escapar(opcao.nome) + '"'
          + (texto(opcao.nome) === texto(atual) ? ' selected' : '') + '>'
          + escapar(opcao.nome) + '</option>';
      }).join('') + '</select>'
      + '<em>Só quem está "' + escapar(resumo.disponibilidadeQueRecebe)
      + '" entra na divisão de um lote na Importação. Férias e afastamento '
      + 'NÃO tiram o acesso — a pessoa continua entrando no sistema.</em>'
      + '</label>';
  }

  function desenharPainelDoUsuario(usuario) {
    var ehNovo = !usuario;
    var pessoa = usuario || {
      id: '', nome: '', email: '', canalId: '', cargoId: '',
      nivelAcessoId: '', ativo: true,
      disponibilidade: resumo.disponibilidadeQueRecebe
    };

    elemento('config-painel').innerHTML = '<form class="config-form" id="form-usuario">'
      + tituloDoPainel(ehNovo ? 'Pessoa nova' : pessoa.nome,
        ehNovo ? 'Dar acesso ao sistema' : 'Cadastro de acesso')
      + campoDeTexto('nome', 'Nome', pessoa.nome, '')
      + campoDeTexto('email', 'E-mail Google', pessoa.email,
        'É por ele que a pessoa entra. Tem de ser a conta que ela usa.')
      + caixaDeCanalDaPessoa(pessoa.canalId)
      + caixaDeItens('cargo', 'Cargo', dados.cargos, pessoa.cargoId,
        'O cargo é só descrição — quem decide o acesso é o nível abaixo.')
      + caixaDeItens('nivel', 'Nível de acesso', dados.niveis, pessoa.nivelAcessoId,
        'Define telas, campos, ações e alcance. Quem forma a EQUIPE é o CANAL, '
        + 'logo acima — dois níveis diferentes no mesmo canal são a mesma '
        + 'equipe.')
      + caixaDeSimNao('ativo', 'Pode entrar', pessoa.ativo !== false)
      + caixaDeDisponibilidade(pessoa.disponibilidade)
      + '<div class="config-acoes">'
      + '<button type="submit" class="botao">Salvar</button>'
      + (ehNovo ? '' : '<button type="button" class="botao vazado" id="desativar">'
        + 'Tirar o acesso</button>')
      + '</div></form>';

    elemento('form-usuario').addEventListener('submit', function (evento) {
      evento.preventDefault();
      Servidor.chamar('salvarUsuario', {
        id: pessoa.id,
        nome: valorDe('nome'),
        email: valorDe('email'),
        canalId: valorDe('canal-da-pessoa'),
        cargoId: valorDe('cargo'),
        nivelAcessoId: valorDe('nivel'),
        ativo: marcado('ativo'),
        disponibilidade: valorDe('disponibilidade')
      }).entao(function () { avisarSalvo(); carregarUsuarios(); })
        .senao(mostrarErroNoPainel);
    });

    var desativar = elemento('desativar');
    if (desativar) {
      desativar.addEventListener('click', function () {
        if (!window.confirm('Tirar o acesso de ' + pessoa.nome + '?\n\n'
          + 'O cadastro permanece, com o histórico. Só a entrada é fechada.')) return;
        Servidor.chamar('desativarUsuario', pessoa.id)
          .entao(function () { avisarSalvo(); carregarUsuarios(); })
          .senao(mostrarErroNoPainel);
      });
    }
  }

  function carregarNiveis() {
    aguarde('Lendo os níveis…');
    Servidor.chamar('opcoesDeNivelDeAcesso')
      .entao(function (opcoes) {
        dados.opcoesDeNivel = opcoes;
        Servidor.chamar('listarNiveisDeAcesso')
          .entao(function (niveis) {
            dados.niveis = niveis;
            desenharNiveis();
          })
          .senao(falhou);
      })
      .senao(falhou);
  }

  function desenharNiveis() {
    if (respostaAtrasada('niveis')) return;
    var linhas = dados.niveis.map(function (nivel) {
      return '<li class="config-item' + (escolhido && escolhido.id === nivel.id
        ? ' atual' : '') + (nivel.ativo ? '' : ' desligado') + '">'
        + '<button type="button" class="abrir" data-nivel="' + escapar(nivel.id) + '">'
        + '<span class="nome">' + escapar(nivel.nome) + '</span>'
        + '<span class="detalhe">' + nivel.telas.length + ' telas · '
        + nivel.acoes.length + ' ações · alcance ' + escapar(nivel.escopo)
        + ' · produtividade ' + escapar(nivel.escopoNaProdutividade || 'EQUIPE')
        + ' · ' + nivel.pessoas + ' pessoa(s)'
        + (nivel.defeito
          ? ' · <strong class="alerta">' + escapar(nivel.defeito) + '</strong>' : '')
        + '</span></button></li>';
    }).join('');

    elemento('config-lista').innerHTML = '<div class="config-cabeca">'
      + '<span class="config-titulo">' + dados.niveis.length + ' níveis</span>'
      + '<button type="button" class="botao pequeno" id="novo-nivel">'
      + 'Criar nível</button></div>'
      + '<p class="config-explica">O cargo não decide nada. É o nível de acesso '
      + 'que diz quais telas abrem, o que a pessoa pode fazer e até onde ela '
      + 'enxerga os dados. Quem forma a EQUIPE é o canal da pessoa, em '
      + 'Usuários.</p>'
      + '<ul class="config-itens">' + linhas + '</ul>';

    ligarCliques('[data-nivel]', function (botao) {
      escolhido = { id: botao.getAttribute('data-nivel') };
      desenharNiveis();
    });

    elemento('novo-nivel').addEventListener('click', function () {
      escolhido = null;
      desenharNiveis();
      desenharPainelDoNivel(null);
    });

    if (escolhido) desenharPainelDoNivel(acharNaLista(dados.niveis, escolhido.id));
    else painelVazio('Escolha um nível para ver o que ele pode, ou crie um novo.');
  }

  function desenharPainelDoNivel(nivel) {
    var ehNovo = !nivel;
    nivel = nivel || {
      id: '', nome: '', ativo: true, escopo: 'PROPRIOS',
      canais: [], telas: [], acoes: [], escopoNaProdutividade: 'EQUIPE',
      campos: {}, pessoas: 0
    };
    var opcoes = dados.opcoesDeNivel;

    var telas = opcoes.telas.map(function (tela) {
      return caixaDeMarcar('tela-' + tela.chave, tela.titulo,
        nivel.telas.indexOf(tela.chave) >= 0, '');
    }).join('');

    var acoes = opcoes.acoes.map(function (acao) {
      return caixaDeMarcar('acao-' + acao.chave, acao.chave,
        nivel.acoes.indexOf(acao.chave) >= 0, acao.descricao);
    }).join('');

    var escolhidos = nivel.canais || [];
    var canaisDoNivel = (opcoes.canais || []).map(function (canal) {
      return caixaDeMarcar('canal-' + canal.id, canal.nome,
        escolhidos.indexOf(canal.id) >= 0, canal.descricao);
    }).join('');

    function desenharAlcanceNaProdutividade(nivel, opcoes) {
      var config = opcoes.produtividade;
      if (!config) return '';

      var atual = nivel.escopoNaProdutividade || 'EQUIPE';
      var escolhas = config.opcoes.map(function (uma) {
        return '<label class="config-radio">'
          + '<input type="radio" name="escopoProdutividade"'
          + ' value="' + escapar(uma.chave) + '"'
          + (atual === uma.chave ? ' checked' : '') + '>'
          + '<span><strong>' + escapar(uma.chave) + '</strong>'
          + '<em>' + escapar(uma.descricao) + '</em></span></label>';
      }).join('');

      return '<fieldset class="config-grupo"><legend>'
        + escapar(config.titulo) + '</legend>'
        + '<p class="config-dica">Esta tela é a da EQUIPE, e quem vê a '
        + 'produtividade de quem é decisão sua. <strong>Bloqueado tira a tela '
        + 'do menu</strong> deste nível — por isso ela não aparece em "Telas '
        + 'que abrem".<br>Vale só aqui: o alcance acima continua mandando no '
        + 'Trabalho e na Busca. E <strong>quais</strong> canais aparecem '
        + 'continua sendo a lista de canais, logo abaixo.</p>'
        + escolhas + '</fieldset>';
    }

    var escopos = opcoes.escopos.map(function (escopo) {
      return '<label class="config-radio">'
        + '<input type="radio" name="escopo" value="' + escapar(escopo.chave) + '"'
        + (nivel.escopo === escopo.chave ? ' checked' : '') + '>'
        + '<span><strong>' + escapar(escopo.chave) + '</strong>'
        + '<em>' + escapar(escopo.descricao) + '</em></span></label>';
    }).join('');

    elemento('config-painel').innerHTML = '<form class="config-form" id="form-nivel">'
      + tituloDoPainel(ehNovo ? 'Nível novo' : nivel.nome,
        ehNovo ? 'Nasce fechado: marque o que ele abre'
          : nivel.pessoas + ' pessoa(s) neste nível')
      + campoDeTexto('nome', 'Nome do nível', nivel.nome, '')
      + caixaDeSimNao('ativo', 'Nível em uso', nivel.ativo)
      + '<fieldset class="config-grupo"><legend>Telas que abrem</legend>'
      + telas + '</fieldset>'
      + '<fieldset class="config-grupo"><legend>O que pode fazer</legend>'
      + acoes + '</fieldset>'
      + '<fieldset class="config-grupo"><legend>Até onde enxerga</legend>'
      + escopos + '</fieldset>'
      + desenharAlcanceNaProdutividade(nivel, opcoes)
      + '<fieldset class="config-grupo"><legend>Quais canais enxerga</legend>'
      + '<p class="config-dica">RET e Mesa Diamante são operações '
      + 'distintas. Marque os canais deste nível — <strong>nenhum marcado '
      + 'quer dizer todos</strong>, que é o caso de quem administra.</p>'
      + canaisDoNivel + '</fieldset>'
      + '<div class="config-acoes">'
      + '<button type="submit" class="botao">'
      + (ehNovo ? 'Criar nível' : 'Salvar') + '</button>'
      + (ehNovo ? '<button type="button" class="botao vazado" id="desistir-nivel">'
        + 'Desistir</button>' : '')
      + '</div></form>';

    var desistirDoNivel = elemento('desistir-nivel');
    if (desistirDoNivel) {
      desistirDoNivel.addEventListener('click', function () {
        painelVazio('Escolha um nível para ver o que ele pode, ou crie um novo.');
      });
    }

    elemento('form-nivel').addEventListener('submit', function (evento) {
      evento.preventDefault();

      var telasMarcadas = [];
      opcoes.telas.forEach(function (tela) {
        if (marcado('tela-' + tela.chave)) telasMarcadas.push(tela.chave);
      });
      var acoesMarcadas = [];
      opcoes.acoes.forEach(function (acao) {
        if (marcado('acao-' + acao.chave)) acoesMarcadas.push(acao.chave);
      });

      var canaisMarcados = [];
      (opcoes.canais || []).forEach(function (canal) {
        if (marcado('canal-' + canal.id)) canaisMarcados.push(canal.id);
      });

      var escolhidoEscopo = document.querySelector('input[name="escopo"]:checked');
      var naProdutividade = document.querySelector(
        'input[name="escopoProdutividade"]:checked');

      Servidor.chamar('salvarNivelDeAcesso', {
        id: nivel.id,
        nome: valorDe('nome'),
        ativo: marcado('ativo'),
        canais: canaisMarcados,
        telas: telasMarcadas,
        acoes: acoesMarcadas,
        escopo: escolhidoEscopo ? escolhidoEscopo.value : nivel.escopo,
        escopoNaProdutividade: naProdutividade
          ? naProdutividade.value : (nivel.escopoNaProdutividade || 'EQUIPE'),
        campos: nivel.campos
      }).entao(function (idDoNivel) {

        if (ehNovo && idDoNivel) escolhido = { id: String(idDoNivel) };
        avisarSalvo(ehNovo ? 'Nível criado.' : '');
        carregarNiveis();
      }).senao(mostrarErroNoPainel);
    });
  }

  function carregarListas() {
    aguarde('Lendo as listas…');
    Servidor.chamar('opcoesDeConfiguracaoDeCampo')
      .entao(function (opcoes) {
        dados.listas = opcoes.listas;
        dados.tons = opcoes.tons;
        var aindaExiste = dados.listas.some(function (lista) {
          return lista.chave === tipoDeListaEscolhido;
        });
        if (!aindaExiste) {
          tipoDeListaEscolhido = dados.listas.length ? dados.listas[0].chave : '';
        }
        if (!tipoDeListaEscolhido) {
          dados.itens = [];
          desenharListas();
          return;
        }
        Servidor.chamar('listarCatalogo', tipoDeListaEscolhido, '')
          .entao(function (itens) {
            dados.itens = itens;

            Servidor.chamar('opcoesDoCarimboDoItem', tipoDeListaEscolhido)
              .entao(function (carimbo) {
                dados.carimbo = carimbo;
                desenharListas();
              })
              .senao(falhou);
          })
          .senao(falhou);
      })
      .senao(falhou);
  }

  function desenharListas() {
    if (respostaAtrasada('catalogo')) return;
    var linhas = dados.itens.map(function (item) {
      return '<li class="config-item' + (escolhido && escolhido.id === item.id
        ? ' atual' : '') + (item.ativo ? '' : ' desligado') + '">'
        + '<button type="button" class="abrir" data-item="' + escapar(item.id) + '">'
        + '<span class="nome"><span class="ponto tom-' + escapar(item.cor)
        + '"></span>' + escapar(item.rotulo) + '</span>'
        + '<span class="detalhe">grava como "' + escapar(item.nome) + '"'
        + (item.ativo ? '' : ' · desligado') + '</span></button></li>';
    }).join('');

    var lista = listaEscolhida();

    elemento('config-lista').innerHTML = '<div class="config-cabeca">'
      + '<select id="tipo-da-lista" aria-label="Lista">'
      + dados.listas.map(function (uma) {
        return '<option value="' + escapar(uma.chave) + '"'
          + (uma.chave === tipoDeListaEscolhido ? ' selected' : '') + '>'
          + escapar(uma.nome) + '</option>';
      }).join('') + '</select>'
      + '<div class="config-cabeca-acoes">'
      + '<button type="button" class="botao-secundario pequeno" id="nova-lista">'
      + 'Nova lista</button>'
      + (lista ? '<button type="button" class="botao pequeno" id="novo-item">'
        + 'Novo item</button>' : '')
      + '</div></div>'
      + (lista ? sobreALista(lista) : '<p class="config-explica">Nenhuma lista '
        + 'ainda. Crie a primeira em "Nova lista".</p>')
      + '<p class="config-explica">O <strong>nome</strong> é o que fica gravado '
      + 'no caso; o <strong>rótulo</strong> é o que aparece na tela. Por isso '
      + 'trocar o rótulo é sempre seguro, e trocar o nome de um item já usado '
      + 'é recusado.</p>'
      + '<ul class="config-itens">' + linhas + '</ul>';

    var trocaDeLista = elemento('tipo-da-lista');
    if (trocaDeLista) {
      trocaDeLista.addEventListener('change', function () {
        tipoDeListaEscolhido = this.value;
        escolhido = null;
        carregarListas();
      });
    }
    elemento('nova-lista').addEventListener('click', function () {
      escolhido = null;
      desenharListas();
      desenharPainelDaListaNova();
    });
    var novoItem = elemento('novo-item');
    if (novoItem) {
      novoItem.addEventListener('click', function () {
        escolhido = null;
        desenharListas();
        desenharPainelDoItem(null);
      });
    }
    var renomear = elemento('renomear-lista');
    if (renomear) renomear.addEventListener('click', function () {
      escolhido = null;
      desenharListas();
      desenharPainelDeRenomear(lista);
    });
    var excluirAqui = elemento('excluir-lista');
    if (excluirAqui) excluirAqui.addEventListener('click', function () {
      excluirALista(lista);
    });
    ligarCliques('[data-item]', function (botao) {
      escolhido = { id: botao.getAttribute('data-item') };
      desenharListas();
    });

    if (escolhido) desenharPainelDoItem(acharNaLista(dados.itens, escolhido.id));
    else painelVazio('Escolha um item, ou crie um novo.');
  }

  function listaEscolhida() {
    return acharNaListaPorChave(dados.listas, tipoDeListaEscolhido);
  }

  function acharNaListaPorChave(listas, chave) {
    return (listas || []).filter(function (uma) { return uma.chave === chave; })[0] || null;
  }

  function sobreALista(lista) {
    return '<div class="config-sobre-lista">'
      + '<p class="config-explica">' + (lista.usadaEm.length
        ? 'Usada em: <strong>' + escapar(lista.usadaEm.join(', ')) + '</strong>.'
        : 'Nenhum campo usa esta lista ainda. Para usar, escolha-a no campo, em '
          + 'Configurações › Cadastrar Caso.')
      + (lista.doSistema ? ' É uma lista que o sistema usa por dentro: os itens '
        + 'se editam e se excluem, a lista não.' : '') + '</p>'
      + '<div class="config-acoes">'
      + '<button type="button" class="botao-secundario pequeno" id="renomear-lista">'
      + 'Renomear lista</button>'
      + (lista.doSistema ? '' : '<button type="button" class="botao vazado perigo pequeno"'
        + ' id="excluir-lista">Excluir lista</button>')
      + '</div></div>';
  }

  function desenharPainelDaListaNova() {
    elemento('config-painel').innerHTML = '<form class="config-form" id="form-lista">'
      + tituloDoPainel('Lista nova', 'Ajustes Gerais')
      + campoDeTexto('nome-da-lista', 'Nome da lista', '',
        'Como ela aparece aqui e no campo — por exemplo "Classificação". Depois '
        + 'de criar, acrescente os itens em "Novo item".')
      + '<div class="config-acoes">'
      + '<button type="submit" class="botao">Criar lista</button></div></form>';
    elemento('form-lista').addEventListener('submit', function (evento) {
      evento.preventDefault();
      Servidor.chamar('criarLista', valorDe('nome-da-lista'))
        .entao(function (chave) {
          tipoDeListaEscolhido = chave;
          avisarSalvo('Lista criada. Agora acrescente os itens.');
          carregarListas();
        })
        .senao(mostrarErroNoPainel);
    });
  }

  function desenharPainelDeRenomear(lista) {
    elemento('config-painel').innerHTML = '<form class="config-form" id="form-renomear-lista">'
      + tituloDoPainel('Renomear lista', lista.nome)
      + campoDeTexto('nome-da-lista', 'Nome na tela', lista.nome,
        'Muda só o nome que aparece. Os itens, os campos e os casos continuam '
        + 'ligados a ela.')
      + '<div class="config-acoes">'
      + '<button type="submit" class="botao">Salvar</button></div></form>';
    elemento('form-renomear-lista').addEventListener('submit', function (evento) {
      evento.preventDefault();
      Servidor.chamar('renomearLista', lista.chave, valorDe('nome-da-lista'))
        .entao(function () { avisarSalvo(); carregarListas(); })
        .senao(mostrarErroNoPainel);
    });
  }

  function excluirALista(lista) {
    Formulario.confirmarAtencao('Atenção: excluir a lista "' + escapar(lista.nome) + '"',
      '<p><strong>A lista e os ' + escapar(String(lista.quantos))
      + ' item(ns) dela saem da planilha.</strong> Não dá para desfazer.</p>'
      + '<p>Os casos já gravados não mudam: continuam com o texto que tinham.</p>',
      'Excluir lista', function () {
        Servidor.chamar('excluirLista', lista.chave)
          .entao(function (saiu) {
            tipoDeListaEscolhido = '';
            escolhido = null;
            avisarSalvo('Lista "' + saiu.nome + '" excluída.');
            carregarListas();
          })
          .senao(mostrarErroNoPainel);
      });
  }

  function excluirOItem(item) {
    Servidor.chamar('usoDoItemDoCatalogo', item.id)
      .entao(function (uso) {
        Formulario.confirmarAtencao('Atenção: excluir o item "' + escapar(uso.nome) + '"',
          '<p><strong>O item sai da lista e do formulário.</strong> Não dá para '
          + 'desfazer.</p>'
          + (uso.casos
            ? '<p>Ele está gravado em <strong>' + escapar(String(uso.casos))
              + ' caso(s)</strong>. Esses casos continuam com o texto "'
              + escapar(item.nome) + '".</p>'
            : '<p>Nenhum caso usa este item.</p>'),
          'Excluir item', function () {
            Servidor.chamar('excluirItemDoCatalogo', item.id)
              .entao(function () {
                escolhido = null;
                avisarSalvo('Item excluído.');
                carregarListas();
              })
              .senao(mostrarErroNoPainel);
          });
      })
      .senao(mostrarErroNoPainel);
  }

  function desenharPainelDoItem(item) {
    var ehNovo = !item;
    var atual = item || {
      id: '', nome: '', rotulo: '', cor: 'neutro', ordem: dados.itens.length + 1,
      ativo: true, codigo: '', colunaDeCarimbo: '', final: false
    };

    function ehStatus() {
      return String(tipoDeListaEscolhido || '').toUpperCase() === 'STATUS';
    }

    function carimba() {
      return !!(dados.carimbo && dados.carimbo.carimba);
    }

    function canalDoItem(item) {
      var canais = (dados.carimbo && dados.carimbo.canais) || [];
      return '<label class="config-campo"><span>Canal</span>'
        + '<select id="cfg-canal-do-item">'
        + '<option value="">Todos os canais</option>'
        + canais.map(function (canal) {
          return '<option value="' + escapar(canal.id) + '"'
            + (texto(canal.id) === texto(item.canalId) ? ' selected' : '') + '>'
            + escapar(canal.nome) + '</option>';
        }).join('') + '</select>'
        + '<em>Em que canal o item aparece. "Todos os canais" vale para todos.</em>'
        + '</label>';
    }

    function opcoesDaColunaDoCarimbo(canalId, escolhida) {
      var canais = (dados.carimbo && dados.carimbo.canais) || [];
      var mostrados = canais.filter(function (canal) {
        return canalId ? texto(canal.id) === texto(canalId) : canal.usaALista;
      });
      var achou = !escolhida;
      var html = '<option value=""' + (escolhida ? '' : ' selected') + '>'
        + 'Não carimba</option>';
      mostrados.forEach(function (canal) {
        html += '<optgroup label="' + escapar(canal.nome) + '">';
        canal.colunas.forEach(function (coluna) {
          var esta = !achou && normalizarTexto(coluna) === normalizarTexto(escolhida);
          if (esta) achou = true;
          html += '<option value="' + escapar(coluna) + '"' + (esta ? ' selected' : '')
            + '>' + escapar(coluna) + '</option>';
        });
        html += '</optgroup>';
      });
      if (!achou) {
        html += '<option value="' + escapar(escolhida) + '" selected>' + escapar(escolhida)
          + ' (atual, fora das colunas de data)</option>';
      }
      return html;
    }

    function carimboDoItem(item) {
      if (!carimba()) return '';
      return '<label class="config-campo"><span>Coluna que recebe data e hora</span>'
        + '<select id="cfg-coluna-de-carimbo">'
        + opcoesDaColunaDoCarimbo(item.canalId, item.colunaDeCarimbo || '')
        + '</select>'
        + '<em>' + escapar((ehStatus()
          ? 'Quando o caso chegar neste status'
          : 'Quando este item for escolhido no caso')
          + ', o sistema grava data e hora nessa coluna da base do canal — é o que '
          + 'mede produtividade. A escolha fica no próprio item: trocar o rótulo '
          + 'não muda onde ele carimba. O carimbo só é escrito se a célula estiver '
          + 'vazia: um caso que volta a este item guarda a data da primeira vez.')
        + '</em></label>';
    }

    function finalDoStatus(item) {
      if (!ehStatus()) return '';
      return caixaDeMarcar('final', 'Fecha o caso (status final)', item.final,
        'Entra em "Concluídos" e na meta. O caso continua aceitando mudança '
        + 'de status.');
    }

    var lista = listaEscolhida();
    elemento('config-painel').innerHTML = '<form class="config-form" id="form-item">'
      + tituloDoPainel(ehNovo ? 'Item novo' : atual.rotulo,
        'Lista ' + (lista ? lista.nome : tipoDeListaEscolhido))
      + campoDeTexto('nome', 'Nome gravado no caso', atual.nome,
        'É este texto que vai para a célula da planilha.')
      + campoDeTexto('rotulo', 'Rótulo na tela', atual.rotulo, '')
      + campoDeTexto('codigo', 'Código', atual.codigo, 'Só dígitos, se houver.')
      + caixaDeOpcoes('cor', 'Tom', dados.tons, atual.cor,
        'O tom acompanha o tema: escolher "ruim" fica vermelho no claro e no '
        + 'escuro, sem ninguém precisar mexer.')
      + canalDoItem(atual)
      + carimboDoItem(atual)
      + finalDoStatus(atual)
      + campoDeTexto('ordem', 'Ordem', atual.ordem, '')
      + caixaDeSimNao('ativo', 'Aparece nas listas', atual.ativo)
      + '<div class="config-acoes">'
      + '<button type="submit" class="botao">Salvar</button>'
      + (ehNovo ? '' : '<button type="button" class="botao vazado perigo" id="excluir-item">'
        + 'Excluir item</button>')
      + '</div></form>';

    var excluir = elemento('excluir-item');
    if (excluir) excluir.addEventListener('click', function () { excluirOItem(atual); });

    var menuDoCanal = elemento('cfg-canal-do-item');
    var menuDoCarimbo = elemento('cfg-coluna-de-carimbo');
    if (menuDoCanal && menuDoCarimbo) {
      menuDoCanal.addEventListener('change', function () {
        menuDoCarimbo.innerHTML = opcoesDaColunaDoCarimbo(menuDoCanal.value,
          menuDoCarimbo.value);
      });
    }

    elemento('form-item').addEventListener('submit', function (evento) {
      evento.preventDefault();
      Servidor.chamar('salvarItemDoCatalogo', {
        id: atual.id,
        tipo: tipoDeListaEscolhido,
        nome: valorDe('nome'),
        rotulo: valorDe('rotulo'),
        codigo: valorDe('codigo'),
        cor: valorDe('cor'),
        canalId: valorDe('canal-do-item'),
        colunaDeCarimbo: carimba() ? valorDe('coluna-de-carimbo') : '',
        final: ehStatus() ? marcado('final') : false,
        ordem: valorDe('ordem'),
        ativo: marcado('ativo')
      }).entao(function () { avisarSalvo(); carregarListas(); })
        .senao(mostrarErroNoPainel);
    });
  }

  function carregarCanais() {
    aguarde('Lendo os canais…');
    Servidor.chamar('listarCanaisConfiguraveis')
      .entao(function (canais) { dados.canais = canais; desenharCanais(); })
      .senao(falhou);
  }

  function desenharCanais() {
    if (respostaAtrasada('canais')) return;
    var linhas = dados.canais.map(function (canal) {
      return '<li class="config-item' + (escolhido && escolhido.id === canal.id
        ? ' atual' : '') + (canal.ativo ? '' : ' desligado') + '">'
        + '<button type="button" class="abrir" data-canal="' + escapar(canal.id) + '">'
        + '<span class="nome">' + escapar(canal.nome) + '</span>'
        + '<span class="detalhe">aba ' + escapar(canal.aba)
        + (canal.abaExiste ? '' : ' · <strong class="alerta">aba ausente</strong>')
        + (canal.ativo ? '' : ' · desligada') + '</span></button></li>';
    }).join('');

    elemento('config-lista').innerHTML = '<div class="config-cabeca">'
      + '<span class="config-titulo">' + dados.canais.length + ' canais</span>'
      + (resumo.podeMexerNaEstrutura
        ? '<button type="button" class="botao pequeno" id="novo-canal">'
          + 'Criar canal</button>' : '')
      + '</div>'
      + '<p class="config-explica">Aqui se ajusta o que o canal MOSTRA — nome, '
      + 'ícone, quais colunas viram fila. Onde ele mora, a aba da planilha, '
      + 'não muda: os casos já gravados estão lá.</p>'
      + '<ul class="config-itens">' + linhas + '</ul>';

    ligarCliques('[data-canal]', function (botao) {
      escolhido = { id: botao.getAttribute('data-canal') };
      desenharCanais();
    });

    var novoCanal = elemento('novo-canal');
    if (novoCanal) novoCanal.addEventListener('click', abrirCanalNovo);

    if (escolhido) desenharPainelDoCanal(acharNaLista(dados.canais, escolhido.id));
    else painelVazio('Escolha um canal, ou crie um novo.');
  }

  function abrirCanalNovo() {
    escolhido = null;
    desenharCanais();

    elemento('config-painel').innerHTML = '<form class="config-form" id="form-canal-novo">'
      + tituloDoPainel('Canal novo', 'Cria uma aba na planilha')
      + '<p class="config-aviso forte">Isto escreve na planilha de produção e '
      + '<strong>não tem desfazer</strong>. A aba nasce com a coluna '
      + '<strong>id</strong> e as de controle; os campos do formulário são '
      + 'criados depois, em Cadastrar Caso.</p>'
      + campoDeTexto('nome', 'Nome do canal', '',
        'É o que aparece no seletor do Trabalho.')
      + campoDeTexto('descricao', 'Descrição', '',
        'Uma linha explicando o que este canal trata.')
      + campoDeTexto('aba', 'Aba da planilha', '',
        'Em branco, o sistema sugere BASE_ com o nome do canal. Sem acento e '
        + 'sem espaço — é o nome que o Power BI vai ler.')
      + caixaDeOpcoes('icone', 'Ícone', SeletorDeCanal.nomesDosIcones(),
        SeletorDeCanal.nomesDosIcones()[0], '')
      + caixaDeMarcar('aproveitar-aba',
        'Aproveitar a aba que já existe, com os dados dela', false,
        'Marque se a base já está na planilha. O cabeçalho dela não é tocado: '
        + 'as colunas que já estão lá viram campos, e as de controle são '
        + 'acrescentadas se faltarem. A aba precisa ter uma coluna "id".')
      + '<div class="config-acoes">'
      + '<button type="submit" class="botao">Criar canal</button>'
      + '<button type="button" class="botao vazado" id="desistir-canal">'
      + 'Desistir</button>'
      + '</div></form>';

    elemento('desistir-canal').addEventListener('click', function () {
      painelVazio('Escolha um canal, ou crie um novo.');
    });

    elemento('form-canal-novo').addEventListener('submit', function (evento) {
      evento.preventDefault();
      var envio = {
        nome: valorDe('nome'),
        descricao: valorDe('descricao'),
        aba: valorDe('aba'),
        icone: valorDe('icone'),
        aproveitarAAba: marcado('aproveitar-aba')
      };
      comSenhaDeAdministrador(function () {
        Servidor.chamar('criarCanal', envio)
          .entao(function (criado) {
            avisarSalvo('Canal "' + criado.nome + '" criado na aba '
              + criado.aba + '.');
            escolhido = { id: String(criado.id) };
            carregarCanais();
            mostrarProximosPassos(criado);
          })
          .senao(mostrarErroNoPainel);
      });
    });
  }

  function mostrarProximosPassos(criado) {
    elemento('config-painel').innerHTML = '<div class="config-form">'
      + tituloDoPainel(criado.nome, 'Criado na aba ' + criado.aba)
      + (criado.abaAproveitada
        ? '<p class="config-explica">A aba já existia, e ficou como estava. '
          + (criado.colunasRegistradas.length
            ? escapar(String(criado.colunasRegistradas.length))
              + ' coluna(s) dela viraram campos do formulário, todas como '
              + 'texto — troque o tipo de cada uma em Cadastrar Caso.'
            : 'Nenhuma coluna nova precisou ser registrada.')
          + '</p>'
        : '')
      + '<p class="config-explica"><strong>Próximos passos</strong></p>'
      + '<ol class="config-passos">'
      + criado.proximosPassos.map(function (passo) {
        return '<li>' + escapar(passo) + '</li>';
      }).join('')
      + '</ol></div>';
  }

  function desenharPainelDoCanal(canal) {
    if (!canal) return painelVazio('Escolha um canal.');
    var colunas = [''].concat(canal.colunasDaBase);

    elemento('config-painel').innerHTML = '<form class="config-form" id="form-canal">'
      + tituloDoPainel(canal.nome, 'Aba ' + canal.aba)
      + campoDeTexto('nome', 'Nome do canal', canal.nome, '')
      + campoDeTexto('descricao', 'Descrição', canal.descricao, '')
      + caixaDeOpcoes('colunaDaData', 'Coluna da data de entrada', colunas,
        canal.colunaDaData,
        'É daqui que sai a "data do último registro" da barra superior.')
      + caixaDeOpcoes('colunaDaHora', 'Coluna da hora', colunas, canal.colunaDaHora, '')
      + caixaDeOpcoes('colunaDoStatus', 'Coluna da situação', colunas,
        canal.colunaDoStatus, 'É por ela que os cartões do painel contam.')
      + '<div class="config-campo"><span>Colunas da fila</span>'
      + '<div class="editor-da-fila" id="editor-da-fila"></div>'
      + '<input type="hidden" id="cfg-colunasDaFila">'
      + '<em>Cada grupo é uma coluna da tabela do Trabalho, na ordem daqui. A '
      + 'primeira linha de cada grupo é o destaque. "+ juntar…" põe duas '
      + 'colunas na mesma linha, com hífen — é assim que a proposta da RET sai '
      + 'inteira, 7-0000000.</em></div>'
      + campoDeTexto('colunasDaBusca', 'Colunas em que a busca procura',
        canal.colunasDaBusca,
        'Separadas por vírgula. Só estas são lidas ao procurar — é o que faz '
        + 'a busca não estourar numa base grande.')
      + caixaDeOpcoes('colunaDaFinalizacao', 'Coluna da finalização', colunas,
        canal.colunaDaFinalizacao, '')
      + caixaDeOpcoes('colunaDaAreaResponsavel', 'Coluna da área responsável',
        colunas, canal.colunaDaAreaResponsavel, '')
      + campoDeTexto('slaHorasUteis', 'SLA em horas úteis', canal.slaHorasUteis,
        'Prazo do caso, contado de segunda a sexta e só dentro do expediente '
        + 'abaixo. Começa na data e hora de entrada e para na primeira resposta '
        + '(caso encerrado sem resposta para no encerramento). Aparece como selo '
        + 'na fila do Trabalho. Zero desliga.')
      + campoDeTexto('inicioDoExpediente', 'Início do expediente',
        canal.inicioDoExpediente, 'Como 08:15.')
      + campoDeTexto('fimDoExpediente', 'Fim do expediente',
        canal.fimDoExpediente, 'Como 18:30.')
      + caixaDeOpcoes('colunaDaPrimeiraResposta', 'Coluna da primeira resposta',
        colunas, canal.colunaDaPrimeiraResposta,
        'A data em que o caso teve a primeira resposta: é nela que o prazo do SLA para.')
      + caixaDeOpcoes('colunaDaHoraDaPrimeiraResposta',
        'Coluna da hora da primeira resposta', colunas,
        canal.colunaDaHoraDaPrimeiraResposta, '')
      + caixaDeOpcoes('colunaDoValor', 'Coluna do valor', colunas,
        canal.colunaDoValor,
        'A coluna de dinheiro deste canal. É dela que sai o gráfico "Valor por '
        + 'situação", na Produtividade RECC. Em branco, '
        + 'o gráfico não aparece.')
      + campoDeTexto('situacoesDestacadas', 'Situações com barra própria',
        canal.situacoesDestacadas,
        'Separadas por vírgula, na ordem em que você quer ler — por exemplo '
        + '"Reteve, Não reteve, Sem sucesso". Todas as outras somam numa barra '
        + 'só, "Demais situações", e o total fecha a conta. Situação sem caso '
        + 'no período aparece valendo zero, de propósito: sumir faria a conta '
        + 'parecer completa com um pedaço faltando.')
      + caixaDeOpcoes('icone', 'Ícone', SeletorDeCanal.nomesDosIcones(),
        canal.icone,
        'O desenho que aparece no seletor do Trabalho. Nome desconhecido cai '
        + 'no losango.')
      + campoDeTexto('ordem', 'Ordem no seletor', canal.ordem, '')
      + caixaDeSimNao('ativo', 'Canal em uso', canal.ativo)
      + (canal.situacoes.length
        ? '<p class="config-explica">Situações cadastradas neste canal: '
          + escapar(canal.situacoes.join(', ')) + '.</p>'
        : '')
      + '<div class="config-acoes">'
      + '<button type="submit" class="botao">Salvar</button></div></form>';

    EditorDaFila.montar(elemento('editor-da-fila'), elemento('cfg-colunasDaFila'),
      canal.colunasDaFila, canal.colunasDaBase, escapar);

    elemento('form-canal').addEventListener('submit', function (evento) {
      evento.preventDefault();
      Servidor.chamar('salvarCanal', {
        id: canal.id,
        nome: valorDe('nome'),
        descricao: valorDe('descricao'),
        colunaDaData: valorDe('colunaDaData'),
        colunaDaHora: valorDe('colunaDaHora'),
        colunaDoStatus: valorDe('colunaDoStatus'),
        colunasDaFila: valorDe('colunasDaFila'),
        colunasDaBusca: valorDe('colunasDaBusca'),
        colunaDaFinalizacao: valorDe('colunaDaFinalizacao'),
        colunaDaAreaResponsavel: valorDe('colunaDaAreaResponsavel'),
        slaHorasUteis: valorDe('slaHorasUteis'),
        inicioDoExpediente: valorDe('inicioDoExpediente'),
        fimDoExpediente: valorDe('fimDoExpediente'),
        colunaDaPrimeiraResposta: valorDe('colunaDaPrimeiraResposta'),
        colunaDaHoraDaPrimeiraResposta: valorDe('colunaDaHoraDaPrimeiraResposta'),
        colunaDoValor: valorDe('colunaDoValor'),
        situacoesDestacadas: valorDe('situacoesDestacadas'),

      }).entao(function () { avisarSalvo(); carregarCanais(); })
        .senao(mostrarErroNoPainel);

  var canalDosCards = '';

  var abaDosPaineis = 'cardsDoTrabalho';
  var cardsEmEdicao = null;

  var TELA_DA_ABA = {
    cardsDoTrabalho: 'trabalho',
    cartoesDaProdutividade: 'produtividade',
    graficosDaProdutividade: 'produtividade'
  };

  function carregarPaineis() {
    if (!canalDosCards) canalDosCards = canalEscolhido;
    if (abaDosPaineis === 'graficosDaProdutividade') return carregarGraficos();

    aguarde('Lendo os cards…');
    Servidor.chamar('listarCardsDoPainel', TELA_DA_ABA[abaDosPaineis], canalDosCards)
      .entao(function (resposta) {
        dados.painel = resposta;
        cardsEmEdicao = resposta.cartoes.map(copiarCard);
        desenharPaineis();
      })
      .senao(falhou);
  }

  function carregarGraficos() {
    aguarde('Lendo os gráficos…');
    Servidor.chamar('opcoesDosGraficos', canalDosCards)
      .entao(function (opcoes) {
        dados.opcoesDoGrafico = opcoes;
        Servidor.chamar('listarComponentesDoPainel', canalDosCards)
          .entao(function (lista) {
            cardsEmEdicao = lista.map(copiarGrafico);
            desenharGraficos();
          })
          .senao(falhou);
      })
      .senao(falhou);
  }

  function copiarGrafico(grafico) {
    return {
      id: grafico.id || '', titulo: grafico.titulo, tipo: grafico.tipo,
      dimensao: grafico.dimensao, medida: grafico.medida,
      agregacao: grafico.agregacao, limite: grafico.limite,
      largura: grafico.largura, mostrar: grafico.mostrar !== false
    };
  }

  function nomeDaTela(chave, seNaoAchar) {
    var achado = ((resumo && resumo.titulosDasTelas) || [])
      .filter(function (uma) { return uma.tela === chave; })[0];
    return achado && achado.titulo ? achado.titulo : seNaoAchar;
  }

  function escolhaDeTela() {
    var trabalho = nomeDaTela('trabalho', 'Trabalho');
    var produtividade = nomeDaTela('produtividade', 'Produtividade RECC');

    return '<div class="config-abas">'
      + [['cardsDoTrabalho', 'Cards do ' + trabalho],
         ['cartoesDaProdutividade', 'Cartões da ' + produtividade],
         ['graficosDaProdutividade', 'Gráficos da ' + produtividade]]
        .map(function (par) {
          return '<button type="button" class="config-aba'
            + (abaDosPaineis === par[0] ? ' atual' : '') + '"'
            + ' data-tela-do-painel="' + par[0] + '">'
            + escapar(par[1]) + '</button>';
        }).join('') + '</div>';
  }

  function desenharGraficos() {
    if (respostaAtrasada('paineis')) return;

    elemento('config-lista').innerHTML = '<div class="config-cabeca">'
      + '<span class="config-titulo">Gráficos da Produtividade RECC</span></div>'
      + escolhaDeTela()
      + '<p class="config-explica">Cada gráfico responde a <strong>uma</strong> '
      + 'pergunta. Gráfico que não responde pergunta nenhuma é enfeite, e '
      + 'enfeite numa tela de trabalho é ruído. A pizza é boa para "de que '
      + 'tipo são", de relance e com poucas fatias; para comparar valores '
      + 'próximos, barras. Nome comprido pede barra deitada.</p>'
      + '<div class="config-canais-cartao">' + escolhaDeCanal() + '</div>'
      + '<div id="lista-de-graficos">' + desenharCardsDeGrafico() + '</div>'
      + '<div class="config-acoes">'
      + '<button type="button" class="botao vazado" id="add-grafico">'
      + '+ Adicionar gráfico</button>'
      + '<button type="button" class="botao" id="salvar-graficos">'
      + '✓ Salvar gráficos</button>'
      + '<button type="button" class="botao-texto" id="descartar-graficos">'
      + '↺ Descartar alterações</button>'
      + '</div>';

    painelVazio('Os gráficos somam só os casos que a pessoa pode ver. Quem '
      + 'enxerga apenas os próprios casos vê os números dela, no mesmo gráfico.');
    ligarGraficos();
  }

  function desenharCardsDeGrafico() {
    var opcoes = dados.opcoesDoGrafico;
    if (!cardsEmEdicao.length) {
      return '<p class="config-vazio">Nenhum gráfico neste canal. O Painel '
        + 'Analítico abre dizendo isso, em vez de abrir vazio.</p>';
    }

    return cardsEmEdicao.map(function (grafico, posicao) {
      var precisaDeMedida = grafico.agregacao !== 'contagem';
      return '<div class="card-editavel">'
        + '<div class="card-linha">'
        + '<label class="config-campo"><span>Título</span>'
        + '<input type="text" data-card="' + posicao + '" data-parte="titulo"'
        + ' value="' + escapar(grafico.titulo) + '"></label>'
        + caixaSimples(posicao, 'tipo', 'Tipo de gráfico',
          opcoes.tipos.map(function (tipo) {
            return { valor: tipo.chave, rotulo: tipo.rotulo };
          }), grafico.tipo)
        + '</div>'
        + '<div class="card-linha">'
        + caixaSimples(posicao, 'dimensao', 'Agrupar por',
          opcoes.dimensoes.map(function (nome) {
            return { valor: nome, rotulo: nome };
          }), grafico.dimensao)
        + caixaSimples(posicao, 'agregacao', 'O que medir',
          opcoes.agregacoes.map(function (uma) {
            return { valor: uma.chave, rotulo: uma.rotulo };
          }), grafico.agregacao)
        + '</div>'
        + (precisaDeMedida
          ? '<div class="card-linha">'
            + caixaSimples(posicao, 'medida', 'Coluna do valor',
              opcoes.medidas.map(function (nome) {
                return { valor: nome, rotulo: nome };
              }), grafico.medida)
            + '<span></span></div>'
          : '')
        + '<div class="card-linha">'
        + '<label class="config-campo"><span>Mostrar no máximo</span>'
        + '<input type="text" data-card="' + posicao + '" data-parte="limite"'
        + ' value="' + (grafico.limite || '') + '" placeholder="' + opcoes.topoDosGraficos + '">'
        + '<em>No máximo os ' + opcoes.topoDosGraficos + ' maiores. O resto não aparece '
        + '(não há "Demais valores"). A linha do tempo mostra todos os dias.</em></label>'
        + caixaSimples(posicao, 'largura', 'Tamanho na tela',
          [{ valor: '1', rotulo: 'Metade da linha' },
           { valor: '2', rotulo: 'Linha inteira' }], String(grafico.largura))
        + '</div>'
        + '<div class="card-linha rodape">'
        + '<label class="config-chave">'
        + '<input type="checkbox" data-card="' + posicao + '" data-parte="mostrar"'
        + (grafico.mostrar ? ' checked' : '') + '><span>Mostrar</span></label>'
        + '<button type="button" class="botao-texto perigo" data-remover-card="'
        + posicao + '">✕ Remover</button>'
        + '</div></div>';
    }).join('');
  }

  function caixaSimples(posicao, parte, rotulo, opcoes, escolhido) {
    return '<label class="config-campo"><span>' + escapar(rotulo) + '</span>'
      + '<select data-card="' + posicao + '" data-parte="' + parte + '">'
      + opcoes.map(function (opcao) {
        return '<option value="' + escapar(opcao.valor) + '"'
          + (String(opcao.valor) === String(escolhido) ? ' selected' : '') + '>'
          + escapar(opcao.rotulo) + '</option>';
      }).join('') + '</select></label>';
  }

  function ligarGraficos() {
    ligarTrocaDeTelaEDeCanal();

    ligarCliques('[data-remover-card]', function (botao) {
      cardsEmEdicao.splice(Number(botao.getAttribute('data-remover-card')), 1);
      elemento('lista-de-graficos').innerHTML = desenharCardsDeGrafico();
      ligarGraficos();
    });

    var caixas = document.querySelectorAll('#lista-de-graficos [data-parte]');
    for (var i = 0; i < caixas.length; i++) {
      caixas[i].addEventListener('change', function () {
        var grafico = cardsEmEdicao[Number(this.getAttribute('data-card'))];
        var parte = this.getAttribute('data-parte');
        if (parte === 'mostrar') grafico.mostrar = this.checked;
        else if (parte === 'limite') grafico.limite = Number(this.value) || 0;
        else if (parte === 'largura') grafico.largura = Number(this.value);
        else grafico[parte] = this.value;

        if (parte === 'agregacao' || parte === 'tipo') {
          elemento('lista-de-graficos').innerHTML = desenharCardsDeGrafico();
          ligarGraficos();
        }
      });
    }

    elemento('add-grafico').addEventListener('click', function () {
      var opcoes = dados.opcoesDoGrafico;
      cardsEmEdicao.push({
        id: '', titulo: 'Novo gráfico', tipo: 'barras',
        dimensao: opcoes.dimensoes[0] || '', medida: '',
        agregacao: 'contagem', limite: 6, largura: 1, mostrar: true
      });
      elemento('lista-de-graficos').innerHTML = desenharCardsDeGrafico();
      ligarGraficos();
    });

    elemento('descartar-graficos').addEventListener('click', carregarPaineis);

    elemento('salvar-graficos').addEventListener('click', function () {
      Servidor.chamar('salvarComponentesDoPainel', canalDosCards, cardsEmEdicao)
        .entao(function () { avisarSalvo('Gráficos salvos.'); carregarPaineis(); })
        .senao(function (erro) { avisar(erro.message || String(erro), 'ruim'); });
    });
  }

  function ligarTrocaDeTelaEDeCanal() {
    ligarCliques('[data-tela-do-painel]', function (botao) {
      abaDosPaineis = botao.getAttribute('data-tela-do-painel');
      carregarPaineis();
    });
    ligarCliques('[data-canal-dos-cards]', function (botao) {
      canalDosCards = botao.getAttribute('data-canal-dos-cards');
      carregarPaineis();
    });
  }

  function copiarCard(card) {
    return {
      id: card.id || '', titulo: card.titulo, dimensao: card.dimensao,

      filtro: card.filtro, coluna: card.coluna || '', cor: card.cor,
      mostrar: card.mostrar !== false, naoExiste: card.naoExiste || ''
    };
  }

  function desenharPaineis() {
    if (respostaAtrasada('paineis')) return;
    elemento('config-lista').innerHTML = '<div class="config-cabeca">'
      + '<span class="config-titulo">Cards da operação</span></div>'
      + escolhaDeTela()
      + '<p class="config-explica">Escolha os cards do Trabalho. '
      + 'Até ' + dados.painel.maximo + ' cards por operação. Remover ou '
      + 'ocultar um card <strong>mantém os casos</strong> — o card é uma forma '
      + 'de contar, e apagar a conta não apaga o que foi contado. As contagens '
      + 'seguem o acesso de cada pessoa. Alterações só entram em vigor ao '
      + 'salvar.</p>'
      + '<div class="config-canais-cartao">' + escolhaDeCanal() + '</div>'
      + '<div id="lista-de-cards">' + desenharCards() + '</div>'
      + '<div class="config-acoes">'
      + '<button type="button" class="botao vazado" id="add-card">'
      + '+ Adicionar card</button>'
      + '<button type="button" class="botao" id="salvar-cards">'
      + '✓ Salvar cards</button>'
      + '<button type="button" class="botao-texto" id="descartar-cards">'
      + '↺ Descartar alterações</button>'
      + '</div>';

    painelVazio('Os cards contam os casos que a pessoa pode ver. Quem enxerga '
      + 'só os próprios casos vê os números dela, no mesmo card.');
    ligarPaineis();
  }

  function escolhaDeCanal() {
    return pacoteDoSistema.canais.map(function (canal) {
      return '<button type="button" class="canal-cartao'
        + (canal.id === canalDosCards ? ' atual' : '') + '"'
        + ' data-canal-dos-cards="' + escapar(canal.id) + '">'

        + '<span><strong>' + escapar(canal.nome) + '</strong>'
        + '<em>' + escapar(canal.descricao || '') + '</em></span></button>';

  function desenharCards() {
    if (!cardsEmEdicao.length) {
      return '<p class="config-vazio">Nenhum card nesta operação. O Trabalho '
        + 'mostra a fila, e nenhum número em cima dela.</p>';
    }
    return cardsEmEdicao.map(function (card, posicao) {
      return '<div class="card-editavel">'
        + '<div class="card-linha">'
        + '<label class="config-campo"><span>Nome do card</span>'
        + '<input type="text" data-card="' + posicao + '" data-parte="titulo"'
        + ' value="' + escapar(card.titulo) + '"></label>'
        + '<label class="config-campo"><span>O que contar</span>'
        + '<select data-card="' + posicao + '" data-parte="contar">'
        + opcoesDoQueContar(card) + '</select></label>'
        + '</div>'
        + (card.naoExiste
          ? '<p class="config-dica aviso-de-carimbo">' + escapar(card.naoExiste) + '</p>' : '')
        + '<div class="card-linha">'
        + '<label class="config-campo"><span>Cor</span>'
        + '<div class="tira-de-tons">'
        + dados.painel.tons.map(function (tom) {
          return '<button type="button" class="tom-escolha tom-' + escapar(tom) + '"'
            + (tom === card.cor ? ' aria-pressed="true"' : ' aria-pressed="false"')
            + ' data-card="' + posicao + '" data-parte="cor" data-tom="'
            + escapar(tom) + '" title="' + escapar(tom) + '"></button>';
        }).join('') + '</div></label>'
        + '<label class="config-campo"><span>Ordem</span>'
        + '<input type="text" value="' + (posicao + 1) + '" readonly></label>'
        + '</div>'
        + '<div class="card-linha rodape">'
        + '<label class="config-chave">'
        + '<input type="checkbox" data-card="' + posicao + '" data-parte="mostrar"'
        + (card.mostrar ? ' checked' : '') + '><span>Mostrar</span></label>'
        + '<button type="button" class="botao-texto perigo" data-remover-card="'
        + posicao + '">✕ Remover</button>'
        + '</div></div>';
    }).join('');
  }

  function opcoesDoQueContar(card) {
    var achou = false;
    var grupoAberto = null;
    var html = '';
    dados.painel.oQueContar.forEach(function (opcao, i) {
      var escolhido = !achou && opcao.chave === card.dimensao
        && normalizarTexto(opcao.filtro) === normalizarTexto(card.filtro)
        && normalizarTexto(opcao.coluna) === normalizarTexto(
          card.dimensao === 'valor' ? card.coluna : '');
      if (escolhido) achou = true;
      var grupo = opcao.grupo || '';
      if (grupo !== grupoAberto) {
        if (grupoAberto) html += '</optgroup>';
        if (grupo) html += '<optgroup label="' + escapar(grupo) + '">';
        grupoAberto = grupo;
      }
      html += '<option value="' + i + '"' + (escolhido ? ' selected' : '') + '>'
        + escapar(opcao.rotulo) + '</option>';
    });
    if (grupoAberto) html += '</optgroup>';
    if (!achou) {
      html = '<option value="" selected>Não está mais disponível: '
        + escapar(card.filtro || card.titulo) + '</option>' + html;
    }
    return html;
  }

  function normalizarTexto(valor) {
    return String(valor === null || valor === undefined ? '' : valor)
      .normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase().trim();
  }

  function ligarPaineis() {
    ligarTrocaDeTelaEDeCanal();
    ligarListaDeCards();
    ligarBotoesDosCards();
  }

  function ligarListaDeCards() {
    ligarCliques('[data-remover-card]', function (botao) {
      cardsEmEdicao.splice(Number(botao.getAttribute('data-remover-card')), 1);
      redesenharCards();
    });

    ligarCliques('[data-parte="cor"]', function (botao) {
      cardsEmEdicao[Number(botao.getAttribute('data-card'))].cor =
        botao.getAttribute('data-tom');
      redesenharCards();
    });

    var caixas = document.querySelectorAll(
      '[data-parte="titulo"], [data-parte="contar"], [data-parte="mostrar"]');
    for (var i = 0; i < caixas.length; i++) {
      caixas[i].addEventListener('change', function () {
        var card = cardsEmEdicao[Number(this.getAttribute('data-card'))];
        var parte = this.getAttribute('data-parte');
        if (parte === 'titulo') card.titulo = this.value;
        if (parte === 'mostrar') card.mostrar = this.checked;
        if (parte === 'contar' && this.value !== '') {
          var opcao = dados.painel.oQueContar[Number(this.value)];
          card.dimensao = opcao.chave;
          card.filtro = opcao.filtro;
          card.coluna = opcao.coluna || '';
          card.naoExiste = '';
        }
      });
    }
  }

  function ligarBotoesDosCards() {
    elemento('add-card').addEventListener('click', function () {
      if (cardsEmEdicao.length >= dados.painel.maximo) {
        return avisar('São no máximo ' + dados.painel.maximo + ' cards por '
          + 'operação. Acima disso a tela vira uma parede de números.', 'ruim');
      }
      var primeira = dados.painel.oQueContar[0];
      cardsEmEdicao.push({ id: '', titulo: 'Novo card',
        dimensao: primeira.chave, filtro: primeira.filtro, coluna: primeira.coluna || '',
        cor: 'neutro', mostrar: true });
      redesenharCards();
    });

    elemento('descartar-cards').addEventListener('click', carregarPaineis);

    elemento('salvar-cards').addEventListener('click', function () {
      Servidor.chamar('salvarCardsDoPainel', TELA_DA_ABA[abaDosPaineis], canalDosCards,
        cardsEmEdicao)
        .entao(function () { avisarSalvo('Cards salvos.'); carregarPaineis(); })
        .senao(function (erro) { avisar(erro.message || String(erro), 'ruim'); });
    });
  }

  function redesenharCards() {
    elemento('lista-de-cards').innerHTML = desenharCards();
    ligarListaDeCards();
  }

  function carregarAnalises() {
    aguarde('Lendo as análises…');
    Servidor.chamar('opcoesDeAnalise')
      .entao(function (opcoes) {
        dados.opcoes = opcoes;
        Servidor.chamar('listarAnalises')
          .entao(function (lista) {
            dados.analises = lista;
            desenharAnalises();
          })
          .senao(falhou);
      })
      .senao(falhou);
