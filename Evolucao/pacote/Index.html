    var largura = dicaNaTela.offsetWidth || 160;
    var x = Math.min(Math.max(evento.clientX, largura / 2 + 8),
      window.innerWidth - largura / 2 - 8);
    dicaNaTela.style.left = x + 'px';
    dicaNaTela.style.top = (evento.clientY - 14) + 'px';
  }

  function tirarDica() {
    var dicaNaTela = document.querySelector('.dica-do-grafico');
    if (dicaNaTela) dicaNaTela.parentNode.removeChild(dicaNaTela);
  }

  return {
    desenhar: desenhar,
    tabela: tabela,
    numero: numero,
    ligarDica: ligarDica,
    tirarDica: tirarDica
  };
})();
</script>

<script>

var SeletorDePeriodo = (function () {

  function escapar(texto) { return Moldura.escapar(texto); }

  function padrao() {
    return { tipo: 'intervalo', dias: 0, de: '', ate: '', mes: '' };
  }

  function desenhar(resposta) {
    var periodo = resposta.periodo || {};

    var tipo = periodo.tipo === 'mes' ? 'mes' : 'intervalo';

    var comoEscolher = [['intervalo', 'Por data'], ['mes', 'Por mês']].map(function (par) {
      return '<option value="' + par[0] + '"'
        + (tipo === par[0] ? ' selected' : '') + '>' + par[1] + '</option>';
    }).join('');

    return '<select class="filtro" data-periodo="como"'
      + ' aria-label="Como escolher o período">' + comoEscolher + '</select>'
      + (tipo === 'mes' ? porMes(resposta) : deAte(periodo));
  }

  function deAte(periodo) {
    var comum = ' class="filtro" max="' + hojeNoCalendario() + '"';
    return '<input type="date"' + comum + ' data-periodo="de"'
      + ' aria-label="Data inicial" value="' + escapar(paraOCampo(periodo.de)) + '">'
      + '<span class="ate-do-periodo">até</span>'
      + '<input type="date"' + comum + ' data-periodo="ate"'
      + ' aria-label="Data final" value="' + escapar(paraOCampo(periodo.ate)) + '">';
  }

  function hojeNoCalendario() {
    var agora = new Date();
    var dois = function (n) { return (n < 10 ? '0' : '') + n; };
    return agora.getFullYear() + '-' + dois(agora.getMonth() + 1) + '-' + dois(agora.getDate());
  }

  function porMes(resposta) {
    var escolhido = (resposta.periodo || {}).mes;
    var opcoes = (resposta.mesesDisponiveis || []).map(function (mes) {
      return '<option value="' + escapar(mes.valor) + '"'
        + (escolhido === mes.valor ? ' selected' : '') + '>'
        + escapar(mes.rotulo) + '</option>';
    }).join('');

    return '<select class="filtro" data-periodo="mes" aria-label="Mês">'
      + opcoes + '</select>';
  }

  function mudou(caixa, resposta, ondeProcurar) {
    var qual = caixa.getAttribute('data-periodo');
    if (!qual) return null;

    if (qual === 'como') {
      var novo = { tipo: caixa.value, dias: 0, de: '', ate: '', mes: '' };
      if (novo.tipo === 'mes') {
        var meses = resposta.mesesDisponiveis || [];
        if (meses.length) novo.mes = meses[0].valor;
      }

      return novo;
    }

    if (qual === 'mes') {
      return { tipo: 'mes', dias: 0, de: '', ate: '', mes: caixa.value };
    }

    var raiz = document.getElementById(ondeProcurar) || document;
    var de = raiz.querySelector('[data-periodo="de"]');
    var ate = raiz.querySelector('[data-periodo="ate"]');
    var intervalo = {
      tipo: 'intervalo', dias: 0, mes: '',
      de: paraOServidor(de ? de.value : ''),
      ate: paraOServidor(ate ? ate.value : '')
    };
    return (intervalo.de && intervalo.ate) ? intervalo : false;
  }

  function paraOCampo(texto) {
    var partes = /^(\d{2})\/(\d{2})\/(\d{4})$/.exec(String(texto || '').trim());
    return partes ? partes[3] + '-' + partes[2] + '-' + partes[1] : '';
  }

  function paraOServidor(texto) {
    var partes = /^(\d{4})-(\d{2})-(\d{2})$/.exec(String(texto || '').trim());
    return partes ? partes[3] + '/' + partes[2] + '/' + partes[1] : '';
  }

  return {
    padrao: padrao, desenhar: desenhar, mudou: mudou,
    paraOCampo: paraOCampo, paraOServidor: paraOServidor
  };
})();
</script>



<!-- ==== Trabalho.html ==== -->
<script>

var TelaTrabalho = (function () {

  var canalEscolhido = '';
  var filtrosEscolhidos = {};

  var periodo = SeletorDePeriodo.padrao();

  var quantosNaFila = 0;
  var focarNoMostrar = '';
  var resumo = null;

  var jaAvisouNoCanal = {};
  var avisarQuandoChegar = false;

  function escapar(texto) { return Moldura.escapar(texto); }
  function elemento(id) { return document.getElementById(id); }

  function montar(pacote) {
    if (!canalEscolhido && pacote.canais.length) canalEscolhido = pacote.canais[0].id;
    return SeletorDeCanal.montar(pacote.canais, canalEscolhido)
      + '<div id="painel"><p class="carregando-campos">Somando os casos…</p></div>';
  }

  function variacao(cartao) {
    if (cartao.variacao === null || cartao.variacao === undefined) {

      return '<span class="variacao vazia" aria-hidden="true">—</span>';
    }
    var subiu = cartao.variacao >= 0;
    return '<span class="variacao ' + (subiu ? 'subiu' : 'desceu') + '">'
      + (subiu ? '▲' : '▼') + ' ' + Math.abs(cartao.variacao) + '%'
      + '<em>vs. período anterior</em></span>';
  }

  function desenharCartoes() {
    return '<div class="cartoes">'
      + resumo.cartoes.map(function (cartao) {
        var filtravel = cartao.filtravel === true && cartao.id !== undefined;
        var ligado = filtravel && cartao.dimensao !== 'total'
          && String(filtrosEscolhidos.cartao || '') === String(cartao.id);

        return '<' + (filtravel ? 'button type="button"' : 'div')
          + ' class="indicador tom-' + escapar(cartao.tom || 'neutro')
          + (filtravel ? ' clicavel' : '') + (ligado ? ' ligado' : '') + '"'
          + (filtravel ? ' data-cartao-da-fila="' + escapar(cartao.id) + '"'
            + ' data-cartao-total="' + (cartao.dimensao === 'total' ? 'sim' : 'nao') + '"' : '')
          + (cartao.explicacao ? ' title="' + escapar(cartao.explicacao) + '"'
            : (filtravel ? ' title="Filtrar a fila por ' + escapar(cartao.rotulo) + '"' : ''))
          + '><span class="rotulo">' + escapar(cartao.rotulo) + '</span>'
          + '<strong class="numero">' + cartao.valor + '</strong>'
          + variacao(cartao)
          + '</' + (filtravel ? 'button' : 'div') + '>';
      }).join('')
      + '</div>';
  }

  function desenharFiltros() {
    var caixas = resumo.filtrosDisponiveis.map(function (filtro) {

      var opcoes = ['<option value="">' + escapar(filtro.rotulo) + '</option>'];
      filtro.opcoes.forEach(function (opcao) {
        var marcado = filtrosEscolhidos[filtro.chave] === opcao.valor
          ? ' selected' : '';
        opcoes.push('<option value="' + escapar(opcao.valor) + '"' + marcado + '>'
          + escapar(opcao.rotulo) + '</option>');
      });
      return '<select class="filtro" data-filtro="' + escapar(filtro.chave) + '"'
        + ' aria-label="Filtrar por ' + escapar(filtro.rotulo) + '">'
        + opcoes.join('') + '</select>';
    });

    var busca = '<input type="search" class="filtro busca-na-fila" data-filtro="busca"'
      + ' id="busca-na-fila" autocomplete="off"'
      + ' placeholder="Buscar neste canal e apertar Enter"'
      + ' aria-label="Buscar neste canal"'
      + ' value="' + escapar(filtrosEscolhidos.busca || '') + '">';

    return Moldura.caixaDeFiltros(
      busca
        + SeletorDePeriodo.desenhar(resumo)
        + caixas.join('')
        + Moldura.botaoLimparFiltros('limpar-filtros'),
      resumo.total + ' de ' + resumo.totalNoPeriodo
        + ' casos · ' + escapar(resumo.periodo.rotulo));
  }

  function expandirFila(compacta, colunas) {
    return (compacta || []).map(function (caso) {
      return {
        id: caso.id,
        celulas: (caso.v || []).map(function (grupo, g) {
          var doGrupo = (colunas[g] && colunas[g].colunas) || [];
          return grupo.map(function (bruto, c) {
            var coluna = doGrupo[c] || {};
            var comAlerta = Object.prototype.toString.call(bruto) === '[object Array]';
            return {
              cabecalho: coluna.cabecalho || '',
              valor: comAlerta ? bruto[0] : bruto,
              ehStatus: coluna.ehStatus === true,
              alerta: comAlerta ? bruto[1] : '',
              tomDoAlerta: comAlerta ? bruto[2] : ''
            };
          });
        }),
        situacao: caso.situacao,
        tom: caso.tom,
        sla: caso.sla,
        sinais: caso.sinais
      };
    });
  }

  function limiteDaFila() {
    var veio = resumo.fila.length;
    if (quantosNaFila === 'todos') return veio;
    return Math.min(quantosNaFila || resumo.mostrarNaFila.padrao, veio);
  }

  function totalDaFila() {
    return typeof resumo.total === 'number' ? resumo.total : resumo.fila.length;
  }

  function opcoesDeMostrar(total, opcoes) {
    var cabem = opcoes.filter(function (quantos) { return quantos < total; });
    return cabem.length ? cabem.concat('todos') : [];
  }

  function barraDeMostrar(visiveis) {
    var total = totalDaFila();
    var opcoes = opcoesDeMostrar(total, resumo.mostrarNaFila.opcoes);
    if (!opcoes.length) return '';

    var botoes = opcoes.map(function (quantos) {
      var ligado = quantos === 'todos' ? visiveis === total : quantos === visiveis;
      return '<button type="button" class="mostrar-quantos" data-mostrar="' + quantos + '"'
        + ' aria-pressed="' + ligado + '">'
        + (quantos === 'todos' ? 'Todos (' + total + ')' : quantos) + '</button>';
    }).join('');

    return '<div class="fila-mostrar">'
      + '<span class="fila-mostrando">' + (visiveis < total
        ? 'Mostrando os ' + visiveis + ' casos mais recentes de ' + total
        : 'Mostrando todos os ' + total + ' casos') + '</span>'
      + '<div class="mostrar-grupo" role="group" aria-label="Quantos casos mostrar na fila">'
      + '<span>Mostrar</span>' + botoes + '</div></div>';
  }

  function desenharFila() {
    if (!resumo.fila.length) {
      return '<div class="cartao vazio">'
        + '<strong>Nenhum caso para mostrar aqui.</strong>'
        + '<p>' + (resumo.totalNoPeriodo
          ? 'Há ' + resumo.totalNoPeriodo + ' casos no período, mas nenhum passa '
            + (filtrosEscolhidos.busca ? 'pela busca e pelos filtros escolhidos.'
              : 'pelos filtros escolhidos.')

          : 'Nada foi registrado no período escolhido — '
            + escapar(resumo.periodo.rotulo) + '. '
            + 'Para casos antigos, use Buscar Caso.') + '</p></div>';
    }

    var cabecalho = resumo.colunas.map(function (grupo) {
      return '<th>' + escapar(grupo.titulo) + '</th>';
    }).join('') + '<th class="acoes-coluna">Ações</th>';

    var visiveis = limiteDaFila();
    var linhas = resumo.fila.slice(0, visiveis).map(function (caso) {
      var celulas = caso.celulas.map(function (grupo, i) {

        return '<td>' + desenharGrupo(grupo, caso, i === 0)
          + (i === 0 ? seloDoSla(caso.sla) + selosDePrazo(caso.sinais) : '') + '</td>';
      }).join('');

      return '<tr>' + celulas + '<td class="acoes-coluna">'
        + acoesDaLinha(caso) + '</td></tr>';
    }).join('');

    return '<div class="cartao sem-forro">'
      + barraDeMostrar(visiveis)
      + '<div class="rolagem-tabela"><table class="fila agrupada">'
      + '<thead><tr>' + cabecalho + '</tr></thead>'
      + '<tbody>' + linhas + '</tbody></table></div></div>';
  }

  function desenharGrupo(grupo, caso, ehOPrimeiro) {
    return grupo.map(function (celula, i) {
      if (celula.ehStatus) {
        return '<span class="situacao tom-' + escapar(caso.tom || 'neutro') + '">'
          + escapar(celula.valor || '—') + '</span>';
      }
      var classe = (i === 0 && !ehOPrimeiro) ? 'principal' : 'apoio';

      if (celula.alerta) {
        classe += { atencao: ' em-atencao', bom: ' em-bom' }[celula.tomDoAlerta]
          || ' em-alerta';
      }

      return '<span class="' + classe + '" title="'
        + escapar(Moldura.dicaDaCelula(celula))
        + '">' + escapar(celula.valor || '—') + '</span>';
    }).join('');
  }

  function acoesDaLinha(caso) {
    var botoes = '';

    if (resumo.podeEditar) {
      botoes += '<button type="button" class="acao" data-trabalhar="'
        + escapar(caso.id) + '">' + Moldura.icone('editar')
        + ' Trabalhar no caso</button>'
        + '<button type="button" class="acao-icone" data-status-do-caso="'
        + escapar(caso.id) + '" title="Alterar status" aria-label="Alterar status">'
        + Moldura.icone('trocarSituacao') + '</button>';
    }

    botoes += '<button type="button" class="acao-icone perigo" data-excluir="'
      + escapar(caso.id) + '" title="Excluir caso" aria-label="Excluir caso">'
      + Moldura.icone('ocultar') + '</button>';

    return botoes;
  }

  var focarABusca = false;

  var ATE_ONDE_O_SLA_CONTOU = {
    resposta: 'contado até a primeira resposta',
    encerramento: 'contado até o encerramento: o caso foi encerrado sem a primeira resposta',
    agora: 'ainda correndo: o caso não teve a primeira resposta'
  };

  function seloDoSla(sla) {
    if (!sla) return '';
    return '<span class="selo-sla tom-' + escapar(sla.tom) + '"'
      + ' title="' + escapar(sla.texto) + ' — SLA de '
      + escapar(String(sla.prazo / 60).replace('.', ','))
      + ' horas úteis, de segunda a sexta, no expediente, '
      + escapar(ATE_ONDE_O_SLA_CONTOU[sla.parouEm] || '') + '">'
      + escapar(sla.texto) + '</span>';
  }

  var LEITURA_DO_TOM_DO_PRAZO = {
    bom: 'dentro do prazo', atencao: 'atenção: perto de vencer', ruim: 'fora do prazo'
  };

  function selosDePrazo(sinais) {
    return (sinais || []).map(function (sinal) {
      return '<span class="selo-prazo tom-' + escapar(sinal.tom) + '"'
        + ' title="' + escapar(sinal.texto) + ' — ' + escapar(sinal.regra)
        + ', de segunda a sexta, no expediente. '
        + (sinal.encerrado ? 'Contado até o caso chegar a um status final.'
          : sinal.naoComecou ? 'Ainda não começou: conta da primeira mudança de status.'
            : 'Ainda correndo: o caso não chegou a um status final.') + '">'
        + escapar(sinal.texto)
        + '<span class="so-leitor"> (' + escapar(LEITURA_DO_TOM_DO_PRAZO[sinal.tom] || '')
        + ')</span></span>';
    }).join('');
  }

  function casosPertoDeVencer(fila) {
    var achados = [];
    (fila || []).forEach(function (caso) {
      (caso.sinais || []).forEach(function (sinal) {
        if (sinal.tom === 'atencao' && !sinal.encerrado) {
          achados.push({ caso: caso, sinal: sinal });
        }
      });
    });
    return achados;
  }

  function rotuloDoCaso(caso) {
    var grupo = caso.celulas.length > 1 ? caso.celulas[1] : caso.celulas[0];
    var valor = grupo && grupo[0] ? String(grupo[0].valor || '').trim() : '';
    return valor || String(caso.id);
  }

  function avisarDosQueVencem() {

    var achados = casosPertoDeVencer(resumo && (resumo.pertoDeVencer || resumo.fila));
    if (!achados.length || document.getElementById('dialogo-prazo')) return;

    var nomeDoCanal = resumo.canal && resumo.canal.nome ? resumo.canal.nome : '';
    var caixa = document.createElement('div');
    caixa.className = 'dialogo';
    caixa.id = 'dialogo-prazo';

    var quantos = Math.max(Number(resumo.quantosPertoDeVencer) || 0, achados.length);
    var sobram = quantos - achados.length;
    caixa.innerHTML = '<div class="dialogo-caixa aviso-de-prazo" role="alertdialog"'
      + ' aria-modal="true" aria-labelledby="titulo-prazo" aria-describedby="texto-prazo">'
      + '<h3 id="titulo-prazo">' + quantos
      + (quantos === 1 ? ' caso perto de vencer' : ' casos perto de vencer')
      + (nomeDoCanal ? ' · ' + escapar(nomeDoCanal) : '') + '</h3>'
      + '<p id="texto-prazo">Estão no amarelo do prazo. Trabalhe antes que fiquem vermelhos.</p>'
      + '<ul class="lista-de-prazo">'
      + achados.map(function (um) {
        var rotulo = rotuloDoCaso(um.caso);

        var detalhes = (rotulo !== String(um.caso.id) ? [String(um.caso.id)] : [])
          .concat(um.caso.situacao ? [um.caso.situacao] : []);
        return '<li><span class="caso-do-prazo"><strong>' + escapar(rotulo)
          + '</strong><small>' + escapar(detalhes.join(' · ') || ' ') + '</small></span>'
          + '<span class="selo-prazo tom-atencao">' + escapar(um.sinal.texto) + '</span>'
          + '<button type="button" class="botao-secundario pequeno" data-trabalhar-do-aviso="'
          + escapar(um.caso.id) + '">Trabalhar no caso</button></li>';
      }).join('')
      + '</ul>'
      + (sobram > 0 ? '<p class="config-explica">E mais ' + sobram + (sobram === 1
        ? ' caso' : ' casos') + ' no amarelo. Estes são os mais recentes; a fila mostra '
        + 'o selo de prazo em cada um.</p>' : '')
      + '<div class="config-acoes"><button type="button" class="botao" id="fechar-aviso-de-prazo">'
      + 'Entendi</button></div></div>';
    document.body.appendChild(caixa);

    function sair() {
      if (caixa.parentNode) caixa.parentNode.removeChild(caixa);
      document.removeEventListener('keydown', aoTeclar);
    }
    function aoTeclar(evento) {
      if (evento.key === 'Escape') { evento.preventDefault(); sair(); }
    }
    document.addEventListener('keydown', aoTeclar);
    document.getElementById('fechar-aviso-de-prazo').addEventListener('click', sair);
    caixa.addEventListener('mousedown', function (evento) {
      if (evento.target === caixa) sair();
    });
    var botoes = caixa.querySelectorAll('[data-trabalhar-do-aviso]');
    for (var i = 0; i < botoes.length; i++) {
      botoes[i].addEventListener('click', function () {
        var idDoCaso = this.getAttribute('data-trabalhar-do-aviso');
        sair();
        CasoEmModal.abrir(canalEscolhido, idDoCaso, carregar);
      });
    }
    document.getElementById('fechar-aviso-de-prazo').focus();
  }

  function desenharPainel() {

    elemento('painel').innerHTML =
      Moldura.avisoDeJanela(resumo, 'Estes números e esta fila')
      + desenharCartoes() + desenharFiltros() + desenharFila();
    ligarPainel();
    var busca = elemento('busca-na-fila');
    if (focarABusca && busca) {
      busca.focus();
      busca.setSelectionRange(busca.value.length, busca.value.length);
    }
    focarABusca = false;

    var mostrar = focarNoMostrar
      && document.querySelector('[data-mostrar="' + focarNoMostrar + '"]');
    if (mostrar) mostrar.focus();
    focarNoMostrar = '';
  }

  function carregar(recado) {
    var painel = elemento('painel');
    if (painel) painel.innerHTML = '<p class="carregando-campos">'
      + escapar(typeof recado === 'string' ? recado : 'Somando os casos…') + '</p>';

    Servidor.chamar('resumoDoCanal', canalEscolhido, filtrosEscolhidos, periodo,
      quantosNaFila === 'todos' ? 'todos' : '')
      .entao(function (resposta) {
        resumo = resposta;
        if (resposta.filaCompacta) {
          resumo.fila = expandirFila(resposta.fila, resposta.colunas);
          resumo.pertoDeVencer = expandirFila(resposta.pertoDeVencer, resposta.colunas);
        }
        desenharPainel();
        if (avisarQuandoChegar) {
          avisarQuandoChegar = false;
          jaAvisouNoCanal[canalEscolhido] = true;
          avisarDosQueVencem();
        }
      })
      .senao(function (erro) {
        elemento('painel').innerHTML = '<p class="carregando-campos erro-carga">'
          + escapar(erro.message || String(erro)) + '</p>';
      });
  }

  function ligarPainel() {
    var caixas = document.querySelectorAll('.filtro');
    for (var i = 0; i < caixas.length; i++) {
      caixas[i].addEventListener('change', function () {
        var novoPeriodo = SeletorDePeriodo.mudou(this, resumo, 'painel');
        if (novoPeriodo !== null) {

          if (novoPeriodo) { periodo = novoPeriodo; carregar(); }
          return;
        }
        if (this.getAttribute('data-filtro') === 'busca') { buscar(this); return; }
        filtrosEscolhidos[this.getAttribute('data-filtro')] = this.value.trim();
        carregar();
      });
    }

    var campoDaBusca = elemento('busca-na-fila');
    if (campoDaBusca) {
      campoDaBusca.addEventListener('search', function () { buscar(this); });
    }

    var limpar = elemento('limpar-filtros');
    if (limpar) {
      limpar.addEventListener('click', function () {
        filtrosEscolhidos = {};
        periodo = SeletorDePeriodo.padrao();
        carregar();
      });
    }

    var cartoes = document.querySelectorAll('.indicador.clicavel');
    for (var c = 0; c < cartoes.length; c++) {
      cartoes[c].addEventListener('click', function () {
        var id = this.getAttribute('data-cartao-da-fila');

        filtrosEscolhidos.cartao = (this.getAttribute('data-cartao-total') === 'sim'
          || String(filtrosEscolhidos.cartao || '') === id) ? '' : id;
        carregar();
      });
    }

    ligarCliques('[data-mostrar]', function (botao) {
      var escolha = botao.getAttribute('data-mostrar');
      quantosNaFila = escolha === 'todos' ? 'todos' : Number(escolha);
      focarNoMostrar = escolha;
      if (escolha === 'todos' && resumo.fila.length < totalDaFila()) {
        carregar('Trazendo os ' + totalDaFila() + ' casos…');
        return;
      }
      desenharPainel();
    });

    ligarCliques('[data-trabalhar]', function (botao) {
      CasoEmModal.abrir(canalEscolhido, botao.getAttribute('data-trabalhar'), carregar);
    });
    ligarCliques('[data-status-do-caso]', function (botao) {
      CasoEmModal.trocarSituacao(canalEscolhido,
        botao.getAttribute('data-status-do-caso'), carregar);
    });
    ligarCliques('[data-excluir]', function (botao) {
      var idDoCaso = botao.getAttribute('data-excluir');
      Formulario.confirmarExclusao(idDoCaso, function () {
        Servidor.chamar('excluirCaso', canalEscolhido, idDoCaso)
          .entao(carregar)
          .senao(function (erro) { window.alert(erro.message || String(erro)); });
      });
    });
  }

  function buscar(campo) {
    var termo = campo.value.trim();
    if (termo === (filtrosEscolhidos.busca || '')) return;
    filtrosEscolhidos.busca = termo;

    focarABusca = true;
    carregar();
  }

  function ligarCliques(seletor, oQueFazer) {
    var botoes = document.querySelectorAll(seletor);
    for (var i = 0; i < botoes.length; i++) {
      botoes[i].addEventListener('click', function () { oQueFazer(this); });
    }
  }

  function ligar() {
    SeletorDeCanal.ligar(function (idDoCanal) {
      canalEscolhido = idDoCanal;
      filtrosEscolhidos = {};
      Aplicacao.remontar();
    });

    avisarQuandoChegar = !jaAvisouNoCanal[canalEscolhido];
    carregar();
  }

  return { montar: montar, ligar: ligar, opcoesDeMostrar: opcoesDeMostrar,
    casosPertoDeVencer: casosPertoDeVencer, rotuloDoCaso: rotuloDoCaso,
    expandirFila: expandirFila };
})();
</script>


<!-- ==== CadastrarCaso.html ==== -->
<script>

var TelaCadastrarCaso = (function () {

  var canalEscolhido = '';
  var salvando = false;

  var envio = '';

  function escapar(texto) { return Moldura.escapar(texto); }
  function elemento(id) { return document.getElementById(id); }
  function corpo() { return elemento('corpo-do-formulario'); }

  function montar(pacote) {
    if (!canalEscolhido && pacote.canais.length) canalEscolhido = pacote.canais[0].id;

    return SeletorDeCanal.montar(pacote.canais, canalEscolhido)
      + '<form class="cartao formulario" id="formulario-do-caso" novalidate>'
      + '<div id="corpo-do-formulario"><p class="carregando-campos">'
      + 'Montando o formulário…</p></div>'

      + '<div class="acoes" id="acoes-do-caso" hidden>'
      + '<button type="submit" class="botao" id="salvar-caso">Cadastrar caso</button>'
      + '<button type="button" class="botao-secundario" id="limpar-caso">Limpar</button>'
      + '<span class="atalho">ou <kbd>Ctrl</kbd> + <kbd>Enter</kbd></span>'
      + '<span class="recado" id="recado-do-caso" hidden></span>'
      + '</div></form>';
  }

  function carregarFormulario() {
    corpo().innerHTML = '<p class="carregando-campos">Montando o formulário…</p>';
    mostrarAsAcoes(false);

    Servidor.chamar('formularioDoCanal', canalEscolhido)
      .entao(function (resposta) {
        corpo().innerHTML = Formulario.desenhar(resposta, '');
        Formulario.ligar(corpo(), '', canalEscolhido);

        Formulario.aplicarPadroes(corpo(), resposta);

        Formulario.vigiarObrigatorios(corpo(), elemento('salvar-caso'));

        mostrarAsAcoes(true);
        var primeiro = corpo().querySelector(
          'input:not([disabled]), select:not([disabled])');
        if (primeiro) primeiro.focus();
      })
      .senao(function (erro) {
        corpo().innerHTML = '<p class="carregando-campos erro-carga">'
          + escapar(erro.message || String(erro)) + '</p>';
      });
  }

  function mostrarAsAcoes(mostrar) {
    var acoes = elemento('acoes-do-caso');
    if (acoes) acoes.hidden = !mostrar;
  }

  function recado(texto, tipo) {
    var caixa = elemento('recado-do-caso');
    caixa.className = 'recado ' + (tipo || '');
    caixa.textContent = texto;
    caixa.hidden = !texto;
  }

  function salvar() {
    if (salvando) return;

    if (elemento('acoes-do-caso').hidden) return;

    var falta = Formulario.faltaPreencher(corpo());
    if (falta) {
      recado('Preencha os campos obrigatórios (marcados com *).', 'ruim');
      falta.focus();
      return;
    }

    salvando = true;
    Formulario.limparErros(corpo());
    recado('Gravando…', '');

    Formulario.comecouAGravar(elemento('salvar-caso'),
      elemento('formulario-do-caso'));

    if (!envio) envio = Servidor.novoEnvio();
    Servidor.chamar('cadastrarCaso', canalEscolhido, Formulario.valores(corpo()), envio)
      .entao(function () {
        salvando = false;
        envio = '';

        Aplicacao.irPara('trabalho');
      })
      .senao(function (erro) {
        salvando = false;
        Formulario.acabouDeGravar(elemento('salvar-caso'),
          elemento('formulario-do-caso'));
        recado(erro.message || String(erro), 'ruim');
        if (erro.problemas) Formulario.mostrarProblemas(corpo(), erro.problemas);
      });
  }

  function ligar() {
    SeletorDeCanal.ligar(function (idDoCanal) {
      canalEscolhido = idDoCanal;
      Aplicacao.remontar();
    });

    elemento('formulario-do-caso').addEventListener('submit', function (evento) {
      evento.preventDefault();
      salvar();
    });
    elemento('limpar-caso').addEventListener('click', function () {
      recado('', '');
      envio = '';
      carregarFormulario();
    });
    document.addEventListener('keydown', atalhoDeSalvar);

    carregarFormulario();
  }

  function atalhoDeSalvar(evento) {
    if ((evento.ctrlKey || evento.metaKey) && evento.key === 'Enter') {

      if (document.querySelector('.dialogo')) return;
      if (elemento('formulario-do-caso')) {
        evento.preventDefault();
        salvar();
      }
    }
  }

  function desligar() {
    document.removeEventListener('keydown', atalhoDeSalvar);
  }

  return { montar: montar, ligar: ligar, desligar: desligar };
})();
</script>


<!-- ==== BuscarCaso.html ==== -->
<script>

var TelaBuscarCaso = (function () {

  var opcoes = null;
  var canaisEscolhidas = {};
  var incluirLegado = false;
  var procurando = false;
  var ultimoTermo = '';
  var podeEditar = false;

  var termoPedido = '';

  function escapar(texto) { return Moldura.escapar(texto); }
  function elemento(id) { return document.getElementById(id); }

  function montar() {
    return '<div class="cartao busca-caixa">'
      + '<form id="form-da-busca" novalidate>'
      + '<div class="busca-linha">'
      + '<input type="search" id="termo-da-busca" autocomplete="off"'
      + ' placeholder="Protocolo, apólice, proposta, CPF ou nome"'
      + ' aria-label="O que procurar">'
      + '<button type="submit" class="botao" id="botao-buscar">'
      + Moldura.icone('buscarCaso') + ' Buscar</button>'
      + Moldura.botaoLimparFiltros('limpar-filtros-da-busca')
      + '</div>'
      + '<div id="onde-procurar" class="busca-onde"></div>'
      + '</form></div>'
      + '<div id="resultado-da-busca"></div>';
  }

  function desenharOnde() {
    var caixas = opcoes.canais.map(function (canal) {
      return '<label class="config-chave">'
        + '<input type="checkbox" data-canal-da-busca="' + escapar(canal.id) + '"'
        + (canaisEscolhidas[canal.id] ? ' checked' : '') + '>'
        + '<span>' + escapar(canal.nome)
        + '<em>procura em: ' + escapar(canal.procuraEm.join(', ') || 'nada declarado')
        + '</em></span></label>';
    });

    if (opcoes.legado.ligado) {
      caixas.push('<label class="config-chave">'
        + '<input type="checkbox" id="incluir-legado"'
        + (incluirLegado ? ' checked' : '') + '>'
        + '<span>' + escapar(opcoes.legado.rotulo)
        + '<em>a planilha do sistema anterior, em leitura</em></span></label>');
    }

    elemento('onde-procurar').innerHTML = '<span class="busca-rotulo">'
      + 'Onde procurar</span>' + caixas.join('')
      + (opcoes.legado.ligado ? ''
        : '<span class="busca-dica">Não há base legada apontada. '
          + 'Um administrador aponta em Configurações › Estrutura.</span>');

    ligarOnde();
  }

  function ligarOnde() {
    var caixas = document.querySelectorAll('[data-canal-da-busca]');
    for (var i = 0; i < caixas.length; i++) {
      caixas[i].addEventListener('change', function () {
        canaisEscolhidas[this.getAttribute('data-canal-da-busca')] = this.checked;
      });
    }
    var legado = elemento('incluir-legado');
    if (legado) {
      legado.addEventListener('change', function () { incluirLegado = this.checked; });
    }
  }

  function procurar() {
    if (procurando) return;
    var termo = elemento('termo-da-busca').value.trim();
    ultimoTermo = termo;

    var onde = [];
    Object.keys(canaisEscolhidas).forEach(function (id) {
      if (canaisEscolhidas[id]) onde.push(id);
    });

    procurando = true;
    elemento('botao-buscar').disabled = true;
    elemento('resultado-da-busca').innerHTML =
      '<p class="carregando-campos">Procurando…</p>';

    Servidor.chamar('buscarCasos', termo, onde, incluirLegado)
      .entao(function (resposta) {
        procurando = false;
        elemento('botao-buscar').disabled = false;
        desenharResultado(resposta);
      })
      .senao(function (erro) {
        procurando = false;
        elemento('botao-buscar').disabled = false;
        elemento('resultado-da-busca').innerHTML =
          '<div class="cartao vazio"><strong>'
          + escapar(erro.message || String(erro)) + '</strong></div>';
      });
  }

  function desenharResultado(resposta) {
    if (!resposta.total) {
      elemento('resultado-da-busca').innerHTML = '<div class="cartao vazio">'
        + '<strong>Nada encontrado para "' + escapar(resposta.termo) + '".</strong>'
        + '<p>Procurei em: ' + escapar(resposta.origens.map(function (origem) {
          return origem.nome;
        }).join(', ')) + '. A comparação ignora pontos e traços, então '
        + '<code>123.456.789-01</code> e <code>12345678901</code> acham a mesma '
        + 'coisa. Se o caso é antigo e não está aqui, ele pode estar na base '
        + 'legada — marque-a acima.</p>'
        + avisosDe(resposta.origens) + '</div>';
      return;
    }

    podeEditar = resposta.podeEditar === true;
    elemento('resultado-da-busca').innerHTML =
      '<p class="busca-contagem">' + resposta.total + ' caso(s) para "'
      + escapar(resposta.termo) + '"</p>'
      + resposta.origens.map(desenharOrigem).join('');
    ligarResultado();
  }

  function avisosDe(origens) {
    return origens.filter(function (origem) { return origem.aviso; })
      .map(function (origem) {
        return '<p class="aviso-fila">' + escapar(origem.nome) + ': '
          + escapar(origem.aviso) + '</p>';
      }).join('');
  }

  function desenharOrigem(origem) {
    var cabeca = '<header class="origem-cabeca">'
      + (origem.icone ? SeletorDeCanal.icone(origem.icone) : '')
      + '<h3>' + escapar(origem.nome) + '</h3>'
      + '<span class="quantos">' + origem.casos.length + '</span>'
      + (origem.somenteLeitura
        ? '<span class="etiqueta-leitura">só leitura</span>' : '')
      + '</header>';

    if (!origem.casos.length) {
      return '<section class="cartao origem vazia">' + cabeca
        + '<p>' + (origem.aviso
          ? escapar(origem.aviso)
          : 'Nada encontrado aqui.') + '</p></section>';
    }

    return '<section class="cartao sem-forro origem">' + cabeca
      + (origem.aviso
        ? '<p class="aviso-fila">' + escapar(origem.aviso) + '</p>' : '')
      + (origem.tipo === 'legado'
        ? tabelaDoLegado(origem) : tabelaDoCanal(origem))
      + '</section>';
  }

  function tabelaDoCanal(origem) {
    var cabecalho = origem.colunas.map(function (grupo) {
      return '<th>' + escapar(grupo.titulo) + '</th>';
    }).join('') + '<th class="acoes-coluna">Ações</th>';

    var linhas = origem.casos.map(function (caso) {
      var celulas = caso.celulas.map(function (grupo, i) {
        return '<td>' + grupo.map(function (celula, j) {
          if (celula.ehStatus) {
            return '<span class="situacao tom-' + escapar(caso.tom || 'neutro')
              + '">' + escapar(celula.valor || '—') + '</span>';
          }
          var classe = (j === 0 && i !== 0) ? 'principal' : 'apoio';

          return '<span class="' + classe + '" title="'
            + escapar(Moldura.dicaDaCelula(celula)) + '">'
            + escapar(celula.valor || '—') + '</span>';
        }).join('') + '</td>';
      }).join('');

      return '<tr>' + celulas + '<td class="acoes-coluna">'
        + acoesDoAchado(caso, origem) + '</td></tr>';
    }).join('');

    return '<div class="rolagem-tabela"><table class="fila agrupada">'
      + '<thead><tr>' + cabecalho + '</tr></thead>'
      + '<tbody>' + linhas + '</tbody></table></div>';
  }

  function tabelaDoLegado(origem) {
    var cabecalho = origem.cabecalhos.map(function (nome) {
      return '<th>' + escapar(nome) + '</th>';
    }).join('');

    var linhas = origem.casos.map(function (caso) {
      return '<tr>' + caso.celulas[0].map(function (celula) {
        return '<td>' + escapar(celula.valor || '—') + '</td>';
      }).join('') + '</tr>';
    }).join('');

    return '<p class="aviso-fila">Estas linhas vêm da planilha do sistema '
      + 'anterior, como ela está. Elas não abrem nem se editam por aqui.</p>'
      + '<div class="rolagem-tabela"><table class="fila legado">'
      + '<thead><tr>' + cabecalho + '</tr></thead>'
      + '<tbody>' + linhas + '</tbody></table></div>';
  }

  function acoesDoAchado(caso, origem) {
    var ids = '="' + escapar(caso.id) + '" data-canal="' + escapar(origem.id) + '"';
    return (podeEditar
      ? '<button type="button" class="acao" data-achado' + ids + '>'
        + Moldura.icone('editar') + ' Trabalhar no caso</button>'
        + '<button type="button" class="acao-icone" data-status-do-achado' + ids
        + ' title="Alterar status" aria-label="Alterar status">'
        + Moldura.icone('trocarSituacao') + '</button>'
      : '')
      + '<button type="button" class="acao-icone perigo" data-excluir-achado' + ids
      + ' title="Excluir caso" aria-label="Excluir caso">'
      + Moldura.icone('ocultar') + '</button>';
  }

  function ligarResultado() {

    function procurarDeNovo() { if (ultimoTermo) procurar(); }

    cliques('[data-achado]', function (canal, caso) {
      CasoEmModal.abrir(canal, caso, procurarDeNovo);
    }, 'data-achado');
    cliques('[data-status-do-achado]', function (canal, caso) {
      CasoEmModal.trocarSituacao(canal, caso, procurarDeNovo);
    }, 'data-status-do-achado');
    cliques('[data-excluir-achado]', function (canal, caso) {
      Formulario.confirmarExclusao(caso, function () {
        Servidor.chamar('excluirCaso', canal, caso)
          .entao(procurarDeNovo)
          .senao(function (erro) { window.alert(erro.message || String(erro)); });
      });
    }, 'data-excluir-achado');
  }

  function cliques(seletor, oQueFazer, atributoDoCaso) {
    var botoes = document.querySelectorAll(seletor);
    for (var i = 0; i < botoes.length; i++) {
      botoes[i].addEventListener('click', function () {
        oQueFazer(this.getAttribute('data-canal'), this.getAttribute(atributoDoCaso));
      });
    }
  }

  function ligar() {
    elemento('form-da-busca').addEventListener('submit', function (evento) {
      evento.preventDefault();
      procurar();
    });

    elemento('limpar-filtros-da-busca').addEventListener('click', function () {
      if (procurando || !opcoes) return;
      elemento('termo-da-busca').value = '';
      ultimoTermo = '';
      opcoes.canais.forEach(function (canal) { canaisEscolhidas[canal.id] = true; });
      incluirLegado = false;
      desenharOnde();
      elemento('resultado-da-busca').innerHTML = '';
      elemento('termo-da-busca').focus();
    });

    Servidor.chamar('opcoesDaBusca')
      .entao(function (resposta) {
        opcoes = resposta;

        opcoes.canais.forEach(function (canal) { canaisEscolhidas[canal.id] = true; });
        desenharOnde();
        elemento('termo-da-busca').focus();
        if (termoPedido) {
          elemento('termo-da-busca').value = termoPedido;
          termoPedido = '';
          procurar();
        }
      })
      .senao(function (erro) {
        elemento('onde-procurar').innerHTML =
          '<span class="busca-dica erro-carga">'
          + escapar(erro.message || String(erro)) + '</span>';
      });
  }

  function procurarPor(termo) { termoPedido = String(termo || '').trim(); }

  return { montar: montar, ligar: ligar, procurarPor: procurarPor };
})();
</script>


<!-- ==== TabelaCorretoras.html ==== -->
<script>

var TelaTabelaCorretoras = (function () {

  var abaAtual = 'corretoras';
  var procurar = '';
  var procurarBloqueada = '';
  var segmento = '';
  var dados = null;
  var editando = null;
  var tipoDaImportacao = '';

  var fonteDaImportacao = { tipo: 'colado', texto: '', planilhaId: '', aba: '' };

  var origem = null;
  var conferido = null;

  function escapar(texto) { return Moldura.escapar(texto); }
  function elemento(id) { return document.getElementById(id); }

  function montar() {
    return '<div class="config-abas" id="abas-das-corretoras">'
      + [['corretoras', 'Corretoras Diamante'],
         ['bloqueadas', 'SUSEPs bloqueadas'],
         ['importar', 'Importar']].map(function (par) {
        return '<button type="button" class="config-aba'
          + (abaAtual === par[0] ? ' atual' : '') + '"'
          + ' data-aba-corretoras="' + par[0] + '">' + escapar(par[1])
          + '</button>';
      }).join('') + '</div>'
      + '<div class="config" id="corretoras">'
      + '<div class="config-lista" id="corretoras-lista">'
      + '<p class="carregando-campos">Lendo o cadastro…</p></div>'
      + '<aside class="config-painel" id="corretoras-painel"></aside>'
      + '</div>';
  }

  function carregar() {
    var lista = elemento('corretoras-lista');
    if (lista) lista.innerHTML = '<p class="carregando-campos">Lendo o cadastro…</p>';

    if (abaAtual === 'corretoras') {
      return Servidor.chamar('tabelaDeCorretoras', procurar, segmento)
        .entao(function (resposta) { dados = resposta; desenharCorretoras(); })
        .senao(falhou);
    }
    if (abaAtual === 'importar') {
      return Servidor.chamar('opcoesDaImportacao')
        .entao(function (lista) {
          dados = { importacoes: lista };
          if (!tipoDaImportacao && lista.length) tipoDaImportacao = lista[0].tipo;
          desenharImportacao();
        })
        .senao(falhou);
    }

    return Servidor.chamar('resumoDasSusepsBloqueadas', procurarBloqueada)
      .entao(function (resposta) { dados = resposta; desenharBloqueadas(); })
      .senao(falhou);
  }

  function falhou(erro) {
    elemento('corretoras-lista').innerHTML =
      '<p class="carregando-campos erro-carga">'
      + escapar(erro.message || String(erro)) + '</p>';
  }

  function desenharCorretoras() {
    var opcoes = ['<option value="">Todos os segmentos</option>']
      .concat(dados.segmentos.map(function (um) {
        return '<option value="' + escapar(um) + '"'
          + (um === segmento ? ' selected' : '') + '>' + escapar(um) + '</option>';
      })).join('');

    elemento('corretoras-lista').innerHTML = '<div class="config-cabeca">'
      + '<input type="search" id="procurar-corretora" class="busca-do-cadastro"'
      + ' value="' + escapar(procurar) + '" autocomplete="off"'
      + ' placeholder="Corretora, sucursal, consultor ou SUSEP"'
      + ' aria-label="Procurar corretora">'
      + '<select id="segmento-da-corretora" aria-label="Segmento">' + opcoes + '</select>'
      + Moldura.botaoLimparFiltros('limpar-filtros-corretoras')
      + (dados.podeMexer && podeMexerNesta('CORRETORAS')
        ? '<button type="button" class="botao pequeno" id="nova-corretora">'
          + 'Cadastrar corretora</button>' : '')
      + (dados.podeExportar
        ? '<button type="button" class="botao-texto" id="exportar-corretoras">'
          + 'Exportar</button>' : '')
      + '</div>'
      + avisoDeOrigem('CORRETORAS')
      + avisoDasNaoCadastradas()
      + '<p class="config-explica">' + dados.quantasFiltradas + ' de '
      + dados.quantasNoTotal + ' corretoras · a lista vem de quem mais traz '
      + 'caso, e não em ordem alfabética.</p>'
      + tabelaDasCorretoras()
      + (dados.truncada
        ? '<p class="aviso-fila">Mostrando as ' + dados.corretoras.length
          + ' primeiras. Procure para chegar mais perto.</p>' : '');

    ligarCorretoras();
    if (!editando) {
      painelVazio('Escolha uma corretora para ver e mudar o cadastro dela.');
    }
  }

  function avisoDasNaoCadastradas() {
    if (!dados.foraDoCadastro.length) return '';

    var primeiras = dados.foraDoCadastro.slice(0, 6);
    return '<div class="aviso-cadastro">'
      + '<strong>' + dados.foraDoCadastro.length + ' SUSEP(s) aparecem nos '
      + 'casos e não estão no cadastro.</strong>'
      + '<p>Enquanto elas ficarem de fora, o selo do formulário vai dizer '
      + '"não encontrada" toda vez que alguém as digitar.</p>'
      + '<ul>' + primeiras.map(function (uma) {
        return '<li>'
          + (dados.podeMexer
            ? '<button type="button" class="botao-texto" data-cadastrar-susep="'
              + escapar(uma.susep) + '" data-nome-nos-casos="'
              + escapar(uma.nomeNosCasos) + '">' + escapar(uma.susep)
              + '</button>'
            : '<span class="susep">' + escapar(uma.susep) + '</span>')
          + '<span class="nos-casos">'
          + (uma.nomeNosCasos
            ? 'nos casos aparece como “' + escapar(uma.nomeNosCasos) + '”'
            : 'sem nome nos casos')
          + '</span>'
          + '<span class="quantos">' + uma.casos + ' caso(s)</span></li>';
      }).join('') + '</ul>'
      + (dados.foraDoCadastro.length > primeiras.length
        ? '<p class="config-explica" style="margin:8px 0 0">E mais '
          + (dados.foraDoCadastro.length - primeiras.length) + '.</p>' : '')
      + '</div>';
  }

  function tabelaDasCorretoras() {
    if (!dados.corretoras.length) {
      return '<p class="config-vazio">Nenhuma corretora com esse filtro.</p>';
    }

    var linhas = dados.corretoras.map(function (uma) {
      return '<tr' + (editando && editando.id === uma.id ? ' class="aberta"' : '')
        + '>'
        + '<td><span class="principal">' + escapar(uma.corretora) + '</span>'
        + '<span class="apoio">' + escapar(uma.susep) + '</span></td>'
        + '<td>' + escapar(uma.sucursal || '—') + '</td>'
        + '<td><span class="situacao ' + classeDoSegmento(uma.segmento) + '">'
        + escapar(uma.segmento) + '</span></td>'
        + '<td>' + escapar(uma.consultor || '—') + '</td>'
        + '<td class="direita">' + uma.casos + '</td>'
        + '<td class="acoes-coluna">'
        + (dados.podeMexer && podeMexerNesta('CORRETORAS')
          ? '<button type="button" class="acao-icone" data-corretora="'
            + escapar(uma.id) + '" title="Editar" aria-label="Editar corretora">'
            + Moldura.icone('editar') + '</button>' : '')
        + '</td></tr>';
    }).join('');

    return '<div class="rolagem-tabela"><table class="fila agrupada cadastro">'
      + '<thead><tr><th>Corretora</th><th>Sucursal</th><th>Segmento</th>'
      + '<th>Consultor</th><th class="direita">Casos</th>'
      + '<th class="acoes-coluna"></th></tr></thead>'
      + '<tbody>' + linhas + '</tbody></table></div>';
  }

  function classeDoSegmento(segmentoDaLinha) {

    var comparavel = String(segmentoDaLinha || '').toLowerCase();
    if (comparavel.indexOf('diamante') >= 0) return 'tom-destaque';
    if (comparavel.indexOf('não encontrado') >= 0
      || comparavel.indexOf('nao encontrado') >= 0) return 'tom-atencao';
    return 'tom-neutro';
  }

  function ligarCorretoras() {
    var busca = elemento('procurar-corretora');
    busca.addEventListener('change', function () {
      procurar = this.value;
      editando = null;
      carregar();
    });

    elemento('segmento-da-corretora').addEventListener('change', function () {
      segmento = this.value;
      editando = null;
      carregar();
    });

    elemento('limpar-filtros-corretoras').addEventListener('click', function () {
      procurar = '';
      segmento = '';
      editando = null;
      carregar();
    });

    var nova = elemento('nova-corretora');
    if (nova) {
      nova.addEventListener('click', function () {
        editando = { id: '' };
        desenharFormularioDaCorretora(null);
      });
    }

    var exportar = elemento('exportar-corretoras');
    if (exportar) {
      exportar.addEventListener('click', function () {
        Servidor.chamar('exportarCorretoras', procurar, segmento)
          .entao(abrirCaixaDeExportar)
          .senao(function (erro) { window.alert(erro.message || String(erro)); });
      });
    }

    ligarCliques('[data-corretora]', function (botao) {
      var id = botao.getAttribute('data-corretora');
      editando = { id: id };
      desenharCorretoras();
      desenharFormularioDaCorretora(acharCorretora(id));
    });

    ligarCliques('[data-cadastrar-susep]', function (botao) {

      editando = { id: '' };
      desenharFormularioDaCorretora({
        id: '', susep: botao.getAttribute('data-cadastrar-susep'),
        corretora: botao.getAttribute('data-nome-nos-casos'),
        sucursal: '', segmento: '', consultor: ''
      }, true);
    });
  }

  function acharCorretora(id) {
    for (var i = 0; i < dados.corretoras.length; i++) {
      if (dados.corretoras[i].id === id) return dados.corretoras[i];
    }
    return null;
  }

  function desenharFormularioDaCorretora(corretora, veioDosCasos) {
    var atual = corretora || { id: '', susep: '', corretora: '',
      sucursal: '', segmento: '', consultor: '' };

    elemento('corretoras-painel').innerHTML =
      '<form class="config-form" id="form-corretora">'
      + tituloDoPainel(atual.id ? atual.corretora : 'Corretora nova',
        'Cadastro de corretora')
      + (veioDosCasos
        ? '<p class="config-aviso">O nome veio dos casos que já citam esta '
          + 'SUSEP — confira antes de salvar. É um palpite, não um cadastro.</p>'
        : '')
      + campoDeTexto('susep', 'SUSEP', atual.susep,
        'Letras e números, como a SUSEP é escrita — por exemplo RET00J. É ela '
        + 'que liga a corretora ao caso.')
      + campoDeTexto('corretora', 'Nome da corretora', atual.corretora, '')
      + campoDeTexto('sucursal', 'Sucursal', atual.sucursal, '')
      + caixaDeSegmento(atual.segmento)
      + campoDeTexto('consultor', 'Consultor', atual.consultor,
        'Quem atende esta corretora.')
      + '<div class="config-acoes">'
      + '<button type="submit" class="botao">Salvar</button>'
      + (atual.id
        ? '<button type="button" class="botao vazado perigo" id="tirar-corretora">'
          + 'Tirar do cadastro</button>' : '')
      + '</div></form>';

    elemento('form-corretora').addEventListener('submit', function (evento) {
      evento.preventDefault();
      Servidor.chamar('salvarCorretora', {
        id: atual.id,
        susep: valorDe('susep'),
        corretora: valorDe('corretora'),
        sucursal: valorDe('sucursal'),
        segmento: valorDe('segmento'),
        consultor: valorDe('consultor')
      }).entao(function () {
        avisar('Corretora salva.', 'bom');
        editando = null;
        carregar();
      }).senao(mostrarErro);
    });

    var tirar = elemento('tirar-corretora');
    if (tirar) {
      tirar.addEventListener('click', function () {
        if (!window.confirm('Tirar "' + atual.corretora + '" do cadastro?\n\n'
          + 'Ela some da tela e do selo do formulário. A linha permanece na '
          + 'planilha, e os casos dela continuam intactos.')) return;
        Servidor.chamar('ocultarCorretora', atual.id)
          .entao(function () {
            avisar('Corretora tirada do cadastro.', 'bom');
            editando = null;
            carregar();
          }).senao(mostrarErro);
      });
    }
  }

  function caixaDeSegmento(escolhido) {
    var conhecidos = ['Diamante', 'Demais corretoras', 'Não encontrado'];
    (dados.segmentos || []).forEach(function (um) {
      if (conhecidos.indexOf(um) < 0) conhecidos.push(um);
    });

    return '<label class="config-campo"><span>Segmento</span>'
      + '<select id="cfg-segmento">'
      + conhecidos.map(function (um) {
        return '<option value="' + escapar(um) + '"'
          + (um === escolhido ? ' selected' : '') + '>' + escapar(um) + '</option>';
      }).join('') + '</select>'
      + '<em>Diamante muda o atendimento; "Não encontrado" quer dizer cadastro '
      + 'incompleto, e não corretora irregular.</em></label>';
  }

  function numeroComPonto(numero) {
    return String(Number(numero) || 0).replace(/\B(?=(\d{3})+(?!\d))/g, '.');
  }

  function etiquetaDeQuemBloqueou(por) {
    if (por === 'Companhia') return '<span class="situacao tom-ruim">Companhia</span>';
    if (por === 'Corretora') return '<span class="situacao tom-violeta">Corretora</span>';
    return '<span class="situacao tom-neutro">Sem tipo</span>';
  }

  function desenharBloqueadas() {
    var podeMexerAqui = dados.podeMexer && podeMexerNesta('SUSEP_BLOQUEADAS');
    var linhas = dados.bloqueadas.map(function (uma) {
      return '<tr>'
        + '<td><span class="principal">' + escapar(uma.susep) + '</span>'
        + '<span class="apoio">' + escapar(uma.corretora || 'sem nome') + '</span></td>'
        + '<td>' + etiquetaDeQuemBloqueou(uma.bloqueadaPor) + '</td>'
        + '<td>' + escapar(uma.sucursal || '—') + '</td>'
        + '<td>' + escapar(uma.coordenadorComercial || '—') + '</td>'
        + '<td>' + escapar(uma.bloqueadaEm || '—') + '</td>'
        + '<td class="direita">' + uma.casos + '</td>'
        + '<td class="acoes-coluna">'
        + (podeMexerAqui
          ? '<button type="button" class="botao-texto" data-editar-bloqueio="'
            + escapar(uma.id) + '">Editar</button>'
            + '<button type="button" class="botao-texto" data-liberar="'
            + escapar(uma.id) + '">Liberar</button>' : '')
        + '</td></tr>';
    }).join('');

    elemento('corretoras-lista').innerHTML = '<div class="config-cabeca">'
      + '<input type="search" id="procurar-bloqueada" class="busca-do-cadastro"'
      + ' value="' + escapar(procurarBloqueada) + '" autocomplete="off"'
      + ' placeholder="SUSEP, corretora, sucursal ou coordenador"'
      + ' aria-label="Procurar SUSEP bloqueada">'
      + Moldura.botaoLimparFiltros('limpar-filtros-bloqueadas')
      + (dados.podeMexer && podeMexerNesta('SUSEP_BLOQUEADAS')
        ? '<button type="button" class="botao pequeno" id="nova-bloqueada">'
          + 'Bloquear SUSEP</button>' : '')
      + '</div>'
      + avisoDeOrigem('SUSEP_BLOQUEADAS')
      + '<p class="config-explica"><strong>' + numeroComPonto(dados.quantasNoTotal)
      + ' SUSEP(s) bloqueada(s)</strong>'
      + (procurarBloqueada
        ? ' · ' + numeroComPonto(dados.quantasAchadas) + ' com "' + escapar(procurarBloqueada) + '"'
        : ' · a lista começa pelas que aparecem nos casos, depois as mais recentes')
      + '.</p>'
      + (dados.truncada
        ? '<p class="aviso-fila">Mostrando ' + dados.bloqueadas.length + ' de '
          + numeroComPonto(dados.quantasAchadas) + '. Procure pela SUSEP, pela corretora, '
          + 'pela sucursal ou pelo coordenador para chegar nas outras.</p>' : '')
      + '<p class="config-explica">Bloquear <strong>não impede cadastrar</strong>: '
      + 'o formulário passa a mostrar o selo — vermelho quando quem bloqueou '
      + 'foi a companhia, violeta quando foi a corretora —, e quem está '
      + 'atendendo decide. Bloqueio que impedisse o cadastro faria a pessoa registrar o '
      + 'caso num caderno, e o sistema perderia o caso de vista.<br>'
      + 'Esta lista <strong>não vale para corretora Diamante</strong>: se a '
      + 'SUSEP está no cadastro de corretoras, o selo sai verde — são duas '
      + 'listas, de donos diferentes.</p>'
      + (dados.bloqueadas.length
        ? '<div class="rolagem-tabela"><table class="fila agrupada cadastro">'
          + '<thead><tr><th>SUSEP</th><th>Bloqueada por</th><th>Sucursal</th>'
          + '<th>Coordenador comercial</th>'
          + '<th>Desde</th><th class="direita">Casos</th>'
          + '<th class="acoes-coluna"></th></tr></thead>'
          + '<tbody>' + linhas + '</tbody></table></div>'
        : '<p class="config-vazio">' + (procurarBloqueada
          ? 'Nenhuma SUSEP bloqueada com "' + escapar(procurarBloqueada) + '".'
          : 'Nenhuma SUSEP bloqueada.') + '</p>');

    elemento('procurar-bloqueada').addEventListener('change', function () {
      procurarBloqueada = this.value;
      carregar();
    });

    elemento('limpar-filtros-bloqueadas').addEventListener('click', function () {
      procurarBloqueada = '';
      carregar();
    });

    var nova = elemento('nova-bloqueada');
    if (nova) {
      nova.addEventListener('click', function () {
        desenharFormularioDoBloqueio(null);
      });
    }
    ligarCliques('[data-editar-bloqueio]', function (botao) {
      desenharFormularioDoBloqueio(
        acharNaLista(dados.bloqueadas, botao.getAttribute('data-editar-bloqueio')));
    });
    ligarCliques('[data-liberar]', function (botao) {
      liberar(botao.getAttribute('data-liberar'));
    });

    painelVazio(dados.podeMexer
      ? 'Bloquear uma SUSEP marca o selo do formulário, e não impede nada.'
      : 'O seu nível de acesso vê a lista, mas não mexe nela.');
  }

  function desenharFormularioDoBloqueio(bloqueio) {
    var atual = bloqueio || { id: '', susep: '', corretora: '', sucursal: '',
      coordenadorComercial: '', bloqueadaPor: '' };

    elemento('corretoras-painel').innerHTML =
      '<form class="config-form" id="form-bloqueio">'
      + tituloDoPainel(atual.id ? 'Editar bloqueio' : 'Bloquear SUSEP',
        'Marca o selo do formulário')
      + campoDeTexto('susep', 'SUSEP', atual.susep,
        'Letras e números, como a SUSEP é escrita — por exemplo RET00J.')
      + caixaDeQuemBloqueou(atual.bloqueadaPor)
      + campoDeTexto('corretora', 'Corretora', atual.corretora, '')
      + campoDeTexto('sucursal', 'Sucursal', atual.sucursal, '')
      + campoDeTexto('coordenador', 'Coordenador comercial',
        atual.coordenadorComercial,
        'Quem responde por este bloqueio. É a quem perguntar quando o selo '
        + 'aparecer daqui a seis meses.')
      + '<div class="config-acoes">'
      + '<button type="submit" class="botao">'
      + (atual.id ? 'Salvar' : 'Bloquear') + '</button></div></form>';

    elemento('form-bloqueio').addEventListener('submit', function (evento) {
      evento.preventDefault();
      var envio = {
        id: atual.id,
        susep: valorDe('susep'), corretora: valorDe('corretora'),
        sucursal: valorDe('sucursal'),
        coordenadorComercial: valorDe('coordenador'),
        bloqueadaPor: valorDe('bloqueada-por')
      };

      if (atual.id && !envio.bloqueadaPor) delete envio.bloqueadaPor;
      Servidor.chamar('bloquearSusep', envio).entao(function () {
        avisar(atual.id ? 'Bloqueio salvo.' : 'SUSEP bloqueada.', 'bom');
        carregar();
      }).senao(mostrarErro);
    });
  }

  function caixaDeQuemBloqueou(escolhido) {
    return '<label class="config-campo"><span>Bloqueada por</span>'
      + '<select id="cfg-bloqueada-por">'
      + '<option value=""' + (escolhido ? '' : ' selected') + '>Escolha…</option>'
      + ['Companhia', 'Corretora'].map(function (um) {
        return '<option value="' + um + '"'
          + (um === escolhido ? ' selected' : '') + '>' + um + '</option>';
      }).join('') + '</select>'
      + '<em>Pela companhia o selo do formulário sai vermelho; pela corretora, '
      + 'violeta.</em></label>';
  }

  function liberar(id) {
    if (!window.confirm('Liberar esta SUSEP?\n\n'
      + 'O selo do formulário volta a aceitá-la. O registro do bloqueio '
      + 'permanece na planilha, com a data.')) return;

    Servidor.chamar('desbloquearSusep', id)
      .entao(function () { avisar('SUSEP liberada.', 'bom'); carregar(); })
      .senao(function (erro) { window.alert(erro.message || String(erro)); });
  }

  function receitaEscolhida() {
    return acharPorTipo(dados.importacoes, tipoDaImportacao)
      || dados.importacoes[0];
  }

  function acharPorTipo(lista, tipo) {
    for (var i = 0; i < lista.length; i++) {
      if (lista[i].tipo === tipo) return lista[i];
    }
    return null;
  }

  function desenharImportacao() {
    var receita = receitaEscolhida();
    if (!receita) {
      elemento('corretoras-lista').innerHTML =
        '<p class="config-vazio">Nada para importar.</p>';
      return;
    }

    var abas = dados.importacoes.map(function (uma) {
      return '<option value="' + escapar(uma.tipo) + '"'
        + (uma.tipo === receita.tipo ? ' selected' : '') + '>'
        + escapar(uma.titulo) + '</option>';
    }).join('');

    var cabecalho = receita.colunas.map(function (coluna) {
      return coluna.titulo;
    }).join('\t');

    var colando = fonteDaImportacao.tipo !== 'planilha';

    elemento('corretoras-lista').innerHTML = '<div class="config-cabeca">'
      + '<span class="config-titulo">Importar</span>'
      + '<select id="tipo-da-importacao" aria-label="O que importar">'
      + abas + '</select></div>'
      + '<p class="config-explica">' + escapar(receita.explicacao) + '</p>'
      + '<div class="importar-colunas"><span>Colunas, nesta ordem:</span> '
      + receita.colunas.map(function (coluna) {
        return '<code>' + escapar(coluna.titulo) + '</code>'
          + (coluna.obrigatoria ? '<em>obrigatória</em>' : '');
      }).join('') + '</div>'
      + '<p class="config-explica">Com ou sem a linha de cabeçalho, tanto faz. '
      + 'Se vier com cabeçalho, a ordem das colunas pode ser outra: o sistema '
      + 'lê pelos nomes. Até ' + receita.maximo + ' linhas por vez.</p>'
      + '<div class="config-abas">'
      + '<button type="button" class="config-aba' + (colando ? ' atual' : '') + '"'
      + ' data-fonte-da-importacao="colado">Colar da planilha</button>'
      + '<button type="button" class="config-aba' + (colando ? '' : ' atual') + '"'
      + ' data-fonte-da-importacao="planilha">Ler outra planilha pelo link</button>'
      + '</div>'
      + (colando ? desenharColarCadastro(cabecalho) : desenharLinkDoCadastro())
      + '<div class="config-acoes">'
      + '<button type="button" class="botao" id="conferir-importacao">'
      + 'Conferir</button>'
      + '<button type="button" class="botao vazado" id="limpar-importacao">'
      + 'Limpar</button></div>'
      + '<div id="resultado-da-importacao"></div>';

    elemento('tipo-da-importacao').addEventListener('change', function () {
      guardarFonteDaImportacao();
      tipoDaImportacao = this.value;
      conferido = null;
      desenharImportacao();
    });

    ligarCliques('[data-fonte-da-importacao]', function (botao) {
      guardarFonteDaImportacao();
      fonteDaImportacao.tipo = botao.getAttribute('data-fonte-da-importacao');
      conferido = null;
      desenharImportacao();
    });

    elemento('conferir-importacao').addEventListener('click', conferir);
    elemento('limpar-importacao').addEventListener('click', function () {

      fonteDaImportacao = { tipo: fonteDaImportacao.tipo, texto: '',
        planilhaId: '', aba: '' };
      elemento('resultado-da-importacao').innerHTML = '';
      conferido = null;
      desenharImportacao();
    });

    painelVazio('Aponte as linhas e aperte Conferir. Nada é gravado até você '
      + 'apertar Aplicar — e Aplicar pede a senha de administrador.');
  }

  function desenharColarCadastro(cabecalho) {
    return '<textarea id="texto-da-importacao" class="importar-area" rows="10"'
      + ' spellcheck="false" aria-label="Cole aqui as linhas"'
      + ' placeholder="' + escapar(cabecalho) + '">'
      + escapar(fonteDaImportacao.texto) + '</textarea>';
  }

  function desenharLinkDoCadastro() {
    return '<div class="grade">'
      + '<label class="campo"><span>Id da planilha</span>'
      + '<input type="text" id="planilha-da-importacao"'
      + ' value="' + escapar(fonteDaImportacao.planilhaId) + '"'
      + ' placeholder="o pedaço do endereço entre /d/ e /edit"></label>'
      + '<label class="campo"><span>Nome da aba</span>'
      + '<input type="text" id="aba-da-importacao"'
      + ' value="' + escapar(fonteDaImportacao.aba) + '"'
      + ' placeholder="em branco = a primeira aba"></label>'
      + '</div>'
      + '<p class="config-explica">A conta que abre o PGO precisa ter acesso a '
      + 'essa planilha. Se não tiver, o sistema diz isso em vez de importar '
      + 'pela metade.</p>';
  }

  function guardarFonteDaImportacao() {
    var caixa = elemento('texto-da-importacao');
    if (caixa) fonteDaImportacao.texto = caixa.value;

    var planilha = elemento('planilha-da-importacao');
    if (planilha) fonteDaImportacao.planilhaId = planilha.value.trim();

    var aba = elemento('aba-da-importacao');
    if (aba) fonteDaImportacao.aba = aba.value.trim();
    return fonteDaImportacao;
  }

  function conferir() {
    var fonte = guardarFonteDaImportacao();
    if (fonte.tipo === 'planilha' ? !fonte.planilhaId : !fonte.texto.trim()) {
      avisar(fonte.tipo === 'planilha'
        ? 'Informe o Id da planilha antes de conferir.'
        : 'Cole alguma coisa antes de conferir.', 'atencao');
      return;
    }
    var onde = elemento('resultado-da-importacao');
    onde.innerHTML = '<p class="carregando-campos">Conferindo…</p>';

    Servidor.chamarSemPressa('conferirImportacao', tipoDaImportacao, fonte)
      .entao(function (resposta) {
        conferido = resposta;
        desenharConferencia();
      })
      .senao(function (erro) {
        conferido = null;
        onde.innerHTML = '<p class="carregando-campos erro-carga">'
          + escapar(erro.message || String(erro)) + '</p>';
      });
  }

  function desenharConferencia() {
    var resumo = conferido.resumo;
    var colunas = conferido.colunas;

    var linhas = conferido.linhas.map(function (linha) {
      var celulas = colunas.map(function (coluna) {
        return '<td>' + escapar(linha.campos[coluna.chave] || '—') + '</td>';
      }).join('');
      return '<tr class="importar-' + linha.situacao + '">'
        + '<td class="direita">' + linha.numero + '</td>'
        + celulas
        + '<td><span class="situacao ' + tomDaSituacao(linha.situacao) + '">'
        + escapar(nomeDaSituacao(linha.situacao)) + '</span>'
        + (linha.porque
          ? '<span class="apoio">' + escapar(linha.porque) + '</span>' : '')
        + '</td></tr>';
    }).join('');

    elemento('resultado-da-importacao').innerHTML =
      '<div class="importar-resumo">'
      + pastilha('novas', resumo.novas, 'bom')
      + pastilha('atualizam', resumo.atualizadas, 'destaque')
      + pastilha('já iguais', resumo.iguais, 'neutro')
      + pastilha('recusadas', resumo.recusadas, 'ruim')
      + '</div>'
      + (conferido.tinhaCabecalho
        ? '<p class="config-explica">A primeira linha era o cabeçalho, e não '
          + 'entrou na conta.</p>' : '')
      + '<p class="config-explica">Nada aqui apaga: uma linha que está no '
        + 'cadastro e não veio no texto colado <strong>fica onde está</strong>, '
        + 'e um campo vazio no texto não limpa o que já existe.</p>'
      + '<div class="rolagem-tabela"><table class="fila agrupada cadastro">'
      + '<thead><tr><th class="direita">Linha</th>'
      + colunas.map(function (coluna) {
        return '<th>' + escapar(coluna.titulo) + '</th>';
      }).join('')
      + '<th>O que vai acontecer</th></tr></thead>'
      + '<tbody>' + linhas + '</tbody></table></div>'
      + (conferido.naoMostradas
        ? '<p class="config-explica">e mais ' + conferido.naoMostradas
          + ' linha(s) não mostradas aqui — todas serão gravadas do mesmo '
          + 'jeito.</p>' : '')
      + '<div class="config-acoes">'
      + (resumo.novas + resumo.atualizadas
        ? '<button type="button" class="botao" id="aplicar-importacao">Aplicar '
          + (resumo.novas + resumo.atualizadas) + ' alteração(ões)</button>'
        : '<p class="config-vazio">Não há nada a gravar.</p>')
      + '</div>';

    var aplicar = elemento('aplicar-importacao');
    if (aplicar) aplicar.addEventListener('click', pedirSenhaEAplicar);
  }

  function pastilha(rotulo, quantos, tom) {
    return '<span class="importar-pastilha tom-' + tom + '">'
      + '<strong>' + quantos + '</strong> ' + escapar(rotulo) + '</span>';
  }

  function nomeDaSituacao(situacao) {
    if (situacao === 'nova') return 'cadastra';
    if (situacao === 'atualiza') return 'atualiza';
    if (situacao === 'igual') return 'sem mudança';
    return 'recusada';
  }

  function tomDaSituacao(situacao) {
    if (situacao === 'nova') return 'bom';
    if (situacao === 'atualiza') return 'destaque';
    if (situacao === 'igual') return 'neutro';
    return 'ruim';
  }

  function pedirSenhaEAplicar() {
    var fonte = guardarFonteDaImportacao();
    SenhaDeAdministrador.pedir(function () {
      elemento('resultado-da-importacao').innerHTML =
        '<p class="carregando-campos">Gravando…</p>';
      Servidor.chamarSemPressa('aplicarImportacao', tipoDaImportacao, fonte)
        .entao(function (feito) {
          avisar(feito.criadas + ' cadastrada(s) e ' + feito.atualizadas
            + ' atualizada(s) em ' + feito.titulo + '.', 'bom');
          fonteDaImportacao = { tipo: fonteDaImportacao.tipo, texto: '',
            planilhaId: '', aba: '' };
          conferido = null;
          carregar();
        })
        .senao(function (erro) {
          mostrarErro(erro);
          desenharConferencia();
        });
    });
  }

  function tituloDoPainel(titulo, subtitulo) {
    return '<header class="config-painel-cabeca">'
      + '<h3>' + escapar(titulo) + '</h3>'
      + '<p>' + escapar(subtitulo) + '</p></header>';
  }

  function painelVazio(mensagem) {
    elemento('corretoras-painel').innerHTML =
      '<p class="config-vazio">' + escapar(mensagem) + '</p>';
  }

  function campoDeTexto(nome, rotulo, valor, dica) {
    return '<label class="config-campo"><span>' + escapar(rotulo) + '</span>'
      + '<input type="text" id="cfg-' + nome + '" value="'
      + escapar(valor === null || valor === undefined ? '' : valor) + '">'
      + (dica ? '<em>' + escapar(dica) + '</em>' : '') + '</label>';
  }

  function valorDe(nome) {
    var campo = elemento('cfg-' + nome);
    return campo ? campo.value : '';
  }

  function acharNaLista(lista, id) {
    for (var i = 0; i < lista.length; i++) {
      if (String(lista[i].id) === String(id)) return lista[i];
    }
    return null;
  }

  function ligarCliques(seletor, oQueFazer) {
    var achados = document.querySelectorAll(seletor);
    for (var i = 0; i < achados.length; i++) {
      achados[i].addEventListener('click', function () { oQueFazer(this); });
    }
  }

  function mostrarErro(erro) {
    avisar(erro.message || String(erro), 'ruim');
  }

  function avisar(mensagem, tom) {
    var aviso = document.createElement('div');
    aviso.className = 'aviso-flutuante tom-' + (tom || 'bom');
    aviso.setAttribute('role', 'status');
    aviso.textContent = mensagem;
    document.body.appendChild(aviso);
    window.setTimeout(function () {
      if (aviso.parentNode) aviso.parentNode.removeChild(aviso);
    }, tom === 'ruim' ? 6000 : 3200);
  }

  function abrirCaixaDeExportar(arquivo) {
    var caixa = document.createElement('div');
    caixa.className = 'dialogo';
    caixa.innerHTML = '<div class="dialogo-caixa" role="dialog" aria-modal="true">'
      + '<h3>Exportar</h3>'
      + '<p>Separado por ponto e vírgula, que é como o Excel em português abre '
      + 'sem perguntar nada.</p>'
      + '<textarea rows="8" readonly>' + escapar(arquivo.conteudo) + '</textarea>'
      + '<div class="config-acoes">'
      + '<button type="button" class="botao" data-copiar>Copiar</button>'
      + '<button type="button" class="botao vazado" data-fechar>Fechar</button>'
      + '</div></div>';
    document.body.appendChild(caixa);

    function sair() { if (caixa.parentNode) caixa.parentNode.removeChild(caixa); }
    caixa.querySelector('[data-fechar]').addEventListener('click', sair);
    caixa.addEventListener('mousedown', function (evento) {
      if (evento.target === caixa) sair();
    });

    var area = caixa.querySelector('textarea');
    area.focus();
    area.select();
    caixa.querySelector('[data-copiar]').addEventListener('click', function () {
      area.select();
      var deuCerto = false;
      try { deuCerto = document.execCommand('copy'); } catch (erro) { deuCerto = false; }
      this.textContent = deuCerto ? 'Copiado' : 'Aperte Ctrl+C';
    });
  }

  function ligar() {
    var abas = document.querySelectorAll('[data-aba-corretoras]');
    for (var i = 0; i < abas.length; i++) {
      abas[i].addEventListener('click', function () {
        abaAtual = this.getAttribute('data-aba-corretoras');
        editando = null;
        Aplicacao.remontar();
      });
    }

    Servidor.chamar('origemDosCadastros')
      .entao(function (resposta) { origem = resposta; carregar(); })

      .senao(function () { carregar(); });
  }

  function avisoDeOrigem(aba) {
    if (!origem || !origem[aba] || !origem[aba].deFora) return '';
    var dela = origem[aba];

    var onde = dela.planilha
      ? 'a planilha de cadastros <strong>' + escapar(dela.planilha) + '</strong>'
      : 'a planilha de cadastros';

    if (dela.podeEditar) {
      return '<p class="config-alerta suave">Este cadastro mora em ' + onde
        + '. O que você cadastrar ou editar aqui é gravado <strong>lá</strong>.</p>';
    }

    return '<p class="config-alerta">Este cadastro mora em ' + onde
      + ', e está <strong>só para leitura</strong>: faltam as colunas '
      + escapar(dela.faltaParaEditar.join(', ')) + ' na primeira linha daquela '
      + 'aba. Acrescente-as lá e o cadastro passa a ser editável por aqui.</p>';
  }

  function podeMexerNesta(aba) {
    if (!origem || !origem[aba]) return true;
    return origem[aba].podeEditar !== false;
  }

  function desligar() { SenhaDeAdministrador.fechar(); }

  return { montar: montar, ligar: ligar, desligar: desligar };
})();
</script>


<!-- ==== Importacao.html ==== -->
<script>

var TelaImportacao = (function () {

  var canalEscolhido = '';
  var pacoteDoSistema = null;
  var opcoes = null;
  var laudo = null;

  var envioDoLote = '';
  var resultado = null;

  var fonte = { tipo: 'colado', texto: '', planilhaId: '', aba: '' };
  var deParaEscolhido = null;
  var analistasMarcados = {};

  var colunaQueIdentifica = null;
  var nomeDoLote = '';

  var statusDoLote = null;

  var dataDeRecepcao = 'planilha';

  var oQueImportar = 'casos';
  var canalAceitaChat = false;
  function ehChat() { return oQueImportar === 'chat'; }
  function oQue(plural) {
    return ehChat() ? (plural ? 'atendimentos' : 'atendimento') : (plural ? 'casos' : 'caso');
  }

  function escapar(texto) { return Moldura.escapar(texto); }
  function elemento(id) { return document.getElementById(id); }

  function montar(pacote) {
    pacoteDoSistema = pacote;
    if (!canalEscolhido && pacote.canais.length) canalEscolhido = pacote.canais[0].id;
    return SeletorDeCanal.montar(pacote.canais, canalEscolhido)
      + '<div id="importacao"><p class="carregando-campos">'
      + 'Lendo as colunas do canal…</p></div>';
  }

  function carregar() {
    var caixa = elemento('importacao');
    if (caixa) {
      caixa.innerHTML = '<p class="carregando-campos">Lendo as colunas do canal…</p>';
    }
    Servidor.chamar('opcoesDaImportacaoDeCasos', canalEscolhido)
      .entao(function (resposta) {
        canalAceitaChat = resposta.aceitaChat === true;
        if (!canalAceitaChat) oQueImportar = 'casos';
        laudo = null;
        resultado = null;
        deParaEscolhido = null;
        if (!ehChat()) {
          opcoes = resposta;
          if (colunaQueIdentifica === null) {
            colunaQueIdentifica = resposta.repeticaoPadrao || '';
          }
          desenhar();
          return;
        }
        Servidor.chamar('opcoesDaImportacaoDoChat')
          .entao(function (doChat) { opcoes = doChat; desenhar(); })
          .senao(function (erro) {
            elemento('importacao').innerHTML = '<p class="carregando-campos erro-carga">'
              + escapar(erro.message || String(erro)) + '</p>';
          });
      })
      .senao(function (erro) {
        elemento('importacao').innerHTML = '<p class="carregando-campos erro-carga">'
          + escapar(erro.message || String(erro)) + '</p>';
      });
  }

  function desenhar() {
    elemento('importacao').innerHTML = resultado
      ? desenharResultado()
      : (desenharFonte() + (laudo ? desenharLaudo() : ''));
    ligar();
  }

  function desenharFonte() {
    var colado = fonte.tipo === 'colado';

    return escolhaDoQueImportar()
      + '<section class="cartaa importação-passo">'
      + '<header class="grafico-cabeca"><h3>1. De onde vêm os ' + oQue(true) + '</h3></header>'
      + (ehChat() && opcoes.abaExiste === false
        ? '<p class="aviso-janela">A aba ATENDIMENTOS_CHAT ainda não existe nesta planilha. '
          + 'Rode atualizarPGO() no editor do Apps Script antes de importar.</p>' : '')
      + (ehChat()
        ? '<p class="config-dica">Uma linha por atendimento. São obrigatórias a <strong>data'
          + '</strong> e o <strong>analista</strong>; SUSEP, corretora, assunto, consultor, '
          + 'vida individual ou em grupo, sucursal, tabulação, sub assunto e TMO (em segundos, '
          + 'como 1.152) são opcionais — o que a origem não trouxer fica em branco. A linha igual a uma que já entrou é '
          + 'pulada — importar a mesma planilha de novo não conta em dobro.</p>' : '')
      + '<div class="config-abas">'
      + '<button type="button" class="config-aba' + (colado ? ' atual' : '') + '"'
      + ' data-fonte="colado">Colar da planilha</button>'
      + '<button type="button" class="config-aba' + (colado ? '' : ' atual') + '"'
      + ' data-fonte="planilha">Ler outra planilha pelo link</button>'
      + '</div>'
      + (colado ? desenharColar() : desenharLink())
      + '<p class="config-dica">A primeira linha tem de ser a dos NOMES das '
      + 'colunas. É por ela que o sistema descobre para onde cada coluna vai. '
      + 'Até ' + opcoes.limite + ' linhas por vez.</p>'
      + '<div class="config-acoes">'
      + '<button type="button" class="botao" id="conferir-importacao">'
      + 'Conferir antes de importar</button></div>'
      + '</section>';
  }

  function escolhaDoQueImportar() {
    if (!canalAceitaChat) return '';
    return '<div class="config-abas" role="group" aria-label="O que importar">'
      + '<button type="button" class="config-aba' + (ehChat() ? '' : ' atual') + '"'
      + ' data-o-que-importar="casos">Casos do canal</button>'
      + '<button type="button" class="config-aba' + (ehChat() ? ' atual' : '') + '"'
      + ' data-o-que-importar="chat">Atendimentos do chat</button></div>';
  }

  function desenharColar() {
    return '<label class="campo largura-2"><span>Cole aqui, com o cabeçalho</span>'
      + '<textarea id="texto-colado" rows="8" spellcheck="false"'
      + ' placeholder="CPF&#9;Nome&#9;Produto&#10;12345678900&#9;Maria&#9;Vida Individual">'
      + escapar(fonte.texto) + '</textarea></label>';
  }

  function desenharLink() {
    return '<div class="grade">'
      + '<label class="campo"><span>Id da planilha</span>'
      + '<input type="text" id="planilha-id" value="' + escapar(fonte.planilhaId) + '"'
      + ' placeholder="o pedaço do endereço entre /d/ e /edit"></label>'
      + '<label class="campo"><span>Nome da aba</span>'
      + '<input type="text" id="planilha-aba" value="' + escapar(fonte.aba) + '"'
      + ' placeholder="em branco = a primeira aba"></label>'
      + '</div>'
      + '<p class="config-dica">A conta que abre o PGO precisa ter acesso a essa '
      + 'planilha. Se não tiver, o sistema diz isso em vez de importar pela metade.</p>';
  }

  function desenharLaudo() {
    return '<section class="cartaa importação-passo">'
      + '<header class="grafico-cabeca"><h3>2. Confira antes de gravar</h3></header>'
      + desenharContagem()
      + desenharDePara()
      + desenharAmostra()
      + desenharDestino()
      + '<div class="config-acoes">'
      + '<button type="button" class="botao" id="importar-agora"'
      + (laudo.vaoEntrar ? '' : ' disabled') + '>'
      + 'Importar ' + laudo.vaoEntrar + ' ' + oQue(false) + '(s)</button>'
      + '<button type="button" class="botao vazado" id="recomecar-do-laudo">'
      + 'Recomeçar</button></div>'
      + '</section>';
  }

  function desenharContagem() {
    var pulados = laudo.vaoSerPuladas
      ? '<div class="indicador tom-atencao" title="'
        + laudo.motivosParaPular.vazia + ' em branco, '
        + laudo.motivosParaPular.repetida + ' repetidas">'
        + '<span class="rotulo">Vão ser puladas'
        + '</span><strong class="numero">' + laudo.vaoSerPuladas + '</strong>'
        + '</div>'
      : '';

    return '<div class="cartoes">'
      + '<div class="indicador tom-neutro"><span class="rotulo">Linhas na origem'
      + '</span><strong class="numero">' + laudo.linhasNaFonte + '</strong></div>'
      + '<div class="indicador tom-bom"><span class="rotulo">Vão entrar</span>'
      + '<strong class="numero">' + laudo.vaoEntrar + '</strong></div>'
      + pulados
      + (laudo.premios || []).map(function (premio) {
        return '<div class="indicador tom-neutro" title="Soma da coluna &quot;'
          + escapar(premio.coluna) + '&quot; dos ' + premio.casos + ' caso(s) que vão entrar e '
          + 'trazem o valor"><span class="rotulo">' + escapar(premio.rotulo) + ' importado'
          + '</span><strong class="numero">' + emReais(premio.total) + '</strong></div>';
      }).join('')
      + '</div>'
      + porQueRepetem(laudo.motivosParaPular, 'vão ficar de fora')
      + (laudo.passaDoLimite
        ? '<p class="aviso-janela">São ' + laudo.linhasNaFonte + ' linhas, e o '
          + 'limite é ' + laudo.limite + '. Divida em levas: se o mapeamento '
          + 'estiver errado, o estrago é menor.</p>'
        : '');
  }

  function desenharDePara() {
    var atual = deParaEscolhido || laudo.dePara;

    return '<h4 class="importacao-titulo">Para onde vai cada coluna</h4>'
      + '<table class="fila importacao-depara"><thead><tr>'
      + '<th>Na planilha de origem</th><th>Vai para esta coluna do canal</th>'
      + '</tr></thead><tbody>'
      + atual.map(function (par, i) {
        return '<tr><td><code>' + escapar(par.daFonte || '(sem nome)') + '</code></td>'
