  function desenharPainelDaMesa(mesa) {
    if (!mesa) return painelVazio('Escolha uma mesa.');
    var colunas = [''].concat(mesa.colunasDaBase);

    elemento('config-painel').innerHTML = '<form class="config-form" id="form-mesa">'
      + tituloDoPainel(mesa.nome, 'Aba ' + mesa.aba)
      + campoDeTexto('nome', 'Nome da mesa', mesa.nome, '')
      + campoDeTexto('descricao', 'Descrição', mesa.descricao, '')
      + caixaDeOpcoes('colunaDaData', 'Coluna da data de entrada', colunas,
        mesa.colunaDaData,
        'É daqui que sai a "data do último registro" da barra superior.')
      + caixaDeOpcoes('colunaDaHora', 'Coluna da hora', colunas, mesa.colunaDaHora, '')
      + caixaDeOpcoes('colunaDoStatus', 'Coluna da situação', colunas,
        mesa.colunaDoStatus, 'É por ela que os cartões do painel contam.')
      + campoDeTexto('colunasDaFila', 'Colunas da fila', mesa.colunasDaFila,
        'Grupos separados por ponto e vírgula: "Título: coluna, coluna". '
        + 'Sem os dois-pontos, cada coluna vira uma coluna da tabela.')
      + campoDeTexto('colunasDaBusca', 'Colunas em que a busca procura',
        mesa.colunasDaBusca,
        'Separadas por vírgula. Só estas são lidas ao procurar — é o que faz '
        + 'a busca não estourar numa base grande.')
      + campoDeTexto('metaMensalPorPessoa', 'Meta de casos por pessoa, no mês',
        mesa.metaMensalPorPessoa,
        'Aparece em Minha Performance como barra de progresso. Zero desliga: '
        + 'mesa sem meta não inventa uma.')
      + caixaDeOpcoes('colunaDaFinalizacao', 'Coluna da finalização', colunas,
        mesa.colunaDaFinalizacao, '')
      + caixaDeOpcoes('colunaDaAreaResponsavel', 'Coluna da área responsável',
        colunas, mesa.colunaDaAreaResponsavel, '')
      + campoDeTexto('ordem', 'Ordem no seletor', mesa.ordem, '')
      + caixaDeSimNao('ativo', 'Mesa em uso', mesa.ativo)
      + (mesa.situacoes.length
        ? '<p class="config-explica">Situações cadastradas nesta mesa: '
          + escapar(mesa.situacoes.join(', ')) + '.</p>'
        : '')
      + '<div class="config-acoes">'
      + '<button type="submit" class="botao">Salvar</button></div></form>';

    elemento('form-mesa').addEventListener('submit', function (evento) {
      evento.preventDefault();
      Servidor.chamar('salvarMesa', {
        id: mesa.id,
        nome: valorDe('nome'),
        descricao: valorDe('descricao'),
        colunaDaData: valorDe('colunaDaData'),
        colunaDaHora: valorDe('colunaDaHora'),
        colunaDoStatus: valorDe('colunaDoStatus'),
        colunasDaFila: valorDe('colunasDaFila'),
        colunasDaBusca: valorDe('colunasDaBusca'),
        metaMensalPorPessoa: valorDe('metaMensalPorPessoa'),
        colunaDaFinalizacao: valorDe('colunaDaFinalizacao'),
        colunaDaAreaResponsavel: valorDe('colunaDaAreaResponsavel'),
        ordem: valorDe('ordem'),
        ativo: marcado('ativo')
      }).entao(function () { avisarSalvo(); carregarMesas(); })
        .senao(mostrarErroNoPainel);
    });
  }

  /* -------------------------------------------------------------- painéis */

  var mesaDosCards = '';
  var telaDosPaineis = 'dashboard';   // 'dashboard' ou 'painelAnalitico'
  var cardsEmEdicao = null;           // a lista sendo mexida, antes de salvar

  function carregarPaineis() {
    if (!mesaDosCards) mesaDosCards = mesaEscolhida;
    if (telaDosPaineis === 'painelAnalitico') return carregarGraficos();

    aguarde('Lendo os cards…');
    Servidor.chamar('listarCardsDoPainel', 'dashboard', mesaDosCards)
      .entao(function (resposta) {
        dados.painel = resposta;
        cardsEmEdicao = resposta.cartoes.map(copiarCard);
        desenharPaineis();
      })
      .senao(falhou);
  }

  function carregarGraficos() {
    aguarde('Lendo os gráficos…');
    Servidor.chamar('opcoesDoPainelAnalitico', mesaDosCards)
      .entao(function (opcoes) {
        dados.opcoesDoGrafico = opcoes;
        Servidor.chamar('listarComponentesDoPainel', mesaDosCards)
          .entao(function (lista) {
            cardsEmEdicao = lista.map(copiarGrafico);
            desenharGraficos();
          })
          .senao(falhou);
      })
      .senao(falhou);
  }

  function copiarGrafico(grafico) {
    return {
      id: grafico.id || '', titulo: grafico.titulo, tipo: grafico.tipo,
      dimensao: grafico.dimensao, medida: grafico.medida,
      agregacao: grafico.agregacao, limite: grafico.limite,
      largura: grafico.largura, mostrar: grafico.mostrar !== false
    };
  }

  /** As duas telas que têm componentes configuráveis. */
  function escolhaDeTela() {
    return '<div class="config-abas">'
      + [['dashboard', 'Cards do Dashboard'],
         ['painelAnalitico', 'Gráficos do Painel Analítico']]
        .map(function (par) {
          return '<button type="button" class="config-aba'
            + (telaDosPaineis === par[0] ? ' atual' : '') + '"'
            + ' data-tela-do-painel="' + par[0] + '">'
            + escapar(par[1]) + '</button>';
        }).join('') + '</div>';
  }

  /*
    Os ids daqui são "-graficos", e os do editor de cards são "-cards", ainda
    que os dois nunca apareçam juntos: um substitui o outro dentro do mesmo
    config-lista. É o achado 21 outra vez, prevenido em vez de consertado —
    dois editores compartilhando id é elemento('salvar-cards') encontrando o
    do outro no dia em que alguém colocar os dois na tela.
  */
  function desenharGraficos() {
    if (respostaAtrasada('paineis')) return;
    var opcoes = dados.opcoesDoGrafico;

    elemento('config-lista').innerHTML = '<div class="config-cabeca">'
      + '<span class="config-titulo">Gráficos do Painel Analítico</span></div>'
      + escolhaDeTela()
      + '<p class="config-explica">Cada gráfico responde a <strong>uma</strong> '
      + 'pergunta. Gráfico que não responde pergunta nenhuma é enfeite, e '
      + 'enfeite numa tela de trabalho é ruído. A pizza é boa para "de que '
      + 'tipo são", de relance e com poucas fatias; para comparar valores '
      + 'próximos, barras. Nome comprido pede barra deitada.</p>'
      + '<div class="config-mesas-cartao">' + escolhaDeMesa() + '</div>'
      + '<div id="lista-de-graficos">' + desenharCardsDeGrafico() + '</div>'
      + '<div class="config-acoes">'
      + '<button type="button" class="botao vazado" id="add-grafico">'
      + '+ Adicionar gráfico</button>'
      + '<button type="button" class="botao" id="salvar-graficos">'
      + '✓ Salvar gráficos</button>'
      + '<button type="button" class="botao-texto" id="descartar-graficos">'
      + '↺ Descartar alterações</button>'
      + '</div>';

    painelVazio('Os gráficos somam só os casos que a pessoa pode ver. Quem '
      + 'enxerga apenas os próprios casos vê os números dela, no mesmo gráfico.');
    ligarGraficos();
  }

  function desenharCardsDeGrafico() {
    var opcoes = dados.opcoesDoGrafico;
    if (!cardsEmEdicao.length) {
      return '<p class="config-vazio">Nenhum gráfico nesta mesa. O Painel '
        + 'Analítico abre dizendo isso, em vez de abrir vazio.</p>';
    }

    return cardsEmEdicao.map(function (grafico, posicao) {
      var precisaDeMedida = grafico.agregacao !== 'contagem';
      return '<div class="card-editavel">'
        + '<div class="card-linha">'
        + '<label class="config-campo"><span>Título</span>'
        + '<input type="text" data-card="' + posicao + '" data-parte="titulo"'
        + ' value="' + escapar(grafico.titulo) + '"></label>'
        + caixaSimples(posicao, 'tipo', 'Tipo de gráfico',
          opcoes.tipos.map(function (tipo) {
            return { valor: tipo.chave, rotulo: tipo.rotulo };
          }), grafico.tipo)
        + '</div>'
        + '<div class="card-linha">'
        + caixaSimples(posicao, 'dimensao', 'Agrupar por',
          opcoes.dimensoes.map(function (nome) {
            return { valor: nome, rotulo: nome };
          }), grafico.dimensao)
        + caixaSimples(posicao, 'agregacao', 'O que medir',
          opcoes.agregacoes.map(function (uma) {
            return { valor: uma.chave, rotulo: uma.rotulo };
          }), grafico.agregacao)
        + '</div>'
        + (precisaDeMedida
          ? '<div class="card-linha">'
            + caixaSimples(posicao, 'medida', 'Coluna do valor',
              opcoes.medidas.map(function (nome) {
                return { valor: nome, rotulo: nome };
              }), grafico.medida)
            + '<span></span></div>'
          : '')
        + '<div class="card-linha">'
        + '<label class="config-campo"><span>Mostrar no máximo</span>'
        + '<input type="text" data-card="' + posicao + '" data-parte="limite"'
        + ' value="' + (grafico.limite || '') + '" placeholder="todos">'
        + '<em>O resto vira uma fatia só, "Demais valores"'
        + (grafico.tipo === 'pizza'
          ? '. A pizza aceita no máximo ' + opcoes.maximoDeFatias + '.' : '.')
        + '</em></label>'
        + caixaSimples(posicao, 'largura', 'Tamanho na tela',
          [{ valor: '1', rotulo: 'Metade da linha' },
           { valor: '2', rotulo: 'Linha inteira' }], String(grafico.largura))
        + '</div>'
        + '<div class="card-linha rodape">'
        + '<label class="config-chave">'
        + '<input type="checkbox" data-card="' + posicao + '" data-parte="mostrar"'
        + (grafico.mostrar ? ' checked' : '') + '><span>Mostrar</span></label>'
        + '<button type="button" class="botao-texto perigo" data-remover-card="'
        + posicao + '">✕ Remover</button>'
        + '</div></div>';
    }).join('');
  }

  function caixaSimples(posicao, parte, rotulo, opcoes, escolhido) {
    return '<label class="config-campo"><span>' + escapar(rotulo) + '</span>'
      + '<select data-card="' + posicao + '" data-parte="' + parte + '">'
      + opcoes.map(function (opcao) {
        return '<option value="' + escapar(opcao.valor) + '"'
          + (String(opcao.valor) === String(escolhido) ? ' selected' : '') + '>'
          + escapar(opcao.rotulo) + '</option>';
      }).join('') + '</select></label>';
  }

  function ligarGraficos() {
    ligarTrocaDeTelaEDeMesa();

    ligarCliques('[data-remover-card]', function (botao) {
      cardsEmEdicao.splice(Number(botao.getAttribute('data-remover-card')), 1);
      elemento('lista-de-graficos').innerHTML = desenharCardsDeGrafico();
      ligarGraficos();
    });

    var caixas = document.querySelectorAll('#lista-de-graficos [data-parte]');
    for (var i = 0; i < caixas.length; i++) {
      caixas[i].addEventListener('change', function () {
        var grafico = cardsEmEdicao[Number(this.getAttribute('data-card'))];
        var parte = this.getAttribute('data-parte');
        if (parte === 'mostrar') grafico.mostrar = this.checked;
        else if (parte === 'limite') grafico.limite = Number(this.value) || 0;
        else if (parte === 'largura') grafico.largura = Number(this.value);
        else grafico[parte] = this.value;
        // Trocar a medição faz aparecer ou sumir a coluna do valor, e trocar
        // o tipo muda a dica do limite: redesenhamos para a tela não mentir.
        if (parte === 'agregacao' || parte === 'tipo') {
          elemento('lista-de-graficos').innerHTML = desenharCardsDeGrafico();
          ligarGraficos();
        }
      });
    }

    elemento('add-grafico').addEventListener('click', function () {
      var opcoes = dados.opcoesDoGrafico;
      cardsEmEdicao.push({
        id: '', titulo: 'Novo gráfico', tipo: 'barras',
        dimensao: opcoes.dimensoes[0] || '', medida: '',
        agregacao: 'contagem', limite: 6, largura: 1, mostrar: true
      });
      elemento('lista-de-graficos').innerHTML = desenharCardsDeGrafico();
      ligarGraficos();
    });

    elemento('descartar-graficos').addEventListener('click', carregarPaineis);

    elemento('salvar-graficos').addEventListener('click', function () {
      Servidor.chamar('salvarComponentesDoPainel', mesaDosCards, cardsEmEdicao)
        .entao(function () { avisarSalvo('Gráficos salvos.'); carregarPaineis(); })
        .senao(function (erro) { avisar(erro.message || String(erro), 'ruim'); });
    });
  }

  function ligarTrocaDeTelaEDeMesa() {
    ligarCliques('[data-tela-do-painel]', function (botao) {
      telaDosPaineis = botao.getAttribute('data-tela-do-painel');
      carregarPaineis();
    });
    ligarCliques('[data-mesa-dos-cards]', function (botao) {
      mesaDosCards = botao.getAttribute('data-mesa-dos-cards');
      carregarPaineis();
    });
  }

  function copiarCard(card) {
    return {
      id: card.id || '', titulo: card.titulo, dimensao: card.dimensao,
      filtro: card.filtro, cor: card.cor, mostrar: card.mostrar !== false
    };
  }

  function desenharPaineis() {
    if (respostaAtrasada('paineis')) return;
    elemento('config-lista').innerHTML = '<div class="config-cabeca">'
      + '<span class="config-titulo">Cards da operação</span></div>'
      + escolhaDeTela()
      + '<p class="config-explica">Escolha os cards do Dashboard. '
      + 'Até ' + dados.painel.maximo + ' cards por operação. Remover ou '
      + 'ocultar um card <strong>mantém os casos</strong> — o card é uma forma '
      + 'de contar, e apagar a conta não apaga o que foi contado. As contagens '
      + 'seguem o acesso de cada pessoa. Alterações só entram em vigor ao '
      + 'salvar.</p>'
      + '<div class="config-mesas-cartao">' + escolhaDeMesa() + '</div>'
      + '<div id="lista-de-cards">' + desenharCards() + '</div>'
      + '<div class="config-acoes">'
      + '<button type="button" class="botao vazado" id="add-card">'
      + '+ Adicionar card</button>'
      + '<button type="button" class="botao" id="salvar-cards">'
      + '✓ Salvar cards</button>'
      + '<button type="button" class="botao-texto" id="descartar-cards">'
      + '↺ Descartar alterações</button>'
      + '</div>';

    painelVazio('Os cards contam os casos que a pessoa pode ver. Quem enxerga '
      + 'só os próprios casos vê os números dela, no mesmo card.');
    ligarPaineis();
  }

  /** As mesas como dois blocos grandes, e não como uma caixa de seleção. */
  function escolhaDeMesa() {
    return pacoteDoSistema.mesas.map(function (mesa) {
      return '<button type="button" class="mesa-cartao'
        + (mesa.id === mesaDosCards ? ' atual' : '') + '"'
        + ' data-mesa-dos-cards="' + escapar(mesa.id) + '">'
        + SeletorDeMesa.icone(mesa.icone)
        + '<span><strong>' + escapar(mesa.nome) + '</strong>'
        + '<em>' + escapar(mesa.descricao || '') + '</em></span></button>';
    }).join('');
  }

  function desenharCards() {
    if (!cardsEmEdicao.length) {
      return '<p class="config-vazio">Nenhum card nesta operação. O Dashboard '
        + 'mostra a fila, e nenhum número em cima dela.</p>';
    }
    return cardsEmEdicao.map(function (card, posicao) {
      return '<div class="card-editavel">'
        + '<div class="card-linha">'
        + '<label class="config-campo"><span>Nome do card</span>'
        + '<input type="text" data-card="' + posicao + '" data-parte="titulo"'
        + ' value="' + escapar(card.titulo) + '"></label>'
        + '<label class="config-campo"><span>O que contar</span>'
        + '<select data-card="' + posicao + '" data-parte="contar">'
        + dados.painel.oQueContar.map(function (opcao, i) {
          var escolhido = opcao.chave === card.dimensao
            && (opcao.chave !== 'situacao'
              || normalizarTexto(opcao.filtro) === normalizarTexto(card.filtro));
          return '<option value="' + i + '"' + (escolhido ? ' selected' : '') + '>'
            + escapar(opcao.rotulo) + '</option>';
        }).join('') + '</select></label>'
        + '</div>'
        + '<div class="card-linha">'
        + '<label class="config-campo"><span>Cor</span>'
        + '<div class="tira-de-tons">'
        + dados.painel.tons.map(function (tom) {
          return '<button type="button" class="tom-escolha tom-' + escapar(tom) + '"'
            + (tom === card.cor ? ' aria-pressed="true"' : ' aria-pressed="false"')
            + ' data-card="' + posicao + '" data-parte="cor" data-tom="'
            + escapar(tom) + '" title="' + escapar(tom) + '"></button>';
        }).join('') + '</div></label>'
        + '<label class="config-campo"><span>Ordem</span>'
        + '<input type="text" value="' + (posicao + 1) + '" readonly></label>'
        + '</div>'
        + '<div class="card-linha rodape">'
        + '<label class="config-chave">'
        + '<input type="checkbox" data-card="' + posicao + '" data-parte="mostrar"'
        + (card.mostrar ? ' checked' : '') + '><span>Mostrar</span></label>'
        + '<button type="button" class="botao-texto perigo" data-remover-card="'
        + posicao + '">✕ Remover</button>'
        + '</div></div>';
    }).join('');
  }

  function normalizarTexto(valor) {
    return String(valor === null || valor === undefined ? '' : valor)
      .normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase().trim();
  }

  function ligarPaineis() {
    ligarTrocaDeTelaEDeMesa();

    ligarCliques('[data-remover-card]', function (botao) {
      cardsEmEdicao.splice(Number(botao.getAttribute('data-remover-card')), 1);
      redesenharCards();
    });

    ligarCliques('[data-parte="cor"]', function (botao) {
      cardsEmEdicao[Number(botao.getAttribute('data-card'))].cor =
        botao.getAttribute('data-tom');
      redesenharCards();
    });

    var caixas = document.querySelectorAll(
      '[data-parte="titulo"], [data-parte="contar"], [data-parte="mostrar"]');
    for (var i = 0; i < caixas.length; i++) {
      caixas[i].addEventListener('change', function () {
        var card = cardsEmEdicao[Number(this.getAttribute('data-card'))];
        var parte = this.getAttribute('data-parte');
        if (parte === 'titulo') card.titulo = this.value;
        if (parte === 'mostrar') card.mostrar = this.checked;
        if (parte === 'contar') {
          var opcao = dados.painel.oQueContar[Number(this.value)];
          card.dimensao = opcao.chave;
          card.filtro = opcao.filtro;
        }
      });
    }

    elemento('add-card').addEventListener('click', function () {
      if (cardsEmEdicao.length >= dados.painel.maximo) {
        return avisar('São no máximo ' + dados.painel.maximo + ' cards por '
          + 'operação. Acima disso a tela vira uma parede de números.', 'ruim');
      }
      var primeira = dados.painel.oQueContar[0];
      cardsEmEdicao.push({ id: '', titulo: 'Novo card',
        dimensao: primeira.chave, filtro: primeira.filtro,
        cor: 'neutro', mostrar: true });
      redesenharCards();
    });

    elemento('descartar-cards').addEventListener('click', carregarPaineis);

    elemento('salvar-cards').addEventListener('click', function () {
      Servidor.chamar('salvarCardsDoPainel', 'dashboard', mesaDosCards,
        cardsEmEdicao)
        .entao(function () { avisarSalvo('Cards salvos.'); carregarPaineis(); })
        .senao(function (erro) { avisar(erro.message || String(erro), 'ruim'); });
    });
  }

  /** Redesenha só a lista: a explicação e os botões não mudaram. */
  function redesenharCards() {
    elemento('lista-de-cards').innerHTML = desenharCards();
    ligarPaineis();
  }

  /* --------------------------------------------------- identidade e senha */

  function desenharIdentidade() {
    var identidade = resumo.identidade;

    elemento('config-lista').innerHTML = '<div class="config-cabeca">'
      + '<span class="config-titulo">Identidade da operação</span></div>'
      + '<p class="config-explica">O sistema é a plataforma; a operação é quem '
      + 'a usa. Trocar estes campos é o que faz o mesmo produto atender outra '
      + 'operação sem uma linha de código.</p>'
      + '<form class="config-form larga" id="form-identidade">'
      + campoDeTexto('nome', 'Nome curto', identidade.nome,
        'Aparece na barra superior e no título da janela.')
      + campoDeTexto('nomeLongo', 'Nome por extenso', identidade.nomeLongo, '')
      + campoDeTexto('operacao', 'Operação', identidade.operacao,
        'Assina a tela de quem não está cadastrado.')
      + campoDeTexto('frase', 'Frase de abertura', identidade.frase,
        'Aparece no painel azul da tela de quem não está cadastrado.')
      + campoDeTexto('corPrimaria', 'Cor da operação', identidade.corPrimaria,
        'No formato #RRGGBB. Vale só no tema padrão — os outros três têm a '
        + 'paleta deles.')
      + campoDeTexto('plataforma', 'Plataforma', identidade.plataforma, '')
      + campoDeTexto('fabricante', 'Fabricante', identidade.fabricante, '')
      + campoDeTexto('logo', 'Logo', identidade.logo,
        'Endereço https:// de uma imagem, ou a própria imagem em texto '
        + '(data:image/…). Vazio deixa o nome da operação assinar sozinho.')
      + '<div class="escolher-arquivo">'
      + '<input type="file" id="arquivo-da-logo" accept="image/png,image/jpeg,'
      + 'image/svg+xml,image/webp">'
      + '<button type="button" class="botao vazado" id="escolher-logo">'
      + 'Escolher a imagem no computador</button>'
      + '<span class="config-explica" style="margin:0">'
      + 'A imagem é embutida no sistema, sem depender de nenhum site.</span>'
      + '<div class="previa-da-logo" id="previa-da-logo"'
      + (identidade.logo ? '' : ' hidden') + '>'
      + (identidade.logo
        ? '<img src="' + escapar(identidade.logo) + '" alt="Logo atual">' : '')
      + '</div></div>'
      + '<div class="config-acoes">'
      + '<button type="submit" class="botao">Salvar identidade</button>'
      + '</div></form>';

    // Escolher o arquivo converte a imagem para texto e enche o campo. Assim
    // a logo não depende de nenhum site continuar no ar — ela passa a morar
    // na própria planilha, junto do resto da identidade.
    elemento('escolher-logo').addEventListener('click', function () {
      elemento('arquivo-da-logo').click();
    });
    elemento('arquivo-da-logo').addEventListener('change', function () {
      var arquivo = this.files && this.files[0];
      if (!arquivo) return;

      // Uma imagem grande demais estoura a célula da planilha (50 mil
      // caracteres). Avisamos antes, em vez de deixar a gravação falhar.
      if (arquivo.size > 32 * 1024) {
        return avisar('A imagem tem ' + Math.round(arquivo.size / 1024)
          + ' KB. A logo entra dentro da planilha, e ali cabem cerca de 32 KB. '
          + 'Salve uma versão menor — uma logo de barra superior costuma ter '
          + 'menos de 10 KB.', 'ruim');
      }

      var leitor = new FileReader();
      leitor.onload = function () {
        elemento('cfg-logo').value = leitor.result;
        var previa = elemento('previa-da-logo');
        previa.innerHTML = '<img src="' + escapar(leitor.result)
          + '" alt="Logo escolhida">';
        previa.hidden = false;
        avisar('Imagem carregada. Aperte Salvar identidade para valer.', 'bom');
      };
      leitor.onerror = function () {
        avisar('Não consegui ler esse arquivo.', 'ruim');
      };
      leitor.readAsDataURL(arquivo);
    });

    elemento('form-identidade').addEventListener('submit', function (evento) {
      evento.preventDefault();
      var logo = valorDe('logo');
      Servidor.chamar('salvarIdentidade', {
        nome: valorDe('nome'),
        nomeLongo: valorDe('nomeLongo'),
        operacao: valorDe('operacao'),
        corPrimaria: valorDe('corPrimaria'),
        plataforma: valorDe('plataforma'),
        fabricante: valorDe('fabricante'),
        frase: valorDe('frase')
      }).entao(function (nova) {
        resumo.identidade = nova;
        Servidor.chamar('definirLogo', logo)
          .entao(function () {
            avisarSalvo('Identidade salva. Recarregue para ver a barra nova.');
          })
          .senao(mostrarErroNoPainel);
      }).senao(mostrarErroNoPainel);
    });

    desenharSenha();
  }

  function desenharSenha() {
    elemento('config-painel').innerHTML = '<form class="config-form" id="form-senha">'
      + tituloDoPainel('Senha de administrador',
        resumo.senhaDefinida ? 'Definida' : 'Ainda não definida')
      + '<p class="config-explica">Ela não é a sua senha de entrada — quem faz '
      + 'isso é a conta Google. Esta senha guarda as ações que não têm '
      + 'desfazer, como criar coluna na planilha. Libera por 5 minutos; três '
      + 'erros trancam por 24 horas.</p>'
      + (resumo.senhaDefinida
        ? campoDeSenha('atual', 'Senha atual', '') : '')
      + campoDeSenha('nova', 'Senha nova', 'No mínimo 8 caracteres.')
      + '<div class="config-acoes">'
      + '<button type="submit" class="botao">'
      + (resumo.senhaDefinida ? 'Trocar senha' : 'Definir senha') + '</button>'
      + '</div></form>';

    elemento('form-senha').addEventListener('submit', function (evento) {
      evento.preventDefault();
      Servidor.chamar('definirSenhaDeAdministrador',
        valorDe('nova'), resumo.senhaDefinida ? valorDe('atual') : '')
        .entao(function () {
          resumo.senhaDefinida = true;
          avisarSalvo('Senha guardada.');
          desenharSenha();
        })
        .senao(mostrarErroNoPainel);
    });
  }

  /* ------------------------------------------------- estrutura e auditoria */

  /* ---------------------------------------------------------- análises */
  /*
    A receita e a aba são coisas separadas, e a tela mostra as duas: à
    esquerda o que foi montado, e ao lado de cada uma o estado da aba gerada
    — "nunca gerada", ou "gerada ontem às 14h, 1.204 linhas". Só "existe" não
    responde a pergunta que a operação faz, que é se o número está velho.
  */

  function carregarAnalises() {
    aguarde('Lendo as análises…');
    Servidor.chamar('opcoesDeAnalise')
      .entao(function (opcoes) {
        dados.opcoes = opcoes;
        Servidor.chamar('listarAnalises')
          .entao(function (lista) {
            dados.analises = lista;
            desenharAnalises();
          })
          .senao(falhou);
      })
      .senao(falhou);
  }

  function desenharAnalises() {
    if (respostaAtrasada('analises')) return;
    var linhas = dados.analises.map(function (uma) {
      return '<li class="config-item'
        + (escolhido && escolhido.id === uma.id ? ' atual' : '')
        + (uma.ativo ? '' : ' desligado') + '">'
        + '<button type="button" class="abrir" data-analise="'
        + escapar(uma.id) + '">'
        + '<span class="nome">' + escapar(uma.aba) + '</span>'
        + '<span class="detalhe">' + escapar(uma.mesaNome)
        + (uma.abaExiste
          ? ' · gerada em ' + escapar(uma.geradaEm) + ' · '
            + uma.linhasGeradas + ' linha(s)'
          : ' · nunca gerada')
        + (uma.ativo ? '' : ' · desligada')
        + '</span></button></li>';
    }).join('');

    elemento('config-lista').innerHTML = '<div class="config-cabeca">'
      + '<span class="config-titulo">' + dados.analises.length
      + ' análise(s)</span>'
      + '<button type="button" class="botao pequeno" id="nova-analise">'
      + 'Montar análise</button></div>'
      + '<p class="config-explica">Cada análise vira uma aba <code>'
      + escapar(dados.opcoes.prefixo) + '&lt;Nome&gt;</code> na planilha, com '
      + 'os dados achatados — pronta para tabela dinâmica ou para o Power BI '
      + 'apontar. É um <strong>retrato</strong>: vale o que valia na hora em '
      + 'que foi gerada, e não se atualiza sozinha.</p>'
      + '<p class="config-explica">Para atualizar sem clicar, aponte um '
      + 'acionador de tempo no editor do Apps Script para a função '
      + '<code>atualizarAnalisesAgendadas</code>.</p>'
      + (dados.analises.length
        ? '<ul class="config-itens">' + linhas + '</ul>'
        : '<p class="config-vazio">Nenhuma análise montada.</p>');

    elemento('nova-analise').addEventListener('click', function () {
      escolhido = null;
      desenharPainelDaAnalise(null);
    });
    ligarCliques('[data-analise]', function (botao) {
      escolhido = { id: botao.getAttribute('data-analise') };
      desenharAnalises();
    });

    if (escolhido) {
      desenharPainelDaAnalise(acharNaLista(dados.analises, escolhido.id));
    } else {
      painelVazio('Escolha uma análise, ou monte uma nova.');
    }
  }

  function mesaDaAnalise(idDaMesa) {
    var achada = dados.opcoes.mesas.filter(function (uma) {
      return String(uma.id) === String(idDaMesa);
    })[0];
    return achada || dados.opcoes.mesas[0];
  }

  function desenharPainelDaAnalise(analise) {
    var atual = analise || {
      id: '', nome: '', descricao: '', mesaId: dados.opcoes.mesas[0].id,
      colunas: [], filtros: [], dias: 0, ativo: true, abaExiste: false
    };
    var mesa = mesaDaAnalise(atual.mesaId);

    elemento('config-painel').innerHTML = '<form class="config-form" id="form-analise">'
      + tituloDoPainel(atual.id ? atual.aba : 'Nova análise',
        atual.id ? 'A aba é reescrita a cada geração' : 'O nome vira o nome da aba')
      + campoDeTexto('an-nome', 'Nome', atual.nome,
        'Só letras sem acento, números e _. Vira ' + dados.opcoes.prefixo + 'Nome.')
      + campoDeTexto('an-descricao', 'Para que serve', atual.descricao, '')
      + caixaDeItens('an-mesa', 'Mesa', dados.opcoes.mesas, atual.mesaId,
        'Trocar a mesa limpa as colunas e os filtros.')
      + campoDeTexto('an-dias', 'Últimos N dias', atual.dias,
        mesa.temColunaDeData
          ? '0 traz tudo. Conta pela coluna "' + mesa.colunaDaData + '".'
          : 'Esta mesa não tem coluna de data, então a janela não se aplica.')
      + '<div class="config-campo"><span>Colunas</span>'
      + '<div class="config-marcadores" id="colunas-da-analise">'
      + mesa.colunas.map(function (coluna, i) {
        var marcada = !atual.colunas.length || atual.colunas.indexOf(coluna) >= 0;
        return '<label class="config-chave"><input type="checkbox"'
          + ' data-coluna-analise="' + i + '" value="' + escapar(coluna) + '"'
          + (marcada ? ' checked' : '') + '><span>' + escapar(coluna)
          + '</span></label>';
      }).join('')
      + '</div><em>Nenhuma marcada é o mesmo que todas.</em></div>'
      + '<div class="config-campo"><span>Filtros</span>'
      + '<div id="filtros-da-analise">' + desenharFiltrosDaAnalise(mesa, atual.filtros)
      + '</div><em>Cada filtro corta as linhas. Dois filtros se somam.</em></div>'
      + caixaDeSimNao('an-ativo', 'Ligada', atual.ativo !== false)
      + '<div class="config-acoes">'
      + '<button type="submit" class="botao">Salvar receita</button>'
      + (atual.id
        ? '<button type="button" class="botao vazado" id="gerar-analise">'
          + (atual.abaExiste ? 'Regerar a aba' : 'Gerar a aba') + '</button>'
          + '<button type="button" class="botao vazado perigo" id="tirar-analise">'
          + 'Tirar da lista</button>'
        : '')
      + '</div>'
      + (atual.abaExiste
        ? '<p class="config-explica">Regerar apaga o retrato de agora, e por '
          + 'isso pede a senha de administrador. A aba é reaproveitada, nunca '
          + 'apagada e recriada: apagar mudaria o identificador dela, e todo '
          + 'Power BI apontado para essa aba perderia o alvo em silêncio.</p>'
        : '')
      + '</form>';

    elemento('cfg-an-mesa').addEventListener('change', function () {
      escolhido = atual.id ? { id: atual.id } : null;
      // Escrito campo a campo, e não com Object.assign: assim dá para ver de
      // relance o que SOBREVIVE à troca de mesa e o que é zerado. Colunas e
      // filtros são de uma mesa só — carregá-los para outra deixaria a receita
      // apontando para colunas que a nova mesa não tem.
      desenharPainelDaAnalise({
        id: atual.id,
        nome: atual.nome,
        descricao: atual.descricao,
        dias: atual.dias,
        ativo: atual.ativo,
        aba: atual.aba,
        abaExiste: atual.abaExiste,
        mesaId: this.value,
        colunas: [],
        filtros: []
      });
    });

    elemento('form-analise').addEventListener('submit', function (evento) {
      evento.preventDefault();
      Servidor.chamar('salvarAnalise', {
        id: atual.id, nome: valorDe('an-nome'),
        descricao: valorDe('an-descricao'), mesaId: valorDe('an-mesa'),
        colunas: colunasMarcadasDaAnalise(mesa).join(','),
        filtros: filtrosEscolhidosDaAnalise(),
        dias: Number(valorDe('an-dias')) || 0,
        ativo: elemento('cfg-an-ativo').checked
      }).entao(function (id) {
        escolhido = { id: id };
        avisarSalvo('Receita salva. A aba só muda quando você gerar.');
        carregarAnalises();
      }).senao(function (erro) { avisar(erro.message || String(erro), 'ruim'); });
    });

    var gerar = elemento('gerar-analise');
    if (gerar) {
      gerar.addEventListener('click', function () {
        // Só a REgeração pede senha, e quem decide isso é o servidor. A tela
        // pede antes só quando sabe que a aba existe, para não abrir um
        // diálogo desnecessário na primeira geração.
        if (atual.abaExiste) {
          SenhaDeAdministrador.pedir(function () { gerarAgora(atual.id); });
        } else {
          gerarAgora(atual.id);
        }
      });
    }

    var tirar = elemento('tirar-analise');
    if (tirar) {
      tirar.addEventListener('click', function () {
        if (!window.confirm('Tirar "' + atual.nome + '" da lista? A aba '
          + atual.aba + ' continua na planilha.')) return;
        Servidor.chamar('ocultarAnalise', atual.id)
          .entao(function () {
            escolhido = null;
            avisarSalvo('Análise tirada da lista.');
            carregarAnalises();
          })
          .senao(function (erro) { avisar(erro.message || String(erro), 'ruim'); });
      });
    }
  }

  function gerarAgora(id) {
    avisar('Gerando a aba…', 'neutro');
    Servidor.chamar('gerarAnalise', id)
      .entao(function (feito) {
        avisarSalvo(feito.aba + ': ' + feito.linhas + ' linha(s) e '
          + feito.colunas + ' coluna(s).'
          + (feito.truncada ? ' A análise passou do teto e foi cortada.' : ''));
        carregarAnalises();
      })
      .senao(function (erro) { avisar(erro.message || String(erro), 'ruim'); });
  }

  function desenharFiltrosDaAnalise(mesa, filtros) {
    if (!mesa.filtros.length) {
      return '<p class="config-vazio">Esta mesa não tem nenhum campo em '
        + 'formato de lista, então não há por onde filtrar.</p>';
    }
    return mesa.filtros.map(function (filtro) {
      var escolhida = (filtros || []).filter(function (um) {
        return um.coluna === filtro.cabecalho;
      })[0];
      return '<label class="config-campo"><span>' + escapar(filtro.rotulo)
        + '</span><select data-filtro-analise="' + escapar(filtro.cabecalho) + '">'
        + '<option value="">— todos —</option>'
        + filtro.opcoes.map(function (opcao) {
          var valor = opcao.valor === undefined ? opcao : opcao.valor;
          var rotulo = opcao.rotulo === undefined ? valor : opcao.rotulo;
          return '<option value="' + escapar(valor) + '"'
            + (escolhida && escolhida.valor === valor ? ' selected' : '') + '>'
            + escapar(rotulo) + '</option>';
        }).join('') + '</select></label>';
    }).join('');
  }

  function colunasMarcadasDaAnalise(mesa) {
    var marcadas = [];
    var caixas = document.querySelectorAll('[data-coluna-analise]');
    for (var i = 0; i < caixas.length; i++) {
      if (caixas[i].checked) marcadas.push(caixas[i].value);
    }
    // Todas marcadas é o mesmo que nenhuma escolha: guardar a lista inteira
    // congelaria as colunas de hoje, e uma coluna nova na base nunca
    // apareceria na análise.
    return marcadas.length === mesa.colunas.length ? [] : marcadas;
  }

  function filtrosEscolhidosDaAnalise() {
    var escolhidos = [];
    var caixas = document.querySelectorAll('[data-filtro-analise]');
    for (var i = 0; i < caixas.length; i++) {
      if (!caixas[i].value) continue;
      escolhidos.push({
        coluna: caixas[i].getAttribute('data-filtro-analise'),
        valor: caixas[i].value
      });
    }
    return escolhidos;
  }

  function carregarEstrutura() {
    aguarde('Conferindo a planilha…');
    Servidor.chamar('conferirEstruturaDaPlanilha')
      .entao(function (laudo) {
        dados.laudo = laudo;
        Servidor.chamar('configuracaoDoLegado')
          .entao(function (legado) {
            dados.legado = legado;
            Servidor.chamar('listarAuditoria', 40)
              .entao(function (trilha) {
                dados.trilha = trilha;
                desenharEstrutura();
              })
              .senao(falhou);
          })
          .senao(falhou);
      })
      .senao(falhou);
  }

  function desenharEstrutura() {
    if (respostaAtrasada('estrutura')) return;
    var laudo = dados.laudo;

    var abas = laudo.abas.map(function (aba) {
      var problema = !aba.existe || aba.faltando.length;
      return '<li class="config-item' + (problema ? ' com-problema' : '') + '">'
        + '<span class="nome">' + escapar(aba.aba) + '</span>'
        + '<span class="detalhe">'
        + (!aba.existe ? 'A aba não existe na planilha.'
          : aba.linhas + ' linhas'
            + (aba.faltando.length
              ? ' · <strong class="alerta">faltam: '
                + escapar(aba.faltando.join(', ')) + '</strong>' : '')
            + (aba.aMais.length
              ? ' · fora do contrato: ' + escapar(aba.aMais.join(', ')) : ''))
        + '</span></li>';
    }).join('');

    elemento('config-lista').innerHTML = '<div class="config-cabeca">'
      + '<span class="config-titulo">'
      + (laudo.ok ? 'A planilha está no contrato' : 'A planilha saiu do contrato')
      + '</span></div>'
      + '<p class="config-explica">Coluna que sumiu e coluna que apareceu são '
      + 'mostradas lado a lado, sem conserto automático: o sistema não adivinha '
      + 'que uma virou a outra, porque adivinhar erraria calado e o dado iria '
      + 'para a coluna errada.</p>'
      + '<ul class="config-itens laudo">' + abas + '</ul>';

    elemento('config-lista').innerHTML += desenharDiagnostico() + desenharLegado();
    ligarDiagnostico();
    ligarLegado();

    elemento('config-painel').innerHTML = '<div class="config-form">'
      + tituloDoPainel('O que foi feito', 'As 40 ações mais recentes')
      + (dados.trilha.length
        ? '<ul class="trilha">' + dados.trilha.map(function (linha) {
          return '<li><span class="quando">' + escapar(linha.dataHora) + '</span>'
            + '<span class="oque">' + escapar(linha.acao) + '</span>'
            + '<span class="quem">' + escapar(linha.quem)
            + (linha.detalhe ? ' · ' + escapar(linha.detalhe) : '')
            + '</span></li>';
        }).join('') + '</ul>'
        : '<p class="config-vazio">Nada foi alterado ainda. A trilha começa a '
          + 'encher no primeiro ajuste — e guarda quem fez, o quê e quando.</p>')
      + '</div>';
  }

  /* ------------------------------------------------------ o diagnóstico */
  /*
    O laudo acima confere a PLANILHA. O diagnóstico confere o SISTEMA INTEIRO
    — dez blocos, do fuso horário à ligação entre cada botão da tela e a
    função que ele chama no servidor.

    Fica atrás de um botão, e não roda ao abrir a seção: ele lê a coluna de Id
    de todas as abas, e numa base grande isso custa segundos. Tela que demora
    a abrir é tela que ninguém abre.
  */

  function desenharDiagnostico() {
    return '<div class="config-legado" id="caixa-do-diagnostico">'
      + '<h4>Diagnóstico do sistema</h4>'
      + '<p class="config-explica">Confere o sistema inteiro: fuso, estrutura, '
      + 'sequências de Id, Ids repetidos, mesas, campos, painéis, análises, '
      + 'quem consegue configurar, e se toda função que a tela chama existe no '
      + 'servidor. <strong>Só lê</strong> — não muda nada.</p>'
      + '<div class="config-acoes">'
      + '<button type="button" class="botao vazado" id="rodar-diagnostico">'
      + 'Rodar diagnóstico</button></div>'
      + '<div id="resultado-do-diagnostico"></div></div>';
  }

  function ligarDiagnostico() {
    elemento('rodar-diagnostico').addEventListener('click', function () {
      var onde = elemento('resultado-do-diagnostico');
      onde.innerHTML = '<p class="carregando-campos">Conferindo o sistema…</p>';
      Servidor.chamar('diagnosticoDoSistema')
        .entao(function (laudo) { onde.innerHTML = laudoDesenhado(laudo); })
        .senao(function (erro) {
          onde.innerHTML = '<p class="carregando-campos erro-carga">'
            + escapar(erro.message || String(erro)) + '</p>';
        });
    });
  }

  /** '13 conferidos' quando está tudo certo; senão, o que precisa de olho. */
  function resumoDoBloco(bloco) {
    var falhas = bloco.itens.filter(function (i) { return i.situacao === 'falha'; });
    var atencoes = bloco.itens.filter(function (i) { return i.situacao === 'atencao'; });
    if (falhas.length) {
      return falhas.length + ' falha' + (falhas.length > 1 ? 's' : '');
    }
    if (atencoes.length) {
      return atencoes.length + ' atenção' + (atencoes.length > 1 ? 'ões' : '');
    }
    return bloco.itens.length + ' conferidos';
  }

  function laudoDesenhado(laudo) {
    var blocos = laudo.blocos.map(function (bloco) {
      var itens = bloco.itens.map(function (item) {
        return '<li class="laudo-item ' + escapar(item.situacao) + '">'
          + '<span class="oque">' + escapar(item.oQue) + '</span>'
          + (item.detalhe
            ? '<span class="detalhe">' + escapar(item.detalhe) + '</span>' : '')
          // O "como arrumar" só aparece quando há o que arrumar: repetir a
          // instrução ao lado de tudo que está certo faria o olho parar de
          // ver as três que importam.
          + (item.comoArrumar && item.situacao !== 'ok'
            ? '<span class="arrumar">' + escapar(item.comoArrumar) + '</span>' : '')
          + '</li>';
      }).join('');

      /*
        Bloco todo certo nasce FECHADO; bloco com atenção ou falha nasce
        aberto. Um laudo bom tem cinquenta linhas verdes, e ler cinquenta
        linhas verdes para achar as três vermelhas é o mesmo que não ter
        laudo. <details> faz isso sem JavaScript nenhum, e já vem com o
        teclado funcionando.
      */
      var certo = bloco.situacao === 'ok';
      return '<details class="laudo-bloco ' + escapar(bloco.situacao) + '"'
        + (certo ? '' : ' open') + '>'
        + '<summary>' + escapar(bloco.titulo)
        + '<span class="conta">' + resumoDoBloco(bloco) + '</span></summary>'
        + '<ul>' + itens + '</ul></details>';
    }).join('');

    return '<div class="laudo-resumo ' + (laudo.aprovado ? 'ok' : 'falha') + '">'
      + '<strong>' + (laudo.aprovado ? 'Aprovado' : 'Reprovado') + '</strong>'
      + '<span>' + laudo.resumo.total + ' verificações · '
      + laudo.resumo.falhas + ' falha(s) · '
      + laudo.resumo.atencoes + ' atenção(ões) · '
      + escapar(laudo.quando) + '</span></div>'
      + '<div class="laudo-blocos">' + blocos + '</div>';
  }

  /**
   * A planilha do sistema anterior, que a busca também olha.
   *
   * Mora aqui, junto do laudo, porque é a mesma pergunta: onde estão as
   * planilhas que este sistema lê. O Id é conferido na hora de salvar —
   * guardar um Id que não abre deixaria a busca com um recado de erro para
   * sempre, sem ninguém saber se o Id estava errado ou se a planilha sumiu.
   */
  function desenharLegado() {
    var legado = dados.legado;
    return '<div class="config-legado">'
      + '<h4>Planilha legada</h4>'
      + '<p class="config-explica">O histórico que ficou no sistema anterior. '
      + 'Quando apontada, a tela de Buscar Caso passa a oferecê-la como uma '
      + 'origem a mais — em leitura, sem editar nada. Vazio desliga.</p>'
      + '<form class="config-form" id="form-legado">'
      + campoDeTexto('legadoId', 'Id da planilha', legado.planilhaId,
        'É o pedaço do endereço entre /d/ e /edit. A conta que roda o sistema '
        + 'precisa ter acesso a ela.')
      + campoDeTexto('legadoAba', 'Aba', legado.aba,
        'Vazio usa a primeira aba. A primeira linha é lida como cabeçalho.')
      + campoDeTexto('legadoRotulo', 'Como aparece na busca', legado.rotulo, '')
      + '<div class="config-acoes">'
      + '<button type="submit" class="botao">Salvar planilha legada</button>'
      + '</div></form></div>';
  }

  function ligarLegado() {
    elemento('form-legado').addEventListener('submit', function (evento) {
      evento.preventDefault();
      Servidor.chamar('salvarConfiguracaoDoLegado', {
        planilhaId: valorDe('legadoId'),
        aba: valorDe('legadoAba'),
        rotulo: valorDe('legadoRotulo')
      }).entao(function (nova) {
        dados.legado = nova;
        avisarSalvo(nova.planilhaId
          ? 'Planilha legada apontada e conferida.'
          : 'Planilha legada desligada.');
      }).senao(function (erro) { avisar(erro.message || String(erro), 'ruim'); });
    });
  }

  /* ================================================ o diálogo de senha */

  /**
   * Executa a ação, pedindo a senha antes se ela ainda não foi liberada.
   *
   * A ação fica GUARDADA: depois de acertar a senha ela roda sozinha, sem a
   * pessoa ter de preencher tudo de novo. Refazer o formulário depois de
   * digitar a senha é o tipo de coisa que faz alguém desistir no meio.
   */
  /**
   * Pede a senha e roda a ação. O diálogo em si mora em
   * SenhaDeAdministrador.html — é o mesmo que a Importação usa.
   */
  function comSenhaDeAdministrador(acao) {
    SenhaDeAdministrador.pedir(acao, !resumo.senhaDefinida);
  }

  /* ======================================================== peças da tela */

  function tituloDoPainel(titulo, subtitulo) {
    return '<header class="config-painel-cabeca">'
      + '<h3>' + escapar(titulo) + '</h3>'
      + '<p>' + escapar(subtitulo) + '</p></header>';
  }

  function painelVazio(mensagem) {
    elemento('config-painel').innerHTML =
      '<p class="config-vazio">' + escapar(mensagem) + '</p>';
  }

  function campoDeTexto(nome, rotulo, valor, dica) {
    return '<label class="config-campo"><span>' + escapar(rotulo) + '</span>'
      + '<input type="text" id="cfg-' + nome + '" value="'
      + escapar(texto(valor)) + '">'
      + (dica ? '<em>' + escapar(dica) + '</em>' : '') + '</label>';
  }

  function campoDeSenha(nome, rotulo, dica) {
    return '<label class="config-campo"><span>' + escapar(rotulo) + '</span>'
      + '<input type="password" id="cfg-' + nome + '" autocomplete="off">'
      + (dica ? '<em>' + escapar(dica) + '</em>' : '') + '</label>';
  }

  function campoSomenteLeitura(rotulo, valor, dica) {
    return '<label class="config-campo travado"><span>' + escapar(rotulo) + '</span>'
      + '<input type="text" value="' + escapar(texto(valor)) + '" readonly>'
      + (dica ? '<em>' + escapar(dica) + '</em>' : '') + '</label>';
  }

  function caixaDeOpcoes(nome, rotulo, opcoes, escolhida, dica) {
    return '<label class="config-campo"><span>' + escapar(rotulo) + '</span>'
      + '<select id="cfg-' + nome + '">'
      + opcoes.map(function (opcao) {
        return '<option value="' + escapar(opcao) + '"'
          + (texto(opcao) === texto(escolhida) ? ' selected' : '') + '>'
          + (opcao ? escapar(opcao) : '— nenhuma —') + '</option>';
      }).join('') + '</select>'
      + (dica ? '<em>' + escapar(dica) + '</em>' : '') + '</label>';
  }

  /** Uma caixa de opções montada de itens que têm id e nome. */
  function caixaDeItens(nome, rotulo, itens, escolhido, dica) {
    return '<label class="config-campo"><span>' + escapar(rotulo) + '</span>'
      + '<select id="cfg-' + nome + '">'
      + '<option value="">— escolha —</option>'
      + itens.map(function (item) {
        return '<option value="' + escapar(item.id) + '"'
          + (texto(item.id) === texto(escolhido) ? ' selected' : '') + '>'
          + escapar(item.nome) + '</option>';
      }).join('') + '</select>'
      + (dica ? '<em>' + escapar(dica) + '</em>' : '') + '</label>';
  }

  function caixaDeSimNao(nome, rotulo, ligado) {
    return '<label class="config-chave">'
      + '<input type="checkbox" id="cfg-' + nome + '"'
      + (ligado ? ' checked' : '') + '>'
      + '<span>' + escapar(rotulo) + '</span></label>';
  }

  function caixaDeMarcar(nome, rotulo, ligado, dica) {
    return '<label class="config-chave">'
      + '<input type="checkbox" id="cfg-' + nome + '"'
      + (ligado ? ' checked' : '') + '>'
      + '<span>' + escapar(rotulo)
      + (dica ? '<em>' + escapar(dica) + '</em>' : '') + '</span></label>';
  }

  /* ------------------------------------------------------------ utilidades */

  function valorDe(nome) {
    var campo = elemento('cfg-' + nome);
    return campo ? campo.value : '';
  }

  function marcado(nome) {
    var campo = elemento('cfg-' + nome);
    return campo ? campo.checked : false;
  }

  function acharNaLista(lista, id) {
    for (var i = 0; i < lista.length; i++) {
      if (texto(lista[i].id) === texto(id)) return lista[i];
    }
    return null;
  }

  function ligarCliques(seletor, oQueFazer) {
    var botoes = document.querySelectorAll(seletor);
    for (var i = 0; i < botoes.length; i++) {
      botoes[i].addEventListener('click', function () { oQueFazer(this); });
    }
  }

  function avisarSalvo(mensagem) {
    avisar(mensagem || 'Salvo.', 'bom');
  }

  /** Um recado flutuante, no tom pedido. Some sozinho. */
  function avisar(mensagem, tom) {
    var aviso = document.createElement('div');
    aviso.className = 'aviso-flutuante tom-' + (tom || 'bom');
    aviso.setAttribute('role', 'status');
    aviso.textContent = mensagem;
    document.body.appendChild(aviso);
    window.setTimeout(function () {
      if (aviso.parentNode) aviso.parentNode.removeChild(aviso);
    }, tom === 'ruim' ? 6000 : 3200);
  }

  function mostrarErroNoPainel(erro) {
    var painel = elemento('config-painel');
    if (!painel) return window.alert(erro.message || String(erro));

    var antigo = painel.querySelector('.config-erro');
    if (antigo) antigo.parentNode.removeChild(antigo);

    var caixa = document.createElement('p');
    caixa.className = 'config-erro';
    caixa.textContent = erro.message || String(erro);
    painel.insertBefore(caixa, painel.firstChild);
    painel.scrollTop = 0;
  }

  /* ------------------------------------------------------------- ligar */

  function ligar(pacote) {
    if (pacote) pacoteDoSistema = pacote;
    Servidor.chamar('resumoDasConfiguracoes')
      .entao(function (resposta) {
        resumo = resposta;
        desenharTudo();
      })
      .senao(function (erro) {
        elemento('config').innerHTML = '<p class="carregando-campos erro-carga">'
          + escapar(erro.message || String(erro)) + '</p>';
      });
  }

  function desligar() { SenhaDeAdministrador.fechar(); }

  return { montar: montar, ligar: ligar, desligar: desligar };
})();
</script>


<!-- ==== Aplicacao.html ==== -->
<script>
/* ============================================================================
   RECC — Aplicacao.html · a ponte com o servidor, o roteador e as telas
   ============================================================================
   Três coisas moram aqui:

     Servidor   embrulha o google.script.run, que é como o navegador conversa
                com o Apps Script. Ele é ASSÍNCRONO e não devolve promessa por
                conta própria — por isso o embrulho, para o resto do código
                poder escrever `.entao(...)` em vez de empilhar retornos.

     Rotas      o que cada item do menu mostra. Trocar de tela não recarrega a
                página: o Apps Script serve UMA página, e o miolo é trocado.

     Aplicacao  liga tudo: pede o pacote de partida, monta a moldura, cuida do
                tema e do teclado.
   ============================================================================ */

/* ------------------------------------------------------------- o servidor */
var Servidor = (function () {

  /*
    QUANTAS VEZES A TELA JÁ TROCOU.

    O Apps Script responde quando responde, e ninguém espera parado: dá tempo
    de sobra para clicar em Configurações, achar que demorou, e ir para o
    Dashboard antes de a resposta chegar. Quando ela chega, o código que ia
    desenhá-la procura um elemento que não existe mais e estoura com
    "Cannot set properties of null" — um erro que não diz nada sobre o que a
    pessoa fez, e que só aparece para quem está com o console aberto.

    O contador resolve isso sem ninguém precisar lembrar: a resposta só é
    entregue se a tela que perguntou ainda for a tela da vez. Descartar aqui
    não esconde erro nenhum — é uma resposta para uma pergunta que ninguém
    está mais fazendo.
  */
  var geracaoDaTela = 0;

  /** Chamada pelo roteador, toda vez que o miolo é remontado. */
  function trocouDeTela() { geracaoDaTela++; }

  /**
   * Chama uma função do Apps Script.
   *
   *   Servidor.chamar('pacoteDePartida')
   *     .entao(function (resposta) { ... })
   *     .senao(function (erro) { ... });
   *
   * Fora do Apps Script (na prévia navegável), google.script não existe: o
   * gerador de prévia coloca um substituto no lugar. Por isso a checagem.
   */
  function chamar(nomeDaFuncao) {
    var argumentos = Array.prototype.slice.call(arguments, 1);
    var aoDarCerto = null;
    var aoDarErrado = null;
    var minhaGeracao = geracaoDaTela;

    function aTelaAindaEAMesma() {
      if (geracaoDaTela === minhaGeracao) return true;
      console.info('Resposta de ' + nomeDaFuncao + ' descartada: a tela que '
        + 'perguntou já saiu.');
      return false;
    }

    var acompanhamento = {
      entao: function (funcao) { aoDarCerto = funcao; return acompanhamento; },
      senao: function (funcao) { aoDarErrado = funcao; return acompanhamento; }
    };

    if (typeof google === 'undefined' || !google.script || !google.script.run) {
      setTimeout(function () {
        if (aoDarErrado) {
          aoDarErrado(new Error('Esta página não está sendo servida pelo Apps '
            + 'Script, então não há servidor para chamar.'));
        }
      }, 0);
      return acompanhamento;
    }

    var corrida = google.script.run
      .withSuccessHandler(function (resposta) {
        if (!aTelaAindaEAMesma()) return;
        if (aoDarCerto) aoDarCerto(resposta);
      })
      .withFailureHandler(function (erro) {
        if (!aTelaAindaEAMesma()) return;
        if (aoDarErrado) aoDarErrado(erro);
        else console.error(erro);
      });

    /*
      O DISPARO PRECISA DE TRY, e não é zelo excessivo.

      Quando a função NÃO EXISTE no servidor — o arquivo .gs ficou para trás na
      cópia, ou alguém renomeou a função e a tela não acompanhou —,
      `corrida[nomeDaFuncao]` é undefined e o `.apply` estoura AQUI, na hora,
      antes de o navegador falar com o servidor.

      Sem este try o erro escapa por fora do caminho de falha: o `.senao` nem
      chegou a ser registrado ainda (ele é chamado depois, no encadeamento), a
      tela fica parada no "Lendo o cadastro…" para sempre, e o único vestígio
      é uma linha no console que ninguém abre. Foi exatamente assim que
      apareceu, e o sintoma não tem nada a ver com a causa.

      O setTimeout é obrigatório pelo mesmo motivo: chamar aoDarErrado agora
      não adiantaria, porque `.senao` só vai ser chamado quando esta função
      retornar.
    */
    try {
      if (typeof corrida[nomeDaFuncao] !== 'function') {
        throw new Error('A função "' + nomeDaFuncao + '" não existe no '
          + 'servidor. Ou o arquivo .gs dela não foi copiado para o projeto '
          + 'do Apps Script, ou ela foi renomeada lá e a tela continua '
          + 'chamando o nome antigo. Configurações › Estrutura › Rodar '
          + 'diagnóstico lista todas de uma vez.');
      }
      corrida[nomeDaFuncao].apply(corrida, argumentos);
    } catch (erro) {
      setTimeout(function () {
        if (aoDarErrado) aoDarErrado(erro);
        else console.error(erro);
      }, 0);
    }
    return acompanhamento;
  }

  return { chamar: chamar, trocouDeTela: trocouDeTela };
})();

/* ----------------------------------------------------------------- rotas */
var Rotas = (function () {

  /**
   * Enquanto a tela de verdade não chega, o miolo diz com honestidade o que
   * vai ter ali e em que etapa. Tela em branco faria todo mundo achar que
   * quebrou.
   */
  function emConstrucao(etapa, itens) {
    var lista = itens.map(function (item) {
      return '<li>' + Moldura.escapar(item) + '</li>';
    }).join('');
    // Sem repetir o nome da tela: quem nomeia é o cabeçalho, logo acima.
    return '<div class="cartao emconstrucao">'
      + '<span class="fita">chega na etapa ' + etapa + '</span>'
      + '<p>A casca já está pronta: menu, barra superior, temas e a troca de '
      + 'telas funcionam. O que ainda não existe é o miolo desta tela.</p>'
      + '<ul>' + lista + '</ul>'
      + '</div>';
  }

  var TELAS = {
    dashboard: {
      titulo: 'Dashboard',
      subtitulo: 'Visão do dia: indicadores e a fila de trabalho da sua equipe.',
      montar: function (pacote) { return TelaDashboard.montar(pacote); },
      ligar: function (pacote) { TelaDashboard.ligar(pacote); }
    },
    cadastrarCaso: {
      titulo: 'Cadastrar Caso',
      subtitulo: 'Registro de um caso novo, com o formulário montado pela mesa.',
      montar: function (pacote) { return TelaCadastrarCaso.montar(pacote); },
      ligar: function (pacote) { TelaCadastrarCaso.ligar(pacote); },
      desligar: function () { TelaCadastrarCaso.desligar(); }
    },
    minhaPerformance: {
      titulo: 'Minha Performance',
      subtitulo: 'Acompanhe seus resultados, evolução e principais indicadores.',
      montar: function (pacote) { return TelaMinhaPerformance.montar(pacote); },
      ligar: function (pacote) { TelaMinhaPerformance.ligar(pacote); },
      desligar: function () { TelaMinhaPerformance.desligar(); }
    },
    buscarCaso: {
      titulo: 'Buscar Caso',
      subtitulo: 'Encontre um caso pelo protocolo, pela apólice ou pelo segurado.',
      montar: function (pacote) { return TelaBuscarCaso.montar(pacote); },
      ligar: function (pacote) { TelaBuscarCaso.ligar(pacote); }
    },
    tabelaCorretoras: {
      titulo: 'Tabela de Corretoras',
      subtitulo: 'Canais, corretores e agentes, com segmento e situação da SUSEP.',
      montar: function (pacote) { return TelaTabelaCorretoras.montar(pacote); },
      ligar: function (pacote) { TelaTabelaCorretoras.ligar(pacote); },
      desligar: function () { TelaTabelaCorretoras.desligar(); }
    },
    painelAnalitico: {
      titulo: 'Painel Analítico',
      subtitulo: 'Explore dados e identifique oportunidades para a operação.',
      montar: function (pacote) { return TelaPainelAnalitico.montar(pacote); },
      ligar: function (pacote) { TelaPainelAnalitico.ligar(pacote); },
      desligar: function () { TelaPainelAnalitico.desligar(); }
    },
    configuracoes: {
      titulo: 'Configurações',
      subtitulo: 'Personalize o sistema de acordo com a realidade da sua operação.',
      montar: function (pacote) { return TelaConfiguracoes.montar(pacote); },
      ligar: function (pacote) { TelaConfiguracoes.ligar(pacote); },
      desligar: function () { TelaConfiguracoes.desligar(); }
    }
  };

  function existe(tela) { return Object.prototype.hasOwnProperty.call(TELAS, tela); }
  function pegar(tela) { return TELAS[tela]; }

  return { existe: existe, pegar: pegar };
})();

/* ------------------------------------------------------------- aplicação */
var Aplicacao = (function () {
  var pacote = null;
  var telaAtual = '';

  function elemento(id) { return document.getElementById(id); }

  /* -- tema -------------------------------------------------------------- */
  function aplicarTema(tema) {
    document.documentElement.setAttribute('data-tema', tema);
    if (pacote) pacote.tema = tema;
    var bolinhas = document.querySelectorAll('.tema');
    for (var i = 0; i < bolinhas.length; i++) {
      bolinhas[i].setAttribute('aria-pressed',
        bolinhas[i].getAttribute('data-tema') === tema ? 'true' : 'false');
    }
  }

  function trocarTema(tema) {
    aplicarTema(tema);
    // Guarda no servidor para o tema seguir a pessoa em qualquer computador.
    // Falhar aqui não pode desfazer a troca na tela: é preferência, não dado.
    Servidor.chamar('salvarTemaDoUsuario', tema).senao(function (erro) {
      console.warn('Não consegui guardar o tema: ' + erro.message);
    });
  }

  /* -- navegação --------------------------------------------------------- */
  function podeVer(tela) {
    for (var i = 0; i < pacote.menu.length; i++) {
      if (pacote.menu[i].tela === tela) return true;
    }
    return false;
  }

  /**
   * Troca a tela do miolo.
   *
   * A guarda de rota vive AQUI, e não no menu: esconder o item não impede
   * ninguém de digitar o endereço da tela. E o servidor confere de novo em
   * cada função — esconder botão nunca foi segurança.
   */
  function irPara(tela, semHistorico) {
    // Antes de qualquer coisa: o que estava a caminho era para a tela antiga.
    Servidor.trocouDeTela();

    if (!Rotas.existe(tela) || !podeVer(tela)) {
      tela = pacote.menu.length ? pacote.menu[0].tela : 'dashboard';
    }

    // A tela que sai precisa poder se despedir: quem registrou atalho de
    // teclado tem de removê-lo, senão o Ctrl+Enter do cadastro continuaria
    // valendo dentro do Painel Analítico.
    if (telaAtual && Rotas.existe(telaAtual)) {
      var anterior = Rotas.pegar(telaAtual);
      if (anterior.desligar) anterior.desligar();
    }
    telaAtual = tela;

    var definicao = Rotas.pegar(tela);
    elemento('superior').innerHTML = Moldura.montarSuperior(pacote);
    elemento('lateral').innerHTML = Moldura.montarLateral(pacote, tela);
    elemento('miolo').innerHTML = '<div class="cabecalho-da-tela">'
      + '<h2>' + Moldura.escapar(definicao.titulo) + '</h2>'
      + '<p>' + Moldura.escapar(definicao.subtitulo) + '</p>'
      + '</div>'
      + definicao.montar(pacote);
    document.title = pacote.identidade.nome + ' — ' + definicao.titulo;

    ligarMoldura();
    if (definicao.ligar) definicao.ligar(pacote);
    fecharMenu();
    elemento('miolo').focus();

    if (!semHistorico && location.hash !== '#' + tela) {
      location.hash = tela;
    }
  }

  function telaDoEndereco() {
    return String(location.hash || '').replace(/^#/, '');
  }

  /* -- menu em tela estreita --------------------------------------------- */
  function abrirMenu() { elemento('aplicacao').classList.add('menu-aberto'); }
  function fecharMenu() { elemento('aplicacao').classList.remove('menu-aberto'); }

  function alternarEncolhido() {
    var aplicacao = elemento('aplicacao');
    var encolhida = aplicacao.classList.toggle('encolhida');
    try {
      localStorage.setItem('recc.menuEncolhido', encolhida ? 'sim' : 'nao');
    } catch (erro) {
      // Navegador com armazenamento bloqueado: o menu volta ao normal na
      // próxima abertura, e só. Não vale derrubar a tela por causa disso.
    }
  }

  function restaurarEncolhido() {
    try {
      if (localStorage.getItem('recc.menuEncolhido') === 'sim') {
        elemento('aplicacao').classList.add('encolhida');
      }
    } catch (erro) { /* idem */ }
  }

  /* -- eventos da moldura, religados a cada troca de tela ---------------- */
  function ligarMoldura() {
    var itens = document.querySelectorAll('.lateral-item');
    for (var i = 0; i < itens.length; i++) {
      itens[i].addEventListener('click', function () {
        irPara(this.getAttribute('data-tela'));
      });
    }

    var bolinhas = document.querySelectorAll('.tema');
    for (var t = 0; t < bolinhas.length; t++) {
      bolinhas[t].addEventListener('click', function () {
        trocarTema(this.getAttribute('data-tema'));
      });
    }

    var encolher = elemento('encolher');
    if (encolher) encolher.addEventListener('click', alternarEncolhido);

    var abrir = elemento('abrir-menu');
    if (abrir) abrir.addEventListener('click', abrirMenu);

    var veu = elemento('veu');
    if (veu) veu.addEventListener('click', fecharMenu);
  }

  function ligarTeclado() {
    document.addEventListener('keydown', function (evento) {
      if ((evento.ctrlKey || evento.metaKey) && evento.key === 'k') {
        evento.preventDefault();
        var busca = elemento('busca-global');
        if (busca) busca.focus();
      }
      if (evento.key === 'Escape') fecharMenu();
    });
    window.addEventListener('hashchange', function () {
      var tela = telaDoEndereco();
      if (tela && tela !== telaAtual) irPara(tela, true);
    });
  }

  /* -- abertura ---------------------------------------------------------- */
  function recusar(motivo) {
    elemento('carregando').hidden = true;
    elemento('recusado').hidden = false;
    elemento('recusado-motivo').textContent = motivo;
  }

  function iniciar() {
    Servidor.chamar('pacoteDePartida')
      .entao(function (resposta) {
        if (!resposta || !resposta.disponivel) {
          // Nunca deixar a falha virar um menu vazio: menu vazio é lido como
          // "não tenho acesso" e manda a pessoa procurar no lugar errado.
          recusar((resposta && resposta.motivo)
            || 'O servidor não explicou o motivo.');
          return;
        }
        pacote = resposta;
        if (pacote.identidade.corPrimaria) {
          // Em --cor-da-operacao, e não em --destaque: escrever direto no
          // destaque pintaria os quatro temas com a cor da operação, e o
          // rosa ficaria com botões azuis.
          document.documentElement.style.setProperty(
            '--cor-da-operacao', pacote.identidade.corPrimaria);
        }
        elemento('carregando').hidden = true;
        elemento('aplicacao').hidden = false;
        restaurarEncolhido();
        aplicarTema(pacote.tema || 'padrao');
        irPara(telaDoEndereco() || 'dashboard', true);
        ligarTeclado();
      })
      .senao(function (erro) {
        recusar(erro && erro.message ? erro.message : String(erro));
      });
  }

  /** Redesenha a tela atual — usada quando ela mesma muda de estado. */
  function remontar() {
    if (telaAtual) irPara(telaAtual, true);
  }

  return {
    iniciar: iniciar,
    irPara: irPara,
    remontar: remontar,
    trocarTema: trocarTema
  };
})();

document.addEventListener('DOMContentLoaded', Aplicacao.iniciar);
</script>
