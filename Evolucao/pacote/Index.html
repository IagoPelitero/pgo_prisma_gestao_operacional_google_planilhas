  function desenharAnalises() {
    if (respostaAtrasada('analises')) return;
    var linhas = dados.analises.map(function (uma) {
      return '<li class="config-item'
        + (escolhido && escolhido.id === uma.id ? ' atual' : '')
        + (uma.ativo ? '' : ' desligado') + '">'
        + '<button type="button" class="abrir" data-analise="'
        + escapar(uma.id) + '">'
        + '<span class="nome">' + escapar(uma.aba) + '</span>'
        + '<span class="detalhe">' + escapar(uma.canalNome)
        + (uma.abaExiste
          ? ' · gerada em ' + escapar(uma.geradaEm) + ' · '
            + uma.linhasGeradas + ' linha(s)'
          : ' · nunca gerada')
        + (uma.ativo ? '' : ' · desligada')
        + '</span></button></li>';
    }).join('');

    elemento('config-lista').innerHTML = '<div class="config-cabeca">'
      + '<span class="config-titulo">' + dados.analises.length
      + ' análise(s)</span>'
      + '<button type="button" class="botao pequeno" id="nova-analise">'
      + 'Montar análise</button></div>'
      + '<p class="config-explica">Cada análise vira uma aba <code>'
      + escapar(dados.opcoes.prefixo) + '&lt;Nome&gt;</code> na planilha, com '
      + 'os dados achatados — pronta para tabela dinâmica ou para o Power BI '
      + 'apontar. É um <strong>retrato</strong>: vale o que valia na hora em '
      + 'que foi gerada, e não se atualiza sozinha.</p>'
      + '<p class="config-explica">Para atualizar sem clicar, aponte um '
      + 'acionador de tempo no editor do Apps Script para a função '
      + '<code>atualizarAnalisesAgendadas</code>.</p>'
      + (dados.analises.length
        ? '<ul class="config-itens">' + linhas + '</ul>'
        : '<p class="config-vazio">Nenhuma análise montada.</p>');

    elemento('nova-analise').addEventListener('click', function () {
      escolhido = null;
      desenharPainelDaAnalise(null);
    });
    ligarCliques('[data-analise]', function (botao) {
      escolhido = { id: botao.getAttribute('data-analise') };
      desenharAnalises();
    });

    if (escolhido) {
      desenharPainelDaAnalise(acharNaLista(dados.analises, escolhido.id));
    } else {
      painelVazio('Escolha uma análise, ou monte uma nova.');
    }
  }

  function canalDaAnalise(idDoCanal) {
    var achada = dados.opcoes.canais.filter(function (uma) {
      return String(uma.id) === String(idDoCanal);
    })[0];
    return achada || dados.opcoes.canais[0];
  }

  function desenharPainelDaAnalise(analise) {
    var atual = analise || {
      id: '', nome: '', descricao: '', canalId: dados.opcoes.canais[0].id,
      colunas: [], filtros: [], dias: 0, ativo: true, abaExiste: false
    };
    var canal = canalDaAnalise(atual.canalId);

    elemento('config-painel').innerHTML = '<form class="config-form" id="form-analise">'
      + tituloDoPainel(atual.id ? atual.aba : 'Nova análise',
        atual.id ? 'A aba é reescrita a cada geração' : 'O nome vira o nome da aba')
      + campoDeTexto('an-nome', 'Nome', atual.nome,
        'Só letras sem acento, números e _. Vira ' + dados.opcoes.prefixo + 'Nome.')
      + campoDeTexto('an-descricao', 'Para que serve', atual.descricao, '')
      + caixaDeItens('an-canal', 'Canal', dados.opcoes.canais, atual.canalId,
        'Trocar o canal limpa as colunas e os filtros.')
      + campoDeTexto('an-dias', 'Últimos N dias', atual.dias,
        canal.temColunaDeData
          ? '0 traz tudo. Conta pela coluna "' + canal.colunaDaData + '".'
          : 'Este canal não tem coluna de data, então a janela não se aplica.')
      + '<div class="config-campo"><span>Colunas</span>'
      + '<div class="config-marcadores" id="colunas-da-analise">'
      + canal.colunas.map(function (coluna, i) {
        var marcada = !atual.colunas.length || atual.colunas.indexOf(coluna) >= 0;
        return '<label class="config-chave"><input type="checkbox"'
          + ' data-coluna-analise="' + i + '" value="' + escapar(coluna) + '"'
          + (marcada ? ' checked' : '') + '><span>' + escapar(coluna)
          + '</span></label>';
      }).join('')
      + '</div><em>Nenhuma marcada é o mesmo que todas.</em></div>'
      + '<div class="config-campo"><span>Filtros</span>'
      + '<div id="filtros-da-analise">' + desenharFiltrosDaAnalise(canal, atual.filtros)
      + '</div><em>Cada filtro corta as linhas. Dois filtros se somam.</em></div>'
      + caixaDeSimNao('an-ativo', 'Ligada', atual.ativo !== false)
      + '<div class="config-acoes">'
      + '<button type="submit" class="botao">Salvar receita</button>'
      + (atual.id
        ? '<button type="button" class="botao vazado" id="gerar-analise">'
          + (atual.abaExiste ? 'Regerar a aba' : 'Gerar a aba') + '</button>'
          + '<button type="button" class="botao vazado perigo" id="tirar-analise">'
          + 'Tirar da lista</button>'
        : '')
      + '</div>'
      + (atual.abaExiste
        ? '<p class="config-explica">Regerar apaga o retrato de agora, e por '
          + 'isso pede a senha de administrador. A aba é reaproveitada, nunca '
          + 'apagada e recriada: apagar mudaria o identificador dela, e todo '
          + 'Power BI apontado para essa aba perderia o alvo em silêncio.</p>'
        : '')
      + '</form>';

    elemento('cfg-an-canal').addEventListener('change', function () {
      escolhido = atual.id ? { id: atual.id } : null;

      desenharPainelDaAnalise({
        id: atual.id,
        nome: atual.nome,
        descricao: atual.descricao,
        dias: atual.dias,
        ativo: atual.ativo,
        aba: atual.aba,
        abaExiste: atual.abaExiste,
        canalId: this.value,
        colunas: [],
        filtros: []
      });
    });

    elemento('form-analise').addEventListener('submit', function (evento) {
      evento.preventDefault();
      Servidor.chamar('salvarAnalise', {
        id: atual.id, nome: valorDe('an-nome'),
        descricao: valorDe('an-descricao'), canalId: valorDe('an-canal'),
        colunas: colunasMarcadasDaAnalise(canal).join(','),
        filtros: filtrosEscolhidosDaAnalise(),
        dias: Number(valorDe('an-dias')) || 0,
        ativo: elemento('cfg-an-ativo').checked
      }).entao(function (id) {
        escolhido = { id: id };
        avisarSalvo('Receita salva. A aba só muda quando você gerar.');
        carregarAnalises();
      }).senao(function (erro) { avisar(erro.message || String(erro), 'ruim'); });
    });

    var gerar = elemento('gerar-analise');
    if (gerar) {
      gerar.addEventListener('click', function () {

        if (atual.abaExiste) {
          SenhaDeAdministrador.pedir(function () { gerarAgora(atual.id); });
        } else {
          gerarAgora(atual.id);
        }
      });
    }

    var tirar = elemento('tirar-analise');
    if (tirar) {
      tirar.addEventListener('click', function () {
        if (!window.confirm('Tirar "' + atual.nome + '" da lista? A aba '
          + atual.aba + ' continua na planilha.')) return;
        Servidor.chamar('ocultarAnalise', atual.id)
          .entao(function () {
            escolhido = null;
            avisarSalvo('Análise tirada da lista.');
            carregarAnalises();
          })
          .senao(function (erro) { avisar(erro.message || String(erro), 'ruim'); });
      });
    }
  }

  function gerarAgora(id) {
    avisar('Gerando a aba…', 'neutro');
    Servidor.chamarSemPressa('gerarAnalise', id)
      .entao(function (feito) {
        avisarSalvo(feito.aba + ': ' + feito.linhas + ' linha(s) e '
          + feito.colunas + ' coluna(s).'
          + (feito.truncada ? ' A análise passou do teto e foi cortada.' : ''));
        carregarAnalises();
      })
      .senao(function (erro) { avisar(erro.message || String(erro), 'ruim'); });
  }

  function desenharFiltrosDaAnalise(canal, filtros) {
    if (!canal.filtros.length) {
      return '<p class="config-vazio">Este canal não tem nenhum campo em '
        + 'formato de lista, então não há por onde filtrar.</p>';
    }
    return canal.filtros.map(function (filtro) {
      var escolhida = (filtros || []).filter(function (um) {
        return um.coluna === filtro.cabecalho;
      })[0];
      return '<label class="config-campo"><span>' + escapar(filtro.rotulo)
        + '</span><select data-filtro-analise="' + escapar(filtro.cabecalho) + '">'
        + '<option value="">— todos —</option>'
        + filtro.opcoes.map(function (opcao) {
          var valor = opcao.valor === undefined ? opcao : opcao.valor;
          var rotulo = opcao.rotulo === undefined ? valor : opcao.rotulo;
          return '<option value="' + escapar(valor) + '"'
            + (escolhida && escolhida.valor === valor ? ' selected' : '') + '>'
            + escapar(rotulo) + '</option>';
        }).join('') + '</select></label>';
    }).join('');
  }

  function colunasMarcadasDaAnalise(canal) {
    var marcadas = [];
    var caixas = document.querySelectorAll('[data-coluna-analise]');
    for (var i = 0; i < caixas.length; i++) {
      if (caixas[i].checked) marcadas.push(caixas[i].value);
    }

    return marcadas.length === canal.colunas.length ? [] : marcadas;
  }

  function filtrosEscolhidosDaAnalise() {
    var escolhidos = [];
    var caixas = document.querySelectorAll('[data-filtro-analise]');
    for (var i = 0; i < caixas.length; i++) {
      if (!caixas[i].value) continue;
      escolhidos.push({
        coluna: caixas[i].getAttribute('data-filtro-analise'),
        valor: caixas[i].value
      });
    }
    return escolhidos;
  }

  var UNIDADES_DO_SINALIZADOR = [
    { id: 'dias', nome: 'Dias úteis' }, { id: 'horas', nome: 'Horas úteis' }
  ];

  function carregarSinalizadores() {
    aguarde('Lendo os sinalizadores…');
    Servidor.chamar('opcoesDeSinalizador')
      .entao(function (opcoes) {
        dados.opcoes = opcoes;
        Servidor.chamar('listarSinalizadores')
          .entao(function (lista) {
            dados.sinalizadores = lista;
            desenharSinalizadores();
          })
          .senao(falhou);
      })
      .senao(falhou);
  }

  function desenharSinalizadores() {
    if (respostaAtrasada('sinalizadores')) return;

    if (!dados.opcoes.abaExiste) {
      elemento('config-lista').innerHTML = '<p class="config-aviso forte">A aba '
        + '<code>SINALIZADORES</code> ainda não existe nesta planilha. Rode '
        + '<code>atualizarPGO()</code> no editor do Apps Script: ela cria a aba e '
        + 'os sinalizadores da RET, da Mesa e do VG.</p>';
      elemento('config-painel').innerHTML = '';
      return;
    }

    var linhas = dados.sinalizadores.map(function (um) {
      return '<li class="config-item'
        + (escolhido && escolhido.id === um.id ? ' atual' : '')
        + (um.ativo ? '' : ' desligado') + '">'
        + '<button type="button" class="abrir" data-sinalizador="' + escapar(um.id) + '">'
        + '<span class="nome">' + escapar(um.nome) + '</span>'
        + '<span class="detalhe">' + escapar(um.canalNome) + ' · '
        + (um.prazo > 0 ? escapar(um.regra) : 'sem prazo definido')
        + (um.ativo ? '' : ' · desligado') + '</span></button></li>';
    }).join('');

    elemento('config-lista').innerHTML = '<div class="config-cabeca">'
      + '<span class="config-titulo">' + dados.sinalizadores.length
      + ' sinalizador(es)</span>'
      + '<button type="button" class="botao pequeno" id="novo-sinalizador">'
      + 'Novo sinalizador</button></div>'
      + '<p class="config-explica">Cada sinalizador é um <strong>prazo</strong> '
      + 'que o caso tem para chegar a um status final. Aparece embaixo da '
      + 'situação, no Trabalho, e na Produtividade RECC com o nome de quem deixou '
      + 'passar. <strong>Verde</strong>: dentro do prazo. <strong>Amarelo</strong>: '
      + 'faltando pouco — por padrão, o último dia útil. <strong>Vermelho</strong>: '
      + 'passou. Conta de segunda a sexta, só dentro do expediente.</p>'
      + '<p class="config-explica">O <strong>SLA em horas úteis</strong> de cada '
      + 'canal — o da Mesa Diamante é de 6 horas, até a primeira resposta — '
      + 'continua em <em>Canais de trabalho</em>.</p>'
      + (dados.sinalizadores.length
        ? '<ul class="config-itens">' + linhas + '</ul>'
        : '<p class="config-vazio">Nenhum sinalizador.</p>');

    elemento('novo-sinalizador').addEventListener('click', function () {
      escolhido = null;
      desenharPainelDoSinalizador(null);
    });
    ligarCliques('[data-sinalizador]', function (botao) {
      escolhido = { id: botao.getAttribute('data-sinalizador') };
      desenharSinalizadores();
    });

    if (escolhido) {
      desenharPainelDoSinalizador(acharNaLista(dados.sinalizadores, escolhido.id));
    } else {
      painelVazio('Escolha um sinalizador, ou crie um novo.');
    }
  }

  function canalDoSinalizador(idDoCanal) {
    var achado = dados.opcoes.canais.filter(function (um) {
      return String(um.id) === String(idDoCanal);
    })[0];
    return achado || dados.opcoes.canais[0];
  }

  function desenharPainelDoSinalizador(sinalizador) {
    var padrao = dados.opcoes.expedientePadrao;
    var atual = sinalizador || {
      id: '', nome: '', canalId: dados.opcoes.canais[0].id, prazo: 0,
      unidade: 'dias', aviso: 0, colunaQueLiga: '', colunaDaData: '', colunaDaHora: '',
      inicioDoExpediente: padrao.abre, fimDoExpediente: padrao.fecha,
      ordem: 0, ativo: true, statusComCondicao: '', colunaDaCondicao: '',
      valoresDaCondicao: [], colunaDaDataDaCondicao: ''
    };
    var canal = canalDoSinalizador(atual.canalId);

    elemento('config-painel').innerHTML = '<form class="config-form" id="form-sinalizador">'
      + tituloDoPainel(atual.id ? atual.nome : 'Novo sinalizador',
        atual.id ? 'Prazo do canal ' + canal.nome : 'Um prazo que o caso tem')
      + campoDeTexto('sn-nome', 'Nome', atual.nome,
        'É o que aparece no selo: "Prazo de retorno · faltam 2 dias úteis".')
      + (atual.id
        ? campoSomenteLeitura('Canal', canal.nome,
          'O canal não muda: as colunas escolhidas abaixo são dele.')
        : caixaDeItens('sn-canal', 'Canal', dados.opcoes.canais, atual.canalId,
          'Trocar o canal limpa as colunas escolhidas.'))
      + campoDeTexto('sn-prazo', 'Prazo', atual.prazo,
        'Quanto tempo o caso tem. Zero desliga.')
      + caixaDeItens('sn-unidade', 'Em', UNIDADES_DO_SINALIZADOR, atual.unidade,
        'Sempre ÚTEIS: segunda a sexta, no expediente abaixo.')
      + campoDeTexto('sn-aviso', 'Amarelo quando faltar', atual.aviso,
        'Na mesma unidade do prazo. Na RET, 1 dia: o terceiro dia do prazo fica '
        + 'amarelo. Zero não acende amarelo.')
      + caixaDeOpcoes('sn-liga', 'Só vale quando esta coluna estiver preenchida',
        [''].concat(canal.colunas), atual.colunaQueLiga,
        'Em branco vale para todo caso. Serve para um prazo que só existe quando '
        + 'outra coluna está preenchida — por exemplo, só os casos que têm '
        + '"Área responsável".')
      + caixaDeOpcoes('sn-data', 'Conta a partir da data',
        [''].concat(canal.colunasDeData), atual.colunaDaData,
        'Em branco usa a data de entrada do canal'
        + (canal.colunaDaData ? ' ("' + canal.colunaDaData + '")' : '') + '.')
      + caixaDeOpcoes('sn-hora', 'e da hora',
        [''].concat(canal.colunasDeHora), atual.colunaDaHora,
        'Em branco usa a hora que a data carrega; data sem hora conta da '
        + 'abertura do expediente.')
      + caixaDeOpcoes('sn-cond-status', 'Este status só encerra o prazo quando…',
        [''].concat(canal.situacoes || []), atual.statusComCondicao,
        'Na RET: Retido. Em branco, todo status final encerra o prazo sozinho.')
      + caixaDeOpcoes('sn-cond-coluna', '…esta coluna',
        [''].concat(canal.colunas), atual.colunaDaCondicao,
        'Na RET: Status proposta.')
      + '<div class="config-campo"><span>…tiver um destes valores</span>'
      + '<div id="cfg-sn-cond-valores"></div>'
      + '<em>Na RET: Transmitido e Sem alteração. Enquanto o valor for outro, o '
      + 'relógio segue correndo.</em></div>'
      + caixaDeOpcoes('sn-cond-data', '…e a data em que isso aconteceu',
        [''].concat(canal.colunasDeData), atual.colunaDaDataDaCondicao,
        'O sistema carimba aqui o momento em que a condição passou a valer. '
        + 'Na RET: Data do status proposta.')
      + campoDeTexto('sn-inicio', 'Início do expediente', atual.inicioDoExpediente,
        'Como ' + padrao.abre + '.')
      + campoDeTexto('sn-fim', 'Fim do expediente', atual.fimDoExpediente,
        'Como ' + padrao.fecha + '.')
      + campoDeTexto('sn-ordem', 'Ordem', atual.ordem,
        'Quando o canal tem mais de um, o menor aparece primeiro.')
      + caixaDeSimNao('sn-ativo', 'Sinalizador em uso', atual.ativo)
      + '<p class="config-explica">O prazo termina quando o caso chega a um '
      + '<strong>status final</strong> do canal — e um status pode encerrar só '
      + 'com uma condição, como o Retido na RET (acima).</p>'
      + '<div class="config-acoes">'
      + '<button type="submit" class="botao">Salvar</button>'
      + (atual.id ? '<button type="button" class="botao vazado perigo" '
        + 'id="tirar-sinalizador">Tirar da lista</button>' : '')
      + '</div></form>';

    desenharOsValoresDaParada(canal, atual.colunaDaCondicao, atual.valoresDaCondicao);
    elemento('cfg-sn-cond-coluna').addEventListener('change', function () {
      desenharOsValoresDaParada(canal, this.value, []);
    });

    var trocaDeCanal = elemento('cfg-sn-canal');
    if (trocaDeCanal) {
      trocaDeCanal.addEventListener('change', function () {
        desenharPainelDoSinalizador({
          id: '', nome: valorDe('sn-nome'), canalId: this.value,
          prazo: valorDe('sn-prazo'), unidade: valorDe('sn-unidade') || 'dias',
          aviso: valorDe('sn-aviso'), colunaQueLiga: '', colunaDaData: '',
          colunaDaHora: '', inicioDoExpediente: valorDe('sn-inicio'),
          fimDoExpediente: valorDe('sn-fim'), ordem: valorDe('sn-ordem'),
          ativo: marcado('sn-ativo'), statusComCondicao: '', colunaDaCondicao: '',
          valoresDaCondicao: [], colunaDaDataDaCondicao: ''
        });
      });
    }

    elemento('form-sinalizador').addEventListener('submit', function (evento) {
      evento.preventDefault();
      Servidor.chamar('salvarSinalizador', {
        id: atual.id, nome: valorDe('sn-nome'),
        canalId: atual.id ? atual.canalId : valorDe('sn-canal'),
        prazo: valorDe('sn-prazo'), unidade: valorDe('sn-unidade'),
        aviso: valorDe('sn-aviso'), colunaQueLiga: valorDe('sn-liga'),
        colunaDaData: valorDe('sn-data'), colunaDaHora: valorDe('sn-hora'),
        inicioDoExpediente: valorDe('sn-inicio'), fimDoExpediente: valorDe('sn-fim'),
        ordem: valorDe('sn-ordem'), ativo: marcado('sn-ativo'),
        statusComCondicao: valorDe('sn-cond-status'),
        colunaDaCondicao: valorDe('sn-cond-coluna'),
        valoresDaCondicao: lerOsValoresDaParada(),
        colunaDaDataDaCondicao: valorDe('sn-cond-data')
      }).entao(function (id) {
        escolhido = { id: id };
        avisarSalvo('Sinalizador salvo.');
        carregarSinalizadores();
      }).senao(mostrarErroNoPainel);
    });

    var tirar = elemento('tirar-sinalizador');
    if (tirar) {
      tirar.addEventListener('click', function () {
        if (!window.confirm('Tirar "' + atual.nome + '" da lista? Os casos '
          + 'deixam de ter este selo. A linha continua na planilha.')) return;
        Servidor.chamar('ocultarSinalizador', atual.id)
          .entao(function () {
            escolhido = null;
            avisarSalvo('Sinalizador tirado da lista.');
            carregarSinalizadores();
          })
          .senao(mostrarErroNoPainel);
      });
    }
  }

  function desenharOsValoresDaParada(canal, coluna, marcados) {
    var caixa = elemento('cfg-sn-cond-valores');
    if (!caixa) return;
    if (!coluna) { caixa.innerHTML = ''; return; }

    var opcoes = (canal.colunasComLista || {})[coluna] || [];
    if (!opcoes.length) {
      caixa.innerHTML = '<input type="text" id="cfg-sn-cond-texto" value="'
        + escapar((marcados || []).join('; ')) + '">'
        + '<em>Os valores, separados por ponto e vírgula.</em>';
      return;
    }
    caixa.innerHTML = opcoes.map(function (opcao) {
      var ligado = (marcados || []).some(function (valor) {
        return texto(valor).toLowerCase() === texto(opcao).toLowerCase();
      });
      return '<label class="config-chave">'
        + '<input type="checkbox" data-valor-da-parada="' + escapar(opcao) + '"'
        + (ligado ? ' checked' : '') + '>'
        + '<span>' + escapar(opcao) + '</span></label>';
    }).join('');
  }

  function lerOsValoresDaParada() {
    var escrito = elemento('cfg-sn-cond-texto');
    if (escrito) {
      return escrito.value.split(';').map(function (valor) { return valor.trim(); })
        .filter(function (valor) { return valor !== ''; });
    }
    var valores = [];
    var caixas = document.querySelectorAll('[data-valor-da-parada]');
    for (var i = 0; i < caixas.length; i++) {
      if (caixas[i].checked) valores.push(caixas[i].getAttribute('data-valor-da-parada'));
    }
    return valores;
  }

  function carregarEstrutura() {
    aguarde('Conferindo a planilha…');
    Servidor.chamar('conferirEstruturaDaPlanilha')
      .entao(function (laudo) {
        dados.laudo = laudo;
        Servidor.chamar('configuracaoDoLegado')
          .entao(function (legado) {
            dados.legado = legado;
            Servidor.chamar('configuracaoDosCadastros')
              .entao(function (cadastros) {
                dados.cadastros = cadastros;
                Servidor.chamar('configuracaoDoArquivoDaAuditoria')
                  .entao(function (arquivo) {
                    dados.arquivoDaAuditoria = arquivo;
                    Servidor.chamar('listarAuditoria', 40)
                      .entao(function (trilha) {
                        dados.trilha = trilha;
                        Servidor.chamar('listarErros', 40)
                          .entao(function (erros) {
                            dados.erros = erros;
                            desenharEstrutura();
                          })
                          .senao(falhou);
                      })
                      .senao(falhou);
                  })
                  .senao(falhou);
              })
              .senao(falhou);
          })
          .senao(falhou);
      })
      .senao(falhou);
  }

  function desenharEstrutura() {
    if (respostaAtrasada('estrutura')) return;
    var laudo = dados.laudo;

    var abas = laudo.abas.map(function (aba) {
      var problema = !aba.existe || aba.faltando.length;
      return '<li class="config-item' + (problema ? ' com-problema' : '') + '">'
        + '<span class="nome">' + escapar(aba.aba) + '</span>'
        + '<span class="detalhe">'
        + (!aba.existe ? 'A aba não existe na planilha.'
          : aba.linhas + ' linhas'
            + (aba.faltando.length
              ? ' · <strong class="alerta">faltam: '
                + escapar(aba.faltando.join(', ')) + '</strong>' : '')
            + (aba.doFormulario && aba.doFormulario.length
              ? ' · campos criados em Cadastrar Caso: '
                + escapar(aba.doFormulario.join(', ')) : '')
            + (aba.aMais.length
              ? ' · colunas suas, fora do contrato (o sistema não mexe nelas): '
                + escapar(aba.aMais.join(', ')) : ''))
        + '</span></li>';
    }).join('');

    elemento('config-lista').innerHTML = '<div class="config-cabeca">'
      + '<span class="config-titulo">'
      + (laudo.ok ? 'A planilha está no contrato' : 'A planilha saiu do contrato')
      + '</span></div>'
      + '<p class="config-explica">Coluna que sumiu e coluna que apareceu são '
      + 'mostradas lado a lado, sem conserto automático: o sistema não adivinha '
      + 'que uma virou a outra, porque adivinhar erraria calado e o dado iria '
      + 'para a coluna errada.</p>'
      + '<ul class="config-itens laudo">' + abas + '</ul>';

    elemento('config-lista').innerHTML += desenharDiagnostico()
      + desenharMudancasDaPlanilha()
      + desenharCadastros() + desenharChat() + desenharArquivoDaAuditoria()
      + desenharLegado();
    ligarDiagnostico();
    ligarMudancasDaPlanilha();
    ligarCadastros();
    ligarArquivoDaAuditoria();
    ligarLegado();

    elemento('config-painel').innerHTML = '<div class="config-form">'
      + tituloDoPainel('O que foi feito', 'As 40 ações mais recentes')
      + (dados.trilha.length
        ? '<ul class="trilha">' + dados.trilha.map(function (linha) {
          return '<li><span class="quando">' + escapar(linha.dataHora) + '</span>'
            + '<span class="oque">' + escapar(linha.acao) + '</span>'
            + '<span class="quem">' + escapar(linha.quem)
            + (linha.detalhe ? ' · ' + escapar(linha.detalhe) : '')
            + '</span></li>';
        }).join('') + '</ul>'
        : '<p class="config-vazio">Nada foi alterado ainda. A trilha começa a '
          + 'encher no primeiro ajuste — e guarda quem fez, o quê e quando.</p>')
      + desenharErrosRecentes()
      + '</div>';
  }

  function desenharErrosRecentes() {
    var erros = dados.erros || [];
    return '<div id="erros-recentes">'
      + tituloDoPainel('Erros recentes', 'Os 40 mais recentes')
      + (erros.length
        ? '<ul class="trilha">' + erros.map(function (erro) {
          return '<li><span class="quando">' + escapar(erro.dataHora) + '</span>'
            + '<span class="oque">' + escapar(erro.onde) + ' — ' + escapar(erro.mensagem) + '</span>'
            + '<span class="quem">' + escapar(erro.quem)
            + (erro.detalhe ? ' · ' + escapar(erro.detalhe.slice(0, 300)) : '')
            + '</span></li>';
        }).join('') + '</ul>'
        : '<p class="config-vazio">Nenhum erro registrado. Quando a tela quebrar, a '
          + 'auditoria não gravar ou o servidor não responder a tempo, aparece aqui — '
          + 'com quem, quando e onde. A planilha guarda os 2.000 mais recentes, na aba ERROS.</p>')
      + '</div>';
  }

  function desenharDiagnostico() {
    return '<div class="config-legado" id="caixa-do-diagnostico">'
      + '<h4>Diagnóstico do sistema</h4>'
      + '<p class="config-explica">Confere o sistema inteiro: fuso, estrutura, '
      + 'sequências de Id, Ids repetidos, canais, campos, painéis, análises, '
      + 'quem consegue configurar, e se toda função que a tela chama existe no '
      + 'servidor. <strong>Só lê</strong> — não muda nada.</p>'
      + '<div class="config-acoes">'
      + '<button type="button" class="botao vazado" id="rodar-diagnostico">'
      + 'Rodar diagnóstico</button></div>'
      + '<div id="resultado-do-diagnostico"></div></div>';
  }

  function ligarDiagnostico() {
    elemento('rodar-diagnostico').addEventListener('click', function () {
      var onde = elemento('resultado-do-diagnostico');
      onde.innerHTML = '<p class="carregando-campos">Conferindo o sistema…</p>';
      Servidor.chamarSemPressa('diagnosticoDoSistema')
        .entao(function (laudo) { onde.innerHTML = laudoDesenhado(laudo); })
        .senao(function (erro) {
          onde.innerHTML = '<p class="carregando-campos erro-carga">'
            + escapar(erro.message || String(erro)) + '</p>';
        });
    });
  }

  function resumoDoBloco(bloco) {
    var falhas = bloco.itens.filter(function (i) { return i.situacao === 'falha'; });
    var atencoes = bloco.itens.filter(function (i) { return i.situacao === 'atencao'; });
    if (falhas.length) {
      return falhas.length + ' falha' + (falhas.length > 1 ? 's' : '');
    }
    if (atencoes.length) {
      return atencoes.length + ' atenção' + (atencoes.length > 1 ? 'ões' : '');
    }
    return bloco.itens.length + ' conferidos';
  }

  function laudoDesenhado(laudo) {
    var blocos = laudo.blocos.map(function (bloco) {
      var itens = bloco.itens.map(function (item) {
        return '<li class="laudo-item ' + escapar(item.situacao) + '">'
          + '<span class="oque">' + escapar(item.oQue) + '</span>'
          + (item.detalhe
            ? '<span class="detalhe">' + escapar(item.detalhe) + '</span>' : '')

          + (item.comoArrumar && item.situacao !== 'ok'
            ? '<span class="arrumar">' + escapar(item.comoArrumar) + '</span>' : '')
          + '</li>';
      }).join('');

      var certo = bloco.situacao === 'ok';
      return '<details class="laudo-bloco ' + escapar(bloco.situacao) + '"'
        + (certo ? '' : ' open') + '>'
        + '<summary>' + escapar(bloco.titulo)
        + '<span class="conta">' + resumoDoBloco(bloco) + '</span></summary>'
        + '<ul>' + itens + '</ul></details>';
    }).join('');

    return '<div class="laudo-resumo ' + (laudo.aprovado ? 'ok' : 'falha') + '">'
      + '<strong>' + (laudo.aprovado ? 'Aprovado' : 'Reprovado') + '</strong>'
      + '<span>' + laudo.resumo.total + ' verificações · '
      + laudo.resumo.falhas + ' falha(s) · '
      + laudo.resumo.atencoes + ' atenção(ões) · '
      + escapar(laudo.quando) + '</span></div>'
      + '<div class="laudo-blocos">' + blocos + '</div>';
  }

  function desenharCadastros() {
    var cadastros = dados.cadastros || { planilhaId: '', ligada: false, abas: [] };

    var quaisAbas = cadastros.abas.map(function (uma) {
      return '<li><strong>' + escapar(uma.aba) + '</strong> — '
        + escapar(uma.titulo) + '<br><small>colunas: '
        + escapar(uma.colunas.join(', ')) + '</small></li>';
    }).join('');

    return '<div class="config-legado">'
      + '<h4>Planilha de cadastros — a segunda base</h4>'
      + '<p class="config-explica">Corretoras, SUSEPs bloqueadas e as duas '
      + 'listas de analista podem morar em OUTRA planilha — <strong>escolha '
      + 'quais</strong>; as outras continuam aqui. O PGO lê dela na hora, sem '

      + '<div class="config-campo"><span>Quais listas moram nela</span>'

      + cadastros.abas.map(function (uma) {

          + escapar(uma.aba) + '"' + (cadastros.ligada && uma.naSegundaBase ? ' checked' : '')
          + '><span>' + escapar(uma.titulo) + ' (' + escapar(uma.aba) + ')</span></label>';

      + '</div><em>As desmarcadas continuam nesta planilha.</em></div>'

      + '<button type="submit" class="botao">Salvar</button>'
      + '</div></form>'
      + '<div id="laudo-dos-cadastros"></div>'
      + '<details class="config-explica"><summary>O que a planilha precisa ter'

  function abasDeFora() {
    return Array.prototype.filter.call(
      document.querySelectorAll('[data-aba-de-fora]'), function (caixa) { return caixa.checked; })
      .map(function (caixa) { return caixa.getAttribute('data-aba-de-fora'); });
  }

  function ligarCadastros() {
    elemento('conferir-cadastros').addEventListener('click', function () {
      var caixa = elemento('laudo-dos-cadastros');
      caixa.innerHTML = '<p class="carregando-campos">Abrindo a planilha…</p>';

      Servidor.chamar('conferirPlanilhaDeCadastros', valorDe('cadastrosId'), abasDeFora())
        .entao(function (laudo) {

              ? '<ul class="config-itens">' + laudo.faltando.map(function (linha) {

              }).join('') + '</ul>'
              : '')
            + (laudo.abas && laudo.abas.length
              ? '<ul class="config-itens">' + laudo.abas.map(function (uma) {
                return '<li>' + escapar(uma.aba) + ': ' + uma.linhas
                  + ' linha(s)' + (uma.completa ? '' : ' — faltam colunas')
                  + '</li>';

          caixa.innerHTML = '<p class="config-alerta">'

        });

    elemento('form-cadastros').addEventListener('submit', function (evento) {
      evento.preventDefault();

      comSenhaDeAdministrador(function () {
        Servidor.chamar('salvarConfiguracaoDosCadastros',
          { planilhaId: valorDe('cadastrosId'), abas: abasDeFora() })
          .entao(function (nova) {
            dados.cadastros = nova;

  function desenharArquivoDaAuditoria() {
    var arquivo = dados.arquivoDaAuditoria || { planilhaId: '', meses: 2,
      ultimoEm: '', ultimoQuantas: 0, linhasNaAuditoria: 0, arquivariaAte: '' };

      + campoDeTexto('arquivoId', 'Id da planilha de arquivo', arquivo.planilhaId,
        'É o pedaço do endereço entre /d/ e /edit. Precisa ser OUTRA planilha, '

  function ligarArquivoDaAuditoria() {

      + '<p class="config-explica">Para a tela responder rápido, o sistema guarda a '

      + 'PAINEIS) por até <strong>5 minutos</strong>. O que se salva por estas telas vale '

      + 'id="aplicar-mudancas-da-planilha">Aplicar mudanças da planilha agora</button></div>'
      + '</div>';
  }

  function ligarMudancasDaPlanilha() {
    var botao = elemento('aplicar-mudancas-da-planilha');
    if (!botao) return;
    botao.addEventListener('click', function () {
      botao.disabled = true;
      Servidor.chamar('aplicarMudancasDaPlanilha')
        .entao(function () {
          avisarSalvo('Pronto: as mudanças feitas na planilha já valem.');
          carregarEstrutura();
        })
        .senao(function (erro) {

          avisar(erro.message || String(erro), 'ruim');
        });

  function desenharChat() {
    return '<div class="config-legado">'
      + '<h4>Atendimentos do chat</h4>'
      + '<p class="config-explica">Os atendimentos do chat da Mesa Diamante agora entram '
      + 'pela tela de <strong>Importação</strong>: escolha a Mesa Diamante e '
      + '"Atendimentos do chat", cole ou dê o link, ligue as colunas e confira. A '
      + 'Produtividade da Mesa soma esses atendimentos aos casos do sistema.</p></div>';
  }

  function desenharLegado() {
    var legado = dados.legado;
    return '<div class="config-legado">'
      + '<h4>Planilha legada</h4>'
      + '<p class="config-explica">O histórico que ficou no sistema anterior. '
      + 'Quando apontada, a tela de Buscar Caso passa a oferecê-la como uma '
      + 'origem a mais — em leitura, sem editar nada. Vazio desliga.</p>'
      + '<form class="config-form" id="form-legado">'
      + campoDeTexto('legadoId', 'Id da planilha', legado.planilhaId,
        'É o pedaço do endereço entre /d/ e /edit. A conta que roda o sistema '
        + 'precisa ter acesso a ela.')
      + campoDeTexto('legadoAba', 'Aba', legado.aba,
        'Vazio usa a primeira aba. A primeira linha é lida como cabeçalho.')
      + campoDeTexto('legadoRotulo', 'Como aparece na busca', legado.rotulo, '')
      + '<div class="config-acoes">'
      + '<button type="submit" class="botao">Salvar planilha legada</button>'
      + '</div></form></div>';
  }

  function ligarLegado() {
    elemento('form-legado').addEventListener('submit', function (evento) {
      evento.preventDefault();
      Servidor.chamar('salvarConfiguracaoDoLegado', {
        planilhaId: valorDe('legadoId'),
        aba: valorDe('legadoAba'),
        rotulo: valorDe('legadoRotulo')
      }).entao(function (nova) {
        dados.legado = nova;
        avisarSalvo(nova.planilhaId
          ? 'Planilha legada apontada e conferida.'
          : 'Planilha legada desligada.');
      }).senao(function (erro) { avisar(erro.message || String(erro), 'ruim'); });
    });
  }

  function comSenhaDeAdministrador(acao) {
    SenhaDeAdministrador.pedir(acao, !resumo.senhaDefinida);
  }

  function tituloDoPainel(titulo, subtitulo) {
    return '<header class="config-painel-cabeca">'
      + '<h3>' + escapar(titulo) + '</h3>'
      + '<p>' + escapar(subtitulo) + '</p></header>';
  }

  function painelVazio(mensagem) {
    elemento('config-painel').innerHTML =
      '<p class="config-vazio">' + escapar(mensagem) + '</p>';
  }

  function campoDeTexto(nome, rotulo, valor, dica) {
    return '<label class="config-campo"><span>' + escapar(rotulo) + '</span>'
      + '<input type="text" id="cfg-' + nome + '" value="'
      + escapar(texto(valor)) + '">'
      + (dica ? '<em>' + escapar(dica) + '</em>' : '') + '</label>';
  }

  function campoDeSenha(nome, rotulo, dica) {
    return '<label class="config-campo"><span>' + escapar(rotulo) + '</span>'
      + '<input type="password" id="cfg-' + nome + '" autocomplete="off">'
      + (dica ? '<em>' + escapar(dica) + '</em>' : '') + '</label>';
  }

  function campoSomenteLeitura(rotulo, valor, dica) {
    return '<label class="config-campo travado"><span>' + escapar(rotulo) + '</span>'
      + '<input type="text" value="' + escapar(texto(valor)) + '" readonly>'
      + (dica ? '<em>' + escapar(dica) + '</em>' : '') + '</label>';
  }

  function caixaDeOpcoes(nome, rotulo, opcoes, escolhida, dica) {
    return '<label class="config-campo"><span>' + escapar(rotulo) + '</span>'
      + '<select id="cfg-' + nome + '">'
      + opcoes.map(function (opcao) {
        return '<option value="' + escapar(opcao) + '"'
          + (texto(opcao) === texto(escolhida) ? ' selected' : '') + '>'
          + (opcao ? escapar(opcao) : '— nenhuma —') + '</option>';
      }).join('') + '</select>'
      + (dica ? '<em>' + escapar(dica) + '</em>' : '') + '</label>';
  }

  function caixaDeItens(nome, rotulo, itens, escolhido, dica) {
    return '<label class="config-campo"><span>' + escapar(rotulo) + '</span>'
      + '<select id="cfg-' + nome + '">'
      + '<option value="">— escolha —</option>'
      + itens.map(function (item) {
        return '<option value="' + escapar(item.id) + '"'
          + (texto(item.id) === texto(escolhido) ? ' selected' : '') + '>'
          + escapar(item.nome) + '</option>';
      }).join('') + '</select>'
      + (dica ? '<em>' + escapar(dica) + '</em>' : '') + '</label>';
  }

  function caixaDeSimNao(nome, rotulo, ligado) {
    return '<label class="config-chave">'
      + '<input type="checkbox" id="cfg-' + nome + '"'
      + (ligado ? ' checked' : '') + '>'
      + '<span>' + escapar(rotulo) + '</span></label>';
  }

  function caixaDeMarcar(nome, rotulo, ligado, dica) {
    return '<label class="config-chave">'
      + '<input type="checkbox" id="cfg-' + nome + '"'
      + (ligado ? ' checked' : '') + '>'
      + '<span>' + escapar(rotulo)
      + (dica ? '<em>' + escapar(dica) + '</em>' : '') + '</span></label>';
  }

  function valorDe(nome) {
    var campo = elemento('cfg-' + nome);
    return campo ? campo.value : '';
  }

  function marcado(nome) {
    var campo = elemento('cfg-' + nome);
    return campo ? campo.checked : false;
  }

  function acharNaLista(lista, id) {
    for (var i = 0; i < lista.length; i++) {
      if (texto(lista[i].id) === texto(id)) return lista[i];
    }
    return null;
  }

  function ligarCliques(seletor, oQueFazer) {
    var botoes = document.querySelectorAll(seletor);
    for (var i = 0; i < botoes.length; i++) {
      botoes[i].addEventListener('click', function () { oQueFazer(this); });
    }
  }

  function avisarSalvo(mensagem) {
    avisar(mensagem || 'Salvo.', 'bom');
  }

  function avisar(mensagem, tom) {
    var aviso = document.createElement('div');
    aviso.className = 'aviso-flutuante tom-' + (tom || 'bom');
    aviso.setAttribute('role', 'status');
    aviso.textContent = mensagem;
    document.body.appendChild(aviso);
    window.setTimeout(function () {
      if (aviso.parentNode) aviso.parentNode.removeChild(aviso);
    }, tom === 'ruim' ? 6000 : 3200);
  }

  function mostrarErroNoPainel(erro) {
    var painel = elemento('config-painel');
    if (!painel) return window.alert(erro.message || String(erro));

    var antigo = painel.querySelector('.config-erro');
    if (antigo) antigo.parentNode.removeChild(antigo);

    var caixa = document.createElement('p');
    caixa.className = 'config-erro';
    caixa.textContent = erro.message || String(erro);
    painel.insertBefore(caixa, painel.firstChild);
    painel.scrollTop = 0;
  }

  function ligar(pacote) {
    if (pacote) pacoteDoSistema = pacote;
    Servidor.chamar('resumoDasConfiguracoes')
      .entao(function (resposta) {
        resumo = resposta;
        desenharTudo();
      })
      .senao(function (erro) {
        elemento('config').innerHTML = '<p class="carregando-campos erro-carga">'
          + escapar(erro.message || String(erro)) + '</p>';
      });
  }

  function desligar() { SenhaDeAdministrador.fechar(); }

  return { montar: montar, ligar: ligar, desligar: desligar };
})();
</script>



<!-- ==== Aplicacao.html ==== -->
<script>

var Servidor = (function () {

  var geracaoDaTela = 0;

  var SEGUNDOS_ATE_DESISTIR = 40;

  var SEGUNDOS_DAS_CHAMADAS_LONGAS = 380;

  function trocouDeTela(tela) {
    geracaoDaTela++;
    if (tela) telaDaVez = tela;
  }

  var telaDaVez = '';
  var errosJaAvisados = {};
  var errosAvisadosNestaPagina = 0;
  var MAXIMO_DE_ERROS_POR_PAGINA = 10;

  function avisarErro(tipo, mensagem, detalhe) {
    try {
      var texto = String(mensagem || 'Erro sem mensagem').slice(0, 1000);
      var chave = tipo + '|' + texto;
      if (errosJaAvisados[chave] || errosAvisadosNestaPagina >= MAXIMO_DE_ERROS_POR_PAGINA) return;
      errosJaAvisados[chave] = true;
      errosAvisadosNestaPagina++;
      if (typeof google === 'undefined' || !google.script || !google.script.run) return;
      var corrida = google.script.run.withFailureHandler(function () {});
      if (typeof corrida.registrarErroDaTela !== 'function') return;
      corrida.registrarErroDaTela({
        tela: telaDaVez, tipo: tipo, mensagem: texto,
        detalhe: String(detalhe || '').slice(0, 3000)
      });
    } catch (erro) {

    }
  }

  function chamar(nomeDaFuncao) {
    return chamarComPrazo(SEGUNDOS_ATE_DESISTIR, nomeDaFuncao,
      Array.prototype.slice.call(arguments, 1));
  }

  function chamarSemPressa(nomeDaFuncao) {
    return chamarComPrazo(SEGUNDOS_DAS_CHAMADAS_LONGAS, nomeDaFuncao,
      Array.prototype.slice.call(arguments, 1));
  }

  function chamarComPrazo(segundosAteDesistir, nomeDaFuncao, argumentos) {
    var aoDarCerto = null;
    var aoDarErrado = null;
    var minhaGeracao = geracaoDaTela;

    function aTelaAindaEAMesma() {
      if (geracaoDaTela === minhaGeracao) return true;
      console.info('Resposta de ' + nomeDaFuncao + ' descartada: a tela que '
        + 'perguntou já saiu.');
      return false;
    }

    var acompanhamento = {
      entao: function (funcao) { aoDarCerto = funcao; return acompanhamento; },
      senao: function (funcao) { aoDarErrado = funcao; return acompanhamento; }
    };

    if (typeof google === 'undefined' || !google.script || !google.script.run) {
      setTimeout(function () {
        if (aoDarErrado) {
          aoDarErrado(new Error('Esta página não está sendo servida pelo Apps '
            + 'Script, então não há servidor para chamar.'));
        }
      }, 0);
      return acompanhamento;
    }

    var jaRespondeu = false;
    var relogio = setTimeout(function () {
      if (jaRespondeu) return;
      jaRespondeu = true;
      if (!aTelaAindaEAMesma()) return;

      var erro = new Error('O servidor não respondeu "' + nomeDaFuncao + '" em '
        + segundosAteDesistir + ' segundos. Quase sempre é demora: a planilha '
        + 'ocupada com outras gravações, ou lenta.\n\n'
        + 'Se você estava gravando, pode clicar de novo: o PGO reconhece o mesmo '
        + 'envio e não grava duas vezes. Se acontece em toda tela, mesmo com '
        + 'pouca gente usando, pode ser um arquivo .gs que não foi copiado — '
        + 'execute diagnosticoRECC() no editor, que lista o que falta.');
      avisarErro('tempo', 'O servidor não respondeu "' + nomeDaFuncao + '" em '
        + segundosAteDesistir + ' segundos', '');
      if (aoDarErrado) aoDarErrado(erro);
      else console.error(erro);
    }, segundosAteDesistir * 1000);

    function responder(oQueFazer, valor) {
      if (jaRespondeu) return;
      jaRespondeu = true;
      clearTimeout(relogio);
      if (!aTelaAindaEAMesma()) return;
      if (oQueFazer) oQueFazer(valor);
      else if (valor instanceof Error) console.error(valor);
    }

    var corrida = google.script.run
      .withSuccessHandler(function (resposta) { responder(aoDarCerto, resposta); })
      .withFailureHandler(function (erro) { responder(aoDarErrado, erro); });

    try {
      if (typeof corrida[nomeDaFuncao] !== 'function') {
        clearTimeout(relogio);
        throw new Error('A função "' + nomeDaFuncao + '" não existe no '
          + 'servidor. Ou o arquivo .gs dela não foi copiado para o projeto '
          + 'do Apps Script, ou ela foi renomeada lá e a tela continua '
          + 'chamando o nome antigo. Configurações › Estrutura › Rodar '
          + 'diagnóstico lista todas de uma vez.');
      }
      corrida[nomeDaFuncao].apply(corrida, argumentos);
    } catch (erro) {
      avisarErro('servidor', erro.message, nomeDaFuncao);
      setTimeout(function () {
        if (aoDarErrado) aoDarErrado(erro);
        else console.error(erro);
      }, 0);
    }
    return acompanhamento;
  }

  function novoEnvio() {
    return Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 12);
  }

  return {
    chamar: chamar, chamarSemPressa: chamarSemPressa, trocouDeTela: trocouDeTela,
    novoEnvio: novoEnvio, avisarErro: avisarErro
  };
})();

if (typeof window !== 'undefined' && window.addEventListener) {
  window.addEventListener('error', function (evento) {
    var pilha = evento.error && evento.error.stack ? evento.error.stack : '';
    Servidor.avisarErro('javascript', evento.message,
      (evento.filename || '') + ':' + (evento.lineno || '') + (pilha ? '\n' + pilha : ''));
  });
  window.addEventListener('unhandledrejection', function (evento) {
    var motivo = evento.reason;
    Servidor.avisarErro('javascript', motivo && motivo.message ? motivo.message : String(motivo),
      motivo && motivo.stack ? motivo.stack : '');
  });
}

var Rotas = (function () {

  var TELAS = {
    trabalho: {
      titulo: 'Trabalho',
      subtitulo: 'Visão do dia: indicadores e a fila de trabalho da sua equipe.',
      montar: function (pacote) { return TelaTrabalho.montar(pacote); },
      ligar: function (pacote) { TelaTrabalho.ligar(pacote); }
    },
    cadastrarCaso: {
      titulo: 'Cadastrar Caso',
      subtitulo: 'Registro de um caso novo, com o formulário montado pelo canal.',
      montar: function (pacote) { return TelaCadastrarCaso.montar(pacote); },
      ligar: function (pacote) { TelaCadastrarCaso.ligar(pacote); },
      desligar: function () { TelaCadastrarCaso.desligar(); }
    },
    buscarCaso: {
      titulo: 'Buscar Caso',
      subtitulo: 'Encontre um caso pelo protocolo, pela apólice ou pelo segurado.',
      montar: function (pacote) { return TelaBuscarCaso.montar(pacote); },
      ligar: function (pacote) { TelaBuscarCaso.ligar(pacote); }
    },
    tabelaCorretoras: {
      titulo: 'Tabela de Corretoras',
      subtitulo: 'Canais, corretores e agentes, com segmento e situação da SUSEP.',
      montar: function (pacote) { return TelaTabelaCorretoras.montar(pacote); },
      ligar: function (pacote) { TelaTabelaCorretoras.ligar(pacote); },
      desligar: function () { TelaTabelaCorretoras.desligar(); }
    },
    importacao: {
      titulo: 'Importação',
      subtitulo: 'Traga uma base inteira de outra planilha e divida entre os analistas.',
      montar: function (pacote) { return TelaImportacao.montar(pacote); },
      ligar: function (pacote) { TelaImportacao.ligar(pacote); }
    },
    produtividade: {
      titulo: 'Produtividade RECC',
      subtitulo: 'Explore dados e identifique oportunidades para a operação.',
      montar: function (pacote) { return TelaProdutividade.montar(pacote); },
      ligar: function (pacote) { TelaProdutividade.ligar(pacote); },
      desligar: function () { TelaProdutividade.desligar(); }
    },
    configuracoes: {
      titulo: 'Configurações',
      subtitulo: 'Personalize o sistema de acordo com a realidade da sua operação.',
      montar: function (pacote) { return TelaConfiguracoes.montar(pacote); },
      ligar: function (pacote) { TelaConfiguracoes.ligar(pacote); },
      desligar: function () { TelaConfiguracoes.desligar(); }
    }
  };

  function existe(tela) { return Object.prototype.hasOwnProperty.call(TELAS, tela); }
  function pegar(tela) { return TELAS[tela]; }

  return { existe: existe, pegar: pegar };
})();

var Aplicacao = (function () {
  var pacote = null;
  var telaAtual = '';

  function elemento(id) { return document.getElementById(id); }

  function tituloDaTela(tela, seNaoAchar) {
    var achado = (pacote.menu || []).filter(function (item) {
      return item.tela === tela;
    })[0];
    return achado && achado.titulo ? achado.titulo : seNaoAchar;
  }

  function aplicarTema(tema) {
    document.documentElement.setAttribute('data-tema', tema);
    if (pacote) pacote.tema = tema;
    var bolinhas = document.querySelectorAll('.tema');
    for (var i = 0; i < bolinhas.length; i++) {
      bolinhas[i].setAttribute('aria-pressed',
        bolinhas[i].getAttribute('data-tema') === tema ? 'true' : 'false');
    }
  }

  function trocarTema(tema) {
    aplicarTema(tema);

    Servidor.chamar('salvarTemaDoUsuario', tema).senao(function (erro) {
      console.warn('Não consegui guardar o tema: ' + erro.message);
    });
  }

  function podeVer(tela) {
    for (var i = 0; i < pacote.menu.length; i++) {
      if (pacote.menu[i].tela === tela) return true;
    }
    return false;
  }

  function irPara(tela, semHistorico) {

    Servidor.trocouDeTela(tela);

    if (!Rotas.existe(tela) || !podeVer(tela)) {
      tela = pacote.menu.length ? pacote.menu[0].tela : 'trabalho';
    }

    if (telaAtual && Rotas.existe(telaAtual)) {
      var anterior = Rotas.pegar(telaAtual);
      if (anterior.desligar) anterior.desligar();
    }
    telaAtual = tela;

    var definicao = Rotas.pegar(tela);
    var comoSeChama = tituloDaTela(tela, definicao.titulo);

    elemento('superior').innerHTML = Moldura.montarSuperior(pacote);
    elemento('lateral').innerHTML = Moldura.montarLateral(pacote, tela);

    elemento('miolo').setAttribute('data-tela', tela);
    document.body.classList.add('com-casca');
    elemento('miolo').innerHTML = '<div class="cabecalho-da-tela">'
      + '<h2>' + Moldura.escapar(comoSeChama) + '</h2>'
      + '<p>' + Moldura.escapar(definicao.subtitulo) + '</p>'
      + '</div>'
      + definicao.montar(pacote);
    document.title = pacote.identidade.nome + ' — ' + comoSeChama;

    ligarMoldura();
    if (definicao.ligar) definicao.ligar(pacote);
    fecharMenu();
    elemento('miolo').focus();

    if (!semHistorico && location.hash !== '#' + tela) {
      location.hash = tela;
    }
  }

  function telaDoEndereco() {
    return String(location.hash || '').replace(/^#/, '');
  }

  function abrirMenu() { elemento('aplicacao').classList.add('menu-aberto'); }
  function fecharMenu() { elemento('aplicacao').classList.remove('menu-aberto'); }

  function alternarEncolhido() {
    var aplicacao = elemento('aplicacao');
    var encolhida = aplicacao.classList.toggle('encolhida');
    document.body.classList.toggle('menu-encolhido', encolhida);
    try {
      localStorage.setItem('recc.menuEncolhido', encolhida ? 'sim' : 'nao');
    } catch (erro) {

    }
  }

  function restaurarEncolhido() {
    try {
      if (localStorage.getItem('recc.menuEncolhido') === 'sim') {
        elemento('aplicacao').classList.add('encolhida');
        document.body.classList.add('menu-encolhido');
      }
    } catch (erro) {   }
  }

  function ligarMoldura() {
    var itens = document.querySelectorAll('.lateral-item');
    for (var i = 0; i < itens.length; i++) {
      itens[i].addEventListener('click', function () {
        irPara(this.getAttribute('data-tela'));
      });
    }

    var bolinhas = document.querySelectorAll('.tema');
    for (var t = 0; t < bolinhas.length; t++) {
      bolinhas[t].addEventListener('click', function () {
        trocarTema(this.getAttribute('data-tema'));
      });
    }

    var encolher = elemento('encolher');
    if (encolher) encolher.addEventListener('click', alternarEncolhido);

    var abrir = elemento('abrir-menu');
    if (abrir) abrir.addEventListener('click', abrirMenu);

    var buscaGlobal = elemento('busca-global');
    if (buscaGlobal) buscaGlobal.addEventListener('keydown', function (evento) {
      if (evento.key !== 'Enter') return;
      evento.preventDefault();
      var termo = this.value.trim();
      if (!termo) return;
      TelaBuscarCaso.procurarPor(termo);
      irPara('buscarCaso');
    });

    var recarregar = elemento('recarregar');
    if (recarregar) recarregar.addEventListener('click', function () {

      this.classList.add('girando');
      Aplicacao.remontar();
    });

    var veu = elemento('veu');
    if (veu) veu.addEventListener('click', fecharMenu);
  }

  function ligarTeclado() {
    document.addEventListener('keydown', function (evento) {
      if ((evento.ctrlKey || evento.metaKey) && evento.key === 'k') {
        evento.preventDefault();
        var busca = elemento('busca-global');
        if (busca) busca.focus();
      }
      if (evento.key === 'Escape') fecharMenu();
    });
    window.addEventListener('hashchange', function () {
      var tela = telaDoEndereco();
      if (tela && tela !== telaAtual) irPara(tela, true);
    });
  }

  function recusar(motivo) {
    elemento('carregando').hidden = true;
    elemento('recusado').hidden = false;
    elemento('recusado-motivo').textContent = motivo;
  }

  function pacoteQueVeioNaPagina() {
    try {
      var pronto = window.PGO_PACOTE_DE_PARTIDA;
      if (pronto && typeof pronto === 'object' && 'disponivel' in pronto) {
        return pronto;
      }
    } catch (erro) {

    }
    return null;
  }

  function iniciar() {
    var pronto = pacoteQueVeioNaPagina();
    if (pronto) { abrirCom(pronto); return; }

    Servidor.chamar('pacoteDePartida')
      .entao(function (resposta) {
        if (!resposta || !resposta.disponivel) {

          recusar((resposta && resposta.motivo)
            || 'O servidor não explicou o motivo.');
          return;
        }
        abrirCom(resposta);
      })
      .senao(function (erro) {
        recusar(erro && erro.message ? erro.message : String(erro));
      });
  }

  function abrirCom(resposta) {
    if (!resposta || !resposta.disponivel) {

      recusar((resposta && resposta.motivo)
        || 'O servidor não explicou o motivo.');
      return;
    }
    pacote = resposta;
    if (pacote.identidade && pacote.identidade.corPrimaria) {

      document.documentElement.style.setProperty(
        '--cor-da-operacao', pacote.identidade.corPrimaria);
    }
    elemento('carregando').hidden = true;
    elemento('aplicacao').hidden = false;
    restaurarEncolhido();
    aplicarTema(pacote.tema || 'padrao');
    irPara(telaDoEndereco() || 'trabalho', true);
    ligarTeclado();
  }

  function remontar() {
    if (telaAtual) irPara(telaAtual, true);
  }

  return {
    iniciar: iniciar,
    irPara: irPara,
    remontar: remontar
  };
})();

document.addEventListener('DOMContentLoaded', Aplicacao.iniciar);
</script>

</body>
</html>
