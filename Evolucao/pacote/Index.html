<!DOCTYPE html>
<html lang="pt-BR" data-tema="padrao">
<head>
  <base target="_top">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title><?= identidade.nome ?></title>

<!-- ==== Estilos.html ==== -->
<style>
/* ============================================================================
   RECC — Estilos.html · a aparência inteira do sistema
   ============================================================================
   Os QUATRO TEMAS vivem aqui, e vivem do mesmo jeito: cada um redefine as
   mesmas variáveis de cor. Nenhum componente conhece um tema — todos leem as
   variáveis. Trocar de tema é trocar um atributo no <html>, e nada mais.

   Por isso NUNCA escreva uma cor direto num componente. Se escrever, ela vai
   sobreviver à troca de tema e o rosa vai ficar com um pedaço azul.
   ============================================================================ */

:root {
  /* ---- estrutura, igual em todos os temas ---- */
  --lateral-largura: 248px;
  --lateral-encolhida: 72px;
  --raio: 10px;
  --raio-pequeno: 6px;
  --sombra: 0 1px 2px rgba(12, 27, 51, .06), 0 10px 28px -18px rgba(12, 27, 51, .35);
  --transicao: 160ms ease;

  --fonte: "Segoe UI", system-ui, -apple-system, Roboto, Arial, sans-serif;
  --fonte-dado: "Consolas", "SFMono-Regular", "Courier New", monospace;

  /* ---- semânticas: significam a mesma coisa em todo tema ---- */
  --bom: #15794A;         --bom-tenue: #E1F3EA;
  --atencao: #96590A;     --atencao-tenue: #FBEEDB;
  --ruim: #A9241D;        --ruim-tenue: #FBE7E5;
}

/* ---------------------------------------------------------- tema PADRÃO ---
   Azul Porto Seguro. A cor exata vem de CONFIG (IDENTIDADE.COR_PRIMARIA), e o
   navegador a injeta em --cor-da-operacao.

   Repare que ela NÃO é injetada em --destaque: se fosse, valeria também no
   rosa, no escuro e no Brasil, e o azul da operação apareceria no meio deles.
   Só o tema padrão consome a cor da operação; os outros trazem a sua. O valor
   abaixo é o que vale enquanto CONFIG não disser outra coisa. */
:root, :root[data-tema="padrao"] {
  --destaque: var(--cor-da-operacao, #0B77CE);
  --destaque-escuro: color-mix(in srgb, var(--destaque) 78%, black);
  --destaque-tenue: color-mix(in srgb, var(--destaque) 12%, white);
  --destaque-sobre: #FFFFFF;

  --fundo: #F4F7FB;
  --superficie: #FFFFFF;
  --superficie-2: #EDF2F8;
  --linha: #DCE4EE;
  --linha-forte: #BCC8D8;
  --texto: #14213A;
  --suave: #56667F;
  --tenue: #8494A9;

  /* O menu lateral do padrão é o azul vivo da marca, com o texto em branco e
     o item atual numa pastilha branca de texto escuro. Branco sobre o azul é
     o contraste mais alto que esse fundo aceita — e o que a operação aprovou. */
  --lateral-fundo: #17A2E8;
  --lateral-texto: #FFFFFF;
  --lateral-titulo: #FFFFFF;
  --lateral-marca-realce: #0A2A3D;
  --lateral-linha: #47BAF0;
  --lateral-ativo: #FFFFFF;
  --lateral-ativo-texto: #0A2A3D;

  --violeta: #6B4FD8;     --violeta-tenue: #EDE9FB;

  /* A paleta dos gráficos. Seis tons em ORDEM FIXA, nunca girados: um sétimo
     valor vira "Outros", e não uma cor nova — cor gerada na hora fica
     indistinguível das outras para quem não enxerga cor.

     Estes seis passaram na conferência de daltonismo (menor separação entre
     vizinhos ΔE 9,1) e de visão normal (ΔE 19,6) sobre fundo claro. Três
     deles ficam abaixo de 3:1 de contraste com o fundo, e é por isso que
     todo gráfico tem rótulo direto e uma tabela por baixo: cor é a segunda
     leitura, nunca a única. */
  --serie-1: #2A78D6;
  --serie-2: #EB6834;
  --serie-3: #1BAF7A;
  --serie-4: #EDA100;
  --serie-5: #E87BA4;
  --serie-6: #008300;
}

/* ------------------------------------------------------------- tema ROSA -- */
:root[data-tema="rosa"] {
  --destaque: #C2185B;
  --destaque-escuro: #8E1145;
  --destaque-tenue: #FCE7F0;
  --destaque-sobre: #FFFFFF;

  --fundo: #FCF5F8;
  --superficie: #FFFFFF;
  --superficie-2: #F8EAF1;
  --linha: #EED6E1;
  --linha-forte: #DCB4C7;
  --texto: #2B1420;
  --suave: #6E5260;
  --tenue: #9C8290;

  --lateral-fundo: #E8489B;
  --lateral-texto: #FFFFFF;
  --lateral-titulo: #FFFFFF;
  --lateral-marca-realce: #3A0A22;
  --lateral-linha: #F084BE;
  --lateral-ativo: #FFFFFF;
  --lateral-ativo-texto: #3A0A22;

  --violeta: #6D28D9;     --violeta-tenue: #EDE7FB;

  /* A paleta dos gráficos. Seis tons em ORDEM FIXA, nunca girados: um sétimo
     valor vira "Outros", e não uma cor nova — cor gerada na hora fica
     indistinguível das outras para quem não enxerga cor.

     Estes seis passaram na conferência de daltonismo (menor separação entre
     vizinhos ΔE 9,1) e de visão normal (ΔE 19,6) sobre fundo claro. Três
     deles ficam abaixo de 3:1 de contraste com o fundo, e é por isso que
     todo gráfico tem rótulo direto e uma tabela por baixo: cor é a segunda
     leitura, nunca a única. */
  --serie-1: #2A78D6;
  --serie-2: #EB6834;
  --serie-3: #1BAF7A;
  --serie-4: #EDA100;
  --serie-5: #E87BA4;
  --serie-6: #008300;
}

/* ------------------------------------------------------------- tema DARK -- */
:root[data-tema="dark"] {
  --destaque: #5C9DFF;
  --destaque-escuro: #7FB4FF;
  --destaque-tenue: #14294A;
  --destaque-sobre: #06182F;

  --fundo: #0A101C;
  --superficie: #121B2B;
  --superficie-2: #182438;
  --linha: #26344C;
  --linha-forte: #3A4B69;
  --texto: #E7EDF7;
  --suave: #9AAAC2;
  --tenue: #75879F;


  /* Os mesmos seis tons, repassados para o fundo escuro — e não a paleta
     clara girada. Aqui todos passam de 3:1 de contraste. */
  --serie-1: #3987E5;
  --serie-2: #D95926;
  --serie-3: #199E70;
  --serie-4: #C98500;
  --serie-5: #D55181;
  --serie-6: #008300;

  --lateral-fundo: #0E1725;
  --lateral-texto: #9EB0C9;
  --lateral-titulo: #FFFFFF;
  --lateral-marca-realce: #5C9DFF;
  --lateral-linha: #202D42;
  --lateral-ativo: #1E3358;
  --lateral-ativo-texto: #FFFFFF;

  --violeta: #A794F5;     --violeta-tenue: #241E45;

  --bom: #5CC894;         --bom-tenue: #123528;
  --atencao: #E0A253;     --atencao-tenue: #3A2A12;
  --ruim: #F08981;        --ruim-tenue: #3B1A18;
}

/* ----------------------------------------------------------- tema BRASIL -- */
:root[data-tema="brasil"] {
  --destaque: #0E7A3C;
  --destaque-escuro: #0A5A2C;
  --destaque-tenue: #E2F3E8;
  --destaque-sobre: #FFFFFF;

  --fundo: #F5FAF6;
  --superficie: #FFFFFF;
  --superficie-2: #E9F4EC;
  --linha: #D3E5D8;
  --linha-forte: #AECDB7;
  --texto: #10251A;
  --suave: #4E6656;
  --tenue: #7C9585;

  --lateral-fundo: #12A150;
  --lateral-texto: #FFFFFF;
  --lateral-titulo: #FFFFFF;
  --lateral-marca-realce: #06301A;
  --lateral-linha: #4DC181;
  --lateral-ativo: #FFFFFF;
  --lateral-ativo-texto: #06301A;

  --violeta: #5B41C4;     --violeta-tenue: #EAE6FA;

  /* A paleta dos gráficos. Seis tons em ORDEM FIXA, nunca girados: um sétimo
     valor vira "Outros", e não uma cor nova — cor gerada na hora fica
     indistinguível das outras para quem não enxerga cor.

     Estes seis passaram na conferência de daltonismo (menor separação entre
     vizinhos ΔE 9,1) e de visão normal (ΔE 19,6) sobre fundo claro. Três
     deles ficam abaixo de 3:1 de contraste com o fundo, e é por isso que
     todo gráfico tem rótulo direto e uma tabela por baixo: cor é a segunda
     leitura, nunca a única. */
  --serie-1: #2A78D6;
  --serie-2: #EB6834;
  --serie-3: #1BAF7A;
  --serie-4: #EDA100;
  --serie-5: #E87BA4;
  --serie-6: #008300;

  --atencao: #8A6300;     --atencao-tenue: #FBF0CF;
}

/* ============================================================== base ===== */
* { box-sizing: border-box; }

/**
 * O atributo `hidden` esconde por padrão do navegador — e QUALQUER `display`
 * escrito por nós ganha dele. As telas de abertura usam `display: grid`, e
 * por isso continuavam ocupando 100vh cada uma DEPOIS de escondidas: o
 * sistema abria com duas telas mortas acima dele.
 *
 * Isto tem de vir antes de tudo, e com !important, porque é a única forma de
 * um atributo do HTML vencer uma classe do CSS.
 */
[hidden] { display: none !important; }

html, body { height: 100%; }

body {
  margin: 0;
  background: var(--fundo);
  color: var(--texto);
  font-family: var(--fonte);
  font-size: 16px;
  line-height: 1.55;
  -webkit-font-smoothing: antialiased;
}

button { font: inherit; color: inherit; }

.botao {
  border: 1px solid var(--destaque);
  background: var(--destaque);
  color: var(--destaque-sobre);
  border-radius: var(--raio-pequeno);
  padding: 9px 18px;
  cursor: pointer;
  font-weight: 600;
}
.botao:hover { background: var(--destaque-escuro); border-color: var(--destaque-escuro); }

:focus-visible { outline: 2px solid var(--destaque); outline-offset: 2px; border-radius: 4px; }

/* ====================================================== abertura ========= */
.carregando, .recusado {
  min-height: 100vh;
  display: grid;
  place-content: center;
  justify-items: center;
  gap: 14px;
  padding: 24px;
  text-align: center;
}
.carregando-marca {
  font-size: 30px; font-weight: 700; letter-spacing: -.02em; color: var(--destaque);
}
.carregando-barra {
  width: 190px; height: 4px; border-radius: 3px;
  background: var(--superficie-2); overflow: hidden;
}
.carregando-barra span {
  display: block; height: 100%; width: 40%; border-radius: 3px;
  background: var(--destaque); animation: desliza 1.1s ease-in-out infinite;
}
@keyframes desliza {
  0% { transform: translateX(-110%); } 100% { transform: translateX(360%); }
}
.carregando p, .recusado p { color: var(--suave); margin: 0; max-width: 46ch; }
.recusado h1 { font-size: 22px; margin: 0; }

@media (prefers-reduced-motion: reduce) {
  .carregando-barra span { animation: none; width: 100%; }
}

/* ====================================================== a casca ========== */
.aplicacao { display: flex; min-height: 100vh; }
.coluna { flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; }

/* -------------------------------------------------------- menu lateral -- */
.lateral {
  flex: 0 0 var(--lateral-largura);
  width: var(--lateral-largura);
  background: var(--lateral-fundo);
  color: var(--lateral-texto);
  display: flex;
  flex-direction: column;
  position: sticky;
  top: 0;
  height: 100vh;
  transition: flex-basis var(--transicao), width var(--transicao);
}
.aplicacao.encolhida .lateral {
  flex-basis: var(--lateral-encolhida);
  width: var(--lateral-encolhida);
}

.lateral-marca {
  display: flex; align-items: center; gap: 10px;
  padding: 18px 14px; min-height: 72px;
  border-bottom: 1px solid var(--lateral-linha);
}
.lateral-marca img { max-height: 30px; max-width: 140px; }
.lateral-marca .escrito {
  font-size: 24px; font-weight: 800; letter-spacing: -.02em; color: var(--lateral-titulo);
  white-space: nowrap;
}
.lateral-marca .escrito em { font-style: normal; color: var(--lateral-marca-realce); }

/* O botão de encolher fica no topo, ao lado da marca — é onde a mão procura. */
.lateral-encolher {
  margin-left: auto; flex: 0 0 auto;
  display: grid; place-items: center;
  width: 34px; height: 34px; border-radius: 8px;
  border: 0; background: var(--lateral-marca-realce);
  color: var(--lateral-fundo); cursor: pointer;
}
.lateral-encolher:hover { opacity: .85; }
.lateral-encolher svg { width: 18px; height: 18px; }

.lateral-itens { list-style: none; margin: 0; padding: 14px 10px; flex: 1 1 auto; overflow-y: auto; }
.lateral-itens li { margin-bottom: 2px; }

.lateral-item {
  display: flex; align-items: center; gap: 13px; width: 100%;
  padding: 12px 13px; border: 0; border-radius: var(--raio-pequeno);
  background: transparent; color: var(--lateral-texto);
  cursor: pointer; text-align: left; font-size: 15px;
  /* Peso normal, e não seminegrito: o menu é lido de relance o dia inteiro.
     Texto grosso em cima de fundo saturado cansa a vista em uma hora. */
  font-weight: 400;
  /* Branco puro a 100% sobre o azul vibra; .92 tira o brilho sem apagar o
     texto, e o item atual continua sendo o único totalmente opaco. */
  opacity: .92;
}
.lateral-item:hover { background: var(--lateral-linha); opacity: 1; }
/* Só o item atual ganha peso — é o único que precisa se destacar. */
.lateral-item[aria-current="page"] {
  background: var(--lateral-ativo); color: var(--lateral-ativo-texto);
  font-weight: 600; opacity: 1;
}
.lateral-item svg { flex: 0 0 21px; width: 21px; height: 21px; opacity: .95; }
.lateral-item[aria-current="page"] svg { opacity: 1; }
.lateral-item .rotulo { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.aplicacao.encolhida .lateral-item .rotulo { display: none; }
.aplicacao.encolhida .lateral-marca .escrito { display: none; }
.aplicacao.encolhida .lateral-item { justify-content: center; }

/* O rodapé diz de quem é a plataforma. Vem de CONFIG, como todo o resto da
   identidade — trocar de operação não pode exigir mexer em código. */
.lateral-pe {
  padding: 16px 16px 20px;
  border-top: 1px solid var(--lateral-linha);
  color: var(--lateral-texto);
  font-size: 11.5px; line-height: 1.5; font-weight: 600;
}
.lateral-pe .fabricante { font-weight: 400; opacity: .85; }
.aplicacao.encolhida .lateral-pe { display: none; }
.aplicacao.encolhida .lateral-encolher svg { transform: rotate(180deg); }

/* ------------------------------------------------------ barra superior -- */
.superior {
  position: sticky; top: 0; z-index: 20;
  display: flex; flex-wrap: wrap; align-items: center; gap: 12px 16px;
  padding: 14px 22px;
  background: var(--superficie);
  border-bottom: 1px solid var(--linha);
}
/* A barra superior mostra a IDENTIDADE do sistema, não o nome da tela. O
   nome da tela fica no topo do conteúdo, junto do que ele nomeia. */
.superior .identidade { min-width: 180px; flex: 1 1 260px; }
.superior .identidade h1 {
  margin: 0; font-size: 16.5px; font-weight: 700; letter-spacing: -.012em;
  line-height: 1.3;
}
.superior .identidade p { margin: 2px 0 0; font-size: 13px; color: var(--suave); }

.abrir-menu {
  display: none; width: 38px; height: 38px; border-radius: var(--raio-pequeno);
  border: 1px solid var(--linha); background: var(--superficie); cursor: pointer;
}

.busca {
  position: relative; flex: 1 1 260px; max-width: 420px; min-width: 180px;
}
.busca input {
  width: 100%; padding: 9px 62px 9px 36px;
  border: 1px solid var(--linha); border-radius: var(--raio-pequeno);
  background: var(--superficie-2); color: var(--texto); font: inherit; font-size: 14.5px;
}
.busca input::placeholder { color: var(--tenue); }
.busca svg {
  position: absolute; left: 11px; top: 50%; transform: translateY(-50%);
  width: 16px; height: 16px; color: var(--tenue);
}
.busca kbd {
  position: absolute; right: 9px; top: 50%; transform: translateY(-50%);
  font-family: var(--fonte); font-size: 11px; color: var(--tenue);
  border: 1px solid var(--linha); border-radius: 4px; padding: 2px 6px;
  background: var(--superficie);
}

/* A data do último registro. Não é filtro nem seletor: é o aviso de que a
   base está — ou não está — atualizada. Data velha aqui significa carga que
   não rodou, e é a primeira coisa que a operação olha de manhã. */
.ultimo-registro {
  display: flex; align-items: center; gap: 8px;
  padding: 9px 14px; font-size: 14px; font-weight: 500;
  border: 1px solid var(--linha); border-radius: 999px;
  background: var(--superficie); white-space: nowrap;
}
.ultimo-registro svg { width: 16px; height: 16px; color: var(--tenue); }
.ultimo-registro.vazio { color: var(--tenue); font-weight: 400; }

/* -------------------------------------------------- as quatro bolinhas -- */
.temas { display: flex; align-items: center; gap: 7px; }
.tema {
  width: 20px; height: 20px; border-radius: 50%; cursor: pointer;
  border: 2px solid transparent; padding: 0;
  /* O anel por FORA, e num cinza que aparece nos dois fundos. Por dentro, a
     bolinha do tema escuro sumia dentro da barra do próprio tema escuro. */
  box-shadow: 0 0 0 1px rgba(128, 128, 128, .55);
}
.tema[aria-pressed="true"] {
  border-color: var(--texto);
  box-shadow: 0 0 0 1px var(--superficie);
}
.tema-padrao { background: var(--cor-da-operacao, #0B77CE); }
.tema-rosa   { background: #C2185B; }
.tema-dark   { background: #2B3A52; }
.tema-brasil { background: linear-gradient(135deg, #0E7A3C 50%, #F0B400 50%); }

.pessoa {
  display: flex; align-items: center; gap: 10px;
  padding: 5px 16px 5px 6px; border-radius: 999px;
  background: var(--destaque); color: var(--destaque-sobre);
}
.pessoa .iniciais {
  width: 32px; height: 32px; border-radius: 50%;
  display: grid; place-items: center;
  background: var(--destaque-sobre); color: var(--destaque);
  font-weight: 700; font-size: 12.5px;
}
.pessoa .quem { line-height: 1.2; }
.pessoa .quem strong { display: block; font-size: 14.5px; font-weight: 700; }
.pessoa .quem span { font-size: 12px; opacity: .85; }

/* -------------------------------------------------------------- miolo --- */
.miolo { padding: 22px; flex: 1 1 auto; }

.cabecalho-da-tela { margin-bottom: 18px; }
.cabecalho-da-tela h2 {
  margin: 0; font-size: 27px; font-weight: 700; letter-spacing: -.024em;
  line-height: 1.2;
}
.cabecalho-da-tela p { margin: 4px 0 0; font-size: 15px; color: var(--suave); max-width: 70ch; }

.cartao {
  background: var(--superficie);
  border: 1px solid var(--linha);
  border-radius: var(--raio);
  padding: 22px;
  box-shadow: var(--sombra);
}

/* =========================================================== dashboard === */

.cartoes {
  display: grid; gap: 12px; margin-bottom: 18px;
  grid-template-columns: repeat(auto-fit, minmax(158px, 1fr));
}
/* Cada tom pinta a faixa de cima, o número e a etiqueta da fila. São NOMES
   de cor, resolvidos aqui, porque cada tema tem o seu verde e o seu vermelho. */
.tom-neutro   { --tom: var(--tenue);    --tom-tenue: var(--superficie-2); }
.tom-destaque { --tom: var(--destaque); --tom-tenue: var(--destaque-tenue); }
.tom-bom      { --tom: var(--bom);      --tom-tenue: var(--bom-tenue); }
.tom-atencao  { --tom: var(--atencao);  --tom-tenue: var(--atencao-tenue); }
.tom-ruim     { --tom: var(--ruim);     --tom-tenue: var(--ruim-tenue); }
.tom-violeta  { --tom: var(--violeta);  --tom-tenue: var(--violeta-tenue); }

.indicador {
  background: var(--superficie); border: 1px solid var(--linha);
  border-top: 3px solid var(--tom, var(--linha-forte));
  border-radius: var(--raio); padding: 14px 16px 13px;
  box-shadow: var(--sombra);
  display: flex; flex-direction: column; gap: 2px;
  text-align: left; font: inherit; color: inherit;
}
.indicador .rotulo {
  font-size: 12.5px; color: var(--suave); line-height: 1.3;
  min-height: 2.6em;   /* o número fica na mesma altura em todos os cartões */
}
.indicador .numero {
  font-size: 30px; font-weight: 700; letter-spacing: -.02em; line-height: 1.1;
  font-variant-numeric: tabular-nums; color: var(--tom, var(--texto));
}
.indicador.tom-neutro .numero { color: var(--texto); }

.indicador .variacao {
  display: flex; align-items: baseline; gap: 5px;
  font-size: 12px; font-weight: 600; margin-top: 3px;
}
.indicador .variacao em {
  font-style: normal; font-weight: 400; font-size: 11px; color: var(--tenue);
}
.indicador .variacao.subiu { color: var(--bom); }
.indicador .variacao.desceu { color: var(--ruim); }
/* Sem base de comparação o espaço fica reservado e VAZIO: três linhas
   dizendo "sem base" em cartões lado a lado viram ruído e parecem erro. */
.indicador .variacao.vazia { visibility: hidden; }

/* Clicar num cartão filtra a fila por aquela situação — é o gesto que a tela
   existe para atender. Por isso ele precisa PARECER clicável. */
.indicador.clicavel { cursor: pointer; }
.indicador.clicavel:hover {
  border-color: var(--tom); box-shadow: 0 2px 10px -4px var(--tom);
}
.indicador.ligado {
  background: var(--tom-tenue);
  box-shadow: inset 0 0 0 1px var(--tom);
}

.filtros {
  display: flex; flex-wrap: wrap; align-items: center; gap: 10px;
  margin-bottom: 14px;
}
.filtro {
  padding: 9px 13px; font: inherit; font-size: 14px;
  color: var(--texto); background: var(--superficie);
  border: 1px solid var(--linha); border-radius: var(--raio-pequeno);
  max-width: 230px;
}
.limpar-filtros {
  border: 0; background: transparent; color: var(--destaque);
  font-size: 13.5px; font-weight: 600; cursor: pointer; padding: 4px;
}
.filtros .contagem {
  margin-left: auto; font-size: 13px; color: var(--suave);
  font-variant-numeric: tabular-nums;
}

.cartao.sem-forro { padding: 0; overflow: hidden; }
.cartao.vazio { text-align: center; padding: 40px 24px; }
.cartao.vazio strong { display: block; font-size: 16px; margin-bottom: 5px; }
.cartao.vazio p { margin: 0 auto; max-width: 46ch; color: var(--suave); }

/*
  O aviso de janela parcial. Fica no alto da tela, em tom de atenção — não de
  erro: nada está quebrado, o número é que não é o total. Vermelho aqui faria
  a operação achar que há um problema, e o problema é só de recorte.
*/
.aviso-janela {
  margin: 0 0 14px; padding: 10px 14px;
  border-radius: var(--raio-pequeno);
  border: 1px solid color-mix(in srgb, var(--atencao) 30%, transparent);
  background: var(--atencao-tenue); color: var(--texto);
  font-size: 13px; line-height: 1.45;
}
.aviso-janela strong { color: var(--atencao); }
.aviso-janela code {
  font-family: var(--fonte-dado); font-size: 12px;
  background: var(--superficie); border: 1px solid var(--linha);
  border-radius: 3px; padding: 1px 5px;
}

.aviso-fila {
  margin: 0; padding: 11px 16px; font-size: 13px; color: var(--atencao);
  background: var(--atencao-tenue); border-bottom: 1px solid var(--linha);
}

/* A tabela rola sozinha em vez de empurrar a página para o lado. */
.rolagem-tabela { overflow-x: auto; }
table.fila { border-collapse: collapse; width: 100%; min-width: 640px; font-size: 14px; }
/* A agrupada precisa de mais largura: são cinco grupos e quatro botões de
   ação. Apertada, o texto do último grupo corria para debaixo da coluna de
   ações, que é fixa na direita. Melhor a tabela rolar do que esconder dado. */
/*
  Largura fixa, e não automática: com automática o grupo de texto mais longo
  ("Motivo / assunto") tomava o espaço que quisesse e empurrava "Responsável"
  para fora da tela. Fixa, os cinco grupos dividem o que sobra depois da
  coluna de ações, e o que não couber é cortado com reticências em vez de
  esconder uma coluna inteira.
*/
table.fila.agrupada { min-width: 1060px; table-layout: fixed; }
table.fila.agrupada th.acoes-coluna, table.fila.agrupada td.acoes-coluna {
  width: 190px;
}
/* Na agrupada o texto PODE quebrar: cada célula já tem várias linhas, então
   quebrar mais uma não desalinha nada — e é o que faz as cinco colunas
   caberem sem empurrar "Responsável" para debaixo da coluna de ações. */
table.fila.agrupada th, table.fila.agrupada td { white-space: normal; }
/* Menos a linha PRINCIPAL de cada grupo: o protocolo e o nome do cliente são
   o que a pessoa varre com o olho, e partidos em duas linhas param de servir
   para isso. O que pode quebrar é o apoio e o cabeçalho. */
table.fila.agrupada .principal,
table.fila.agrupada td:first-child > span:first-child {
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
table.fila.agrupada .apoio { overflow-wrap: anywhere; }
/* A coluna de ações não quebra — os quatro botões em duas linhas dobrariam a
   altura de cada linha — e, na agrupada, também não é fixa na direita.
   Fixa, ela ficava POR CIMA de "Responsável" sempre que a tabela passava da
   largura da tela, escondendo uma coluna inteira sem avisar. Aqui a tabela
   inteira rola junto: ninguém perde coluna, e quem tem tela larga vê tudo. */
table.fila.agrupada th.acoes-coluna,
table.fila.agrupada td.acoes-coluna {
  white-space: nowrap; position: static; box-shadow: none;
}
table.fila th, table.fila td {
  /* Respiro menor que o resto da tela: a fila tem sete colunas e cada pixel
     de folga aqui empurra a coluna de ações para fora do campo de visão. */
  text-align: left; padding: 11px 12px; border-bottom: 1px solid var(--linha);
  vertical-align: middle;
  /* Sem quebra de linha: "Corretora XYZ" partido em duas linhas deixa a fila
     desalinhada e mais alta. Quando não couber, a tabela rola. */
  white-space: nowrap;
}
table.fila thead th {
  font-size: 11.5px; font-weight: 700; letter-spacing: .07em;
  text-transform: uppercase; color: var(--tenue);
  background: var(--superficie-2); white-space: nowrap;
}
table.fila tbody tr:last-child td { border-bottom: 0; }
table.fila tbody tr:hover { background: var(--superficie-2); }
table.fila tr.aberta { background: var(--destaque-tenue); }
table.fila tr.aberta:hover { background: var(--destaque-tenue); }

/*
  A fila agrupada: cada célula junta várias colunas debaixo de um título só.
  A primeira linha do grupo é a que salta — é o que a pessoa procura ao varrer
  a fila. As de baixo vêm menores, porque são o que ela confere depois de já
  ter achado a linha.
*/
table.fila.agrupada td { vertical-align: top; padding: 13px 12px; }
table.fila.agrupada td > span { display: block; }
/* A etiqueta de situação é do tamanho do texto dela, e não da coluna. */
table.fila.agrupada td > span.situacao { display: inline-flex; }
table.fila.agrupada .principal { font-weight: 600; }
table.fila.agrupada .apoio { font-size: 12.5px; color: var(--tenue); }
table.fila.agrupada td:first-child .apoio:first-child {
  font-size: 13px; color: var(--suave); margin-bottom: 5px;
}
table.fila.agrupada .situacao { margin-top: 2px; }

.situacao {
  display: inline-flex; align-items: center; gap: 6px;
  font-size: 12.5px; font-weight: 600;
  padding: 3px 11px 3px 9px; border-radius: 999px;
  background: var(--tom-tenue, var(--superficie-2));
  color: var(--tom, var(--texto));
  border: 1px solid color-mix(in srgb, var(--tom, var(--linha)) 30%, transparent);
  white-space: nowrap;
}
/* O ponto colorido faz a fila ser lida de relance, sem precisar ler o texto. */
.situacao::before {
  content: ""; width: 7px; height: 7px; border-radius: 50%;
  background: var(--tom, var(--tenue)); flex: 0 0 7px;
}
.situacao.tom-neutro { color: var(--suave); }

/* A coluna de ações fica grudada na direita: quando a tabela rola, os botões
   continuam ao alcance. Sem isso eles ficam cortados na borda da tela. */
.acoes-coluna { white-space: nowrap; text-align: right; }
table.fila th.acoes-coluna, table.fila td.acoes-coluna {
  position: sticky; right: 0;
  background: var(--superficie);
  box-shadow: -10px 0 10px -10px rgba(0, 0, 0, .22);
}
table.fila thead th.acoes-coluna { background: var(--superficie-2); }
table.fila tbody tr:hover td.acoes-coluna { background: var(--superficie-2); }
table.fila tr.aberta td.acoes-coluna { background: var(--destaque-tenue); }
/* "Ver detalhes" é a ação principal da linha, e por isso é a única cheia. */
.acao {
  display: inline-flex; align-items: center; gap: 7px; vertical-align: middle;
  border: 1px solid var(--destaque); background: var(--destaque);
  color: var(--destaque-sobre); border-radius: var(--raio-pequeno);
  padding: 7px 13px; font-size: 13px; font-weight: 600; cursor: pointer;
}
.acao:hover { background: var(--destaque-escuro); border-color: var(--destaque-escuro); }
.acao svg { width: 16px; height: 16px; flex: none; }

/* As outras três são só o desenho: elas se repetem em toda linha, e três
   botões escritos por linha empurrariam a fila inteira para fora da tela. */
.acao-icone {
  display: inline-grid; place-items: center; vertical-align: middle;
  width: 34px; height: 34px; margin-left: 6px; cursor: pointer;
  border: 1px solid var(--linha); border-radius: var(--raio-pequeno);
  background: var(--superficie); color: var(--suave);
}
.acao-icone svg { width: 17px; height: 17px; }
.acao-icone:hover { border-color: var(--destaque); color: var(--destaque); }
.acao-icone.perigo:hover {
  border-color: var(--ruim); color: var(--ruim); background: var(--ruim-tenue);
}

tr.detalhe td { background: var(--superficie-2); padding: 18px 16px; }
.detalhe-secoes {
  display: grid; gap: 18px;
  grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
}
.detalhe-secao h4 {
  margin: 0 0 8px; font-size: 11.5px; font-weight: 700; letter-spacing: .09em;
  text-transform: uppercase; color: var(--tenue);
}
.detalhe-secao .par {
  display: flex; flex-direction: column; gap: 1px; margin-bottom: 8px;
}
.detalhe-secao .par span { font-size: 12.5px; color: var(--suave); }
.detalhe-secao .par strong { font-size: 14px; font-weight: 600; overflow-wrap: anywhere; }

@media (max-width: 560px) {
  .filtro { max-width: none; flex: 1 1 100%; }
  .filtros .contagem { margin-left: 0; flex-basis: 100%; }
}

/* ====================================================== cadastrar caso === */

/* A escolha da mesa vem antes do formulário porque é ela que decide quais
   campos existem. */
.mesas { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 18px; }
.mesa {
  flex: 1 1 240px; cursor: pointer;
  display: flex; align-items: center; gap: 13px; text-align: left;
  padding: 13px 16px; border-radius: var(--raio);
  border: 1px solid var(--linha); background: var(--superficie);
  box-shadow: var(--sombra);
}
.mesa svg { flex: 0 0 26px; width: 26px; height: 26px; color: var(--destaque); }
.mesa .dizeres { min-width: 0; }
.mesa strong { display: block; font-size: 15.5px; }
.mesa .dizeres span { font-size: 13px; color: var(--suave); }
.mesa:hover { border-color: var(--linha-forte); }

/* A mesa escolhida usa o azul do menu, escurecido — é o mesmo azul da casa,
   e escuro o bastante para a letra branca ficar legível em cima dele. */
.mesa.atual {
  background: color-mix(in srgb, var(--lateral-fundo) 68%, black);
  border-color: color-mix(in srgb, var(--lateral-fundo) 68%, black);
  color: var(--lateral-titulo);
}
.mesa.atual svg { color: var(--lateral-titulo); }
.mesa.atual .dizeres span { color: var(--lateral-titulo); opacity: .82; }

.formulario { max-width: 1080px; }

.secao { border: 0; padding: 0; margin: 0 0 26px; }
.secao:last-of-type { margin-bottom: 8px; }
.secao legend {
  padding: 0; margin-bottom: 13px;
  font-size: 12.5px; font-weight: 700; letter-spacing: .09em;
  text-transform: uppercase; color: var(--tenue);
}

/* Grade em flex, e não em colunas fixas: cada mesa pergunta um conjunto
   diferente de campos, e span fixo deixaria a linha pela metade. */
.grade { display: flex; flex-wrap: wrap; gap: 14px; }
.campo { display: flex; flex-direction: column; gap: 5px; flex: 1 1 220px; }
.campo.largura-2 { flex-basis: 460px; }
.campo.largura-3 { flex-basis: 100%; }

.campo label { font-size: 13.5px; font-weight: 600; }
.campo .exigido { color: var(--ruim); }
.campo input, .campo select, .campo textarea {
  width: 100%; padding: 10px 13px; font: inherit; font-size: 15px;
  color: var(--texto); background: var(--superficie);
  border: 1px solid var(--linha); border-radius: var(--raio-pequeno);
}
.campo textarea { resize: vertical; min-height: 68px; }
.campo input:disabled, .campo select:disabled, .campo textarea:disabled {
  background: var(--superficie-2); color: var(--suave); cursor: not-allowed;
}
.campo input::placeholder { color: var(--tenue); }
.campo .ajuda { font-size: 12.5px; color: var(--tenue); }
.campo .erro { font-size: 12.5px; color: var(--ruim); font-weight: 600; }
.campo.com-erro input, .campo.com-erro select, .campo.com-erro textarea {
  border-color: var(--ruim);
  box-shadow: inset 0 0 0 1px var(--ruim);
}

/* O selo da SUSEP. "Desconhecida" tem cor própria de propósito: não é erro
   nem sucesso — é uma corretora fora do cadastro, e quem atende precisa
   perceber isso sem confundir com bloqueio. */
.selo-susep {
  font-size: 12.5px; font-weight: 600; border-radius: 999px;
  padding: 4px 11px; align-self: flex-start;
}
.selo-susep.liberada    { color: var(--bom); background: var(--bom-tenue); }
.selo-susep.bloqueada   { color: var(--ruim); background: var(--ruim-tenue); }
.selo-susep.desconhecida{ color: var(--atencao); background: var(--atencao-tenue); }
.selo-susep.conferindo  { color: var(--suave); background: var(--superficie-2); }

.acoes {
  display: flex; flex-wrap: wrap; align-items: center; gap: 12px;
  padding-top: 18px; border-top: 1px solid var(--linha);
}
.botao-secundario {
  border: 1px solid var(--linha); background: var(--superficie);
  color: var(--texto); border-radius: var(--raio-pequeno);
  padding: 9px 18px; cursor: pointer;
}
.botao-secundario:hover { background: var(--superficie-2); }
.acoes .atalho { font-size: 12.5px; color: var(--tenue); }
.acoes kbd {
  font-family: var(--fonte); font-size: 11px;
  border: 1px solid var(--linha); border-radius: 4px; padding: 1px 5px;
  background: var(--superficie-2);
}
.recado { font-size: 13.5px; font-weight: 600; margin-left: auto; }
.recado.bom { color: var(--bom); }
.recado.ruim { color: var(--ruim); }

.carregando-campos { color: var(--suave); margin: 0; padding: 8px 0 20px; }
.carregando-campos.erro-carga { color: var(--ruim); font-weight: 600; }

@media (max-width: 560px) {
  .campo, .campo.largura-2 { flex-basis: 100%; }
  .recado { margin-left: 0; flex-basis: 100%; }
}

.emconstrucao { max-width: 620px; }
.emconstrucao .fita {
  display: inline-block; margin-bottom: 12px;
  font-size: 11px; font-weight: 700; letter-spacing: .09em; text-transform: uppercase;
  color: var(--atencao); background: var(--atencao-tenue);
  border: 1px solid color-mix(in srgb, var(--atencao) 30%, transparent);
  border-radius: 3px; padding: 3px 9px;
}
.emconstrucao h2 { margin: 0 0 8px; font-size: 20px; letter-spacing: -.015em; }
.emconstrucao p { margin: 0 0 14px; color: var(--suave); }
.emconstrucao ul { margin: 0; padding-left: 20px; color: var(--suave); }
.emconstrucao li { margin-bottom: 5px; }

.veu { display: none; }

/* ====================================================== configurações ==== */
/*
  Três colunas: as seções, a lista e as propriedades. A largura das laterais é
  fixa e o meio é que cede — assim o painel da direita não fica dançando de
  tamanho a cada item escolhido.
*/
.config {
  display: grid;
  grid-template-columns: 260px minmax(0, 1fr) 340px;
  gap: 16px;
  align-items: start;
}

/*
  O menu das seções é um cartão só, com os oito itens dentro — e não oito
  cartões soltos. Cada item é uma grade de três colunas fixas:

      22px      1fr        auto
      ícone     título     quantos

  As três colunas são o motivo de a coluna do meio ser "1fr" e não "auto": com
  "auto" o título manda na largura, e os números do lado direito ficam
  desalinhados de linha para linha, cada um parando onde o texto acabou.
*/
.config-secoes {
  background: var(--superficie); border: 1px solid var(--linha);
  border-radius: var(--raio); box-shadow: var(--sombra);
  padding: 8px;
  display: flex; flex-direction: column; gap: 2px;
  align-self: start;
}
.config-secao {
  display: grid; grid-template-columns: 22px minmax(0, 1fr) auto;
  align-items: center; gap: 10px;
  width: 100%; text-align: left; cursor: pointer;
  background: none; border: 0;
  border-radius: var(--raio-pequeno);
  padding: 10px 12px;
  color: var(--suave);
  transition: background .15s ease, color .15s ease;
}
.config-secao svg { width: 19px; height: 19px; }
.config-secao .titulo { font-weight: 600; font-size: 13.5px; }
.config-secao:hover { background: var(--destaque-tenue); color: var(--destaque); }

/*
  Item escolhido: fundo no tom ESCURO da paleta, e não no tom cheio.
  Medido nos quatro temas, com o texto em --destaque-sobre:

      tema      tom cheio          tom escuro
      padrão    #0B77CE  4,62      #095CA1  6,87
      rosa      #C2185B  5,87      #8E1145  9,07
      brasil    #0E7A3C  5,43      #0A5A2C  8,36
      dark      #5C9DFF  6,55      #7FB4FF  8,37

  No tema Dark o "escuro" é mais CLARO que o tom cheio — lá o texto por cima é
  quase preto. É por isso que o par certo é sempre --destaque-escuro com
  --destaque-sobre: os dois viram juntos, tema a tema, e nenhum dos quatro cai
  abaixo do mínimo de 4,5 exigido para texto.
*/
.config-secao.atual {
  background: var(--destaque-escuro); color: var(--destaque-sobre);
}

.config-secao .quantos {
  min-width: 22px; padding: 1px 7px; border-radius: 12px;
  background: var(--superficie-2); color: var(--tenue);
  font-family: var(--fonte-dado); font-size: 11px; text-align: center;
}
.config-secao:hover .quantos {
  background: color-mix(in srgb, var(--destaque) 18%, transparent);
  color: var(--destaque);
}
.config-secao.atual .quantos {
  background: color-mix(in srgb, var(--destaque-sobre) 22%, transparent);
  color: var(--destaque-sobre);
}

/*
  A descrição da seção saiu do menu e virou a primeira linha da coluna do
  meio. No menu ela repetia oito vezes um texto que só interessa depois de
  escolher — e era o que empurrava o menu para 236px de altura por item.
*/
.config-meio { display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.config-descricao {
  margin: 0; font-size: 13px; color: var(--tenue); line-height: 1.4;
  padding-left: 2px;
}
.config-descricao:empty { display: none; }

/* ------------------------------------------------------ a importação ---- */
/*
  A área de colar é a peça central desta aba, e por isso é grande: uma caixa
  de três linhas faz a pessoa colar às cegas e não ver o que colou. Fonte de
  dado, porque o conteúdo é colunar — com fonte proporcional as colunas de um
  texto separado por TAB não se alinham, e conferir de olho fica impossível.
*/
.importar-area {
  width: 100%; box-sizing: border-box;
  font-family: var(--fonte-dado); font-size: 12.5px; line-height: 1.5;
  border: 1px solid var(--linha); border-radius: var(--raio-pequeno);
  background: var(--superficie); color: var(--texto);
  padding: 10px 12px; resize: vertical;
  white-space: pre; overflow-wrap: normal; overflow-x: auto;
}
.importar-area:focus {
  outline: none; border-color: var(--destaque);
  box-shadow: 0 0 0 3px var(--destaque-tenue);
}

.importar-colunas {
  display: flex; flex-wrap: wrap; align-items: center; gap: 6px;
  margin: 8px 0 10px; font-size: 12.5px; color: var(--tenue);
}
.importar-colunas code {
  font-family: var(--fonte-dado); font-size: 12px;
  background: var(--superficie-2); color: var(--texto);
  border: 1px solid var(--linha); border-radius: var(--raio-pequeno);
  padding: 2px 7px;
}
.importar-colunas em {
  font-style: normal; font-size: 11px; color: var(--ruim);
  margin-left: -3px; margin-right: 4px;
}

.importar-resumo {
  display: flex; flex-wrap: wrap; gap: 8px;
  margin: 14px 0 10px;
}
.importar-pastilha {
  font-size: 12.5px; padding: 5px 12px; border-radius: 999px;
  background: var(--tom-tenue); color: var(--tom);
  border: 1px solid color-mix(in srgb, var(--tom) 30%, transparent);
}
.importar-pastilha strong { font-family: var(--fonte-dado); font-size: 13.5px; }

/* A linha recusada fica marcada na tabela inteira, e não só na última coluna:
   numa lista de duzentas, procurar a pastilha vermelha coluna a coluna é
   trabalho que a cor podia poupar. */
table.fila tr.importar-recusada { background: var(--ruim-tenue); }
table.fila tr.importar-recusada:hover { background: var(--ruim-tenue); }
table.fila tr.importar-igual { color: var(--tenue); }

/*
  A lista de colunas de uma análise: BASE_RET tem 35, e trinta e cinco caixas
  empilhadas empurrariam o botão de salvar para fora da tela. Uma caixa que
  rola, com altura fixa, deixa o formulário do mesmo tamanho independentemente
  do número de colunas da mesa.
*/
.config-marcadores {
  max-height: 210px; overflow-y: auto;
  border: 1px solid var(--linha); border-radius: var(--raio-pequeno);
  background: var(--superficie-2);
  padding: 6px 8px; margin-top: 2px;
  display: flex; flex-direction: column; gap: 1px;
}
.config-marcadores .config-chave { padding: 3px 0; font-size: 12.5px; }

/* ------------------------------------------------------ o diagnóstico ---- */
.laudo-resumo {
  display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 12px;
  margin: 14px 0 12px; padding: 10px 14px;
  border-radius: var(--raio-pequeno);
  border: 1px solid color-mix(in srgb, var(--tom) 32%, transparent);
  background: var(--tom-tenue);
}
.laudo-resumo strong { color: var(--tom); font-size: 15px; }
.laudo-resumo span { font-size: 12.5px; color: var(--tenue); }
.laudo-resumo.ok    { --tom: var(--bom);  --tom-tenue: var(--bom-tenue); }
.laudo-resumo.falha { --tom: var(--ruim); --tom-tenue: var(--ruim-tenue); }

.laudo-blocos { display: flex; flex-direction: column; gap: 8px; }
.laudo-bloco {
  border: 1px solid var(--linha); border-radius: var(--raio-pequeno);
  padding: 10px 13px; background: var(--superficie);
}
.laudo-bloco > summary {
  font-size: 13px; font-weight: 600; cursor: pointer;
  display: flex; align-items: center; gap: 7px;
  list-style: none;
}
.laudo-bloco > summary::-webkit-details-marker { display: none; }
.laudo-bloco[open] > summary { margin-bottom: 6px; }
.laudo-bloco > summary .conta {
  margin-left: auto; font-family: var(--fonte-dado); font-size: 11px;
  font-weight: 500; color: var(--tenue);
}
.laudo-bloco.falha > summary .conta,
.laudo-bloco.atencao > summary .conta { color: var(--tom); font-weight: 600; }
/*
  A bolinha antes do título é o resumo do bloco. Ela existe para o olho poder
  descer a lista procurando vermelho, sem ler nada — num laudo de cinquenta
  linhas, as três que importam têm de se achar sozinhas.
*/
.laudo-bloco > summary::before {
  content: ""; width: 8px; height: 8px; border-radius: 50%; flex: none;
  background: var(--tom, var(--tenue));
}
.laudo-bloco.ok      { --tom: var(--bom); }
.laudo-bloco.atencao { --tom: var(--atencao); }
.laudo-bloco.falha {
  --tom: var(--ruim);
  border-color: color-mix(in srgb, var(--ruim) 34%, transparent);
  background: var(--ruim-tenue);
}
.laudo-bloco ul { list-style: none; margin: 0; padding: 0; }
.laudo-item {
  display: grid; gap: 1px;
  padding: 5px 0 5px 16px; position: relative; font-size: 12.5px;
}
.laudo-item::before {
  content: ""; position: absolute; left: 2px; top: 11px;
  width: 6px; height: 6px; border-radius: 50%;
  background: var(--tom, var(--tenue));
}
.laudo-item.ok      { --tom: var(--bom); color: var(--tenue); }
.laudo-item.atencao { --tom: var(--atencao); }
.laudo-item.falha   { --tom: var(--ruim); }
.laudo-item .oque { font-weight: 600; }
.laudo-item.ok .oque { font-weight: 500; }
.laudo-item .detalhe { color: var(--tenue); line-height: 1.4; }
.laudo-item .arrumar { color: var(--tom); line-height: 1.4; margin-top: 2px; }
.laudo-item .arrumar::before { content: "→ "; }

.config-alerta {
  margin-top: 10px; text-align: left; cursor: pointer;
  font-size: 12.5px; font-weight: 600; line-height: 1.35;
  color: var(--ruim); background: var(--ruim-tenue);
  border: 1px solid color-mix(in srgb, var(--ruim) 28%, transparent);
  border-radius: var(--raio-pequeno); padding: 8px 10px;
}
.config-alerta.suave {
  color: var(--atencao); background: var(--atencao-tenue);
  border-color: color-mix(in srgb, var(--atencao) 28%, transparent);
}

.config-lista, .config-painel {
  background: var(--superficie); border: 1px solid var(--linha);
  border-radius: var(--raio); box-shadow: var(--sombra);
  padding: 16px 18px;
}
.config-painel { position: sticky; top: 16px; max-height: calc(100vh - 120px); overflow-y: auto; }

.config-cabeca {
  display: flex; flex-wrap: wrap; align-items: center; gap: 10px;
  margin-bottom: 4px;
}
.config-titulo { font-weight: 600; }
.config-cabeca select {
  border: 1px solid var(--linha); border-radius: var(--raio-pequeno);
  background: var(--superficie); color: var(--texto);
  padding: 7px 10px; font: inherit; font-size: 13.5px;
}
.config-cabeca .botao.pequeno, .botao.pequeno {
  padding: 7px 13px; font-size: 13px;
}
.config-cabeca .botao.pequeno { margin-left: auto; }
.botao.vazado {
  background: var(--superficie); color: var(--texto); border-color: var(--linha);
}
.botao.vazado:hover { background: var(--superficie-2); border-color: var(--linha-forte); }
.botao.vazado.perigo { color: var(--ruim); border-color: color-mix(in srgb, var(--ruim) 32%, transparent); }
.botao.vazado.perigo:hover { background: var(--ruim-tenue); border-color: var(--ruim); }

/*
  A caixa da mesa dentro do cabeçalho da lista. Sem ela, o seletor encostava
  no botão "Criar campo" — o cabeçalho é flex e não separa sozinho quem não
  tem largura própria.
*/
.config-mesas { display: flex; align-items: center; gap: 8px; min-width: 0; }

/*
  Um bloco à parte dentro da lista: a planilha legada e o diagnóstico. Os dois
  são assunto SEPARADO do que a lista mostra, e sem a linha em cima eles
  pareciam a continuação dela.
*/
.config-legado {
  margin-top: 18px; padding-top: 16px;
  border-top: 1px solid var(--linha);
}
.config-legado h4 {
  margin: 0 0 4px; font-size: 14px; font-weight: 600;
}

.config-explica {
  font-size: 12.5px; color: var(--suave); line-height: 1.45;
  margin: 6px 0 12px;
}

.config-itens { list-style: none; margin: 0; padding: 0; }
.config-item {
  display: flex; align-items: center; gap: 8px;
  border-top: 1px solid var(--linha);
}
.config-item:first-child { border-top: 0; }
.config-item .abrir {
  flex: 1; display: grid; gap: 1px; text-align: left; cursor: pointer;
  background: none; border: 0; padding: 9px 4px;
}
.config-item .abrir:hover .nome { color: var(--destaque); }
.config-item .nome {
  font-weight: 600; font-size: 13.5px;
  display: flex; align-items: center; gap: 7px;
}
.config-item .detalhe { font-size: 12px; color: var(--tenue); }
.config-item.atual { background: var(--destaque-tenue); border-radius: var(--raio-pequeno); }
.config-item.atual .nome { color: var(--destaque); }
.config-item.desligado .nome { color: var(--tenue); font-weight: 500; }
.config-item.com-problema { background: var(--ruim-tenue); border-radius: var(--raio-pequeno); }
.config-item .alerta { color: var(--ruim); font-weight: 600; }
.config-item .ponto {
  width: 9px; height: 9px; border-radius: 50%;
  background: var(--tom, var(--tenue)); flex: none;
}

.config-item.laudo, .config-itens.laudo .config-item { display: block; padding: 9px 4px; }

.config-item .mover { display: flex; gap: 2px; flex: none; }
.config-item .seta {
  width: 24px; height: 24px; cursor: pointer;
  background: none; border: 1px solid var(--linha);
  border-radius: 4px; color: var(--suave); line-height: 1;
}
.config-item .seta:hover:not(:disabled) { background: var(--superficie-2); color: var(--texto); }
.config-item .seta:disabled { opacity: .3; cursor: default; }

/* ------------------------------------------------ o painel de propriedades */
.config-painel-cabeca { margin-bottom: 14px; }
.config-painel-cabeca h3 { margin: 0; font-size: 16px; letter-spacing: -.01em; }
.config-painel-cabeca p { margin: 2px 0 0; font-size: 12.5px; color: var(--tenue); }

.config-form { display: grid; gap: 12px; }
.config-form.larga { grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); }

.config-campo { display: grid; gap: 4px; }
.config-campo > span { font-size: 12.5px; font-weight: 600; color: var(--suave); }
/*
  O :not() não é firula. Esta regra foi escrita para campo de digitar, e
  "width: 100%" numa CAIXA DE MARCAR estica a caixinha até a largura do painel
  — o rótulo do lado é empurrado para fora e some. Aconteceu na lista de
  colunas das Análises, a primeira caixa de marcar a morar dentro de um
  .config-campo.
*/
.config-campo input:not([type="checkbox"]), .config-campo select {
  border: 1px solid var(--linha); border-radius: var(--raio-pequeno);
  background: var(--superficie); color: var(--texto);
  padding: 8px 10px; font: inherit; font-size: 13.5px; width: 100%;
}
.config-campo input:not([type="checkbox"]):focus,
.config-campo select:focus { border-color: var(--destaque); }
.config-campo em {
  font-style: normal; font-size: 11.5px; color: var(--tenue); line-height: 1.4;
}
.config-campo.travado input {
  background: var(--superficie-2); color: var(--suave); cursor: not-allowed;
}

.config-chave {
  display: flex; align-items: flex-start; gap: 8px;
  font-size: 13.5px; cursor: pointer;
}
.config-chave input { margin-top: 2px; flex: none; accent-color: var(--destaque); }
.config-chave em {
  display: block; font-style: normal; font-size: 11.5px; color: var(--tenue);
}

.config-radio { display: flex; align-items: flex-start; gap: 8px; cursor: pointer; font-size: 13.5px; }
.config-radio input { margin-top: 3px; flex: none; accent-color: var(--destaque); }
.config-radio em { display: block; font-style: normal; font-size: 11.5px; color: var(--tenue); }

.config-grupo {
  border: 1px solid var(--linha); border-radius: var(--raio-pequeno);
  padding: 10px 12px; margin: 0;
  display: grid; gap: 7px;
}
.config-grupo legend {
  font-size: 11px; font-weight: 700; letter-spacing: .07em; text-transform: uppercase;
  color: var(--tenue); padding: 0 5px;
}

.config-acoes {
  display: flex; flex-wrap: wrap; gap: 9px;
  padding-top: 12px; border-top: 1px solid var(--linha);
  grid-column: 1 / -1;
}

.config-vazio { color: var(--tenue); font-size: 13.5px; margin: 0; }
.config-erro {
  margin: 0 0 12px; font-size: 13px; font-weight: 600; line-height: 1.45;
  color: var(--ruim); background: var(--ruim-tenue);
  border: 1px solid color-mix(in srgb, var(--ruim) 28%, transparent);
  border-radius: var(--raio-pequeno); padding: 9px 11px;
}
.config-aviso {
  margin: 0; font-size: 12.5px; line-height: 1.45;
  color: var(--atencao); background: var(--atencao-tenue);
  border: 1px solid color-mix(in srgb, var(--atencao) 28%, transparent);
  border-radius: var(--raio-pequeno); padding: 9px 11px;
}
.config-aviso.forte {
  color: var(--ruim); background: var(--ruim-tenue);
  border-color: color-mix(in srgb, var(--ruim) 30%, transparent);
}

.trilha { list-style: none; margin: 0; padding: 0; }
.trilha li {
  display: grid; gap: 1px;
  padding: 8px 0; border-top: 1px solid var(--linha); font-size: 12.5px;
}
.trilha li:first-child { border-top: 0; }
.trilha .quando { font-family: var(--fonte-dado); font-size: 11.5px; color: var(--tenue); }
.trilha .oque { font-weight: 600; }
.trilha .quem { color: var(--suave); }

/* -------------------------------------------------- o diálogo da senha */
.dialogo {
  position: fixed; inset: 0; z-index: 60;
  display: grid; place-items: center; padding: 20px;
  background: rgba(6, 14, 28, .55);
}
/* O modal do caso é o mesmo diálogo, mais largo e com cabeça e pé fixos: o
   miolo rola, e os botões de Fechar e Editar ficam sempre à mão. */
.dialogo-caixa.larga {
  max-width: 860px;
  display: flex; flex-direction: column;
  max-height: min(88vh, 900px);
  padding: 0;
}
.modal-cabeca {
  display: flex; align-items: flex-start; gap: 14px;
  padding: 20px 24px 16px; border-bottom: 1px solid var(--linha);
}
.modal-cabeca h3 { margin: 0; font-size: 19px; letter-spacing: -.015em; }
.modal-cabeca p { margin: 3px 0 0; font-size: 12.5px; color: var(--tenue); }
.modal-fechar {
  margin-left: auto; flex: none; width: 34px; height: 34px; cursor: pointer;
  border: 1px solid var(--linha); border-radius: var(--raio-pequeno);
  background: var(--superficie); color: var(--suave); font-size: 15px;
}
.modal-fechar:hover { border-color: var(--destaque); color: var(--destaque); }

.modal-corpo { padding: 18px 24px; overflow-y: auto; flex: 1 1 auto; }
.modal-corpo > .situacao { margin-bottom: 16px; }

/* Duas colunas, e não quantas couberem: o olho lê um par por vez, e três
   colunas de rótulos curtos viram uma grade que ninguém sabe por onde começar. */
.modal-pares {
  display: grid; gap: 16px 40px;
  grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
}
.par-do-caso { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.par-do-caso > span { font-size: 12px; color: var(--tenue); }
.par-do-caso > strong {
  font-weight: 500; font-size: 14px; overflow-wrap: anywhere;
}

.historico { margin-top: 26px; padding-top: 20px; border-top: 1px solid var(--linha); }
.historico h4 { margin: 0 0 14px; font-size: 16px; letter-spacing: -.01em; }
.historico ul { list-style: none; margin: 0; padding: 0; }
.historico li {
  position: relative; padding: 0 0 16px 22px;
  border-left: 2px solid var(--linha);
}
.historico li:last-child { padding-bottom: 0; border-left-color: transparent; }
.historico li::before {
  content: ''; position: absolute; left: -6px; top: 4px;
  width: 10px; height: 10px; border-radius: 50%; background: var(--destaque);
}
.historico strong { display: block; font-size: 13.5px; }
.historico em { display: block; font-style: normal; font-size: 12.5px; color: var(--suave); }
.historico span { display: block; font-size: 12px; color: var(--tenue); }

.modal-pe {
  display: flex; flex-wrap: wrap; align-items: center; gap: 10px;
  justify-content: flex-end;
  padding: 14px 24px; border-top: 1px solid var(--linha);
  background: var(--superficie-2);
}
.modal-pe .recado { margin-right: auto; margin-left: 0; }
.modal-pe .botao { display: inline-flex; align-items: center; gap: 7px; }
.modal-pe .botao svg { width: 16px; height: 16px; }

/* Dentro do modal o formulário não tem cartão próprio — o modal já é um. */
.formulario.no-modal { background: none; border: 0; padding: 0; box-shadow: none; }

.dialogo-caixa {
  width: 100%; max-width: 400px;
  background: var(--superficie); border: 1px solid var(--linha);
  border-radius: var(--raio); box-shadow: 0 20px 60px -20px rgba(6, 14, 28, .6);
  padding: 20px 22px;
}
.dialogo-caixa h3 { margin: 0 0 8px; font-size: 17px; letter-spacing: -.01em; }
.dialogo-caixa p { margin: 0 0 14px; font-size: 13px; color: var(--suave); line-height: 1.5; }
.dialogo-caixa input[type="password"] {
  width: 100%; border: 1px solid var(--linha); border-radius: var(--raio-pequeno);
  background: var(--superficie); color: var(--texto);
  padding: 9px 11px; font: inherit;
}
.dialogo-erro {
  margin: 10px 0 0; font-size: 12.5px; font-weight: 600; color: var(--ruim);
}

/*
  O aviso de salvo usa o tom "bom" em fundo tênue, como todo o resto do
  sistema — e não um verde chapado com texto branco escrito à mão. Cor escrita
  direto no componente é o que fez o tema rosa nascer com botões azuis.
*/
.aviso-flutuante {
  position: fixed; z-index: 70; right: 18px; bottom: 18px;
  max-width: min(420px, calc(100vw - 36px));
  color: var(--tom); background: var(--tom-tenue);
  border: 1px solid color-mix(in srgb, var(--tom) 30%, transparent);
  border-radius: var(--raio-pequeno); padding: 10px 16px;
  font-size: 13.5px; font-weight: 600; line-height: 1.45;
  box-shadow: var(--sombra);
}

/* ------------------------------------------------- os cards dos painéis -- */
.config-mesas-cartao {
  display: grid; gap: 10px; grid-template-columns: repeat(2, 1fr);
  margin-bottom: 16px;
}
.mesa-cartao {
  display: flex; align-items: center; gap: 12px; text-align: left;
  cursor: pointer; padding: 13px 15px;
  border: 1px solid var(--linha); border-radius: var(--raio);
  background: var(--superficie); color: var(--texto);
}
.mesa-cartao:hover { border-color: var(--linha-forte); }
.mesa-cartao.atual {
  background: var(--destaque); border-color: var(--destaque);
  color: var(--destaque-sobre);
}
.mesa-cartao svg { width: 24px; height: 24px; flex: none; }
.mesa-cartao strong { display: block; font-size: 14px; }
.mesa-cartao em {
  display: block; font-style: normal; font-size: 12px; opacity: .75;
}

/* As abas de dentro de uma seção: Dashboard e Painel Analítico têm cada um
   os seus componentes, e são a mesma pergunta — "o que esta tela mostra". */
.config-abas {
  display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 14px;
  border-bottom: 1px solid var(--linha);
}
.config-aba {
  background: none; border: 0; cursor: pointer;
  padding: 9px 12px; margin-bottom: -1px;
  font-size: 13.5px; font-weight: 600; color: var(--suave);
  border-bottom: 2px solid transparent;
}
.config-aba:hover { color: var(--texto); }
.config-aba.atual { color: var(--destaque); border-bottom-color: var(--destaque); }

.card-editavel {
  border: 1px solid var(--linha); border-radius: var(--raio);
  padding: 14px 16px; margin-bottom: 10px; background: var(--superficie);
}
.card-linha {
  display: grid; gap: 12px; grid-template-columns: 1fr 1fr; margin-bottom: 12px;
}
.card-linha.rodape {
  display: flex; align-items: center; gap: 12px; margin-bottom: 0;
  padding-top: 10px; border-top: 1px solid var(--linha);
}
.card-linha.rodape .botao-texto { margin-left: auto; }

.tira-de-tons { display: flex; gap: 6px; flex-wrap: wrap; }
.tom-escolha {
  width: 34px; height: 34px; cursor: pointer; border-radius: var(--raio-pequeno);
  border: 2px solid transparent; background: var(--tom, var(--tenue));
}
.tom-escolha[aria-pressed="true"] {
  border-color: var(--texto);
  box-shadow: 0 0 0 2px var(--superficie) inset;
}

.botao-texto {
  background: none; border: 0; padding: 6px 4px; cursor: pointer;
  color: var(--destaque); font-weight: 600; font-size: 13px;
}
.botao-texto:hover { text-decoration: underline; }
.botao-texto.perigo { color: var(--ruim); }

/* O escolhedor de arquivo da logo. O campo de texto continua ali para quem
   preferir colar um endereço — o botão é o atalho, não o único caminho. */
.escolher-arquivo {
  display: flex; flex-wrap: wrap; align-items: center; gap: 10px; margin-top: 6px;
}
.escolher-arquivo input[type="file"] { display: none; }
.previa-da-logo {
  display: flex; align-items: center; gap: 10px;
  padding: 8px 12px; border: 1px solid var(--linha);
  border-radius: var(--raio-pequeno); background: var(--superficie-2);
}
.previa-da-logo img { max-height: 30px; max-width: 150px; display: block; }

/* ========================================================= buscar caso === */
.busca-caixa { padding: 20px 22px; }
.busca-linha { display: flex; gap: 10px; }
.busca-linha input[type="search"] {
  flex: 1; min-width: 0;
  border: 1px solid var(--linha); border-radius: var(--raio-pequeno);
  background: var(--superficie); color: var(--texto);
  padding: 12px 14px; font: inherit; font-size: 15px;
}
.busca-linha input[type="search"]:focus { border-color: var(--destaque); }
.busca-linha .botao {
  display: inline-flex; align-items: center; gap: 8px; flex: none;
}
.busca-linha .botao svg { width: 17px; height: 17px; }

.busca-onde {
  display: flex; flex-wrap: wrap; align-items: flex-start; gap: 10px 20px;
  margin-top: 16px; padding-top: 14px; border-top: 1px solid var(--linha);
}
.busca-rotulo {
  font-size: 11px; font-weight: 700; letter-spacing: .08em;
  text-transform: uppercase; color: var(--tenue); padding-top: 3px;
}
.busca-dica { font-size: 12.5px; color: var(--tenue); }
.busca-dica.erro-carga { color: var(--ruim); font-weight: 600; }

.busca-contagem {
  margin: 18px 0 10px; font-size: 13px; color: var(--suave);
}

.origem { margin-bottom: 14px; }
.origem-cabeca {
  display: flex; align-items: center; gap: 10px;
  padding: 14px 16px; border-bottom: 1px solid var(--linha);
}
.origem.vazia .origem-cabeca { border-bottom: 0; padding-bottom: 4px; }
.origem.vazia p { margin: 0 0 4px; font-size: 13.5px; color: var(--tenue); }
.origem-cabeca svg { width: 22px; height: 22px; color: var(--destaque); flex: none; }
.origem-cabeca h3 { margin: 0; font-size: 15px; letter-spacing: -.01em; }
.origem-cabeca .quantos {
  font-family: var(--fonte-dado); font-size: 12px; color: var(--suave);
  background: var(--superficie-2); border-radius: 999px; padding: 2px 9px;
}
.etiqueta-leitura {
  margin-left: auto;
  font-size: 10.5px; font-weight: 700; letter-spacing: .07em;
  text-transform: uppercase; color: var(--tenue);
  border: 1px solid var(--linha); border-radius: 3px; padding: 2px 7px;
}
table.fila.legado { min-width: 720px; font-size: 13px; }
table.fila.legado td { color: var(--suave); }

@media (max-width: 560px) {
  .busca-linha { flex-wrap: wrap; }
  .busca-linha .botao { width: 100%; justify-content: center; }
}

/* ==================================================== painel analítico === */
/*
  A grade dos gráficos. `auto-fit` com um mínimo generoso: numa tela larga
  cabem dois lado a lado, e numa estreita eles empilham sozinhos, sem media
  query nenhuma. Gráfico espremido não é gráfico pequeno — é gráfico ilegível.
*/
.graficos {
  display: grid; gap: 14px; margin-top: 16px;
  grid-template-columns: repeat(auto-fit, minmax(min(100%, 340px), 1fr));
  /* Cada cartão com a sua altura: esticado para acompanhar o vizinho mais
     alto, um gráfico de três barras fica com meio metro de espaço em branco
     embaixo. */
  align-items: start;
}
.grafico { padding: 16px 18px 12px; margin: 0; min-width: 0; }
/* O gráfico largo ocupa a linha inteira — mas só quando há mais de uma
   coluna, senão o `span 2` cria uma coluna fantasma numa tela estreita. */
@media (min-width: 720px) {
  .grafico.largura-2 { grid-column: 1 / -1; }
}

.grafico-cabeca {
  display: flex; flex-wrap: wrap; align-items: baseline; gap: 8px 14px;
  margin-bottom: 12px;
}
.grafico-cabeca h3 { margin: 0; font-size: 15px; letter-spacing: -.01em; }
.grafico-acoes { margin-left: auto; display: flex; gap: 12px; }
.grafico-pe { margin: 10px 0 0; font-size: 12px; color: var(--tenue); }
.grafico-vazio, .grafico-aviso {
  margin: 0; padding: 26px 0; text-align: center;
  font-size: 13.5px; color: var(--tenue);
}
.grafico-aviso { color: var(--atencao); }
.grafico-legenda-linha {
  margin: 10px 0 0; font-size: 12px; color: var(--tenue); line-height: 1.45;
}

/* O SVG escala com a largura do cartão: viewBox fixo, largura 100%. */
.desenho { display: block; width: 100%; height: auto; overflow: visible; }
.grafico-corpo { min-width: 0; }
.grafico-corpo.pizza {
  display: flex; flex-wrap: wrap; align-items: center; gap: 8px 20px;
}
.grafico-corpo.pizza .desenho { flex: 0 1 184px; max-width: 184px; }
.grafico-corpo.pizza .legenda { flex: 1 1 180px; min-width: 0; }

/* ---- as cores das séries, por PAPEL ------------------------------------- */
/* Magnitude ("quanto de cada") vai num tom só: seis cores para dizer quanto
   é o jeito mais rápido de enterrar a informação. */
.serie-magnitude { --serie: var(--destaque); }
.serie-1 { --serie: var(--serie-1); }
.serie-2 { --serie: var(--serie-2); }
.serie-3 { --serie: var(--serie-3); }
.serie-4 { --serie: var(--serie-4); }
.serie-5 { --serie: var(--serie-5); }
.serie-6 { --serie: var(--serie-6); }
/* Quando o catálogo já declarou o tom do valor, ele manda: "Concluído" é
   verde porque o catálogo diz, e continua verde depois de qualquer filtro. */
.tom-neutro   { --serie: var(--tenue); }
.tom-destaque { --serie: var(--destaque); }
.tom-bom      { --serie: var(--bom); }
.tom-atencao  { --serie: var(--atencao); }
.tom-ruim     { --serie: var(--ruim); }
.tom-violeta  { --serie: var(--violeta); }

/* ---- as marcas ---------------------------------------------------------- */
.regua { stroke: var(--linha); stroke-width: 1; }

.barra rect, .barra-de-fundo {
  fill: var(--serie, var(--destaque));
  transition: opacity var(--transicao);
}
.barra-de-fundo { fill: var(--destaque); opacity: .22; }
.barra { cursor: pointer; }
.barra:hover rect, .barra:focus-visible rect { opacity: .78; }
.barra:focus-visible { outline: none; }
.barra:focus-visible rect { stroke: var(--texto); stroke-width: 2; }

.valor-da-barra, .valor-deitado {
  font-size: 12px; font-weight: 600; fill: var(--texto);
  text-anchor: middle; font-family: var(--fonte);
}
.valor-deitado { text-anchor: start; }
.rotulo-da-barra, .rotulo-deitado {
  font-size: 11.5px; fill: var(--suave); text-anchor: middle;
  font-family: var(--fonte);
}
.rotulo-deitado { text-anchor: end; }

/* A fatia leva um anel da cor do fundo: sem ele, duas fatias vizinhas de
   tons próximos se fundem numa mancha só. */
.fatia {
  fill: var(--serie, var(--destaque));
  stroke: var(--superficie); stroke-width: 2;
  cursor: pointer; transition: opacity var(--transicao);
}
.fatia:hover, .fatia:focus-visible { opacity: .78; outline: none; }
.fatia:focus-visible { stroke: var(--texto); }

.rosca-numero {
  font-size: 26px; font-weight: 700; fill: var(--texto);
  text-anchor: middle; font-family: var(--fonte);
}
.rosca-rotulo {
  font-size: 11px; fill: var(--tenue); text-anchor: middle;
  font-family: var(--fonte);
}

.linha-do-grafico {
  fill: none; stroke: var(--destaque); stroke-width: 2;
  stroke-linecap: round; stroke-linejoin: round;
}
.ponto-da-linha { cursor: pointer; }
.ponto-da-linha .alvo { fill: transparent; }
.ponto-da-linha .marcador {
  fill: var(--destaque); stroke: var(--superficie); stroke-width: 2;
  opacity: 0; transition: opacity var(--transicao);
}
.ponto-da-linha:hover .marcador,
.ponto-da-linha:focus-visible .marcador { opacity: 1; }
.ponto-da-linha:focus-visible { outline: none; }

/* ---- a legenda ---------------------------------------------------------- */
/* `minmax(0, 1fr)` e não `1fr`: um item de grade tem largura mínima
   automática, e um valor que não quebra (o "R$ 12.480,00") empurrava a
   legenda para fora do cartão em telas por volta de 480px. */
.legenda { display: grid; gap: 2px; grid-template-columns: minmax(0, 1fr); }
.legenda-item {
  display: flex; align-items: center; gap: 9px; width: 100%; min-width: 0;
  background: none; border: 0; cursor: pointer; text-align: left;
  padding: 6px 8px; border-radius: var(--raio-pequeno);
  font-size: 13px; color: var(--texto);
}
.legenda-item:hover { background: var(--superficie-2); }
.legenda-item .marca {
  width: 11px; height: 11px; border-radius: 3px; flex: none;
  background: var(--serie, var(--tenue));
}
.legenda-item .nome {
  flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis;
  white-space: nowrap;
}
.legenda-item .valor {
  font-variant-numeric: tabular-nums; font-weight: 600; white-space: nowrap;
  flex: none;
}

}

/* ---- a dica ------------------------------------------------------------- */
.dica-do-grafico {
  position: fixed; z-index: 80; transform: translate(-50%, -100%);
  pointer-events: none;
  background: var(--texto); color: var(--superficie);
  border-radius: var(--raio-pequeno); padding: 6px 10px;
  font-size: 12.5px; font-weight: 600; white-space: nowrap;

}

table.fila.numeros { min-width: 320px; }
table.fila.numeros .direita { text-align: right; font-variant-numeric: tabular-nums; }

#dialogo-exportar textarea {
  width: 100%; border: 1px solid var(--linha); border-radius: var(--raio-pequeno);
  background: var(--superficie-2); color: var(--texto);
  padding: 10px 12px; font-family: var(--fonte-dado); font-size: 12.5px;
  resize: vertical;
}

@media (max-width: 560px) {
  .grafico { padding: 14px 14px 10px; }
  .grafico-corpo.pizza { justify-content: center; }
  .grafico-acoes { margin-left: 0; }
  /* Numa tela de celular o gráfico ganha altura em vez de espremer: o SVG
     tem viewBox, então cresce sem distorcer. */
  .grafico-corpo.pizza .desenho { flex-basis: 160px; }
}

/* ================================================== minha performance === */
.meta { padding: 16px 18px; margin-top: 14px; }
.meta header {
  display: flex; flex-wrap: wrap; align-items: baseline; gap: 8px 14px;
  margin-bottom: 12px;
}
.meta h3 { margin: 0; font-size: 15px; letter-spacing: -.01em; }
.meta-numero {
  margin-left: auto; font-size: 22px; font-weight: 700;
  font-variant-numeric: tabular-nums; color: var(--texto);
}
.meta-numero.bateu { color: var(--bom); }
.meta-numero em { font-style: normal; font-size: 14px; font-weight: 400; color: var(--tenue); }

.barra-da-meta {
  height: 10px; border-radius: 999px; background: var(--superficie-2);
  overflow: hidden;
}
.barra-da-meta span {
  display: block; height: 100%; border-radius: 999px;
  background: var(--destaque); transition: width var(--transicao);
}
.meta-explica { margin: 10px 0 0; font-size: 12.5px; color: var(--tenue); }

/* A variação sabe quando "para baixo" é boa notícia: no tempo médio, cair é
   bom, e pintar de vermelho ali daria a notícia errada. */
.variacao.igual { color: var(--tenue); }

.performance-baixo {
  display: grid; gap: 14px; margin-top: 14px;
  grid-template-columns: repeat(auto-fit, minmax(min(100%, 320px), 1fr));
  align-items: start;
}
.equipe { padding: 16px 18px; }
.equipe h3 { margin: 0 0 10px; font-size: 15px; letter-spacing: -.01em; }
.equipe-lugar { margin: 0 0 12px; font-size: 13.5px; color: var(--suave); }
.equipe-nota {
  margin: 12px 0 0; font-size: 12px; color: var(--tenue); line-height: 1.45;
}

.ranking { list-style: none; margin: 0; padding: 0; }
.ranking li {
  display: flex; align-items: center; gap: 10px;
  padding: 8px 10px; border-radius: var(--raio-pequeno); font-size: 13.5px;
}
.ranking li.sou-eu { background: var(--destaque-tenue); font-weight: 600; }
.ranking .posicao {
  font-family: var(--fonte-dado); font-size: 12px; color: var(--tenue);
  min-width: 26px;
}
.ranking li.sou-eu .posicao { color: var(--destaque); }
.ranking .nome {
  flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis;
  white-space: nowrap;
}
.ranking .nome em {
  font-style: normal; font-size: 11px; color: var(--destaque);
  text-transform: uppercase; letter-spacing: .06em; margin-left: 4px;
}
.ranking .valor {
  font-variant-numeric: tabular-nums; font-weight: 600; color: var(--tom, var(--texto));
}

.passo-abre {
  display: block; width: 100%; text-align: left; cursor: pointer;
  background: none; border: 0; padding: 0; font: inherit; color: inherit;
}
.passo-abre:hover strong { color: var(--destaque); }

/* ================================================ tabela de corretoras === */
.busca-do-cadastro {
  flex: 1 1 220px; min-width: 0;
  border: 1px solid var(--linha); border-radius: var(--raio-pequeno);
  background: var(--superficie); color: var(--texto);
  padding: 8px 11px; font: inherit; font-size: 13.5px;
}
.busca-do-cadastro:focus { border-color: var(--destaque); }

table.fila.cadastro { min-width: 720px; }
table.fila.cadastro .direita { text-align: right; font-variant-numeric: tabular-nums; }
table.fila.cadastro tr.aberta { background: var(--destaque-tenue); }

/*
  O aviso das SUSEPs fora do cadastro. Tom de ATENÇÃO, e não de erro: cadastro
  incompleto não é corretora irregular, e pintar de vermelho faria a operação
  achar que há um problema com quem trouxe o caso.
*/
.aviso-cadastro {
  margin: 12px 0; padding: 14px 16px;
  border: 1px solid color-mix(in srgb, var(--atencao) 30%, transparent);
  border-radius: var(--raio); background: var(--atencao-tenue);
}
.aviso-cadastro strong { display: block; font-size: 14px; color: var(--atencao); }
.aviso-cadastro > p {
  margin: 4px 0 10px; font-size: 12.5px; color: var(--suave); max-width: 64ch;
}
.aviso-cadastro ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; }
.aviso-cadastro li {
  display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 10px;
  font-size: 13px;
}
.aviso-cadastro li .botao-texto,
.aviso-cadastro li .susep {
  font-family: var(--fonte-dado); font-weight: 600; padding: 0;
}
.aviso-cadastro li .nos-casos { color: var(--suave); font-size: 12.5px; }
.aviso-cadastro li .quantos {
  margin-left: auto; color: var(--tenue); font-size: 12px; white-space: nowrap;
}

/* A tela de corretoras usa a moldura de Configurações, mas sem o submenu:
   a lista ocupa as duas primeiras colunas e o painel fica na terceira. */
#corretoras { grid-template-columns: minmax(0, 1fr) 340px; }
@media (max-width: 900px) {
  #corretoras { grid-template-columns: minmax(0, 1fr); }
}

  .config { grid-template-columns: minmax(0, 1fr) 300px; }

@media (max-width: 680px) {

  <!--
    A casca do sistema. O menu lateral e a barra superior aparecem em TODAS as
    telas; o miolo troca conforme a rota.

    Nada aqui vem preenchido: quem monta o menu e a barra é o Moldura, a
    partir do pacote de partida que o servidor devolve. Menu escrito à mão no
    HTML ficaria fora de sincronia com as permissões no primeiro dia.
  -->

  <div class="carregando" id="carregando">
    <div class="carregando-marca"><?= identidade.nome ?></div>
    <div class="carregando-barra"><span></span></div>
    <p>Conferindo o seu acesso…</p>
  </div>

  <div class="recusado" id="recusado" hidden>
    <h1>Não consegui abrir o sistema</h1>
    <p id="recusado-motivo"></p>
    <button type="button" class="botao" onclick="location.reload()">
      Tentar de novo
    </button>
  </div>

  <div class="aplicacao" id="aplicacao" hidden>
    <aside class="lateral" id="lateral"></aside>
    <div class="veu" id="veu" hidden></div>
    <div class="coluna">
      <header class="superior" id="superior"></header>
      <main class="miolo" id="miolo" tabindex="-1"></main>
    </div>
  </div>


<!-- ==== Moldura.html ==== -->
<script>
/* ============================================================================
   RECC — Moldura.html · o menu lateral e a barra superior
   ============================================================================
   A moldura aparece em TODAS as telas e é a mesma em todas. Ela não é escrita
   à mão no HTML: é montada a partir do pacote de partida, porque o menu
   depende do nível de acesso de quem entrou. Menu fixo no HTML ficaria fora
   de sincronia com as permissões no primeiro dia.
   ============================================================================ */

var Moldura = (function () {

  /**
   * O desenho de cada item do menu.
   *
   * SVG escrito à mão, sem biblioteca de fora: o Apps Script serve a página
   * num quadro isolado, e cada dependência externa é mais um ponto que pode
   * não carregar — e um menu sem ícone nenhum é um menu quebrado.
   *
   * Todos partem da mesma grade de 24 por 24, com a mesma espessura de
   * traço. É o que faz sete desenhos diferentes parecerem um conjunto.

  var DESENHOS = {
    // painel: quatro áreas iguais, como os cartões da tela
    dashboard:
      '<rect x="3.5" y="3.5" width="7" height="7" rx="1.6"></rect>'
      + '<rect x="13.5" y="3.5" width="7" height="7" rx="1.6"></rect>'
      + '<rect x="3.5" y="13.5" width="7" height="7" rx="1.6"></rect>'
      + '<rect x="13.5" y="13.5" width="7" height="7" rx="1.6"></rect>',

    // registrar: o mais, sem moldura. Acrescentar é o gesto mais simples do
    // sistema, e o desenho mais simples é o que se reconhece de relance.
    cadastrarCaso:
      '<path d="M12 4.6v14.8M4.6 12h14.8"></path>',

    // desempenho: a linha de pulso, que sobe e desce como o dia da operação
    minhaPerformance:
      '<path d="M3.2 12.4h3.6l2.4-7 4 14.2 2.6-7.2h5"></path>',

    // buscar: a lupa
    buscarCaso:
      '<circle cx="10.8" cy="10.8" r="6.4"></circle>'
      + '<path d="M15.5 15.5 20.4 20.4"></path>',

    // corretoras: o prédio, com as janelas e a porta
    tabelaCorretoras:
      '<path d="M4.4 20.6V4.9a1.5 1.5 0 0 1 1.5-1.5h6.8a1.5 1.5 0 0 1 1.5 1.5v15.7"></path>'
      + '<path d="M14.2 10.4h4a1.5 1.5 0 0 1 1.5 1.5v8.7"></path>'
      + '<path d="M2.9 20.6h18.2"></path>'
      + '<path d="M7.4 7.4h1.3M11 7.4h1.3M7.4 11.2h1.3M11 11.2h1.3"></path>'
      + '<path d="M9.2 20.6v-4.2h1.6v4.2"></path>',

    // análise: as barras em pé, sobre a régua
    painelAnalitico:
      '<path d="M3.6 20.4h16.8"></path>'
      + '<path d="M7.4 20.4v-6.2M12 20.4V6.8M16.6 20.4v-9.6"></path>',

    // configurações: a engrenagem — anel, dentes por fora e o eixo no meio.
    // Os dentes ENCOSTAM no anel: afastados, o desenho vira um sol.
    configuracoes:
      '<circle cx="12" cy="12" r="7.1"></circle>'
      + '<circle cx="12" cy="12" r="2.9"></circle>'
      + '<path d="M12 2.6v2.3M12 19.1v2.3M2.6 12h2.3M19.1 12h2.3'
      + 'M5.3 5.3 6.9 6.9M17.1 17.1l1.6 1.6M18.7 5.3 17.1 6.9M6.9 17.1l-1.6 1.6"></path>',

    // --- os desenhos das SEÇÕES de Configurações --------------------------
    // Um por seção, na mesma grade e na mesma espessura dos outros. O menu de
    // Configurações é a única lista longa do sistema: sem ícone, oito linhas
    // de texto viram um bloco só, e a pessoa lê todas para achar uma.

    // campos do formulário: a etiqueta em cima, a caixa de digitar, a dica
    campos:
      '<path d="M4.2 6.2h7.6"></path>'
      + '<rect x="3.4" y="9.4" width="17.2" height="5.6" rx="1.6"></rect>'
      + '<path d="M4.2 18.6h11.4"></path>',

    // usuários: duas pessoas, a de trás pela metade
    usuarios:
      '<circle cx="9.4" cy="8.4" r="3.4"></circle>'
      + '<path d="M3.4 19.8a6 6 0 0 1 12 0"></path>'
      + '<path d="M16.2 5.4a3.4 3.4 0 0 1 0 6"></path>'
      + '<path d="M17.8 14.2a6 6 0 0 1 2.8 5.6"></path>',

    // níveis de acesso: o escudo com o visto — o que passa e o que não passa
    niveis:
      '<path d="M12 3.2 19.4 6v6.1c0 4.3-3 7.5-7.4 8.7-4.4-1.2-7.4-4.4-7.4-8.7V6z"></path>'
      + '<path d="m8.9 11.9 2.3 2.3L15.4 10"></path>',

    // listas: os marcadores e as linhas

      + '<circle cx="4.7" cy="12" r="1.1"></circle>'
      + '<circle cx="4.7" cy="17.4" r="1.1"></circle>'
      + '<path d="M9 6.6h11.3M9 12h11.3M9 17.4h11.3"></path>',

    // mesas de trabalho: a bancada, com o tampo e as duas pernas

      '<rect x="2.9" y="6.2" width="18.2" height="4.2" rx="1.4"></rect>'
      + '<path d="M5.9 10.4v7.4M18.1 10.4v7.4"></path>'
      + '<path d="M5.9 14.1h12.2"></path>',

    // identidade: a gota de tinta — nome, logo e cor são a aparência do PGO
    identidade:
      '<path d="M12 3.2c3.5 4.1 5.6 6.8 5.6 9.5a5.6 5.6 0 0 1-11.2 0c0-2.7 2.1-5.4 5.6-9.5z"></path>'
      + '<path d="M9.2 13.4a2.8 2.8 0 0 0 2.8 2.8"></path>',

    // painéis: o recorte da tela — a faixa de cima e a coluna da esquerda
    paineis:
      '<rect x="3.4" y="3.9" width="17.2" height="16.2" rx="2"></rect>'
      + '<path d="M3.4 9.1h17.2"></path>'
      + '<path d="M10.2 9.1v11"></path>',

    // análises: a tabela dinâmica — a grade com a faixa de cima destacada
    analises:
      '<rect x="3.4" y="4.4" width="17.2" height="15.2" rx="1.8"></rect>'
      + '<path d="M3.4 9.2h17.2"></path>'
      + '<path d="M3.4 14.4h17.2"></path>'
      + '<path d="M9.4 9.2v10.4M15 9.2v10.4"></path>',

    // estrutura e auditoria: a prancheta do laudo, com o visto
    estrutura:
      '<path d="M9 4.4H7.4A1.6 1.6 0 0 0 5.8 6v13.2a1.6 1.6 0 0 0 1.6 1.6h9.2a1.6 1.6 0 0 0 1.6-1.6V6a1.6 1.6 0 0 0-1.6-1.6H15"></path>'
      + '<rect x="9" y="2.8" width="6" height="3.2" rx="1"></rect>'
      + '<path d="m9.2 13.2 2 2 3.8-3.8"></path>',

    // --- os desenhos das AÇÕES, na mesma grade e na mesma espessura -------

    // ver: o olho
    olho:
      '<path d="M2.4 12S6.2 5.4 12 5.4 21.6 12 21.6 12 17.8 18.6 12 18.6 2.4 12 2.4 12z"></path>'
      + '<circle cx="12" cy="12" r="3.1"></circle>',

    // editar: o lápis
    editar:
      '<path d="M16.4 3.9a2 2 0 0 1 2.8 2.8L8.4 17.5l-3.9 1.1 1.1-3.9z"></path>'
      + '<path d="M14.7 5.6 18.4 9.3"></path>',

    // trocar situação: as duas setas em círculo
    trocarSituacao:
      '<path d="M20.4 11.2a8.4 8.4 0 0 0-14.3-4.6L3.6 9"></path>'
      + '<path d="M3.6 4.6V9h4.4"></path>'
      + '<path d="M3.6 12.8a8.4 8.4 0 0 0 14.3 4.6L20.4 15"></path>'
      + '<path d="M20.4 19.4V15H16"></path>',

    // ocultar: a lixeira, com a tampa
    ocultar:
      '<path d="M4.4 6.8h15.2"></path>'
      + '<path d="M9.2 6.8V5.2a1.4 1.4 0 0 1 1.4-1.4h2.8a1.4 1.4 0 0 1 1.4 1.4v1.6"></path>'
      + '<path d="M6.4 6.8v12.4a1.4 1.4 0 0 0 1.4 1.4h8.4a1.4 1.4 0 0 0 1.4-1.4V6.8"></path>'
      + '<path d="M10.2 10.6v6M13.8 10.6v6"></path>'
  };

  var TEMAS = [
    { chave: 'padrao', nome: 'Padrão — azul Porto Seguro' },
    { chave: 'rosa', nome: 'Rosa' },
    { chave: 'dark', nome: 'Escuro' },
    { chave: 'brasil', nome: 'Brasil' }
  ];

  /**
   * O desenho de um item do menu ou de uma ação.
   *
   * Nome desconhecido cai no painel, e não em nada: um botão sem ícone,
   * ao lado de outros com ícone, parece um botão quebrado.
   */
  function icone(tela) {
    var desenho = DESENHOS[tela] || DESENHOS.dashboard;
    // Traço fino: 1,7 deixava os desenhos pesados ao lado de texto normal.
    return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor"'
      + ' stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"'
      + ' aria-hidden="true">' + desenho + '</svg>';
  }

  /** As iniciais do nome, para o círculo da barra superior. */
  function iniciais(nome) {
    var partes = String(nome || '').trim().split(/\s+/);
    if (!partes[0]) return '?';
    if (partes.length === 1) return partes[0].substring(0, 2).toUpperCase();
