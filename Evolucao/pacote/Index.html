<!DOCTYPE html>
<html lang="pt-BR" data-tema="padrao">
<head>
  <base target="_top">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title><?= identidade.nome ?></title>

<!-- ==== Estilos.html ==== -->
<style>

:root {

  --lateral-largura: 248px;
  --lateral-encolhida: 72px;
  --raio: 10px;
  --raio-pequeno: 6px;
  --sombra: 0 1px 2px rgba(12, 27, 51, .06), 0 10px 28px -18px rgba(12, 27, 51, .35);
  --transicao: 160ms ease;

  --fonte: "Segoe UI", system-ui, -apple-system, Roboto, Arial, sans-serif;
  --fonte-dado: "Consolas", "SFMono-Regular", "Courier New", monospace;

  --bom: #15794A;         --bom-tenue: #E1F3EA;
  --atencao: #96590A;     --atencao-tenue: #FBEEDB;
  --ruim: #A9241D;        --ruim-tenue: #FBE7E5;
}

:root, :root[data-tema="padrao"] {
  --destaque: var(--cor-da-operacao, #0B77CE);
  --destaque-escuro: color-mix(in srgb, var(--destaque) 78%, black);
  --destaque-tenue: color-mix(in srgb, var(--destaque) 12%, white);
  --destaque-sobre: #FFFFFF;

  --fundo: #F4F7FB;
  --superficie: #FFFFFF;
  --superficie-2: #EDF2F8;
  --linha: #DCE4EE;
  --linha-forte: #BCC8D8;
  --texto: #14213A;
  --suave: #56667F;
  --tenue: #8494A9;

  --lateral-fundo: #17A2E8;
  --lateral-texto: #FFFFFF;
  --lateral-titulo: #FFFFFF;
  --lateral-marca-realce: #0A2A3D;
  --lateral-linha: #47BAF0;
  --lateral-ativo: #FFFFFF;
  --lateral-ativo-texto: #0A2A3D;

  --violeta: #6B4FD8;     --violeta-tenue: #EDE9FB;

  --serie-1: #2A78D6;
  --serie-2: #EB6834;
  --serie-3: #1BAF7A;
  --serie-4: #EDA100;
  --serie-5: #E87BA4;
  --serie-6: #008300;
}

:root[data-tema="rosa"] {
  --destaque: #C2185B;
  --destaque-escuro: #8E1145;
  --destaque-tenue: #FCE7F0;
  --destaque-sobre: #FFFFFF;

  --fundo: #FCF5F8;
  --superficie: #FFFFFF;
  --superficie-2: #F8EAF1;
  --linha: #EED6E1;
  --linha-forte: #DCB4C7;
  --texto: #2B1420;
  --suave: #6E5260;
  --tenue: #9C8290;

  --lateral-fundo: #E8489B;
  --lateral-texto: #FFFFFF;
  --lateral-titulo: #FFFFFF;
  --lateral-marca-realce: #3A0A22;
  --lateral-linha: #F084BE;
  --lateral-ativo: #FFFFFF;
  --lateral-ativo-texto: #3A0A22;

  --violeta: #6D28D9;     --violeta-tenue: #EDE7FB;

  --serie-1: #2A78D6;
  --serie-2: #EB6834;
  --serie-3: #1BAF7A;
  --serie-4: #EDA100;
  --serie-5: #E87BA4;
  --serie-6: #008300;
}

:root[data-tema="dark"] {
  --destaque: #5C9DFF;
  --destaque-escuro: #7FB4FF;
  --destaque-tenue: #14294A;
  --destaque-sobre: #06182F;

  --fundo: #0A101C;
  --superficie: #121B2B;
  --superficie-2: #182438;
  --linha: #26344C;
  --linha-forte: #3A4B69;
  --texto: #E7EDF7;
  --suave: #9AAAC2;
  --tenue: #75879F;

  --serie-1: #3987E5;
  --serie-2: #D95926;
  --serie-3: #199E70;
  --serie-4: #C98500;
  --serie-5: #D55181;
  --serie-6: #008300;

  --lateral-fundo: #0E1725;
  --lateral-texto: #9EB0C9;
  --lateral-titulo: #FFFFFF;
  --lateral-marca-realce: #5C9DFF;
  --lateral-linha: #202D42;
  --lateral-ativo: #1E3358;
  --lateral-ativo-texto: #FFFFFF;

  --violeta: #A794F5;     --violeta-tenue: #241E45;

  --bom: #5CC894;         --bom-tenue: #123528;
  --atencao: #E0A253;     --atencao-tenue: #3A2A12;
  --ruim: #F08981;        --ruim-tenue: #3B1A18;
}

:root[data-tema="brasil"] {
  --destaque: #0E7A3C;
  --destaque-escuro: #0A5A2C;
  --destaque-tenue: #E2F3E8;
  --destaque-sobre: #FFFFFF;

  --fundo: #F5FAF6;
  --superficie: #FFFFFF;
  --superficie-2: #E9F4EC;
  --linha: #D3E5D8;
  --linha-forte: #AECDB7;
  --texto: #10251A;
  --suave: #4E6656;
  --tenue: #7C9585;

  --lateral-fundo: #12A150;
  --lateral-texto: #FFFFFF;
  --lateral-titulo: #FFFFFF;
  --lateral-marca-realce: #06301A;
  --lateral-linha: #4DC181;
  --lateral-ativo: #FFFFFF;
  --lateral-ativo-texto: #06301A;

  --violeta: #5B41C4;     --violeta-tenue: #EAE6FA;

  --serie-1: #2A78D6;
  --serie-2: #EB6834;
  --serie-3: #1BAF7A;
  --serie-4: #EDA100;
  --serie-5: #E87BA4;
  --serie-6: #008300;

  --atencao: #8A6300;     --atencao-tenue: #FBF0CF;
}

* { box-sizing: border-box; }

[hidden] { display: none !important; }

html, body { height: 100%; }

body {
  margin: 0;
  background: var(--fundo);
  color: var(--texto);
  font-family: var(--fonte);
  font-size: 16px;
  line-height: 1.55;
  -webkit-font-smoothing: antialiased;
}

button { font: inherit; color: inherit; }

.botao {
  border: 1px solid var(--destaque);
  background: var(--destaque);
  color: var(--destaque-sobre);
  border-radius: var(--raio-pequeno);
  padding: 9px 18px;
  cursor: pointer;
  font-weight: 600;
}
.botao:hover { background: var(--destaque-escuro); border-color: var(--destaque-escuro); }

.botao:disabled, .botao-secundario:disabled, .botao.vazado:disabled {
  opacity: .45;
  cursor: not-allowed;
}
.botao:disabled:hover { background: var(--destaque); border-color: var(--destaque); }
.botao-secundario:disabled:hover { background: var(--superficie); }
.botao.vazado:disabled:hover { background: transparent; border-color: var(--linha); }

.tres-pontinhos {
  display: inline-flex; align-items: center; gap: 4px;

  height: 1.2em;
}
.tres-pontinhos i {
  width: 6px; height: 6px; border-radius: 50%;
  background: currentColor;
  animation: pontinho-que-pulsa 1s infinite ease-in-out both;
}
.tres-pontinhos i:nth-child(2) { animation-delay: .16s; }
.tres-pontinhos i:nth-child(3) { animation-delay: .32s; }
@keyframes pontinho-que-pulsa {
  0%, 70%, 100% { opacity: .3; }
  35% { opacity: 1; }
}
@media (prefers-reduced-motion: reduce) {

  .tres-pontinhos i { animation: none; opacity: .55; }
}

:focus-visible { outline: 2px solid var(--destaque); outline-offset: 2px; border-radius: 4px; }

.carregando, .recusado {
  min-height: 100vh;
  display: grid;
  place-content: center;
  justify-items: center;
  gap: 14px;
  padding: 24px;
  text-align: center;
}
.carregando-marca {
  font-size: 30px; font-weight: 700; letter-spacing: -.02em; color: var(--destaque);
}
.carregando-barra {
  width: 235px; height: 4px; border-radius: 3px;
  background: var(--superficie-2); overflow: hidden;
}
.carregando-barra span {
  display: block; height: 100%; width: 40%; border-radius: 3px;
  background: var(--destaque); animation: desliza 1.1s ease-in-out infinite;
}
@keyframes desliza {
  0% { transform: translateX(-110%); } 100% { transform: translateX(360%); }
}
.carregando p, .recusado p { color: var(--suave); margin: 0; max-width: 46ch; }
.recusado h1 { font-size: 22px; margin: 0; }

@media (prefers-reduced-motion: reduce) {
  .carregando-barra span { animation: none; width: 100%; }
}

.aplicacao { display: flex; min-height: 100vh; }
.coluna { flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; }

.lateral {
  flex: 0 0 var(--lateral-largura);
  width: var(--lateral-largura);
  background: var(--lateral-fundo);
  color: var(--lateral-texto);
  display: flex;
  flex-direction: column;
  position: sticky;
  top: 0;
  height: 100vh;
  transition: flex-basis var(--transicao), width var(--transicao);
}
.aplicacao.encolhida .lateral {
  flex-basis: var(--lateral-encolhida);
  width: var(--lateral-encolhida);
}

.lateral-marca {
  display: flex; align-items: center; gap: 10px;
  padding: 18px 14px; min-height: 72px;
  border-bottom: 1px solid var(--lateral-linha);
}
.lateral-marca img { max-height: 30px; max-width: 140px; }
.lateral-marca .escrito {
  font-size: 24px; font-weight: 800; letter-spacing: -.02em; color: var(--lateral-titulo);
  white-space: nowrap;
}
.lateral-marca .escrito em { font-style: normal; color: var(--lateral-marca-realce); }

.lateral-encolher {
  margin-left: auto; flex: 0 0 auto;
  display: grid; place-items: center;
  width: 34px; height: 34px; border-radius: 8px;
  border: 0; background: var(--lateral-marca-realce);
  color: var(--lateral-fundo); cursor: pointer;
}
.lateral-encolher:hover { opacity: .85; }
.lateral-encolher svg { width: 18px; height: 18px; }

.lateral-itens { list-style: none; margin: 0; padding: 14px 10px; flex: 1 1 auto; overflow-y: auto; }
.lateral-itens li { margin-bottom: 2px; }

.lateral-item {
  display: flex; gap: 13px; width: 100%;
  padding: 12px 13px; border: 0; border-radius: var(--raio-pequeno);
  background: transparent; color: var(--lateral-texto);
  cursor: pointer; text-align: left; font-size: 15px;

  font-weight: 400;

  opacity: .92;
}
.lateral-item:hover { background: var(--lateral-linha); opacity: 1; }

.lateral-item[aria-current="page"] {
  background: var(--lateral-ativo); color: var(--lateral-ativo-texto);
  font-weight: 600; opacity: 1;
}
.lateral-item svg { flex: 0 0 21px; width: 21px; height: 21px; opacity: .95; }
.lateral-item[aria-current="page"] svg { opacity: 1; }

.lateral-item .rotulo { min-width: 0; line-height: 1.3; overflow-wrap: anywhere; }

.lateral-item { align-items: flex-start; }
.lateral-item svg { margin-top: 1px; }
.aplicacao.encolhida .lateral-item .rotulo { display: none; }
.aplicacao.encolhida .lateral-marca .escrito { display: none; }
.aplicacao.encolhida .lateral-item { justify-content: center; }

.lateral-pe {
  padding: 16px 16px 20px;
  border-top: 1px solid var(--lateral-linha);
  color: var(--lateral-texto);
  font-size: 11.5px; line-height: 1.5; font-weight: 600;
}
.lateral-pe .fabricante { font-weight: 400; opacity: .85; }
.aplicacao.encolhida .lateral-pe { display: none; }
.aplicacao.encolhida .lateral-encolher svg { transform: rotate(180deg); }

.superior {
  position: sticky; top: 0; z-index: 20;
  display: flex; flex-wrap: wrap; align-items: center; gap: 12px 16px;
  padding: 14px 22px;
  background: var(--superficie);
  border-bottom: 1px solid var(--linha);
}

.superior .identidade { min-width: 180px; flex: 1 1 260px; }
.superior .identidade h1 {
  margin: 0; font-size: 16.5px; font-weight: 700; letter-spacing: -.012em;
  line-height: 1.3;
}
.superior .identidade p { margin: 2px 0 0; font-size: 13px; color: var(--suave); }

.abrir-menu {
  display: none; width: 38px; height: 38px; border-radius: var(--raio-pequeno);
  border: 1px solid var(--linha); background: var(--superficie); cursor: pointer;
}

.busca {
  position: relative; flex: 1 1 260px; max-width: 420px; min-width: 180px;
}
.busca input {
  width: 100%; padding: 9px 62px 9px 36px;
  border: 1px solid var(--linha); border-radius: var(--raio-pequeno);
  background: var(--superficie-2); color: var(--texto); font: inherit; font-size: 14.5px;
}
.busca input::placeholder { color: var(--tenue); }
.busca svg {
  position: absolute; left: 11px; top: 50%; transform: translateY(-50%);
  width: 16px; height: 16px; color: var(--tenue);
}
.busca kbd {
  position: absolute; right: 9px; top: 50%; transform: translateY(-50%);
  font-family: var(--fonte); font-size: 11px; color: var(--tenue);
  border: 1px solid var(--linha); border-radius: 4px; padding: 2px 6px;
  background: var(--superficie);
}

.ultimo-registro {
  display: flex; align-items: center; gap: 8px;
  padding: 9px 14px; font-size: 14px; font-weight: 500;
  border: 1px solid var(--linha); border-radius: 999px;
  background: var(--superficie); white-space: nowrap;
}
.ultimo-registro svg { width: 16px; height: 16px; color: var(--tenue); }
.ultimo-registro.vazio { color: var(--tenue); font-weight: 400; }

.recarregar {
  flex: none; display: inline-flex; align-items: center; justify-content: center;
  width: 36px; height: 36px; padding: 0;
  border: 1px solid var(--linha); border-radius: 50%;
  background: var(--superficie); color: var(--texto-suave); cursor: pointer;
  transition: color .15s, border-color .15s, background .15s;
}
.recarregar:hover { color: var(--destaque); border-color: var(--destaque); }
.recarregar svg { width: 18px; height: 18px; }

.recarregar.girando svg { animation: dar-a-volta .6s ease; }
@keyframes dar-a-volta {
  from { transform: rotate(0deg); }
  to   { transform: rotate(360deg); }
}
@media (prefers-reduced-motion: reduce) {
  .recarregar.girando svg { animation: none; }
}

.temas { display: flex; align-items: center; gap: 7px; }
.tema {
  width: 20px; height: 20px; border-radius: 50%; cursor: pointer;
  border: 2px solid transparent; padding: 0;

  box-shadow: 0 0 0 1px rgba(128, 128, 128, .55);
}
.tema[aria-pressed="true"] {
  border-color: var(--texto);
  box-shadow: 0 0 0 1px var(--superficie);
}
.tema-padrao { background: var(--cor-da-operacao, #0B77CE); }
.tema-rosa   { background: #C2185B; }
.tema-dark   { background: #2B3A52; }
.tema-brasil { background: linear-gradient(135deg, #0E7A3C 50%, #F0B400 50%); }

.pessoa {
  display: flex; align-items: center; gap: 10px;
  padding: 5px 16px 5px 6px; border-radius: 999px;
  background: var(--destaque); color: var(--destaque-sobre);
}
.pessoa .iniciais {
  width: 32px; height: 32px; border-radius: 50%;
  display: grid; place-items: center;
  background: var(--destaque-sobre); color: var(--destaque);
  font-weight: 700; font-size: 12.5px;
}
.pessoa .quem { line-height: 1.2; }
.pessoa .quem strong { display: block; font-size: 14.5px; font-weight: 700; }
.pessoa .quem span { font-size: 12px; opacity: .85; }

.miolo { padding: 22px; flex: 1 1 auto; }

.cabecalho-da-tela { margin-bottom: 18px; }
.cabecalho-da-tela h2 {
  margin: 0; font-size: 27px; font-weight: 700; letter-spacing: -.024em;
  line-height: 1.2;
}
.cabecalho-da-tela p { margin: 4px 0 0; font-size: 15px; color: var(--suave); max-width: 70ch; }

.cartao {
  background: var(--superficie);
  border: 1px solid var(--linha);
  border-radius: var(--raio);
  padding: 22px;
  box-shadow: var(--sombra);
}

.cartoes {
  display: grid; gap: 12px; margin-bottom: 18px;
  grid-template-columns: repeat(auto-fit, minmax(158px, 1fr));
}

.tom-neutro   { --tom: var(--tenue);    --tom-tenue: var(--superficie-2); }
.tom-destaque { --tom: var(--destaque); --tom-tenue: var(--destaque-tenue); }
.tom-bom      { --tom: var(--bom);      --tom-tenue: var(--bom-tenue); }
.tom-atencao  { --tom: var(--atencao);  --tom-tenue: var(--atencao-tenue); }
.tom-ruim     { --tom: var(--ruim);     --tom-tenue: var(--ruim-tenue); }
.tom-violeta  { --tom: var(--violeta);  --tom-tenue: var(--violeta-tenue); }

.indicador {
  background: var(--superficie); border: 1px solid var(--linha);
  border-top: 3px solid var(--tom, var(--linha-forte));
  border-radius: var(--raio); padding: 14px 16px 13px;
  box-shadow: var(--sombra);
  display: flex; flex-direction: column; gap: 2px;
  text-align: left; font: inherit; color: inherit;
}
.indicador .rotulo {
  font-size: 12.5px; color: var(--suave); line-height: 1.3;
  min-height: 2.6em;
}
.indicador .numero {
  font-size: 30px; font-weight: 700; letter-spacing: -.02em; line-height: 1.1;
  font-variant-numeric: tabular-nums; color: var(--tom, var(--texto));
}
.indicador.tom-neutro .numero { color: var(--texto); }

.indicador .variacao {
  display: flex; align-items: baseline; gap: 5px;
  font-size: 12px; font-weight: 600; margin-top: 3px;
}
.indicador .variacao em {
  font-style: normal; font-weight: 400; font-size: 11px; color: var(--tenue);
}
.indicador .variacao.subiu { color: var(--bom); }
.indicador .variacao.desceu { color: var(--ruim); }

.indicador .variacao.vazia { visibility: hidden; }

.indicador.clicavel { cursor: pointer; }
.indicador.clicavel:hover {
  border-color: var(--tom); box-shadow: 0 2px 10px -4px var(--tom);
}
.indicador.ligado {
  background: var(--tom-tenue);
  box-shadow: inset 0 0 0 1px var(--tom);
}

.caixa-de-filtros {
  background: var(--superficie); border: 1px solid var(--linha);
  border-radius: var(--raio); padding: 14px 16px 4px;
  margin-bottom: 16px; box-shadow: var(--sombra);
}
.caixa-de-filtros-cabeca {
  display: flex; align-items: center; gap: 10px; margin-bottom: 12px;
}
.caixa-de-filtros-cabeca h3 {
  display: flex; align-items: center; gap: 7px;
  margin: 0; font-size: 13px; font-weight: 700; color: var(--suave);
  letter-spacing: .04em; text-transform: uppercase;
}
.caixa-de-filtros-cabeca h3 svg { width: 15px; height: 15px; }
.caixa-de-filtros-cabeca .contagem {
  margin-left: auto; font-size: 13px; color: var(--suave);
  font-variant-numeric: tabular-nums;
}

.caixa-de-filtros .filtros { margin-bottom: 10px; }

.filtros {
  display: flex; flex-wrap: wrap; align-items: center; gap: 10px;
  margin-bottom: 14px;
}
.filtro {
  padding: 9px 13px; font: inherit; font-size: 14px;
  color: var(--texto); background: var(--superficie);
  border: 1px solid var(--linha); border-radius: var(--raio-pequeno);
  max-width: 230px;
}

.ate-do-periodo { font-size: 13.5px; color: var(--suave); }

.filtro[type="date"] { max-width: 165px; }

.filtro.busca-na-fila { flex: 1 1 260px; max-width: 340px; }

.limpar-filtros {
  border: 0; background: transparent; color: var(--destaque);
  font-size: 13.5px; font-weight: 600; cursor: pointer; padding: 4px;
}
.filtros .contagem {
  margin-left: auto; font-size: 13px; color: var(--suave);
  font-variant-numeric: tabular-nums;
}

.importacao-titulo {
  margin: 20px 0 8px; font-size: 14px; font-weight: 700;
  color: var(--suave); letter-spacing: .01em;
}
.importacao-titulo:first-child { margin-top: 0; }

.importacao-depara td:first-child { width: 42%; }
.importacao-depara code {
  font-family: var(--fonte-dado); font-size: 12.5px; color: var(--suave);
}
.importacao-depara select { max-width: 100%; }

.importacao-depara .procurar-coluna { display: block; width: 100%; max-width: 100%; margin-bottom: 4px; }
.importacao-depara .config-dica { display: block; margin-top: 2px; }

table.fila .em-alerta,
table.fila.agrupada .apoio.em-alerta,
table.fila.agrupada .principal.em-alerta,
table.fila.agrupada td:first-child .apoio.em-alerta:first-child {
  color: var(--ruim); font-weight: 700;
}

table.fila .em-atencao,
table.fila.agrupada .apoio.em-atencao,
table.fila.agrupada .principal.em-atencao,
table.fila.agrupada td:first-child .apoio.em-atencao:first-child {
  color: var(--atencao); font-weight: 700;
}
table.fila .em-bom,
table.fila.agrupada .apoio.em-bom,
table.fila.agrupada .principal.em-bom,
table.fila.agrupada td:first-child .apoio.em-bom:first-child {
  color: var(--bom); font-weight: 700;
}

.selo-sla {
  display: block; margin-top: 7px;
  font-size: 12px; font-weight: 700; line-height: 1.35;

      var atual = item.tela === telaAtual ? ' aria-current="page"' : '';
      return '<li><button type="button" class="lateral-item"'
        + ' data-tela="' + escapar(item.tela) + '"' + atual + '>'
        + icone(item.tela)
        + '<span class="rotulo">' + escapar(item.titulo) + '</span>'
        + '</button></li>';
    }).join('');

    var rodape = '';
    if (pacote.identidade.plataforma || pacote.identidade.fabricante) {
      rodape = '<div class="lateral-pe">'
        + '<div>' + escapar(pacote.identidade.plataforma) + '</div>'
        + '<div class="fabricante">' + escapar(pacote.identidade.fabricante) + '</div>'
        + '</div>';
    }

    return '<div class="lateral-marca">'
      + marca(pacote.identidade)
      + '<button type="button" class="lateral-encolher" id="encolher"'
      + ' title="Encolher o menu" aria-label="Encolher o menu">'
      + '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"'
      + ' stroke-linecap="round" aria-hidden="true">'
      + '<path d="M4 7h16M4 12h16M4 17h16"></path></svg>'
      + '</button>'
      + '</div>'
      + '<ul class="lateral-itens">' + itens + '</ul>'
      + rodape;
  }

  function podeAbrirOBuscar(pacote) {
    return (pacote.menu || []).some(function (item) { return item.tela === 'buscarCaso'; });
  }

  function montarSuperior(pacote) {
    var bolinhas = TEMAS.map(function (tema) {
      var marcado = tema.chave === pacote.tema ? 'true' : 'false';
      return '<button type="button" class="tema tema-' + tema.chave + '"'
        + ' data-tema="' + tema.chave + '" aria-pressed="' + marcado + '"'
        + ' title="' + escapar(tema.nome) + '"'
        + ' aria-label="Tema ' + escapar(tema.nome) + '"></button>';
    }).join('');

    return ''
      + '<button type="button" class="abrir-menu" id="abrir-menu" aria-label="Abrir o menu">'
      + '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"'
      + ' stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"></path></svg>'
      + '</button>'

      + '<div class="identidade">'
      + '<h1>' + escapar(pacote.identidade.nome)
      + (pacote.identidade.nomeLongo
        ? ' — ' + escapar(pacote.identidade.nomeLongo) : '')
      + '</h1>'
      + '<p>' + escapar(pacote.identidade.operacao) + '</p>'
      + '</div>'

      + (podeAbrirOBuscar(pacote)
        ? '<div class="busca">'
          + '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"'
          + ' stroke-linecap="round"><circle cx="11" cy="11" r="7"></circle>'
          + '<path d="M20 20l-4.2-4.2"></path></svg>'
          + '<input type="search" id="busca-global" autocomplete="off"'
          + ' placeholder="Buscar por apólice, segurado ou protocolo…"'
          + ' title="Digite e aperte Enter: abre o Buscar Caso com o termo"'
          + ' aria-label="Buscar caso em todos os canais">'
          + '<kbd>Ctrl K</kbd>'
          + '</div>'
        : '')

      + '<button type="button" class="recarregar" id="recarregar"'
      + ' title="Atualizar esta tela" aria-label="Atualizar esta tela">'
      + icone('recarregar') + '</button>'

      + '<div class="temas" role="group" aria-label="Cor do sistema">' + bolinhas + '</div>'

      + ultimoRegistro(pacote.ultimoRegistro)

      + '<div class="pessoa">'
      + '<div class="iniciais" aria-hidden="true">'
      + escapar(iniciais(pacote.usuario.nome)) + '</div>'
      + '<div class="quem"><strong>' + escapar(pacote.usuario.nome) + '</strong>'
      + '<span>' + escapar(descricaoDaPessoa(pacote.usuario)) + '</span>'
      + '</div></div>';
  }

  function descricaoDaPessoa(usuario) {
    var cargo = usuario.cargo || usuario.nivelAcesso || '';
    return cargo;
  }

  function ultimoRegistro(dados) {
    var informacao = dados || { texto: 'Nenhum registro ainda', existe: false };
    var explicacao = informacao.existe && informacao.canal
      ? 'Último registro em ' + informacao.canal
      : 'Ainda não há registros nos canais';

    return '<div class="ultimo-registro' + (informacao.existe ? '' : ' vazio') + '"'
      + ' title="' + escapar(explicacao) + '">'
      + '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"'
      + ' stroke-linecap="round" aria-hidden="true">'
      + '<rect x="3.5" y="5" width="17" height="15" rx="2"></rect>'
      + '<path d="M3.5 10h17M8 3.5v3M16 3.5v3"></path></svg>'
      + '<span class="rotulo-data">' + escapar(informacao.texto) + '</span>'
      + '</div>';
  }

  function avisoDeJanela(resposta, oQueEssaTelaMostra) {
    if (!resposta || !resposta.truncada) return '';
    var lidas = resposta.linhasLidas
      ? Number(resposta.linhasLidas).toLocaleString('pt-BR') : 'algumas';
    return '<p class="aviso-janela" role="status">'
      + '<strong>' + oQueEssaTelaMostra + ' vêm das ' + lidas + ' linhas mais '
      + 'recentes da base</strong>, que é o que o painel lê de uma vez. O canal '
      + 'tem mais que isso, então casos antigos do período podem ter ficado de '
      + 'fora. Para o histórico inteiro, use Buscar Caso; para aumentar a '
      + 'janela, ajuste <code>OPERACAO.LINHAS_DO_PAINEL</code> na aba CONFIG.'
      + '</p>';
  }

  function caixaDeFiltros(conteudo, contagem) {
    return '<section class="caixa-de-filtros">'
      + '<header class="caixa-de-filtros-cabeca">'
      + '<h3>' + icone('filtro') + 'Filtros</h3>'
      + (contagem ? '<span class="contagem">' + contagem + '</span>' : '')
      + '</header>'
      + '<div class="filtros">' + conteudo + '</div>'
      + '</section>';
  }

  function botaoLimparFiltros(id) {
    return '<button type="button" class="limpar-filtros" id="' + escapar(id) + '">'
      + 'Limpar filtros</button>';
  }

  return {
    avisoDeJanela: avisoDeJanela,
    botaoLimparFiltros: botaoLimparFiltros,
    caixaDeFiltros: caixaDeFiltros,
    montarLateral: montarLateral,
    montarSuperior: montarSuperior,

    icone: icone,
    escapar: escapar,
    dicaDaCelula: dicaDaCelula
  };
})();
</script>

<script>

var SenhaDeAdministrador = (function () {

  var acaoPendente = null;

  function elemento(id) { return document.getElementById(id); }

  function pedir(acao, avisarSeNaoDefinida) {
    if (avisarSeNaoDefinida) {
      window.alert('Ainda não existe senha de administrador. Defina uma em '
        + 'Configurações › Identidade antes de fazer isto.');
      return;
    }
    acaoPendente = acao;
    abrir();
  }

  function abrir() {
    var caixa = document.createElement('div');
    caixa.className = 'dialogo';
    caixa.id = 'dialogo-senha';
    caixa.innerHTML = '<div class="dialogo-caixa" role="dialog" aria-modal="true"'
      + ' aria-labelledby="dialogo-titulo">'
      + '<h3 id="dialogo-titulo">Ação sem desfazer</h3>'
      + '<p>Isto escreve na planilha de produção. Confirme com a senha de '
      + 'administrador — ela libera as ações de estrutura por 5 minutos.</p>'
      + '<form id="form-dialogo">'
      + '<input type="password" id="senha-do-dialogo" autocomplete="off"'
      + ' placeholder="Senha de administrador" aria-label="Senha de administrador">'
      + '<p class="dialogo-erro" id="dialogo-erro" hidden></p>'
      + '<div class="config-acoes">'
      + '<button type="submit" class="botao">Confirmar</button>'
      + '<button type="button" class="botao vazado" id="dialogo-desistir">'
      + 'Desistir</button></div></form></div>';
    document.body.appendChild(caixa);

    var campo = elemento('senha-do-dialogo');
    campo.focus();

    elemento('dialogo-desistir').addEventListener('click', fechar);
    elemento('form-dialogo').addEventListener('submit', function (evento) {
      evento.preventDefault();
      Servidor.chamar('liberarComSenha', campo.value)
        .entao(function () {

          var acao = acaoPendente;
          fechar();
          if (acao) acao();
        })
        .senao(function (erro) {
          var aviso = elemento('dialogo-erro');
          aviso.textContent = erro.message || String(erro);
          aviso.hidden = false;
          campo.value = '';
          campo.focus();
        });
    });
  }

  function fechar() {
    var caixa = elemento('dialogo-senha');
    if (caixa) caixa.parentNode.removeChild(caixa);
    acaoPendente = null;
  }

  return { pedir: pedir, fechar: fechar };

})();
</script>

<script>

var SeletorDeCanal = (function () {

  var DESENHOS = {

    escudo:
      '<path d="M12 3.2 4.8 6v6.2c0 4.4 3 7.6 7.2 8.9 4.2-1.3 7.2-4.5 7.2-8.9V6z"></path>'
      + '<path d="M12 15.4c-2-1.3-3.2-2.4-3.2-3.8a1.7 1.7 0 0 1 3.2-.9 1.7 1.7 0 0 1 3.2.9'
      + 'c0 1.4-1.2 2.5-3.2 3.8z"></path>',

    diamante:
      '<path d="M7.4 3.6h9.2l4 5.4L12 20.6 3.4 9z"></path>'
      + '<path d="M3.4 9h17.2M7.4 3.6 12 9l4.6-5.4M12 9v11.6"></path>',

    grupo:
      '<path d="M15.8 20.4v-1.8a3.6 3.6 0 0 0-3.6-3.6H6.8a3.6 3.6 0 0 0-3.6 3.6v1.8"></path>'
      + '<circle cx="9.5" cy="7.6" r="3.4"></circle>'
      + '<path d="M20.8 20.4v-1.8a3.6 3.6 0 0 0-2.7-3.5"></path>'
      + '<path d="M15.6 4.4a3.6 3.6 0 0 1 0 6.9"></path>'
  };

  function icone(nome) {
    var desenho = DESENHOS[String(nome || '').toLowerCase()] || DESENHOS.diamante;
    return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor"'
      + ' stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"'
      + ' aria-hidden="true">' + desenho + '</svg>';
  }

  function montar(canais, idEscolhido) {
    return '<div class="canais" role="group" aria-label="Canal de trabalho">'
      + canais.map(function (canal) {
        var atual = canal.id === idEscolhido;
        return '<button type="button" class="canal' + (atual ? ' atual' : '') + '"'
          + ' data-canal="' + Moldura.escapar(canal.id) + '"'
          + ' aria-pressed="' + (atual ? 'true' : 'false') + '">'
          + icone(canal.icone)
          + '<span class="dizeres">'
          + '<strong>' + Moldura.escapar(canal.nome) + '</strong>'
          + '<span>' + Moldura.escapar(canal.descricao) + '</span>'
          + '</span></button>';
      }).join('')
      + '</div>';
  }

  function ligar(aoEscolher) {
    var botoes = document.querySelectorAll('.canal');
    for (var i = 0; i < botoes.length; i++) {
      botoes[i].addEventListener('click', function () {
        aoEscolher(this.getAttribute('data-canal'));
      });
    }
  }

  function nomesDosIcones() {
    return Object.keys(DESENHOS);
  }

  return {
    montar: montar, ligar: ligar, icone: icone,
    nomesDosIcones: nomesDosIcones
  };
})();
</script>

<script>

var Formulario = (function () {

  function escapar(texto) { return Moldura.escapar(texto); }

  function texto(valor) {
    return String(valor === null || valor === undefined ? '' : valor);
  }

  function aplicarMascara(valor, mascara) {
    var digitos = String(valor || '').replace(/\D/g, '');
    if (!mascara) return digitos;
    if (mascara.indexOf('|') >= 0) mascara = mascaraEmQueCabe(digitos, mascara);

    var saida = '';
    var proximo = 0;
    for (var i = 0; i < mascara.length && proximo < digitos.length; i++) {
      if (mascara.charAt(i) === '0') {
        saida += digitos.charAt(proximo);
        proximo++;
      } else {
        saida += mascara.charAt(i);
      }
    }
    return saida;
  }

  function mascaraEmQueCabe(digitos, mascara) {
    var opcoes = String(mascara).split('|');
    for (var i = 0; i < opcoes.length; i++) {
      var cabem = (opcoes[i].match(/0/g) || []).length;
      if (digitos.length <= cabem) return opcoes[i];
    }
    return opcoes[opcoes.length - 1];
  }

  var DIGITOS_DO_DINHEIRO = 11;

  function aplicarMascaraDeDinheiro(valor) {
    var digitos = String(valor || '').replace(/\D/g, '');

    digitos = digitos.replace(/^0+/, '');
    if (!digitos) return '';
    if (digitos.length > DIGITOS_DO_DINHEIRO) {
      digitos = digitos.substring(0, DIGITOS_DO_DINHEIRO);
    }

    while (digitos.length < 3) digitos = '0' + digitos;

    var centavos = digitos.slice(-2);
    var inteiros = digitos.slice(0, -2).replace(/\B(?=(\d{3})+(?!\d))/g, '.');
    return 'R$ ' + inteiros + ',' + centavos;
  }

  function ehCampoDeDinheiro(campo) {
    return campo.tipo === 'moeda';
  }

  function desenharCampo(campo, prefixo, colunaDaData) {
    var id = prefixo + 'campo-' + campo.chave;

    var obrigatorio = campo.obrigatorio ? ' <span class="exigido">*</span>'
      : (campo.obrigatorioSe ? ' <span class="exigido" data-exigido-condicional hidden>*</span>' : '');

    var exigido = campo.obrigatorio ? ' aria-required="true"' : '';
    var travado = campo.somenteLeitura ? ' disabled' : '';
    var controle;

    if (campo.tipo === 'seletor' && !campo.opcoes.length) {
      controle = '<input type="text" id="' + id + '"'
        + ' data-chave="' + escapar(campo.chave) + '" autocomplete="off"'
        + ' placeholder="A lista ainda está vazia — digite o valor"'
        + exigido + travado + '>';

    } else if (campo.tipo === 'seletor') {
      var opcoes = ['<option value="">Selecione uma opção</option>'];
      campo.opcoes.forEach(function (opcao) {
        opcoes.push('<option value="' + escapar(opcao.valor) + '">'
          + escapar(opcao.rotulo) + '</option>');
      });
      controle = '<select id="' + id + '" data-chave="' + escapar(campo.chave) + '"'
        + exigido + travado + '>' + opcoes.join('') + '</select>';

    } else if (campo.tipo === 'simOuNao') {
      controle = '<select id="' + id + '" data-chave="' + escapar(campo.chave) + '"'
        + exigido + travado + '>'
        + '<option value="">Selecione</option>'
        + '<option value="SIM">Sim</option>'
        + '<option value="NAO">Não</option></select>';

    } else if (campo.tipo === 'textoLongo') {
      controle = '<textarea id="' + id + '" rows="3"' + exigido
        + ' data-chave="' + escapar(campo.chave) + '"' + travado + '></textarea>';

    } else if (campo.tipo === 'data') {

      controle = '<input type="date" id="' + id + '"'
        + ' data-chave="' + escapar(campo.chave) + '"'
        + (campo.aceitaFuturo ? '' : ' max="' + hojeNoCalendario() + '"')
        + (colunaDaData && campo.cabecalho === colunaDaData
          ? ' data-data-do-caso="sim"' : '')
        + exigido + travado + '>';

    } else {
      var htmlTipo = 'text';
      if (campo.tipo === 'hora') htmlTipo = 'time';
      else if (campo.tipo === 'email') htmlTipo = 'email';
      else if (campo.tipo === 'numero' || campo.tipo === 'moeda'
        || campo.tipo === 'percentual') htmlTipo = 'text';

      var dinheiro = ehCampoDeDinheiro(campo);

      var mascara = campo.chave === 'susep' ? '' : campo.mascara;

      controle = '<input type="' + htmlTipo + '" id="' + id + '"'
        + ' data-chave="' + escapar(campo.chave) + '"'
        + (dinheiro ? ' data-dinheiro="sim" inputmode="decimal"' : '')
        + (dinheiro ? ' placeholder="R$ 0,00"' : '')
        + (mascara ? ' data-mascara="' + escapar(mascara) + '"' : '')

        + (mascara ? ' placeholder="'
          + escapar(mascara.split('|').join(' ou ')) + '"' : '')

        + (colunaDaData && campo.cabecalho === colunaDaData
          ? ' data-data-do-caso="sim"' : '')
        + ' autocomplete="off"' + exigido + travado + '>';
    }

    var ajuda = campo.descricao
      ? '<small class="ajuda">' + escapar(campo.descricao) + '</small>' : '';
    var selo = campo.chave === 'susep'
      ? '<div class="selo-susep" id="' + prefixo + 'selo-susep" hidden></div>' : '';

    if (campo.chave === 'numerodaproposta') {
      selo = '<div class="selo-susep" id="' + prefixo + 'selo-proposta" hidden></div>';
    }

    var condicao = (campo.mostrarSe
      ? ' data-mostrar-se-campo="' + escapar(campo.mostrarSe.campo) + '"'
        + ' data-mostrar-se-valores="' + escapar(JSON.stringify(campo.mostrarSe.valores)) + '"'
      : '')

      + (campo.obrigatorioSe && !campo.obrigatorio
        ? ' data-obrigatorio-se-campo="' + escapar(campo.obrigatorioSe.campo) + '"'
          + ' data-obrigatorio-se-valores="' + escapar(JSON.stringify(campo.obrigatorioSe.valores)) + '"'
        : '');

    var porQueTravado = campo.travadoPeloCargo
      ? '<small class="ajuda">Preenchido com o seu nome. Cadastrar em nome de '
        + 'outra pessoa depende do seu nível de acesso.</small>' : '';

    return '<div class="campo largura-' + campo.largura + '" data-campo="'
      + escapar(campo.chave) + '"' + condicao + '>'
      + '<label for="' + id + '">' + escapar(campo.rotulo) + obrigatorio + '</label>'
      + controle + ajuda + porQueTravado + selo
      + '<small class="erro" hidden></small>'
      + '</div>';
  }

  function confirmarExclusao(idDoCaso, aoConfirmar) {
    confirmarAtencao('Atenção: excluir o caso ' + Moldura.escapar(idDoCaso),
      '<p><strong>O caso será apagado definitivamente da planilha.</strong> '
      + 'Não dá para desfazer, nem por um administrador.</p>'
      + '<p>O que havia no caso fica registrado na auditoria — quem excluiu, '
      + 'quando, e o que estava gravado.</p>',
      'Excluir definitivamente', aoConfirmar);
  }

  function confirmarAtencao(titulo, textoHtml, rotuloDoBotao, aoConfirmar) {
    if (document.getElementById('dialogo-exclusao')) return;

    var caixa = document.createElement('div');
    caixa.className = 'dialogo';
    caixa.id = 'dialogo-exclusao';
    caixa.innerHTML = '<div class="dialogo-caixa atencao" role="alertdialog"'
      + ' aria-modal="true" aria-labelledby="titulo-exclusao"'
      + ' aria-describedby="texto-exclusao">'
      + '<h3 id="titulo-exclusao">' + Moldura.icone('ocultar') + ' ' + titulo + '</h3>'
      + '<div id="texto-exclusao">' + textoHtml + '</div>'
      + '<div class="config-acoes">'
      + '<button type="button" class="botao vazado" id="cancelar-exclusao">'
      + 'Cancelar</button>'
      + '<button type="button" class="botao perigo" id="confirmar-exclusao">'
      + Moldura.escapar(rotuloDoBotao) + '</button>'
      + '</div></div>';
    document.body.appendChild(caixa);

    function sair() {
      if (caixa.parentNode) caixa.parentNode.removeChild(caixa);
      document.removeEventListener('keydown', aoTeclar);
    }
    function aoTeclar(evento) {
      if (evento.key === 'Escape') { evento.preventDefault(); sair(); }
    }
    document.addEventListener('keydown', aoTeclar);
    document.getElementById('cancelar-exclusao').addEventListener('click', sair);
    caixa.addEventListener('mousedown', function (evento) {
      if (evento.target === caixa) sair();
    });
    document.getElementById('confirmar-exclusao').addEventListener('click', function () {
      sair();
      if (aoConfirmar) aoConfirmar();
    });
    document.getElementById('cancelar-exclusao').focus();
  }

  function avisar(opcoes) {
    if (document.getElementById('dialogo-aviso')) return;
    var pergunta = typeof opcoes.aoConfirmar === 'function';

    var caixa = document.createElement('div');
    caixa.className = 'dialogo';
    caixa.id = 'dialogo-aviso';
    caixa.innerHTML = '<div class="dialogo-caixa aviso-do-sistema tom-' + (opcoes.tom || 'atencao') + '"'
      + ' role="' + (pergunta ? 'dialog' : 'alertdialog') + '" aria-modal="true"'
      + ' aria-labelledby="titulo-aviso" aria-describedby="texto-aviso">'
      + '<h3 id="titulo-aviso">' + Moldura.escapar(opcoes.titulo) + '</h3>'
      + '<div id="texto-aviso" class="texto-do-aviso">' + (opcoes.html || '') + '</div>'
      + '<div class="config-acoes">'
      + '<button type="button" class="botao" id="confirmar-aviso">'
      + Moldura.escapar(opcoes.botao || 'Entendi') + '</button>'
      + (pergunta ? '<button type="button" class="botao vazado" id="cancelar-aviso">'
        + 'Cancelar</button>' : '')
      + '</div></div>';
    document.body.appendChild(caixa);

    function sair() {
      if (caixa.parentNode) caixa.parentNode.removeChild(caixa);
      document.removeEventListener('keydown', aoTeclar);
    }
    function aoTeclar(evento) {
      if (evento.key === 'Escape') { evento.preventDefault(); sair(); }
    }
    document.addEventListener('keydown', aoTeclar);
    caixa.addEventListener('mousedown', function (evento) {
      if (evento.target === caixa) sair();
    });
    if (pergunta) document.getElementById('cancelar-aviso').addEventListener('click', sair);
    document.getElementById('confirmar-aviso').addEventListener('click', function () {
      sair();
      if (pergunta) opcoes.aoConfirmar();
    });
    document.getElementById('confirmar-aviso').focus();
  }

  function aplicarPadroes(raiz, formulario) {
    formulario.secoes.forEach(function (secao) {
      secao.campos.forEach(function (campo) {
        if (!campo.valorPadrao) return;
        var caixa = raiz.querySelector('[data-chave="' + campo.chave + '"]');
        if (caixa && !caixa.value) {
          caixa.value = caixa.type === 'date'
            ? paraCaixaDeData(campo.valorPadrao) : campo.valorPadrao;
        }
      });
    });
    aplicarCondicoes(raiz);
  }

  function mesmoTexto(um, outro) {
    function limpar(texto) {
      return String(texto || '').trim().toLowerCase()
        .normalize('NFD').replace(/[\u0300-\u036f]/g, '');
    }
    return limpar(um) === limpar(outro);
  }

  function aplicarCondicoes(raiz, limpar) {

    var cobrados = raiz.querySelectorAll('[data-obrigatorio-se-campo]');
    for (var c = 0; c < cobrados.length; c++) {
      var cobrado = cobrados[c];
      var deQuemCobra = cobrado.getAttribute('data-obrigatorio-se-campo');
      var quando = [];
      try { quando = JSON.parse(cobrado.getAttribute('data-obrigatorio-se-valores') || '[]'); }
      catch (erro) { quando = []; }
      var manda = raiz.querySelector('[data-chave="' + deQuemCobra + '"]');
      var valorQueManda = manda ? String(manda.value || '') : '';
      var vale = quando.some(function (esperado) { return mesmoTexto(valorQueManda, esperado); });
      var controle = cobrado.querySelector('[data-chave]');
      if (controle) {
        if (vale) controle.setAttribute('aria-required', 'true');
        else controle.removeAttribute('aria-required');
      }
      var asterisco = cobrado.querySelector('[data-exigido-condicional]');
      if (asterisco) asterisco.hidden = !vale;
    }

    var condicionais = raiz.querySelectorAll('[data-mostrar-se-campo]');
    for (var i = 0; i < condicionais.length; i++) {
      var bloco = condicionais[i];
      var deQuem = bloco.getAttribute('data-mostrar-se-campo');
      var esperados = [];
      try { esperados = JSON.parse(bloco.getAttribute('data-mostrar-se-valores') || '[]'); }
      catch (erro) { esperados = []; }
      var caixa = raiz.querySelector('[data-chave="' + deQuem + '"]');
      var valor = caixa ? String(caixa.value || '') : '';
      var mostrar = esperados.some(function (esperado) { return mesmoTexto(valor, esperado); });
      bloco.hidden = !mostrar;
      if (!mostrar && limpar) {
        var dentro = bloco.querySelector('[data-chave]');
        if (dentro) dentro.value = '';
      }
    }
  }

  function desenhar(formulario, prefixo) {
    return formulario.secoes.map(function (secao) {
      return '<fieldset class="secao">'
        + '<legend>' + escapar(secao.nome) + '</legend>'
        + '<div class="grade">'
        + secao.campos.map(function (campo) {
          return desenharCampo(campo, prefixo || '',
            formulario.canal && formulario.canal.colunaDaData);
        }).join('')
        + '</div></fieldset>';
    }).join('');
  }

  function ligar(raiz, prefixo, idDoCanal, comSeloDaSusep, idDoCasoAberto) {

    var deDinheiro = raiz.querySelectorAll('[data-dinheiro]');
    for (var d = 0; d < deDinheiro.length; d++) {
      deDinheiro[d].addEventListener('keypress', function (evento) {
        if (evento.key && evento.key.length === 1 && !/\d/.test(evento.key)) {
          evento.preventDefault();
        }
      });
      deDinheiro[d].addEventListener('input', function () {
        this.value = aplicarMascaraDeDinheiro(this.value);
        this.selectionStart = this.selectionEnd = this.value.length;
      });
    }

    var comMascara = raiz.querySelectorAll('[data-mascara]');
    for (var i = 0; i < comMascara.length; i++) {
      comMascara[i].addEventListener('input', function () {
        var posicaoNoFim = this.selectionStart === this.value.length;
        this.value = aplicarMascara(this.value, this.getAttribute('data-mascara'));
        if (posicaoNoFim) {
          this.selectionStart = this.selectionEnd = this.value.length;
        }
      });
    }

    var susep = comSeloDaSusep === false
      ? null : raiz.querySelector('[data-chave="susep"]');
    if (susep) {
      var conferir = function () {
        consultarSusep(raiz, prefixo, susep.value, idDoCanal);
      };
      susep.addEventListener('change', conferir);
      susep.addEventListener('blur', conferir);
    }

    var proposta = raiz.querySelector('[data-chave="numerodaproposta"]');
    if (proposta) {
      var conferirProposta = function () {
        consultarProposta(raiz, prefixo, idDoCanal, idDoCasoAberto);
      };
      proposta.addEventListener('change', conferirProposta);
      var dataDoCaso = raiz.querySelector('[data-data-do-caso]');
      if (dataDoCaso) {
        dataDoCaso.addEventListener('change', function () {
          if (String(proposta.value || '').trim()) conferirProposta();
        });
      }
    }

    var condicionais = Array.prototype.slice.call(raiz.querySelectorAll('[data-mostrar-se-campo]'))
      .concat(Array.prototype.slice.call(raiz.querySelectorAll('[data-obrigatorio-se-campo]')));
    var jaOuvidos = {};
    for (var k = 0; k < condicionais.length; k++) {
      var deQuem = condicionais[k].getAttribute('data-mostrar-se-campo')
        || condicionais[k].getAttribute('data-obrigatorio-se-campo');
      if (jaOuvidos[deQuem]) continue;
      jaOuvidos[deQuem] = true;
      var manda = raiz.querySelector('[data-chave="' + deQuem + '"]');
      if (!manda) continue;
      manda.addEventListener('change', function () { aplicarCondicoes(raiz, true); });
      manda.addEventListener('input', function () { aplicarCondicoes(raiz, true); });
    }
    aplicarCondicoes(raiz, false);
  }

  function consultarSusep(raiz, prefixo, valor, idDoCanal) {
    var selo = raiz.querySelector('#' + (prefixo || '') + 'selo-susep');
    if (!selo) return;

    if (!String(valor || '').trim()) {
      selo.hidden = true;
      return;
    }

    selo.hidden = false;
    selo.className = 'selo-susep conferindo';
    selo.textContent = 'Conferindo…';

    Servidor.chamar('consultarSusep', valor, idDoCanal)
      .entao(function (resposta) {
        var aparencia = {
          OK: 'liberada', BLOQUEADA: 'bloqueada',
          NAO_ENCONTRADA: 'desconhecida', VAZIA: 'conferindo'
        }[resposta.situacao] || 'conferindo';

        if (resposta.bloqueadaPor === 'Corretora') aparencia = 'bloqueada-corretora';

        selo.className = 'selo-susep ' + aparencia;
        selo.textContent = resposta.mensagem
          + (resposta.segmento && resposta.situacao === 'OK'
            ? ' · ' + resposta.segmento : '');

        preencherCorretoraDaSusep(raiz, resposta);
      })
      .senao(function () {
        selo.className = 'selo-susep conferindo';
        selo.textContent = 'Não consegui conferir a SUSEP agora.';
      });
  }

  function consultarProposta(raiz, prefixo, idDoCanal, idDoCasoAberto) {
    var selo = raiz.querySelector('#' + (prefixo || '') + 'selo-proposta');
    var campo = raiz.querySelector('[data-chave="numerodaproposta"]');
    if (!selo || !campo) return;

    var perguntada = String(campo.value || '').trim();
    if (!perguntada) {
      selo.hidden = true;
      return;
    }

    var data = raiz.querySelector('[data-data-do-caso]');
    selo.hidden = false;
    selo.className = 'selo-susep conferindo';
    selo.textContent = 'Conferindo a proposta…';

    Servidor.chamar('conferirPropostaRepetida', perguntada, idDoCanal,
      data ? data.value : '', idDoCasoAberto || '')
      .entao(function (resposta) {
        if (String(campo.value || '').trim() !== perguntada) return;
        if (resposta.situacao === 'REPETIDA' || resposta.situacao === 'UNICA') {
          selo.className = 'selo-susep '
            + (resposta.situacao === 'REPETIDA' ? 'bloqueada' : 'liberada');
          selo.textContent = resposta.mensagem;
        } else {

          selo.hidden = true;
        }
      })
      .senao(function () {
        if (String(campo.value || '').trim() !== perguntada) return;
        selo.className = 'selo-susep conferindo';
        selo.textContent = 'Não consegui conferir a proposta agora.';
      });
  }

  function preencherCorretoraDaSusep(raiz, resposta) {
    var campo = raiz.querySelector('[data-chave="corretora"]');
    if (!campo || campo.disabled) return;

    var nome = String((resposta && resposta.corretora) || '').trim();
    var agora = String(campo.value || '').trim();
    var oQueEuPreenchi = campo.getAttribute('data-veio-da-susep') || '';

    if (agora !== '' && agora !== oQueEuPreenchi) return;
    if (!nome) {

      if (agora === oQueEuPreenchi && agora !== '') campo.value = '';
      campo.removeAttribute('data-veio-da-susep');
      return;
    }

    campo.value = nome;
    campo.setAttribute('data-veio-da-susep', nome);
  }

  function valores(raiz) {
    var lidos = {};
    var controles = raiz.querySelectorAll('[data-chave]');
    for (var i = 0; i < controles.length; i++) {
      if (controles[i].disabled) continue;

      if (controles[i].getAttribute('data-valor-que-nao-coube') !== null
        && controles[i].value === '') continue;
      lidos[controles[i].getAttribute('data-chave')] = controles[i].value;
    }
    return lidos;
  }

  function preencher(raiz, valoresDoCaso) {
    var controles = raiz.querySelectorAll('[data-chave]');
    for (var i = 0; i < controles.length; i++) {
      var chave = controles[i].getAttribute('data-chave');
      var valor = texto(valoresDoCaso[chave]);

      if (controles[i].getAttribute('data-dinheiro')) {
        valor = comoDinheiroQueVeioGravado(valor);
      }
      if (controles[i].type === 'date') valor = paraCaixaDeData(valor);
      controles[i].value = valor;
      controles[i].removeAttribute('data-valor-que-nao-coube');

      if (valor !== '' && controles[i].value === '' && controles[i].tagName !== 'SELECT') {
        controles[i].setAttribute('data-valor-que-nao-coube', valor);
      }

      if (controles[i].tagName === 'SELECT' && valor && controles[i].value !== valor) {
        var solta = document.createElement('option');
        solta.value = valor;
        solta.textContent = valor + ' (fora da lista)';
        controles[i].appendChild(solta);
        controles[i].value = valor;
      }
    }

    aplicarCondicoes(raiz, false);
  }

  function comoDinheiroQueVeioGravado(valor) {
    var centavos = comoNumeroEmCentavos(valor);
    if (centavos === '') return '';
    return aplicarMascaraDeDinheiro(centavos) || 'R$ 0,00';
  }

  function comoNumeroEmCentavos(valor) {

    var limpo = String(valor === null || valor === undefined ? '' : valor)
      .trim().replace(/[^\d.,-]/g, '');
    if (!limpo) return '';

    var emPonto = limpo.indexOf(',') >= 0
      ? limpo.replace(/\./g, '').replace(',', '.')
      : limpo;

    var numero = Number(emPonto);
    if (!isFinite(numero)) return '';
    return String(Math.round(numero * 100));
  }

  function paraCaixaDeData(valor) {
    var brasileira = /^(\d{2})\/(\d{2})\/(\d{4})$/.exec(String(valor || '').trim());
    if (!brasileira) return valor;
    return brasileira[3] + '-' + brasileira[2] + '-' + brasileira[1];
  }

  function hojeNoCalendario() {
    var agora = new Date();
    var dois = function (n) { return (n < 10 ? '0' : '') + n; };
    return agora.getFullYear() + '-' + dois(agora.getMonth() + 1) + '-' + dois(agora.getDate());
  }

  function limparErros(raiz) {
    var marcados = raiz.querySelectorAll('.campo.com-erro');
    for (var i = 0; i < marcados.length; i++) {
      marcados[i].classList.remove('com-erro');
      var aviso = marcados[i].querySelector('.erro');
      if (aviso) { aviso.hidden = true; aviso.textContent = ''; }
    }
  }

  function mostrarProblemas(raiz, problemas) {
    limparErros(raiz);
    (problemas || []).forEach(function (problema) {
      var caixa = raiz.querySelector('[data-campo="' + problema.campo + '"]');
      if (!caixa) return;
      caixa.classList.add('com-erro');
      var aviso = caixa.querySelector('.erro');
      aviso.textContent = problema.erro;
      aviso.hidden = false;
    });
    var primeiro = raiz.querySelector('.campo.com-erro input, .campo.com-erro select');
    if (primeiro) primeiro.focus();
  }

  function faltaPreencher(raiz) {
    if (!raiz) return null;
    var exigidos = raiz.querySelectorAll('[aria-required="true"]');
    for (var i = 0; i < exigidos.length; i++) {
      var campo = exigidos[i];
      if (campo.disabled) continue;
      var bloco = campo.closest ? campo.closest('[data-campo]') : null;
      if (bloco && bloco.hidden) continue;
      if (!String(campo.value || '').trim()) return campo;
    }
    return null;
  }

  function vigiarObrigatorios(raiz, botao) {
    if (!raiz || !botao) return;

    function conferir() {
      if (botao.getAttribute('data-gravando') === 'sim') return;
      var falta = faltaPreencher(raiz);
      botao.disabled = !!falta;
      botao.title = falta
        ? 'Preencha os campos obrigatórios (marcados com *) para cadastrar.'
        : '';
    }

    if (raiz.getAttribute('data-obrigatorios-vigiados') !== 'sim') {
      raiz.setAttribute('data-obrigatorios-vigiados', 'sim');
      raiz.addEventListener('input', conferir);
      raiz.addEventListener('change', conferir);
    }
    conferir();
  }

  function mexerNoBotaoQueGrava(botao, estaGravando, area) {
    if (botao) {
      if (estaGravando && botao.getAttribute('data-gravando') !== 'sim') {
        botao.setAttribute('data-nome-de-volta', botao.innerHTML);
        botao.setAttribute('data-gravando', 'sim');
        botao.setAttribute('aria-busy', 'true');

        botao.setAttribute('aria-label', 'Gravando');
        botao.innerHTML = '<span class="tres-pontinhos" aria-hidden="true">'
          + '<i></i><i></i><i></i></span>';
      } else if (!estaGravando
        && botao.getAttribute('data-gravando') === 'sim') {
        botao.innerHTML = botao.getAttribute('data-nome-de-volta') || '';
        botao.removeAttribute('data-nome-de-volta');
        botao.removeAttribute('data-gravando');
        botao.removeAttribute('aria-busy');
        botao.removeAttribute('aria-label');
      }
    }

    if (!area) return;
    var botoes = area.querySelectorAll('button');
    for (var i = 0; i < botoes.length; i++) {
      if (estaGravando) {
        if (botoes[i].disabled) continue;
        botoes[i].setAttribute('data-travei', 'sim');
        botoes[i].disabled = true;
      } else if (botoes[i].getAttribute('data-travei') === 'sim') {
        botoes[i].removeAttribute('data-travei');
        botoes[i].disabled = false;
      }
    }
  }

  function comecouAGravar(botao, area) {
    mexerNoBotaoQueGrava(botao, true, area);
  }

  function acabouDeGravar(botao, area) {
    mexerNoBotaoQueGrava(botao, false, area);
  }

  return {
    aplicarMascara: aplicarMascara,
    aplicarMascaraDeDinheiro: aplicarMascaraDeDinheiro,
    desenhar: desenhar,
    ligar: ligar,
    aplicarPadroes: aplicarPadroes,
    confirmarExclusao: confirmarExclusao,
    confirmarAtencao: confirmarAtencao,
    avisar: avisar,
    valores: valores,
    preencher: preencher,
    limparErros: limparErros,
    mostrarProblemas: mostrarProblemas,
    faltaPreencher: faltaPreencher,
    vigiarObrigatorios: vigiarObrigatorios,
    comecouAGravar: comecouAGravar,
    acabouDeGravar: acabouDeGravar
  };
})();
</script>

<script>

var CasoEmModal = (function () {

  var canalAtual = '';
  var idAtual = '';

  var versaoAoAbrir = '';

  var formularioDeCadaCanal = {};
  var salvando = false;
  var envio = '';
  var aoFechar = null;
  var mudouAlgo = false;

  function escapar(texto) { return Moldura.escapar(texto); }
  function elemento(id) { return document.getElementById(id); }
  function corpoDaEdicao() { return elemento('corpo-da-edicao'); }

  function abrir(idDoCanal, idDoCaso, quandoMudar) {
    canalAtual = idDoCanal;
    idAtual = idDoCaso;
    versaoAoAbrir = '';
    envio = '';
    aoFechar = quandoMudar || null;
    mudouAlgo = false;
    salvando = false;

    desenharCasca();
    abrirEdicao();
  }

  function desenharCasca() {
    fechar(true);

    var caixa = document.createElement('div');
    caixa.className = 'dialogo';
    caixa.id = 'modal-do-caso';
    caixa.innerHTML = '<div class="dialogo-caixa larga" role="dialog"'
      + ' aria-modal="true" aria-labelledby="titulo-do-caso">'
      + '<header class="modal-cabeca">'
      + '<div><h3 id="titulo-do-caso">Caso ' + escapar(idAtual) + '</h3>'
      + '<p id="modal-subtitulo">Abrindo…</p></div>'
      + '<button type="button" class="modal-fechar" id="modal-x"'
      + ' aria-label="Fechar">✕</button>'
      + '</header>'
      + '<div class="modal-corpo" id="modal-corpo">'
      + '<form class="formulario no-modal" id="form-do-caso" novalidate>'
      + '<div id="corpo-da-edicao"><p class="carregando-campos">'
      + 'Abrindo o caso…</p></div></form>'
      + '<div id="modal-do-sistema"></div></div>'

      + '<footer class="modal-pe" id="modal-pe">'
      + '<span class="recado" id="recado-do-modal" hidden></span>'
      + '<button type="button" class="botao vazado" id="modal-fechar">Fechar</button>'
      + '<button type="button" class="botao" id="modal-salvar" disabled>'
      + 'Salvar alterações</button></footer>'
      + '</div>';
    document.body.appendChild(caixa);

    elemento('modal-x').addEventListener('click', function () { fechar(); });
    elemento('modal-fechar').addEventListener('click', function () { fechar(); });
    elemento('modal-salvar').addEventListener('click', salvar);
    caixa.addEventListener('mousedown', function (evento) {

      if (salvando) return;
      if (evento.target === caixa) fechar();
    });
    document.addEventListener('keydown', aoTeclar);
  }

  function aoTeclar(evento) {
    if (!elemento('modal-do-caso')) return;

    if (elemento('dialogo-situacao') || elemento('dialogo-exclusao')) return;

    if (salvando) return;
    if (evento.key === 'Escape') { evento.preventDefault(); fechar(); return; }
    if ((evento.ctrlKey || evento.metaKey) && evento.key === 'Enter') {
      evento.preventDefault();
      salvar();
    }
  }

  function fechar(semAvisar) {
    var caixa = elemento('modal-do-caso');
    if (caixa) caixa.parentNode.removeChild(caixa);
    document.removeEventListener('keydown', aoTeclar);

    if (!semAvisar && mudouAlgo && aoFechar) aoFechar();
    if (!semAvisar) { aoFechar = null; mudouAlgo = false; }
  }

  function abrirEdicao() {

    var guardado = formularioDeCadaCanal[canalAtual];
    var oFormulario = null;
    var osValores = null;
    var deuErro = false;

    function quandoAsDuasChegarem() {
      if (deuErro || !oFormulario || !osValores) return;
      var corpo = corpoDaEdicao();
      if (!corpo) return;
      elemento('modal-subtitulo').textContent = 'Trabalhar no caso · '
        + (osValores.canal || oFormulario.canal.nome || '');
      corpo.innerHTML = Formulario.desenhar(oFormulario, 'editar-');

      Formulario.ligar(corpo, 'editar-', canalAtual,
        oFormulario.canal.confereSusepBloqueada !== false, idAtual);
      Formulario.preencher(corpo, osValores.valores);
      elemento('modal-do-sistema').innerHTML = desenharDoSistema(osValores.doSistema);
      elemento('modal-salvar').disabled = false;
    }

    function falhou(erro) {
      deuErro = true;
      mostrarRecadoDeErro(erro);
    }

    if (guardado) {
      oFormulario = guardado;
    } else {
      Servidor.chamar('formularioDoCanal', canalAtual)
        .entao(function (definicao) {
          formularioDeCadaCanal[canalAtual] = definicao;
          oFormulario = definicao;
          quandoAsDuasChegarem();
        })
        .senao(falhou);
    }

    Servidor.chamar('casoParaEditar', canalAtual, idAtual)
      .entao(function (caso) {
        osValores = caso;
        versaoAoAbrir = caso.versao || '';
        quandoAsDuasChegarem();
      })
      .senao(falhou);
  }

  function desenharDoSistema(linhas) {
    if (!linhas || !linhas.length) return '';
    var temSua = linhas.some(function (linha) { return linha.editavel; });
    return '<section class="modal-pares">'
      + '<p class="pares-do-sistema">Também está na planilha — colunas que o '
      + 'formulário não pergunta. '
      + (temSua ? 'As suas dá para corrigir aqui; as do sistema são só leitura.'
        : 'Aqui só para leitura.') + '</p>'
      + linhas.map(function (linha, i) {

        if (linha.editavel) {
          var id = 'coluna-sua-' + i;
          return '<div class="par-do-caso coluna-sua">'
            + '<label for="' + id + '">' + escapar(linha.rotulo) + '</label>'
            + '<input type="text" id="' + id + '" data-coluna-sua="'
            + escapar(linha.rotulo) + '" value="' + escapar(linha.valor) + '"></div>';
        }
        return '<div class="par-do-caso do-sistema">'
          + '<span>' + escapar(linha.rotulo) + '</span>'
          + '<strong>' + escapar(linha.valor) + '</strong></div>';
      }).join('')
      + '</section>';
  }

  function colunasSuasNaTela() {
    var colunas = {};
    var caixas = document.querySelectorAll('#modal-do-sistema [data-coluna-sua]');
    for (var i = 0; i < caixas.length; i++) {
      colunas[caixas[i].getAttribute('data-coluna-sua')] = caixas[i].value;
    }
    return colunas;
  }

  function mostrarRecadoDeErro(erro) {
    var corpo = corpoDaEdicao();
    if (!corpo) return;
    corpo.innerHTML = '<p class="carregando-campos erro-carga">'
      + escapar(erro.message || String(erro)) + '</p>';
    var subtitulo = elemento('modal-subtitulo');
    if (subtitulo) subtitulo.textContent = 'Não deu para abrir';
    var salvarBotao = elemento('modal-salvar');
    if (salvarBotao) salvarBotao.disabled = true;
  }

  function recado(texto, tipo) {
    var caixa = elemento('recado-do-modal');
    if (!caixa) return;
    caixa.className = 'recado ' + (tipo || '');
    caixa.textContent = texto;
    caixa.hidden = !texto;
  }

  function salvar() {
    if (salvando) return;
    var corpo = corpoDaEdicao();

    if (!corpo || elemento('modal-salvar').disabled) return;

    salvando = true;
    Formulario.limparErros(corpo);
    recado('Gravando…', '');

    Formulario.comecouAGravar(elemento('modal-salvar'), elemento('modal-do-caso'));

    if (!envio) envio = Servidor.novoEnvio();
    Servidor.chamar('editarCaso', canalAtual, idAtual, Formulario.valores(corpo),
      versaoAoAbrir, colunasSuasNaTela(), envio)
      .entao(function () {
        salvando = false;
        mudouAlgo = true;

        destravarOsBotoes();
        fechar();
      })
      .senao(function (erro) {
        salvando = false;
        destravarOsBotoes();
        recado(erro.message || String(erro), 'ruim');
        if (erro.problemas) Formulario.mostrarProblemas(corpo, erro.problemas);
      });
  }

  function destravarOsBotoes() {
    Formulario.acabouDeGravar(elemento('modal-salvar'), elemento('modal-do-caso'));
  }

  var abrindoOStatus = false;

  function trocarSituacao(idDoCanal, idDoCaso, quandoMudar) {

    if (abrindoOStatus || elemento('dialogo-situacao')) return;
    abrindoOStatus = true;

    Servidor.chamar('situacoesParaTrocar', idDoCanal, idDoCaso)
      .entao(function (resposta) {
        abrindoOStatus = false;
        var caixa = document.createElement('div');
        caixa.className = 'dialogo';
        caixa.id = 'dialogo-situacao';
        caixa.innerHTML = '<div class="dialogo-caixa" role="dialog"'
          + ' aria-modal="true" aria-labelledby="titulo-situacao">'
          + '<h3 id="titulo-situacao">Alterar status</h3>'
          + '<p>Caso ' + escapar(idDoCaso) + '</p>'
          + '<form id="form-situacao">'
          + '<label class="config-campo"><span>Status</span>'
          + '<select id="situacao-nova">'
          + resposta.opcoes.map(function (opcao) {
            return '<option value="' + escapar(opcao.valor) + '"'
              + (opcao.valor === resposta.atual ? ' selected' : '') + '>'
              + escapar(opcao.rotulo) + '</option>';
          }).join('')
          + '</select></label>'

          + '<div id="campos-da-situacao"></div>'
          + '<p class="dialogo-erro" id="erro-situacao" hidden></p>'
          + '<div class="config-acoes">'
          + '<button type="submit" class="botao" id="salvar-situacao">Salvar</button>'
          + '<button type="button" class="botao vazado" id="cancelar-situacao">'
          + 'Cancelar</button></div></form></div>';
        document.body.appendChild(caixa);

        var gravando = false;

        var envio = '';
        var statusDoEnvio = '';
        function sair() {
          if (gravando) return;
          if (caixa.parentNode) caixa.parentNode.removeChild(caixa);
          document.removeEventListener('keydown', aoTeclarNoStatus);
        }
        function aoTeclarNoStatus(evento) {
          if (evento.key === 'Escape') { evento.preventDefault(); sair(); }
        }
        document.addEventListener('keydown', aoTeclarNoStatus);
        elemento('cancelar-situacao').addEventListener('click', sair);
        caixa.addEventListener('mousedown', function (evento) {
          if (evento.target === caixa) sair();
        });
        elemento('situacao-nova').focus();

        var pedidoAtual = 0;
        function mostrarOsCamposDaSituacao() {
          var situacao = elemento('situacao-nova').value;
          var lugar = elemento('campos-da-situacao');
          var esta = ++pedidoAtual;
          lugar.innerHTML = '';
          Servidor.chamar('camposDaSituacao', idDoCanal, idDoCaso, situacao)
            .entao(function (campos) {
              if (esta !== pedidoAtual || !elemento('campos-da-situacao')) return;
              if (!campos || !campos.length) { lugar.innerHTML = ''; return; }
              lugar.innerHTML = '<p class="config-explica">O status "' + escapar(situacao)
                + '" pede:</p>'
                + Formulario.desenhar({ secoes: [{ nome: situacao, campos: campos }], canal: {} },
                  'situacao-');
              Formulario.ligar(lugar, 'situacao-', idDoCanal, false);
              var valoresDoCaso = {};
              campos.forEach(function (campo) { valoresDoCaso[campo.chave] = campo.valor; });
              Formulario.preencher(lugar, valoresDoCaso);
            })
            .senao(function () { lugar.innerHTML = ''; });
        }
        elemento('situacao-nova').addEventListener('change', mostrarOsCamposDaSituacao);
        mostrarOsCamposDaSituacao();

        elemento('form-situacao').addEventListener('submit', function (evento) {
          evento.preventDefault();
          if (gravando) return;
          gravando = true;

          Formulario.comecouAGravar(elemento('salvar-situacao'), caixa);
          if (!envio || statusDoEnvio !== elemento('situacao-nova').value) {
            envio = Servidor.novoEnvio();
            statusDoEnvio = elemento('situacao-nova').value;
          }
          Servidor.chamar('alterarSituacaoDoCaso', idDoCanal, idDoCaso,
            elemento('situacao-nova').value,
            Formulario.valores(elemento('campos-da-situacao')), envio)
            .entao(function () {
              gravando = false;
              sair();
              if (quandoMudar) quandoMudar();
            })
            .senao(function (erro) {
              gravando = false;
              Formulario.acabouDeGravar(elemento('salvar-situacao'), caixa);
              var aviso = elemento('erro-situacao');
              aviso.textContent = erro.message || String(erro);
              aviso.hidden = false;
            });
        });
      })
      .senao(function (erro) {
        abrindoOStatus = false;
        window.alert(erro.message || String(erro));
      });
  }

  return { abrir: abrir, trocarSituacao: trocarSituacao };
})();
</script>

<script>

var Graficos = (function () {

  function escapar(texto) { return Moldura.escapar(texto); }

  function numero(valor, unidade) {
    if (unidade === 'dinheiro') {
      return 'R$ ' + (Math.round(valor * 100) / 100)
        .toFixed(2).replace('.', ',').replace(/\B(?=(\d{3})+(?!\d))/g, '.');
    }
    var arredondado = Math.round(valor * 100) / 100;
    return String(arredondado).replace('.', ',');
  }

  function porcento(parte, todo) {
    if (!todo) return '0%';
    return Math.round((parte / todo) * 100) + '%';
  }

  function classeDoPonto(ponto) {
    if (ponto.tom) return 'tom-' + ponto.tom;
    if (ponto.serie) return 'serie-' + ponto.serie;
    return 'serie-magnitude';
  }

  function dica(componente, ponto) {
    return escapar(ponto.rotulo) + ': '
      + escapar(numero(ponto.valor, componente.unidade))
      + (componente.agregacao === 'contagem' ? ' caso(s)'
        : ' · ' + ponto.casos + ' caso(s)');
  }

  function desenharPizza(componente) {
    var total = componente.pontos.reduce(function (soma, ponto) {
      return soma + ponto.valor;
    }, 0);
    if (!total) return '<p class="grafico-vazio">Tudo zerado no período.</p>';

    var centro = 92;
    var raio = 76;
    var buraco = 46;
    var anguloAtual = -Math.PI / 2;

    var fatias = componente.pontos.map(function (ponto) {
      var fracao = ponto.valor / total;
      var angulo = fracao * Math.PI * 2;
      var caminho = arcoDaRosca(centro, centro, raio, buraco, anguloAtual,
        anguloAtual + angulo);
      anguloAtual += angulo;

      return '<path d="' + caminho + '" class="fatia ' + classeDoPonto(ponto) + '"'
        + ' data-ponto="' + escapar(ponto.chave) + '"'
        + ' data-dica="' + dica(componente, ponto) + '"'
        + ' tabindex="0" role="button"'
        + ' aria-label="' + dica(componente, ponto) + '"></path>';
    }).join('');

    var legenda = componente.pontos.map(function (ponto) {
      return '<button type="button" class="legenda-item" data-ponto="'
        + escapar(ponto.chave) + '">'
        + '<span class="marca ' + classeDoPonto(ponto) + '"></span>'
        + '<span class="nome">' + escapar(ponto.rotulo) + '</span>'
        + '<span class="valor">' + escapar(numero(ponto.valor, componente.unidade))
        + '<em>' + porcento(ponto.valor, total) + '</em></span></button>';
    }).join('');

    return '<div class="grafico-corpo pizza">'
      + '<svg viewBox="0 0 184 184" class="desenho" role="img"'
      + ' aria-label="' + escapar(componente.titulo) + '">'
      + fatias
      + '<text x="92" y="86" class="rosca-numero">' + total + '</text>'
      + '<text x="92" y="104" class="rosca-rotulo">no total</text>'
      + '</svg>'
      + '<div class="legenda">' + legenda + '</div></div>';
  }

  function arcoDaRosca(cx, cy, raio, buraco, de, ate) {

    if (ate - de >= Math.PI * 2) ate = de + Math.PI * 2 - 0.001;

    var grande = (ate - de) > Math.PI ? 1 : 0;
    var x1 = cx + raio * Math.cos(de), y1 = cy + raio * Math.sin(de);
    var x2 = cx + raio * Math.cos(ate), y2 = cy + raio * Math.sin(ate);
    var x3 = cx + buraco * Math.cos(ate), y3 = cy + buraco * Math.sin(ate);
    var x4 = cx + buraco * Math.cos(de), y4 = cy + buraco * Math.sin(de);

    return 'M ' + x1.toFixed(2) + ' ' + y1.toFixed(2)
      + ' A ' + raio + ' ' + raio + ' 0 ' + grande + ' 1 '
      + x2.toFixed(2) + ' ' + y2.toFixed(2)
      + ' L ' + x3.toFixed(2) + ' ' + y3.toFixed(2)
      + ' A ' + buraco + ' ' + buraco + ' 0 ' + grande + ' 0 '
      + x4.toFixed(2) + ' ' + y4.toFixed(2) + ' Z';
  }

  function desenharBarras(componente) {
    var maior = maiorValor(componente.pontos);
    var largura = larguraDoDesenho(componente);
    var altura = 240;
    var pe = 46;
    var topo = 22;
    var faixa = largura / componente.pontos.length;
    var grossura = Math.min(faixa - 10, 64);

    var barras = componente.pontos.map(function (ponto, i) {
      var alto = maior ? (ponto.valor / maior) * (altura - pe - topo) : 0;
      var x = i * faixa + (faixa - grossura) / 2;
      var y = altura - pe - alto;

      return '<g class="barra ' + classeDoPonto(ponto) + '"'
        + ' data-ponto="' + escapar(ponto.chave) + '"'
        + ' data-dica="' + dica(componente, ponto) + '"'
        + ' tabindex="0" role="button"'
        + ' aria-label="' + dica(componente, ponto) + '">'
        + '<rect x="' + x.toFixed(1) + '" y="' + y.toFixed(1) + '"'
        + ' width="' + grossura.toFixed(1) + '" height="'
        + Math.max(alto, 2).toFixed(1) + '" rx="4"></rect>'
        + '<text x="' + (x + grossura / 2).toFixed(1) + '" y="'
        + (y - 7).toFixed(1) + '" class="valor-da-barra">'
        + escapar(numero(ponto.valor, componente.unidade)) + '</text>'
        + '<text x="' + (x + grossura / 2).toFixed(1) + '" y="'
        + (altura - pe + 18) + '" class="rotulo-da-barra">'
        + escapar(encurtar(ponto.rotulo, 14)) + '</text>'
        + '</g>';
    }).join('');

    return '<div class="grafico-corpo">'
      + '<svg viewBox="0 0 ' + largura + ' ' + altura + '" class="desenho"'
      + ' role="img" aria-label="' + escapar(componente.titulo) + '">'
      + '<line x1="0" y1="' + (altura - pe) + '" x2="' + largura + '" y2="'
      + (altura - pe) + '" class="regua"></line>'
      + barras + '</svg></div>';
  }

  function desenharBarrasDeitadas(componente) {
    var maior = maiorValor(componente.pontos);
    var largura = larguraDoDesenho(componente);
    var alturaDaLinha = 34;
    var altura = componente.pontos.length * alturaDaLinha + 8;
    var areaDoRotulo = componente.largura === 2 ? 240 : 152;
    var areaDoValor = 62;
    var comprimentoMaximo = largura - areaDoRotulo - areaDoValor;

    var barras = componente.pontos.map(function (ponto, i) {
      var comprimento = maior ? (ponto.valor / maior) * comprimentoMaximo : 0;
      var y = i * alturaDaLinha + 8;

      return '<g class="barra deitada ' + classeDoPonto(ponto) + '"'
        + ' data-ponto="' + escapar(ponto.chave) + '"'
        + ' data-dica="' + dica(componente, ponto) + '"'
        + ' tabindex="0" role="button"'
        + ' aria-label="' + dica(componente, ponto) + '">'
        + '<text x="' + (areaDoRotulo - 10) + '" y="' + (y + 14)
        + '" class="rotulo-deitado">'
        + escapar(encurtar(ponto.rotulo, componente.largura === 2 ? 38 : 22))
        + '</text>'
        + '<rect x="' + areaDoRotulo + '" y="' + y + '" width="'
        + Math.max(comprimento, 2).toFixed(1) + '" height="18" rx="4"></rect>'
        + '<text x="' + (areaDoRotulo + Math.max(comprimento, 2) + 8).toFixed(1)
        + '" y="' + (y + 14) + '" class="valor-deitado">'
        + escapar(numero(ponto.valor, componente.unidade)) + '</text>'
        + '</g>';
    }).join('');

    return '<div class="grafico-corpo">'
      + '<svg viewBox="0 0 ' + largura + ' ' + altura + '" class="desenho"'
      + ' role="img" aria-label="' + escapar(componente.titulo) + '">'
      + barras + '</svg></div>';
  }

  function desenharLinha(componente, comBarras) {
    var pontos = componente.pontos;
    var maior = maiorValor(pontos);
    var largura = larguraDoDesenho(componente);
    var altura = componente.largura === 2 ? 300 : 240;
    var pe = 40;
    var topo = 20;
    var faixa = pontos.length > 1 ? largura / pontos.length : largura;

    function xDe(i) { return i * faixa + faixa / 2; }
    function yDe(valor) {
      return altura - pe - (maior ? (valor / maior) * (altura - pe - topo) : 0);
    }

    var barras = '';
    if (comBarras) {
      var grossura = Math.min(faixa - 6, 34);
      barras = pontos.map(function (ponto, i) {
        var y = yDe(ponto.valor);
        return '<rect class="barra-de-fundo" x="'
          + (xDe(i) - grossura / 2).toFixed(1) + '" y="' + y.toFixed(1)
          + '" width="' + grossura.toFixed(1) + '" height="'
          + Math.max(altura - pe - y, 2).toFixed(1) + '" rx="4"></rect>';
      }).join('');
    }

    var serie = comBarras ? componente.tendencia : pontos;
    var caminho = serie.map(function (ponto, i) {
      return (i ? 'L' : 'M') + xDe(i).toFixed(1) + ' ' + yDe(ponto.valor).toFixed(1);
    }).join(' ');

    var deQuantosEm = Math.max(1, Math.ceil(pontos.length / 8));
    var ultimo = pontos.length - 1;

    var cabeOUltimo = (ultimo % deQuantosEm) === 0
      || (ultimo - (ultimo - (ultimo % deQuantosEm))) >= deQuantosEm / 2;
    var rotulos = pontos.map(function (ponto, i) {
      if (i % deQuantosEm !== 0 && !(i === ultimo && cabeOUltimo)) return '';
      return '<text x="' + xDe(i).toFixed(1) + '" y="' + (altura - pe + 18)
        + '" class="rotulo-da-barra">' + escapar(ponto.rotulo) + '</text>';
    }).join('');

    var marcas = pontos.map(function (ponto, i) {
      return '<g class="ponto-da-linha" data-ponto="' + escapar(ponto.chave) + '"'
        + ' data-dica="' + dica(componente, ponto) + '"'
        + ' tabindex="0" role="button"'
        + ' aria-label="' + dica(componente, ponto) + '">'

        + '<rect class="alvo" x="' + (xDe(i) - faixa / 2).toFixed(1) + '" y="0"'
        + ' width="' + faixa.toFixed(1) + '" height="' + (altura - pe) + '"></rect>'
        + '<circle cx="' + xDe(i).toFixed(1) + '" cy="'
        + yDe(ponto.valor).toFixed(1) + '" r="5" class="marcador"></circle>'
        + '</g>';
    }).join('');

    return '<div class="grafico-corpo">'
      + '<svg viewBox="0 0 ' + largura + ' ' + altura + '" class="desenho"'
      + ' role="img" aria-label="' + escapar(componente.titulo) + '">'
      + '<line x1="0" y1="' + (altura - pe) + '" x2="' + largura + '" y2="'
      + (altura - pe) + '" class="regua"></line>'
      + barras
      + '<path d="' + caminho + '" class="linha-do-grafico"></path>'
      + marcas + rotulos + '</svg>'
      + (comBarras
        ? '<p class="grafico-legenda-linha">As barras são o dia; a linha é a '
          + '<strong>média dos 7 dias anteriores</strong>, na mesma escala — '
          + 'ela mostra a tendência por cima do sobe e desce do dia a dia.</p>'
        : '')
      + '</div>';
  }

  function larguraDoDesenho(componente) {
    return componente.largura === 2 ? 960 : 480;
  }

  function maiorValor(pontos) {
    return pontos.reduce(function (maior, ponto) {
      return Math.max(maior, ponto.valor);
    }, 0);
  }

  function encurtar(texto, quantos) {
    var limpo = String(texto || '');
    return limpo.length > quantos ? limpo.substring(0, quantos - 1) + '…' : limpo;
  }

  function desenhar(componente) {
    if (componente.aviso) {
      return '<p class="grafico-aviso">' + escapar(componente.aviso) + '</p>';
    }
    if (!componente.pontos || !componente.pontos.length) {
      return '<p class="grafico-vazio">Nenhum caso no período para somar aqui.</p>';
    }
    if (componente.tipo === 'pizza') return desenharPizza(componente);
    if (componente.tipo === 'barrasDeitadas') return desenharBarrasDeitadas(componente);
    if (componente.tipo === 'linha') return desenharLinha(componente, false);
    if (componente.tipo === 'barrasComLinha') return desenharLinha(componente, true);
    return desenharBarras(componente);
  }

  function tabela(componente) {
    return '<div class="rolagem-tabela"><table class="fila numeros">'
      + '<thead><tr><th>' + escapar(componente.dimensao || 'Item') + '</th>'
      + '<th class="direita">' + (componente.agregacao === 'contagem'
        ? 'Casos' : escapar(componente.medida || 'Valor')) + '</th>'
      + '<th class="direita">Casos</th></tr></thead><tbody>'
      + componente.pontos.map(function (ponto) {
        return '<tr><td>' + escapar(ponto.rotulo) + '</td>'
          + '<td class="direita">' + escapar(numero(ponto.valor, componente.unidade))
          + '</td><td class="direita">' + ponto.casos + '</td></tr>';
      }).join('')
      + '</tbody>' + rodapeComTotal(componente) + '</table></div>';
  }

  function rodapeComTotal(componente) {
    if (componente.agregacao === 'media') return '';
    if (!componente.pontos.length) return '';

    var total = componente.pontos.reduce(function (soma, ponto) {
      return soma + ponto.valor;
    }, 0);
    var casos = componente.pontos.reduce(function (soma, ponto) {
      return soma + ponto.casos;
    }, 0);

    return '<tfoot><tr><td><strong>Total</strong></td>'
      + '<td class="direita"><strong>'
      + escapar(numero(total, componente.unidade)) + '</strong></td>'
      + '<td class="direita"><strong>' + casos + '</strong></td></tr></tfoot>';
  }

  function ligarDica(raiz) {
    var dicaNaTela = document.querySelector('.dica-do-grafico');
    if (!dicaNaTela) {
      dicaNaTela = document.createElement('div');
      dicaNaTela.className = 'dica-do-grafico';
      dicaNaTela.hidden = true;
      document.body.appendChild(dicaNaTela);
    }

    var comDica = (raiz || document).querySelectorAll('[data-dica]');
    for (var i = 0; i < comDica.length; i++) {
      comDica[i].addEventListener('mouseenter', function (evento) {
        dicaNaTela.innerHTML = this.getAttribute('data-dica');
        dicaNaTela.hidden = false;
        posicionarDica(dicaNaTela, evento);
      });
      comDica[i].addEventListener('mousemove', function (evento) {
        posicionarDica(dicaNaTela, evento);
      });
      comDica[i].addEventListener('mouseleave', function () {
        dicaNaTela.hidden = true;
      });

      comDica[i].addEventListener('focus', function () {
        dicaNaTela.innerHTML = this.getAttribute('data-dica');
        dicaNaTela.hidden = false;
        var caixa = this.getBoundingClientRect();
        dicaNaTela.style.left = (caixa.left + caixa.width / 2) + 'px';
        dicaNaTela.style.top = (caixa.top - 10) + 'px';
      });
      comDica[i].addEventListener('blur', function () { dicaNaTela.hidden = true; });
    }
  }

  function posicionarDica(dicaNaTela, evento) {
