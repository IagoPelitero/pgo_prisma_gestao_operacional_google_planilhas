          + '<td><input type="search" class="filtro procurar-coluna" data-procurar-coluna="' + i + '"'
          + ' placeholder="Digite para procurar a coluna" aria-label="Procurar a coluna para '
          + escapar(par.daFonte || '(sem nome)') + '">'
          + '<select class="filtro" data-depara="' + i + '">'
          + opcoesDeColuna(par.paraAColuna, '') + '</select>'
          + (par.lembrado ? '<span class="config-dica">como na última importação</span>' : '')
          + '</td></tr>';
      }).join('')
      + '</tbody></table>'
      + (algumCarimboEscolhido(atual)
        ? '<p class="config-dica aviso-de-carimbo">Você apontou a origem para '
          + 'uma coluna de <strong>controle de produtividade</strong>. É o certo '
          + 'quando a base antiga guarda a data de verdade do contato — e é '
          + 'assim que esses casos passam a contar em "Já contatados". Confira '
          + 'nas três linhas traduzidas abaixo se a data chegou certa.</p>'
        : '');
  }

  function opcoesDeColuna(escolhida, termo) {
    var procurado = normalizarTexto(termo);
    var colunas = opcoes.colunasDoCanal.slice().sort(function (uma, outra) {
      return normalizarTexto(uma).localeCompare(normalizarTexto(outra));
    }).filter(function (coluna) {
      return !procurado || coluna === escolhida || normalizarTexto(coluna).indexOf(procurado) >= 0;
    });
    return ['<option value="">— não trazer —</option>'].concat(colunas.map(function (coluna) {
      return '<option value="' + escapar(coluna) + '"'
        + (escolhida === coluna ? ' selected' : '') + '>'
        + escapar(coluna)

        + (ehCarimbo(coluna) ? '  (controle de produtividade)' : '')
        + '</option>';
    })).join('');
  }

  function normalizarTexto(texto) {
    return String(texto === null || texto === undefined ? '' : texto)
      .normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase().trim();
  }

  function ehCarimbo(coluna) {
    return (opcoes.colunasDeCarimbo || []).indexOf(coluna) >= 0;
  }

  function algumCarimboEscolhido(dePara) {
    return dePara.some(function (par) { return ehCarimbo(par.paraAColuna); });
  }

  function desenharAmostra() {
    if (!laudo.amostra.length) {
      return '<p class="config-dica">Nenhuma linha entraria, então não há o que '
        + 'mostrar. Confira o de-para acima.</p>';
    }

    var colunas = [];
    laudo.amostra.forEach(function (caso) {
      Object.keys(caso).forEach(function (coluna) {
        if (colunas.indexOf(coluna) < 0) colunas.push(coluna);
      });
    });

    return '<h4 class="importacao-titulo">As primeiras linhas, como vão ficar</h4>'
      + '<div class="rolagem-tabela"><table class="fila"><thead><tr>'
      + colunas.map(function (c) { return '<th>' + escapar(c) + '</th>'; }).join('')
      + '</tr></thead><tbody>'
      + laudo.amostra.map(function (caso) {
        return '<tr>' + colunas.map(function (coluna) {
          return '<td>' + escapar(caso[coluna] === undefined ? '' : caso[coluna])
            + '</td>';
        }).join('') + '</tr>';
      }).join('')
      + '</tbody></table></div>';
  }

  function desenharDestinoDoChat() {
    return (laudo.faltando && laudo.faltando.length
      ? '<p class="aviso-janela">Ligue no de-para acima a coluna de: <strong>'
        + escapar(laudo.faltando.join(' e ')) + '</strong>. Sem a data não há como recortar '
        + 'o período, e sem o analista não há de quem somar.</p>' : '')
      + (laudo.analistasDesconhecidos && laudo.analistasDesconhecidos.length
        ? '<p class="config-dica aviso-de-carimbo">Estes nomes não estão no cadastro de usuários: '
          + '<strong>' + escapar(laudo.analistasDesconhecidos.slice(0, 10).join(', ')) + '</strong>'
          + (laudo.analistasDesconhecidos.length > 10
            ? ' e mais ' + (laudo.analistasDesconhecidos.length - 10) : '')
          + '. Eles entram, mas no gráfico "Atendidos por analista" aparecem separados de quem '
          + 'tem o nome cadastrado. Se for a mesma pessoa escrita de outro jeito, acerte o nome '
          + 'na planilha de origem antes de importar.</p>' : '')
      + (laudo.semDataOuAnalista
        ? '<p class="config-dica">' + laudo.semDataOuAnalista + ' linha(s) sem data ou sem '
          + 'analista ficam de fora.</p>' : '')
      + (laudo.tmoQueNaoENumero
        ? '<p class="config-dica aviso-de-carimbo">' + laudo.tmoQueNaoENumero + ' linha(s) '
          + 'com um TMO que não é número (em segundos, como 1.152). Elas entram, com o TMO em '
          + 'branco para você preencher.</p>' : '')
      + '<h4 class="importacao-titulo">Como se chama o lote</h4>'
      + '<div class="grade">' + caixaDoNomeDoLote('Chat de outubro') + '</div>';
  }

  function caixaDoNomeDoLote(exemplo) {
    return '<label class="campo largura-2"><span>Nome do lote</span>'
      + '<input type="text" id="nome-do-lote" value="' + escapar(nomeDoLote) + '"'
      + ' placeholder="' + escapar(exemplo) + '"'
      + (opcoes.lotes.length ? ' list="lotes-ja-usados"' : '') + '>'
      + (opcoes.lotes.length
        ? '<datalist id="lotes-ja-usados">' + opcoes.lotes.map(function (lote) {
          return '<option value="' + escapar(lote.origem) + '"></option>';
        }).join('') + '</datalist>'
        : '')
      + '</label>';
  }

  function desenharDestino() {
    if (ehChat()) return desenharDestinoDoChat();
    return '<h4 class="importacao-titulo">De quem são, e como se chama o lote</h4>'
      + '<div class="grade">'
      + caixaDoNomeDoLote('Base de inadimplentes Vida Presente')
      + '<label class="campo"><span>Não repetir o que já entrou, comparando por</span>'
      + '<select class="filtro" id="coluna-que-identifica">'
      + ['<option value="">— trazer tudo, mesmo repetido —</option>']

        .concat(opcoes.repeticaoPelaProposta
          ? ['<option value="@PROPOSTA_NO_MES"'
            + (colunaQueIdentifica === '@PROPOSTA_NO_MES' ? ' selected' : '')
            + '>Proposta no mesmo mês</option>']
          : [])
        .concat(opcoes.colunasDoCanal.map(function (coluna) {
          return '<option value="' + escapar(coluna) + '"'
            + (colunaQueIdentifica === coluna ? ' selected' : '') + '>'
            + escapar(coluna) + '</option>';
        })).join('')
      + '</select></label>'
      + '</div>'
      + '<p class="config-dica">A base é atualizada toda semana e boa parte dela '
      + 'repete. Escolhendo uma coluna que identifica o caso — o CPF, o número da '
      + 'proposta — o que já está dentro é pulado, e o laudo diz quantos.'
      + (opcoes.repeticaoPelaProposta
        ? ' Aqui já vem marcada a <strong>proposta no mesmo mês</strong>: a mesma '
          + 'proposta (código e número), já cadastrada no mês do caso ou repetida '
          + 'no arquivo, não entra na divisão.'
        : '')
      + '</p>'
      + desenharAnalistas()
      + escolhaDoStatusDoLote()
      + escolhaDaDataDeRecepcao();
  }

  function escolhaDoStatusDoLote() {
    var lista = opcoes.statusDoCanal || [];
    if (!lista.length) return '';
    var vale = statusQueVale();
    return '<div class="grade"><label class="campo">'
      + '<span>Status dos casos importados</span>'
      + '<select class="filtro" id="status-do-lote">'
      + '<option value=""' + (vale === '' ? ' selected' : '') + '>— sem status —</option>'
      + lista.map(function (status) {
        return '<option value="' + escapar(status.valor) + '"'
          + (status.valor === vale ? ' selected' : '') + '>' + escapar(status.rotulo) + '</option>';
      }).join('') + '</select></label></div>'
      + '<p class="config-dica">' + (vale
        ? 'Os casos sem status na planilha vão nascer em <strong>' + escapar(vale)
          + '</strong>; os que trazem o status numa coluna ligada acima ficam com o deles. '
          + 'A importação não carimba data: o caso é antigo, e a data de hoje diria que o '
          + 'contato foi hoje. O analista ajusta depois, caso a caso.'
        : 'Os casos sem status na planilha vão nascer <strong>sem status</strong>.'
          + (opcoes.statusQueEsperaAPessoa ? ' O prazo só começa quando alguém puser o caso '
            + 'em <strong>' + escapar(opcoes.statusQueEsperaAPessoa) + '</strong> — é aí que '
            + 'o sistema anota a data.' : ''))
      + '</p>';
  }

  function escolhaDaDataDeRecepcao() {
    var coluna = opcoes.dataDeRecepcao;
    if (!coluna) return '';
    return '<div class="grade"><label class="campo">'
      + '<span>' + escapar(coluna.charAt(0).toUpperCase() + coluna.slice(1)) + '</span>'
      + '<select class="filtro" id="data-de-recepcao">'
      + '<option value="planilha"' + (dataDeRecepcao === 'planilha' ? ' selected' : '')
      + '>A da planilha (sem data, fica a de hoje)</option>'
      + '<option value="hoje"' + (dataDeRecepcao === 'hoje' ? ' selected' : '')
      + '>A data de hoje, para todos os casos</option>'
      + '</select></label></div>'
      + '<p class="config-dica">' + (dataDeRecepcao === 'hoje'
        ? 'Todos os casos vão entrar com a data de hoje, mesmo os que trazem data na planilha.'
        : 'Vale a data que a planilha trouxer; o caso que vier sem data entra com a de hoje.')
      + '</p>';
  }

  function quemEstaFora() {
    return (opcoes && opcoes.foraDaDivisao) || [];
  }

  function desenharQuemEstaFora() {
    var fora = quemEstaFora();
    if (!fora.length) return '';

    return '<p class="config-dica">Fora da divisão hoje: '
      + fora.map(function (pessoa) {
        return '<strong>' + escapar(pessoa.nome) + '</strong> — '
          + escapar(pessoa.porque);
      }).join('; ')
      + '. Continuam com acesso ao sistema; só não recebem lote. '
      + 'Isso se ajusta em Configurações › Usuários.</p>';
  }

  function desenharAnalistas() {
    if (!opcoes.analistas.length) {

      return '<p class="config-dica">' + (quemEstaFora().length
        ? 'Todo mundo deste canal está fora da divisão hoje ('
          + escapar(quemEstaFora().map(function (p) {
            return p.nome + ' — ' + p.porque;
          }).join('; ')) + '). Os casos entram sem responsável. Ajuste a '
          + 'disponibilidade em Configurações › Usuários.'
        : 'Ninguém deste canal está cadastrado e disponível, então os casos '
          + 'entram sem responsável. Em Configurações › Usuários, escolha o '
          + 'CANAL de cada analista — a divisão é só entre quem é do canal '
          + 'que você escolheu aqui em cima.') + '</p>';
    }

    var quantos = Object.keys(analistasMarcados).filter(function (nome) {
      return analistasMarcados[nome];
    }).length;

    return '<h4 class="importacao-titulo">Dividir entre</h4>'
      + '<div class="config-marcadores">'
      + opcoes.analistas.map(function (pessoa) {
        return '<label class="config-chave">'
          + '<input type="checkbox"'
          + ' data-analista="' + escapar(pessoa.nome) + '"'
          + (analistasMarcados[pessoa.nome] ? ' checked' : '') + '>'
          + '<span>' + escapar(pessoa.nome) + '</span></label>';
      }).join('')
      + '</div>'
      + desenharQuemEstaFora()
      + '<p class="config-dica">'
      + (quantos
        ? 'Os casos vão ser divididos em partes iguais entre os ' + quantos
          + ' marcado(s), em rodízio.'
        : 'Ninguém marcado: o responsável vai ser o que vier na planilha de '
          + 'origem, se ela trouxer um.')
      + '</p>';
  }

  function emReais(valor) {
    var numero = Number(valor) || 0;
    return 'R$ ' + numero.toFixed(2).replace('.', ',').replace(/\B(?=(\d{3})+(?!\d))/g, '.');
  }

  function porQueRepetem(motivos, verbo) {
    if (!motivos || !motivos.repetida) return '';
    var oQue = motivos.pelaProposta ? 'proposta(s)' : 'caso(s)';
    var lista = function (itens, total) {
      return itens.length ? ': <strong>' + escapar(itens.join(', ')) + '</strong>'
        + (total > itens.length ? ' e mais ' + (total - itens.length) : '') : '';
    };
    return (motivos.jaNoPgo
      ? '<p class="config-dica aviso-de-carimbo">' + motivos.jaNoPgo + ' ' + oQue + ' ' + verbo
        + ' porque <strong>já estão no PGO</strong>' + (motivos.mes ? ' em ' + escapar(motivos.mes) : '')
        + lista(motivos.listaNoPgo || [], motivos.jaNoPgo) + '.</p>' : '')
      + (motivos.repetidaNoArquivo
        ? '<p class="config-dica aviso-de-carimbo">' + motivos.repetidaNoArquivo + ' ' + oQue + ' '
          + verbo + ' porque <strong>se repetem na própria planilha</strong> (entra só a primeira)'
          + lista(motivos.listaNoArquivo || [], motivos.repetidaNoArquivo) + '.</p>' : '');
  }

  function desenharResultado() {
    return '<section class="cartaa importação-passo">'
      + '<header class="grafico-cabeca"><h3>Importado</h3></header>'
      + '<div class="cartoes">'
      + '<div class="indicador tom-bom"><span class="rotulo">'
      + (ehChat() ? 'Atendimentos que entraram' : 'Casos que entraram')
      + '</span><strong class="numero">' + resultado.entraram + '</strong></div>'
      + (resultado.pulados.repetida
        ? '<div class="indicador tom-atencao"><span class="rotulo">Repetidas, ficaram de fora'
          + '</span><strong class="numero">' + resultado.pulados.repetida
          + '</strong></div>'
        : '')
      + (resultado.premios || []).map(function (premio) {
        return '<div class="indicador tom-neutro"><span class="rotulo">' + escapar(premio.rotulo)
          + ' importado</span><strong class="numero">' + emReais(premio.total) + '</strong></div>';
      }).join('')
      + (resultado.pulados.vazia
        ? '<div class="indicador tom-neutro"><span class="rotulo">Linhas em branco'
          + '</span><strong class="numero">' + resultado.pulados.vazia
          + '</strong></div>'
        : '')
      + '</div>'
      + porQueRepetem(resultado.pulados, 'ficaram de fora')
      + '<p>Lote <strong>' + escapar(resultado.origem) + '</strong>, em '
      + escapar(resultado.canal) + '.'
      + (resultado.primeiroId
        ? ' Do caso ' + escapar(resultado.primeiroId) + ' ao '
          + escapar(resultado.ultimoId) + '.'
        : '')
      + '</p>'
      + (resultado.analistas.length
        ? '<p class="config-dica">Divididos entre: '
          + escapar(resultado.analistas.join(', ')) + '.</p>'
        : '')
      + (ehChat()
        ? '<p class="config-dica">A Produtividade da Mesa já soma estes atendimentos aos casos '
          + 'do sistema, na aba "Atendidos".</p>'
        : '<p class="config-dica">A Produtividade RECC já mostra este lote no '
          + 'gráfico de casos importados por dia.</p>')
      + '<div class="config-acoes">'
      + '<button type="button" class="botao" id="importar-outro-lote">'
      + 'Importar outro lote</button></div>'
      + '</section>';
  }

  function ligar() {
    SeletorDeCanal.ligar(function (id) {
      canalEscolhido = id;
      fonte = { tipo: fonte.tipo, texto: '', planilhaId: '', aba: '' };
      analistasMarcados = {};
      colunaQueIdentifica = null;
      nomeDoLote = '';
      statusDoLote = null;
      dataDeRecepcao = 'planilha';
      desenharSeletor();
      carregar();
    });

    cliques('[data-o-que-importar]', function (botao) {
      var escolha = botao.getAttribute('data-o-que-importar');
      if (escolha === oQueImportar) return;
      guardarOQueEstaNaTela();
      oQueImportar = escolha;
      nomeDoLote = '';
      carregar();
    });

    cliques('[data-fonte]', function (botao) {
      fonte.tipo = botao.getAttribute('data-fonte');
      laudo = null;
      guardarOQueEstaNaTela();
      desenhar();
    });

    cliques('#conferir-importacao', conferir);
    cliques('#importar-agora', importar);

    cliques('#recomecar-do-laudo, #importar-outro-lote', function () {
      laudo = null;
      resultado = null;
      deParaEscolhido = null;
      desenhar();
    });

    mudancas('[data-depara]', escolherColuna);

    var buscas = document.querySelectorAll('#importacao [data-procurar-coluna]');
    for (var b = 0; b < buscas.length; b++) {
      buscas[b].addEventListener('input', function () {
        var seletor = document.querySelector('#importacao [data-depara="'
          + this.getAttribute('data-procurar-coluna') + '"]');
        if (!seletor) return;
        seletor.innerHTML = opcoesDeColuna(seletor.value, this.value);
        var achadas = Array.prototype.filter.call(seletor.options, function (opcao) {
          return opcao.value !== '';
        });
        if (this.value.trim() && achadas.length === 1 && seletor.value !== achadas[0].value) {
          seletor.value = achadas[0].value;
          escolherColuna(seletor);
        }
      });
    }

    mudancas('[data-analista]', function (caixa) {
      analistasMarcados[caixa.getAttribute('data-analista')] = caixa.checked;

      guardarOQueEstaNaTela();
    });

    mudancas('#coluna-que-identifica', function (caixa) {
      colunaQueIdentifica = caixa.value;
    });

    mudancas('#status-do-lote', function () {
      guardarOQueEstaNaTela();
      desenhar();
    });
    mudancas('#data-de-recepcao', function () {
      guardarOQueEstaNaTela();
      desenhar();
    });
  }

  function escolherColuna(caixa) {
    if (!deParaEscolhido) {
      deParaEscolhido = laudo.dePara.map(function (par) {
        return { daFonte: par.daFonte, paraAColuna: par.paraAColuna, lembrado: par.lembrado === true };
      });
    }
    var par = deParaEscolhido[Number(caixa.getAttribute('data-depara'))];
    par.paraAColuna = caixa.value;
    par.lembrado = false;
  }

  function desenharSeletor() {
    var antigo = document.querySelector('.canais');
    if (!antigo || !antigo.parentNode) return;
    var novo = document.createElement('div');
    novo.innerHTML = SeletorDeCanal.montar(pacoteDoSistema.canais, canalEscolhido);
    antigo.parentNode.replaceChild(novo.firstChild, antigo);
  }

  function cliques(seletor, oQueFazer) {
    var achados = document.querySelectorAll('#importacao ' + seletor);
    for (var i = 0; i < achados.length; i++) {
      achados[i].addEventListener('click', function () { oQueFazer(this); });
    }
  }

  function mudancas(seletor, oQueFazer) {
    var achados = document.querySelectorAll('#importacao ' + seletor);
    for (var i = 0; i < achados.length; i++) {
      achados[i].addEventListener('change', function () { oQueFazer(this); });
    }
  }

  function guardarOQueEstaNaTela() {
    var colado = elemento('texto-colado');
    if (colado) fonte.texto = colado.value;

    var id = elemento('planilha-id');
    if (id) fonte.planilhaId = id.value.trim();

    var aba = elemento('planilha-aba');
    if (aba) fonte.aba = aba.value.trim();

    var lote = elemento('nome-do-lote');
    if (lote) nomeDoLote = lote.value;

    var chave = elemento('coluna-que-identifica');
    if (chave) colunaQueIdentifica = chave.value;

    var status = elemento('status-do-lote');
    if (status) statusDoLote = status.value;

    var recepcao = elemento('data-de-recepcao');
    if (recepcao) dataDeRecepcao = recepcao.value;
  }

  function statusQueVale() {
    return statusDoLote === null ? (opcoes.statusPadrao || '') : statusDoLote;
  }

  function conferir() {
    guardarOQueEstaNaTela();

    var botao = elemento('conferir-importacao');
    if (botao) { botao.disabled = true; botao.textContent = 'Conferindo…'; }

    var conferencia = ehChat()
      ? Servidor.chamarSemPressa('conferirImportacaoDoChat', { fonte: fonte, dePara: deParaEscolhido })
      : Servidor.chamarSemPressa('conferirImportacaoDeCasos', canalEscolhido, {
        fonte: fonte,
        dePara: deParaEscolhido,
        colunaQueIdentifica: colunaQueIdentifica || '',
        statusDoLote: statusQueVale(),
        dataDeRecepcao: opcoes.dataDeRecepcao ? dataDeRecepcao : ''
      });
    conferencia
      .entao(function (resposta) {
        laudo = resposta;
        envioDoLote = Servidor.novoEnvio();
        deParaEscolhido = null;
        desenhar();
        avisarDaConferencia();
      })
      .senao(function (erro) {
        if (botao) {
          botao.disabled = false;
          botao.textContent = 'Conferir antes de importar';
        }
        avisarDoErro('Não deu para conferir', erro);
      });
  }

  function avisosDaConferencia() {
    var avisos = [];
    var motivos = laudo.motivosParaPular || {};
    var deQue = motivos.pelaProposta ? 'proposta(s)' : oQue(false) + '(s)';

    if (!laudo.vaoEntrar) {
      avisos.push('<strong>Nenhum ' + oQue(false) + ' vai entrar.</strong> Confira o de-para e '
        + 'a origem antes de importar.');
    }
    if (laudo.passaDoLimite) {
      avisos.push('São <strong>' + laudo.linhasNaFonte + ' linhas</strong>, e o limite é '
        + laudo.limite + '. Divida em levas.');
    }
    if (motivos.jaNoPgo) {
      avisos.push('<strong>' + motivos.jaNoPgo + ' ' + deQue + '</strong> vão ficar de fora porque '
        + 'já estão no PGO' + (motivos.mes ? ' em ' + escapar(motivos.mes) : '') + '.');
    }
    if (motivos.repetidaNoArquivo) {
      avisos.push('<strong>' + motivos.repetidaNoArquivo + ' ' + deQue + '</strong> vão ficar de fora '
        + 'porque se repetem na própria planilha (entra só a primeira).');
    }
    if (motivos.vazia) {
      avisos.push('<strong>' + motivos.vazia + ' linha(s) em branco</strong> vão ser puladas.');
    }
    if (algumCarimboEscolhido(laudo.dePara || [])) {
      avisos.push('Você apontou uma coluna de <strong>controle de produtividade</strong>. Confira '
        + 'nas linhas traduzidas se a data chegou certa.');
    }
    if (laudo.faltando && laudo.faltando.length) {
      avisos.push('Falta ligar no de-para a coluna de: <strong>'
        + escapar(laudo.faltando.join(' e ')) + '</strong>.');
    }
    if (laudo.analistasDesconhecidos && laudo.analistasDesconhecidos.length) {
      avisos.push('<strong>' + laudo.analistasDesconhecidos.length + ' nome(s)</strong> não estão no '
        + 'cadastro de usuários: ' + escapar(laudo.analistasDesconhecidos.slice(0, 10).join(', '))
        + (laudo.analistasDesconhecidos.length > 10
          ? ' e mais ' + (laudo.analistasDesconhecidos.length - 10) : '') + '.');
    }
    if (laudo.semDataOuAnalista) {
      avisos.push('<strong>' + laudo.semDataOuAnalista + ' linha(s)</strong> sem data ou sem '
        + 'analista ficam de fora.');
    }
    if (laudo.tmoQueNaoENumero) {
      avisos.push('<strong>' + laudo.tmoQueNaoENumero + ' linha(s)</strong> com um TMO que não é '
        + 'número entram com o TMO em branco.');
    }
    return avisos;
  }

  function avisarDaConferencia() {
    var avisos = avisosDaConferencia();
    if (!avisos.length) return;
    Formulario.avisar({
      tom: 'atencao',
      titulo: avisos.length === 1 ? '1 ponto de atenção na conferência'
        : avisos.length + ' pontos de atenção na conferência',
      html: '<ul>' + avisos.map(function (aviso) { return '<li>' + aviso + '</li>'; }).join('')
        + '</ul><p>O detalhe de cada um está no laudo, abaixo.</p>',
      botao: 'Entendi'
    });
  }

  function avisarDoErro(titulo, erro) {
    Formulario.avisar({
      tom: 'ruim',
      titulo: titulo,
      html: '<p>' + escapar(erro && erro.message ? erro.message : String(erro)) + '</p>',
      botao: 'Entendi'
    });
  }

  function importar() {
    guardarOQueEstaNaTela();

    var escolhidos = Object.keys(analistasMarcados).filter(function (nome) {
      return analistasMarcados[nome];
    });

    Formulario.avisar({
      tom: 'destaque',
      titulo: 'Importar ' + laudo.vaoEntrar + ' ' + oQue(false) + '(s) em ' + laudo.canal.nome + '?',
      html: '<p>Desfazer isso é apagar as linhas uma a uma.</p>',
      botao: 'Importar ' + laudo.vaoEntrar + ' ' + oQue(false) + '(s)',
      aoConfirmar: function () { gravar(escolhidos); }
    });
  }

  function gravar(escolhidos) {
    var botao = elemento('importar-agora');
    if (botao) { botao.disabled = true; botao.textContent = 'Gravando…'; }

    var gravacao = ehChat()
      ? Servidor.chamarSemPressa('importarAtendimentosDoChat', {
        envio: envioDoLote,
        fonte: fonte,
        dePara: deParaEscolhido || laudo.dePara,
        origem: nomeDoLote
      })
      : Servidor.chamarSemPressa('importarCasos', canalEscolhido, {
        envio: envioDoLote,
        fonte: fonte,
        dePara: deParaEscolhido || laudo.dePara,
        colunaQueIdentifica: colunaQueIdentifica || '',
        analistas: escolhidos,
        origem: nomeDoLote,
        statusDoLote: statusQueVale(),
        dataDeRecepcao: opcoes.dataDeRecepcao ? dataDeRecepcao : ''
      });
    gravacao
      .entao(function (resposta) {
        resultado = resposta;
        laudo = null;
        desenhar();
      })
      .senao(function (erro) {
        if (botao) {
          botao.disabled = false;
          botao.textContent = 'Importar ' + laudo.vaoEntrar + ' ' + oQue(false) + '(s)';
        }
        avisarDoErro('Não deu para importar', erro);
      });
  }

  return {
    montar: montar,
    ligar: function () { carregar(); }
  };
})();
</script>


<!-- ==== Produtividade.html ==== -->
<script>

var TelaProdutividade = (function () {

  var canalEscolhido = '';
  var filtros = {};

  var periodo = SeletorDePeriodo.padrao();
  var painel = null;

  var abaDaMesa = 'equipe';

  var origemDosAtendidos = 'todos';
  var ramoDosAtendidos = 'total';

  var LUGAR_DO_DETALHE = '<div id="detalhe-do-painel"></div>';
  var tabelasAbertas = {};

  function escapar(texto) { return Moldura.escapar(texto); }
  function elemento(id) { return document.getElementById(id); }

  function montar(pacote) {
    if (!canalEscolhido && pacote.canais.length) canalEscolhido = pacote.canais[0].id;
    return SeletorDeCanal.montar(pacote.canais, canalEscolhido)
      + '<div id="analitico"><p class="carregando-campos">Somando os números…</p></div>';
  }

  function carregar() {
    var caixa = elemento('analitico');
    if (caixa) caixa.innerHTML = '<p class="carregando-campos">Somando os números…</p>';

    Servidor.chamar('produtividadeDaEquipe', canalEscolhido, filtros, periodo)
      .entao(function (resposta) {
        painel = resposta;
        desenhar();
      })
      .senao(function (erro) {
        elemento('analitico').innerHTML = '<p class="carregando-campos erro-carga">'
          + escapar(erro.message || String(erro)) + '</p>';
      });
  }

  function abasDaMesa() {
    if (!painel.atendimentos) return '';
    return '<div class="config-abas" role="tablist" aria-label="O que ver">'
      + [['equipe', 'Equipe'], ['atendidos', 'Atendidos (e-mail + chat)']].map(function (aba) {
        var atual = abaDaMesa === aba[0];
        return '<button type="button" role="tab" class="config-aba' + (atual ? ' atual' : '') + '"'
          + ' aria-selected="' + atual + '" data-aba-da-mesa="' + aba[0] + '">'
          + escapar(aba[1]) + '</button>';
      }).join('') + '</div>';
  }

  function desenhar() {

    if (painel.atendimentos && abaDaMesa === 'atendidos') {
      elemento('analitico').innerHTML = desenharFiltros() + abasDaMesa()
        + desenharAtendimentos() + LUGAR_DO_DETALHE;
      ligarPainel();
      return;
    }

    elemento('analitico').innerHTML = desenharFiltros()
      + abasDaMesa()
      + desenharCartoes()
      + desenharPremios()
      + desenharPrazos()
      + Moldura.avisoDeJanela(painel, 'Estes gráficos')
      + (painel.componentes.length
        ? '<div class="graficos">'
          + painel.componentes.map(desenharComponente).join('') + '</div>'
        : '<div class="cartao vazio"><strong>Nenhum gráfico configurado nesta '
          + 'canal.</strong><p>Um administrador monta os gráficos em '
          + 'Configurações › Painéis.</p></div>')

      + (painel.valorPorSituacao && !painel.premios
        ? '<div class="graficos">'
          + desenharValorPorSituacao(painel.valorPorSituacao) + '</div>'
        : '')
      + desenharTentativas()
      + desenharPorAnalista()
      + LUGAR_DO_DETALHE;
    ligarPainel();
  }

  function emReais(valor) {
    var numero = Number(valor) || 0;
    return 'R$ ' + numero.toFixed(2).replace('.', ',').replace(/\B(?=(\d{3})+(?!\d))/g, '.');
  }

  function desenharPremios() {
    var premios = painel.premios;
    if (!premios) return '';
    return '<div class="graficos"><section class="cartao grafico largura-2" data-premios="sim">'
      + '<header class="grafico-cabeca"><h3>' + escapar(premios.titulo) + '</h3></header>'
      + Graficos.desenhar(premios)
      + '<div class="rolagem-tabela"><table class="fila numeros">'
      + '<thead><tr><th>Prêmio</th><th class="direita">Valor</th>'
      + '<th class="direita">Casos com valor</th></tr></thead><tbody>'
      + premios.pontos.map(function (ponto) {
        return '<tr><td>' + escapar(ponto.rotulo) + '</td><td class="direita">'
          + emReais(ponto.valor) + '</td><td class="direita">' + ponto.casos + '</td></tr>';
      }).join('') + '</tbody></table></div>'
      + '</section></div>';
  }

  function comVirgula(numero) {
    return numero === null || numero === undefined ? '—' : String(numero).replace('.', ',');
  }

  function desenharTentativas() {
    var tentativas = painel.tentativas;
    if (!tentativas) return '';
    var porAnalista = tentativas.porAnalista.map(function (linha) {
      return '<tr><td>' + escapar(linha.analista) + '</td>'
        + '<td class="direita">' + linha.sucessos + '</td>'
        + linha.porContato.map(function (n) { return '<td class="direita">' + n + '</td>'; }).join('')
        + '<td class="direita">' + linha.semSucesso + '</td>'
        + '<td class="direita">' + comVirgula(linha.media) + '</td></tr>';
    }).join('');
    var porCpf = tentativas.porCpf.linhas.map(function (linha) {
      return '<tr><td>' + escapar(linha.cpf) + '</td><td>' + escapar(linha.cliente || '—') + '</td>'
        + '<td class="direita">' + linha.casos + '</td>'
        + '<td class="direita">' + linha.contatos + '</td>'
        + '<td>' + escapar(linha.desfecho) + '</td></tr>';
    }).join('');
    var notasDoCpf = [];
    if (tentativas.porCpf.total > tentativas.porCpf.linhas.length) {
      notasDoCpf.push('Mostrando os ' + tentativas.porCpf.linhas.length + ' CPFs com mais contatos, de '
        + tentativas.porCpf.total + '.');
    }
    if (tentativas.porCpf.semCpf) {
      notasDoCpf.push(tentativas.porCpf.semCpf + ' caso(s) sem CPF ficaram fora desta tabela.');
    }
    return '<section class="cartao tentativas" aria-labelledby="titulo-tentativas">'
      + '<header class="grafico-cabeca"><h3 id="titulo-tentativas">' + escapar(tentativas.titulo)
      + '</h3></header>'
      + '<p class="prazo-regra">Sucesso é Retido ou Não retido. As tentativas são a "Data do 1º '
      + 'contato" e a "Data do 2º contato"; a 3ª é o status "Sem sucesso de contato".</p>'
      + '<div class="cartoes">'
      + tileDePrazo('Sucessos', tentativas.sucessos, 'bom', 'Casos em Retido ou Não retido')
      + tileDePrazo('Contatos por sucesso', comVirgula(tentativas.media), 'neutro',
        'Em média, quantos contatos até falar com o cliente')
      + tileDePrazo('Sem sucesso', tentativas.semSucesso, tentativas.semSucesso ? 'atencao' : 'neutro',
        'Casos em "Sem sucesso de contato"')
      + tileDePrazo('Ainda tentando', tentativas.emAndamento, 'neutro',
        'Casos que ainda não chegaram a um desses desfechos')
      + '</div>'
      + Graficos.desenhar(tentativas.grafico)
      + (porAnalista
        ? '<h5 class="prazo-titulo">Por analista</h5>'
          + '<div class="rolagem-tabela"><table class="fila numeros"><thead><tr>'
          + '<th>Analista</th><th class="direita">Sucessos</th>'
          + tentativas.faixas.map(function (faixa) {
            return '<th class="direita">' + escapar(faixa) + '</th>';
          }).join('')
          + '<th class="direita">Sem sucesso</th><th class="direita">Contatos por sucesso</th>'
          + '</tr></thead><tbody>' + porAnalista + '</tbody></table></div>'
        : '')
      + (porCpf
        ? '<h5 class="prazo-titulo">Contatos por CPF</h5>'
          + '<div class="rolagem-tabela"><table class="fila numeros"><thead><tr>'
          + '<th>CPF</th><th>Cliente</th><th class="direita">Casos</th>'
          + '<th class="direita">Contatos</th><th>Desfecho</th>'
          + '</tr></thead><tbody>' + porCpf + '</tbody></table></div>'
        : '')
      + (notasDoCpf.length ? '<p class="prazo-regra">' + notasDoCpf.join(' ') + '</p>' : '')
      + '</section>';
  }

  function desenharPorAnalista() {
    var quadro = painel.porAnalista;
    if (!quadro || !quadro.linhas.length) return '';
    return '<section class="cartao por-analista" aria-labelledby="titulo-por-analista">'
      + '<header class="grafico-cabeca"><h3 id="titulo-por-analista">Produtividade por analista</h3></header>'
      + '<div class="rolagem-tabela"><table class="fila numeros">'
      + '<thead><tr><th>Analista</th><th class="direita">Casos</th>'
      + quadro.status.map(function (nome) {
        return '<th class="direita">' + escapar(nome) + '</th>';
      }).join('')
      + '<th class="direita">Prêmio anual</th><th class="direita">Prêmio mensal</th>'
      + '<th class="direita">Prêmio retido</th></tr></thead><tbody>'
      + quadro.linhas.map(function (linha) {
        return '<tr><td>' + escapar(linha.analista) + '</td><td class="direita">' + linha.total + '</td>'
          + linha.porStatus.map(function (n) { return '<td class="direita">' + n + '</td>'; }).join('')
          + '<td class="direita">' + emReais(linha.anual) + '</td>'
          + '<td class="direita">' + emReais(linha.mensal) + '</td>'
          + '<td class="direita">' + emReais(linha.retido) + '</td></tr>';
      }).join('')
      + '</tbody><tfoot><tr><td><strong>Total</strong></td><td class="direita"><strong>'
      + quadro.totais.total + '</strong></td>'
      + quadro.totais.porStatus.map(function (n) {
        return '<td class="direita"><strong>' + n + '</strong></td>';
      }).join('')
      + '<td class="direita"><strong>' + emReais(quadro.totais.anual) + '</strong></td>'
      + '<td class="direita"><strong>' + emReais(quadro.totais.mensal) + '</strong></td>'
      + '<td class="direita"><strong>' + emReais(quadro.totais.retido) + '</strong></td>'
      + '</tr></tfoot></table></div></section>';
  }

  function variacao(cartao) {
    if (cartao.variacao === null || cartao.variacao === undefined) {
      return '<span class="variacao vazia" aria-hidden="true">—</span>';
    }
    var subiu = cartao.variacao >= 0;
    return '<span class="variacao ' + (subiu ? 'subiu' : 'desceu') + '">'
      + (subiu ? '▲' : '▼') + ' ' + Math.abs(cartao.variacao) + '%'
      + '<em>vs. período anterior</em></span>';
  }

  function desenharCartoes() {
    if (!painel.cartoes || !painel.cartoes.length) return '';

    return '<div class="cartoes">'
      + painel.cartoes.map(function (cartao) {
        return '<div class="indicador tom-' + escapar(cartao.tom || 'neutro') + '"'
          + (cartao.explicacao ? ' title="' + escapar(cartao.explicacao) + '"' : '')
          + '><span class="rotulo">' + escapar(cartao.rotulo) + '</span>'
          + '<strong class="numero">' + cartao.valor + '</strong>'

          + (cartao.soma !== undefined
            ? '<span class="soma-do-cartao">' + escapar(emReais(cartao.soma)) + ' de '
              + escapar(cartao.rotuloDaSoma) + '</span>' : '')
          + variacao(cartao)
          + '</div>';
      }).join('')
      + '</div>';
  }

  function desenharPrazos() {
    var prazos = painel.prazos;
    if (!prazos) return '';

    var blocos = [];
    if (prazos.sla) blocos.push(blocoDoSla(prazos.sla));
    prazos.sinalizadores.forEach(function (sinalizador) {
      blocos.push(blocoDoSinalizador(sinalizador));
    });

    return '<section class="cartao prazos" aria-labelledby="titulo-dos-prazos">'
      + '<header class="origem-cabeca"><h3 id="titulo-dos-prazos">Controle de prazos</h3>'
      + '</header>' + blocos.join('') + '</section>';
  }

  function visaoDosAtendidos() {
    var atendidos = painel.atendimentos;
    var chave = origemDosAtendidos + '|' + ramoDosAtendidos;
    return (atendidos.visoes && atendidos.visoes[chave]) || atendidos;
  }

  function seletoresDosAtendidos() {
    function grupo(rotulo, atributo, atual, opcoes) {
      return '<div class="seletor-de-atendidos"><span class="rotulo">' + escapar(rotulo) + '</span>'
        + '<div class="config-abas" role="group" aria-label="' + escapar(rotulo) + '">'
        + opcoes.map(function (opcao) {
          return '<button type="button" class="config-aba' + (atual === opcao[0] ? ' atual' : '') + '"'
            + ' aria-pressed="' + (atual === opcao[0]) + '" ' + atributo + '="' + opcao[0] + '">'
            + escapar(opcao[1]) + '</button>';
        }).join('') + '</div></div>';
    }
    return grupo('Origem', 'data-origem-dos-atendidos', origemDosAtendidos,
        [['todos', 'Todos'], ['sistema', 'E-mail'], ['chat', 'Chat']])
      + grupo('Ramo', 'data-ramo-dos-atendidos', ramoDosAtendidos,
        [['total', 'Total'], ['vg', 'Vida em grupo'], ['vi', 'Vida individual']]);
  }

  function nomeDaVisaoDosAtendidos() {
    var origem = { todos: 'e-mail e chat', sistema: 'e-mail', chat: 'chat' }[origemDosAtendidos];
    var ramo = { total: 'todos os ramos', vg: 'Vida em grupo', vi: 'Vida individual' }[ramoDosAtendidos];
    return origem + ' · ' + ramo;
  }

  function desenharAtendimentos() {
    var atendidos = painel.atendimentos;
    if (!atendidos) return '';
    var chat = atendidos.chat;
    var visao = visaoDosAtendidos();

    var avisos = [];
    if (!chat.ligado) {
      avisos.push('Nenhum atendimento do chat foi importado ainda: estes números são só dos '
        + 'casos cadastrados no sistema (e-mail). Traga o chat pela tela de Importação — Mesa '
        + 'Diamante, "Atendimentos do chat".');
    } else if (chat.aviso) {
      avisos.push('Os atendimentos do chat não puderam ser lidos, e estes números são só do '
        + 'sistema: ' + chat.aviso);
    }
    if (chat.truncada) {
      avisos.push('Do chat entram só os últimos ' + chat.linhasLidas + ' atendimentos importados.');
    }
    if (chat.semData) {
      avisos.push(chat.semData + ' linha(s) do chat sem data legível ficaram de fora do período.');
    }
    avisos.push('E-mail são os casos cadastrados no sistema; chat, os atendimentos importados. '
      + 'Vale o período e o alcance desta tela; os filtros acima não mudam este bloco. '
      + 'O atendimento que estiver nas duas bases conta duas vezes.');

    var tiles = origemDosAtendidos === 'todos'
      ? tileDePrazo('Atendidos no total', visao.totais.total, 'destaque',
        'E-mail mais chat, no período')
        + tileDePrazo('E-mail', visao.totais.sistema, 'neutro',
          'Casos da Mesa Diamante cadastrados no sistema, no período')
        + tileDePrazo('Chat', visao.totais.chat, 'neutro',
          'Atendimentos do chat importados, no período')
      : tileDePrazo(origemDosAtendidos === 'sistema' ? 'Atendidos por e-mail' : 'Atendidos por chat',
        visao.totais.total, 'destaque', 'No período');

    return '<section class="cartao atendimentos" aria-labelledby="titulo-dos-atendidos">'
      + '<header class="origem-cabeca"><h3 id="titulo-dos-atendidos">'
      + 'Atendidos — ' + escapar(nomeDaVisaoDosAtendidos()) + '</h3></header>'
      + seletoresDosAtendidos()
      + '<div class="cartoes">' + tiles + '</div>'
      + avisos.map(function (aviso) {
        return '<p class="aviso-do-chat">' + escapar(aviso) + '</p>';
      }).join('')
      + '</section>'
      + '<div class="graficos">' + visao.graficos.map(desenharAtendidos).join('') + '</div>';
  }

  function desenharAtendidos(componente) {
    var vazio = !componente.pontos.length;
    return '<section class="cartao grafico largura-' + componente.largura + '">'
      + '<header class="grafico-cabeca"><h3>' + escapar(componente.titulo) + '</h3></header>'
      + Graficos.desenhar(componente)
      + (vazio ? '' : tabelaDeAtendidos(componente))
      + rodapeDosAtendidos(componente)
      + '</section>';
  }

  function tabelaDeAtendidos(componente) {
    var total = 0;
    var linhas = componente.pontos.map(function (ponto) {
      total += ponto.valor;
      return '<tr><td>' + escapar(ponto.rotulo) + '</td>'
        + '<td class="direita">' + ponto.valor + '</td></tr>';
    }).join('');
    return '<div class="rolagem-tabela"><table class="fila numeros de-atendidos">'
      + '<thead><tr><th>' + escapar(componente.dimensao) + '</th>'
      + '<th class="direita">Atendimentos</th></tr></thead><tbody>' + linhas + '</tbody>'
      + '<tfoot><tr><td><strong>Total</strong></td><td class="direita"><strong>' + total
      + '</strong></td></tr></tfoot></table></div>';
  }

  function rodapeDosAtendidos(componente) {
    var notas = [];
    if (componente.foraDoTopo) notas.push(soOsMaiores(componente));
    if (componente.semInformacao) {
      notas.push(componente.semInformacao + ' atendimento(s) sem esta informação não entram '
        + 'neste ranking.');
    }
    return notas.length ? '<p class="grafico-pe">' + notas.join(' ') + '</p>' : '';
  }

  function tileDePrazo(rotulo, numero, tom, dica) {
    return '<div class="indicador tom-' + escapar(tom) + '"'
      + (dica ? ' title="' + escapar(dica) + '"' : '') + '>'
      + '<span class="rotulo">' + escapar(rotulo) + '</span>'
      + '<strong class="numero">' + numero + '</strong></div>';
  }

  function blocoDoSla(sla) {
    var dentro = sla.noPrazo + sla.cumpridos;
    var fora = sla.fora + sla.estourados;
    return '<div class="prazo-bloco" data-prazo="sla">'
      + '<h4>' + escapar(sla.nome) + '</h4>'
      + '<p class="prazo-regra">Conta de segunda a sexta, no expediente, até a '
      + 'primeira resposta.</p>'
      + '<div class="cartoes">'
      + tileDePrazo('Dentro do SLA', dentro, 'bom',
        'Respondidos no prazo, mais os que ainda estão dentro dele')
      + tileDePrazo('Fora do SLA', fora, fora ? 'ruim' : 'neutro',
        'Passaram do prazo, respondidos ou não')
      + (sla.semConta ? tileDePrazo('Sem como contar', sla.semConta, 'neutro',
        'Casos sem data de entrada: o prazo não tem de onde começar') : '')
      + '</div>' + desenharQuemPassou(sla, 'Fora do SLA') + '</div>';
  }

  function blocoDoSinalizador(sinalizador) {
    return '<div class="prazo-bloco" data-prazo="' + escapar(sinalizador.id) + '">'
      + '<h4>' + escapar(sinalizador.nome) + '</h4>'
      + '<p class="prazo-regra">' + escapar(sinalizador.regra)
      + ' · de segunda a sexta, no expediente, até o status final.</p>'
      + '<div class="cartoes">'
      + tileDePrazo('No prazo', sinalizador.noPrazo, 'bom', 'Abertos, com folga')
      + tileDePrazo('Vencem em breve', sinalizador.atencao,
        sinalizador.atencao ? 'atencao' : 'neutro',
        'Abertos, no último dia do prazo')
      + tileDePrazo('Fora do prazo', sinalizador.fora, sinalizador.fora ? 'ruim' : 'neutro',
        'Abertos que já passaram do prazo')
      + tileDePrazo('Encerrados fora', sinalizador.estourados,
        sinalizador.estourados ? 'ruim' : 'neutro',
        'Chegaram ao status final depois do prazo')
      + tileDePrazo('Encerrados no prazo', sinalizador.cumpridos, 'bom',
        'Chegaram ao status final dentro do prazo')
      + '</div>' + desenharQuemPassou(sinalizador, 'Passaram do prazo') + '</div>';
  }

  function desenharQuemPassou(resumo, titulo) {
    if (!resumo.lista.length) {
      return '<p class="prazo-limpo">Nenhum caso passou do prazo neste período.</p>';
    }
    var analistas = resumo.porAnalista.map(function (um) {
      return '<li class="prazo-analista"><strong>' + escapar(um.analista) + '</strong>'
        + '<span>' + um.total + (um.total === 1 ? ' caso' : ' casos')
        + (um.fora && um.estourados
          ? ' (' + um.fora + ' em aberto, ' + um.estourados + ' encerrado'
            + (um.estourados === 1 ? '' : 's') + ')' : '') + '</span></li>';
    }).join('');

    var linhas = resumo.lista.map(function (caso) {
      return '<tr><td>' + escapar(caso.analista) + '</td>'
        + '<td><span class="principal">' + escapar(caso.caso) + '</span></td>'
        + '<td>' + escapar(caso.situacao || '—') + '</td>'
        + '<td>' + (caso.encerrado ? 'Encerrado' : 'Em aberto') + '</td>'
        + '<td class="direita">' + escapar(caso.alem) + '</td></tr>';
    }).join('');

    return '<h5 class="prazo-titulo">' + escapar(titulo) + ' · por analista</h5>'
      + '<ul class="prazo-analistas">' + analistas + '</ul>'
      + '<div class="rolagem-tabela"><table class="fila prazos-lista">'
      + '<thead><tr><th>Analista</th><th>Caso</th><th>Situação</th><th>Estado</th>'
      + '<th class="direita">Além do prazo</th></tr></thead>'
      + '<tbody>' + linhas + '</tbody></table></div>'
      + (resumo.maisCasos
        ? '<p class="prazo-regra">E mais ' + resumo.maisCasos + ' caso(s), do que '
          + 'passou menos do prazo. A lista mostra os mais atrasados.</p>' : '');
  }

  function desenharFiltros() {
    var caixas = painel.filtrosDisponiveis.map(function (filtro) {

      var opcoes = ['<option value="">' + escapar(filtro.rotulo) + '</option>'];
      filtro.opcoes.forEach(function (opcao) {
        opcoes.push('<option value="' + escapar(opcao.valor) + '"'
          + (filtros[filtro.chave] === opcao.valor ? ' selected' : '') + '>'
          + escapar(opcao.rotulo) + '</option>');
      });
      return '<select class="filtro" data-filtro="' + escapar(filtro.chave) + '"'
        + ' aria-label="Filtrar por ' + escapar(filtro.rotulo) + '">'
        + opcoes.join('') + '</select>';
    });

    return Moldura.caixaDeFiltros(
      SeletorDePeriodo.desenhar(painel) + caixas.join('')
        + Moldura.botaoLimparFiltros('limpar-filtros-da-produtividade'),
      painel.total + ' casos · ' + escapar(painel.periodo.rotulo));
  }

  function desenharComponente(componente) {
    return '<section class="cartao grafico largura-' + componente.largura + '"'
      + ' data-grafico="' + escapar(componente.id) + '">'
      + '<header class="grafico-cabeca">'
      + '<h3>' + escapar(componente.titulo) + '</h3>'
      + '<div class="grafico-acoes">'
      + '<button type="button" class="botao-texto" data-tabela="'
      + escapar(componente.id) + '">'
      + (tabelasAbertas[componente.id] ? 'Ver o gráfico' : 'Ver os números') + '</button>'
      + (painel.podeExportar
        ? '<button type="button" class="botao-texto" data-exportar="'
          + escapar(componente.id) + '">Exportar</button>' : '')
      + '</div></header>'
      + (tabelasAbertas[componente.id]
        ? Graficos.tabela(componente) : Graficos.desenhar(componente))
      + rodapeDoGrafico(componente)
      + '</section>';
  }

  function desenharValorPorSituacao(componente) {
    return '<section class="cartao grafico largura-2">'
      + '<header class="grafico-cabeca"><h3>' + escapar(componente.titulo)
      + '</h3></header>'
      + (componente.aviso
        ? '<p class="grafico-vazio">' + escapar(componente.aviso) + '</p>'
        : Graficos.desenhar(componente) + Graficos.tabela(componente))
      + '</section>';
  }

  function rodapeDoGrafico(componente) {
    if (componente.aviso || !componente.pontos.length) return '';
    return '<p class="grafico-pe">'
      + (componente.foraDoTopo ? soOsMaiores(componente) + ' ' : '')
      + 'Clique para ver os casos.</p>';
  }

  function soOsMaiores(componente) {
    return 'Só os ' + componente.pontos.length + ' maiores aparecem; a soma e as '
      + 'porcentagens são entre eles.';
  }

  function ligarPainel() {
    ligarCliques('[data-aba-da-mesa]', function (botao) {
      var escolhida = botao.getAttribute('data-aba-da-mesa');
      if (escolhida === abaDaMesa) return;
      abaDaMesa = escolhida;
      desenhar();
    });

    ligarCliques('[data-origem-dos-atendidos]', function (botao) {
      var escolhida = botao.getAttribute('data-origem-dos-atendidos');
      if (escolhida === origemDosAtendidos) return;
      origemDosAtendidos = escolhida;
      desenhar();
    });
    ligarCliques('[data-ramo-dos-atendidos]', function (botao) {
      var escolhido = botao.getAttribute('data-ramo-dos-atendidos');
      if (escolhido === ramoDosAtendidos) return;
      ramoDosAtendidos = escolhido;
      desenhar();
    });

    var limpar = elemento('limpar-filtros-da-produtividade');
    if (limpar) {
      limpar.addEventListener('click', function () {
        filtros = {};
        periodo = SeletorDePeriodo.padrao();
        origemDosAtendidos = 'todos';
        ramoDosAtendidos = 'total';
        carregar();
      });
    }

    var caixas = document.querySelectorAll('#analitico .filtro');
    for (var i = 0; i < caixas.length; i++) {
      caixas[i].addEventListener('change', function () {
        var novoPeriodo = SeletorDePeriodo.mudou(this, painel, 'analitico');
        if (novoPeriodo !== null) {

          if (novoPeriodo) { periodo = novoPeriodo; carregar(); }
          return;
        }
        filtros[this.getAttribute('data-filtro')] = this.value;
        carregar();
      });
    }

    ligarCliques('[data-tabela]', function (botao) {
      var id = botao.getAttribute('data-tabela');
      tabelasAbertas[id] = !tabelasAbertas[id];
      desenhar();
    });

    ligarCliques('[data-exportar]', function (botao) {
      exportar(botao.getAttribute('data-exportar'));
    });

    ligarCliques('[data-ponto]', function (elementoClicado) {
      var grafico = elementoClicado.closest('.grafico');
      if (!grafico) return;

      var id = grafico.getAttribute('data-grafico');
      if (!id) return;
      detalhar(id, elementoClicado.getAttribute('data-ponto'));
    });

    Graficos.ligarDica(elemento('analitico'));
  }

  function ligarCliques(seletor, oQueFazer) {
    var achados = document.querySelectorAll('#analitico ' + seletor);
    for (var i = 0; i < achados.length; i++) {
      achados[i].addEventListener('click', function () { oQueFazer(this); });
      achados[i].addEventListener('keydown', function (evento) {
        if (evento.key === 'Enter' || evento.key === ' ') {
          evento.preventDefault();
          oQueFazer(this);
        }
      });
    }
  }

  function detalhar(idDoComponente, chaveDoPonto, todos) {
    var caixa = elemento('detalhe-do-painel');
    caixa.innerHTML = '<p class="carregando-campos">Separando os casos…</p>';
    caixa.scrollIntoView({ behavior: 'smooth', block: 'nearest' });

    Servidor.chamar('detalharComponente', canalEscolhido, idDoComponente,
      chaveDoPonto, filtros, periodo, todos ? 'todos' : '')
      .entao(function (resposta) {

        if (resposta.filaCompacta) {
          resposta.casos = TelaTrabalho.expandirFila(resposta.casos, resposta.colunas);
        }
        desenharDetalhe(resposta, idDoComponente, chaveDoPonto);
      })
      .senao(function (erro) {
        caixa.innerHTML = '<p class="carregando-campos erro-carga">'
          + escapar(erro.message || String(erro)) + '</p>';
      });
  }

  function desenharDetalhe(detalhe, idDoComponente, chaveDoPonto) {
    var cabecalho = detalhe.colunas.map(function (grupo) {
      return '<th>' + escapar(grupo.titulo) + '</th>';
    }).join('') + '<th class="acoes-coluna">Ações</th>';

    var linhas = detalhe.casos.map(function (caso) {
      var celulas = caso.celulas.map(function (grupo, i) {
        return '<td>' + grupo.map(function (celula, j) {
          if (celula.ehStatus) {
            return '<span class="situacao tom-' + escapar(caso.tom || 'neutro')
              + '">' + escapar(celula.valor || '—') + '</span>';
          }

          return '<span class="' + ((j === 0 && i !== 0) ? 'principal' : 'apoio')
            + '" title="' + escapar(Moldura.dicaDaCelula(celula)) + '">'
            + escapar(celula.valor || '—') + '</span>';
        }).join('') + '</td>';
      }).join('');

      return '<tr>' + celulas + '<td class="acoes-coluna">'
        + (detalhe.podeEditar
          ? '<button type="button" class="acao" data-caso-do-painel="'
            + escapar(caso.id) + '">' + Moldura.icone('editar')
            + ' Trabalhar no caso</button>'
          : '')
        + '</td></tr>';
    }).join('');

    elemento('detalhe-do-painel').innerHTML = '<section class="cartao sem-forro origem">'
      + '<header class="origem-cabeca"><h3>' + escapar(detalhe.titulo) + ' · '
      + escapar(detalhe.ponto) + '</h3>'
      + '<span class="quantos">' + detalhe.total + '</span>'
      + '<button type="button" class="botao-texto" id="fechar-detalhe">'
      + 'Fechar</button></header>'
      + (detalhe.casos.length < detalhe.total
        ? '<div class="fila-mostrar"><span class="fila-mostrando">Mostrando os '
          + detalhe.casos.length + ' casos mais recentes de ' + detalhe.total + '</span>'
          + '<button type="button" class="mostrar-quantos" id="detalhe-todos">'
          + 'Mostrar todos (' + detalhe.total + ')</button></div>'
        : '')
      + (detalhe.casos.length
        ? '<div class="rolagem-tabela"><table class="fila agrupada">'
          + '<thead><tr>' + cabecalho + '</tr></thead>'
          + '<tbody>' + linhas + '</tbody></table></div>'
        : '<p class="grafico-vazio">Nenhum caso aqui.</p>')
      + '</section>';

    elemento('fechar-detalhe').addEventListener('click', function () {
      elemento('detalhe-do-painel').innerHTML = '';
    });
    var todos = elemento('detalhe-todos');
    if (todos) todos.addEventListener('click', function () {
      detalhar(idDoComponente, chaveDoPonto, true);
    });

    var abrir = document.querySelectorAll('[data-caso-do-painel]');
    for (var i = 0; i < abrir.length; i++) {
      abrir[i].addEventListener('click', function () {
        CasoEmModal.abrir(canalEscolhido, this.getAttribute('data-caso-do-painel'),
          carregar);
      });
    }
  }

  function exportar(idDoComponente) {
    Servidor.chamar('exportarComponente', canalEscolhido, idDoComponente,
      filtros, periodo)
      .entao(function (arquivo) { abrirCaixaDeExportar(arquivo); })
      .senao(function (erro) { window.alert(erro.message || String(erro)); });
  }

  function abrirCaixaDeExportar(arquivo) {
    var caixa = document.createElement('div');
    caixa.className = 'dialogo';
    caixa.id = 'dialogo-exportar';
    caixa.innerHTML = '<div class="dialogo-caixa" role="dialog" aria-modal="true"'
      + ' aria-labelledby="titulo-exportar">'
      + '<h3 id="titulo-exportar">Exportar</h3>'
      + '<p>Separado por ponto e vírgula, que é como o Excel em português abre '
      + 'sem perguntar nada.</p>'
      + '<textarea id="texto-exportado" rows="8" readonly>'
      + escapar(arquivo.conteudo) + '</textarea>'
      + '<div class="config-acoes">'
      + '<button type="button" class="botao" id="copiar-exportado">Copiar</button>'
      + '<button type="button" class="botao vazado" id="fechar-exportar">'
      + 'Fechar</button></div></div>';
    document.body.appendChild(caixa);

    function sair() { if (caixa.parentNode) caixa.parentNode.removeChild(caixa); }
    elemento('fechar-exportar').addEventListener('click', sair);
    caixa.addEventListener('mousedown', function (evento) {
      if (evento.target === caixa) sair();
    });

    var area = elemento('texto-exportado');
    area.focus();
    area.select();

    elemento('copiar-exportado').addEventListener('click', function () {
      area.select();
      var deuCerto = false;
      try { deuCerto = document.execCommand('copy'); } catch (erro) { deuCerto = false; }
      this.textContent = deuCerto ? 'Copiado' : 'Aperte Ctrl+C';
    });
  }

  function ligar() {
    SeletorDeCanal.ligar(function (idDoCanal) {
      canalEscolhido = idDoCanal;
      filtros = {};
      tabelasAbertas = {};
      Aplicacao.remontar();
    });
    carregar();
  }

  function desligar() { Graficos.tirarDica(); }

  return { montar: montar, ligar: ligar, desligar: desligar };
})();
</script>


<!-- ==== Configuracoes.html ==== -->
<script>

var EditorDaFila = (function () {

  function ler(textoGravado) {
    var declarado = String(textoGravado || '');
    var plana = declarado.indexOf(':') < 0;
    var pedacos = plana ? declarado.split(',') : declarado.split(';');

    return pedacos.map(function (pedaco) {
      var texto = String(pedaco || '').trim();
      if (!texto) return null;
      var titulo = '';
      var lista = texto;
      var doisPontos = texto.indexOf(':');
      if (!plana && doisPontos > 0) {
        titulo = texto.substring(0, doisPontos).trim();
        lista = texto.substring(doisPontos + 1);
      }
      var itens = lista.split(',').map(function (item) {
        return item.split('+').map(function (nome) { return nome.trim(); })
          .filter(function (nome) { return nome !== ''; });
      }).filter(function (item) { return item.length; });
      if (!itens.length) return null;

      return { titulo: titulo || itens[0].join(' + '), itens: itens };
    }).filter(function (grupo) { return grupo !== null; });
  }

  function tituloLimpo(titulo) {
    return String(titulo || '').replace(/[:;,+]/g, ' ').replace(/\s+/g, ' ').trim();
  }

  function escrever(modelo) {
    return (modelo || []).filter(function (grupo) {
      return grupo.itens.length;
    }).map(function (grupo) {
      var titulo = tituloLimpo(grupo.titulo) || tituloLimpo(grupo.itens[0].join(' '));
      return titulo + ': ' + grupo.itens.map(function (item) {
        return item.join(' + ');
      }).join(', ');
    }).join('; ');
  }

  function usadas(modelo) {
    var lista = [];
    modelo.forEach(function (grupo) {
      grupo.itens.forEach(function (item) { lista = lista.concat(item); });
    });
    return lista;
  }

  function mover(lista, de, passo) {
    var para = de + passo;
    if (para < 0 || para >= lista.length) return;
    var item = lista.splice(de, 1)[0];
    lista.splice(para, 0, item);
  }

  function desenhar(modelo, colunasDaBase, escapar) {
    var livres = colunasDaBase.filter(function (coluna) {
      return usadas(modelo).indexOf(coluna) < 0;
    });
    var opcoesLivres = livres.map(function (coluna) {
      return '<option value="' + escapar(coluna) + '">' + escapar(coluna) + '</option>';
    }).join('');

    var grupos = modelo.map(function (grupo, g) {
      var itens = grupo.itens.map(function (item, i) {
        var partes = item.map(function (coluna, p) {
          var existe = colunasDaBase.indexOf(coluna) >= 0;
          return '<span class="fila-parte' + (existe ? '' : ' ausente') + '">'
            + escapar(coluna)
            + (existe ? '' : ' <em>(não existe na aba)</em>')
            + (item.length > 1
              ? '<button type="button" class="fila-tirar-parte" data-tirar-parte="'
                + g + '.' + i + '.' + p + '" aria-label="Separar ' + escapar(coluna)
                + '">×</button>' : '')
            + '</span>';
        }).join('<span class="fila-mais">+</span>');

        return '<li class="fila-item">'
          + '<div class="fila-item-nome">' + partes
          + (i === 0 ? '<span class="fila-destaque">destaque</span>' : '') + '</div>'
          + '<div class="fila-item-acoes">'
          + (livres.length
            ? '<select class="fila-juntar" data-juntar="' + g + '.' + i + '"'
              + ' aria-label="Juntar outra coluna nesta linha">'
              + '<option value="">+ juntar…</option>' + opcoesLivres + '</select>'
            : '')
          + '<button type="button" class="seta" data-subir-item="' + g + '.' + i + '"'
          + (i === 0 ? ' disabled' : '') + ' title="Subir" aria-label="Subir">↑</button>'
          + '<button type="button" class="seta" data-descer-item="' + g + '.' + i + '"'
          + (i === grupo.itens.length - 1 ? ' disabled' : '')
          + ' title="Descer" aria-label="Descer">↓</button>'
          + '<button type="button" class="seta perigo" data-tirar-item="' + g + '.' + i + '"'
          + ' title="Tirar da fila" aria-label="Tirar da fila">×</button>'
          + '</div></li>';
      }).join('');

      return '<div class="fila-grupo">'
        + '<div class="fila-grupo-cabeca">'
        + '<input type="text" class="fila-grupo-titulo" data-titulo="' + g + '"'
        + ' value="' + escapar(grupo.titulo) + '" aria-label="Nome do grupo">'
        + '<button type="button" class="seta" data-subir-grupo="' + g + '"'
        + (g === 0 ? ' disabled' : '') + ' title="Subir o grupo" aria-label="Subir o grupo">↑</button>'
        + '<button type="button" class="seta" data-descer-grupo="' + g + '"'
        + (g === modelo.length - 1 ? ' disabled' : '')
        + ' title="Descer o grupo" aria-label="Descer o grupo">↓</button>'
        + '<button type="button" class="seta perigo" data-tirar-grupo="' + g + '"'
        + ' title="Tirar o grupo" aria-label="Tirar o grupo">×</button>'
        + '</div>'
        + (itens ? '<ol class="fila-itens">' + itens + '</ol>'
          : '<p class="fila-vazio">Grupo sem coluna: não aparece na fila.</p>')
        + (livres.length
          ? '<select class="fila-acrescentar" data-acrescentar="' + g + '"'
            + ' aria-label="Acrescentar coluna ao grupo">'
            + '<option value="">+ Acrescentar coluna…</option>' + opcoesLivres + '</select>'
          : '')
        + '</div>';
    }).join('');

    return (grupos || '<p class="fila-vazio">Nenhum grupo: a fila fica sem colunas.</p>')
      + '<button type="button" class="botao-secundario pequeno" data-novo-grupo>'
      + 'Novo grupo</button>';
  }

  function montar(caixa, campo, textoGravado, colunasDaBase, escapar) {
    var modelo = ler(textoGravado);

    function redesenhar() {
      caixa.innerHTML = desenhar(modelo, colunasDaBase, escapar);
      campo.value = escrever(modelo);
    }
    function posicao(texto) {
      return String(texto).split('.').map(Number);
    }

    caixa.addEventListener('click', function (evento) {
      var botao = evento.target.closest ? evento.target.closest('button') : null;
      if (!botao || !caixa.contains(botao)) return;
      var p;
      if (botao.hasAttribute('data-novo-grupo')) {
        modelo.push({ titulo: 'Novo grupo', itens: [] });
      } else if (botao.hasAttribute('data-subir-grupo')) {
        mover(modelo, Number(botao.getAttribute('data-subir-grupo')), -1);
      } else if (botao.hasAttribute('data-descer-grupo')) {
        mover(modelo, Number(botao.getAttribute('data-descer-grupo')), 1);
      } else if (botao.hasAttribute('data-tirar-grupo')) {
        modelo.splice(Number(botao.getAttribute('data-tirar-grupo')), 1);
      } else if (botao.hasAttribute('data-subir-item')) {
        p = posicao(botao.getAttribute('data-subir-item'));
        mover(modelo[p[0]].itens, p[1], -1);
      } else if (botao.hasAttribute('data-descer-item')) {
        p = posicao(botao.getAttribute('data-descer-item'));
        mover(modelo[p[0]].itens, p[1], 1);
      } else if (botao.hasAttribute('data-tirar-item')) {
        p = posicao(botao.getAttribute('data-tirar-item'));
        modelo[p[0]].itens.splice(p[1], 1);
      } else if (botao.hasAttribute('data-tirar-parte')) {
        p = posicao(botao.getAttribute('data-tirar-parte'));
        modelo[p[0]].itens[p[1]].splice(p[2], 1);
      } else {
        return;
      }
      redesenhar();
    });

    caixa.addEventListener('change', function (evento) {
      var caixaDeEscolha = evento.target;
      var coluna = caixaDeEscolha.value;
      if (!coluna) return;
      if (caixaDeEscolha.hasAttribute('data-acrescentar')) {
        modelo[Number(caixaDeEscolha.getAttribute('data-acrescentar'))].itens.push([coluna]);
      } else if (caixaDeEscolha.hasAttribute('data-juntar')) {
        var p = posicao(caixaDeEscolha.getAttribute('data-juntar'));
        modelo[p[0]].itens[p[1]].push(coluna);
      } else {
        return;
      }
      redesenhar();
    });

    caixa.addEventListener('input', function (evento) {
      if (!evento.target.hasAttribute('data-titulo')) return;
      modelo[Number(evento.target.getAttribute('data-titulo'))].titulo = evento.target.value;
      campo.value = escrever(modelo);
    });

    redesenhar();
  }

  return { ler: ler, escrever: escrever, desenhar: desenhar, montar: montar };
})();

var TelaConfiguracoes = (function () {

  var resumo = null;
  var pacoteDoSistema = null;
  var secaoAtual = 'campos';
  var canalEscolhido = '';
  var tipoDeListaEscolhido = '';
  var escolhido = null;
  var dados = {};

  function escapar(texto) { return Moldura.escapar(texto); }
  function elemento(id) { return document.getElementById(id); }

  function respostaAtrasada(secaoDaResposta) {
    return secaoAtual !== secaoDaResposta;
  }

  function texto(valor) {
    return String(valor === null || valor === undefined ? '' : valor);
  }

  function montar(pacote) {
    pacoteDoSistema = pacote;
    if (!canalEscolhido && pacote.canais.length) canalEscolhido = pacote.canais[0].id;
    return '<div class="config" id="config">'
      + '<p class="carregando-campos">Abrindo as configurações…</p>'
      + '</div>';
  }

  function desenharTudo() {
    elemento('config').innerHTML =
      '<nav class="config-secoes" id="config-secoes">' + desenharSecoes() + '</nav>'
      + '<div class="config-meio">'
      + '<p class="config-descricao" id="config-descricao"></p>'
      + '<div class="config-lista" id="config-lista"></div>'
      + '</div>'
      + '<aside class="config-painel" id="config-painel"></aside>';
    ligarSecoes();
    carregarSecao();
  }

  function desenharSecoes() {
    var aviso = '';
    if (!resumo.estrutura.emOrdem) {
      aviso = '<button type="button" class="config-alerta" data-secao="estrutura">'
        + 'A planilha saiu do contrato — ver o laudo</button>';
    } else if (!resumo.senhaDefinida) {
      aviso = '<button type="button" class="config-alerta suave" data-secao="identidade">'
        + 'Sem senha de administrador definida</button>';
    }

    return resumo.secoes.map(function (secao) {
      return '<button type="button" class="config-secao'
        + (secao.chave === secaoAtual ? ' atual' : '') + '"'
        + ' data-secao="' + escapar(secao.chave) + '">'
        + Moldura.icone(secao.chave)
        + '<span class="titulo">' + escapar(secao.titulo) + '</span>'
        + (secao.quantidade
          ? '<span class="quantos">' + secao.quantidade + '</span>'
          : '<span></span>')
        + '</button>';
    }).join('') + aviso;
  }

  function atualizarDescricao() {
    var onde = elemento('config-descricao');
    if (!onde) return;
    var achada = resumo.secoes.filter(function (secao) {
      return secao.chave === secaoAtual;
    })[0];
    onde.textContent = achada ? achada.descricao : '';
  }

  function ligarSecoes() {
    var botoes = document.querySelectorAll('[data-secao]');
    for (var i = 0; i < botoes.length; i++) {
      botoes[i].addEventListener('click', function () {
        secaoAtual = this.getAttribute('data-secao');
        escolhido = null;
        elemento('config-secoes').innerHTML = desenharSecoes();
        ligarSecoes();
        carregarSecao();
      });
    }
  }

  function aguarde(mensagem) {
    elemento('config-lista').innerHTML =
      '<p class="carregando-campos">' + escapar(mensagem) + '</p>';
    elemento('config-painel').innerHTML = '';
  }

  function falhou(erro) {
    elemento('config-lista').innerHTML = '<p class="carregando-campos erro-carga">'
      + escapar(erro.message || String(erro)) + '</p>';
  }

  function carregarSecao() {
    dados = {};
    atualizarDescricao();

    if (secaoAtual === 'campos') return carregarCampos();
    if (secaoAtual === 'usuarios') return carregarUsuarios();
    if (secaoAtual === 'niveis') return carregarNiveis();
    if (secaoAtual === 'catalogo') return carregarListas();
    if (secaoAtual === 'canais') return carregarCanais();
    if (secaoAtual === 'paineis') return carregarPaineis();
    if (secaoAtual === 'analises') return carregarAnalises();
    if (secaoAtual === 'sinalizadores') return carregarSinalizadores();
    if (secaoAtual === 'identidade') return desenharIdentidade();
    if (secaoAtual === 'estrutura') return carregarEstrutura();
  }

  function carregarCampos() {
    aguarde('Lendo os campos do canal…');
    Servidor.chamar('opcoesDeConfiguracaoDeCampo')
      .entao(function (opcoes) {
        dados.opcoes = opcoes;
        Servidor.chamar('listarCamposDoCanal', canalEscolhido)
          .entao(function (campos) {
            dados.campos = campos;
            desenharCampos();
          })
          .senao(falhou);
      })
      .senao(falhou);
  }

  function desenharCampos() {
    if (respostaAtrasada('campos')) return;
    var linhas = dados.campos.map(function (campo, posicao) {
      return '<li class="config-item' + (escolhido && escolhido.id === campo.id
        ? ' atual' : '') + (campo.ativo ? '' : ' desligado') + '">'
        + '<button type="button" class="abrir" data-campo="' + escapar(campo.id) + '">'
        + '<span class="nome">' + escapar(campo.rotulo) + '</span>'
        + '<span class="detalhe">' + escapar(campo.secao) + ' · '
        + escapar(campo.tipo)
        + (campo.obrigatorio ? ' · obrigatório' : '')
        + (campo.ativo ? '' : ' · desligado no formulário')
        + (campo.colunaExiste ? ''
          : ' · <strong class="alerta">coluna ausente na planilha</strong>')
        + '</span></button>'
        + '<span class="mover">'
        + '<button type="button" class="seta" data-subir="' + posicao + '"'
        + (posicao === 0 ? ' disabled' : '') + ' title="Subir">↑</button>'
        + '<button type="button" class="seta" data-descer="' + posicao + '"'
        + (posicao === dados.campos.length - 1 ? ' disabled' : '')
        + ' title="Descer">↓</button></span>'
        + '</li>';
    }).join('');

    elemento('config-lista').innerHTML =
      '<div class="config-cabeca">'
      + '<div class="config-canais">' + caixaDeCanais() + '</div>'
      + (resumo.podeMexerNaEstrutura
        ? '<button type="button" class="botao pequeno" id="novo-campo">'
          + 'Criar campo</button>' : '')
      + '</div>'
      + '<p class="config-explica">A ordem aqui é a ordem do formulário. '
      + 'Mudar de lugar não mexe na planilha: a coluna fica onde está.</p>'
      + '<ul class="config-itens">' + linhas + '</ul>';

    ligarListaDeCampos();
    if (escolhido) desenharPainelDoCampo(acharCampo(escolhido.id));
    else painelVazio('Escolha um campo para ver e mudar as propriedades dele.');
  }

  function acharCampo(id) {
    for (var i = 0; i < dados.campos.length; i++) {
      if (dados.campos[i].id === id) return dados.campos[i];
    }
    return null;
  }

  function caixaDeCanais() {
    return '<select id="canal-da-config" aria-label="Canal">'
      + pacoteDoSistema.canais.map(function (canal) {
        return '<option value="' + escapar(canal.id) + '"'
          + (canal.id === canalEscolhido ? ' selected' : '') + '>'
          + escapar(canal.nome) + '</option>';
      }).join('') + '</select>';
  }

  function ligarListaDeCampos() {
    var seletor = elemento('canal-da-config');
    if (seletor) {
      seletor.addEventListener('change', function () {
        canalEscolhido = this.value;
        escolhido = null;
        carregarCampos();
      });
    }

    ligarCliques('[data-campo]', function (botao) {
      escolhido = { id: botao.getAttribute('data-campo') };
      desenharCampos();
    });

    ligarCliques('[data-subir]', function (botao) {
      trocarDeLugar(Number(botao.getAttribute('data-subir')), -1);
    });
    ligarCliques('[data-descer]', function (botao) {
      trocarDeLugar(Number(botao.getAttribute('data-descer')), 1);
    });

    var novo = elemento('novo-campo');
    if (novo) novo.addEventListener('click', abrirCampoNovo);
  }

  function trocarDeLugar(posicao, passo) {
    var destino = posicao + passo;
    if (destino < 0 || destino >= dados.campos.length) return;

    var lista = dados.campos.slice();
    var guardado = lista[posicao];
    lista[posicao] = lista[destino];
    lista[destino] = guardado;
    dados.campos = lista;
    desenharCampos();

    Servidor.chamar('reordenarCampos', canalEscolhido, lista.map(function (campo) {
      return campo.id;
    })).senao(function (erro) {

      avisar(erro.message || String(erro), 'ruim');
      carregarCampos();
    });
  }

  function desenharPainelDoCampo(campo) {
    if (!campo) return painelVazio('Escolha um campo.');

    var opcoes = dados.opcoes;

    elemento('config-painel').innerHTML = '<form class="config-form" id="form-campo">'
      + tituloDoPainel(campo.rotulo, 'Campo do formulário')
      + avisoDaColuna(campo)
      + campoDeTexto('rotulo', 'Rótulo na tela', campo.rotulo,
        'O que o analista lê. Trocar isto não mexe na planilha.')
      + campoSomenteLeitura('Cabeçalho na planilha', campo.cabecalho,
        'É o nome da coluna. Não muda por aqui — é o que amarra o dado ao '
        + 'Power BI.')
      + campoDeTexto('descricao', 'Dica embaixo do campo', campo.descricao, '')
      + campoDeTexto('secao', 'Seção do formulário', campo.secao,
        'Campos com a mesma seção aparecem juntos.')
      + caixaDeOpcoes('tipo', 'Tipo', opcoes.tipos, campo.tipo, '')
      + campoDeTexto('mascara', 'Máscara', campo.mascara,
        'Ex.: 000.000.000-00. A planilha recebe só os dígitos. Duas máscaras '
        + 'separadas por | aceitam as duas formas — '
        + '000.000.000-00|00.000.000/0000-00 é CPF ou CNPJ.')
      + caixaDeItens('catalogo', 'Lista de opções',
        (opcoes.listas || []).map(function (lista) {
          return { id: lista.chave, nome: lista.nome };
        }), campo.catalogo,
        'As opções do seletor. Para criar uma lista nova ou mudar as opções, '
        + 'use Configurações › Ajustes Gerais.')
      + caixaDeOpcoes('listaDe', 'Lista de um cadastro',
        [''].concat(opcoes.cadastros), campo.listaDe,
        'Preenche as opções a partir de um cadastro do sistema.')
      + caixaDeSimNao('obrigatorio', 'Obrigatório', campo.obrigatorio)
      + caixaDeSimNao('ativo', 'Aparece no formulário', campo.ativo)
      + blocoDaCondicao(campo)
      + blocoDaCondicao(campo, 'obrigatorioSe')
      + '<div class="config-acoes">'
      + '<button type="submit" class="botao">Salvar</button>'
      + (podeExcluirEsteCampo(campo)
        ? '<button type="button" class="botao vazado perigo" id="excluir-campo">'
          + 'Excluir campo</button>' : '')
      + '</div>'
      + porQueNaoDaParaExcluir(campo)
      + '</form>';

    elemento('form-campo').addEventListener('submit', function (evento) {
      evento.preventDefault();
      salvarCampo(campo);
    });
    ligarACondicao(campo);
    ligarACondicao(campo, 'obrigatorioSe');
    var excluir = elemento('excluir-campo');
    if (excluir) {
      excluir.addEventListener('click', function () {
        abrirExclusaoDoCampo(campo);
      });
    }
  }

  var CONDICOES = {
    mostrarSe: { prefixo: 'mostrar', marca: 'data-valor-da-condicao',
      titulo: 'Quando este campo aparece', sempre: 'Aparece sempre',
      exemplo: 'Ex.: o Status proposta só aparece quando o Status for Retido. '
        + 'O valor escondido não é cobrado nem gravado, e é esvaziado quando a '
        + 'pessoa troca o valor que o mostrava.' },
    obrigatorioSe: { prefixo: 'obrigar', marca: 'data-valor-da-obrigacao',
      titulo: 'Quando este campo é obrigatório', sempre: 'Só quando "Obrigatório" estiver marcado',
      exemplo: 'Ex.: o valor retido é obrigatório quando o Status for Retido. Nos '
        + 'outros status o campo continua aparecendo, sem ser cobrado. Vale no '
        + 'cadastro, no "Trabalhar no caso" e no "Alterar status".' }
  };

  function blocoDaCondicao(campo, qual) {
    var regra = CONDICOES[qual || 'mostrarSe'];
    var outros = dados.campos.filter(function (outro) {
      return outro.id !== campo.id;
    }).map(function (outro) {
      return { id: outro.chave, nome: outro.rotulo };
    });
    var atual = campo[qual || 'mostrarSe'];
    return '<div class="config-campo" role="group" aria-label="' + escapar(regra.titulo) + '">'
      + '<span>' + escapar(regra.titulo) + '</span>'
      + '<select id="cfg-' + regra.prefixo + '-campo" aria-label="Campo que decide">'
      + '<option value="">' + escapar(regra.sempre) + '</option>'
      + outros.map(function (outro) {
        return '<option value="' + escapar(outro.id) + '"'
          + (atual && atual.campo === outro.id ? ' selected' : '') + '>'
          + 'Só quando "' + escapar(outro.nome) + '" for…</option>';
      }).join('') + '</select>'
      + '<div id="cfg-' + regra.prefixo + '-valores"></div>'
      + '<em>' + escapar(regra.exemplo) + '</em></div>';
  }

  function desenharOsValoresDaCondicao(campo, chaveQueManda, qual) {
    var regra = CONDICOES[qual || 'mostrarSe'];
    var caixa = elemento('cfg-' + regra.prefixo + '-valores');
    if (!caixa) return;
    if (!chaveQueManda) { caixa.innerHTML = ''; return; }

    var quemManda = dados.campos.filter(function (outro) {
      return outro.chave === chaveQueManda;
    })[0];
    var atual = campo[qual || 'mostrarSe'];
    var marcados = (atual && atual.campo === chaveQueManda) ? atual.valores : [];
    var opcoes = quemManda ? quemManda.opcoes : [];

    if (!opcoes.length) {
      caixa.innerHTML = '<input type="text" id="cfg-' + regra.prefixo + '-texto" value="'
        + escapar(marcados.join('; ')) + '">'
        + '<em>Os valores, separados por ponto e vírgula.</em>';
      return;
    }
    caixa.innerHTML = opcoes.map(function (opcao) {
      var ligado = marcados.some(function (valor) {
        return texto(valor).toLowerCase() === texto(opcao).toLowerCase();
      });
      return '<label class="config-chave">'
        + '<input type="checkbox" ' + regra.marca + '="' + escapar(opcao) + '"'
        + (ligado ? ' checked' : '') + '>'
        + '<span>' + escapar(opcao) + '</span></label>';
    }).join('');
  }

  function ligarACondicao(campo, qual) {
    var regra = CONDICOES[qual || 'mostrarSe'];
    var escolha = elemento('cfg-' + regra.prefixo + '-campo');
    if (!escolha) return;
    desenharOsValoresDaCondicao(campo, escolha.value, qual);
    escolha.addEventListener('change', function () {
      desenharOsValoresDaCondicao(campo, escolha.value, qual);
    });
  }

  function lerACondicao(qual) {
    var regra = CONDICOES[qual || 'mostrarSe'];
    var quemManda = valorDe(regra.prefixo + '-campo');
    if (!quemManda) return null;

    var valores = [];
    var caixas = document.querySelectorAll('[' + regra.marca + ']');
    for (var i = 0; i < caixas.length; i++) {
      if (caixas[i].checked) valores.push(caixas[i].getAttribute(regra.marca));
    }
    var escrito = elemento('cfg-' + regra.prefixo + '-texto');
    if (escrito) {
      valores = escrito.value.split(';').map(function (valor) { return valor.trim(); })
        .filter(function (valor) { return valor !== ''; });
    }
    return { campo: quemManda, valores: valores };
  }

  function podeExcluirEsteCampo(campo) {
    if (!resumo.podeMexerNaEstrutura) return false;
    if (campo.protegido) return false;
    return !(campo.usadoPeloCanal && campo.usadoPeloCanal.length);
  }

  function porQueNaoDaParaExcluir(campo) {
    if (podeExcluirEsteCampo(campo)) return '';
    if (!resumo.podeMexerNaEstrutura) return '';

    if (campo.protegido) {
      return '<p class="config-explica">Este campo faz parte do contrato da '
        + 'aba: o próprio sistema grava nessa coluna, e os relatórios contam '
        + 'com ela. Para tirá-lo do formulário sem apagar nada, ponha '
        + '<strong>Aparece no formulário</strong> em Não.</p>';
    }
    return '<p class="config-explica">Não dá para excluir enquanto a coluna '
      + '<strong>' + escapar(campo.cabecalho) + '</strong> estiver sendo usada '
      + 'em: ' + escapar(campo.usadoPeloCanal.join(', ')) + '. Troque essas '
      + 'referências em Canais de trabalho e volte aqui.</p>';
  }

  function abrirExclusaoDoCampo(campo) {
    elemento('config-painel').innerHTML =
