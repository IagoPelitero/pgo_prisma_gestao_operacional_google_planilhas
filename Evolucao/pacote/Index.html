    return (partes[0].charAt(0) + partes[partes.length - 1].charAt(0)).toUpperCase();
  }

  function escapar(texto) {
    return String(texto === null || texto === undefined ? '' : texto)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

  /** A marca do topo do menu: a logo de CONFIG, ou o nome quando não há logo. */
  function marca(identidade) {
    if (identidade.logo) {
      return '<img src="' + escapar(identidade.logo) + '" alt="'
        + escapar(identidade.operacao || identidade.nome) + '">';
    }
    // Sem logo, o nome vira a marca. As duas últimas letras ganham a cor de
    // destaque — é o mesmo tratamento do "PGO" dos desenhos da tela.
    var nome = String(identidade.nome || 'RECC');
    var corte = Math.max(nome.length - 2, 1);
    return '<span class="escrito">' + escapar(nome.substring(0, corte))
      + '<em>' + escapar(nome.substring(corte)) + '</em></span>';
  }

  function montarLateral(pacote, telaAtual) {
    var itens = pacote.menu.map(function (item) {
      var atual = item.tela === telaAtual ? ' aria-current="page"' : '';
      return '<li><button type="button" class="lateral-item"'
        + ' data-tela="' + escapar(item.tela) + '"' + atual + '>'
        + icone(item.tela)
        + '<span class="rotulo">' + escapar(item.titulo) + '</span>'
        + '</button></li>';
    }).join('');

    var rodape = '';
    if (pacote.identidade.plataforma || pacote.identidade.fabricante) {
      rodape = '<div class="lateral-pe">'
        + '<div>' + escapar(pacote.identidade.plataforma) + '</div>'
        + '<div class="fabricante">' + escapar(pacote.identidade.fabricante) + '</div>'
        + '</div>';
    }

    return '<div class="lateral-marca">'
      + marca(pacote.identidade)
      + '<button type="button" class="lateral-encolher" id="encolher"'
      + ' title="Encolher o menu" aria-label="Encolher o menu">'
      + '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"'
      + ' stroke-linecap="round" aria-hidden="true">'
      + '<path d="M4 7h16M4 12h16M4 17h16"></path></svg>'
      + '</button>'
      + '</div>'
      + '<ul class="lateral-itens">' + itens + '</ul>'
      + rodape;
  }

  /**
   * A barra superior.
   *
   * A ordem foi pedida assim, e cada peça responde a uma pergunta diferente:
   *   identidade        que sistema é este, de que operação
   *   busca             achar um caso sem sair de onde se está
   *   bolinhas          a cor da tela, escolha de quem usa
   *   último registro   a base está atualizada?
   *   pessoa            quem sou eu aqui dentro, e com que cargo
   *
   * O nome da TELA não fica aqui: ele fica no topo do conteúdo, junto do que
   * ele nomeia.
   */
  function montarSuperior(pacote) {
    var bolinhas = TEMAS.map(function (tema) {
      var marcado = tema.chave === pacote.tema ? 'true' : 'false';
      return '<button type="button" class="tema tema-' + tema.chave + '"'
        + ' data-tema="' + tema.chave + '" aria-pressed="' + marcado + '"'
        + ' title="' + escapar(tema.nome) + '"'
        + ' aria-label="Tema ' + escapar(tema.nome) + '"></button>';
    }).join('');

    return ''
      + '<button type="button" class="abrir-menu" id="abrir-menu" aria-label="Abrir o menu">'
      + '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"'
      + ' stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"></path></svg>'
      + '</button>'

      + '<div class="identidade">'
      + '<h1>' + escapar(pacote.identidade.nome)
      + (pacote.identidade.nomeLongo
        ? ' — ' + escapar(pacote.identidade.nomeLongo) : '')
      + '</h1>'
      + '<p>' + escapar(pacote.identidade.operacao) + '</p>'
      + '</div>'

      + '<div class="busca">'
      + '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"'
      + ' stroke-linecap="round"><circle cx="11" cy="11" r="7"></circle>'
      + '<path d="M20 20l-4.2-4.2"></path></svg>'
      + '<input type="search" id="busca-global" autocomplete="off"'
      + ' placeholder="Buscar por apólice, segurado ou protocolo…"'
      + ' aria-label="Busca geral">'
      + '<kbd>Ctrl K</kbd>'
      + '</div>'

      + '<div class="temas" role="group" aria-label="Cor do sistema">' + bolinhas + '</div>'

      + ultimoRegistro(pacote.ultimoRegistro)

      + '<div class="pessoa">'
      + '<div class="iniciais" aria-hidden="true">'
      + escapar(iniciais(pacote.usuario.nome)) + '</div>'
      + '<div class="quem"><strong>' + escapar(pacote.usuario.nome) + '</strong>'
      + '<span>' + escapar(descricaoDaPessoa(pacote.usuario)) + '</span>'
      + '</div></div>';
  }

  /** "Analista RET · Vida Individual" — o cargo, e o canal quando existe. */
  function descricaoDaPessoa(usuario) {
    var cargo = usuario.cargo || usuario.nivelAcesso || '';
    if (usuario.canalQueAtende) return cargo + ' · ' + usuario.canalQueAtende;
    return cargo;
  }

  /** A data do último registro, ou o aviso de que ainda não há nenhum. */
  function ultimoRegistro(dados) {
    var informacao = dados || { texto: 'Nenhum registro ainda', existe: false };
    var explicacao = informacao.existe && informacao.mesa
      ? 'Último registro em ' + informacao.mesa
      : 'Ainda não há registros nas mesas';

    return '<div class="ultimo-registro' + (informacao.existe ? '' : ' vazio') + '"'
      + ' title="' + escapar(explicacao) + '">'
      + '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"'
      + ' stroke-linecap="round" aria-hidden="true">'
      + '<rect x="3.5" y="5" width="17" height="15" rx="2"></rect>'
      + '<path d="M3.5 10h17M8 3.5v3M16 3.5v3"></path></svg>'
      + '<span class="rotulo-data">' + escapar(informacao.texto) + '</span>'
      + '</div>';
  }

  /**
   * O aviso de que a tela leu só uma parte da base.
   *
   * Num lugar só porque são TRÊS telas dizendo a mesma coisa — Dashboard,
   * Painel Analítico e Minha Performance —, e três textos diferentes para o
   * mesmo fato é como a operação aprende que um deles não é sério.
   *
   * A frase diz o que foi lido e o que fazer, nessa ordem. "Os números podem
   * estar incompletos" sozinho não ajuda ninguém: a pessoa precisa saber que
   * dá para aumentar a janela, e onde.
   */
  function avisoDeJanela(resposta, oQueEssaTelaMostra) {
    if (!resposta || !resposta.truncada) return '';
    var lidas = resposta.linhasLidas
      ? Number(resposta.linhasLidas).toLocaleString('pt-BR') : 'algumas';
    return '<p class="aviso-janela" role="status">'
      + '<strong>' + oQueEssaTelaMostra + ' vêm das ' + lidas + ' linhas mais '
      + 'recentes da base</strong>, que é o que o painel lê de uma vez. A mesa '
      + 'tem mais que isso, então casos antigos do período podem ter ficado de '
      + 'fora. Para o histórico inteiro, use Buscar Caso; para aumentar a '
      + 'janela, ajuste <code>OPERACAO.LINHAS_DO_PAINEL</code> na aba CONFIG.'
      + '</p>';
  }

  return {
    avisoDeJanela: avisoDeJanela,
    montarLateral: montarLateral,
    montarSuperior: montarSuperior,
    // Os desenhos são de todas as telas, e não só do menu: a fila usa o olho,
    // o lápis e a lixeira, e eles precisam vir da mesma grade e da mesma
    // espessura, senão a tela parece montada com peças de dois conjuntos.
    icone: icone,
    escapar: escapar,
    iniciais: iniciais
  };
})();
</script>


<!-- ==== SenhaDeAdministrador.html ==== -->
<script>
/* ============================================================================
   PGO — SenhaDeAdministrador.html · a guarda das ações sem desfazer
   ============================================================================
   Um diálogo só, usado por todas as telas que fazem alguma coisa de alcance
   grande: criar coluna na planilha, mexer em nível de acesso, importar um
   lote de corretoras.

   Ele nasceu dentro de Configurações e saiu de lá quando a Importação passou
   a precisar do mesmo pedido. Dois diálogos de senha, escritos separados,
   viram duas regras: um dia um passa a liberar por 5 minutos e o outro por
   30, e ninguém percebe até alguém reclamar.

   COMO USAR:

       SenhaDeAdministrador.pedir(function () {
         // ... o que fazer DEPOIS que a senha foi aceita
       });

   A ação fica guardada enquanto a senha não vem, e só roda se ela for aceita.
   É isso que evita o pior atrito possível: preencher um formulário inteiro,
   apertar salvar, digitar a senha — e ter de preencher tudo de novo.
   ============================================================================ */

var SenhaDeAdministrador = (function () {

  var acaoPendente = null;

  function elemento(id) { return document.getElementById(id); }

  /**
   * Pede a senha e, se ela for aceita, roda a ação.
   *
   * `avisarSeNaoDefinida` é para quem JÁ SABE que não existe senha cadastrada
   * — a tela de Configurações sabe, porque o resumo dela diz. Aí o recado sai
   * antes, dizendo onde definir, em vez de a pessoa descobrir digitando uma
   * senha que não existe.
   */
  function pedir(acao, avisarSeNaoDefinida) {
    if (avisarSeNaoDefinida) {
      window.alert('Ainda não existe senha de administrador. Defina uma em '
        + 'Configurações › Identidade antes de fazer isto.');
      return;
    }
    acaoPendente = acao;
    abrir();
  }

  function abrir() {
    var caixa = document.createElement('div');
    caixa.className = 'dialogo';
    caixa.id = 'dialogo-senha';
    caixa.innerHTML = '<div class="dialogo-caixa" role="dialog" aria-modal="true"'
      + ' aria-labelledby="dialogo-titulo">'
      + '<h3 id="dialogo-titulo">Ação sem desfazer</h3>'
      + '<p>Isto escreve na planilha de produção. Confirme com a senha de '
      + 'administrador — ela libera as ações de estrutura por 5 minutos.</p>'
      + '<form id="form-dialogo">'
      + '<input type="password" id="senha-do-dialogo" autocomplete="off"'
      + ' placeholder="Senha de administrador" aria-label="Senha de administrador">'
      + '<p class="dialogo-erro" id="dialogo-erro" hidden></p>'
      + '<div class="config-acoes">'
      + '<button type="submit" class="botao">Confirmar</button>'
      + '<button type="button" class="botao vazado" id="dialogo-desistir">'
      + 'Desistir</button></div></form></div>';
    document.body.appendChild(caixa);

    var campo = elemento('senha-do-dialogo');
    campo.focus();

    elemento('dialogo-desistir').addEventListener('click', fechar);
    elemento('form-dialogo').addEventListener('submit', function (evento) {
      evento.preventDefault();
      Servidor.chamar('liberarComSenha', campo.value)
        .entao(function () {
          // A ação sai da gaveta ANTES de fechar: fechar limpa a gaveta.
          var acao = acaoPendente;
          fechar();
          if (acao) acao();
        })
        .senao(function (erro) {
          var aviso = elemento('dialogo-erro');
          aviso.textContent = erro.message || String(erro);
          aviso.hidden = false;
          campo.value = '';
          campo.focus();
        });
    });
  }

  function fechar() {
    var caixa = elemento('dialogo-senha');
    if (caixa) caixa.parentNode.removeChild(caixa);
    acaoPendente = null;
  }

  /**
   * Fecha o diálogo se ele estiver aberto.
   *
   * Quem troca de tela chama isto. Sem isso, o diálogo de senha ficaria
   * flutuando por cima da tela seguinte, esperando confirmar uma ação que
   * pertencia a uma tela que já não está mais lá.
   */
  return { pedir: pedir, fechar: fechar };

})();
</script>


<!-- ==== SeletorDeMesa.html ==== -->
<script>
/* ============================================================================
   PGO — SeletorDeMesa.html · a escolha da mesa de trabalho
   ============================================================================
   Aparece no Dashboard e no Cadastrar Caso, e é a mesma peça nos dois. Duas
   cópias divergiriam na primeira mudança — bastaria uma mesa nova ganhar
   ícone só num dos lugares.

   O desenho de cada mesa vem da coluna `Icone`, na aba MESAS: mesa nova
   escolhe o dela sem passar por código.
   ============================================================================ */

var SeletorDeMesa = (function () {

  var DESENHOS = {
    // escudo com coração: proteger a vida de quem já é cliente
    escudo:
      '<path d="M12 3.2 4.8 6v6.2c0 4.4 3 7.6 7.2 8.9 4.2-1.3 7.2-4.5 7.2-8.9V6z"></path>'
      + '<path d="M12 15.4c-2-1.3-3.2-2.4-3.2-3.8a1.7 1.7 0 0 1 3.2-.9 1.7 1.7 0 0 1 3.2.9'
      + 'c0 1.4-1.2 2.5-3.2 3.8z"></path>',
    // diamante: a mesa prioritária
    diamante:
      '<path d="M7.4 3.6h9.2l4 5.4L12 20.6 3.4 9z"></path>'
      + '<path d="M3.4 9h17.2M7.4 3.6 12 9l4.6-5.4M12 9v11.6"></path>'
  };

  /** Nome desconhecido cai no losango: melhor que botão sem desenho. */
  function icone(nome) {
    var desenho = DESENHOS[String(nome || '').toLowerCase()] || DESENHOS.diamante;
    return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor"'
      + ' stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"'
      + ' aria-hidden="true">' + desenho + '</svg>';
  }

  function montar(mesas, idEscolhido) {
    return '<div class="mesas" role="group" aria-label="Mesa de trabalho">'
      + mesas.map(function (mesa) {
        var atual = mesa.id === idEscolhido;
        return '<button type="button" class="mesa' + (atual ? ' atual' : '') + '"'
          + ' data-mesa="' + Moldura.escapar(mesa.id) + '"'
          + ' aria-pressed="' + (atual ? 'true' : 'false') + '">'
          + icone(mesa.icone)
          + '<span class="dizeres">'
          + '<strong>' + Moldura.escapar(mesa.nome) + '</strong>'
          + '<span>' + Moldura.escapar(mesa.descricao) + '</span>'
          + '</span></button>';
      }).join('')
      + '</div>';
  }

  function ligar(aoEscolher) {
    var botoes = document.querySelectorAll('.mesa');
    for (var i = 0; i < botoes.length; i++) {
      botoes[i].addEventListener('click', function () {
        aoEscolher(this.getAttribute('data-mesa'));
      });
    }
  }

  return { montar: montar, ligar: ligar, icone: icone };
})();
</script>


<!-- ==== Formulario.html ==== -->
<script>
/* ============================================================================
   PGO — Formulario.html · o formulário, desenhado num lugar só
   ============================================================================
   Duas telas montam o mesmo formulário: Cadastrar Caso e a edição dentro do
   modal do Dashboard. Elas não têm duas cópias disto.

   A razão é a mesma que já custou caro neste projeto: regra copiada em dois
   lugares é regra que um dia diverge. A máscara do CPF, o seletor vazio que
   vira caixa de texto, a marcação de erro campo a campo — tudo mora aqui, e
   quem quiser um formulário pede um.

   O PREFIXO existe porque o formulário pode aparecer DUAS VEZES na mesma
   página — a tela de cadastro atrás e o modal de edição na frente. Sem ele,
   os dois teriam elementos com o mesmo id, e o navegador entregaria sempre o
   primeiro: editar um caso escreveria no formulário de cadastro.

   A máscara vive aqui, e só aqui: é aparência. O que sai daqui para o
   servidor é o que a pessoa digitou; quem limpa e confere é o servidor.
   ============================================================================ */

var Formulario = (function () {

  function escapar(texto) { return Moldura.escapar(texto); }

  function texto(valor) {
    return String(valor === null || valor === undefined ? '' : valor);
  }

  /* ---------------------------------------------------------------- máscara */

  /**
   * Aplica a máscara enquanto a pessoa digita.
   * Cada `0` da máscara é um dígito; o resto é enfeite que o servidor descarta.
   */
  function aplicarMascara(valor, mascara) {
    var digitos = String(valor || '').replace(/\D/g, '');
    if (!mascara) return digitos;

    var saida = '';
    var proximo = 0;
    for (var i = 0; i < mascara.length && proximo < digitos.length; i++) {
      if (mascara.charAt(i) === '0') {
        saida += digitos.charAt(proximo);
        proximo++;
      } else {
        saida += mascara.charAt(i);
      }
    }
    return saida;
  }

  function usaMascara(campo) {
    return !!campo.mascara
      && (campo.tipo === 'documento' || campo.tipo === 'identificador'
        || campo.tipo === 'telefone');
  }

  /* -------------------------------------------------------------- desenhar */

  function desenharCampo(campo, prefixo) {
    var id = prefixo + 'campo-' + campo.chave;
    var obrigatorio = campo.obrigatorio ? ' <span class="exigido">*</span>' : '';
    /*
      O asterisco é VISUAL. Quem usa leitor de tela não o ouve como "campo
      obrigatório" — ouve "asterisco", ou nada. `aria-required` é o que diz
      isso de verdade, e custa um atributo.

      Não é `required` do HTML: o formulário é `novalidate` de propósito,
      porque quem valida é o servidor, e o balão nativo do navegador
      atropelaria a nossa mensagem — que é mais específica e diz o que fazer.
      `aria-required` anuncia sem impedir o envio.
    */
    var exigido = campo.obrigatorio ? ' aria-required="true"' : '';
    var travado = campo.somenteLeitura ? ' disabled' : '';
    var controle;

    // Seletor sem opção nenhuma vira caixa de texto: uma lista vazia na tela
    // é um campo que não dá para preencher, e ninguém entenderia por quê.
    if (campo.tipo === 'seletor' && !campo.opcoes.length) {
      controle = '<input type="text" id="' + id + '"'
        + ' data-chave="' + escapar(campo.chave) + '" autocomplete="off"'
        + ' placeholder="A lista ainda está vazia — digite o valor"'
        + exigido + travado + '>';

    } else if (campo.tipo === 'seletor') {
      var opcoes = ['<option value="">Selecione uma opção</option>'];
      campo.opcoes.forEach(function (opcao) {
        opcoes.push('<option value="' + escapar(opcao.valor) + '">'
          + escapar(opcao.rotulo) + '</option>');
      });
      controle = '<select id="' + id + '" data-chave="' + escapar(campo.chave) + '"'
        + exigido + travado + '>' + opcoes.join('') + '</select>';

    } else if (campo.tipo === 'simOuNao') {
      controle = '<select id="' + id + '" data-chave="' + escapar(campo.chave) + '"'
        + exigido + travado + '>'
        + '<option value="">Selecione</option>'
        + '<option value="SIM">Sim</option>'
        + '<option value="NAO">Não</option></select>';

    } else if (campo.tipo === 'textoLongo') {
      controle = '<textarea id="' + id + '" rows="3"' + exigido
        + ' data-chave="' + escapar(campo.chave) + '"' + travado + '></textarea>';

    } else {
      var htmlTipo = 'text';
      if (campo.tipo === 'data') htmlTipo = 'date';
      else if (campo.tipo === 'hora') htmlTipo = 'time';
      else if (campo.tipo === 'email') htmlTipo = 'email';
      else if (campo.tipo === 'numero' || campo.tipo === 'moeda'
        || campo.tipo === 'percentual') htmlTipo = 'text';

      controle = '<input type="' + htmlTipo + '" id="' + id + '"'
        + ' data-chave="' + escapar(campo.chave) + '"'
        + (campo.mascara ? ' data-mascara="' + escapar(campo.mascara) + '"' : '')
        + (campo.mascara ? ' placeholder="' + escapar(campo.mascara) + '"' : '')
        + ' autocomplete="off"' + exigido + travado + '>';
    }

    var ajuda = campo.descricao
      ? '<small class="ajuda">' + escapar(campo.descricao) + '</small>' : '';
    var selo = campo.chave === 'susep'
      ? '<div class="selo-susep" id="' + prefixo + 'selo-susep" hidden></div>' : '';

    return '<div class="campo largura-' + campo.largura + '" data-campo="'
      + escapar(campo.chave) + '">'
      + '<label for="' + id + '">' + escapar(campo.rotulo) + obrigatorio + '</label>'
      + controle + ajuda + selo
      + '<small class="erro" hidden></small>'
      + '</div>';
  }

  /** Todas as seções do formulário, prontas para entrar num elemento. */
  function desenhar(formulario, prefixo) {
    return formulario.secoes.map(function (secao) {
      return '<fieldset class="secao">'
        + '<legend>' + escapar(secao.nome) + '</legend>'
        + '<div class="grade">'
        + secao.campos.map(function (campo) {
          return desenharCampo(campo, prefixo || '');
        }).join('')
        + '</div></fieldset>';
    }).join('');
  }

  /* --------------------------------------------------------- comportamento */

  /**
   * Liga as máscaras e o selo da SUSEP dentro de um pedaço da página.
   *
   * Recebe a RAIZ, e não procura na página inteira: com o modal aberto por
   * cima da tela de cadastro, procurar na página inteira ligaria os dois.
   */
  function ligar(raiz, prefixo) {
    var comMascara = raiz.querySelectorAll('[data-mascara]');
    for (var i = 0; i < comMascara.length; i++) {
      comMascara[i].addEventListener('input', function () {
        var posicaoNoFim = this.selectionStart === this.value.length;
        this.value = aplicarMascara(this.value, this.getAttribute('data-mascara'));
        if (posicaoNoFim) {
          this.selectionStart = this.selectionEnd = this.value.length;
        }
      });
    }

    var susep = raiz.querySelector('[data-chave="susep"]');
    if (susep) {
      var conferir = function () { consultarSusep(raiz, prefixo, susep.value); };
      susep.addEventListener('change', conferir);
      susep.addEventListener('blur', conferir);
    }
  }

  /**
   * O selo da SUSEP.
   * "Não encontrada" é resposta, não erro: é uma corretora que o cadastro não
   * conhece, e quem está atendendo precisa saber disso antes de seguir.
   */
  function consultarSusep(raiz, prefixo, valor) {
    var selo = raiz.querySelector('#' + (prefixo || '') + 'selo-susep');
    if (!selo) return;

    if (!String(valor || '').replace(/\D/g, '')) {
      selo.hidden = true;
      return;
    }

    selo.hidden = false;
    selo.className = 'selo-susep conferindo';
    selo.textContent = 'Conferindo…';

    Servidor.chamar('consultarSusep', valor)
      .entao(function (resposta) {
        var aparencia = {
          OK: 'liberada', BLOQUEADA: 'bloqueada',
          NAO_ENCONTRADA: 'desconhecida', VAZIA: 'conferindo'
        }[resposta.situacao] || 'conferindo';

        selo.className = 'selo-susep ' + aparencia;
        selo.textContent = resposta.mensagem
          + (resposta.segmento && resposta.situacao === 'OK'
            ? ' · ' + resposta.segmento : '');
      })
      .senao(function () {
        selo.className = 'selo-susep conferindo';
        selo.textContent = 'Não consegui conferir a SUSEP agora.';
      });
  }

  /* -------------------------------------------------------------- valores */

  function valores(raiz) {
    var lidos = {};
    var controles = raiz.querySelectorAll('[data-chave]');
    for (var i = 0; i < controles.length; i++) {
      if (controles[i].disabled) continue;
      lidos[controles[i].getAttribute('data-chave')] = controles[i].value;
    }
    return lidos;
  }

  /**
   * Preenche o formulário com o que o caso tem hoje.
   *
   * A data chega do servidor em dd/mm/aaaa, que é como a pessoa lê; a caixa
   * de data do navegador só entende aaaa-mm-dd. A conversão é aqui, e não no
   * servidor, porque é uma exigência do controle e não do dado.
   */
  function preencher(raiz, valoresDoCaso) {
    var controles = raiz.querySelectorAll('[data-chave]');
    for (var i = 0; i < controles.length; i++) {
      var chave = controles[i].getAttribute('data-chave');
      var valor = texto(valoresDoCaso[chave]);

      if (controles[i].type === 'date') valor = paraCaixaDeData(valor);
      controles[i].value = valor;

      // Valor que não está entre as opções: o seletor ficaria em branco e a
      // pessoa gravaria vazio sem perceber. Acrescentamos a opção, marcada.
      if (controles[i].tagName === 'SELECT' && valor && controles[i].value !== valor) {
        var solta = document.createElement('option');
        solta.value = valor;
        solta.textContent = valor + ' (fora da lista)';
        controles[i].appendChild(solta);
        controles[i].value = valor;
      }
    }
  }

  function paraCaixaDeData(valor) {
    var brasileira = /^(\d{2})\/(\d{2})\/(\d{4})$/.exec(String(valor || ''));
    if (!brasileira) return valor;
    return brasileira[3] + '-' + brasileira[2] + '-' + brasileira[1];
  }

  /* ---------------------------------------------------------------- erros */

  function limparErros(raiz) {
    var marcados = raiz.querySelectorAll('.campo.com-erro');
    for (var i = 0; i < marcados.length; i++) {
      marcados[i].classList.remove('com-erro');
      var aviso = marcados[i].querySelector('.erro');
      if (aviso) { aviso.hidden = true; aviso.textContent = ''; }
    }
  }

  /**
   * Marca cada campo com o problema dele.
   *
   * O servidor devolve TODOS os problemas de uma vez, e a tela mostra todos.
   * Um erro por vez faria a pessoa corrigir, salvar, descobrir o segundo,
   * corrigir e salvar de novo.
   */
  function mostrarProblemas(raiz, problemas) {
    limparErros(raiz);
    (problemas || []).forEach(function (problema) {
      var caixa = raiz.querySelector('[data-campo="' + problema.campo + '"]');
      if (!caixa) return;
      caixa.classList.add('com-erro');
      var aviso = caixa.querySelector('.erro');
      aviso.textContent = problema.erro;
      aviso.hidden = false;
    });
    var primeiro = raiz.querySelector('.campo.com-erro input, .campo.com-erro select');
    if (primeiro) primeiro.focus();
  }

  return {
    aplicarMascara: aplicarMascara,
    usaMascara: usaMascara,
    desenhar: desenhar,
    ligar: ligar,
    valores: valores,
    preencher: preencher,
    limparErros: limparErros,
    mostrarProblemas: mostrarProblemas
  };
})();
</script>


<!-- ==== CasoEmModal.html ==== -->
<script>
/* ============================================================================
   PGO — CasoEmModal.html · o caso aberto por cima da fila
   ============================================================================
   Clicar em "Ver detalhes" na fila não leva a pessoa para outra tela: abre o
   caso por cima, e fechar devolve a fila exatamente como estava — mesma
   rolagem, mesmo filtro, mesma linha. Sair e voltar faria perder o lugar
   dezenas de vezes por dia.

   O modal tem dois estados, e é o mesmo modal:

     LEITURA  o caso inteiro, campo a campo, com a história embaixo. Campo em
              branco aparece com um travessão — sumir faria a pessoa achar
              que o campo não existe nesta mesa.

     EDIÇÃO   o mesmo formulário de Cadastrar Caso, montado pelo Formulario,
              já preenchido. Com PREFIXO, porque a tela de cadastro pode
              estar atrás e os dois não podem disputar os mesmos ids.

   Fechar com Esc, com o X, com o botão e clicando fora. Quatro saídas: modal
   que prende é modal que a pessoa aprende a não abrir.
   ============================================================================ */

var CasoEmModal = (function () {

  var mesaAtual = '';
  var idAtual = '';
  var detalhe = null;
  var formulario = null;
  var editando = false;
  var salvando = false;
  var aoFechar = null;        // o que a tela quer fazer quando algo mudou
  var mudouAlgo = false;

  function escapar(texto) { return Moldura.escapar(texto); }
  function elemento(id) { return document.getElementById(id); }
  function corpoDaEdicao() { return elemento('corpo-da-edicao'); }

  /* ------------------------------------------------------------- abrir */

  /**
   * Abre o caso. `quandoMudar` é chamado no fim, e só se algo mudou — assim o
   * Dashboard recarrega quando precisa, e fica quieto quando a pessoa só
   * olhou e fechou.
   */
  function abrir(idDaMesa, idDoCaso, quandoMudar, jaEditando) {
    mesaAtual = idDaMesa;
    idAtual = idDoCaso;
    aoFechar = quandoMudar || null;
    editando = !!jaEditando;
    mudouAlgo = false;
    detalhe = null;

    desenharCasca();
    carregar();
  }

  function desenharCasca() {
    fechar(true);

    var caixa = document.createElement('div');
    caixa.className = 'dialogo';
    caixa.id = 'modal-do-caso';
    caixa.innerHTML = '<div class="dialogo-caixa larga" role="dialog"'
      + ' aria-modal="true" aria-labelledby="titulo-do-caso">'
      + '<header class="modal-cabeca">'
      + '<div><h3 id="titulo-do-caso">Caso ' + escapar(idAtual) + '</h3>'
      + '<p id="modal-subtitulo">Abrindo…</p></div>'
      + '<button type="button" class="modal-fechar" id="modal-x"'
      + ' aria-label="Fechar">✕</button>'
      + '</header>'
      + '<div class="modal-corpo" id="modal-corpo">'
      + '<p class="carregando-campos">Abrindo o caso…</p></div>'
      + '<footer class="modal-pe" id="modal-pe"></footer>'
      + '</div>';
    document.body.appendChild(caixa);

    elemento('modal-x').addEventListener('click', function () { fechar(); });
    caixa.addEventListener('mousedown', function (evento) {
      // Só o véu fecha. Um arrasto que começa dentro e termina fora não é
      // "clicar fora" — e fechar ali perderia o que a pessoa digitou.
      if (evento.target === caixa) fechar();
    });
    document.addEventListener('keydown', aoTeclar);
  }

  function aoTeclar(evento) {
    if (!elemento('modal-do-caso')) return;
    if (evento.key === 'Escape') { evento.preventDefault(); fechar(); return; }
    if (editando && (evento.ctrlKey || evento.metaKey) && evento.key === 'Enter') {
      evento.preventDefault();
      salvar();
    }
  }

  function fechar(semAvisar) {
    var caixa = elemento('modal-do-caso');
    if (caixa) caixa.parentNode.removeChild(caixa);
    document.removeEventListener('keydown', aoTeclar);

    if (!semAvisar && mudouAlgo && aoFechar) aoFechar();
    if (!semAvisar) { aoFechar = null; mudouAlgo = false; editando = false; }
  }

  /* ----------------------------------------------------------- carregar */

  function carregar() {
    Servidor.chamar('detalhesDoCaso', mesaAtual, idAtual)
      .entao(function (resposta) {
        detalhe = resposta;
        if (editando) abrirEdicao();
        else desenharLeitura();
      })
      .senao(function (erro) {
        var corpo = elemento('modal-corpo');
        if (!corpo) return;
        corpo.innerHTML = '<p class="carregando-campos erro-carga">'
          + escapar(erro.message || String(erro)) + '</p>';
        elemento('modal-pe').innerHTML = botaoFechar();
        ligarPe();
      });
  }

  /* ------------------------------------------------------------ leitura */

  function desenharLeitura() {
    editando = false;
    elemento('modal-subtitulo').textContent = detalhe.atualizadoEm
      ? 'Atualizado em ' + detalhe.atualizadoEm
      : detalhe.mesa;

    elemento('modal-corpo').innerHTML =
      (detalhe.situacao
        ? '<span class="situacao tom-' + escapar(detalhe.tom) + '">'
          + escapar(detalhe.situacao) + '</span>'
        : '')
      + '<div class="modal-pares">'
      + detalhe.linhas.map(function (linha) {
        return '<div class="par-do-caso">'
          + '<span>' + escapar(linha.rotulo) + '</span>'
          // Travessão, e não vazio: "está em branco" é uma informação.
          + '<strong>' + (linha.valor ? escapar(linha.valor) : '—') + '</strong>'
          + '</div>';
      }).join('')
      + '</div>'
      + desenharHistorico();

    // As quatro ações do caso vivem aqui: as duas da linha, mais alterar
    // situação e excluir. Na fila só cabem duas sem comer uma coluna de dado.
    elemento('modal-pe').innerHTML = botaoFechar()
      + (detalhe.podeOcultar
        ? '<button type="button" class="botao vazado perigo" id="modal-excluir">'
          + Moldura.icone('ocultar') + ' Excluir</button>' : '')
      + (detalhe.podeEditar
        ? '<button type="button" class="botao vazado" id="modal-situacao">'
          + Moldura.icone('trocarSituacao') + ' Alterar situação</button>' : '')
      + (detalhe.podeEditar
        ? '<button type="button" class="botao" id="modal-editar">'
          + Moldura.icone('editar') + ' Editar caso</button>' : '');
    ligarPe();

    var editar = elemento('modal-editar');
    if (editar) editar.addEventListener('click', abrirEdicao);

    var situacao = elemento('modal-situacao');
    if (situacao) {
      situacao.addEventListener('click', function () {
        trocarSituacao(mesaAtual, idAtual, function () {
          mudouAlgo = true;
          carregar();
        });
      });
    }

    var excluir = elemento('modal-excluir');
    if (excluir) excluir.addEventListener('click', function () {
      // O texto diz a verdade: a linha permanece na planilha. Prometer "não
      // poderá ser desfeito" quando dá para desfazer assusta à toa.
      if (!window.confirm('Excluir o caso ' + idAtual + '?\n\n'
        + 'Ele sai do sistema para todo mundo. A linha permanece na planilha '
        + 'e pode ser trazida de volta por um administrador.')) return;

      Servidor.chamar('ocultarCaso', mesaAtual, idAtual)
        .entao(function () { mudouAlgo = true; fechar(); })
        .senao(function (erro) { window.alert(erro.message || String(erro)); });
    });
  }

  function desenharHistorico() {
    if (!detalhe.historico.length) return '';
    return '<section class="historico">'
      + '<h4>Histórico do caso</h4>'
      + '<ul>' + detalhe.historico.map(function (passo) {
        return '<li><strong>' + escapar(passo.acao) + '</strong>'
          + (passo.detalhe ? '<em>' + escapar(passo.detalhe) + '</em>' : '')
          + '<span>' + escapar(passo.quando) + ' · ' + escapar(passo.quem)
          + '</span></li>';
      }).join('') + '</ul></section>';
  }

  /* ------------------------------------------------------------- edição */

  function abrirEdicao() {
    editando = true;
    elemento('modal-corpo').innerHTML =
      '<form class="formulario no-modal" id="form-do-caso" novalidate>'
      + '<div id="corpo-da-edicao"><p class="carregando-campos">'
      + 'Montando o formulário…</p></div></form>';
    elemento('modal-pe').innerHTML =
      '<span class="recado" id="recado-do-modal" hidden></span>'
      + '<button type="button" class="botao vazado" id="modal-desistir">'
      + 'Desistir</button>'
      + '<button type="button" class="botao" id="modal-salvar">'
      + 'Salvar alterações</button>';

    elemento('modal-desistir').addEventListener('click', desenharLeitura);
    elemento('modal-salvar').addEventListener('click', salvar);

    // O formulário e os valores vêm em duas chamadas, e as duas precisam ter
    // chegado antes de preencher — preencher antes de desenhar não escreve
    // em lugar nenhum, e é o tipo de erro que só aparece com a rede lenta.
    Servidor.chamar('formularioDaMesa', mesaAtual)
      .entao(function (definicao) {
        formulario = definicao;
        Servidor.chamar('casoParaEditar', mesaAtual, idAtual)
          .entao(function (caso) {
            var corpo = corpoDaEdicao();
            if (!corpo) return;
            corpo.innerHTML = Formulario.desenhar(formulario, 'editar-');
            Formulario.ligar(corpo, 'editar-');
            Formulario.preencher(corpo, caso.valores);
          })
          .senao(mostrarRecadoDeErro);
      })
      .senao(mostrarRecadoDeErro);
  }

  function mostrarRecadoDeErro(erro) {
    recado(erro.message || String(erro), 'ruim');
    var corpo = corpoDaEdicao();
    if (corpo) corpo.innerHTML = '';
  }

  function recado(texto, tipo) {
    var caixa = elemento('recado-do-modal');
    if (!caixa) return;
    caixa.className = 'recado ' + (tipo || '');
    caixa.textContent = texto;
    caixa.hidden = !texto;
  }

  function salvar() {
    if (salvando) return;
    var corpo = corpoDaEdicao();
    if (!corpo) return;

    salvando = true;
    Formulario.limparErros(corpo);
    recado('Gravando…', '');
    elemento('modal-salvar').disabled = true;

    Servidor.chamar('editarCaso', mesaAtual, idAtual, Formulario.valores(corpo))
      .entao(function () {
        salvando = false;
        mudouAlgo = true;
        var botao = elemento('modal-salvar');
        if (botao) botao.disabled = false;
        carregar();          // volta para a leitura, já com o que foi gravado
      })
      .senao(function (erro) {
        salvando = false;
        var botao = elemento('modal-salvar');
        if (botao) botao.disabled = false;
        recado(erro.message || String(erro), 'ruim');
        if (erro.problemas) Formulario.mostrarProblemas(corpo, erro.problemas);
      });
  }

  function botaoFechar() {
    return '<button type="button" class="botao vazado" id="modal-fechar">'
      + 'Fechar</button>';
  }

  function ligarPe() {
    var botao = elemento('modal-fechar');
    if (botao) botao.addEventListener('click', function () { fechar(); });
  }

  /* ================================================ trocar a situação */

  /**
   * O diálogo de trocar situação, que é o gesto mais frequente da operação.
   *
   * Separado do formulário inteiro de propósito: abrir trinta e cinco campos
   * para mexer num só é atrito que se paga dezenas de vezes por dia.
   */
  function trocarSituacao(idDaMesa, idDoCaso, quandoMudar) {
    Servidor.chamar('situacoesParaTrocar', idDaMesa, idDoCaso)
      .entao(function (resposta) {
        var caixa = document.createElement('div');
        caixa.className = 'dialogo';
        caixa.id = 'dialogo-situacao';
        caixa.innerHTML = '<div class="dialogo-caixa" role="dialog"'
          + ' aria-modal="true" aria-labelledby="titulo-situacao">'
          + '<h3 id="titulo-situacao">Alterar situação</h3>'
          + '<p>Caso ' + escapar(idDoCaso) + '</p>'
          + '<form id="form-situacao">'
          + '<label class="config-campo"><span>Situação</span>'
          + '<select id="situacao-nova">'
          + resposta.opcoes.map(function (opcao) {
            return '<option value="' + escapar(opcao.valor) + '"'
              + (opcao.valor === resposta.atual ? ' selected' : '') + '>'
              + escapar(opcao.rotulo) + '</option>';
          }).join('')
          + '</select></label>'
          + '<p class="dialogo-erro" id="erro-situacao" hidden></p>'
          + '<div class="config-acoes">'
          + '<button type="submit" class="botao">Salvar</button>'
          + '<button type="button" class="botao vazado" id="cancelar-situacao">'
          + 'Cancelar</button></div></form></div>';
        document.body.appendChild(caixa);

        function sair() {
          if (caixa.parentNode) caixa.parentNode.removeChild(caixa);
        }
        elemento('cancelar-situacao').addEventListener('click', sair);
        caixa.addEventListener('mousedown', function (evento) {
          if (evento.target === caixa) sair();
        });

        elemento('form-situacao').addEventListener('submit', function (evento) {
          evento.preventDefault();
          Servidor.chamar('alterarSituacaoDoCaso', idDaMesa, idDoCaso,
            elemento('situacao-nova').value)
            .entao(function () { sair(); if (quandoMudar) quandoMudar(); })
            .senao(function (erro) {
              var aviso = elemento('erro-situacao');
              aviso.textContent = erro.message || String(erro);
              aviso.hidden = false;
            });
        });
      })
      .senao(function (erro) { window.alert(erro.message || String(erro)); });
  }

  return { abrir: abrir, fechar: fechar, trocarSituacao: trocarSituacao };
})();
</script>


<!-- ==== Dashboard.html ==== -->
<script>
/* ============================================================================
   PGO — Dashboard.html · a visão do dia
   ============================================================================
   Cartões em cima, fila embaixo. Os dois vêm da MESMA resposta do servidor,
   já filtrados pelo alcance do nível — e por isso o número do cartão sempre
   bate com o que a fila mostra. Contar de um lado e listar de outro deixaria
   o cartão dizendo 12 e a fila mostrando 7, sem ninguém entender qual está
   certo.
   ============================================================================ */

var TelaDashboard = (function () {

  var mesaEscolhida = '';
  var filtrosEscolhidos = {};
  var resumo = null;

  function escapar(texto) { return Moldura.escapar(texto); }
  function elemento(id) { return document.getElementById(id); }

  /* --------------------------------------------------------------- montar */

  function montar(pacote) {
    if (!mesaEscolhida && pacote.mesas.length) mesaEscolhida = pacote.mesas[0].id;
    return SeletorDeMesa.montar(pacote.mesas, mesaEscolhida)
      + '<div id="painel"><p class="carregando-campos">Somando os casos…</p></div>';
  }

  /**
   * A variação em relação ao período anterior.
   * Quando não há base de comparação, o espaço fica vazio — inventar "+100%"
   * porque saiu de zero é ruído que a operação aprende a ignorar.
   */
  function variacao(cartao) {
    if (cartao.variacao === null || cartao.variacao === undefined) {
      // Espaço reservado para os cartões ficarem da mesma altura, mas em
      // branco: repetir "sem base" em cada um vira ruído e parece erro.
      return '<span class="variacao vazia" aria-hidden="true">—</span>';
    }
    var subiu = cartao.variacao >= 0;
    return '<span class="variacao ' + (subiu ? 'subiu' : 'desceu') + '">'
      + (subiu ? '▲' : '▼') + ' ' + Math.abs(cartao.variacao) + '%'
      + '<em>vs. período anterior</em></span>';
  }

  /**
   * Os cartões. Clicar num deles filtra a fila por aquela situação — é o
   * gesto que a tela existe para atender: "é isso que eu tenho de trabalhar".
   */
  function desenharCartoes() {
    return '<div class="cartoes">'
      + resumo.cartoes.map(function (cartao) {
        var filtravel = cartao.chave !== 'total' && cartao.chave !== 'naCelula'
          && resumo.filtrosDisponiveis.some(function (f) { return f.chave === 'status'; });
        var ligado = filtravel
          && normalizarTexto(filtrosEscolhidos.status) === normalizarTexto(cartao.rotulo);

        return '<' + (filtravel ? 'button type="button"' : 'div')
          + ' class="indicador tom-' + escapar(cartao.tom || 'neutro')
          + (filtravel ? ' clicavel' : '') + (ligado ? ' ligado' : '') + '"'
          + (filtravel ? ' data-situacao="' + escapar(cartao.rotulo) + '"' : '')
          + (cartao.explicacao ? ' title="' + escapar(cartao.explicacao) + '"'
            : (filtravel ? ' title="Filtrar a fila por ' + escapar(cartao.rotulo) + '"' : ''))
          + '><span class="rotulo">' + escapar(cartao.rotulo) + '</span>'
          + '<strong class="numero">' + cartao.valor + '</strong>'
          + variacao(cartao)
          + '</' + (filtravel ? 'button' : 'div') + '>';
      }).join('')
      + '</div>';
  }

  function normalizarTexto(texto) {
    return String(texto === null || texto === undefined ? '' : texto)
      .normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase().trim();
  }

  function desenharFiltros() {
    if (!resumo.filtrosDisponiveis.length) return '';

    var caixas = resumo.filtrosDisponiveis.map(function (filtro) {
      var opcoes = ['<option value="">Todos — ' + escapar(filtro.rotulo) + '</option>'];
      filtro.opcoes.forEach(function (opcao) {
        var marcado = filtrosEscolhidos[filtro.chave] === opcao.valor
          ? ' selected' : '';
        opcoes.push('<option value="' + escapar(opcao.valor) + '"' + marcado + '>'
          + escapar(opcao.rotulo) + '</option>');
      });
      return '<select class="filtro" data-filtro="' + escapar(filtro.chave) + '"'
        + ' aria-label="Filtrar por ' + escapar(filtro.rotulo) + '">'
        + opcoes.join('') + '</select>';
    });

    var algumAtivo = Object.keys(filtrosEscolhidos).some(function (chave) {
      return filtrosEscolhidos[chave];
    });

    return '<div class="filtros">' + caixas.join('')
      + (algumAtivo
        ? '<button type="button" class="limpar-filtros" id="limpar-filtros">'
          + 'Limpar filtros</button>'
        : '')
      + '<span class="contagem">' + resumo.total + ' de ' + resumo.totalNoPeriodo
      + ' casos · ' + escapar(resumo.periodo.rotulo) + '</span>'
      + '</div>';
  }

  function desenharFila() {
    if (!resumo.fila.length) {
      return '<div class="cartao vazio">'
        + '<strong>Nenhum caso para mostrar aqui.</strong>'
        + '<p>' + (resumo.totalNoPeriodo
          ? 'Há ' + resumo.totalNoPeriodo + ' casos no período, mas nenhum passa '
            + 'pelos filtros escolhidos.'
          : 'Nada foi registrado nos ' + resumo.periodo.dias + ' dias mais recentes. '
            + 'Para casos antigos, use Buscar Caso.') + '</p></div>';
    }

    var cabecalho = resumo.colunas.map(function (grupo) {
      return '<th>' + escapar(grupo.titulo) + '</th>';
    }).join('') + '<th class="acoes-coluna">Ações</th>';

    var linhas = resumo.fila.map(function (caso) {
      var celulas = caso.celulas.map(function (grupo, i) {
        return '<td>' + desenharGrupo(grupo, caso, i === 0) + '</td>';
      }).join('');

      return '<tr>' + celulas + '<td class="acoes-coluna">'
        + acoesDaLinha(caso) + '</td></tr>';
    }).join('');

    return '<div class="cartao sem-forro">'
      + '<div class="rolagem-tabela"><table class="fila agrupada">'
      + '<thead><tr>' + cabecalho + '</tr></thead>'
      + '<tbody>' + linhas + '</tbody></table></div></div>';
  }

  /**
   * Um grupo de colunas dentro de uma célula.
   *
   * A primeira linha do grupo é a que salta — é o que a pessoa procura ao
   * varrer a fila: o protocolo, o nome do cliente. As de baixo vêm menores,
   * porque são o que ela confere depois de já ter achado a linha.
   */
  function desenharGrupo(grupo, caso, ehOPrimeiro) {
    return grupo.map(function (celula, i) {
      if (celula.ehStatus) {
        return '<span class="situacao tom-' + escapar(caso.tom || 'neutro') + '">'
          + escapar(celula.valor || '—') + '</span>';
      }
      var classe = (i === 0 && !ehOPrimeiro) ? 'principal' : 'apoio';
      return '<span class="' + classe + '" title="' + escapar(celula.cabecalho)
        + '">' + escapar(celula.valor || '—') + '</span>';
    }).join('');
  }

  /**
   * As ações da linha: ver e editar, e só.
   *
   * Alterar situação e excluir moram no rodapé do modal. Quatro botões por
   * linha, repetidos trinta vezes, tomavam a largura de uma coluna inteira de
   * dado — e a coluna que sumia era "Responsável". Duas ações na linha, as
   * outras a um clique, cabem e continuam à mão.
   */
  function acoesDaLinha(caso) {
    var botoes = '<button type="button" class="acao" data-caso="'
      + escapar(caso.id) + '">' + Moldura.icone('olho') + ' Ver detalhes</button>';

    if (resumo.podeEditar) {
      botoes += '<button type="button" class="acao-icone" data-editar="'
        + escapar(caso.id) + '" title="Editar caso" aria-label="Editar caso">'
        + Moldura.icone('editar') + '</button>';
    }
    return botoes;
  }

  function desenharPainel() {
    // O aviso mora no ALTO, e não junto da fila, porque não é só a fila que
    // está parcial: os cartões contam o mesmo recorte. O texto antigo, colado
    // na fila, dava a entender que os números em cima estavam completos.
    elemento('painel').innerHTML =
      Moldura.avisoDeJanela(resumo, 'Estes números e esta fila')
      + desenharCartoes() + desenharFiltros() + desenharFila();
    ligarPainel();
  }

  /* ---------------------------------------------------------- comportamento */

  function carregar() {
    var painel = elemento('painel');
    if (painel) painel.innerHTML = '<p class="carregando-campos">Somando os casos…</p>';

    Servidor.chamar('resumoDaMesa', mesaEscolhida, filtrosEscolhidos)
      .entao(function (resposta) {
        resumo = resposta;
        desenharPainel();
      })
      .senao(function (erro) {
        elemento('painel').innerHTML = '<p class="carregando-campos erro-carga">'
          + escapar(erro.message || String(erro)) + '</p>';
      });
  }

  function ligarPainel() {
    var caixas = document.querySelectorAll('.filtro');
    for (var i = 0; i < caixas.length; i++) {
      caixas[i].addEventListener('change', function () {
        filtrosEscolhidos[this.getAttribute('data-filtro')] = this.value;
        carregar();
      });
    }

    var limpar = elemento('limpar-filtros');
    if (limpar) {
      limpar.addEventListener('click', function () {
        filtrosEscolhidos = {};
        carregar();
      });
    }

    var cartoes = document.querySelectorAll('.indicador.clicavel');
    for (var c = 0; c < cartoes.length; c++) {
      cartoes[c].addEventListener('click', function () {
        var situacao = this.getAttribute('data-situacao');
        // Clicar de novo no mesmo cartão desliga o filtro.
        filtrosEscolhidos.status =
          (filtrosEscolhidos.status === situacao) ? '' : situacao;
        carregar();
      });
    }

    ligarCliques('[data-caso]', function (botao) {
      CasoEmModal.abrir(mesaEscolhida, botao.getAttribute('data-caso'), carregar);
    });
    ligarCliques('[data-editar]', function (botao) {
      CasoEmModal.abrir(mesaEscolhida, botao.getAttribute('data-editar'),
        carregar, true);
    });
  }

  function ligarCliques(seletor, oQueFazer) {
    var botoes = document.querySelectorAll(seletor);
    for (var i = 0; i < botoes.length; i++) {
      botoes[i].addEventListener('click', function () { oQueFazer(this); });
    }
  }

  function ocultar(idDoCaso) {
    // Some da tela de todo mundo, e por isso vale perguntar. O texto diz a
    // verdade: a linha permanece na planilha. Prometer "não poderá ser
    // desfeito" quando dá para desfazer assusta à toa.
    if (!window.confirm('Excluir o caso ' + idDoCaso + '?\n\n'
      + 'Ele sai do sistema para todo mundo. A linha permanece na planilha e '
      + 'pode ser trazida de volta por um administrador.')) return;

    Servidor.chamar('ocultarCaso', mesaEscolhida, idDoCaso)
      .entao(carregar)
      .senao(function (erro) { window.alert(erro.message || String(erro)); });
  }

  function ligar(pacote) {
    SeletorDeMesa.ligar(function (idDaMesa) {
      mesaEscolhida = idDaMesa;
      filtrosEscolhidos = {};
      Aplicacao.remontar();
    });
    carregar();
  }

  return { montar: montar, ligar: ligar };
})();
</script>


<!-- ==== BuscarCaso.html ==== -->
<script>
/* ============================================================================
   PGO — BuscarCaso.html · achar um caso que a fila não mostra mais
   ============================================================================
   O Dashboard mostra os últimos 30 dias, de propósito. Quando o cliente liga
   citando um protocolo de abril, é aqui que se procura.

   A tela é uma caixa de busca e nada mais até alguém procurar algo. Não
   carrega lista, não pré-carrega base: abrir esta tela não custa nada, e é
   por isso que dá para deixá-la aberta o dia inteiro.

   O resultado vem separado POR ORIGEM — cada mesa, e a base legada — porque
   um caso da Mesa Diamante e uma linha do sistema antigo não são a mesma
   coisa e não devem aparecer misturados numa lista só.
   ============================================================================ */

var TelaBuscarCaso = (function () {

  var opcoes = null;
  var mesasEscolhidas = {};     // id → true
  var incluirLegado = false;
  var procurando = false;
  var ultimoTermo = '';

  function escapar(texto) { return Moldura.escapar(texto); }
  function elemento(id) { return document.getElementById(id); }

  /* --------------------------------------------------------------- montar */

  function montar() {
    return '<div class="cartao busca-caixa">'
      + '<form id="form-da-busca" novalidate>'
      + '<div class="busca-linha">'
      + '<input type="search" id="termo-da-busca" autocomplete="off"'
      + ' placeholder="Protocolo, apólice, proposta, CPF ou nome"'
      + ' aria-label="O que procurar">'
      + '<button type="submit" class="botao" id="botao-buscar">'
      + Moldura.icone('buscarCaso') + ' Buscar</button>'
      + '</div>'
      + '<div id="onde-procurar" class="busca-onde"></div>'
      + '</form></div>'
      + '<div id="resultado-da-busca"></div>';
  }

  function desenharOnde() {
    var caixas = opcoes.mesas.map(function (mesa) {
      return '<label class="config-chave">'
        + '<input type="checkbox" data-mesa-da-busca="' + escapar(mesa.id) + '"'
        + (mesasEscolhidas[mesa.id] ? ' checked' : '') + '>'
        + '<span>' + escapar(mesa.nome)
        + '<em>procura em: ' + escapar(mesa.procuraEm.join(', ') || 'nada declarado')
        + '</em></span></label>';
    });

    if (opcoes.legado.ligado) {
      caixas.push('<label class="config-chave">'
        + '<input type="checkbox" id="incluir-legado"'
        + (incluirLegado ? ' checked' : '') + '>'
        + '<span>' + escapar(opcoes.legado.rotulo)
        + '<em>a planilha do sistema anterior, em leitura</em></span></label>');
    }

    elemento('onde-procurar').innerHTML = '<span class="busca-rotulo">'
      + 'Onde procurar</span>' + caixas.join('')
      + (opcoes.legado.ligado ? ''
        : '<span class="busca-dica">Não há base legada apontada. '
          + 'Um administrador aponta em Configurações → Estrutura.</span>');

    ligarOnde();
  }

  function ligarOnde() {
    var caixas = document.querySelectorAll('[data-mesa-da-busca]');
    for (var i = 0; i < caixas.length; i++) {
      caixas[i].addEventListener('change', function () {
        mesasEscolhidas[this.getAttribute('data-mesa-da-busca')] = this.checked;
      });
    }
    var legado = elemento('incluir-legado');
    if (legado) {
      legado.addEventListener('change', function () { incluirLegado = this.checked; });
    }
  }

  /* -------------------------------------------------------------- procurar */

  function procurar() {
    if (procurando) return;
    var termo = elemento('termo-da-busca').value.trim();
    ultimoTermo = termo;

    var onde = [];
    Object.keys(mesasEscolhidas).forEach(function (id) {
      if (mesasEscolhidas[id]) onde.push(id);
    });

    procurando = true;
    elemento('botao-buscar').disabled = true;
    elemento('resultado-da-busca').innerHTML =
      '<p class="carregando-campos">Procurando…</p>';

    Servidor.chamar('buscarCasos', termo, onde, incluirLegado)
      .entao(function (resposta) {
        procurando = false;
        elemento('botao-buscar').disabled = false;
        desenharResultado(resposta);
      })
      .senao(function (erro) {
        procurando = false;
        elemento('botao-buscar').disabled = false;
        elemento('resultado-da-busca').innerHTML =
          '<div class="cartao vazio"><strong>'
          + escapar(erro.message || String(erro)) + '</strong></div>';
      });
  }

  function desenharResultado(resposta) {
    if (!resposta.total) {
      elemento('resultado-da-busca').innerHTML = '<div class="cartao vazio">'
        + '<strong>Nada encontrado para "' + escapar(resposta.termo) + '".</strong>'
        + '<p>Procurei em: ' + escapar(resposta.origens.map(function (origem) {
          return origem.nome;
        }).join(', ')) + '. A comparação ignora pontos e traços, então '
        + '<code>123.456.789-01</code> e <code>12345678901</code> acham a mesma '
        + 'coisa. Se o caso é antigo e não está aqui, ele pode estar na base '
        + 'legada — marque-a acima.</p>'
        + avisosDe(resposta.origens) + '</div>';
      return;
    }

    elemento('resultado-da-busca').innerHTML =
      '<p class="busca-contagem">' + resposta.total + ' caso(s) para "'
      + escapar(resposta.termo) + '"</p>'
      + resposta.origens.map(desenharOrigem).join('');
    ligarResultado();
  }

  function avisosDe(origens) {
    return origens.filter(function (origem) { return origem.aviso; })
      .map(function (origem) {
        return '<p class="aviso-fila">' + escapar(origem.nome) + ': '
          + escapar(origem.aviso) + '</p>';
      }).join('');
  }

  function desenharOrigem(origem) {
    var cabeca = '<header class="origem-cabeca">'
      + (origem.icone ? SeletorDeMesa.icone(origem.icone) : '')
      + '<h3>' + escapar(origem.nome) + '</h3>'
      + '<span class="quantos">' + origem.casos.length + '</span>'
      + (origem.somenteLeitura
        ? '<span class="etiqueta-leitura">só leitura</span>' : '')
      + '</header>';

    if (!origem.casos.length) {
      return '<section class="cartao origem vazia">' + cabeca
        + '<p>' + (origem.aviso
          ? escapar(origem.aviso)
          : 'Nada encontrado aqui.') + '</p></section>';
    }

    return '<section class="cartao sem-forro origem">' + cabeca
      + (origem.aviso
        ? '<p class="aviso-fila">' + escapar(origem.aviso) + '</p>' : '')
      + (origem.tipo === 'legado'
        ? tabelaDoLegado(origem) : tabelaDaMesa(origem))
      + '</section>';
  }

  function tabelaDaMesa(origem) {
    var cabecalho = origem.colunas.map(function (grupo) {
      return '<th>' + escapar(grupo.titulo) + '</th>';
    }).join('') + '<th class="acoes-coluna">Ações</th>';

    var linhas = origem.casos.map(function (caso) {
      var celulas = caso.celulas.map(function (grupo, i) {
        return '<td>' + grupo.map(function (celula, j) {
          if (celula.ehStatus) {
            return '<span class="situacao tom-' + escapar(caso.tom || 'neutro')
              + '">' + escapar(celula.valor || '—') + '</span>';
          }
          var classe = (j === 0 && i !== 0) ? 'principal' : 'apoio';
          return '<span class="' + classe + '">'
            + escapar(celula.valor || '—') + '</span>';
        }).join('') + '</td>';
      }).join('');

      return '<tr>' + celulas + '<td class="acoes-coluna">'
        + '<button type="button" class="acao" data-achado="'
        + escapar(caso.id) + '" data-mesa="' + escapar(origem.id) + '">'
        + Moldura.icone('olho') + ' Ver detalhes</button></td></tr>';
    }).join('');

    return '<div class="rolagem-tabela"><table class="fila agrupada">'
      + '<thead><tr>' + cabecalho + '</tr></thead>'
      + '<tbody>' + linhas + '</tbody></table></div>';
  }

  /**
   * A tabela do legado é outra coisa: não temos contrato sobre aquela
   * planilha, então mostramos as colunas que ela tiver, com os nomes que ela
   * usa. E sem botão de abrir — uma linha de histórico não é um caso do
   * sistema, e prometer edição ali seria mentira.
   */
  function tabelaDoLegado(origem) {
    var cabecalho = origem.cabecalhos.map(function (nome) {
      return '<th>' + escapar(nome) + '</th>';
    }).join('');

    var linhas = origem.casos.map(function (caso) {
      return '<tr>' + caso.celulas[0].map(function (celula) {
        return '<td>' + escapar(celula.valor || '—') + '</td>';
      }).join('') + '</tr>';
    }).join('');

    return '<p class="aviso-fila">Estas linhas vêm da planilha do sistema '
      + 'anterior, como ela está. Elas não abrem nem se editam por aqui.</p>'
      + '<div class="rolagem-tabela"><table class="fila legado">'
      + '<thead><tr>' + cabecalho + '</tr></thead>'
      + '<tbody>' + linhas + '</tbody></table></div>';
  }

  function ligarResultado() {
    var botoes = document.querySelectorAll('[data-achado]');
    for (var i = 0; i < botoes.length; i++) {
      botoes[i].addEventListener('click', function () {
        var mesa = this.getAttribute('data-mesa');
        var caso = this.getAttribute('data-achado');
        // O mesmo modal do Dashboard: quem acha um caso aqui quer as mesmas
        // ações que teria lá, e aprender duas telas para o mesmo caso é uma
        // a mais do que o necessário.
        CasoEmModal.abrir(mesa, caso, function () {
          if (ultimoTermo) procurar();
        });
      });
    }
  }

  /* ---------------------------------------------------------------- ligar */

  function ligar() {
    elemento('form-da-busca').addEventListener('submit', function (evento) {
      evento.preventDefault();
      procurar();
    });

    Servidor.chamar('opcoesDaBusca')
      .entao(function (resposta) {
        opcoes = resposta;
        // Todas as mesas marcadas por padrão: quem procura um protocolo
        // raramente sabe de antemão em qual mesa ele está.
        opcoes.mesas.forEach(function (mesa) { mesasEscolhidas[mesa.id] = true; });
        desenharOnde();
        elemento('termo-da-busca').focus();
      })
      .senao(function (erro) {
        elemento('onde-procurar').innerHTML =
          '<span class="busca-dica erro-carga">'
          + escapar(erro.message || String(erro)) + '</span>';
      });
  }

  return { montar: montar, ligar: ligar };
})();
</script>


<!-- ==== Graficos.html ==== -->
<script>
/* ============================================================================
   PGO — Graficos.html · os desenhos, num lugar só
   ============================================================================
   Duas telas desenham gráficos: o Painel Analítico e Minha Performance. Elas
   não têm duas cópias disto — pela mesma razão que já custou caro aqui:
   regra copiada em dois lugares é regra que um dia diverge, e num gráfico a
   divergência não dá erro. Vira uma barra um pouco mais alta do que devia, e
   alguém decide alguma coisa com base nela.

   SVG escrito à mão, sem biblioteca de fora: o Apps Script serve a página num
   quadro isolado, e cada dependência externa é mais um ponto que pode não
   carregar. Gráfico que não carrega é pior que gráfico nenhum — deixa um
   buraco na tela.

   TRÊS REGRAS DE LEITURA, e todas têm motivo:

     UM EIXO SÓ. "Barras com linha" não são duas escalas. A linha é a média
     móvel da própria barra, na mesma altura: ela mostra a tendência por cima
     do ruído do dia a dia. Dois eixos fariam a mesma altura significar duas
     coisas — é o erro de gráfico mais comum que existe.

     COR PARA IDENTIDADE, TOM ÚNICO PARA MAGNITUDE. A pizza responde "de que
     tipo são" e usa cores; as barras respondem "quanto de cada" e usam um tom
     só. Seis cores para dizer "quanto" enterra a informação.

     O NÚMERO SEMPRE VISÍVEL. Todo desenho traz rótulo direto, e quem chama
     oferece a tabela por baixo. Cor é a segunda leitura, nunca a única — nem
     todo mundo enxerga cor, e nenhuma tela de trabalho pode depender disso.

   O QUE ENTRA: um "componente" no formato que o servidor devolve —
   { titulo, tipo, largura, unidade, agregacao, pontos:[{chave, rotulo, valor,
   casos, tom, serie, ehOutros}], tendencia }.
   ============================================================================ */

var Graficos = (function () {

  function escapar(texto) { return Moldura.escapar(texto); }

  function numero(valor, unidade) {
    if (unidade === 'dinheiro') {
      return 'R$ ' + (Math.round(valor * 100) / 100)
        .toFixed(2).replace('.', ',').replace(/\B(?=(\d{3})+(?!\d))/g, '.');
    }
    var arredondado = Math.round(valor * 100) / 100;
    return String(arredondado).replace('.', ',');
  }

  function porcento(parte, todo) {
    if (!todo) return '0%';
    return Math.round((parte / todo) * 100) + '%';
  }

  /* --------------------------------------------------------------- montar */

  function classeDoPonto(ponto) {
    if (ponto.tom) return 'tom-' + ponto.tom;
    if (ponto.serie) return 'serie-' + ponto.serie;
    return 'serie-magnitude';
  }

  function dica(componente, ponto) {
    return escapar(ponto.rotulo) + ': '
      + escapar(numero(ponto.valor, componente.unidade))
      + (componente.agregacao === 'contagem' ? ' caso(s)'
        : ' · ' + ponto.casos + ' caso(s)');
  }

  /* -- pizza --------------------------------------------------------------- */

  /**
   * Rosca, e não pizza cheia: o buraco do meio recebe o total, que é o número
   * que a pessoa procura primeiro. Cada fatia tem um anel da cor do fundo em
   * volta, para duas fatias vizinhas nunca se fundirem numa só mancha.
   */
  function desenharPizza(componente) {
    var total = componente.pontos.reduce(function (soma, ponto) {
      return soma + ponto.valor;
    }, 0);
    if (!total) return '<p class="grafico-vazio">Tudo zerado no período.</p>';

    var centro = 92;
    var raio = 76;
    var buraco = 46;
    var anguloAtual = -Math.PI / 2;   // começa no topo

    var fatias = componente.pontos.map(function (ponto) {
      var fracao = ponto.valor / total;
      var angulo = fracao * Math.PI * 2;
      var caminho = arcoDaRosca(centro, centro, raio, buraco, anguloAtual,
        anguloAtual + angulo);
      anguloAtual += angulo;

      return '<path d="' + caminho + '" class="fatia ' + classeDoPonto(ponto) + '"'
        + ' data-ponto="' + escapar(ponto.chave) + '"'
        + ' data-dica="' + dica(componente, ponto) + '"'
        + ' tabindex="0" role="button"'
        + ' aria-label="' + dica(componente, ponto) + '"></path>';
    }).join('');

    var legenda = componente.pontos.map(function (ponto) {
      return '<button type="button" class="legenda-item" data-ponto="'
        + escapar(ponto.chave) + '">'
        + '<span class="marca ' + classeDoPonto(ponto) + '"></span>'
        + '<span class="nome">' + escapar(ponto.rotulo) + '</span>'
        + '<span class="valor">' + escapar(numero(ponto.valor, componente.unidade))
        + '<em>' + porcento(ponto.valor, total) + '</em></span></button>';
    }).join('');

    return '<div class="grafico-corpo pizza">'
      + '<svg viewBox="0 0 184 184" class="desenho" role="img"'
      + ' aria-label="' + escapar(componente.titulo) + '">'
      + fatias
      + '<text x="92" y="86" class="rosca-numero">' + total + '</text>'
      + '<text x="92" y="104" class="rosca-rotulo">no total</text>'
      + '</svg>'
      + '<div class="legenda">' + legenda + '</div></div>';
  }

  /** O caminho de uma fatia de rosca, em coordenadas de SVG. */
  function arcoDaRosca(cx, cy, raio, buraco, de, ate) {
    // Uma fatia que é o círculo inteiro não pode fechar em si mesma, ou o
    // navegador não desenha nada. Tiramos um fio de grau dela.
    if (ate - de >= Math.PI * 2) ate = de + Math.PI * 2 - 0.001;

    var grande = (ate - de) > Math.PI ? 1 : 0;
    var x1 = cx + raio * Math.cos(de), y1 = cy + raio * Math.sin(de);
    var x2 = cx + raio * Math.cos(ate), y2 = cy + raio * Math.sin(ate);
    var x3 = cx + buraco * Math.cos(ate), y3 = cy + buraco * Math.sin(ate);
    var x4 = cx + buraco * Math.cos(de), y4 = cy + buraco * Math.sin(de);

    return 'M ' + x1.toFixed(2) + ' ' + y1.toFixed(2)
      + ' A ' + raio + ' ' + raio + ' 0 ' + grande + ' 1 '
      + x2.toFixed(2) + ' ' + y2.toFixed(2)
      + ' L ' + x3.toFixed(2) + ' ' + y3.toFixed(2)
      + ' A ' + buraco + ' ' + buraco + ' 0 ' + grande + ' 0 '
      + x4.toFixed(2) + ' ' + y4.toFixed(2) + ' Z';
  }

  /* -- barras em pé -------------------------------------------------------- */

  function desenharBarras(componente) {
    var maior = maiorValor(componente.pontos);
    var largura = larguraDoDesenho(componente);
    var altura = 240;
    var pe = 46;          // espaço do rótulo embaixo
    var topo = 22;        // espaço do número em cima
    var faixa = largura / componente.pontos.length;
    var grossura = Math.min(faixa - 10, 64);

    var barras = componente.pontos.map(function (ponto, i) {
      var alto = maior ? (ponto.valor / maior) * (altura - pe - topo) : 0;
      var x = i * faixa + (faixa - grossura) / 2;
      var y = altura - pe - alto;

      return '<g class="barra ' + classeDoPonto(ponto) + '"'
        + ' data-ponto="' + escapar(ponto.chave) + '"'
        + ' data-dica="' + dica(componente, ponto) + '"'
        + ' tabindex="0" role="button"'
        + ' aria-label="' + dica(componente, ponto) + '">'
        + '<rect x="' + x.toFixed(1) + '" y="' + y.toFixed(1) + '"'
        + ' width="' + grossura.toFixed(1) + '" height="'
        + Math.max(alto, 2).toFixed(1) + '" rx="4"></rect>'
        + '<text x="' + (x + grossura / 2).toFixed(1) + '" y="'
        + (y - 7).toFixed(1) + '" class="valor-da-barra">'
        + escapar(numero(ponto.valor, componente.unidade)) + '</text>'
        + '<text x="' + (x + grossura / 2).toFixed(1) + '" y="'
        + (altura - pe + 18) + '" class="rotulo-da-barra">'
        + escapar(encurtar(ponto.rotulo, 14)) + '</text>'
        + '</g>';
    }).join('');

    return '<div class="grafico-corpo">'
      + '<svg viewBox="0 0 ' + largura + ' ' + altura + '" class="desenho"'
      + ' role="img" aria-label="' + escapar(componente.titulo) + '">'
      + '<line x1="0" y1="' + (altura - pe) + '" x2="' + largura + '" y2="'
      + (altura - pe) + '" class="regua"></line>'
      + barras + '</svg></div>';
  }

  /* -- barras deitadas ----------------------------------------------------- */

  /**
   * Deitadas porque o rótulo é comprido. Em pé, "Aumento do prêmio na
   * renovação" vira uma escadinha ilegível ou é cortado no meio.
   */
  function desenharBarrasDeitadas(componente) {
    var maior = maiorValor(componente.pontos);
    var largura = larguraDoDesenho(componente);
    var alturaDaLinha = 34;
    var altura = componente.pontos.length * alturaDaLinha + 8;
    var areaDoRotulo = componente.largura === 2 ? 240 : 152;
    var areaDoValor = 62;
    var comprimentoMaximo = largura - areaDoRotulo - areaDoValor;

    var barras = componente.pontos.map(function (ponto, i) {
      var comprimento = maior ? (ponto.valor / maior) * comprimentoMaximo : 0;
      var y = i * alturaDaLinha + 8;

      return '<g class="barra deitada ' + classeDoPonto(ponto) + '"'
        + ' data-ponto="' + escapar(ponto.chave) + '"'
        + ' data-dica="' + dica(componente, ponto) + '"'
        + ' tabindex="0" role="button"'
        + ' aria-label="' + dica(componente, ponto) + '">'
        + '<text x="' + (areaDoRotulo - 10) + '" y="' + (y + 14)
        + '" class="rotulo-deitado">'
        + escapar(encurtar(ponto.rotulo, componente.largura === 2 ? 38 : 22))
        + '</text>'
        + '<rect x="' + areaDoRotulo + '" y="' + y + '" width="'
        + Math.max(comprimento, 2).toFixed(1) + '" height="18" rx="4"></rect>'
        + '<text x="' + (areaDoRotulo + Math.max(comprimento, 2) + 8).toFixed(1)
        + '" y="' + (y + 14) + '" class="valor-deitado">'
        + escapar(numero(ponto.valor, componente.unidade)) + '</text>'
        + '</g>';
    }).join('');

    return '<div class="grafico-corpo">'
      + '<svg viewBox="0 0 ' + largura + ' ' + altura + '" class="desenho"'
      + ' role="img" aria-label="' + escapar(componente.titulo) + '">'
      + barras + '</svg></div>';
  }

  /* -- linha, e barras com linha ------------------------------------------- */

  function desenharLinha(componente, comBarras) {
    var pontos = componente.pontos;
    var maior = maiorValor(pontos);
    var largura = larguraDoDesenho(componente);
    var altura = componente.largura === 2 ? 300 : 240;
    var pe = 40;
    var topo = 20;
    var faixa = pontos.length > 1 ? largura / pontos.length : largura;

    function xDe(i) { return i * faixa + faixa / 2; }
    function yDe(valor) {
      return altura - pe - (maior ? (valor / maior) * (altura - pe - topo) : 0);
    }

    var barras = '';
    if (comBarras) {
      var grossura = Math.min(faixa - 6, 34);
      barras = pontos.map(function (ponto, i) {
        var y = yDe(ponto.valor);
        return '<rect class="barra-de-fundo" x="'
          + (xDe(i) - grossura / 2).toFixed(1) + '" y="' + y.toFixed(1)
          + '" width="' + grossura.toFixed(1) + '" height="'
          + Math.max(altura - pe - y, 2).toFixed(1) + '" rx="4"></rect>';
      }).join('');
    }

    var serie = comBarras ? componente.tendencia : pontos;
    var caminho = serie.map(function (ponto, i) {
      return (i ? 'L' : 'M') + xDe(i).toFixed(1) + ' ' + yDe(ponto.valor).toFixed(1);
    }).join(' ');

    // Só alguns rótulos no eixo: um por ponto vira uma parede de texto em 30
    // dias, e nenhum deles é lido.
    var deQuantosEm = Math.max(1, Math.ceil(pontos.length / 8));
    var ultimo = pontos.length - 1;
    // O último rótulo entra sempre — menos quando cairia em cima do vizinho
    // que já foi desenhado. Duas datas sobrepostas não são duas datas: são
    // um borrão que não se lê.
    var cabeOUltimo = (ultimo % deQuantosEm) === 0
      || (ultimo - (ultimo - (ultimo % deQuantosEm))) >= deQuantosEm / 2;
    var rotulos = pontos.map(function (ponto, i) {
      if (i % deQuantosEm !== 0 && !(i === ultimo && cabeOUltimo)) return '';
      return '<text x="' + xDe(i).toFixed(1) + '" y="' + (altura - pe + 18)
        + '" class="rotulo-da-barra">' + escapar(ponto.rotulo) + '</text>';
    }).join('');

    var marcas = pontos.map(function (ponto, i) {
      return '<g class="ponto-da-linha" data-ponto="' + escapar(ponto.chave) + '"'
        + ' data-dica="' + dica(componente, ponto) + '"'
        + ' tabindex="0" role="button"'
        + ' aria-label="' + dica(componente, ponto) + '">'
        // Alvo invisível e largo: acertar um círculo de 5px com o mouse é
        // uma tarefa, e ninguém deveria ter de mirar num gráfico.
        + '<rect class="alvo" x="' + (xDe(i) - faixa / 2).toFixed(1) + '" y="0"'
        + ' width="' + faixa.toFixed(1) + '" height="' + (altura - pe) + '"></rect>'
        + '<circle cx="' + xDe(i).toFixed(1) + '" cy="'
        + yDe(ponto.valor).toFixed(1) + '" r="5" class="marcador"></circle>'
        + '</g>';
    }).join('');

    return '<div class="grafico-corpo">'
      + '<svg viewBox="0 0 ' + largura + ' ' + altura + '" class="desenho"'
      + ' role="img" aria-label="' + escapar(componente.titulo) + '">'
      + '<line x1="0" y1="' + (altura - pe) + '" x2="' + largura + '" y2="'
      + (altura - pe) + '" class="regua"></line>'
      + barras
      + '<path d="' + caminho + '" class="linha-do-grafico"></path>'
      + marcas + rotulos + '</svg>'
      + (comBarras
        ? '<p class="grafico-legenda-linha">As barras são o dia; a linha é a '
          + '<strong>média dos 7 dias anteriores</strong>, na mesma escala — '
          + 'ela mostra a tendência por cima do sobe e desce do dia a dia.</p>'
        : '')
      + '</div>';
  }

  /**
   * A largura do desenho, em unidades do viewBox.
   *
   * O cartão largo recebe um desenho largo, e não o mesmo desenho esticado:
   * esticado, um gráfico de 480 por 240 num cartão de 1200px fica com 600px
   * de altura e letras do tamanho de um título. A proporção tem de nascer
   * certa, não ser corrigida depois.
   */
  function larguraDoDesenho(componente) {
    return componente.largura === 2 ? 960 : 480;
  }

  function maiorValor(pontos) {
    return pontos.reduce(function (maior, ponto) {
      return Math.max(maior, ponto.valor);
    }, 0);
  }

  function encurtar(texto, quantos) {
    var limpo = String(texto || '');
    return limpo.length > quantos ? limpo.substring(0, quantos - 1) + '…' : limpo;
  }

  /* --------------------------------------------------------- comportamento */

  /* --------------------------------------------------------- a porta única */

  /** O desenho de um componente, seja ele qual for. */
  function desenhar(componente) {
    if (componente.aviso) {
      return '<p class="grafico-aviso">' + escapar(componente.aviso) + '</p>';
    }
    if (!componente.pontos || !componente.pontos.length) {
      return '<p class="grafico-vazio">Nenhum caso no período para somar aqui.</p>';
    }
    if (componente.tipo === 'pizza') return desenharPizza(componente);
    if (componente.tipo === 'barrasDeitadas') return desenharBarrasDeitadas(componente);
    if (componente.tipo === 'linha') return desenharLinha(componente, false);
    if (componente.tipo === 'barrasComLinha') return desenharLinha(componente, true);
    return desenharBarras(componente);
  }

  /** A tabela de números — a leitura de reserva, sem cor nenhuma. */
  function tabela(componente) {
    return '<div class="rolagem-tabela"><table class="fila numeros">'
      + '<thead><tr><th>' + escapar(componente.dimensao || 'Item') + '</th>'
      + '<th class="direita">' + (componente.agregacao === 'contagem'
        ? 'Casos' : escapar(componente.medida || 'Valor')) + '</th>'
      + '<th class="direita">Casos</th></tr></thead><tbody>'
      + componente.pontos.map(function (ponto) {
        return '<tr><td>' + escapar(ponto.rotulo) + '</td>'
          + '<td class="direita">' + escapar(numero(ponto.valor, componente.unidade))
          + '</td><td class="direita">' + ponto.casos + '</td></tr>';
      }).join('')
      + '</tbody></table></div>';
  }

  /**
   * A dica que segue o mouse. Uma só, reaproveitada por todos os gráficos da
   * página — uma por marca seriam centenas de elementos à toa.
   */
  function ligarDica(raiz) {
    var dicaNaTela = document.querySelector('.dica-do-grafico');
    if (!dicaNaTela) {
      dicaNaTela = document.createElement('div');
      dicaNaTela.className = 'dica-do-grafico';
      dicaNaTela.hidden = true;
      document.body.appendChild(dicaNaTela);
    }

    var comDica = (raiz || document).querySelectorAll('[data-dica]');
    for (var i = 0; i < comDica.length; i++) {
      comDica[i].addEventListener('mouseenter', function (evento) {
        dicaNaTela.innerHTML = this.getAttribute('data-dica');
        dicaNaTela.hidden = false;
        posicionarDica(dicaNaTela, evento);
      });
      comDica[i].addEventListener('mousemove', function (evento) {
        posicionarDica(dicaNaTela, evento);
      });
      comDica[i].addEventListener('mouseleave', function () {
        dicaNaTela.hidden = true;
      });
      // Pelo teclado também: a dica é informação, não enfeite de mouse.
      comDica[i].addEventListener('focus', function () {
        dicaNaTela.innerHTML = this.getAttribute('data-dica');
        dicaNaTela.hidden = false;
        var caixa = this.getBoundingClientRect();
        dicaNaTela.style.left = (caixa.left + caixa.width / 2) + 'px';
        dicaNaTela.style.top = (caixa.top - 10) + 'px';
      });
      comDica[i].addEventListener('blur', function () { dicaNaTela.hidden = true; });
    }
  }

  function posicionarDica(dicaNaTela, evento) {
    // Presa à janela, para nunca escapar pela borda numa tela estreita.
    var largura = dicaNaTela.offsetWidth || 160;
    var x = Math.min(Math.max(evento.clientX, largura / 2 + 8),
      window.innerWidth - largura / 2 - 8);
    dicaNaTela.style.left = x + 'px';
    dicaNaTela.style.top = (evento.clientY - 14) + 'px';
  }

  function tirarDica() {
    var dicaNaTela = document.querySelector('.dica-do-grafico');
    if (dicaNaTela) dicaNaTela.parentNode.removeChild(dicaNaTela);
  }

  return {
    desenhar: desenhar,
    tabela: tabela,
    numero: numero,
    porcento: porcento,
    classeDoPonto: classeDoPonto,
    encurtar: encurtar,
    ligarDica: ligarDica,
    tirarDica: tirarDica
  };
})();
</script>


<!-- ==== MinhaPerformance.html ==== -->
<script>
/* ============================================================================
   PGO — MinhaPerformance.html · a tela em que o analista se vê
   ============================================================================
   As outras telas mostram a operação. Esta mostra UMA PESSOA, e o cuidado
   aqui é de outra natureza: um número mal escolhido no Dashboard atrapalha
   uma decisão; um número mal escolhido aqui atrapalha alguém.

   O QUE ISSO MUDOU NO DESENHO:

     Todo número vem com a base dele — "8 casos" sozinho não diz nada, "8
     contra 6 no período anterior" diz. Comparação sem referência é o jeito
     mais rápido de transformar um painel em ansiedade.

     No tempo médio, MENOS é melhor: cair 20% é boa notícia, e a tela pinta de
     verde. A mesma seta para baixo em "concluídos" é o contrário.

     O ranking mostra os VIZINHOS, não o pódio. Um pódio completo diz muito
     pouco a quem está no meio e diz demais sobre quem está embaixo. E quem só
     enxerga os próprios casos não vê nome de colega nenhum — vê a própria
     posição contra a média.

     A média da equipe aparece sempre. "Abaixo da média" sem saber qual é a
     média não é informação, é só desconforto.
