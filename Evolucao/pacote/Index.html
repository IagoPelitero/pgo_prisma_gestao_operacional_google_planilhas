   Quem desenha os gráficos é o Graficos — o mesmo do Painel Analítico.
   ============================================================================ */

var TelaMinhaPerformance = (function () {

  var mesaEscolhida = '';
  var dias = 0;
  var dados = null;

  function escapar(texto) { return Moldura.escapar(texto); }
  function elemento(id) { return document.getElementById(id); }

  /* --------------------------------------------------------------- montar */

  function montar(pacote) {
    if (!mesaEscolhida && pacote.mesas.length) mesaEscolhida = pacote.mesas[0].id;
    return SeletorDeMesa.montar(pacote.mesas, mesaEscolhida)
      + '<div id="performance"><p class="carregando-campos">'
      + 'Somando os seus números…</p></div>';
  }

  function carregar() {
    var caixa = elemento('performance');
    if (caixa) {
      caixa.innerHTML = '<p class="carregando-campos">Somando os seus números…</p>';
    }

    Servidor.chamar('minhaPerformance', mesaEscolhida, dias)
      .entao(function (resposta) { dados = resposta; desenhar(); })
      .senao(function (erro) {
        elemento('performance').innerHTML =
          '<p class="carregando-campos erro-carga">'
          + escapar(erro.message || String(erro)) + '</p>';
      });
  }

  function desenhar() {
    if (!dados.temResponsavel) {
      elemento('performance').innerHTML = '<div class="cartao vazio">'
        + '<strong>Esta mesa não diz quem é o responsável por cada caso.</strong>'
        + '<p>Sem uma coluna de responsável não há "os meus casos" para somar. '
        + 'Um administrador aponta essa coluna em Configurações → Mesas de '
        + 'trabalho.</p></div>';
      return;
    }

    elemento('performance').innerHTML = desenharCabeca()
      + Moldura.avisoDeJanela(dados, 'Estes números')
      + desenharIndicadores()
      + desenharMeta()
      + '<div class="graficos">'
      + (dados.porDia ? cartaoDeGrafico(dados.porDia) : '')
      + (dados.porSituacao ? cartaoDeGrafico(dados.porSituacao) : '')
      + (dados.porCanal ? cartaoDeGrafico(dados.porCanal) : '')
      + '</div>'
      + '<div class="performance-baixo">'
      + desenharEquipe() + desenharRecentes() + '</div>';

    ligar();
  }

  function desenharCabeca() {
    var periodos = [7, 15, 30, 60, 90].map(function (quantos) {
      return '<option value="' + quantos + '"'
        + (dados.periodo.dias === quantos ? ' selected' : '') + '>'
        + 'Últimos ' + quantos + ' dias</option>';
    }).join('');

    return '<div class="filtros">'
      + '<select class="filtro" id="periodo-da-performance" aria-label="Período">'
      + periodos + '</select>'
      + '<span class="contagem">' + escapar(dados.pessoa.nome)
      + (dados.pessoa.cargo ? ' · ' + escapar(dados.pessoa.cargo) : '')
      + (dados.pessoa.canal ? ' · ' + escapar(dados.pessoa.canal) : '')
      + '</span></div>';
  }

  /* --------------------------------------------------------- indicadores */

  function desenharIndicadores() {
    return '<div class="cartoes">' + dados.indicadores.map(function (um) {
      return '<div class="indicador" title="' + escapar(um.explicacao) + '">'
        + '<span class="rotulo">' + escapar(um.rotulo) + '</span>'
        + '<strong class="numero">' + escapar(comUnidade(um)) + '</strong>'
        + variacao(um) + '</div>';
    }).join('') + '</div>';
  }

  function comUnidade(indicador) {
    if (indicador.unidade === 'dias') {
      return String(indicador.valor).replace('.', ',') + ' dias';
    }
    return String(indicador.valor);
  }

  /**
   * A variação, e o que ela significa.
   *
   * No tempo médio, MENOS é melhor: cair 20% é boa notícia. A mesma seta para
   * baixo em "concluídos" é o contrário — e pintar as duas da mesma cor faria
   * a tela dar a notícia errada.
   */
  function variacao(indicador) {
    if (indicador.variacao === null || indicador.variacao === undefined) {
      // Sem base de comparação, o espaço fica em branco. Inventar "+100%"
      // porque saiu de zero é ruído que a operação aprende a ignorar.
      return '<span class="variacao vazia" aria-hidden="true">—</span>';
    }
    var subiu = indicador.variacao >= 0;
    var boaNoticia = indicador.menorEhMelhor ? !subiu : subiu;
    if (indicador.variacao === 0) boaNoticia = null;

    return '<span class="variacao ' + (boaNoticia === null ? 'igual'
      : (boaNoticia ? 'subiu' : 'desceu')) + '">'
      + (subiu ? '▲' : '▼') + ' ' + Math.abs(indicador.variacao) + '%'
      + '<em>vs. período anterior</em></span>';
  }

  /* ---------------------------------------------------------------- meta */

  function desenharMeta() {
    if (!dados.meta) return '';
    var meta = dados.meta;
    var bateu = meta.percentualReal >= 100;

    return '<section class="cartao meta">'
      + '<header><h3>Meta do período</h3>'
      + '<span class="meta-numero' + (bateu ? ' bateu' : '') + '">'
      + meta.feito + ' <em>de ' + meta.alvo + '</em></span></header>'
      + '<div class="barra-da-meta" role="progressbar" aria-valuenow="'
      + meta.percentualReal + '" aria-valuemin="0" aria-valuemax="100"'
      + ' aria-label="Progresso da meta">'
      + '<span style="width:' + meta.percentual + '%"></span></div>'
      + '<p class="meta-explica">' + escapar(meta.rotulo)
      + (bateu ? ' · <strong>meta batida</strong>' : '') + '</p>'
      + '</section>';
  }

  /* ------------------------------------------------------------- gráficos */

  function cartaoDeGrafico(componente) {
    return '<section class="cartao grafico largura-' + componente.largura + '">'
      + '<header class="grafico-cabeca"><h3>' + escapar(componente.titulo)
      + '</h3></header>'
      + Graficos.desenhar(componente) + '</section>';
  }

  /* -------------------------------------------------------------- equipe */

  function desenharEquipe() {
    var equipe = dados.equipe;
    if (!equipe.disponivel) return '';

    var meuLugar = equipe.minhaPosicao
      ? '<p class="equipe-lugar"><strong>' + equipe.meuValor + ' caso(s)</strong>'
        + ' · a média da equipe é <strong>' + String(equipe.media).replace('.', ',')
        + '</strong> entre ' + equipe.quantasPessoas + ' pessoas</p>'
      : '<p class="equipe-lugar">Você ainda não tem casos neste período.</p>';

    if (!equipe.podeVerNomes) {
      // Quem só enxerga os próprios casos não vê nome de colega. Mostrar a
      // lista aqui seria uma porta dos fundos — e a mais constrangedora que
      // existe num sistema de trabalho.
      return '<section class="cartao equipe">'
        + '<h3>Você e a equipe</h3>' + meuLugar
        + '<p class="equipe-nota">O seu nível de acesso mostra os seus casos, '
        + 'então aqui você se compara com a <strong>média</strong> — e não com '
        + 'uma lista de nomes.</p></section>';
    }

    var linhas = equipe.lista.map(function (pessoa) {
      var acimaDaMedia = pessoa.valor >= equipe.media;
      return '<li class="' + (pessoa.souEu ? 'sou-eu' : '') + '">'
        + '<span class="posicao">' + pessoa.posicao + 'º</span>'
        + '<span class="nome">' + escapar(pessoa.nome)
        + (pessoa.souEu ? ' <em>você</em>' : '') + '</span>'
        + '<span class="valor tom-' + (acimaDaMedia ? 'bom' : 'neutro') + '">'
        + pessoa.valor + '</span></li>';
    }).join('');

    return '<section class="cartao equipe">'
      + '<h3>Você e a equipe</h3>' + meuLugar
      + '<ul class="ranking">' + linhas + '</ul>'
      + '<p class="equipe-nota">A lista mostra quem está <strong>em volta de '
      + 'você</strong>, e não o pódio: um pódio completo diz pouco a quem está '
      + 'no meio e diz demais sobre quem está embaixo.</p></section>';
  }

  /* ------------------------------------------------------------ recentes */

  function desenharRecentes() {
    if (!dados.recentes.length) {
      return '<section class="cartao equipe"><h3>O que você fez</h3>'
        + '<p class="equipe-nota">Nada registrado ainda neste sistema.</p>'
        + '</section>';
    }

    return '<section class="cartao equipe"><h3>O que você fez</h3>'
      + '<ul class="trilha">' + dados.recentes.map(function (passo) {
        var texto = '<strong>' + escapar(passo.acao) + '</strong>'
          + (passo.detalhe ? '<em>' + escapar(passo.detalhe) + '</em>' : '')
          + '<span>' + escapar(passo.quando) + '</span>';
        return '<li>' + (passo.abre
          ? '<button type="button" class="passo-abre" data-caso-recente="'
            + escapar(passo.registro) + '">' + texto + '</button>'
          : texto) + '</li>';
      }).join('') + '</ul></section>';
  }

  /* ---------------------------------------------------------------- ligar */

  function ligar() {
    var periodo = elemento('periodo-da-performance');
    if (periodo) {
      periodo.addEventListener('change', function () {
        dias = Number(this.value);
        carregar();
      });
    }

    var abrir = document.querySelectorAll('[data-caso-recente]');
    for (var i = 0; i < abrir.length; i++) {
      abrir[i].addEventListener('click', function () {
        CasoEmModal.abrir(mesaEscolhida,
          this.getAttribute('data-caso-recente'), carregar);
      });
    }

    Graficos.ligarDica(elemento('performance'));
  }

  function ligarTela() {
    SeletorDeMesa.ligar(function (idDaMesa) {
      mesaEscolhida = idDaMesa;
      Aplicacao.remontar();
    });
    carregar();
  }

  function desligar() { Graficos.tirarDica(); }

  return { montar: montar, ligar: ligarTela, desligar: desligar };
})();
</script>


<!-- ==== TabelaCorretoras.html ==== -->
<script>
/* ============================================================================
   PGO — TabelaCorretoras.html · quem traz o caso para dentro
   ============================================================================
   Três cadastros numa tela só, em abas: corretoras e canais, produtos e as
   SUSEPs bloqueadas. Até aqui, os três só se ajustavam abrindo a planilha.

   O QUE FAZ ESTA TELA VALER MAIS QUE UMA LISTA: o volume ao lado de cada
   corretora, e o aviso das SUSEPs que aparecem nos casos e não estão
   cadastradas. Essa segunda é a informação mais útil daqui — enquanto uma
   SUSEP está fora do cadastro, o selo do formulário diz "não encontrada" toda
   vez, e ninguém liga uma coisa à outra porque o sintoma aparece em outra
   tela, uma pessoa de cada vez.
   ============================================================================ */

var TelaTabelaCorretoras = (function () {

  var abaAtual = 'corretoras';
  var procurar = '';
  var segmento = '';
  var dados = null;
  var editando = null;      // o item aberto no formulário lateral
  var tipoDaImportacao = '';  // qual lista está sendo importada
  var conferido = null;       // o resultado do passo 2, enquanto não se aplica

  function escapar(texto) { return Moldura.escapar(texto); }
  function elemento(id) { return document.getElementById(id); }

  /* --------------------------------------------------------------- montar */

  function montar() {
    return '<div class="config-abas" id="abas-das-corretoras">'
      + [['corretoras', 'Corretoras e canais'],
         ['produtos', 'Produtos'],
         ['bloqueadas', 'SUSEPs bloqueadas'],
         ['importar', 'Importar']].map(function (par) {
        return '<button type="button" class="config-aba'
          + (abaAtual === par[0] ? ' atual' : '') + '"'
          + ' data-aba-corretoras="' + par[0] + '">' + escapar(par[1])
          + '</button>';
      }).join('') + '</div>'
      + '<div class="config" id="corretoras">'
      + '<div class="config-lista" id="corretoras-lista">'
      + '<p class="carregando-campos">Lendo o cadastro…</p></div>'
      + '<aside class="config-painel" id="corretoras-painel"></aside>'
      + '</div>';
  }

  function carregar() {
    var lista = elemento('corretoras-lista');
    if (lista) lista.innerHTML = '<p class="carregando-campos">Lendo o cadastro…</p>';

    if (abaAtual === 'corretoras') {
      return Servidor.chamar('tabelaDeCorretoras', procurar, segmento)
        .entao(function (resposta) { dados = resposta; desenharCorretoras(); })
        .senao(falhou);
    }
    if (abaAtual === 'produtos') {
      return Servidor.chamar('listarProdutos')
        .entao(function (lista) { dados = { produtos: lista }; desenharProdutos(); })
        .senao(falhou);
    }
    if (abaAtual === 'importar') {
      return Servidor.chamar('opcoesDaImportacao')
        .entao(function (lista) {
          dados = { importacoes: lista };
          if (!tipoDaImportacao && lista.length) tipoDaImportacao = lista[0].tipo;
          desenharImportacao();
        })
        .senao(falhou);
    }
    return Servidor.chamar('tabelaDeCorretoras', '', '')
      .entao(function (resposta) {
        var podeMexer = resposta.podeMexer;
        Servidor.chamar('listarSusepsBloqueadas')
          .entao(function (lista) {
            dados = { bloqueadas: lista, podeMexer: podeMexer };
            desenharBloqueadas();
          })
          .senao(falhou);
      })
      .senao(falhou);
  }

  function falhou(erro) {
    elemento('corretoras-lista').innerHTML =
      '<p class="carregando-campos erro-carga">'
      + escapar(erro.message || String(erro)) + '</p>';
  }

  /* ---------------------------------------------------------- corretoras */

  function desenharCorretoras() {
    var opcoes = ['<option value="">Todos os segmentos</option>']
      .concat(dados.segmentos.map(function (um) {
        return '<option value="' + escapar(um) + '"'
          + (um === segmento ? ' selected' : '') + '>' + escapar(um) + '</option>';
      })).join('');

    elemento('corretoras-lista').innerHTML = '<div class="config-cabeca">'
      + '<input type="search" id="procurar-corretora" class="busca-do-cadastro"'
      + ' value="' + escapar(procurar) + '" autocomplete="off"'
      + ' placeholder="Corretora, canal ou SUSEP" aria-label="Procurar corretora">'
      + '<select id="segmento-da-corretora" aria-label="Segmento">' + opcoes + '</select>'
      + (dados.podeMexer
        ? '<button type="button" class="botao pequeno" id="nova-corretora">'
          + 'Cadastrar corretora</button>' : '')
      + (dados.podeExportar
        ? '<button type="button" class="botao-texto" id="exportar-corretoras">'
          + 'Exportar</button>' : '')
      + '</div>'
      + avisoDasNaoCadastradas()
      + '<p class="config-explica">' + dados.quantasFiltradas + ' de '
      + dados.quantasNoTotal + ' corretoras · a lista vem de quem mais traz '
      + 'caso, e não em ordem alfabética.</p>'
      + tabelaDasCorretoras()
      + (dados.truncada
        ? '<p class="aviso-fila">Mostrando as ' + dados.corretoras.length
          + ' primeiras. Procure para chegar mais perto.</p>' : '');

    ligarCorretoras();
    if (!editando) {
      painelVazio('Escolha uma corretora para ver e mudar o cadastro dela.');
    }
  }

  /**
   * O aviso das SUSEPs que os casos citam e o cadastro não conhece.
   *
   * É o achado desta tela. Cada uma delas faz o selo do formulário dizer
   * "não encontrada" toda vez que alguém digita — e o sintoma aparece lá,
   * uma pessoa de cada vez, sem ninguém ligar à causa.
   */
  function avisoDasNaoCadastradas() {
    if (!dados.foraDoCadastro.length) return '';

    var primeiras = dados.foraDoCadastro.slice(0, 6);
    return '<div class="aviso-cadastro">'
      + '<strong>' + dados.foraDoCadastro.length + ' SUSEP(s) aparecem nos '
      + 'casos e não estão no cadastro.</strong>'
      + '<p>Enquanto elas ficarem de fora, o selo do formulário vai dizer '
      + '"não encontrada" toda vez que alguém as digitar.</p>'
      + '<ul>' + primeiras.map(function (uma) {
        return '<li>'
          + (dados.podeMexer
            ? '<button type="button" class="botao-texto" data-cadastrar-susep="'
              + escapar(uma.susep) + '" data-nome-nos-casos="'
              + escapar(uma.nomeNosCasos) + '">' + escapar(uma.susep)
              + '</button>'
            : '<span class="susep">' + escapar(uma.susep) + '</span>')
          + '<span class="nos-casos">'
          + (uma.nomeNosCasos
            ? 'nos casos aparece como “' + escapar(uma.nomeNosCasos) + '”'
            : 'sem nome nos casos')
          + '</span>'
          + '<span class="quantos">' + uma.casos + ' caso(s)</span></li>';
      }).join('') + '</ul>'
      + (dados.foraDoCadastro.length > primeiras.length
        ? '<p class="config-explica" style="margin:8px 0 0">E mais '
          + (dados.foraDoCadastro.length - primeiras.length) + '.</p>' : '')
      + '</div>';
  }

  function tabelaDasCorretoras() {
    if (!dados.corretoras.length) {
      return '<p class="config-vazio">Nenhuma corretora com esse filtro.</p>';
    }

    var linhas = dados.corretoras.map(function (uma) {
      return '<tr' + (editando && editando.id === uma.id ? ' class="aberta"' : '')
        + '>'
        + '<td><span class="principal">' + escapar(uma.corretora) + '</span>'
        + '<span class="apoio">' + escapar(uma.susep) + '</span></td>'
        + '<td><span class="principal">' + escapar(uma.canal || '—') + '</span>'
        + '<span class="apoio">' + escapar(uma.nome || '—') + '</span></td>'
        + '<td><span class="situacao ' + classeDoSegmento(uma.segmento) + '">'
        + escapar(uma.segmento) + '</span></td>'
        + '<td><span class="situacao ' + (uma.bloqueada ? 'tom-ruim' : 'tom-bom')
        + '" title="' + escapar(uma.motivoDoBloqueio) + '">'
        + (uma.bloqueada ? 'Bloqueada' : 'Liberada') + '</span></td>'
        + '<td class="direita">' + uma.casos + '</td>'
        + '<td class="acoes-coluna">'
        + (dados.podeMexer
          ? '<button type="button" class="acao-icone" data-corretora="'
            + escapar(uma.id) + '" title="Editar" aria-label="Editar corretora">'
            + Moldura.icone('editar') + '</button>' : '')
        + '</td></tr>';
    }).join('');

    return '<div class="rolagem-tabela"><table class="fila agrupada cadastro">'
      + '<thead><tr><th>Corretora</th><th>Canal</th><th>Segmento</th>'
      + '<th>Situação</th><th class="direita">Casos</th>'
      + '<th class="acoes-coluna"></th></tr></thead>'
      + '<tbody>' + linhas + '</tbody></table></div>';
  }

  /**
   * O tom do segmento.
   *
   * "Não encontrado" é atenção, e não erro: é um cadastro incompleto, não uma
   * corretora irregular. Pintar de vermelho faria a operação achar que há um
   * problema com quem trouxe o caso.
   */
  function classeDoSegmento(segmentoDaLinha) {
    // "Não encontrado" é ATENÇÃO: cadastro incompleto não é corretora
    // irregular, e pintar de vermelho faria a operação achar que há um
    // problema com quem trouxe o caso.
    var comparavel = String(segmentoDaLinha || '').toLowerCase();
    if (comparavel.indexOf('diamante') >= 0) return 'tom-destaque';
    if (comparavel.indexOf('não encontrado') >= 0
      || comparavel.indexOf('nao encontrado') >= 0) return 'tom-atencao';
    return 'tom-neutro';
  }

  function ligarCorretoras() {
    var busca = elemento('procurar-corretora');
    busca.addEventListener('change', function () {
      procurar = this.value;
      editando = null;
      carregar();
    });

    elemento('segmento-da-corretora').addEventListener('change', function () {
      segmento = this.value;
      editando = null;
      carregar();
    });

    var nova = elemento('nova-corretora');
    if (nova) {
      nova.addEventListener('click', function () {
        editando = { id: '' };
        desenharFormularioDaCorretora(null);
      });
    }

    var exportar = elemento('exportar-corretoras');
    if (exportar) {
      exportar.addEventListener('click', function () {
        Servidor.chamar('exportarCorretoras', procurar, segmento)
          .entao(abrirCaixaDeExportar)
          .senao(function (erro) { window.alert(erro.message || String(erro)); });
      });
    }

    ligarCliques('[data-corretora]', function (botao) {
      var id = botao.getAttribute('data-corretora');
      editando = { id: id };
      desenharCorretoras();
      desenharFormularioDaCorretora(acharCorretora(id));
    });

    ligarCliques('[data-cadastrar-susep]', function (botao) {
      // Já vem com a SUSEP e o nome que os casos usam — mas o nome é um
      // palpite, e o formulário deixa claro que é.
      editando = { id: '' };
      desenharFormularioDaCorretora({
        id: '', susep: botao.getAttribute('data-cadastrar-susep'),
        corretora: botao.getAttribute('data-nome-nos-casos'),
        nome: '', canal: '', segmento: ''
      }, true);
    });
  }

  function acharCorretora(id) {
    for (var i = 0; i < dados.corretoras.length; i++) {
      if (dados.corretoras[i].id === id) return dados.corretoras[i];
    }
    return null;
  }

  function desenharFormularioDaCorretora(corretora, veioDosCasos) {
    var atual = corretora || { id: '', nome: '', canal: '', susep: '',
      corretora: '', segmento: '' };

    elemento('corretoras-painel').innerHTML =
      '<form class="config-form" id="form-corretora">'
      + tituloDoPainel(atual.id ? atual.corretora : 'Corretora nova',
        atual.id ? 'Cadastro de canal' : 'Cadastrar no canal')
      + (veioDosCasos
        ? '<p class="config-aviso">O nome veio dos casos que já citam esta '
          + 'SUSEP — confira antes de salvar. É um palpite, não um cadastro.</p>'
        : '')
      + campoDeTexto('susep', 'SUSEP', atual.susep,
        'Só dígitos. É ela que liga a corretora ao caso.')
      + campoDeTexto('corretora', 'Corretora', atual.corretora, '')
      + campoDeTexto('canal', 'Canal', atual.canal,
        'Corretora, agente, central… como a operação chama.')
      + campoDeTexto('nome', 'Nome do contato', atual.nome, '')
      + caixaDeSegmento(atual.segmento)
      + '<div class="config-acoes">'
      + '<button type="submit" class="botao">Salvar</button>'
      + (atual.id
        ? '<button type="button" class="botao vazado perigo" id="tirar-corretora">'
          + 'Tirar do cadastro</button>' : '')
      + '</div></form>';

    elemento('form-corretora').addEventListener('submit', function (evento) {
      evento.preventDefault();
      Servidor.chamar('salvarCorretora', {
        id: atual.id,
        susep: valorDe('susep'),
        corretora: valorDe('corretora'),
        canal: valorDe('canal'),
        nome: valorDe('nome'),
        segmento: valorDe('segmento')
      }).entao(function () {
        avisar('Corretora salva.', 'bom');
        editando = null;
        carregar();
      }).senao(mostrarErro);
    });

    var tirar = elemento('tirar-corretora');
    if (tirar) {
      tirar.addEventListener('click', function () {
        if (!window.confirm('Tirar "' + atual.corretora + '" do cadastro?\n\n'
          + 'Ela some da tela e do selo do formulário. A linha permanece na '
          + 'planilha, e os casos dela continuam intactos.')) return;
        Servidor.chamar('ocultarCorretora', atual.id)
          .entao(function () {
            avisar('Corretora tirada do cadastro.', 'bom');
            editando = null;
            carregar();
          }).senao(mostrarErro);
      });
    }
  }

  function caixaDeSegmento(escolhido) {
    var conhecidos = ['Diamante', 'Demais corretoras', 'Não encontrado'];
    (dados.segmentos || []).forEach(function (um) {
      if (conhecidos.indexOf(um) < 0) conhecidos.push(um);
    });

    return '<label class="config-campo"><span>Segmento</span>'
      + '<select id="cfg-segmento">'
      + conhecidos.map(function (um) {
        return '<option value="' + escapar(um) + '"'
          + (um === escolhido ? ' selected' : '') + '>' + escapar(um) + '</option>';
      }).join('') + '</select>'
      + '<em>Diamante muda o atendimento; "Não encontrado" quer dizer cadastro '
      + 'incompleto, e não corretora irregular.</em></label>';
  }

  /* ------------------------------------------------------------- produtos */

  function desenharProdutos() {
    var linhas = dados.produtos.map(function (um) {
      return '<li class="config-item' + (editando && editando.id === um.id
        ? ' atual' : '') + '">'
        + '<button type="button" class="abrir" data-produto="' + escapar(um.id) + '">'
        + '<span class="nome">' + escapar(um.produto) + '</span>'
        + '<span class="detalhe">código ' + escapar(um.codigo || '—')
        + '</span></button></li>';
    }).join('');

    elemento('corretoras-lista').innerHTML = '<div class="config-cabeca">'
      + '<span class="config-titulo">' + dados.produtos.length + ' produtos</span>'
      + '<button type="button" class="botao pequeno" id="novo-produto">'
      + 'Cadastrar produto</button></div>'
      + '<p class="config-explica">O <strong>código</strong> é o que liga o '
      + 'produto ao caso — por isso ele é único, e o sistema recusa repetir.</p>'
      + (dados.produtos.length
        ? '<ul class="config-itens">' + linhas + '</ul>'
        : '<p class="config-vazio">Nenhum produto cadastrado. Sem eles, o '
          + 'campo de produto do formulário fica como caixa de texto livre.</p>');

    elemento('novo-produto').addEventListener('click', function () {
      editando = { id: '' };
      desenharFormularioDoProduto(null);
    });
    ligarCliques('[data-produto]', function (botao) {
      var id = botao.getAttribute('data-produto');
      editando = { id: id };
      desenharProdutos();
      desenharFormularioDoProduto(acharNaLista(dados.produtos, id));
    });

    if (!editando) painelVazio('Escolha um produto, ou cadastre um novo.');
  }

  function desenharFormularioDoProduto(produto) {
    var atual = produto || { id: '', produto: '', codigo: '' };

    elemento('corretoras-painel').innerHTML =
      '<form class="config-form" id="form-produto">'
      + tituloDoPainel(atual.id ? atual.produto : 'Produto novo', 'Cadastro de produto')
      + campoDeTexto('produto', 'Produto', atual.produto, '')
      + campoDeTexto('codigo', 'Código', atual.codigo,
        'Só dígitos. É o que liga o produto ao caso, e ele é único.')
      + '<div class="config-acoes">'
      + '<button type="submit" class="botao">Salvar</button>'
      + (atual.id
        ? '<button type="button" class="botao vazado perigo" id="tirar-produto">'
          + 'Tirar do cadastro</button>' : '')
      + '</div></form>';

    elemento('form-produto').addEventListener('submit', function (evento) {
      evento.preventDefault();
      Servidor.chamar('salvarProduto', {
        id: atual.id, produto: valorDe('produto'), codigo: valorDe('codigo')
      }).entao(function () {
        avisar('Produto salvo.', 'bom');
        editando = null;
        carregar();
      }).senao(mostrarErro);
    });

    var tirar = elemento('tirar-produto');
    if (tirar) {
      tirar.addEventListener('click', function () {
        if (!window.confirm('Tirar "' + atual.produto + '" do cadastro?\n\n'
          + 'A linha permanece na planilha, e os casos continuam intactos.')) return;
        Servidor.chamar('ocultarProduto', atual.id)
          .entao(function () {
            avisar('Produto tirado do cadastro.', 'bom');
            editando = null;
            carregar();
          }).senao(mostrarErro);
      });
    }
  }

  /* ----------------------------------------------------------- bloqueadas */

  function desenharBloqueadas() {
    var linhas = dados.bloqueadas.map(function (uma) {
      return '<tr>'
        + '<td><span class="principal">' + escapar(uma.susep) + '</span>'
        + '<span class="apoio">' + escapar(uma.corretora || 'sem nome') + '</span></td>'
        + '<td>' + escapar(uma.motivo || '—') + '</td>'
        + '<td>' + escapar(uma.cpfReincidente || '—') + '</td>'
        + '<td>' + escapar(uma.bloqueadaEm || '—') + '</td>'
        + '<td class="direita">' + uma.casos + '</td>'
        + '<td class="acoes-coluna">'
        + (dados.podeMexer
          ? '<button type="button" class="botao-texto" data-liberar="'
            + escapar(uma.id) + '">Liberar</button>' : '')
        + '</td></tr>';
    }).join('');

    elemento('corretoras-lista').innerHTML = '<div class="config-cabeca">'
      + '<span class="config-titulo">' + dados.bloqueadas.length
      + ' SUSEP(s) bloqueada(s)</span>'
      + (dados.podeMexer
        ? '<button type="button" class="botao pequeno" id="nova-bloqueada">'
          + 'Bloquear SUSEP</button>' : '')
      + '</div>'
      + '<p class="config-explica">Bloquear <strong>não impede cadastrar</strong>: '
      + 'o formulário passa a mostrar o selo vermelho com o motivo, e quem está '
      + 'atendendo decide. Bloqueio que impedisse o cadastro faria a pessoa '
      + 'registrar o caso num caderno, e o sistema perderia o caso de vista.</p>'
      + (dados.bloqueadas.length
        ? '<div class="rolagem-tabela"><table class="fila agrupada cadastro">'
          + '<thead><tr><th>SUSEP</th><th>Motivo</th><th>CPF reincidente</th>'
          + '<th>Desde</th><th class="direita">Casos</th>'
          + '<th class="acoes-coluna"></th></tr></thead>'
          + '<tbody>' + linhas + '</tbody></table></div>'
        : '<p class="config-vazio">Nenhuma SUSEP bloqueada.</p>');

    var nova = elemento('nova-bloqueada');
    if (nova) {
      nova.addEventListener('click', function () {
        desenharFormularioDoBloqueio();
      });
    }
    ligarCliques('[data-liberar]', function (botao) {
      liberar(botao.getAttribute('data-liberar'));
    });

    painelVazio(dados.podeMexer
      ? 'Bloquear uma SUSEP marca o selo do formulário, e não impede nada.'
      : 'O seu nível de acesso vê a lista, mas não mexe nela.');
  }

  function desenharFormularioDoBloqueio() {
    elemento('corretoras-painel').innerHTML =
      '<form class="config-form" id="form-bloqueio">'
      + tituloDoPainel('Bloquear SUSEP', 'Marca o selo do formulário')
      + campoDeTexto('susep', 'SUSEP', '', 'Só dígitos.')
      + campoDeTexto('corretora', 'Nome da corretora', '', '')
      + campoDeTexto('cpf', 'CPF reincidente', '',
        'Quando o bloqueio vem de um CPF que se repete.')
      + campoDeTexto('motivo', 'Motivo', '',
        'Obrigatório. Quem vir o selo vermelho daqui a seis meses precisa '
        + 'saber o que fazer com a informação.')
      + '<div class="config-acoes">'
      + '<button type="submit" class="botao">Bloquear</button></div></form>';

    elemento('form-bloqueio').addEventListener('submit', function (evento) {
      evento.preventDefault();
      Servidor.chamar('bloquearSusep', {
        susep: valorDe('susep'), corretora: valorDe('corretora'),
        cpfReincidente: valorDe('cpf'), motivo: valorDe('motivo')
      }).entao(function () {
        avisar('SUSEP bloqueada.', 'bom');
        carregar();
      }).senao(mostrarErro);
    });
  }

  function liberar(id) {
    if (!window.confirm('Liberar esta SUSEP?\n\n'
      + 'O selo do formulário volta a aceitá-la. O registro do bloqueio '
      + 'permanece na planilha, com a data.')) return;

    Servidor.chamar('desbloquearSusep', id)
      .entao(function () { avisar('SUSEP liberada.', 'bom'); carregar(); })
      .senao(function (erro) { window.alert(erro.message || String(erro)); });
  }

  /* ----------------------------------------------------------- importação */
  /*
    Três passos, e o do meio é o que importa: CONFERIR mostra o que vai
    acontecer com cada linha antes de qualquer coisa ser gravada. Importar é a
    ação de maior alcance do sistema — um erro escreve em quinhentas linhas de
    uma vez —, e ver antes transforma "colei a coluna errada" num susto em vez
    de num estrago.
  */

  function receitaEscolhida() {
    return acharPorTipo(dados.importacoes, tipoDaImportacao)
      || dados.importacoes[0];
  }

  function acharPorTipo(lista, tipo) {
    for (var i = 0; i < lista.length; i++) {
      if (lista[i].tipo === tipo) return lista[i];
    }
    return null;
  }

  function desenharImportacao() {
    var receita = receitaEscolhida();
    if (!receita) {
      elemento('corretoras-lista').innerHTML =
        '<p class="config-vazio">Nada para importar.</p>';
      return;
    }

    var abas = dados.importacoes.map(function (uma) {
      return '<option value="' + escapar(uma.tipo) + '"'
        + (uma.tipo === receita.tipo ? ' selected' : '') + '>'
        + escapar(uma.titulo) + '</option>';
    }).join('');

    var cabecalho = receita.colunas.map(function (coluna) {
      return coluna.titulo;
    }).join('\t');

    elemento('corretoras-lista').innerHTML = '<div class="config-cabeca">'
      + '<span class="config-titulo">Importar</span>'
      + '<select id="tipo-da-importacao" aria-label="O que importar">'
      + abas + '</select></div>'
      + '<p class="config-explica">' + escapar(receita.explicacao) + '</p>'
      + '<div class="importar-colunas"><span>Colunas, nesta ordem:</span> '
      + receita.colunas.map(function (coluna) {
        return '<code>' + escapar(coluna.titulo) + '</code>'
          + (coluna.obrigatoria ? '<em>obrigatória</em>' : '');
      }).join('') + '</div>'
      + '<p class="config-explica">Copie da sua planilha e cole aqui — com ou '
      + 'sem a linha de cabeçalho, tanto faz. Se vier com cabeçalho, a ordem '
      + 'das colunas pode ser outra: o sistema lê pelos nomes. Até '
      + receita.maximo + ' linhas por vez.</p>'
      + '<textarea id="texto-da-importacao" class="importar-area" rows="10"'
      + ' spellcheck="false" aria-label="Cole aqui as linhas"'
      + ' placeholder="' + escapar(cabecalho) + '"></textarea>'
      + '<div class="config-acoes">'
      + '<button type="button" class="botao" id="conferir-importacao">'
      + 'Conferir</button>'
      + '<button type="button" class="botao vazado" id="limpar-importacao">'
      + 'Limpar</button></div>'
      + '<div id="resultado-da-importacao"></div>';

    elemento('tipo-da-importacao').addEventListener('change', function () {
      tipoDaImportacao = this.value;
      conferido = null;
      desenharImportacao();
    });
    elemento('conferir-importacao').addEventListener('click', conferir);
    elemento('limpar-importacao').addEventListener('click', function () {
      elemento('texto-da-importacao').value = '';
      elemento('resultado-da-importacao').innerHTML = '';
      conferido = null;
    });

    painelVazio('Cole as linhas e aperte Conferir. Nada é gravado até você '
      + 'apertar Aplicar — e Aplicar pede a senha de administrador.');
  }

  function conferir() {
    var texto = elemento('texto-da-importacao').value;
    if (!texto.trim()) {
      avisar('Cole alguma coisa antes de conferir.', 'atencao');
      return;
    }
    var onde = elemento('resultado-da-importacao');
    onde.innerHTML = '<p class="carregando-campos">Conferindo…</p>';

    Servidor.chamar('conferirImportacao', tipoDaImportacao, texto)
      .entao(function (resposta) {
        conferido = resposta;
        desenharConferencia();
      })
      .senao(function (erro) {
        conferido = null;
        onde.innerHTML = '<p class="carregando-campos erro-carga">'
          + escapar(erro.message || String(erro)) + '</p>';
      });
  }

  function desenharConferencia() {
    var resumo = conferido.resumo;
    var colunas = conferido.colunas;

    var linhas = conferido.linhas.map(function (linha) {
      var celulas = colunas.map(function (coluna) {
        return '<td>' + escapar(linha.campos[coluna.chave] || '—') + '</td>';
      }).join('');
      return '<tr class="importar-' + linha.situacao + '">'
        + '<td class="direita">' + linha.numero + '</td>'
        + celulas
        + '<td><span class="situacao ' + tomDaSituacao(linha.situacao) + '">'
        + escapar(nomeDaSituacao(linha.situacao)) + '</span>'
        + (linha.porque
          ? '<span class="apoio">' + escapar(linha.porque) + '</span>' : '')
        + '</td></tr>';
    }).join('');

    elemento('resultado-da-importacao').innerHTML =
      '<div class="importar-resumo">'
      + pastilha('novas', resumo.novas, 'bom')
      + pastilha('atualizam', resumo.atualizadas, 'destaque')
      + pastilha('já iguais', resumo.iguais, 'neutro')
      + pastilha('recusadas', resumo.recusadas, 'ruim')
      + '</div>'
      + (conferido.tinhaCabecalho
        ? '<p class="config-explica">A primeira linha era o cabeçalho, e não '
          + 'entrou na conta.</p>' : '')
      + '<p class="config-explica">Nada aqui apaga: uma linha que está no '
        + 'cadastro e não veio no texto colado <strong>fica onde está</strong>, '
        + 'e um campo vazio no texto não limpa o que já existe.</p>'
      + '<div class="rolagem-tabela"><table class="fila agrupada cadastro">'
      + '<thead><tr><th class="direita">Linha</th>'
      + colunas.map(function (coluna) {
        return '<th>' + escapar(coluna.titulo) + '</th>';
      }).join('')
      + '<th>O que vai acontecer</th></tr></thead>'
      + '<tbody>' + linhas + '</tbody></table></div>'
      + (conferido.naoMostradas
        ? '<p class="config-explica">e mais ' + conferido.naoMostradas
          + ' linha(s) não mostradas aqui — todas serão gravadas do mesmo '
          + 'jeito.</p>' : '')
      + '<div class="config-acoes">'
      + (resumo.novas + resumo.atualizadas
        ? '<button type="button" class="botao" id="aplicar-importacao">Aplicar '
          + (resumo.novas + resumo.atualizadas) + ' alteração(ões)</button>'
        : '<p class="config-vazio">Não há nada a gravar.</p>')
      + '</div>';

    var aplicar = elemento('aplicar-importacao');
    if (aplicar) aplicar.addEventListener('click', pedirSenhaEAplicar);
  }

  function pastilha(rotulo, quantos, tom) {
    return '<span class="importar-pastilha tom-' + tom + '">'
      + '<strong>' + quantos + '</strong> ' + escapar(rotulo) + '</span>';
  }

  function nomeDaSituacao(situacao) {
    if (situacao === 'nova') return 'cadastra';
    if (situacao === 'atualiza') return 'atualiza';
    if (situacao === 'igual') return 'sem mudança';
    return 'recusada';
  }

  function tomDaSituacao(situacao) {
    if (situacao === 'nova') return 'bom';
    if (situacao === 'atualiza') return 'destaque';
    if (situacao === 'igual') return 'neutro';
    return 'ruim';
  }

  /*
    O texto vai INTEIRO de novo para o servidor, e não a lista já conferida.
    Mandar a lista conferida seria mandar o servidor gravar o que ele mesmo
    aprovou — mas passando pelo navegador no caminho, onde qualquer coisa
    pode ter mudado. O servidor confere tudo outra vez antes de escrever.
  */
  function pedirSenhaEAplicar() {
    var texto = elemento('texto-da-importacao').value;
    SenhaDeAdministrador.pedir(function () {
      elemento('resultado-da-importacao').innerHTML =
        '<p class="carregando-campos">Gravando…</p>';
      Servidor.chamar('aplicarImportacao', tipoDaImportacao, texto)
        .entao(function (feito) {
          avisar(feito.criadas + ' cadastrada(s) e ' + feito.atualizadas
            + ' atualizada(s) em ' + feito.titulo + '.', 'bom');
          elemento('texto-da-importacao').value = '';
          conferido = null;
          carregar();
        })
        .senao(function (erro) {
          mostrarErro(erro);
          desenharConferencia();
        });
    });
  }

  /* ------------------------------------------------------------ utilidades */

  function tituloDoPainel(titulo, subtitulo) {
    return '<header class="config-painel-cabeca">'
      + '<h3>' + escapar(titulo) + '</h3>'
      + '<p>' + escapar(subtitulo) + '</p></header>';
  }

  function painelVazio(mensagem) {
    elemento('corretoras-painel').innerHTML =
      '<p class="config-vazio">' + escapar(mensagem) + '</p>';
  }

  function campoDeTexto(nome, rotulo, valor, dica) {
    return '<label class="config-campo"><span>' + escapar(rotulo) + '</span>'
      + '<input type="text" id="cfg-' + nome + '" value="'
      + escapar(valor === null || valor === undefined ? '' : valor) + '">'
      + (dica ? '<em>' + escapar(dica) + '</em>' : '') + '</label>';
  }

  function valorDe(nome) {
    var campo = elemento('cfg-' + nome);
    return campo ? campo.value : '';
  }

  function acharNaLista(lista, id) {
    for (var i = 0; i < lista.length; i++) {
      if (String(lista[i].id) === String(id)) return lista[i];
    }
    return null;
  }

  function ligarCliques(seletor, oQueFazer) {
    var achados = document.querySelectorAll(seletor);
    for (var i = 0; i < achados.length; i++) {
      achados[i].addEventListener('click', function () { oQueFazer(this); });
    }
  }

  function mostrarErro(erro) {
    avisar(erro.message || String(erro), 'ruim');
  }

  function avisar(mensagem, tom) {
    var aviso = document.createElement('div');
    aviso.className = 'aviso-flutuante tom-' + (tom || 'bom');
    aviso.setAttribute('role', 'status');
    aviso.textContent = mensagem;
    document.body.appendChild(aviso);
    window.setTimeout(function () {
      if (aviso.parentNode) aviso.parentNode.removeChild(aviso);
    }, tom === 'ruim' ? 6000 : 3200);
  }

  function abrirCaixaDeExportar(arquivo) {
    var caixa = document.createElement('div');
    caixa.className = 'dialogo';
    caixa.innerHTML = '<div class="dialogo-caixa" role="dialog" aria-modal="true">'
      + '<h3>Exportar</h3>'
      + '<p>Separado por ponto e vírgula, que é como o Excel em português abre '
      + 'sem perguntar nada.</p>'
      + '<textarea rows="8" readonly>' + escapar(arquivo.conteudo) + '</textarea>'
      + '<div class="config-acoes">'
      + '<button type="button" class="botao" data-copiar>Copiar</button>'
      + '<button type="button" class="botao vazado" data-fechar>Fechar</button>'
      + '</div></div>';
    document.body.appendChild(caixa);

    function sair() { if (caixa.parentNode) caixa.parentNode.removeChild(caixa); }
    caixa.querySelector('[data-fechar]').addEventListener('click', sair);
    caixa.addEventListener('mousedown', function (evento) {
      if (evento.target === caixa) sair();
    });

    var area = caixa.querySelector('textarea');
    area.focus();
    area.select();
    caixa.querySelector('[data-copiar]').addEventListener('click', function () {
      area.select();
      var deuCerto = false;
      try { deuCerto = document.execCommand('copy'); } catch (erro) { deuCerto = false; }
      this.textContent = deuCerto ? 'Copiado' : 'Aperte Ctrl+C';
    });
  }

  /* ---------------------------------------------------------------- ligar */

  function ligar() {
    var abas = document.querySelectorAll('[data-aba-corretoras]');
    for (var i = 0; i < abas.length; i++) {
      abas[i].addEventListener('click', function () {
        abaAtual = this.getAttribute('data-aba-corretoras');
        editando = null;
        Aplicacao.remontar();
      });
    }
    carregar();
  }

  /* Sair da tela fecha o diálogo de senha, se ele tiver ficado aberto. */
  function desligar() { SenhaDeAdministrador.fechar(); }

  return { montar: montar, ligar: ligar, desligar: desligar };
})();
</script>


<!-- ==== PainelAnalitico.html ==== -->
<script>
/* ============================================================================
   PGO — PainelAnalitico.html · o que está acontecendo na operação
   ============================================================================
   Os gráficos são SVG escrito à mão, sem biblioteca de fora — pelo mesmo
   motivo dos ícones: o Apps Script serve a página num quadro isolado, e cada
   dependência externa é mais um ponto que pode não carregar. Gráfico que não
   carrega é pior que gráfico nenhum, porque a tela fica com um buraco.

   TRÊS REGRAS DE LEITURA, e todas têm motivo:

     UM EIXO SÓ. "Barras com linha" não são duas escalas. A linha é a média
     móvel da própria barra, na mesma altura: ela mostra a tendência por cima
     do ruído do dia a dia. Dois eixos fariam a mesma altura significar duas
     coisas — é o erro de gráfico mais comum que existe.

     COR PARA IDENTIDADE, TOM ÚNICO PARA MAGNITUDE. A pizza responde "de que
     tipo são" e usa cores; as barras respondem "quanto de cada" e usam um tom
     só. Oito cores para dizer "quanto" enterra a informação.

     O NÚMERO SEMPRE VISÍVEL. Todo gráfico tem rótulo direto e uma tabela por
     baixo. Cor é a segunda leitura, nunca a única — nem todo mundo enxerga
     cor, e nenhuma tela de trabalho pode depender disso.
   ============================================================================ */

var TelaPainelAnalitico = (function () {

  var mesaEscolhida = '';
  var filtros = {};
  var dias = 0;
  var painel = null;
  var tabelasAbertas = {};
  var pacoteDoSistema = null;

  function escapar(texto) { return Moldura.escapar(texto); }
  function elemento(id) { return document.getElementById(id); }

  /* --------------------------------------------------------------- montar */

  function montar(pacote) {
    pacoteDoSistema = pacote;
    if (!mesaEscolhida && pacote.mesas.length) mesaEscolhida = pacote.mesas[0].id;
    return SeletorDeMesa.montar(pacote.mesas, mesaEscolhida)
      + '<div id="analitico"><p class="carregando-campos">Somando os números…</p></div>';
  }

  function carregar() {
    var caixa = elemento('analitico');
    if (caixa) caixa.innerHTML = '<p class="carregando-campos">Somando os números…</p>';

    Servidor.chamar('painelAnalitico', mesaEscolhida, filtros, dias)
      .entao(function (resposta) {
        painel = resposta;
        desenhar();
      })
      .senao(function (erro) {
        elemento('analitico').innerHTML = '<p class="carregando-campos erro-carga">'
          + escapar(erro.message || String(erro)) + '</p>';
      });
  }

  function desenhar() {
    // O aviso vem ANTES dos gráficos, e não depois: depois, ele explica um
    // número que a pessoa já leu como se fosse o total.
    elemento('analitico').innerHTML = desenharFiltros()
      + Moldura.avisoDeJanela(painel, 'Estes gráficos')
      + (painel.componentes.length
        ? '<div class="graficos">'
          + painel.componentes.map(desenharComponente).join('') + '</div>'
        : '<div class="cartao vazio"><strong>Nenhum gráfico configurado nesta '
          + 'mesa.</strong><p>Um administrador monta os gráficos em '
          + 'Configurações → Painéis.</p></div>')
      + '<div id="detalhe-do-painel"></div>';
    ligarPainel();
  }

  function desenharFiltros() {
    var caixas = painel.filtrosDisponiveis.map(function (filtro) {
      var opcoes = ['<option value="">Todos — ' + escapar(filtro.rotulo) + '</option>'];
      filtro.opcoes.forEach(function (opcao) {
        opcoes.push('<option value="' + escapar(opcao.valor) + '"'
          + (filtros[filtro.chave] === opcao.valor ? ' selected' : '') + '>'
          + escapar(opcao.rotulo) + '</option>');
      });
      return '<select class="filtro" data-filtro="' + escapar(filtro.chave) + '"'
        + ' aria-label="Filtrar por ' + escapar(filtro.rotulo) + '">'
        + opcoes.join('') + '</select>';
    });

    var periodos = [30, 60, 90, 180, 365].map(function (quantos) {
      return '<option value="' + quantos + '"'
        + (painel.periodo.dias === quantos ? ' selected' : '') + '>'
        + 'Últimos ' + quantos + ' dias</option>';
    }).join('');

    return '<div class="filtros">'
      + '<select class="filtro" id="periodo-do-painel" aria-label="Período">'
      + periodos + '</select>'
      + caixas.join('')
      + '<span class="contagem">' + painel.total + ' casos · '
      + escapar(painel.periodo.rotulo) + '</span></div>';
  }

  /* ------------------------------------------------------------- gráficos */

  function desenharComponente(componente) {
    return '<section class="cartao grafico largura-' + componente.largura + '"'
      + ' data-grafico="' + escapar(componente.id) + '">'
      + '<header class="grafico-cabeca">'
      + '<h3>' + escapar(componente.titulo) + '</h3>'
      + '<div class="grafico-acoes">'
      + '<button type="button" class="botao-texto" data-tabela="'
      + escapar(componente.id) + '">'
      + (tabelasAbertas[componente.id] ? 'Ver o gráfico' : 'Ver os números') + '</button>'
      + (painel.podeExportar
        ? '<button type="button" class="botao-texto" data-exportar="'
          + escapar(componente.id) + '">Exportar</button>' : '')
      + '</div></header>'
      + (tabelasAbertas[componente.id]
        ? Graficos.tabela(componente) : Graficos.desenhar(componente))
      + rodapeDoGrafico(componente)
      + '</section>';
  }

  function rodapeDoGrafico(componente) {
    if (componente.aviso || !componente.pontos.length) return '';
    return '<p class="grafico-pe">'
      + (componente.dobradosEmOutros
        ? 'Mais ' + componente.dobradosEmOutros + ' valor(es) somados em '
          + '<strong>Demais valores</strong>. '
        : '')
      + 'Clique para ver os casos.</p>';
  }

  /* --------------------------------------------------------- comportamento */

  function ligarPainel() {
    var caixas = document.querySelectorAll('#analitico .filtro');
    for (var i = 0; i < caixas.length; i++) {
      caixas[i].addEventListener('change', function () {
        if (this.id === 'periodo-do-painel') dias = Number(this.value);
        else filtros[this.getAttribute('data-filtro')] = this.value;
        carregar();
      });
    }

    ligarCliques('[data-tabela]', function (botao) {
      var id = botao.getAttribute('data-tabela');
      tabelasAbertas[id] = !tabelasAbertas[id];
      desenhar();
    });

    ligarCliques('[data-exportar]', function (botao) {
      exportar(botao.getAttribute('data-exportar'));
    });

    ligarCliques('[data-ponto]', function (elementoClicado) {
      var grafico = elementoClicado.closest('.grafico');
      if (!grafico) return;
      detalhar(grafico.getAttribute('data-grafico'),
        elementoClicado.getAttribute('data-ponto'));
    });

    Graficos.ligarDica(elemento('analitico'));
  }

  function ligarCliques(seletor, oQueFazer) {
    var achados = document.querySelectorAll('#analitico ' + seletor);
    for (var i = 0; i < achados.length; i++) {
      achados[i].addEventListener('click', function () { oQueFazer(this); });
      achados[i].addEventListener('keydown', function (evento) {
        if (evento.key === 'Enter' || evento.key === ' ') {
          evento.preventDefault();
          oQueFazer(this);
        }
      });
    }
  }

  function detalhar(idDoComponente, chaveDoPonto) {
    var caixa = elemento('detalhe-do-painel');
    caixa.innerHTML = '<p class="carregando-campos">Separando os casos…</p>';
    caixa.scrollIntoView({ behavior: 'smooth', block: 'nearest' });

    Servidor.chamar('detalharComponente', mesaEscolhida, idDoComponente,
      chaveDoPonto, filtros, dias)
      .entao(function (resposta) { desenharDetalhe(resposta); })
      .senao(function (erro) {
        caixa.innerHTML = '<p class="carregando-campos erro-carga">'
          + escapar(erro.message || String(erro)) + '</p>';
      });
  }

  function desenharDetalhe(detalhe) {
    var cabecalho = detalhe.colunas.map(function (grupo) {
      return '<th>' + escapar(grupo.titulo) + '</th>';
    }).join('') + '<th class="acoes-coluna">Ações</th>';

    var linhas = detalhe.casos.map(function (caso) {
      var celulas = caso.celulas.map(function (grupo, i) {
        return '<td>' + grupo.map(function (celula, j) {
          if (celula.ehStatus) {
            return '<span class="situacao tom-' + escapar(caso.tom || 'neutro')
              + '">' + escapar(celula.valor || '—') + '</span>';
          }
          return '<span class="' + ((j === 0 && i !== 0) ? 'principal' : 'apoio')
            + '">' + escapar(celula.valor || '—') + '</span>';
        }).join('') + '</td>';
      }).join('');
      return '<tr>' + celulas + '<td class="acoes-coluna">'
        + '<button type="button" class="acao" data-caso-do-painel="'
        + escapar(caso.id) + '">' + Moldura.icone('olho')
        + ' Ver detalhes</button></td></tr>';
    }).join('');

    elemento('detalhe-do-painel').innerHTML = '<section class="cartao sem-forro origem">'
      + '<header class="origem-cabeca"><h3>' + escapar(detalhe.titulo) + ' · '
      + escapar(detalhe.ponto) + '</h3>'
      + '<span class="quantos">' + detalhe.total + '</span>'
      + '<button type="button" class="botao-texto" id="fechar-detalhe">'
      + 'Fechar</button></header>'
      + (detalhe.casos.length
        ? '<div class="rolagem-tabela"><table class="fila agrupada">'
          + '<thead><tr>' + cabecalho + '</tr></thead>'
          + '<tbody>' + linhas + '</tbody></table></div>'
        : '<p class="grafico-vazio">Nenhum caso aqui.</p>')
      + '</section>';

    elemento('fechar-detalhe').addEventListener('click', function () {
      elemento('detalhe-do-painel').innerHTML = '';
    });

    var abrir = document.querySelectorAll('[data-caso-do-painel]');
    for (var i = 0; i < abrir.length; i++) {
      abrir[i].addEventListener('click', function () {
        CasoEmModal.abrir(mesaEscolhida, this.getAttribute('data-caso-do-painel'),
          carregar);
      });
    }
  }

  /**
   * Exportar.
   *
   * O Apps Script serve a página num quadro isolado, e ali o navegador barra
   * download que a própria página começa. Então mostramos o texto pronto para
   * copiar — que funciona em qualquer lugar — e oferecemos o download por
   * cima, para quem estiver num contexto que o aceite.
   */
  function exportar(idDoComponente) {
    Servidor.chamar('exportarComponente', mesaEscolhida, idDoComponente,
      filtros, dias)
      .entao(function (arquivo) { abrirCaixaDeExportar(arquivo); })
      .senao(function (erro) { window.alert(erro.message || String(erro)); });
  }

  function abrirCaixaDeExportar(arquivo) {
    var caixa = document.createElement('div');
    caixa.className = 'dialogo';
    caixa.id = 'dialogo-exportar';
    caixa.innerHTML = '<div class="dialogo-caixa" role="dialog" aria-modal="true"'
      + ' aria-labelledby="titulo-exportar">'
      + '<h3 id="titulo-exportar">Exportar</h3>'
      + '<p>Separado por ponto e vírgula, que é como o Excel em português abre '
      + 'sem perguntar nada.</p>'
      + '<textarea id="texto-exportado" rows="8" readonly>'
      + escapar(arquivo.conteudo) + '</textarea>'
      + '<div class="config-acoes">'
      + '<button type="button" class="botao" id="copiar-exportado">Copiar</button>'
      + '<button type="button" class="botao vazado" id="fechar-exportar">'
      + 'Fechar</button></div></div>';
    document.body.appendChild(caixa);

    function sair() { if (caixa.parentNode) caixa.parentNode.removeChild(caixa); }
    elemento('fechar-exportar').addEventListener('click', sair);
    caixa.addEventListener('mousedown', function (evento) {
      if (evento.target === caixa) sair();
    });

    var area = elemento('texto-exportado');
    area.focus();
    area.select();

    elemento('copiar-exportado').addEventListener('click', function () {
      area.select();
      var deuCerto = false;
      try { deuCerto = document.execCommand('copy'); } catch (erro) { deuCerto = false; }
      this.textContent = deuCerto ? 'Copiado' : 'Aperte Ctrl+C';
    });
  }

  /* ---------------------------------------------------------------- ligar */

  function ligar(pacote) {
    if (pacote) pacoteDoSistema = pacote;
    SeletorDeMesa.ligar(function (idDaMesa) {
      mesaEscolhida = idDaMesa;
      filtros = {};
      tabelasAbertas = {};
      Aplicacao.remontar();
    });
    carregar();
  }

  function desligar() { Graficos.tirarDica(); }

  return { montar: montar, ligar: ligar, desligar: desligar };
})();
</script>


<!-- ==== CadastrarCaso.html ==== -->
<script>
/* ============================================================================
   PGO — CadastrarCaso.html · a tela que grava
   ============================================================================
   A tela não sabe quais campos existem. Ela pergunta ao servidor, recebe a
   definição e pede ao Formulario que desenhe. Campo criado em Configurações
   aparece aqui sozinho; campo escondido para o nível nem chega a ser enviado.

   Quem desenha, mascara e marca erro é o Formulario — o mesmo que o modal de
   edição do Dashboard usa. Duas cópias do mesmo formulário divergiriam no
   primeiro ajuste.
   ============================================================================ */

var TelaCadastrarCaso = (function () {

  var mesaEscolhida = '';
  var salvando = false;

  function escapar(texto) { return Moldura.escapar(texto); }
  function elemento(id) { return document.getElementById(id); }
  function corpo() { return elemento('corpo-do-formulario'); }

  /* --------------------------------------------------------------- montar */

  function montar(pacote) {
    if (!mesaEscolhida && pacote.mesas.length) mesaEscolhida = pacote.mesas[0].id;

    return SeletorDeMesa.montar(pacote.mesas, mesaEscolhida)
      + '<form class="cartao formulario" id="formulario-do-caso" novalidate>'
      + '<div id="corpo-do-formulario"><p class="carregando-campos">'
      + 'Montando o formulário…</p></div>'
      + '<div class="acoes">'
      + '<button type="submit" class="botao" id="salvar-caso">Cadastrar caso</button>'
      + '<button type="button" class="botao-secundario" id="limpar-caso">Limpar</button>'
      + '<span class="atalho">ou <kbd>Ctrl</kbd> + <kbd>Enter</kbd></span>'
      + '<span class="recado" id="recado-do-caso" hidden></span>'
      + '</div></form>';
  }

  /* ----------------------------------------------------------- comportamento */

  function carregarFormulario() {
    corpo().innerHTML = '<p class="carregando-campos">Montando o formulário…</p>';

    Servidor.chamar('formularioDaMesa', mesaEscolhida)
      .entao(function (resposta) {
        corpo().innerHTML = Formulario.desenhar(resposta, '');
        Formulario.ligar(corpo(), '');
        var primeiro = corpo().querySelector(
          'input:not([disabled]), select:not([disabled])');
        if (primeiro) primeiro.focus();
      })
      .senao(function (erro) {
        corpo().innerHTML = '<p class="carregando-campos erro-carga">'
          + escapar(erro.message || String(erro)) + '</p>';
      });
  }

  function recado(texto, tipo) {
    var caixa = elemento('recado-do-caso');
    caixa.className = 'recado ' + (tipo || '');
    caixa.textContent = texto;
    caixa.hidden = !texto;
  }

  function salvar() {
    if (salvando) return;
    salvando = true;
    Formulario.limparErros(corpo());
    recado('Gravando…', '');
    elemento('salvar-caso').disabled = true;

    Servidor.chamar('cadastrarCaso', mesaEscolhida, Formulario.valores(corpo()))
      .entao(function (resposta) {
        salvando = false;
        elemento('salvar-caso').disabled = false;
        recado('Caso ' + resposta.id + ' cadastrado em ' + resposta.mesa + '.', 'bom');
        carregarFormulario();
      })
      .senao(function (erro) {
        salvando = false;
        elemento('salvar-caso').disabled = false;
        recado(erro.message || String(erro), 'ruim');
        if (erro.problemas) Formulario.mostrarProblemas(corpo(), erro.problemas);
      });
  }

  function ligar(pacote) {
    SeletorDeMesa.ligar(function (idDaMesa) {
      mesaEscolhida = idDaMesa;
      Aplicacao.remontar();
    });

    elemento('formulario-do-caso').addEventListener('submit', function (evento) {
      evento.preventDefault();
      salvar();
    });
    elemento('limpar-caso').addEventListener('click', function () {
      recado('', '');
      carregarFormulario();
    });
    document.addEventListener('keydown', atalhoDeSalvar);

    carregarFormulario();
  }

  function atalhoDeSalvar(evento) {
    if ((evento.ctrlKey || evento.metaKey) && evento.key === 'Enter') {
      // Com o modal aberto, o Ctrl+Enter é dele — quem está na frente manda.
      if (document.querySelector('.dialogo')) return;
      if (elemento('formulario-do-caso')) {
        evento.preventDefault();
        salvar();
      }
    }
  }

  /** Chamado ao sair da tela, para o atalho não continuar valendo nas outras. */
  function desligar() {
    document.removeEventListener('keydown', atalhoDeSalvar);
  }

  return { montar: montar, ligar: ligar, desligar: desligar };
})();
</script>


<!-- ==== Configuracoes.html ==== -->
<script>
/* ============================================================================
   PGO — Configuracoes.html · a tela que ajusta o sistema por dentro
   ============================================================================
   Três colunas, e a divisão entre elas é a ideia da tela toda:

     SEÇÕES    à esquerda, o que dá para ajustar. Sete assuntos, cada um com
               o seu tamanho ao lado — "55 campos", "4 níveis" —, porque saber
               quanta coisa tem ali ajuda a decidir onde entrar.

     LISTA     no meio, os itens da seção. Só leitura: clicar escolhe.

     PROPRIEDADES  à direita, o item escolhido, aberto para edição. Nada é
               gravado enquanto não se aperta Salvar.

   A tela ESCONDE o que a pessoa não pode fazer, por educação. Quem confere de
   verdade é o servidor, em toda função. Botão escondido nunca foi segurança.

   As ações sem volta — criar coluna na planilha — passam pelo diálogo de
   senha. Ele guarda a ação pendente, pede a senha, e só então executa: assim
   a pessoa não precisa preencher o formulário de novo depois de digitar a
   senha.
   ============================================================================ */

var TelaConfiguracoes = (function () {

  var resumo = null;
  var pacoteDoSistema = null;   // o pacote de partida, para as mesas
  var secaoAtual = 'campos';
  var mesaEscolhida = '';
  var tipoDeListaEscolhido = '';
  var escolhido = null;        // o item aberto no painel da direita
  var dados = {};              // o que a seção atual carregou do servidor

  function escapar(texto) { return Moldura.escapar(texto); }
  function elemento(id) { return document.getElementById(id); }

  /**
   * A resposta chegou tarde, para uma seção que não é mais a da vez?
   *
   * Trocar de TELA já é tratado pela ponte, no Aplicacao. Trocar de SEÇÃO
   * dentro de Configurações não é: a tela continua a mesma, os elementos
   * continuam existindo, mas `carregarSecao` zerou o `dados` — e a resposta
   * atrasada da seção anterior tenta desenhar com um `dados` que não é o dela.
   * O sintoma é "Cannot read properties of undefined", num lugar do código que
   * não tem nada a ver com o que a pessoa clicou.
   *
   * Desenhar é a única coisa que precisa da guarda. Uma gravação atrasada em
   * `dados` é inerte: a seção nova preenche o que ela mesma usa.
   */
  function respostaAtrasada(secaoDaResposta) {
    return secaoAtual !== secaoDaResposta;
  }

  function texto(valor) {
    return String(valor === null || valor === undefined ? '' : valor);
  }

  /* ============================================================ a moldura */

  function montar(pacote) {
    pacoteDoSistema = pacote;
    if (!mesaEscolhida && pacote.mesas.length) mesaEscolhida = pacote.mesas[0].id;
    return '<div class="config" id="config">'
      + '<p class="carregando-campos">Abrindo as configurações…</p>'
      + '</div>';
  }

  function desenharTudo() {
    elemento('config').innerHTML =
      '<nav class="config-secoes" id="config-secoes">' + desenharSecoes() + '</nav>'
      + '<div class="config-meio">'
      + '<p class="config-descricao" id="config-descricao"></p>'
      + '<div class="config-lista" id="config-lista"></div>'
      + '</div>'
      + '<aside class="config-painel" id="config-painel"></aside>';
    ligarSecoes();
    carregarSecao();
  }

  function desenharSecoes() {
    var aviso = '';
    if (!resumo.estrutura.emOrdem) {
      aviso = '<button type="button" class="config-alerta" data-secao="estrutura">'
        + 'A planilha saiu do contrato — ver o laudo</button>';
    } else if (!resumo.senhaDefinida) {
      aviso = '<button type="button" class="config-alerta suave" data-secao="identidade">'
        + 'Sem senha de administrador definida</button>';
    }

    return resumo.secoes.map(function (secao) {
      return '<button type="button" class="config-secao'
        + (secao.chave === secaoAtual ? ' atual' : '') + '"'
        + ' data-secao="' + escapar(secao.chave) + '">'
        + Moldura.icone(secao.chave)
        + '<span class="titulo">' + escapar(secao.titulo) + '</span>'
        + (secao.quantidade
          ? '<span class="quantos">' + secao.quantidade + '</span>'
          : '<span></span>')
        + '</button>';
    }).join('') + aviso;
  }

  /**
   * A descrição da seção escolhida, na primeira linha da coluna do meio.
   *
   * Fica aqui, e não dentro de cada desenho de seção, porque cada seção
   * reescreve a lista inteira quando carrega: um texto escrito lá dentro
   * teria de ser repetido nas oito, e bastaria esquecer uma para a tela
   * ficar sem explicação.
   */
  function atualizarDescricao() {
    var onde = elemento('config-descricao');
    if (!onde) return;
    var achada = resumo.secoes.filter(function (secao) {
      return secao.chave === secaoAtual;
    })[0];
    onde.textContent = achada ? achada.descricao : '';
  }

  function ligarSecoes() {
    var botoes = document.querySelectorAll('[data-secao]');
    for (var i = 0; i < botoes.length; i++) {
      botoes[i].addEventListener('click', function () {
        secaoAtual = this.getAttribute('data-secao');
        escolhido = null;
        elemento('config-secoes').innerHTML = desenharSecoes();
        ligarSecoes();
        carregarSecao();
      });
    }
  }

  /* ====================================================== carga por seção */

  function aguarde(mensagem) {
    elemento('config-lista').innerHTML =
      '<p class="carregando-campos">' + escapar(mensagem) + '</p>';
    elemento('config-painel').innerHTML = '';
  }

  function falhou(erro) {
    elemento('config-lista').innerHTML = '<p class="carregando-campos erro-carga">'
      + escapar(erro.message || String(erro)) + '</p>';
  }

  /**
   * Cada seção pede ao servidor só o que ela usa.
   *
   * Trocar de seção recarrega: preferimos uma ida ao servidor a mostrar uma
   * lista velha depois de alguém ter salvado alguma coisa em outra aba.
   */
  function carregarSecao() {
    dados = {};
    atualizarDescricao();

    if (secaoAtual === 'campos') return carregarCampos();
    if (secaoAtual === 'usuarios') return carregarUsuarios();
    if (secaoAtual === 'niveis') return carregarNiveis();
    if (secaoAtual === 'catalogo') return carregarListas();
    if (secaoAtual === 'mesas') return carregarMesas();
    if (secaoAtual === 'paineis') return carregarPaineis();
    if (secaoAtual === 'analises') return carregarAnalises();
    if (secaoAtual === 'identidade') return desenharIdentidade();
    if (secaoAtual === 'estrutura') return carregarEstrutura();
  }

  /* --------------------------------------------------- campos do formulário */

  function carregarCampos() {
    aguarde('Lendo os campos da mesa…');
    Servidor.chamar('opcoesDeConfiguracaoDeCampo')
      .entao(function (opcoes) {
        dados.opcoes = opcoes;
        Servidor.chamar('listarCamposDaMesa', mesaEscolhida)
          .entao(function (campos) {
            dados.campos = campos;
            desenharCampos();
          })
          .senao(falhou);
      })
      .senao(falhou);
  }

  function desenharCampos() {
    if (respostaAtrasada('campos')) return;
    var linhas = dados.campos.map(function (campo, posicao) {
      return '<li class="config-item' + (escolhido && escolhido.id === campo.id
        ? ' atual' : '') + (campo.ativo ? '' : ' desligado') + '">'
        + '<button type="button" class="abrir" data-campo="' + escapar(campo.id) + '">'
        + '<span class="nome">' + escapar(campo.rotulo) + '</span>'
        + '<span class="detalhe">' + escapar(campo.secao) + ' · '
        + escapar(campo.tipo)
        + (campo.obrigatorio ? ' · obrigatório' : '')
        + (campo.ativo ? '' : ' · desligado no formulário')
        + (campo.colunaExiste ? ''
          : ' · <strong class="alerta">coluna ausente na planilha</strong>')
        + '</span></button>'
        + '<span class="mover">'
        + '<button type="button" class="seta" data-subir="' + posicao + '"'
        + (posicao === 0 ? ' disabled' : '') + ' title="Subir">↑</button>'
        + '<button type="button" class="seta" data-descer="' + posicao + '"'
        + (posicao === dados.campos.length - 1 ? ' disabled' : '')
        + ' title="Descer">↓</button></span>'
        + '</li>';
    }).join('');

    elemento('config-lista').innerHTML =
      '<div class="config-cabeca">'
      + '<div class="config-mesas">' + caixaDeMesas() + '</div>'
      + (resumo.podeMexerNaEstrutura
        ? '<button type="button" class="botao pequeno" id="novo-campo">'
          + 'Criar campo</button>' : '')
      + '</div>'
      + '<p class="config-explica">A ordem aqui é a ordem do formulário. '
      + 'Mudar de lugar não mexe na planilha: a coluna fica onde está.</p>'
      + '<ul class="config-itens">' + linhas + '</ul>';

    ligarListaDeCampos();
    if (escolhido) desenharPainelDoCampo(acharCampo(escolhido.id));
    else painelVazio('Escolha um campo para ver e mudar as propriedades dele.');
  }

  function acharCampo(id) {
    for (var i = 0; i < dados.campos.length; i++) {
      if (dados.campos[i].id === id) return dados.campos[i];
    }
    return null;
  }

  function caixaDeMesas() {
    return '<select id="mesa-da-config" aria-label="Mesa">'
      + pacoteDoSistema.mesas.map(function (mesa) {
        return '<option value="' + escapar(mesa.id) + '"'
          + (mesa.id === mesaEscolhida ? ' selected' : '') + '>'
          + escapar(mesa.nome) + '</option>';
      }).join('') + '</select>';
  }

  function ligarListaDeCampos() {
    var seletor = elemento('mesa-da-config');
    if (seletor) {
      seletor.addEventListener('change', function () {
        mesaEscolhida = this.value;
        escolhido = null;
        carregarCampos();
      });
    }

    ligarCliques('[data-campo]', function (botao) {
      escolhido = { id: botao.getAttribute('data-campo') };
      desenharCampos();
    });

    ligarCliques('[data-subir]', function (botao) {
      trocarDeLugar(Number(botao.getAttribute('data-subir')), -1);
    });
    ligarCliques('[data-descer]', function (botao) {
      trocarDeLugar(Number(botao.getAttribute('data-descer')), 1);
    });

    var novo = elemento('novo-campo');
    if (novo) novo.addEventListener('click', abrirCampoNovo);
  }

  function trocarDeLugar(posicao, passo) {
    var destino = posicao + passo;
    if (destino < 0 || destino >= dados.campos.length) return;

    var lista = dados.campos.slice();
    var guardado = lista[posicao];
    lista[posicao] = lista[destino];
    lista[destino] = guardado;
    dados.campos = lista;
    desenharCampos();

    // A ordem já mudou na tela — se o servidor recusar, a lista volta ao que
    // era e o motivo aparece no painel. Nunca deixamos a tela mostrando uma
    // ordem que a planilha não tem.
    Servidor.chamar('reordenarCampos', mesaEscolhida, lista.map(function (campo) {
      return campo.id;
    })).senao(function (erro) {
      // O recado flutua, e não mora no painel: recarregar a lista redesenha o
      // painel inteiro, e o erro sumiria junto antes de alguém ler.
      avisar(erro.message || String(erro), 'ruim');
      carregarCampos();
    });
  }

  function desenharPainelDoCampo(campo) {
    if (!campo) return painelVazio('Escolha um campo.');

    var opcoes = dados.opcoes;

    elemento('config-painel').innerHTML = '<form class="config-form" id="form-campo">'

      + avisoDaColuna(campo)
      + campoDeTexto('rotulo', 'Rótulo na tela', campo.rotulo,
        'O que o analista lê. Trocar isto não mexe na planilha.')
      + campoSomenteLeitura('Cabeçalho na planilha', campo.cabecalho,
        'É o nome da coluna. Não muda por aqui — é o que amarra o dado ao '
        + 'Power BI.')
      + campoDeTexto('descricao', 'Dica embaixo do campo', campo.descricao, '')
      + campoDeTexto('secao', 'Seção do formulário', campo.secao,
        'Campos com a mesma seção aparecem juntos.')
      + caixaDeOpcoes('tipo', 'Tipo', opcoes.tipos, campo.tipo, '')
      + campoDeTexto('mascara', 'Máscara', campo.mascara,
        'Ex.: 000.000.000-00. A planilha recebe só os dígitos.')
      + caixaDeOpcoes('catalogo', 'Lista do catálogo',
        [''].concat(opcoes.tiposDeCatalogo), campo.catalogo,
        'Preenche as opções a partir da aba CATALOGO.')
      + caixaDeOpcoes('listaDe', 'Lista de um cadastro',
        [''].concat(opcoes.cadastros), campo.listaDe,
        'Preenche as opções a partir de um cadastro do sistema.')
      + caixaDeSimNao('obrigatorio', 'Obrigatório', campo.obrigatorio)
      + caixaDeSimNao('ativo', 'Aparece no formulário', campo.ativo)
      + '<div class="config-acoes">'
      + '<button type="submit" class="botao">Salvar</button>'
      + '</div></form>';

    elemento('form-campo').addEventListener('submit', function (evento) {
      evento.preventDefault();
      salvarCampo(campo);

  function avisoDaColuna(campo) {
    if (campo.colunaExiste) return '';
    return '<p class="config-aviso">A coluna <strong>'
      + escapar(campo.cabecalho) + '</strong> não existe mais na planilha. '
      + 'O campo continua cadastrado, mas nada será gravado nele até a coluna '
      + 'voltar com esse nome exato.</p>';
  }

  function salvarCampo(campo) {
    var envio = {
      id: campo.id,
      rotulo: valorDe('rotulo'),
      descricao: valorDe('descricao'),
      secao: valorDe('secao'),
      tipo: valorDe('tipo'),
      mascara: valorDe('mascara'),
      catalogo: valorDe('catalogo'),
      listaDe: valorDe('listaDe'),
      obrigatorio: marcado('obrigatorio'),
      ativo: marcado('ativo')
    };
    Servidor.chamar('salvarCampo', envio)
      .entao(function () { avisarSalvo(); carregarCampos(); })
      .senao(mostrarErroNoPainel);
  }

      + '<strong>não tem desfazer</strong>. A coluna nasce no fim da aba, com '

      + campoDeTexto('rotulo', 'Nome do campo', '',

      + campoDeTexto('secao', 'Seção do formulário', 'Geral', '')
      + campoDeTexto('descricao', 'Dica embaixo do campo', '', '')
      + caixaDeOpcoes('tipo', 'Tipo', dados.opcoes.tipos, 'texto', '')
      + campoDeTexto('mascara', 'Máscara', '', '')
      + caixaDeSimNao('obrigatorio', 'Obrigatório', false)
      + '<div class="config-acoes">'

  function desenharNiveis() {

      return '<li class="config-item' + (escolhido && escolhido.id === nivel.id
        ? ' atual' : '') + (nivel.ativo ? '' : ' desligado') + '">'

  function desenharPainelDoNivel(nivel) {
    if (!nivel) return painelVazio('Escolha um nível.');
    var opcoes = dados.opcoesDeNivel;

    var telas = opcoes.telas.map(function (tela) {
      return caixaDeMarcar('tela-' + tela.chave, tela.titulo,
        nivel.telas.indexOf(tela.chave) >= 0, '');
    }).join('');

    var acoes = opcoes.acoes.map(function (acao) {
      return caixaDeMarcar('acao-' + acao.chave, acao.chave,
        nivel.acoes.indexOf(acao.chave) >= 0, acao.descricao);
    }).join('');

    var escopos = opcoes.escopos.map(function (escopo) {
      return '<label class="config-radio">'
        + '<input type="radio" name="escopo" value="' + escapar(escopo.chave) + '"'
        + (nivel.escopo === escopo.chave ? ' checked' : '') + '>'
        + '<span><strong>' + escapar(escopo.chave) + '</strong>'
        + '<em>' + escapar(escopo.descricao) + '</em></span></label>';
    }).join('');

    elemento('config-painel').innerHTML = '<form class="config-form" id="form-nivel">'
      + tituloDoPainel(nivel.nome, nivel.pessoas + ' pessoa(s) neste nível')
      + campoDeTexto('nome', 'Nome do nível', nivel.nome, '')
      + caixaDeSimNao('ativo', 'Nível em uso', nivel.ativo)
      + '<fieldset class="config-grupo"><legend>Telas que abrem</legend>'
      + telas + '</fieldset>'
      + '<fieldset class="config-grupo"><legend>O que pode fazer</legend>'
      + acoes + '</fieldset>'
      + '<fieldset class="config-grupo"><legend>Até onde enxerga</legend>'
      + escopos + '</fieldset>'
      + '<div class="config-acoes">'
      + '<button type="submit" class="botao">Salvar</button></div></form>';

    elemento('form-nivel').addEventListener('submit', function (evento) {
      evento.preventDefault();

      var telasMarcadas = [];
      opcoes.telas.forEach(function (tela) {
        if (marcado('tela-' + tela.chave)) telasMarcadas.push(tela.chave);
      });
      var acoesMarcadas = [];
      opcoes.acoes.forEach(function (acao) {
        if (marcado('acao-' + acao.chave)) acoesMarcadas.push(acao.chave);
      });

      var escolhidoEscopo = document.querySelector('input[name="escopo"]:checked');

      Servidor.chamar('salvarNivelDeAcesso', {
        id: nivel.id,
        nome: valorDe('nome'),
        ativo: marcado('ativo'),
        telas: telasMarcadas,
        acoes: acoesMarcadas,
        escopo: escolhidoEscopo ? escolhidoEscopo.value : nivel.escopo,
        campos: nivel.campos
      }).entao(function () { avisarSalvo(); carregarNiveis(); })
        .senao(mostrarErroNoPainel);
    });
  }

  /* --------------------------------------------------------------- listas */

  function carregarListas() {
    aguarde('Lendo as listas…');
    Servidor.chamar('opcoesDeConfiguracaoDeCampo')
      .entao(function (opcoes) {
        dados.tipos = opcoes.tiposDeCatalogo;
        dados.tons = opcoes.tons;
        if (!tipoDeListaEscolhido && dados.tipos.length) {
          tipoDeListaEscolhido = dados.tipos[0];
        }
        Servidor.chamar('listarCatalogo', tipoDeListaEscolhido, '')
          .entao(function (itens) {
            dados.itens = itens;
            desenharListas();
          })
          .senao(falhou);

      .senao(falhou);

    if (respostaAtrasada('catalogo')) return;
    var linhas = dados.itens.map(function (item) {
      return '<li class="config-item' + (escolhido && escolhido.id === item.id
        ? ' atual' : '') + (item.ativo ? '' : ' desligado') + '">'
        + '<button type="button" class="abrir" data-item="' + escapar(item.id) + '">'
        + '<span class="nome"><span class="ponto tom-' + escapar(item.cor)
        + '"></span>' + escapar(item.rotulo) + '</span>'
        + '<span class="detalhe">grava como "' + escapar(item.nome) + '"'
        + (item.ativo ? '' : ' · desligado') + '</span></button></li>';

    elemento('config-lista').innerHTML = '<div class="config-cabeca">'
      + '<select id="tipo-da-lista" aria-label="Tipo de lista">'
      + dados.tipos.map(function (tipo) {
        return '<option value="' + escapar(tipo) + '"'

      }).join('') + '</select>'

      + 'Novo item</button></div>'
      + '<p class="config-explica">O <strong>nome</strong> é o que fica gravado '

    elemento('tipo-da-lista').addEventListener('change', function () {
