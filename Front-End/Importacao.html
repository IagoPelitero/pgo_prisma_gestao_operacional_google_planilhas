<script>
/* ============================================================================
   PGO — Importacao.html · trazer uma base inteira de fora
   ============================================================================
   A tela existe para um gesto que a operação faz toda semana: pegar a base de
   inadimplentes do Vida Individual, do Vida em Grupo, ou a lista de corretoras
   que a Mesa vai tratar, e jogar cem ou trezentos casos dentro do PGO — já
   divididos entre os analistas.

   TRÊS PASSOS, E O DO MEIO É O QUE IMPORTA:

     1. DE ONDE VEM. Colar o conteúdo, ou dar o link da outra planilha.
     2. CONFERIR. O servidor devolve para onde cada coluna vai, quantas linhas
        entram, quantas repetem, e as três primeiras JÁ TRADUZIDAS.
     3. IMPORTAR.

   O passo 2 não é burocracia: mapeamento errado é invisível no cabeçalho e
   óbvio no dado. Ver "11999998888" na coluna "CPF" na terceira linha da
   amostra custa cinco segundos; descobrir isso depois custa achar e apagar
   trezentas linhas na mão, numa base que já está sendo trabalhada.

   POR QUE COLAR, E NÃO SÓ O LINK: colar funciona sempre. Abrir outra planilha
   pelo link exige que a conta que roda o PGO tenha acesso a ela, e esse é
   exatamente o tipo de permissão que falta na hora errada. O link fica como a
   opção melhor para quem repete a importação toda semana; colar fica como a
   que nunca depende de nada.
   ============================================================================ */

var TelaImportacao = (function () {

  var canalEscolhido = '';
  var pacoteDoSistema = null;
  var opcoes = null;          // colunas, analistas, lotes já importados
  var laudo = null;           // o resultado do passo 2, enquanto não se grava
  var resultado = null;       // o que entrou, depois de gravar

  var fonte = { tipo: 'colado', texto: '', planilhaId: '', aba: '' };
  var deParaEscolhido = null; // o que a pessoa ajustou na tela
  var analistasMarcados = {};
  // null = ninguém escolheu ainda neste canal: aí vale o que o servidor
  // sugere (a proposta no mesmo mês, na RET). Vazio é escolha de verdade —
  // "trazer tudo" —, e por isso não pode servir de "não escolhido".
  var colunaQueIdentifica = null;
  var nomeDoLote = '';
  // O status de todos os casos do lote. null = ainda não escolheu: vale o
  // padrão do canal (Não trabalhado na RET, sem status na Mesa). Vazio é
  // "sem status", escolha de verdade.
  var statusDoLote = null;
  // Etapa 45: a data de recepção dos casos (RET) — 'planilha' (sem data fica
  // hoje) ou 'hoje' (todos com a data de hoje).
  var dataDeRecepcao = 'planilha';
  // O que importar. Na Mesa há dois destinos: os casos do canal e os
  // atendimentos do chat (pedido do PO: "ler uma planilha de chat ficou confuso"
  // — agora o chat entra por esta mesma tela). O fluxo é o mesmo; muda o
  // servidor que confere e grava, e o texto.
  var oQueImportar = 'casos';
  var canalAceitaChat = false;
  function ehChat() { return oQueImportar === 'chat'; }
  function oQue(plural) {
    return ehChat() ? (plural ? 'atendimentos' : 'atendimento') : (plural ? 'casos' : 'caso');
  }

  function escapar(texto) { return Moldura.escapar(texto); }
  function elemento(id) { return document.getElementById(id); }

  /* --------------------------------------------------------------- montar */

  function montar(pacote) {
    pacoteDoSistema = pacote;
    if (!canalEscolhido && pacote.canais.length) canalEscolhido = pacote.canais[0].id;
    return SeletorDeCanal.montar(pacote.canais, canalEscolhido)
      + '<div id="importacao"><p class="carregando-campos">'
      + 'Lendo as colunas do canal…</p></div>';
  }

  function carregar() {
    var caixa = elemento('importacao');
    if (caixa) {
      caixa.innerHTML = '<p class="carregando-campos">Lendo as colunas do canal…</p>';
    }
    Servidor.chamar('opcoesDaImportacaoDeCasos', canalEscolhido)
      .entao(function (resposta) {
        canalAceitaChat = resposta.aceitaChat === true;
        if (!canalAceitaChat) oQueImportar = 'casos';
        laudo = null;
        resultado = null;
        deParaEscolhido = null;
        if (!ehChat()) {
          opcoes = resposta;
          if (colunaQueIdentifica === null) {
            colunaQueIdentifica = resposta.repeticaoPadrao || '';
          }
          desenhar();
          return;
        }
        Servidor.chamar('opcoesDaImportacaoDoChat')
          .entao(function (doChat) { opcoes = doChat; desenhar(); })
          .senao(function (erro) {
            elemento('importacao').innerHTML = '<p class="carregando-campos erro-carga">'
              + escapar(erro.message || String(erro)) + '</p>';
          });
      })
      .senao(function (erro) {
        elemento('importacao').innerHTML = '<p class="carregando-campos erro-carga">'
          + escapar(erro.message || String(erro)) + '</p>';
      });
  }

  /* -------------------------------------------------------------- desenho */

  function desenhar() {
    elemento('importacao').innerHTML = resultado
      ? desenharResultado()
      : (desenharFonte() + (laudo ? desenharLaudo() : ''));
    ligar();
  }

  /** Passo 1: de onde vem o dado. */
  function desenharFonte() {
    var colado = fonte.tipo === 'colado';

    return escolhaDoQueImportar()
      + '<section class="cartaa importação-passo">'
      + '<header class="grafico-cabeca"><h3>1. De onde vêm os ' + oQue(true) + '</h3></header>'
      + (ehChat() && opcoes.abaExiste === false
        ? '<p class="aviso-janela">A aba ATENDIMENTOS_CHAT ainda não existe nesta planilha. '
          + 'Rode atualizarPGO() no editor do Apps Script antes de importar.</p>' : '')
      + (ehChat()
        ? '<p class="config-dica">Uma linha por atendimento. São obrigatórias a <strong>data'
          + '</strong> e o <strong>analista</strong>; SUSEP, corretora, assunto, consultor, '
          + 'vida individual ou em grupo, sucursal, tabulação, sub assunto e TMO (em segundos, '
          + 'como 1.152) são opcionais — o que a origem não trouxer fica em branco. A linha igual a uma que já entrou é '
          + 'pulada — importar a mesma planilha de novo não conta em dobro.</p>' : '')
      + '<div class="config-abas">'
      + '<button type="button" class="config-aba' + (colado ? ' atual' : '') + '"'
      + ' data-fonte="colado">Colar da planilha</button>'
      + '<button type="button" class="config-aba' + (colado ? '' : ' atual') + '"'
      + ' data-fonte="planilha">Ler outra planilha pelo link</button>'
      + '</div>'
      + (colado ? desenharColar() : desenharLink())
      + '<p class="config-dica">A primeira linha tem de ser a dos NOMES das '
      + 'colunas. É por ela que o sistema descobre para onde cada coluna vai. '
      + 'Até ' + opcoes.limite + ' linhas por vez.</p>'
      + '<div class="config-acoes">'
      + '<button type="button" class="botao" id="conferir-importacao">'
      + 'Conferir antes de importar</button></div>'
      + '</section>';
  }

  /** Na Mesa: casos do canal ou atendimentos do chat. Nos outros canais, nada. */
  function escolhaDoQueImportar() {
    if (!canalAceitaChat) return '';
    return '<div class="config-abas" role="group" aria-label="O que importar">'
      + '<button type="button" class="config-aba' + (ehChat() ? '' : ' atual') + '"'
      + ' data-o-que-importar="casos">Casos do canal</button>'
      + '<button type="button" class="config-aba' + (ehChat() ? ' atual' : '') + '"'
      + ' data-o-que-importar="chat">Atendimentos do chat</button></div>';
  }

  function desenharColar() {
    return '<label class="campo largura-2"><span>Cole aqui, com o cabeçalho</span>'
      + '<textarea id="texto-colado" rows="8" spellcheck="false"'
      + ' placeholder="CPF&#9;Nome&#9;Produto&#10;12345678900&#9;Maria&#9;Vida Individual">'
      + escapar(fonte.texto) + '</textarea></label>';
  }

  function desenharLink() {
    return '<div class="grade">'
      + '<label class="campo"><span>Id da planilha</span>'
      + '<input type="text" id="planilha-id" value="' + escapar(fonte.planilhaId) + '"'
      + ' placeholder="o pedaço do endereço entre /d/ e /edit"></label>'
      + '<label class="campo"><span>Nome da aba</span>'
      + '<input type="text" id="planilha-aba" value="' + escapar(fonte.aba) + '"'
      + ' placeholder="em branco = a primeira aba"></label>'
      + '</div>'
      + '<p class="config-dica">A conta que abre o PGO precisa ter acesso a essa '
      + 'planilha. Se não tiver, o sistema diz isso em vez de importar pela metade.</p>';
  }

  /** Passo 2: o laudo, que é a razão de a tela existir. */
  function desenharLaudo() {
    return '<section class="cartaa importação-passo">'
      + '<header class="grafico-cabeca"><h3>2. Confira antes de gravar</h3></header>'
      + desenharContagem()
      + desenharDePara()
      + desenharAmostra()
      + desenharDestino()
      + '<div class="config-acoes">'
      + '<button type="button" class="botao" id="importar-agora"'
      + (laudo.vaoEntrar ? '' : ' disabled') + '>'
      + 'Importar ' + laudo.vaoEntrar + ' ' + oQue(false) + '(s)</button>'
      + '<button type="button" class="botao vazado" id="recomecar-do-laudo">'
      + 'Recomeçar</button></div>'
      + '</section>';
  }

  function desenharContagem() {
    var pulados = laudo.vaoSerPuladas
      ? '<div class="indicador tom-atencao" title="'
        + laudo.motivosParaPular.vazia + ' em branco, '
        + laudo.motivosParaPular.repetida + ' repetidas">'
        + '<span class="rotulo">Vão ser puladas'
        + '</span><strong class="numero">' + laudo.vaoSerPuladas + '</strong>'
        + '</div>'
      : '';

    return '<div class="cartoes">'
      + '<div class="indicador tom-neutro"><span class="rotulo">Linhas na origem'
      + '</span><strong class="numero">' + laudo.linhasNaFonte + '</strong></div>'
      + '<div class="indicador tom-bom"><span class="rotulo">Vão entrar</span>'
      + '<strong class="numero">' + laudo.vaoEntrar + '</strong></div>'
      + pulados
      + (laudo.premios || []).map(function (premio) {
        return '<div class="indicador tom-neutro" title="Soma da coluna &quot;'
          + escapar(premio.coluna) + '&quot; dos ' + premio.casos + ' caso(s) que vão entrar e '
          + 'trazem o valor"><span class="rotulo">' + escapar(premio.rotulo) + ' importado'
          + '</span><strong class="numero">' + emReais(premio.total) + '</strong></div>';
      }).join('')
      + '</div>'
      + porQueRepetem(laudo.motivosParaPular, 'vão ficar de fora')
      + (laudo.passaDoLimite
        ? '<p class="aviso-janela">São ' + laudo.linhasNaFonte + ' linhas, e o '
          + 'limite é ' + laudo.limite + '. Divida em levas: se o mapeamento '
          + 'estiver errado, o estrago é menor.</p>'
        : '');
  }

  /**
   * O de-para, uma linha por coluna da origem.
   *
   * Vem sugerido pelo servidor, casando nome com nome. A pessoa corrige o que
   * não reconheceu e deixa em "— não trazer —" o que não interessa: uma base de
   * inadimplentes tem colunas que o PGO não quer, e forçar um destino para
   * todas encheria a base de colunas de outra operação.
   */
  function desenharDePara() {
    var atual = deParaEscolhido || laudo.dePara;

    return '<h4 class="importacao-titulo">Para onde vai cada coluna</h4>'
      + '<table class="fila importacao-depara"><thead><tr>'
      + '<th>Na planilha de origem</th><th>Vai para esta coluna do canal</th>'
      + '</tr></thead><tbody>'
      + atual.map(function (par, i) {
        return '<tr><td><code>' + escapar(par.daFonte || '(sem nome)') + '</code></td>'
          + '<td><input type="search" class="filtro procurar-coluna" data-procurar-coluna="' + i + '"'
          + ' placeholder="Digite para procurar a coluna" aria-label="Procurar a coluna para '
          + escapar(par.daFonte || '(sem nome)') + '">'
          + '<select class="filtro" data-depara="' + i + '">'
          + opcoesDeColuna(par.paraAColuna, '') + '</select>'
          + (par.lembrado ? '<span class="config-dica">como na última importação</span>' : '')
          + '</td></tr>';
      }).join('')
      + '</tbody></table>'
      + (algumCarimboEscolhido(atual)
        ? '<p class="config-dica aviso-de-carimbo">Você apontou a origem para '
          + 'uma coluna de <strong>controle de produtividade</strong>. É o certo '
          + 'quando a base antiga guarda a data de verdade do contato — e é '
          + 'assim que esses casos passam a contar em "Já contatados". Confira '
          + 'nas três linhas traduzidas abaixo se a data chegou certa.</p>'
        : '');
  }

  /**
   * As opções de um seletor do de-para, em ORDEM ALFABÉTICA (Etapa 48, pedido
   * do PO: "dificuldade de localizar determinados nomes"). Com `termo`, só as
   * colunas que o contêm — sem acento e sem maiúscula —, mais a escolhida, que
   * nunca some do seletor só porque a busca não a acha.
   */
  function opcoesDeColuna(escolhida, termo) {
    var procurado = normalizarTexto(termo);
    var colunas = opcoes.colunasDoCanal.slice().sort(function (uma, outra) {
      return normalizarTexto(uma).localeCompare(normalizarTexto(outra));
    }).filter(function (coluna) {
      return !procurado || coluna === escolhida || normalizarTexto(coluna).indexOf(procurado) >= 0;
    });
    return ['<option value="">— não trazer —</option>'].concat(colunas.map(function (coluna) {
      return '<option value="' + escapar(coluna) + '"'
        + (escolhida === coluna ? ' selected' : '') + '>'
        + escapar(coluna)
        // A coluna de carimbo é destino permitido, mas não é uma coluna
        // qualquer: ela alimenta a Produtividade RECC. O aviso vai no
        // próprio nome, onde a pessoa está olhando na hora de escolher.
        + (ehCarimbo(coluna) ? '  (controle de produtividade)' : '')
        + '</option>';
    })).join('');
  }

  function normalizarTexto(texto) {
    return String(texto === null || texto === undefined ? '' : texto)
      .normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase().trim();
  }

  /** A coluna é um carimbo de status? O servidor diz quais são. */
  function ehCarimbo(coluna) {
    return (opcoes.colunasDeCarimbo || []).indexOf(coluna) >= 0;
  }

  function algumCarimboEscolhido(dePara) {
    return dePara.some(function (par) { return ehCarimbo(par.paraAColuna); });
  }

  /**
   * As primeiras linhas JÁ TRADUZIDAS.
   *
   * É o único lugar da tela em que um mapeamento trocado aparece. O cabeçalho
   * "CPF" apontando para a coluna "telefones de contato" parece certo na tabela
   * de cima e salta aos olhos aqui.
   */
  function desenharAmostra() {
    if (!laudo.amostra.length) {
      return '<p class="config-dica">Nenhuma linha entraria, então não há o que '
        + 'mostrar. Confira o de-para acima.</p>';
    }

    var colunas = [];
    laudo.amostra.forEach(function (caso) {
      Object.keys(caso).forEach(function (coluna) {
        if (colunas.indexOf(coluna) < 0) colunas.push(coluna);
      });
    });

    return '<h4 class="importacao-titulo">As primeiras linhas, como vão ficar</h4>'
      + '<div class="rolagem-tabela"><table class="fila"><thead><tr>'
      + colunas.map(function (c) { return '<th>' + escapar(c) + '</th>'; }).join('')
      + '</tr></thead><tbody>'
      + laudo.amostra.map(function (caso) {
        return '<tr>' + colunas.map(function (coluna) {
          return '<td>' + escapar(caso[coluna] === undefined ? '' : caso[coluna])
            + '</td>';
        }).join('') + '</tr>';
      }).join('')
      + '</tbody></table></div>';
  }

  /**
   * No chat, o destino é só o nome do lote — não há analista a dividir, nem
   * status. E o laudo diz o que impediria a soma de juntar certo: a coluna
   * obrigatória que faltou ligar e o analista que o cadastro não conhece.
   */
  function desenharDestinoDoChat() {
    return (laudo.faltando && laudo.faltando.length
      ? '<p class="aviso-janela">Ligue no de-para acima a coluna de: <strong>'
        + escapar(laudo.faltando.join(' e ')) + '</strong>. Sem a data não há como recortar '
        + 'o período, e sem o analista não há de quem somar.</p>' : '')
      + (laudo.analistasDesconhecidos && laudo.analistasDesconhecidos.length
        ? '<p class="config-dica aviso-de-carimbo">Estes nomes não estão no cadastro de usuários: '
          + '<strong>' + escapar(laudo.analistasDesconhecidos.slice(0, 10).join(', ')) + '</strong>'
          + (laudo.analistasDesconhecidos.length > 10
            ? ' e mais ' + (laudo.analistasDesconhecidos.length - 10) : '')
          + '. Eles entram, mas no gráfico "Atendidos por analista" aparecem separados de quem '
          + 'tem o nome cadastrado. Se for a mesma pessoa escrita de outro jeito, acerte o nome '
          + 'na planilha de origem antes de importar.</p>' : '')
      + (laudo.semDataOuAnalista
        ? '<p class="config-dica">' + laudo.semDataOuAnalista + ' linha(s) sem data ou sem '
          + 'analista ficam de fora.</p>' : '')
      + (laudo.tmoQueNaoENumero
        ? '<p class="config-dica aviso-de-carimbo">' + laudo.tmoQueNaoENumero + ' linha(s) '
          + 'com um TMO que não é número (em segundos, como 1.152). Elas entram, com o TMO em '
          + 'branco para você preencher.</p>' : '')
      + '<h4 class="importacao-titulo">Como se chama o lote</h4>'
      + '<div class="grade">' + caixaDoNomeDoLote('Chat de outubro') + '</div>';
  }

  /** A caixa do nome do lote, com os lotes já usados — a mesma nos dois destinos. */
  function caixaDoNomeDoLote(exemplo) {
    return '<label class="campo largura-2"><span>Nome do lote</span>'
      + '<input type="text" id="nome-do-lote" value="' + escapar(nomeDoLote) + '"'
      + ' placeholder="' + escapar(exemplo) + '"'
      + (opcoes.lotes.length ? ' list="lotes-ja-usados"' : '') + '>'
      + (opcoes.lotes.length
        ? '<datalist id="lotes-ja-usados">' + opcoes.lotes.map(function (lote) {
          return '<option value="' + escapar(lote.origem) + '"></option>';
        }).join('') + '</datalist>'
        : '')
      + '</label>';
  }

  /** Nome do lote, para quem vai, e o que não repetir. */
  function desenharDestino() {
    if (ehChat()) return desenharDestinoDoChat();
    return '<h4 class="importacao-titulo">De quem são, e como se chama o lote</h4>'
      + '<div class="grade">'
      + caixaDoNomeDoLote('Base de inadimplentes Vida Presente')
      + '<label class="campo"><span>Não repetir o que já entrou, comparando por</span>'
      + '<select class="filtro" id="coluna-que-identifica">'
      + ['<option value="">— trazer tudo, mesmo repetido —</option>']
        // Pedido do PO para a RET: a mesma proposta no mesmo mês não entra na
        // divisão. Vem marcada; trocar ou desmarcar continua na mão de quem
        // importa.
        .concat(opcoes.repeticaoPelaProposta
          ? ['<option value="@PROPOSTA_NO_MES"'
            + (colunaQueIdentifica === '@PROPOSTA_NO_MES' ? ' selected' : '')
            + '>Proposta no mesmo mês</option>']
          : [])
        .concat(opcoes.colunasDoCanal.map(function (coluna) {
          return '<option value="' + escapar(coluna) + '"'
            + (colunaQueIdentifica === coluna ? ' selected' : '') + '>'
            + escapar(coluna) + '</option>';
        })).join('')
      + '</select></label>'
      + '</div>'
      + '<p class="config-dica">A base é atualizada toda semana e boa parte dela '
      + 'repete. Escolhendo uma coluna que identifica o caso — o CPF, o número da '
      + 'proposta — o que já está dentro é pulado, e o laudo diz quantos.'
      + (opcoes.repeticaoPelaProposta
        ? ' Aqui já vem marcada a <strong>proposta no mesmo mês</strong>: a mesma '
          + 'proposta (código e número), já cadastrada no mês do caso ou repetida '
          + 'no arquivo, não entra na divisão.'
        : '')
      + '</p>'
      + desenharAnalistas()
      + escolhaDoStatusDoLote()
      + escolhaDaDataDeRecepcao();
  }

  /*
    O STATUS DE TODOS OS CASOS DO LOTE. Pedido do PO: escolher, e não mais só o
    "Não trabalhado". Vale para o caso que a fonte trouxe sem status; o que veio
    com status na coluna ligada no de-para fica com o dele. Não carimba data —
    o caso é antigo.
  */
  function escolhaDoStatusDoLote() {
    var lista = opcoes.statusDoCanal || [];
    if (!lista.length) return '';
    var vale = statusQueVale();
    return '<div class="grade"><label class="campo">'
      + '<span>Status dos casos importados</span>'
      + '<select class="filtro" id="status-do-lote">'
      + '<option value=""' + (vale === '' ? ' selected' : '') + '>— sem status —</option>'
      + lista.map(function (status) {
        return '<option value="' + escapar(status.valor) + '"'
          + (status.valor === vale ? ' selected' : '') + '>' + escapar(status.rotulo) + '</option>';
      }).join('') + '</select></label></div>'
      + '<p class="config-dica">' + (vale
        ? 'Os casos sem status na planilha vão nascer em <strong>' + escapar(vale)
          + '</strong>; os que trazem o status numa coluna ligada acima ficam com o deles. '
          + 'A importação não carimba data: o caso é antigo, e a data de hoje diria que o '
          + 'contato foi hoje. O analista ajusta depois, caso a caso.'
        : 'Os casos sem status na planilha vão nascer <strong>sem status</strong>.'
          + (opcoes.statusQueEsperaAPessoa ? ' O prazo só começa quando alguém puser o caso '
            + 'em <strong>' + escapar(opcoes.statusQueEsperaAPessoa) + '</strong> — é aí que '
            + 'o sistema anota a data.' : ''))
      + '</p>';
  }

  /**
   * A data de recepção dos casos (Etapa 45, só na RET). Pedido do PO: "muitas
   * bases não têm uma data de recepção — podemos escolher que venha com a data
   * de hoje ou deixar a da planilha".
   */
  function escolhaDaDataDeRecepcao() {
    var coluna = opcoes.dataDeRecepcao;
    if (!coluna) return '';
    return '<div class="grade"><label class="campo">'
      + '<span>' + escapar(coluna.charAt(0).toUpperCase() + coluna.slice(1)) + '</span>'
      + '<select class="filtro" id="data-de-recepcao">'
      + '<option value="planilha"' + (dataDeRecepcao === 'planilha' ? ' selected' : '')
      + '>A da planilha (sem data, fica a de hoje)</option>'
      + '<option value="hoje"' + (dataDeRecepcao === 'hoje' ? ' selected' : '')
      + '>A data de hoje, para todos os casos</option>'
      + '</select></label></div>'
      + '<p class="config-dica">' + (dataDeRecepcao === 'hoje'
        ? 'Todos os casos vão entrar com a data de hoje, mesmo os que trazem data na planilha.'
        : 'Vale a data que a planilha trouxer; o caso que vier sem data entra com a de hoje.')
      + '</p>';
  }

  /**
   * Quem recebe os casos.
   *
   * Vários marcados = rodízio, em partes iguais. É o pedido da operação:
   * "uma base com 100 casos ou 300 casos podemos incluir no individual para
   * cada analista". Nenhum marcado deixa a coluna de responsável como a origem
   * mandou — que é o certo quando a própria base já traz o analista.
   */
  /** Quem é deste canal e está de férias ou afastado. Pode vir vazio. */
  function quemEstaFora() {
    return (opcoes && opcoes.foraDaDivisao) || [];
  }

  /*
    Diz quem NÃO está na lista, e por quê.

    Sem isto, a coordenação procura um nome que ela sabe que trabalha no canal,
    não acha, e a única conclusão possível é "o sistema está errado" — quando
    o certo é "ela está de férias, e por isso não recebe". O silêncio aqui
    custa um chamado e uma desconfiança.
  */
  function desenharQuemEstaFora() {
    var fora = quemEstaFora();
    if (!fora.length) return '';

    return '<p class="config-dica">Fora da divisão hoje: '
      + fora.map(function (pessoa) {
        return '<strong>' + escapar(pessoa.nome) + '</strong> — '
          + escapar(pessoa.porque);
      }).join('; ')
      + '. Continuam com acesso ao sistema; só não recebem lote. '
      + 'Isso se ajusta em Configurações › Usuários.</p>';
  }

  function desenharAnalistas() {
    if (!opcoes.analistas.length) {
      /*
        Lista vazia é RESPOSTA, e a tela tem de dizer qual. São duas causas
        diferentes, e a saída de cada uma é outra: ou ninguém deste canal foi
        cadastrado, ou todo mundo está de férias. Um recado só para as duas
        mandaria metade das pessoas para o lugar errado.
      */
      return '<p class="config-dica">' + (quemEstaFora().length
        ? 'Todo mundo deste canal está fora da divisão hoje ('
          + escapar(quemEstaFora().map(function (p) {
            return p.nome + ' — ' + p.porque;
          }).join('; ')) + '). Os casos entram sem responsável. Ajuste a '
          + 'disponibilidade em Configurações › Usuários.'
        : 'Ninguém deste canal está cadastrado e disponível, então os casos '
          + 'entram sem responsável. Em Configurações › Usuários, escolha o '
          + 'CANAL de cada analista — a divisão é só entre quem é do canal '
          + 'que você escolheu aqui em cima.') + '</p>';
    }

    var quantos = Object.keys(analistasMarcados).filter(function (nome) {
      return analistasMarcados[nome];
    }).length;

    // A lista já vem SÓ com quem é deste canal e está disponível — o servidor
    // filtra, a pedido do PO: "distribua apenas para o canal que escolhi".
    // A tela não precisa mais marcar "de outro canal", porque de outro canal
    // não chega aqui.
    return '<h4 class="importacao-titulo">Dividir entre</h4>'
      + '<div class="config-marcadores">'
      + opcoes.analistas.map(function (pessoa) {
        return '<label class="config-chave">'
          + '<input type="checkbox"'
          + ' data-analista="' + escapar(pessoa.nome) + '"'
          + (analistasMarcados[pessoa.nome] ? ' checked' : '') + '>'
          + '<span>' + escapar(pessoa.nome) + '</span></label>';
      }).join('')
      + '</div>'
      + desenharQuemEstaFora()
      + '<p class="config-dica">'
      + (quantos
        ? 'Os casos vão ser divididos em partes iguais entre os ' + quantos
          + ' marcado(s), em rodízio.'
        : 'Ninguém marcado: o responsável vai ser o que vier na planilha de '
          + 'origem, se ela trouxer um.')
      + '</p>';
  }

  /** Passo 3: o que entrou. */
  /** R$ 1.234,56 — o prêmio, como a operação lê. */
  function emReais(valor) {
    var numero = Number(valor) || 0;
    return 'R$ ' + numero.toFixed(2).replace('.', ',').replace(/\B(?=(\d{3})+(?!\d))/g, '.');
  }

  /**
   * Por que cada repetida fica de fora — pedido do PO (Etapa 45): "deve ficar
   * claro o porquê não foram importadas, se é pela planilha importada ou porque
   * já tem no PGO naquele mês". Com as propostas (até 50 de cada).
   */
  function porQueRepetem(motivos, verbo) {
    if (!motivos || !motivos.repetida) return '';
    var oQue = motivos.pelaProposta ? 'proposta(s)' : 'caso(s)';
    var lista = function (itens, total) {
      return itens.length ? ': <strong>' + escapar(itens.join(', ')) + '</strong>'
        + (total > itens.length ? ' e mais ' + (total - itens.length) : '') : '';
    };
    return (motivos.jaNoPgo
      ? '<p class="config-dica aviso-de-carimbo">' + motivos.jaNoPgo + ' ' + oQue + ' ' + verbo
        + ' porque <strong>já estão no PGO</strong>' + (motivos.mes ? ' em ' + escapar(motivos.mes) : '')
        + lista(motivos.listaNoPgo || [], motivos.jaNoPgo) + '.</p>' : '')
      + (motivos.repetidaNoArquivo
        ? '<p class="config-dica aviso-de-carimbo">' + motivos.repetidaNoArquivo + ' ' + oQue + ' '
          + verbo + ' porque <strong>se repetem na própria planilha</strong> (entra só a primeira)'
          + lista(motivos.listaNoArquivo || [], motivos.repetidaNoArquivo) + '.</p>' : '');
  }

  function desenharResultado() {
    return '<section class="cartaa importação-passo">'
      + '<header class="grafico-cabeca"><h3>Importado</h3></header>'
      + '<div class="cartoes">'
      + '<div class="indicador tom-bom"><span class="rotulo">'
      + (ehChat() ? 'Atendimentos que entraram' : 'Casos que entraram')
      + '</span><strong class="numero">' + resultado.entraram + '</strong></div>'
      + (resultado.pulados.repetida
        ? '<div class="indicador tom-atencao"><span class="rotulo">Repetidas, ficaram de fora'
          + '</span><strong class="numero">' + resultado.pulados.repetida
          + '</strong></div>'
        : '')
      + (resultado.premios || []).map(function (premio) {
        return '<div class="indicador tom-neutro"><span class="rotulo">' + escapar(premio.rotulo)
          + ' importado</span><strong class="numero">' + emReais(premio.total) + '</strong></div>';
      }).join('')
      + (resultado.pulados.vazia
        ? '<div class="indicador tom-neutro"><span class="rotulo">Linhas em branco'
          + '</span><strong class="numero">' + resultado.pulados.vazia
          + '</strong></div>'
        : '')
      + '</div>'
      + porQueRepetem(resultado.pulados, 'ficaram de fora')
      + '<p>Lote <strong>' + escapar(resultado.origem) + '</strong>, em '
      + escapar(resultado.canal) + '.'
      + (resultado.primeiroId
        ? ' Do caso ' + escapar(resultado.primeiroId) + ' ao '
          + escapar(resultado.ultimoId) + '.'
        : '')
      + '</p>'
      + (resultado.analistas.length
        ? '<p class="config-dica">Divididos entre: '
          + escapar(resultado.analistas.join(', ')) + '.</p>'
        : '')
      + (ehChat()
        ? '<p class="config-dica">A Produtividade da Mesa já soma estes atendimentos aos casos '
          + 'do sistema, na aba "Atendidos".</p>'
        : '<p class="config-dica">A Produtividade RECC já mostra este lote no '
          + 'gráfico de casos importados por dia.</p>')
      + '<div class="config-acoes">'
      + '<button type="button" class="botao" id="importar-outro-lote">'
      + 'Importar outro lote</button></div>'
      + '</section>';
  }

  /* --------------------------------------------------------- comportamento */

  function ligar() {
    SeletorDeCanal.ligar(function (id) {
      canalEscolhido = id;
      fonte = { tipo: fonte.tipo, texto: '', planilhaId: '', aba: '' };
      analistasMarcados = {};
      colunaQueIdentifica = null;   // o canal novo traz a sugestão dele
      nomeDoLote = '';
      statusDoLote = null;          // e o status padrão dele
      dataDeRecepcao = 'planilha';
      desenharSeletor();
      carregar();
    });

    cliques('[data-o-que-importar]', function (botao) {
      var escolha = botao.getAttribute('data-o-que-importar');
      if (escolha === oQueImportar) return;
      guardarOQueEstaNaTela();
      oQueImportar = escolha;
      nomeDoLote = '';
      carregar();
    });

    cliques('[data-fonte]', function (botao) {
      fonte.tipo = botao.getAttribute('data-fonte');
      laudo = null;
      guardarOQueEstaNaTela();
      desenhar();
    });

    cliques('#conferir-importacao', conferir);
    cliques('#importar-agora', importar);
    // Dois ids, e não um: os dois botões dizem coisas diferentes ("Recomeçar"
    // depois de conferir, "Importar outro lote" depois de gravar) e nunca estão
    // na tela juntos. Compartilhar id é o achado 21 esperando a terceira tela
    // que os coloque lado a lado.
    cliques('#recomecar-do-laudo, #importar-outro-lote', function () {
      laudo = null;
      resultado = null;
      deParaEscolhido = null;
      desenhar();
    });

    mudancas('[data-depara]', escolherColuna);

    // A busca de cada linha do de-para (Etapa 48): a cada letra, o seletor ao
    // lado mostra só as colunas que contêm o texto. Sobrou uma só, ela fica
    // escolhida — digitar "segur" e achar "nome do segurado" já basta.
    var buscas = document.querySelectorAll('#importacao [data-procurar-coluna]');
    for (var b = 0; b < buscas.length; b++) {
      buscas[b].addEventListener('input', function () {
        var seletor = document.querySelector('#importacao [data-depara="'
          + this.getAttribute('data-procurar-coluna') + '"]');
        if (!seletor) return;
        seletor.innerHTML = opcoesDeColuna(seletor.value, this.value);
        var achadas = Array.prototype.filter.call(seletor.options, function (opcao) {
          return opcao.value !== '';
        });
        if (this.value.trim() && achadas.length === 1 && seletor.value !== achadas[0].value) {
          seletor.value = achadas[0].value;
          escolherColuna(seletor);
        }
      });
    }

    mudancas('[data-analista]', function (caixa) {
      analistasMarcados[caixa.getAttribute('data-analista')] = caixa.checked;
      // Só o texto de baixo muda; redesenhar a tela inteira aqui apagaria o
      // que a pessoa já escreveu no nome do lote e nas caixas do de-para.
      guardarOQueEstaNaTela();
    });

    mudancas('#coluna-que-identifica', function (caixa) {
      colunaQueIdentifica = caixa.value;
    });

    // O status do lote muda o texto de baixo, e o laudo já conferido vale
    // para o status de antes: guardar o que está na tela e redesenhar.
    mudancas('#status-do-lote', function () {
      guardarOQueEstaNaTela();
      desenhar();
    });
    mudancas('#data-de-recepcao', function () {
      guardarOQueEstaNaTela();
      desenhar();
    });
  }

  function escolherColuna(caixa) {
    if (!deParaEscolhido) {
      deParaEscolhido = laudo.dePara.map(function (par) {
        return { daFonte: par.daFonte, paraAColuna: par.paraAColuna, lembrado: par.lembrado === true };
      });
    }
    var par = deParaEscolhido[Number(caixa.getAttribute('data-depara'))];
    par.paraAColuna = caixa.value;
    par.lembrado = false;   // agora é escolha desta importação
  }

  function desenharSeletor() {
    var antigo = document.querySelector('.canais');
    if (!antigo || !antigo.parentNode) return;
    var novo = document.createElement('div');
    novo.innerHTML = SeletorDeCanal.montar(pacoteDoSistema.canais, canalEscolhido);
    antigo.parentNode.replaceChild(novo.firstChild, antigo);
  }

  function cliques(seletor, oQueFazer) {
    var achados = document.querySelectorAll('#importacao ' + seletor);
    for (var i = 0; i < achados.length; i++) {
      achados[i].addEventListener('click', function () { oQueFazer(this); });
    }
  }

  function mudancas(seletor, oQueFazer) {
    var achados = document.querySelectorAll('#importacao ' + seletor);
    for (var i = 0; i < achados.length; i++) {
      achados[i].addEventListener('change', function () { oQueFazer(this); });
    }
  }

  /**
   * Recolhe o que está digitado antes de redesenhar.
   *
   * Sem isto, trocar de aba ou marcar um analista apagaria o texto colado e o
   * nome do lote — e a pessoa colaria trezentas linhas duas vezes.
   */
  function guardarOQueEstaNaTela() {
    var colado = elemento('texto-colado');
    if (colado) fonte.texto = colado.value;

    var id = elemento('planilha-id');
    if (id) fonte.planilhaId = id.value.trim();

    var aba = elemento('planilha-aba');
    if (aba) fonte.aba = aba.value.trim();

    var lote = elemento('nome-do-lote');
    if (lote) nomeDoLote = lote.value;

    var chave = elemento('coluna-que-identifica');
    if (chave) colunaQueIdentifica = chave.value;

    var status = elemento('status-do-lote');
    if (status) statusDoLote = status.value;

    var recepcao = elemento('data-de-recepcao');
    if (recepcao) dataDeRecepcao = recepcao.value;
  }

  /** O status que vale agora: o escolhido, ou o padrão do canal. */
  function statusQueVale() {
    return statusDoLote === null ? (opcoes.statusPadrao || '') : statusDoLote;
  }

  function conferir() {
    guardarOQueEstaNaTela();

    var botao = elemento('conferir-importacao');
    if (botao) { botao.disabled = true; botao.textContent = 'Conferindo…'; }

    var conferencia = ehChat()
      ? Servidor.chamarSemPressa('conferirImportacaoDoChat', { fonte: fonte, dePara: deParaEscolhido })
      : Servidor.chamarSemPressa('conferirImportacaoDeCasos', canalEscolhido, {
        fonte: fonte,
        dePara: deParaEscolhido,
        colunaQueIdentifica: colunaQueIdentifica || '',
        statusDoLote: statusQueVale(),
        dataDeRecepcao: opcoes.dataDeRecepcao ? dataDeRecepcao : ''
      });
    conferencia
      .entao(function (resposta) {
        laudo = resposta;
        deParaEscolhido = null;   // o servidor acabou de sugerir; a tela obedece
        desenhar();
        avisarDaConferencia();
      })
      .senao(function (erro) {
        if (botao) {
          botao.disabled = false;
          botao.textContent = 'Conferir antes de importar';
        }
        avisarDoErro('Não deu para conferir', erro);
      });
  }

  /**
   * As SINALIZAÇÕES da conferência num pop-up (Etapa 57, pedido do PO: "falta
   * pop-ups na aba de importação para sinalizações"). Os avisos amarelos
   * continuam no laudo, com o detalhe; o pop-up junta todos de uma vez para
   * nenhum passar batido no meio da tela. Sem aviso, não abre nada.
   */
  function avisosDaConferencia() {
    var avisos = [];
    var motivos = laudo.motivosParaPular || {};
    var deQue = motivos.pelaProposta ? 'proposta(s)' : oQue(false) + '(s)';

    if (!laudo.vaoEntrar) {
      avisos.push('<strong>Nenhum ' + oQue(false) + ' vai entrar.</strong> Confira o de-para e '
        + 'a origem antes de importar.');
    }
    if (laudo.passaDoLimite) {
      avisos.push('São <strong>' + laudo.linhasNaFonte + ' linhas</strong>, e o limite é '
        + laudo.limite + '. Divida em levas.');
    }
    if (motivos.jaNoPgo) {
      avisos.push('<strong>' + motivos.jaNoPgo + ' ' + deQue + '</strong> vão ficar de fora porque '
        + 'já estão no PGO' + (motivos.mes ? ' em ' + escapar(motivos.mes) : '') + '.');
    }
    if (motivos.repetidaNoArquivo) {
      avisos.push('<strong>' + motivos.repetidaNoArquivo + ' ' + deQue + '</strong> vão ficar de fora '
        + 'porque se repetem na própria planilha (entra só a primeira).');
    }
    if (motivos.vazia) {
      avisos.push('<strong>' + motivos.vazia + ' linha(s) em branco</strong> vão ser puladas.');
    }
    if (algumCarimboEscolhido(laudo.dePara || [])) {
      avisos.push('Você apontou uma coluna de <strong>controle de produtividade</strong>. Confira '
        + 'nas linhas traduzidas se a data chegou certa.');
    }
    if (laudo.faltando && laudo.faltando.length) {
      avisos.push('Falta ligar no de-para a coluna de: <strong>'
        + escapar(laudo.faltando.join(' e ')) + '</strong>.');
    }
    if (laudo.analistasDesconhecidos && laudo.analistasDesconhecidos.length) {
      avisos.push('<strong>' + laudo.analistasDesconhecidos.length + ' nome(s)</strong> não estão no '
        + 'cadastro de usuários: ' + escapar(laudo.analistasDesconhecidos.slice(0, 10).join(', '))
        + (laudo.analistasDesconhecidos.length > 10
          ? ' e mais ' + (laudo.analistasDesconhecidos.length - 10) : '') + '.');
    }
    if (laudo.semDataOuAnalista) {
      avisos.push('<strong>' + laudo.semDataOuAnalista + ' linha(s)</strong> sem data ou sem '
        + 'analista ficam de fora.');
    }
    if (laudo.tmoQueNaoENumero) {
      avisos.push('<strong>' + laudo.tmoQueNaoENumero + ' linha(s)</strong> com um TMO que não é '
        + 'número entram com o TMO em branco.');
    }
    return avisos;
  }

  function avisarDaConferencia() {
    var avisos = avisosDaConferencia();
    if (!avisos.length) return;
    Formulario.avisar({
      tom: 'atencao',
      titulo: avisos.length === 1 ? '1 ponto de atenção na conferência'
        : avisos.length + ' pontos de atenção na conferência',
      html: '<ul>' + avisos.map(function (aviso) { return '<li>' + aviso + '</li>'; }).join('')
        + '</ul><p>O detalhe de cada um está no laudo, abaixo.</p>',
      botao: 'Entendi'
    });
  }

  /** O erro do servidor no pop-up do sistema, e não na caixinha do navegador. */
  function avisarDoErro(titulo, erro) {
    Formulario.avisar({
      tom: 'ruim',
      titulo: titulo,
      html: '<p>' + escapar(erro && erro.message ? erro.message : String(erro)) + '</p>',
      botao: 'Entendi'
    });
  }

  function importar() {
    guardarOQueEstaNaTela();

    var escolhidos = Object.keys(analistasMarcados).filter(function (nome) {
      return analistasMarcados[nome];
    });

    // A confirmação diz o NÚMERO, porque é o número que não tem desfazer
    // fácil: importar errado se desfaz apagando linha por linha. É o pop-up
    // do sistema (Etapa 57), e não mais a caixinha do navegador.
    Formulario.avisar({
      tom: 'destaque',
      titulo: 'Importar ' + laudo.vaoEntrar + ' ' + oQue(false) + '(s) em ' + laudo.canal.nome + '?',
      html: '<p>Desfazer isso é apagar as linhas uma a uma.</p>',
      botao: 'Importar ' + laudo.vaoEntrar + ' ' + oQue(false) + '(s)',
      aoConfirmar: function () { gravar(escolhidos); }
    });
  }

  function gravar(escolhidos) {
    var botao = elemento('importar-agora');
    if (botao) { botao.disabled = true; botao.textContent = 'Gravando…'; }

    var gravacao = ehChat()
      ? Servidor.chamarSemPressa('importarAtendimentosDoChat', {
        fonte: fonte,
        dePara: deParaEscolhido || laudo.dePara,
        origem: nomeDoLote
      })
      : Servidor.chamarSemPressa('importarCasos', canalEscolhido, {
        fonte: fonte,
        dePara: deParaEscolhido || laudo.dePara,
        colunaQueIdentifica: colunaQueIdentifica || '',
        analistas: escolhidos,
        origem: nomeDoLote,
        statusDoLote: statusQueVale(),
        dataDeRecepcao: opcoes.dataDeRecepcao ? dataDeRecepcao : ''
      });
    gravacao
      .entao(function (resposta) {
        resultado = resposta;
        laudo = null;
        desenhar();
      })
      .senao(function (erro) {
        if (botao) {
          botao.disabled = false;
          botao.textContent = 'Importar ' + laudo.vaoEntrar + ' ' + oQue(false) + '(s)';
        }
        avisarDoErro('Não deu para importar', erro);
      });
  }

  return {
    montar: montar,
    ligar: function () { carregar(); }
  };
})();
</script>
