<script>
/* ============================================================================
   PGO — Produtividade.html · o que está acontecendo na operação
   ============================================================================
   Os gráficos são SVG escrito à mão, sem biblioteca de fora — pelo mesmo
   motivo dos ícones: o Apps Script serve a página num quadro isolado, e cada
   dependência externa é mais um ponto que pode não carregar. Gráfico que não
   carrega é pior que gráfico nenhum, porque a tela fica com um buraco.

   TRÊS REGRAS DE LEITURA, e todas têm motivo:

     UM EIXO SÓ. "Barras com linha" não são duas escalas. A linha é a média
     móvel da própria barra, na mesma altura: ela mostra a tendência por cima
     do ruído do dia a dia. Dois eixos fariam a mesma altura significar duas
     coisas — é o erro de gráfico mais comum que existe.

     COR PARA IDENTIDADE, TOM ÚNICO PARA MAGNITUDE. A pizza responde "de que
     tipo são" e usa cores; as barras respondem "quanto de cada" e usam um tom
     só. Oito cores para dizer "quanto" enterra a informação.

     O NÚMERO SEMPRE VISÍVEL. Todo gráfico tem rótulo direto e uma tabela por
     baixo. Cor é a segunda leitura, nunca a única — nem todo mundo enxerga
     cor, e nenhuma tela de trabalho pode depender disso.
   ============================================================================ */

var TelaProdutividade = (function () {

  var canalEscolhida = '';
  var filtros = {};
  /*
   * COMO o período foi escolhido, e não o período em si.
   *
   * Quem calcula as datas é o SERVIDOR. Se a tela calculasse, o dia que
   * aparece no gráfico sairia do relógio do navegador de quem está olhando, e
   * o dia que o servidor contou sairia do relógio da planilha. Num fechamento
   * de mês essa diferença é um dia inteiro de casos.
   */
  var periodo = { tipo: 'dias', dias: 0, de: '', ate: '', mes: '' };
  var painel = null;
  var tabelasAbertas = {};
  var pacoteDoSistema = null;

  function escapar(texto) { return Moldura.escapar(texto); }
  function elemento(id) { return document.getElementById(id); }

  /* --------------------------------------------------------------- montar */

  function montar(pacote) {
    pacoteDoSistema = pacote;
    if (!canalEscolhida && pacote.canais.length) canalEscolhida = pacote.canais[0].id;
    return SeletorDeCanal.montar(pacote.canais, canalEscolhida)
      + '<div id="analitico"><p class="carregando-campos">Somando os números…</p></div>';
  }

  function carregar() {
    var caixa = elemento('analitico');
    if (caixa) caixa.innerHTML = '<p class="carregando-campos">Somando os números…</p>';

    Servidor.chamar('produtividadeDaEquipe', canalEscolhida, filtros, periodo)
      .entao(function (resposta) {
        painel = resposta;
        desenhar();
      })
      .senao(function (erro) {
        elemento('analitico').innerHTML = '<p class="carregando-campos erro-carga">'
          + escapar(erro.message || String(erro)) + '</p>';
      });
  }

  function desenhar() {
    // O aviso vem ANTES dos gráficos, e não depois: depois, ele explica um
    // número que a pessoa já leu como se fosse o total.
    elemento('analitico').innerHTML = desenharFiltros()
      + desenharCartoes()
      + Moldura.avisoDeJanela(painel, 'Estes gráficos')
      + (painel.componentes.length
        ? '<div class="graficos">'
          + painel.componentes.map(desenharComponente).join('') + '</div>'
        : '<div class="cartao vazio"><strong>Nenhum gráfico configurado nesta '
          + 'canal.</strong><p>Um administrador monta os gráficos em '
          + 'Configurações → Painéis.</p></div>')
      + '<div id="detalhe-do-painel"></div>';
    ligarPainel();
  }

  /**
   * A variação em relação ao período anterior — igual à do Trabalho.
   *
   * Sem base de comparação o espaço fica em branco, e não "+100%": subir de
   * zero para um não é 100% de melhora, e um número que mente uma vez faz a
   * pessoa desconfiar dos outros.
   */
  function variacao(cartao) {
    if (cartao.variacao === null || cartao.variacao === undefined) {
      return '<span class="variacao vazia" aria-hidden="true">—</span>';
    }
    var subiu = cartao.variacao >= 0;
    return '<span class="variacao ' + (subiu ? 'subiu' : 'desceu') + '">'
      + (subiu ? '▲' : '▼') + ' ' + Math.abs(cartao.variacao) + '%'
      + '<em>vs. período anterior</em></span>';
  }

  /**
   * Os números que a operação pediu, antes dos gráficos.
   *
   * Vêm primeiro de propósito: "quantos reteve" é a pergunta, e o gráfico é a
   * explicação. Quem abre a tela quer o número; quem quer entender desce.
   *
   * Nada aqui está escrito em código — cada cartão é uma linha de PAINEIS, e
   * se some em Configurações › Painéis.
   */
  function desenharCartoes() {
    if (!painel.cartoes || !painel.cartoes.length) return '';

    return '<div class="cartoes">'
      + painel.cartoes.map(function (cartao) {
        return '<div class="indicador tom-' + escapar(cartao.tom || 'neutro') + '"'
          + (cartao.explicacao ? ' title="' + escapar(cartao.explicacao) + '"' : '')
          + '><span class="rotulo">' + escapar(cartao.rotulo) + '</span>'
          + '<strong class="numero">' + cartao.valor + '</strong>'
          + variacao(cartao)
          + '</div>';
      }).join('')
      + '</div>';
  }

  function desenharFiltros() {
    var caixas = painel.filtrosDisponiveis.map(function (filtro) {
      // A primeira opção é o nome do filtro puro — "Analista", "Status".
      // Era "Todos — Analista", e o "Todos —" só ocupava espaço: a caixa
      // fechada mostrava a palavra que menos importa, e em tela estreita o
      // nome do filtro era justamente o pedaço que ficava cortado.
      var opcoes = ['<option value="">' + escapar(filtro.rotulo) + '</option>'];
      filtro.opcoes.forEach(function (opcao) {
        opcoes.push('<option value="' + escapar(opcao.valor) + '"'
          + (filtros[filtro.chave] === opcao.valor ? ' selected' : '') + '>'
          + escapar(opcao.rotulo) + '</option>');
      });
      return '<select class="filtro" data-filtro="' + escapar(filtro.chave) + '"'
        + ' aria-label="Filtrar por ' + escapar(filtro.rotulo) + '">'
        + opcoes.join('') + '</select>';
    });

    return '<div class="filtros">'
      + desenharPeriodo()
      + caixas.join('')
      + '<span class="contagem">' + painel.total + ' casos · '
      + escapar(painel.periodo.rotulo) + '</span></div>';
  }

  /**
   * As três maneiras de escolher o período.
   *
   *   ATALHO    — "últimos 30 dias", que é o do dia a dia.
   *   DE / ATÉ  — duas datas, para uma pergunta específica.
   *   MÊS       — "setembro de 2026", que é como a operação REPORTA.
   *
   * Os três não aparecem ao mesmo tempo: a primeira caixa escolhe QUAL deles
   * está valendo, e só os controles dele ficam na tela. Mostrar os três juntos
   * deixaria três períodos preenchidos na tela e um só valendo — e ninguém
   * consegue olhar isso e dizer qual é.
   */
  function desenharPeriodo() {
    var tipo = painel.periodo.tipo;

    // "Por dias", e não "Últimos dias": a caixa da direita já diz "Últimos 30
    // dias", e as duas juntas liam "Últimos dias | Últimos 30 dias". A primeira
    // caixa responde COMO se escolhe; a segunda, QUAL.
    var comoEscolher = [['dias', 'Por dias'], ['intervalo', 'Por data'],
      ['mes', 'Por mês']].map(function (par) {
      return '<option value="' + par[0] + '"'
        + (tipo === par[0] ? ' selected' : '') + '>' + par[1] + '</option>';
    }).join('');

    return '<select class="filtro" id="como-escolher-periodo"'
      + ' aria-label="Como escolher o período">' + comoEscolher + '</select>'
      + (tipo === 'intervalo' ? desenharDeAte()
        : (tipo === 'mes' ? desenharMes() : desenharAtalhos()));
  }

  function desenharAtalhos() {
    var opcoes = [7, 15, 30, 60, 90, 180, 365].map(function (quantos) {
      return '<option value="' + quantos + '"'
        + (painel.periodo.dias === quantos ? ' selected' : '') + '>'
        + 'Últimos ' + quantos + ' dias</option>';
    }).join('');

    return '<select class="filtro" id="periodo-do-painel" aria-label="Período">'
      + opcoes + '</select>';
  }

  /*
   * Campo de data do navegador (type="date"), e não texto com máscara: ele já
   * traz o calendário, já recusa 31/02 e já respeita o formato de quem está
   * olhando. O valor que ele guarda é sempre aaaa-mm-dd, que é o que o
   * servidor lê sem ambiguidade — 03/04 é 3 de abril aqui e 4 de março em
   * outros lugares, e essa confusão não pode entrar num fechamento.
   */
  function desenharDeAte() {
    return '<input type="date" class="filtro" id="periodo-de"'
      + ' aria-label="Data inicial" value="' + escapar(comoOCampoDeDataLe(painel.periodo.de)) + '">'
      + '<span class="ate-do-periodo">até</span>'
      + '<input type="date" class="filtro" id="periodo-ate"'
      + ' aria-label="Data final" value="' + escapar(comoOCampoDeDataLe(painel.periodo.ate)) + '">';
  }

  function desenharMes() {
    var opcoes = (painel.mesesDisponiveis || []).map(function (mes) {
      return '<option value="' + escapar(mes.valor) + '"'
        + (painel.periodo.mes === mes.valor ? ' selected' : '') + '>'
        + escapar(mes.rotulo) + '</option>';
    }).join('');

    return '<select class="filtro" id="mes-do-painel" aria-label="Mês">'
      + opcoes + '</select>';
  }

  /** dd/mm/aaaa (como o servidor escreve) vira aaaa-mm-dd (como o campo lê). */
  function comoOCampoDeDataLe(texto) {
    var partes = String(texto || '').split('/');
    if (partes.length !== 3) return '';
    return partes[2] + '-' + partes[1] + '-' + partes[0];
  }

  /* ------------------------------------------------------------- gráficos */

  function desenharComponente(componente) {
    return '<section class="cartao grafico largura-' + componente.largura + '"'
      + ' data-grafico="' + escapar(componente.id) + '">'
      + '<header class="grafico-cabeca">'
      + '<h3>' + escapar(componente.titulo) + '</h3>'
      + '<div class="grafico-acoes">'
      + '<button type="button" class="botao-texto" data-tabela="'
      + escapar(componente.id) + '">'
      + (tabelasAbertas[componente.id] ? 'Ver o gráfico' : 'Ver os números') + '</button>'
      + (painel.podeExportar
        ? '<button type="button" class="botao-texto" data-exportar="'
          + escapar(componente.id) + '">Exportar</button>' : '')
      + '</div></header>'
      + (tabelasAbertas[componente.id]
        ? Graficos.tabela(componente) : Graficos.desenhar(componente))
      + rodapeDoGrafico(componente)
      + '</section>';
  }

  function rodapeDoGrafico(componente) {
    if (componente.aviso || !componente.pontos.length) return '';
    return '<p class="grafico-pe">'
      + (componente.dobradosEmOutros
        ? 'Mais ' + componente.dobradosEmOutros + ' valor(es) somados em '
          + '<strong>Demais valores</strong>. '
        : '')
      + 'Clique para ver os casos.</p>';
  }

  /* --------------------------------------------------------- comportamento */

  function ligarPainel() {
    var caixas = document.querySelectorAll('#analitico .filtro');
    for (var i = 0; i < caixas.length; i++) {
      caixas[i].addEventListener('change', function () {
        if (mexeuNoPeriodo(this)) return;
        filtros[this.getAttribute('data-filtro')] = this.value;
        carregar();
      });
    }

    ligarCliques('[data-tabela]', function (botao) {
      var id = botao.getAttribute('data-tabela');
      tabelasAbertas[id] = !tabelasAbertas[id];
      desenhar();
    });

    ligarCliques('[data-exportar]', function (botao) {
      exportar(botao.getAttribute('data-exportar'));
    });

    ligarCliques('[data-ponto]', function (elementoClicado) {
      var grafico = elementoClicado.closest('.grafico');
      if (!grafico) return;
      detalhar(grafico.getAttribute('data-grafico'),
        elementoClicado.getAttribute('data-ponto'));
    });

    Graficos.ligarDica(elemento('analitico'));
  }

  /**
   * Trata as caixas do período, e devolve true quando era uma delas.
   *
   * O DE/ATÉ só recarrega com as DUAS datas preenchidas. Recarregar na
   * primeira mostraria o resultado de um intervalo pela metade, que a pessoa
   * leria como se fosse a resposta — e ela vai preencher a segunda meio
   * segundo depois de qualquer jeito.
   */
  function mexeuNoPeriodo(caixa) {
    if (caixa.id === 'como-escolher-periodo') {
      // Trocar de maneira zera as outras: guardar um mês escolhido enquanto se
      // usa o de/até deixaria dois períodos vivos e um só valendo.
      periodo = { tipo: caixa.value, dias: painel.periodo.dias, de: '', ate: '', mes: '' };
      if (periodo.tipo === 'mes' && painel.mesesDisponiveis.length) {
        periodo.mes = painel.mesesDisponiveis[0].valor;   // o mês corrente
      }
      if (periodo.tipo === 'intervalo') {
        // Abre já preenchido com o período que estava valendo, para a pessoa
        // ajustar uma ponta em vez de digitar as duas do zero.
        periodo.de = painel.periodo.de;
        periodo.ate = painel.periodo.ate;
      }
      carregar();
      return true;
    }

    if (caixa.id === 'periodo-do-painel') {
      periodo = { tipo: 'dias', dias: Number(caixa.value), de: '', ate: '', mes: '' };
      carregar();
      return true;
    }

    if (caixa.id === 'mes-do-painel') {
      periodo = { tipo: 'mes', dias: 0, de: '', ate: '', mes: caixa.value };
      carregar();
      return true;
    }

    if (caixa.id === 'periodo-de' || caixa.id === 'periodo-ate') {
      var de = elemento('periodo-de');
      var ate = elemento('periodo-ate');
      periodo = {
        tipo: 'intervalo', dias: 0, mes: '',
        de: comoOServidorLe(de ? de.value : ''),
        ate: comoOServidorLe(ate ? ate.value : '')
      };
      if (periodo.de && periodo.ate) carregar();
      return true;
    }

    return false;
  }

  /** aaaa-mm-dd (como o campo guarda) vira dd/mm/aaaa (como o servidor lê). */
  function comoOServidorLe(texto) {
    var partes = String(texto || '').split('-');
    if (partes.length !== 3) return '';
    return partes[2] + '/' + partes[1] + '/' + partes[0];
  }

  function ligarCliques(seletor, oQueFazer) {
    var achados = document.querySelectorAll('#analitico ' + seletor);
    for (var i = 0; i < achados.length; i++) {
      achados[i].addEventListener('click', function () { oQueFazer(this); });
      achados[i].addEventListener('keydown', function (evento) {
        if (evento.key === 'Enter' || evento.key === ' ') {
          evento.preventDefault();
          oQueFazer(this);
        }
      });
    }
  }

  function detalhar(idDoComponente, chaveDoPonto) {
    var caixa = elemento('detalhe-do-painel');
    caixa.innerHTML = '<p class="carregando-campos">Separando os casos…</p>';
    caixa.scrollIntoView({ behavior: 'smooth', block: 'nearest' });

    Servidor.chamar('detalharComponente', canalEscolhida, idDoComponente,
      chaveDoPonto, filtros, periodo)
      .entao(function (resposta) { desenharDetalhe(resposta); })
      .senao(function (erro) {
        caixa.innerHTML = '<p class="carregando-campos erro-carga">'
          + escapar(erro.message || String(erro)) + '</p>';
      });
  }

  function desenharDetalhe(detalhe) {
    var cabecalho = detalhe.colunas.map(function (grupo) {
      return '<th>' + escapar(grupo.titulo) + '</th>';
    }).join('') + '<th class="acoes-coluna">Ações</th>';

    var linhas = detalhe.casos.map(function (caso) {
      var celulas = caso.celulas.map(function (grupo, i) {
        return '<td>' + grupo.map(function (celula, j) {
          if (celula.ehStatus) {
            return '<span class="situacao tom-' + escapar(caso.tom || 'neutro')
              + '">' + escapar(celula.valor || '—') + '</span>';
          }
          return '<span class="' + ((j === 0 && i !== 0) ? 'principal' : 'apoio')
            + '">' + escapar(celula.valor || '—') + '</span>';
        }).join('') + '</td>';
      }).join('');
      return '<tr>' + celulas + '<td class="acoes-coluna">'
        + '<button type="button" class="acao" data-caso-do-painel="'
        + escapar(caso.id) + '">' + Moldura.icone('olho')
        + ' Ver detalhes</button></td></tr>';
    }).join('');

    elemento('detalhe-do-painel').innerHTML = '<section class="cartao sem-forro origem">'
      + '<header class="origem-cabeca"><h3>' + escapar(detalhe.titulo) + ' · '
      + escapar(detalhe.ponto) + '</h3>'
      + '<span class="quantos">' + detalhe.total + '</span>'
      + '<button type="button" class="botao-texto" id="fechar-detalhe">'
      + 'Fechar</button></header>'
      + (detalhe.casos.length
        ? '<div class="rolagem-tabela"><table class="fila agrupada">'
          + '<thead><tr>' + cabecalho + '</tr></thead>'
          + '<tbody>' + linhas + '</tbody></table></div>'
        : '<p class="grafico-vazio">Nenhum caso aqui.</p>')
      + '</section>';

    elemento('fechar-detalhe').addEventListener('click', function () {
      elemento('detalhe-do-painel').innerHTML = '';
    });

    var abrir = document.querySelectorAll('[data-caso-do-painel]');
    for (var i = 0; i < abrir.length; i++) {
      abrir[i].addEventListener('click', function () {
        CasoEmModal.abrir(canalEscolhida, this.getAttribute('data-caso-do-painel'),
          carregar);
      });
    }
  }

  /**
   * Exportar.
   *
   * O Apps Script serve a página num quadro isolado, e ali o navegador barra
   * download que a própria página começa. Então mostramos o texto pronto para
   * copiar — que funciona em qualquer lugar — e oferecemos o download por
   * cima, para quem estiver num contexto que o aceite.
   */
  function exportar(idDoComponente) {
    Servidor.chamar('exportarComponente', canalEscolhida, idDoComponente,
      filtros, periodo)
      .entao(function (arquivo) { abrirCaixaDeExportar(arquivo); })
      .senao(function (erro) { window.alert(erro.message || String(erro)); });
  }

  function abrirCaixaDeExportar(arquivo) {
    var caixa = document.createElement('div');
    caixa.className = 'dialogo';
    caixa.id = 'dialogo-exportar';
    caixa.innerHTML = '<div class="dialogo-caixa" role="dialog" aria-modal="true"'
      + ' aria-labelledby="titulo-exportar">'
      + '<h3 id="titulo-exportar">Exportar</h3>'
      + '<p>Separado por ponto e vírgula, que é como o Excel em português abre '
      + 'sem perguntar nada.</p>'
      + '<textarea id="texto-exportado" rows="8" readonly>'
      + escapar(arquivo.conteudo) + '</textarea>'
      + '<div class="config-acoes">'
      + '<button type="button" class="botao" id="copiar-exportado">Copiar</button>'
      + '<button type="button" class="botao vazado" id="fechar-exportar">'
      + 'Fechar</button></div></div>';
    document.body.appendChild(caixa);

    function sair() { if (caixa.parentNode) caixa.parentNode.removeChild(caixa); }
    elemento('fechar-exportar').addEventListener('click', sair);
    caixa.addEventListener('mousedown', function (evento) {
      if (evento.target === caixa) sair();
    });

    var area = elemento('texto-exportado');
    area.focus();
    area.select();

    elemento('copiar-exportado').addEventListener('click', function () {
      area.select();
      var deuCerto = false;
      try { deuCerto = document.execCommand('copy'); } catch (erro) { deuCerto = false; }
      this.textContent = deuCerto ? 'Copiado' : 'Aperte Ctrl+C';
    });
  }

  /* ---------------------------------------------------------------- ligar */

  function ligar(pacote) {
    if (pacote) pacoteDoSistema = pacote;
    SeletorDeCanal.ligar(function (idDoCanal) {
      canalEscolhida = idDoCanal;
      filtros = {};
      tabelasAbertas = {};
      Aplicacao.remontar();
    });
    carregar();
  }

  function desligar() { Graficos.tirarDica(); }

  return { montar: montar, ligar: ligar, desligar: desligar };
})();
</script>
