<script>
/* ============================================================================
   PGO — Produtividade.html · o que está acontecendo na operação
   ============================================================================
   Os gráficos são SVG escrito à mão, sem biblioteca de fora — pelo mesmo
   motivo dos ícones: o Apps Script serve a página num quadro isolado, e cada
   dependência externa é mais um ponto que pode não carregar. Gráfico que não
   carrega é pior que gráfico nenhum, porque a tela fica com um buraco.

   TRÊS REGRAS DE LEITURA, e todas têm motivo:

     UM EIXO SÓ. "Barras com linha" não são duas escalas. A linha é a média
     móvel da própria barra, na mesma altura: ela mostra a tendência por cima
     do ruído do dia a dia. Dois eixos fariam a mesma altura significar duas
     coisas — é o erro de gráfico mais comum que existe.

     COR PARA IDENTIDADE, TOM ÚNICO PARA MAGNITUDE. A pizza responde "de que
     tipo são" e usa cores; as barras respondem "quanto de cada" e usam um tom
     só. Oito cores para dizer "quanto" enterra a informação.

     O NÚMERO SEMPRE VISÍVEL. Todo gráfico tem rótulo direto e uma tabela por
     baixo. Cor é a segunda leitura, nunca a única — nem todo mundo enxerga
     cor, e nenhuma tela de trabalho pode depender disso.
   ============================================================================ */

var TelaProdutividade = (function () {

  var canalEscolhido = '';
  var filtros = {};
  /*
   * COMO o período foi escolhido, e não o período em si.
   *
   * Quem calcula as datas é o SERVIDOR. Se a tela calculasse, o dia que
   * aparece no gráfico sairia do relógio do navegador de quem está olhando, e
   * o dia que o servidor contou sairia do relógio da planilha. Num fechamento
   * de mês essa diferença é um dia inteiro de casos.
   */
  var periodo = SeletorDePeriodo.padrao();
  var painel = null;
  // Na Mesa, duas abas: "Equipe" (os cards e gráficos de sempre) e "Atendidos"
  // (sistema + chat). Pedido do PO: a Produtividade "ficou bagunçada com muitas
  // informações sobre a Mesa Diamante". Abre em Equipe; trocar de canal mantém.
  var abaDaMesa = 'equipe';
  // Dentro de "Atendidos": a origem (Todos / E-mail / Chat) e o ramo (Total /
  // Vida em grupo / Vida individual). Cada combinação já vem pronta do
  // servidor, e trocar não volta a ele.
  var origemDosAtendidos = 'todos';
  var ramoDosAtendidos = 'total';
  // Onde abre a lista dos casos de uma fatia — nas duas abas, o mesmo lugar.
  var LUGAR_DO_DETALHE = '<div id="detalhe-do-painel"></div>';
  var tabelasAbertas = {};
  var pacoteDoSistema = null;

  function escapar(texto) { return Moldura.escapar(texto); }
  function elemento(id) { return document.getElementById(id); }

  /* --------------------------------------------------------------- montar */

  function montar(pacote) {
    pacoteDoSistema = pacote;
    if (!canalEscolhido && pacote.canais.length) canalEscolhido = pacote.canais[0].id;
    return SeletorDeCanal.montar(pacote.canais, canalEscolhido)
      + '<div id="analitico"><p class="carregando-campos">Somando os números…</p></div>';
  }

  function carregar() {
    var caixa = elemento('analitico');
    if (caixa) caixa.innerHTML = '<p class="carregando-campos">Somando os números…</p>';

    Servidor.chamar('produtividadeDaEquipe', canalEscolhido, filtros, periodo)
      .entao(function (resposta) {
        painel = resposta;
        desenhar();
      })
      .senao(function (erro) {
        elemento('analitico').innerHTML = '<p class="carregando-campos erro-carga">'
          + escapar(erro.message || String(erro)) + '</p>';
      });
  }

  /** As abas da Mesa. Canal sem atendimentos (RET, VG) não tem aba nenhuma. */
  function abasDaMesa() {
    if (!painel.atendimentos) return '';
    return '<div class="config-abas" role="tablist" aria-label="O que ver">'
      + [['equipe', 'Equipe'], ['atendidos', 'Atendidos (e-mail + chat)']].map(function (aba) {
        var atual = abaDaMesa === aba[0];
        return '<button type="button" role="tab" class="config-aba' + (atual ? ' atual' : '') + '"'
          + ' aria-selected="' + atual + '" data-aba-da-mesa="' + aba[0] + '">'
          + escapar(aba[1]) + '</button>';
      }).join('') + '</div>';
  }

  function desenhar() {
    // Na aba "Atendidos" da Mesa, só o bloco dos atendidos — o resto fica na
    // aba "Equipe", que é onde a tela abre.
    if (painel.atendimentos && abaDaMesa === 'atendidos') {
      elemento('analitico').innerHTML = desenharFiltros() + abasDaMesa()
        + desenharAtendimentos() + LUGAR_DO_DETALHE;
      ligarPainel();
      return;
    }
    // O aviso vem ANTES dos gráficos, e não depois: depois, ele explica um
    // número que a pessoa já leu como se fosse o total.
    // Etapa 46 (RET): os prêmios logo depois dos cartões — "deve ser o
    // primeiro a mostrar" — e o quadro por analista por último.
    elemento('analitico').innerHTML = desenharFiltros()
      + abasDaMesa()
      + desenharCartoes()
      + desenharPremios()
      + desenharPrazos()
      + Moldura.avisoDeJanela(painel, 'Estes gráficos')
      + (painel.componentes.length
        ? '<div class="graficos">'
          + painel.componentes.map(desenharComponente).join('') + '</div>'
        : '<div class="cartao vazio"><strong>Nenhum gráfico configurado nesta '
          + 'canal.</strong><p>Um administrador monta os gráficos em '
          + 'Configurações › Painéis.</p></div>')
      // Com os prêmios (a RET), o "Valor por situação" sai: pedido do PO, "já
      // virá abaixo dos cards" — cada cartão de status traz a soma dele.
      + (painel.valorPorSituacao && !painel.premios
        ? '<div class="graficos">'
          + desenharValorPorSituacao(painel.valorPorSituacao) + '</div>'
        : '')
      + desenharTentativas()
      + desenharPorAnalista()
      + LUGAR_DO_DETALHE;
    ligarPainel();
  }

  /** R$ 1.234,56. */
  function emReais(valor) {
    var numero = Number(valor) || 0;
    return 'R$ ' + numero.toFixed(2).replace('.', ',').replace(/\B(?=(\d{3})+(?!\d))/g, '.');
  }

  /**
   * "Prêmios: anual, mensal e retido" (Etapa 46, só a RET). A tabela é desta
   * tela, e não a dos gráficos: lá a última linha soma tudo, e anual + mensal +
   * retido não é um número que queira dizer alguma coisa.
   */
  function desenharPremios() {
    var premios = painel.premios;
    if (!premios) return '';
    return '<div class="graficos"><section class="cartao grafico largura-2" data-premios="sim">'
      + '<header class="grafico-cabeca"><h3>' + escapar(premios.titulo) + '</h3></header>'
      + Graficos.desenhar(premios)
      + '<div class="rolagem-tabela"><table class="fila numeros">'
      + '<thead><tr><th>Prêmio</th><th class="direita">Valor</th>'
      + '<th class="direita">Casos com valor</th></tr></thead><tbody>'
      + premios.pontos.map(function (ponto) {
        return '<tr><td>' + escapar(ponto.rotulo) + '</td><td class="direita">'
          + emReais(ponto.valor) + '</td><td class="direita">' + ponto.casos + '</td></tr>';
      }).join('') + '</tbody></table></div>'
      + '</section></div>';
  }

  /** 1,6 — a média com vírgula, ou um traço quando não há sucesso. */
  function comVirgula(numero) {
    return numero === null || numero === undefined ? '—' : String(numero).replace('.', ',');
  }

  /**
   * Tentativas até o sucesso (Etapa 47, só a RET): "quantas vezes precisamos
   * contatar o cliente para ter sucesso". Sucesso é Retido ou Não retido; as
   * tentativas são os carimbos do 1º e do 2º contato; a 3ª é o "Sem sucesso de
   * contato". Um resumo, o gráfico, a conta por analista e a por CPF.
   */
  function desenharTentativas() {
    var tentativas = painel.tentativas;
    if (!tentativas) return '';
    var porAnalista = tentativas.porAnalista.map(function (linha) {
      return '<tr><td>' + escapar(linha.analista) + '</td>'
        + '<td class="direita">' + linha.sucessos + '</td>'
        + linha.porContato.map(function (n) { return '<td class="direita">' + n + '</td>'; }).join('')
        + '<td class="direita">' + linha.semSucesso + '</td>'
        + '<td class="direita">' + comVirgula(linha.media) + '</td></tr>';
    }).join('');
    var porCpf = tentativas.porCpf.linhas.map(function (linha) {
      return '<tr><td>' + escapar(linha.cpf) + '</td><td>' + escapar(linha.cliente || '—') + '</td>'
        + '<td class="direita">' + linha.casos + '</td>'
        + '<td class="direita">' + linha.contatos + '</td>'
        + '<td>' + escapar(linha.desfecho) + '</td></tr>';
    }).join('');
    var notasDoCpf = [];
    if (tentativas.porCpf.total > tentativas.porCpf.linhas.length) {
      notasDoCpf.push('Mostrando os ' + tentativas.porCpf.linhas.length + ' CPFs com mais contatos, de '
        + tentativas.porCpf.total + '.');
    }
    if (tentativas.porCpf.semCpf) {
      notasDoCpf.push(tentativas.porCpf.semCpf + ' caso(s) sem CPF ficaram fora desta tabela.');
    }
    return '<section class="cartao tentativas" aria-labelledby="titulo-tentativas">'
      + '<header class="grafico-cabeca"><h3 id="titulo-tentativas">' + escapar(tentativas.titulo)
      + '</h3></header>'
      + '<p class="prazo-regra">Sucesso é Retido ou Não retido. As tentativas são a "Data do 1º '
      + 'contato" e a "Data do 2º contato"; a 3ª é o status "Sem sucesso de contato".</p>'
      + '<div class="cartoes">'
      + tileDePrazo('Sucessos', tentativas.sucessos, 'bom', 'Casos em Retido ou Não retido')
      + tileDePrazo('Contatos por sucesso', comVirgula(tentativas.media), 'neutro',
        'Em média, quantos contatos até falar com o cliente')
      + tileDePrazo('Sem sucesso', tentativas.semSucesso, tentativas.semSucesso ? 'atencao' : 'neutro',
        'Casos em "Sem sucesso de contato"')
      + tileDePrazo('Ainda tentando', tentativas.emAndamento, 'neutro',
        'Casos que ainda não chegaram a um desses desfechos')
      + '</div>'
      + Graficos.desenhar(tentativas.grafico)
      + (porAnalista
        ? '<h5 class="prazo-titulo">Por analista</h5>'
          + '<div class="rolagem-tabela"><table class="fila numeros"><thead><tr>'
          + '<th>Analista</th><th class="direita">Sucessos</th>'
          + tentativas.faixas.map(function (faixa) {
            return '<th class="direita">' + escapar(faixa) + '</th>';
          }).join('')
          + '<th class="direita">Sem sucesso</th><th class="direita">Contatos por sucesso</th>'
          + '</tr></thead><tbody>' + porAnalista + '</tbody></table></div>'
        : '')
      + (porCpf
        ? '<h5 class="prazo-titulo">Contatos por CPF</h5>'
          + '<div class="rolagem-tabela"><table class="fila numeros"><thead><tr>'
          + '<th>CPF</th><th>Cliente</th><th class="direita">Casos</th>'
          + '<th class="direita">Contatos</th><th>Desfecho</th>'
          + '</tr></thead><tbody>' + porCpf + '</tbody></table></div>'
        : '')
      + (notasDoCpf.length ? '<p class="prazo-regra">' + notasDoCpf.join(' ') + '</p>' : '')
      + '</section>';
  }

  /**
   * A produtividade de cada analista (Etapa 46, só a RET): "por último, a
   * produtividade por analista mostrando tudo individualmente" — uma linha por
   * pessoa, com o total, cada status e os três prêmios.
   */
  function desenharPorAnalista() {
    var quadro = painel.porAnalista;
    if (!quadro || !quadro.linhas.length) return '';
    return '<section class="cartao por-analista" aria-labelledby="titulo-por-analista">'
      + '<header class="grafico-cabeca"><h3 id="titulo-por-analista">Produtividade por analista</h3></header>'
      + '<div class="rolagem-tabela"><table class="fila numeros">'
      + '<thead><tr><th>Analista</th><th class="direita">Casos</th>'
      + quadro.status.map(function (nome) {
        return '<th class="direita">' + escapar(nome) + '</th>';
      }).join('')
      + '<th class="direita">Prêmio anual</th><th class="direita">Prêmio mensal</th>'
      + '<th class="direita">Prêmio retido</th></tr></thead><tbody>'
      + quadro.linhas.map(function (linha) {
        return '<tr><td>' + escapar(linha.analista) + '</td><td class="direita">' + linha.total + '</td>'
          + linha.porStatus.map(function (n) { return '<td class="direita">' + n + '</td>'; }).join('')
          + '<td class="direita">' + emReais(linha.anual) + '</td>'
          + '<td class="direita">' + emReais(linha.mensal) + '</td>'
          + '<td class="direita">' + emReais(linha.retido) + '</td></tr>';
      }).join('')
      + '</tbody><tfoot><tr><td><strong>Total</strong></td><td class="direita"><strong>'
      + quadro.totais.total + '</strong></td>'
      + quadro.totais.porStatus.map(function (n) {
        return '<td class="direita"><strong>' + n + '</strong></td>';
      }).join('')
      + '<td class="direita"><strong>' + emReais(quadro.totais.anual) + '</strong></td>'
      + '<td class="direita"><strong>' + emReais(quadro.totais.mensal) + '</strong></td>'
      + '<td class="direita"><strong>' + emReais(quadro.totais.retido) + '</strong></td>'
      + '</tr></tfoot></table></div></section>';
  }

  /**
   * A variação em relação ao período anterior — igual à do Trabalho.
   *
   * Sem base de comparação o espaço fica em branco, e não "+100%": subir de
   * zero para um não é 100% de melhora, e um número que mente uma vez faz a
   * pessoa desconfiar dos outros.
   */
  function variacao(cartao) {
    if (cartao.variacao === null || cartao.variacao === undefined) {
      return '<span class="variacao vazia" aria-hidden="true">—</span>';
    }
    var subiu = cartao.variacao >= 0;
    return '<span class="variacao ' + (subiu ? 'subiu' : 'desceu') + '">'
      + (subiu ? '▲' : '▼') + ' ' + Math.abs(cartao.variacao) + '%'
      + '<em>vs. período anterior</em></span>';
  }

  /**
   * Os números que a operação pediu, antes dos gráficos.
   *
   * Vêm primeiro de propósito: "quantos reteve" é a pergunta, e o gráfico é a
   * explicação. Quem abre a tela quer o número; quem quer entender desce.
   *
   * Nada aqui está escrito em código — cada cartão é uma linha de PAINEIS, e
   * se some em Configurações › Painéis.
   */
  function desenharCartoes() {
    if (!painel.cartoes || !painel.cartoes.length) return '';

    return '<div class="cartoes">'
      + painel.cartoes.map(function (cartao) {
        return '<div class="indicador tom-' + escapar(cartao.tom || 'neutro') + '"'
          + (cartao.explicacao ? ' title="' + escapar(cartao.explicacao) + '"' : '')
          + '><span class="rotulo">' + escapar(cartao.rotulo) + '</span>'
          + '<strong class="numero">' + cartao.valor + '</strong>'
          // Etapa 46 (RET): embaixo do status, o prêmio anual dos casos dele; no
          // Retido, o prêmio retido.
          + (cartao.soma !== undefined
            ? '<span class="soma-do-cartao">' + escapar(emReais(cartao.soma)) + ' de '
              + escapar(cartao.rotuloDaSoma) + '</span>' : '')
          + variacao(cartao)
          + '</div>';
      }).join('')
      + '</div>';
  }

  /**
   * O CONTROLE DE PRAZOS — o que a gestão pediu para acompanhar.
   *
   * Palavra do PO: sinalizar "os casos e o nome do analista que deixou estourar
   * o prazo", e na Mesa "quantos casos estão dentro e quantos fora da SLA".
   * Cada prazo é um bloco: quantos estão em cada cor, quem deixou passar e
   * quais casos são. O SLA da Mesa mostra só dentro e fora; os sinalizadores
   * mostram também os que vencem em breve, que é quando ainda dá para agir.
   *
   * Conta os casos DO PERÍODO escolhido em cima — o mesmo recorte dos
   * cartões e dos gráficos, para os números não discordarem entre si.
   */
  function desenharPrazos() {
    var prazos = painel.prazos;
    if (!prazos) return '';

    var blocos = [];
    if (prazos.sla) blocos.push(blocoDoSla(prazos.sla));
    prazos.sinalizadores.forEach(function (sinalizador) {
      blocos.push(blocoDoSinalizador(sinalizador));
    });

    return '<section class="cartao prazos" aria-labelledby="titulo-dos-prazos">'
      + '<header class="origem-cabeca"><h3 id="titulo-dos-prazos">Controle de prazos</h3>'
      + '</header>' + blocos.join('') + '</section>';
  }

  /**
   * OS ATENDIDOS DA MESA: o que está no sistema mais o que veio do chat.
   *
   * Desenhado como o valor por situação — o gráfico E a tabela de números ao
   * mesmo tempo —, porque aqui o número é o pedido, e a tabela mostra de onde
   * veio cada parte: quanto do sistema, quanto do chat. Os gráficos não
   * detalham por clique (não moram na aba PAINEIS).
   *
   * Chat desligado, que não abriu ou que perdeu coluna NÃO derruba o bloco:
   * os números do sistema continuam, com o motivo escrito em cima. Número
   * parcial sem aviso é o jeito de alguém concluir que o chat não atendeu
   * ninguém.
   */
  /** A visão escolhida: a de sempre (Todos, Total) ou uma das oito prontas. */
  function visaoDosAtendidos() {
    var atendidos = painel.atendimentos;
    var chave = origemDosAtendidos + '|' + ramoDosAtendidos;
    return (atendidos.visoes && atendidos.visoes[chave]) || atendidos;
  }

  /** Dois grupos de botões: de onde vem o atendimento, e de que ramo. */
  function seletoresDosAtendidos() {
    function grupo(rotulo, atributo, atual, opcoes) {
      return '<div class="seletor-de-atendidos"><span class="rotulo">' + escapar(rotulo) + '</span>'
        + '<div class="config-abas" role="group" aria-label="' + escapar(rotulo) + '">'
        + opcoes.map(function (opcao) {
          return '<button type="button" class="config-aba' + (atual === opcao[0] ? ' atual' : '') + '"'
            + ' aria-pressed="' + (atual === opcao[0]) + '" ' + atributo + '="' + opcao[0] + '">'
            + escapar(opcao[1]) + '</button>';
        }).join('') + '</div></div>';
    }
    return grupo('Origem', 'data-origem-dos-atendidos', origemDosAtendidos,
        [['todos', 'Todos'], ['sistema', 'E-mail'], ['chat', 'Chat']])
      + grupo('Ramo', 'data-ramo-dos-atendidos', ramoDosAtendidos,
        [['total', 'Total'], ['vg', 'Vida em grupo'], ['vi', 'Vida individual']]);
  }

  /** O que a visão escolhida diz de si, em palavras. */
  function nomeDaVisaoDosAtendidos() {
    var origem = { todos: 'e-mail e chat', sistema: 'e-mail', chat: 'chat' }[origemDosAtendidos];
    var ramo = { total: 'todos os ramos', vg: 'Vida em grupo', vi: 'Vida individual' }[ramoDosAtendidos];
    return origem + ' · ' + ramo;
  }

  function desenharAtendimentos() {
    var atendidos = painel.atendimentos;
    if (!atendidos) return '';
    var chat = atendidos.chat;
    var visao = visaoDosAtendidos();

    var avisos = [];
    if (!chat.ligado) {
      avisos.push('Nenhum atendimento do chat foi importado ainda: estes números são só dos '
        + 'casos cadastrados no sistema (e-mail). Traga o chat pela tela de Importação — Mesa '
        + 'Diamante, "Atendimentos do chat".');
    } else if (chat.aviso) {
      avisos.push('Os atendimentos do chat não puderam ser lidos, e estes números são só do '
        + 'sistema: ' + chat.aviso);
    }
    if (chat.truncada) {
      avisos.push('Do chat entram só os últimos ' + chat.linhasLidas + ' atendimentos importados.');
    }
    if (chat.semData) {
      avisos.push(chat.semData + ' linha(s) do chat sem data legível ficaram de fora do período.');
    }
    avisos.push('E-mail são os casos cadastrados no sistema; chat, os atendimentos importados. '
      + 'Vale o período e o alcance desta tela; os filtros acima não mudam este bloco. '
      + 'O atendimento que estiver nas duas bases conta duas vezes.');

    // Com "Todos", o total e a sua divisão; com uma origem só, só o total dela.
    var tiles = origemDosAtendidos === 'todos'
      ? tileDePrazo('Atendidos no total', visao.totais.total, 'destaque',
        'E-mail mais chat, no período')
        + tileDePrazo('E-mail', visao.totais.sistema, 'neutro',
          'Casos da Mesa Diamante cadastrados no sistema, no período')
        + tileDePrazo('Chat', visao.totais.chat, 'neutro',
          'Atendimentos do chat importados, no período')
      : tileDePrazo(origemDosAtendidos === 'sistema' ? 'Atendidos por e-mail' : 'Atendidos por chat',
        visao.totais.total, 'destaque', 'No período');

    return '<section class="cartao atendimentos" aria-labelledby="titulo-dos-atendidos">'
      + '<header class="origem-cabeca"><h3 id="titulo-dos-atendidos">'
      + 'Atendidos — ' + escapar(nomeDaVisaoDosAtendidos()) + '</h3></header>'
      + seletoresDosAtendidos()
      + '<div class="cartoes">' + tiles + '</div>'
      + avisos.map(function (aviso) {
        return '<p class="aviso-do-chat">' + escapar(aviso) + '</p>';
      }).join('')
      + '</section>'
      + '<div class="graficos">' + visao.graficos.map(desenharAtendidos).join('') + '</div>';
  }

  /** Um gráfico de atendidos: o desenho e, embaixo, de onde veio cada número. */
  function desenharAtendidos(componente) {
    var vazio = !componente.pontos.length;
    return '<section class="cartao grafico largura-' + componente.largura + '">'
      + '<header class="grafico-cabeca"><h3>' + escapar(componente.titulo) + '</h3></header>'
      + Graficos.desenhar(componente)
      + (vazio ? '' : tabelaDeAtendidos(componente))
      + rodapeDosAtendidos(componente)
      + '</section>';
  }

  function tabelaDeAtendidos(componente) {
    var total = 0;
    var linhas = componente.pontos.map(function (ponto) {
      total += ponto.valor;
      return '<tr><td>' + escapar(ponto.rotulo) + '</td>'
        + '<td class="direita">' + ponto.valor + '</td></tr>';
    }).join('');
    return '<div class="rolagem-tabela"><table class="fila numeros de-atendidos">'
      + '<thead><tr><th>' + escapar(componente.dimensao) + '</th>'
      + '<th class="direita">Atendimentos</th></tr></thead><tbody>' + linhas + '</tbody>'
      + '<tfoot><tr><td><strong>Total</strong></td><td class="direita"><strong>' + total
      + '</strong></td></tr></tfoot></table></div>';
  }

  function rodapeDosAtendidos(componente) {
    var notas = [];
    if (componente.foraDoTopo) notas.push(soOsMaiores(componente));
    if (componente.semInformacao) {
      notas.push(componente.semInformacao + ' atendimento(s) sem esta informação não entram '
        + 'neste ranking.');
    }
    return notas.length ? '<p class="grafico-pe">' + notas.join(' ') + '</p>' : '';
  }

  function tileDePrazo(rotulo, numero, tom, dica) {
    return '<div class="indicador tom-' + escapar(tom) + '"'
      + (dica ? ' title="' + escapar(dica) + '"' : '') + '>'
      + '<span class="rotulo">' + escapar(rotulo) + '</span>'
      + '<strong class="numero">' + numero + '</strong></div>';
  }

  function blocoDoSla(sla) {
    var dentro = sla.noPrazo + sla.cumpridos;
    var fora = sla.fora + sla.estourados;
    return '<div class="prazo-bloco" data-prazo="sla">'
      + '<h4>' + escapar(sla.nome) + '</h4>'
      + '<p class="prazo-regra">Conta de segunda a sexta, no expediente, até a '
      + 'primeira resposta.</p>'
      + '<div class="cartoes">'
      + tileDePrazo('Dentro do SLA', dentro, 'bom',
        'Respondidos no prazo, mais os que ainda estão dentro dele')
      + tileDePrazo('Fora do SLA', fora, fora ? 'ruim' : 'neutro',
        'Passaram do prazo, respondidos ou não')
      + (sla.semConta ? tileDePrazo('Sem como contar', sla.semConta, 'neutro',
        'Casos sem data de entrada: o prazo não tem de onde começar') : '')
      + '</div>' + desenharQuemPassou(sla, 'Fora do SLA') + '</div>';
  }

  function blocoDoSinalizador(sinalizador) {
    return '<div class="prazo-bloco" data-prazo="' + escapar(sinalizador.id) + '">'
      + '<h4>' + escapar(sinalizador.nome) + '</h4>'
      + '<p class="prazo-regra">' + escapar(sinalizador.regra)
      + ' · de segunda a sexta, no expediente, até o status final.</p>'
      + '<div class="cartoes">'
      + tileDePrazo('No prazo', sinalizador.noPrazo, 'bom', 'Abertos, com folga')
      + tileDePrazo('Vencem em breve', sinalizador.atencao,
        sinalizador.atencao ? 'atencao' : 'neutro',
        'Abertos, no último dia do prazo')
      + tileDePrazo('Fora do prazo', sinalizador.fora, sinalizador.fora ? 'ruim' : 'neutro',
        'Abertos que já passaram do prazo')
      + tileDePrazo('Encerrados fora', sinalizador.estourados,
        sinalizador.estourados ? 'ruim' : 'neutro',
        'Chegaram ao status final depois do prazo')
      + tileDePrazo('Encerrados no prazo', sinalizador.cumpridos, 'bom',
        'Chegaram ao status final dentro do prazo')
      + '</div>' + desenharQuemPassou(sinalizador, 'Passaram do prazo') + '</div>';
  }

  /** Quem deixou passar, e quais casos são. */
  function desenharQuemPassou(resumo, titulo) {
    if (!resumo.lista.length) {
      return '<p class="prazo-limpo">Nenhum caso passou do prazo neste período.</p>';
    }
    var analistas = resumo.porAnalista.map(function (um) {
      return '<li class="prazo-analista"><strong>' + escapar(um.analista) + '</strong>'
        + '<span>' + um.total + (um.total === 1 ? ' caso' : ' casos')
        + (um.fora && um.estourados
          ? ' (' + um.fora + ' em aberto, ' + um.estourados + ' encerrado'
            + (um.estourados === 1 ? '' : 's') + ')' : '') + '</span></li>';
    }).join('');

    var linhas = resumo.lista.map(function (caso) {
      return '<tr><td>' + escapar(caso.analista) + '</td>'
        + '<td><span class="principal">' + escapar(caso.caso) + '</span></td>'
        + '<td>' + escapar(caso.situacao || '—') + '</td>'
        + '<td>' + (caso.encerrado ? 'Encerrado' : 'Em aberto') + '</td>'
        + '<td class="direita">' + escapar(caso.alem) + '</td></tr>';
    }).join('');

    return '<h5 class="prazo-titulo">' + escapar(titulo) + ' · por analista</h5>'
      + '<ul class="prazo-analistas">' + analistas + '</ul>'
      + '<div class="rolagem-tabela"><table class="fila prazos-lista">'
      + '<thead><tr><th>Analista</th><th>Caso</th><th>Situação</th><th>Estado</th>'
      + '<th class="direita">Além do prazo</th></tr></thead>'
      + '<tbody>' + linhas + '</tbody></table></div>'
      + (resumo.maisCasos
        ? '<p class="prazo-regra">E mais ' + resumo.maisCasos + ' caso(s), do que '
          + 'passou menos do prazo. A lista mostra os mais atrasados.</p>' : '');
  }

  function desenharFiltros() {
    var caixas = painel.filtrosDisponiveis.map(function (filtro) {
      // A primeira opção é o nome do filtro puro — "Analista", "Status".
      // Era "Todos — Analista", e o "Todos —" só ocupava espaço: a caixa
      // fechada mostrava a palavra que menos importa, e em tela estreita o
      // nome do filtro era justamente o pedaço que ficava cortado.
      var opcoes = ['<option value="">' + escapar(filtro.rotulo) + '</option>'];
      filtro.opcoes.forEach(function (opcao) {
        opcoes.push('<option value="' + escapar(opcao.valor) + '"'
          + (filtros[filtro.chave] === opcao.valor ? ' selected' : '') + '>'
          + escapar(opcao.rotulo) + '</option>');
      });
      return '<select class="filtro" data-filtro="' + escapar(filtro.chave) + '"'
        + ' aria-label="Filtrar por ' + escapar(filtro.rotulo) + '">'
        + opcoes.join('') + '</select>';
    });

    // A caixa de filtros e o seletor de período são PEÇAS COMPARTILHADAS: o
    // Trabalho usa as mesmas. Duas cópias divergiriam no primeiro ajuste, e aí
    // "setembro" significaria uma coisa numa tela e outra na vizinha.
    return Moldura.caixaDeFiltros(
      SeletorDePeriodo.desenhar(painel) + caixas.join(''),
      painel.total + ' casos · ' + escapar(painel.periodo.rotulo));
  }

  /* ------------------------------------------------------------- gráficos */

  function desenharComponente(componente) {
    return '<section class="cartao grafico largura-' + componente.largura + '"'
      + ' data-grafico="' + escapar(componente.id) + '">'
      + '<header class="grafico-cabeca">'
      + '<h3>' + escapar(componente.titulo) + '</h3>'
      + '<div class="grafico-acoes">'
      + '<button type="button" class="botao-texto" data-tabela="'
      + escapar(componente.id) + '">'
      + (tabelasAbertas[componente.id] ? 'Ver o gráfico' : 'Ver os números') + '</button>'
      + (painel.podeExportar
        ? '<button type="button" class="botao-texto" data-exportar="'
          + escapar(componente.id) + '">Exportar</button>' : '')
      + '</div></header>'
      + (tabelasAbertas[componente.id]
        ? Graficos.tabela(componente) : Graficos.desenhar(componente))
      + rodapeDoGrafico(componente)
      + '</section>';
  }

  /**
   * O gráfico de VALOR POR SITUAÇÃO — o dinheiro em cada desfecho.
   *
   * Desenhado à parte dos outros, e com o gráfico E a tabela ao mesmo tempo:
   * aqui os NÚMEROS são o pedido ("valor dos retidos, não retidos, sem
   * sucesso, valor dos demais status e total"), e o desenho é a leitura rápida
   * deles. Esconder a tabela atrás de um botão faria o que ele pediu depender
   * de um clique.
   *
   * Não tem "Exportar" nem detalhamento por clique, e não é esquecimento: os
   * dois procuram o gráfico pelo Id dele na aba PAINEIS, e este gráfico não
   * mora lá — ele sai da configuração do CANAL. Oferecer os botões daria uma
   * recusa do servidor em vez de uma resposta.
   */
  function desenharValorPorSituacao(componente) {
    return '<section class="cartao grafico largura-2">'
      + '<header class="grafico-cabeca"><h3>' + escapar(componente.titulo)
      + '</h3></header>'
      + (componente.aviso
        ? '<p class="grafico-vazio">' + escapar(componente.aviso) + '</p>'
        : Graficos.desenhar(componente) + Graficos.tabela(componente))
      + '</section>';
  }

  function rodapeDoGrafico(componente) {
    if (componente.aviso || !componente.pontos.length) return '';
    return '<p class="grafico-pe">'
      + (componente.foraDoTopo ? soOsMaiores(componente) + ' ' : '')
      + 'Clique para ver os casos.</p>';
  }

  /**
   * Etapa 53, pedido do PO: só o top 5, sem "Demais valores". A rosca e a tabela
   * somam o que aparece — e isto diz, para ninguém ler a soma como o total.
   */
  function soOsMaiores(componente) {
    return 'Só os ' + componente.pontos.length + ' maiores aparecem; a soma e as '
      + 'porcentagens são entre eles.';
  }

  /* --------------------------------------------------------- comportamento */

  function ligarPainel() {
    ligarCliques('[data-aba-da-mesa]', function (botao) {
      var escolhida = botao.getAttribute('data-aba-da-mesa');
      if (escolhida === abaDaMesa) return;
      abaDaMesa = escolhida;
      desenhar();
    });

    ligarCliques('[data-origem-dos-atendidos]', function (botao) {
      var escolhida = botao.getAttribute('data-origem-dos-atendidos');
      if (escolhida === origemDosAtendidos) return;
      origemDosAtendidos = escolhida;
      desenhar();
    });
    ligarCliques('[data-ramo-dos-atendidos]', function (botao) {
      var escolhido = botao.getAttribute('data-ramo-dos-atendidos');
      if (escolhido === ramoDosAtendidos) return;
      ramoDosAtendidos = escolhido;
      desenhar();
    });

    var caixas = document.querySelectorAll('#analitico .filtro');
    for (var i = 0; i < caixas.length; i++) {
      caixas[i].addEventListener('change', function () {
        var novoPeriodo = SeletorDePeriodo.mudou(this, painel, 'analitico');
        if (novoPeriodo !== null) {
          // `false` quer dizer "é do período, mas ainda incompleto" — o de/até
          // com uma data só. Não recarrega, e também não cai no filtro comum.
          if (novoPeriodo) { periodo = novoPeriodo; carregar(); }
          return;
        }
        filtros[this.getAttribute('data-filtro')] = this.value;
        carregar();
      });
    }

    ligarCliques('[data-tabela]', function (botao) {
      var id = botao.getAttribute('data-tabela');
      tabelasAbertas[id] = !tabelasAbertas[id];
      desenhar();
    });

    ligarCliques('[data-exportar]', function (botao) {
      exportar(botao.getAttribute('data-exportar'));
    });

    ligarCliques('[data-ponto]', function (elementoClicado) {
      var grafico = elementoClicado.closest('.grafico');
      if (!grafico) return;
      // Gráfico SEM Id não detalha. É o caso do valor por situação, que não
      // tem linha na aba PAINEIS — chamar `detalharComponente` com Id vazio
      // devolveria "componente não encontrado" em cima de um clique que
      // parecia normal.
      var id = grafico.getAttribute('data-grafico');
      if (!id) return;
      detalhar(id, elementoClicado.getAttribute('data-ponto'));
    });

    Graficos.ligarDica(elemento('analitico'));
  }

  function ligarCliques(seletor, oQueFazer) {
    var achados = document.querySelectorAll('#analitico ' + seletor);
    for (var i = 0; i < achados.length; i++) {
      achados[i].addEventListener('click', function () { oQueFazer(this); });
      achados[i].addEventListener('keydown', function (evento) {
        if (evento.key === 'Enter' || evento.key === ' ') {
          evento.preventDefault();
          oQueFazer(this);
        }
      });
    }
  }

  // `todos`: a lista vem com os 100 mais recentes; "Mostrar todos" pede o resto.
  function detalhar(idDoComponente, chaveDoPonto, todos) {
    var caixa = elemento('detalhe-do-painel');
    caixa.innerHTML = '<p class="carregando-campos">Separando os casos…</p>';
    caixa.scrollIntoView({ behavior: 'smooth', block: 'nearest' });

    Servidor.chamar('detalharComponente', canalEscolhido, idDoComponente,
      chaveDoPonto, filtros, periodo, todos ? 'todos' : '')
      .entao(function (resposta) {
        // A lista atravessa compacta; a remontagem é a mesma da fila do
        // Trabalho (TelaTrabalho.expandirFila — as duas peças vivem na mesma
        // página).
        if (resposta.filaCompacta) {
          resposta.casos = TelaTrabalho.expandirFila(resposta.casos, resposta.colunas);
        }
        desenharDetalhe(resposta, idDoComponente, chaveDoPonto);
      })
      .senao(function (erro) {
        caixa.innerHTML = '<p class="carregando-campos erro-carga">'
          + escapar(erro.message || String(erro)) + '</p>';
      });
  }

  function desenharDetalhe(detalhe, idDoComponente, chaveDoPonto) {
    var cabecalho = detalhe.colunas.map(function (grupo) {
      return '<th>' + escapar(grupo.titulo) + '</th>';
    }).join('') + '<th class="acoes-coluna">Ações</th>';

    var linhas = detalhe.casos.map(function (caso) {
      var celulas = caso.celulas.map(function (grupo, i) {
        return '<td>' + grupo.map(function (celula, j) {
          if (celula.ehStatus) {
            return '<span class="situacao tom-' + escapar(caso.tom || 'neutro')
              + '">' + escapar(celula.valor || '—') + '</span>';
          }
          // Passar o cursor mostra o texto inteiro — o que é cortado com "…".
          return '<span class="' + ((j === 0 && i !== 0) ? 'principal' : 'apoio')
            + '" title="' + escapar(Moldura.dicaDaCelula(celula)) + '">'
            + escapar(celula.valor || '—') + '</span>';
        }).join('') + '</td>';
      }).join('');
      // "Trabalhar no caso", como na fila: abre o caso já no formulário. A
      // tela de leitura saiu do sistema, a pedido do PO.
      return '<tr>' + celulas + '<td class="acoes-coluna">'
        + (detalhe.podeEditar
          ? '<button type="button" class="acao" data-caso-do-painel="'
            + escapar(caso.id) + '">' + Moldura.icone('editar')
            + ' Trabalhar no caso</button>'
          : '')
        + '</td></tr>';
    }).join('');

    elemento('detalhe-do-painel').innerHTML = '<section class="cartao sem-forro origem">'
      + '<header class="origem-cabeca"><h3>' + escapar(detalhe.titulo) + ' · '
      + escapar(detalhe.ponto) + '</h3>'
      + '<span class="quantos">' + detalhe.total + '</span>'
      + '<button type="button" class="botao-texto" id="fechar-detalhe">'
      + 'Fechar</button></header>'
      + (detalhe.casos.length < detalhe.total
        ? '<div class="fila-mostrar"><span class="fila-mostrando">Mostrando os '
          + detalhe.casos.length + ' casos mais recentes de ' + detalhe.total + '</span>'
          + '<button type="button" class="mostrar-quantos" id="detalhe-todos">'
          + 'Mostrar todos (' + detalhe.total + ')</button></div>'
        : '')
      + (detalhe.casos.length
        ? '<div class="rolagem-tabela"><table class="fila agrupada">'
          + '<thead><tr>' + cabecalho + '</tr></thead>'
          + '<tbody>' + linhas + '</tbody></table></div>'
        : '<p class="grafico-vazio">Nenhum caso aqui.</p>')
      + '</section>';

    elemento('fechar-detalhe').addEventListener('click', function () {
      elemento('detalhe-do-painel').innerHTML = '';
    });
    var todos = elemento('detalhe-todos');
    if (todos) todos.addEventListener('click', function () {
      detalhar(idDoComponente, chaveDoPonto, true);
    });

    var abrir = document.querySelectorAll('[data-caso-do-painel]');
    for (var i = 0; i < abrir.length; i++) {
      abrir[i].addEventListener('click', function () {
        CasoEmModal.abrir(canalEscolhido, this.getAttribute('data-caso-do-painel'),
          carregar);
      });
    }
  }

  /**
   * Exportar.
   *
   * O Apps Script serve a página num quadro isolado, e ali o navegador barra
   * download que a própria página começa. Então mostramos o texto pronto para
   * copiar — que funciona em qualquer lugar — e oferecemos o download por
   * cima, para quem estiver num contexto que o aceite.
   */
  function exportar(idDoComponente) {
    Servidor.chamar('exportarComponente', canalEscolhido, idDoComponente,
      filtros, periodo)
      .entao(function (arquivo) { abrirCaixaDeExportar(arquivo); })
      .senao(function (erro) { window.alert(erro.message || String(erro)); });
  }

  function abrirCaixaDeExportar(arquivo) {
    var caixa = document.createElement('div');
    caixa.className = 'dialogo';
    caixa.id = 'dialogo-exportar';
    caixa.innerHTML = '<div class="dialogo-caixa" role="dialog" aria-modal="true"'
      + ' aria-labelledby="titulo-exportar">'
      + '<h3 id="titulo-exportar">Exportar</h3>'
      + '<p>Separado por ponto e vírgula, que é como o Excel em português abre '
      + 'sem perguntar nada.</p>'
      + '<textarea id="texto-exportado" rows="8" readonly>'
      + escapar(arquivo.conteudo) + '</textarea>'
      + '<div class="config-acoes">'
      + '<button type="button" class="botao" id="copiar-exportado">Copiar</button>'
      + '<button type="button" class="botao vazado" id="fechar-exportar">'
      + 'Fechar</button></div></div>';
    document.body.appendChild(caixa);

    function sair() { if (caixa.parentNode) caixa.parentNode.removeChild(caixa); }
    elemento('fechar-exportar').addEventListener('click', sair);
    caixa.addEventListener('mousedown', function (evento) {
      if (evento.target === caixa) sair();
    });

    var area = elemento('texto-exportado');
    area.focus();
    area.select();

    elemento('copiar-exportado').addEventListener('click', function () {
      area.select();
      var deuCerto = false;
      try { deuCerto = document.execCommand('copy'); } catch (erro) { deuCerto = false; }
      this.textContent = deuCerto ? 'Copiado' : 'Aperte Ctrl+C';
    });
  }

  /* ---------------------------------------------------------------- ligar */

  function ligar(pacote) {
    if (pacote) pacoteDoSistema = pacote;
    SeletorDeCanal.ligar(function (idDoCanal) {
      canalEscolhido = idDoCanal;
      filtros = {};
      tabelasAbertas = {};
      Aplicacao.remontar();
    });
    carregar();
  }

  function desligar() { Graficos.tirarDica(); }

  return { montar: montar, ligar: ligar, desligar: desligar };
})();
</script>
