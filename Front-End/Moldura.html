<script>
/* ============================================================================
   RECC — Moldura.html · o menu lateral e a barra superior
   ============================================================================
   A moldura aparece em TODAS as telas e é a mesma em todas. Ela não é escrita
   à mão no HTML: é montada a partir do pacote de partida, porque o menu
   depende do nível de acesso de quem entrou. Menu fixo no HTML ficaria fora
   de sincronia com as permissões no primeiro dia.
   ============================================================================ */

var Moldura = (function () {

  /**
   * O desenho de cada item do menu.
   *
   * SVG escrito à mão, sem biblioteca de fora: o Apps Script serve a página
   * num quadro isolado, e cada dependência externa é mais um ponto que pode
   * não carregar — e um menu sem ícone nenhum é um menu quebrado.
   *
   * Todos partem da mesma grade de 24 por 24, com a mesma espessura de
   * traço. É o que faz sete desenhos diferentes parecerem um conjunto.
   */
  var DESENHOS = {
    // painel: quatro áreas iguais, como os cartões da tela
    dashboard:
      '<rect x="3.5" y="3.5" width="7" height="7" rx="1.6"></rect>'
      + '<rect x="13.5" y="3.5" width="7" height="7" rx="1.6"></rect>'
      + '<rect x="3.5" y="13.5" width="7" height="7" rx="1.6"></rect>'
      + '<rect x="13.5" y="13.5" width="7" height="7" rx="1.6"></rect>',

    // registrar: o mais, sem moldura. Acrescentar é o gesto mais simples do
    // sistema, e o desenho mais simples é o que se reconhece de relance.
    cadastrarCaso:
      '<path d="M12 4.6v14.8M4.6 12h14.8"></path>',

    // desempenho: a linha de pulso, que sobe e desce como o dia da operação
    minhaPerformance:
      '<path d="M3.2 12.4h3.6l2.4-7 4 14.2 2.6-7.2h5"></path>',

    // buscar: a lupa
    buscarCaso:
      '<circle cx="10.8" cy="10.8" r="6.4"></circle>'
      + '<path d="M15.5 15.5 20.4 20.4"></path>',

    // corretoras: o prédio, com as janelas e a porta
    tabelaCorretoras:
      '<path d="M4.4 20.6V4.9a1.5 1.5 0 0 1 1.5-1.5h6.8a1.5 1.5 0 0 1 1.5 1.5v15.7"></path>'
      + '<path d="M14.2 10.4h4a1.5 1.5 0 0 1 1.5 1.5v8.7"></path>'
      + '<path d="M2.9 20.6h18.2"></path>'
      + '<path d="M7.4 7.4h1.3M11 7.4h1.3M7.4 11.2h1.3M11 11.2h1.3"></path>'
      + '<path d="M9.2 20.6v-4.2h1.6v4.2"></path>',

    // análise: as barras em pé, sobre a régua
    painelAnalitico:
      '<path d="M3.6 20.4h16.8"></path>'
      + '<path d="M7.4 20.4v-6.2M12 20.4V6.8M16.6 20.4v-9.6"></path>',

    // configurações: a engrenagem — anel, dentes por fora e o eixo no meio.
    // Os dentes ENCOSTAM no anel: afastados, o desenho vira um sol.
    configuracoes:
      '<circle cx="12" cy="12" r="7.1"></circle>'
      + '<circle cx="12" cy="12" r="2.9"></circle>'
      + '<path d="M12 2.6v2.3M12 19.1v2.3M2.6 12h2.3M19.1 12h2.3'
      + 'M5.3 5.3 6.9 6.9M17.1 17.1l1.6 1.6M18.7 5.3 17.1 6.9M6.9 17.1l-1.6 1.6"></path>',

    // --- os desenhos das SEÇÕES de Configurações --------------------------
    // Um por seção, na mesma grade e na mesma espessura dos outros. O menu de
    // Configurações é a única lista longa do sistema: sem ícone, oito linhas
    // de texto viram um bloco só, e a pessoa lê todas para achar uma.

    // campos do formulário: a etiqueta em cima, a caixa de digitar, a dica
    campos:
      '<path d="M4.2 6.2h7.6"></path>'
      + '<rect x="3.4" y="9.4" width="17.2" height="5.6" rx="1.6"></rect>'
      + '<path d="M4.2 18.6h11.4"></path>',

    // usuários: duas pessoas, a de trás pela metade
    usuarios:
      '<circle cx="9.4" cy="8.4" r="3.4"></circle>'
      + '<path d="M3.4 19.8a6 6 0 0 1 12 0"></path>'
      + '<path d="M16.2 5.4a3.4 3.4 0 0 1 0 6"></path>'
      + '<path d="M17.8 14.2a6 6 0 0 1 2.8 5.6"></path>',

    // níveis de acesso: o escudo com o visto — o que passa e o que não passa
    niveis:
      '<path d="M12 3.2 19.4 6v6.1c0 4.3-3 7.5-7.4 8.7-4.4-1.2-7.4-4.4-7.4-8.7V6z"></path>'
      + '<path d="m8.9 11.9 2.3 2.3L15.4 10"></path>',

    // listas: os marcadores e as linhas
    catalogo:
      '<circle cx="4.7" cy="6.6" r="1.1"></circle>'
      + '<circle cx="4.7" cy="12" r="1.1"></circle>'
      + '<circle cx="4.7" cy="17.4" r="1.1"></circle>'
      + '<path d="M9 6.6h11.3M9 12h11.3M9 17.4h11.3"></path>',

    // mesas de trabalho: a bancada, com o tampo e as duas pernas
    mesas:
      '<rect x="2.9" y="6.2" width="18.2" height="4.2" rx="1.4"></rect>'
      + '<path d="M5.9 10.4v7.4M18.1 10.4v7.4"></path>'
      + '<path d="M5.9 14.1h12.2"></path>',

    // identidade: a gota de tinta — nome, logo e cor são a aparência do PGO
    identidade:
      '<path d="M12 3.2c3.5 4.1 5.6 6.8 5.6 9.5a5.6 5.6 0 0 1-11.2 0c0-2.7 2.1-5.4 5.6-9.5z"></path>'
      + '<path d="M9.2 13.4a2.8 2.8 0 0 0 2.8 2.8"></path>',

    // painéis: o recorte da tela — a faixa de cima e a coluna da esquerda
    paineis:
      '<rect x="3.4" y="3.9" width="17.2" height="16.2" rx="2"></rect>'
      + '<path d="M3.4 9.1h17.2"></path>'
      + '<path d="M10.2 9.1v11"></path>',

    // análises: a tabela dinâmica — a grade com a faixa de cima destacada
    analises:
      '<rect x="3.4" y="4.4" width="17.2" height="15.2" rx="1.8"></rect>'
      + '<path d="M3.4 9.2h17.2"></path>'
      + '<path d="M3.4 14.4h17.2"></path>'
      + '<path d="M9.4 9.2v10.4M15 9.2v10.4"></path>',

    // estrutura e auditoria: a prancheta do laudo, com o visto
    estrutura:
      '<path d="M9 4.4H7.4A1.6 1.6 0 0 0 5.8 6v13.2a1.6 1.6 0 0 0 1.6 1.6h9.2a1.6 1.6 0 0 0 1.6-1.6V6a1.6 1.6 0 0 0-1.6-1.6H15"></path>'
      + '<rect x="9" y="2.8" width="6" height="3.2" rx="1"></rect>'
      + '<path d="m9.2 13.2 2 2 3.8-3.8"></path>',

    // --- os desenhos das AÇÕES, na mesma grade e na mesma espessura -------

    // ver: o olho
    olho:
      '<path d="M2.4 12S6.2 5.4 12 5.4 21.6 12 21.6 12 17.8 18.6 12 18.6 2.4 12 2.4 12z"></path>'
      + '<circle cx="12" cy="12" r="3.1"></circle>',

    // editar: o lápis
    editar:
      '<path d="M16.4 3.9a2 2 0 0 1 2.8 2.8L8.4 17.5l-3.9 1.1 1.1-3.9z"></path>'
      + '<path d="M14.7 5.6 18.4 9.3"></path>',

    // trocar situação: as duas setas em círculo
    trocarSituacao:
      '<path d="M20.4 11.2a8.4 8.4 0 0 0-14.3-4.6L3.6 9"></path>'
      + '<path d="M3.6 4.6V9h4.4"></path>'
      + '<path d="M3.6 12.8a8.4 8.4 0 0 0 14.3 4.6L20.4 15"></path>'
      + '<path d="M20.4 19.4V15H16"></path>',

    // ocultar: a lixeira, com a tampa
    ocultar:
      '<path d="M4.4 6.8h15.2"></path>'
      + '<path d="M9.2 6.8V5.2a1.4 1.4 0 0 1 1.4-1.4h2.8a1.4 1.4 0 0 1 1.4 1.4v1.6"></path>'
      + '<path d="M6.4 6.8v12.4a1.4 1.4 0 0 0 1.4 1.4h8.4a1.4 1.4 0 0 0 1.4-1.4V6.8"></path>'
      + '<path d="M10.2 10.6v6M13.8 10.6v6"></path>'
  };

  var TEMAS = [
    { chave: 'padrao', nome: 'Padrão — azul Porto Seguro' },
    { chave: 'rosa', nome: 'Rosa' },
    { chave: 'dark', nome: 'Escuro' },
    { chave: 'brasil', nome: 'Brasil' }
  ];

  /**
   * O desenho de um item do menu ou de uma ação.
   *
   * Nome desconhecido cai no painel, e não em nada: um botão sem ícone,
   * ao lado de outros com ícone, parece um botão quebrado.
   */
  function icone(tela) {
    var desenho = DESENHOS[tela] || DESENHOS.dashboard;
    // Traço fino: 1,7 deixava os desenhos pesados ao lado de texto normal.
    return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor"'
      + ' stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"'
      + ' aria-hidden="true">' + desenho + '</svg>';
  }

  /** As iniciais do nome, para o círculo da barra superior. */
  function iniciais(nome) {
    var partes = String(nome || '').trim().split(/\s+/);
    if (!partes[0]) return '?';
    if (partes.length === 1) return partes[0].substring(0, 2).toUpperCase();
    return (partes[0].charAt(0) + partes[partes.length - 1].charAt(0)).toUpperCase();
  }

  function escapar(texto) {
    return String(texto === null || texto === undefined ? '' : texto)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

  /** A marca do topo do menu: a logo de CONFIG, ou o nome quando não há logo. */
  function marca(identidade) {
    if (identidade.logo) {
      return '<img src="' + escapar(identidade.logo) + '" alt="'
        + escapar(identidade.operacao || identidade.nome) + '">';
    }
    // Sem logo, o nome vira a marca. As duas últimas letras ganham a cor de
    // destaque — é o mesmo tratamento do "PGO" dos desenhos da tela.
    var nome = String(identidade.nome || 'RECC');
    var corte = Math.max(nome.length - 2, 1);
    return '<span class="escrito">' + escapar(nome.substring(0, corte))
      + '<em>' + escapar(nome.substring(corte)) + '</em></span>';
  }

  function montarLateral(pacote, telaAtual) {
    var itens = pacote.menu.map(function (item) {
      var atual = item.tela === telaAtual ? ' aria-current="page"' : '';
      return '<li><button type="button" class="lateral-item"'
        + ' data-tela="' + escapar(item.tela) + '"' + atual + '>'
        + icone(item.tela)
        + '<span class="rotulo">' + escapar(item.titulo) + '</span>'
        + '</button></li>';
    }).join('');

    var rodape = '';
    if (pacote.identidade.plataforma || pacote.identidade.fabricante) {
      rodape = '<div class="lateral-pe">'
        + '<div>' + escapar(pacote.identidade.plataforma) + '</div>'
        + '<div class="fabricante">' + escapar(pacote.identidade.fabricante) + '</div>'
        + '</div>';
    }

    return '<div class="lateral-marca">'
      + marca(pacote.identidade)
      + '<button type="button" class="lateral-encolher" id="encolher"'
      + ' title="Encolher o menu" aria-label="Encolher o menu">'
      + '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"'
      + ' stroke-linecap="round" aria-hidden="true">'
      + '<path d="M4 7h16M4 12h16M4 17h16"></path></svg>'
      + '</button>'
      + '</div>'
      + '<ul class="lateral-itens">' + itens + '</ul>'
      + rodape;
  }

  /**
   * A barra superior.
   *
   * A ordem foi pedida assim, e cada peça responde a uma pergunta diferente:
   *   identidade        que sistema é este, de que operação
   *   busca             achar um caso sem sair de onde se está
   *   bolinhas          a cor da tela, escolha de quem usa
   *   último registro   a base está atualizada?
   *   pessoa            quem sou eu aqui dentro, e com que cargo
   *
   * O nome da TELA não fica aqui: ele fica no topo do conteúdo, junto do que
   * ele nomeia.
   */
  function montarSuperior(pacote) {
    var bolinhas = TEMAS.map(function (tema) {
      var marcado = tema.chave === pacote.tema ? 'true' : 'false';
      return '<button type="button" class="tema tema-' + tema.chave + '"'
        + ' data-tema="' + tema.chave + '" aria-pressed="' + marcado + '"'
        + ' title="' + escapar(tema.nome) + '"'
        + ' aria-label="Tema ' + escapar(tema.nome) + '"></button>';
    }).join('');

    return ''
      + '<button type="button" class="abrir-menu" id="abrir-menu" aria-label="Abrir o menu">'
      + '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"'
      + ' stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"></path></svg>'
      + '</button>'

      + '<div class="identidade">'
      + '<h1>' + escapar(pacote.identidade.nome)
      + (pacote.identidade.nomeLongo
        ? ' — ' + escapar(pacote.identidade.nomeLongo) : '')
      + '</h1>'
      + '<p>' + escapar(pacote.identidade.operacao) + '</p>'
      + '</div>'

      + '<div class="busca">'
      + '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"'
      + ' stroke-linecap="round"><circle cx="11" cy="11" r="7"></circle>'
      + '<path d="M20 20l-4.2-4.2"></path></svg>'
      + '<input type="search" id="busca-global" autocomplete="off"'
      + ' placeholder="Buscar por apólice, segurado ou protocolo…"'
      + ' aria-label="Busca geral">'
      + '<kbd>Ctrl K</kbd>'
      + '</div>'

      + '<div class="temas" role="group" aria-label="Cor do sistema">' + bolinhas + '</div>'

      + ultimoRegistro(pacote.ultimoRegistro)

      + '<div class="pessoa">'
      + '<div class="iniciais" aria-hidden="true">'
      + escapar(iniciais(pacote.usuario.nome)) + '</div>'
      + '<div class="quem"><strong>' + escapar(pacote.usuario.nome) + '</strong>'
      + '<span>' + escapar(descricaoDaPessoa(pacote.usuario)) + '</span>'
      + '</div></div>';
  }

  /** "Analista RET · Vida Individual" — o cargo, e o canal quando existe. */
  function descricaoDaPessoa(usuario) {
    var cargo = usuario.cargo || usuario.nivelAcesso || '';
    if (usuario.canalQueAtende) return cargo + ' · ' + usuario.canalQueAtende;
    return cargo;
  }

  /** A data do último registro, ou o aviso de que ainda não há nenhum. */
  function ultimoRegistro(dados) {
    var informacao = dados || { texto: 'Nenhum registro ainda', existe: false };
    var explicacao = informacao.existe && informacao.mesa
      ? 'Último registro em ' + informacao.mesa
      : 'Ainda não há registros nas mesas';

    return '<div class="ultimo-registro' + (informacao.existe ? '' : ' vazio') + '"'
      + ' title="' + escapar(explicacao) + '">'
      + '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"'
      + ' stroke-linecap="round" aria-hidden="true">'
      + '<rect x="3.5" y="5" width="17" height="15" rx="2"></rect>'
      + '<path d="M3.5 10h17M8 3.5v3M16 3.5v3"></path></svg>'
      + '<span class="rotulo-data">' + escapar(informacao.texto) + '</span>'
      + '</div>';
  }

  return {
    montarLateral: montarLateral,
    montarSuperior: montarSuperior,
    // Os desenhos são de todas as telas, e não só do menu: a fila usa o olho,
    // o lápis e a lixeira, e eles precisam vir da mesma grade e da mesma
    // espessura, senão a tela parece montada com peças de dois conjuntos.
    icone: icone,
    escapar: escapar,
    iniciais: iniciais
  };
})();
</script>
