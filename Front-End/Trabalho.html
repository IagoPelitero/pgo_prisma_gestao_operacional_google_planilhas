<script>
/* ============================================================================
   PGO — Trabalho.html · a visão do dia
   ============================================================================
   Cartões em cima, fila embaixo. Os dois vêm da MESMA resposta do servidor,
   já filtrados pelo alcance do nível — e por isso o número do cartão sempre
   bate com o que a fila mostra. Contar de um lado e listar de outro deixaria
   o cartão dizendo 12 e a fila mostrando 7, sem ninguém entender qual está
   certo.
   ============================================================================ */

var TelaTrabalho = (function () {

  var canalEscolhido = '';
  var filtrosEscolhidos = {};
  // O PERÍODO SAIU do Trabalho (Etapa 84, pedido do PO). No lugar, as
  // SUB-ABAS da RET e da Mesa: 1 = os casos de trabalho, 2 = os concluídos.
  // A última aberta em cada canal fica lembrada neste navegador (aprovado
  // pelo PO); sem lembrança, abre na 1.
  var subAbaPorCanal = {};
  var subAbasConhecidas = {};
  var CHAVE_DA_SUB_ABA = 'pgo.trabalho.subAba.';

  function subAbaDoCanal(idDoCanal) {
    if (subAbaPorCanal[idDoCanal]) return subAbaPorCanal[idDoCanal];
    var lembrada = 1;
    try { lembrada = Number(window.localStorage.getItem(CHAVE_DA_SUB_ABA + idDoCanal)) === 2 ? 2 : 1; }
    catch (semArmazenamento) { lembrada = 1; }
    subAbaPorCanal[idDoCanal] = lembrada;
    return lembrada;
  }

  function lembrarSubAba(idDoCanal, qual) {
    subAbaPorCanal[idDoCanal] = qual;
    try { window.localStorage.setItem(CHAVE_DA_SUB_ABA + idDoCanal, String(qual)); }
    catch (semArmazenamento) { /* sem lembrança, abre na 1 da próxima vez */ }
  }
  // Quantos casos a fila mostra — o "Mostrar", em cima da tabela. Zero é
  // "ainda não escolheu": vale o padrão do servidor (5). Os 100 mais recentes
  // já vieram, e até 100 trocar não volta ao servidor; "Todos" vai buscar o
  // resto (ver RECC_FILA_NA_ABERTURA, no servidor). Não é filtro — não muda
  // os cartões, o "Limpar filtros" não mexe nele, e trocar de canal mantém.
  var quantosNaFila = 0;
  var focarNoMostrar = '';
  var resumo = null;
  // O aviso dos casos perto de vencer sai UMA VEZ por canal, quando a pessoa
  // entra nele — não a cada filtro, nem depois de cada gravação. Ver
  // `avisarDosQueVencem`.
  var jaAvisouNoCanal = {};
  var avisarQuandoChegar = false;

  function escapar(texto) { return Moldura.escapar(texto); }
  function elemento(id) { return document.getElementById(id); }

  /* --------------------------------------------------------------- montar */

  /*
    NA MESA, A SUB-ABA "REUNIÕES" (Etapa 79, pedido do PO): "na aba Trabalho tem
    que ter uma sub aba de reunião ao clicar em Mesa Diamante". Ela lista a
    Agenda da segunda base; os casos continuam na aba de sempre.
  */
  var abaDaMesa = 'casos';
  var temAgenda = false;
  var buscaNaAgenda = '';

  /*
    A BARRA DE ABAS (Etapa 84). As sub-abas do canal — "Casos em aberto" e
    "Casos concluídos" na RET; "Casos em andamento" e "Casos concluídos" na
    Mesa —, cada uma com quantos casos tem (aprovado pelo PO). Na Mesa, a
    "Reuniões" (Etapa 79) entra na mesma linha: duas linhas de abas uma em cima
    da outra confundiriam qual manda em qual. Os nomes e os números vêm do
    servidor; antes da primeira resposta, a barra mostra só o que já se sabe.
  */
  function abasDoTrabalho() {
    var conhecidas = subAbasConhecidas[canalEscolhido];
    var abas = [];
    if (conhecidas) {
      conhecidas.nomes.forEach(function (nome, i) {
        var numero = conhecidas.contagem ? conhecidas.contagem[i] : null;
        abas.push({ atributo: 'data-sub-aba="' + (i + 1) + '"', rotulo: escapar(nome)
          + (numero === null || numero === undefined ? ''
            : ' <b class="numero-da-aba">' + Number(numero).toLocaleString('pt-BR') + '</b>'),
          atual: abaDaMesa !== 'reunioes' && subAbaDoCanal(canalEscolhido) === i + 1 });
      });
    } else if (temAgenda) {
      abas.push({ atributo: 'data-aba-do-trabalho="casos"', rotulo: 'Casos', atual: abaDaMesa === 'casos' });
    }
    if (temAgenda) {
      abas.push({ atributo: 'data-aba-do-trabalho="reunioes"', rotulo: 'Reuniões', atual: abaDaMesa === 'reunioes' });
    }
    if (!abas.length) return '';
    return '<div class="config-abas abas-do-trabalho" role="tablist" aria-label="O que ver">'
      + abas.map(function (aba) {
        return '<button type="button" role="tab" class="config-aba' + (aba.atual ? ' atual' : '') + '"'
          + ' aria-selected="' + aba.atual + '" ' + aba.atributo + '>' + aba.rotulo + '</button>';
      }).join('') + '</div>';
  }

  function desenharAbas() {
    var lugar = elemento('abas-do-trabalho');
    if (!lugar) return;
    lugar.innerHTML = abasDoTrabalho();
    ligarCliques('[data-aba-do-trabalho]', function (botao) {
      abaDaMesa = botao.getAttribute('data-aba-do-trabalho');
      Aplicacao.remontar();
    });
    ligarCliques('[data-sub-aba]', function (botao) {
      var qual = Number(botao.getAttribute('data-sub-aba'));
      var vindoDasReunioes = abaDaMesa === 'reunioes';
      abaDaMesa = 'casos';
      if (qual === subAbaDoCanal(canalEscolhido) && !vindoDasReunioes) return;
      lembrarSubAba(canalEscolhido, qual);
      // O cartão e o Status escolhidos eram da outra aba: não valem nesta.
      filtrosEscolhidos.cartao = '';
      (resumo && resumo.filtrosDisponiveis || []).forEach(function (filtro) {
        if (resumo.canal && String(filtro.cabecalho).toLowerCase()
          === String(resumo.canal.colunaDoStatus || '').toLowerCase()) delete filtrosEscolhidos[filtro.chave];
      });
      if (vindoDasReunioes) { Aplicacao.remontar(); return; }
      desenharAbas();
      carregar();
    });
  }

  /*
    SÓ VALE A RESPOSTA DO ÚLTIMO PEDIDO (Etapa 86, F6).

    Dois cliques seguidos (um cartão, um filtro, a troca de sub-aba) são dois
    pedidos ao servidor, e as respostas voltam em qualquer ordem — a primeira
    chegando por último desenhava a fila de um filtro que já não está marcado.
    Cada carga do painel ganha um número; a resposta que chega com número
    velho é descartada. A Agenda da Mesa divide o mesmo painel, e por isso o
    mesmo contador. Os números e a fila continuam vindo do servidor, iguais.
  */
  var pedidoDoPainel = 0;

  function carregarAgenda() {
    var meuPedido = ++pedidoDoPainel;
    elemento('painel').innerHTML = '<p class="carregando-campos">Lendo a Agenda…</p>';
    Servidor.chamar('agendaDaMesa', canalEscolhido, buscaNaAgenda)
      .entao(function (resposta) {
        if (meuPedido !== pedidoDoPainel) return;
        elemento('painel').innerHTML = Agenda.lista(resposta, buscaNaAgenda);
        var busca = elemento('busca-na-agenda');
        busca.addEventListener('keydown', function (evento) {
          if (evento.key !== 'Enter') return;
          buscaNaAgenda = this.value.trim();
          carregarAgenda();
        });
        var registrar = elemento('registrar-reuniao');
        if (registrar) {
          registrar.addEventListener('click', function () {
            Agenda.abrirDialogo(canalEscolhido, resposta.campos, null, carregarAgenda);
          });
        }
        ligarCliques('[data-editar-reuniao]', function (botao) {
          var linha = Number(botao.getAttribute('data-editar-reuniao'));
          var reuniao = resposta.reunioes.filter(function (uma) { return uma.linha === linha; })[0];
          if (reuniao) Agenda.abrirDialogo(canalEscolhido, resposta.campos, reuniao, carregarAgenda);
        });
      })
      .senao(function (erro) {
        if (meuPedido !== pedidoDoPainel) return;
        elemento('painel').innerHTML = '<p class="carregando-campos erro-carga">'
          + escapar(erro.message || String(erro)) + '</p>';
      });
  }

  function montar(pacote) {
    if (!canalEscolhido && pacote.canais.length) canalEscolhido = pacote.canais[0].id;
    temAgenda = Agenda.ehDaMesa(pacote.canais, canalEscolhido);
    if (!temAgenda) abaDaMesa = 'casos';
    return SeletorDeCanal.montar(pacote.canais, canalEscolhido)
      + '<div id="abas-do-trabalho">' + abasDoTrabalho() + '</div>'
      + '<div id="painel">' + Moldura.esqueleto('Somando os casos…') + '</div>';
  }

  /**
   * A variação em relação ao período anterior.
   * Quando não há base de comparação, o espaço fica vazio — inventar "+100%"
   * porque saiu de zero é ruído que a operação aprende a ignorar.
   */
  function variacao(cartao) {
    if (cartao.variacao === null || cartao.variacao === undefined) {
      // Espaço reservado para os cartões ficarem da mesma altura, mas em
      // branco: repetir "sem base" em cada um vira ruído e parece erro.
      return '<span class="variacao vazia" aria-hidden="true">—</span>';
    }
    var subiu = cartao.variacao >= 0;
    return '<span class="variacao ' + (subiu ? 'subiu' : 'desceu') + '">'
      + (subiu ? '▲' : '▼') + ' ' + Math.abs(cartao.variacao) + '%'
      + '<em>vs. período anterior</em></span>';
  }

  /**
   * Os cartões. Clicar num deles filtra a fila por aquela situação — é o
   * gesto que a tela existe para atender: "é isso que eu tenho de trabalhar".
   *
   * CLICAR NUM CARTÃO FILTRA A FILA pelo que ele conta (Etapa 44): o status,
   * o valor de uma coluna (o Status proposta: "Aguardando transmissão"), a
   * coluna preenchida. Quem decide é o servidor, pelo Id do cartão — a mesma
   * regra da contagem, para o número do cartão e a fila baterem. Antes só o
   * cartão de status filtrava, e pelo NOME do cartão: um cartão chamado
   * diferente do status deixava a fila vazia. Clicar de novo, ou no "Total",
   * desliga. Os cartões continuam contando sem o filtro deles.
   */
  function desenharCartoes() {
    return '<div class="cartoes">'
      + resumo.cartoes.map(function (cartao) {
        var filtravel = cartao.filtravel === true && cartao.id !== undefined;
        var ligado = filtravel && cartao.dimensao !== 'total'
          && String(filtrosEscolhidos.cartao || '') === String(cartao.id);

        return '<' + (filtravel ? 'button type="button"' : 'div')
          + ' class="indicador tom-' + escapar(cartao.tom || 'neutro')
          + (filtravel ? ' clicavel' : '') + (ligado ? ' ligado' : '') + '"'
          + (filtravel ? ' data-cartao-da-fila="' + escapar(cartao.id) + '"'
            + ' data-cartao-total="' + (cartao.dimensao === 'total' ? 'sim' : 'nao') + '"' : '')
          + (cartao.explicacao ? ' title="' + escapar(cartao.explicacao) + '"'
            : (filtravel ? ' title="Filtrar a fila por ' + escapar(cartao.rotulo) + '"' : ''))
          + '><span class="rotulo">' + escapar(cartao.rotulo) + '</span>'
          + '<strong class="numero">' + cartao.valor + '</strong>'
          + variacao(cartao)
          + '</' + (filtravel ? 'button' : 'div') + '>';
      }).join('')
      + '</div>';
  }

  function desenharFiltros() {
    // Cada filtro aceita várias opções (Etapa 72): a peça é a FiltroMultiplo,
    // a mesma da Produtividade e da Tabela de Corretoras.
    var caixas = resumo.filtrosDisponiveis.map(function (filtro) {
      return FiltroMultiplo.desenhar(filtro, filtrosEscolhidos);
    });

    // A BUSCA DIGITADA vem primeiro — pedido do PO: "o filtro por busca
    // digitada para cada canal". É um filtro como os outros: vai no mesmo
    // pacote de filtros, e trocar de canal limpa junto. Busca ao apertar Enter
    // (ou ao sair do campo), e não a cada letra: cada busca é uma ida ao
    // servidor, e uma por letra seria uma fila de idas que a pessoa não pediu.
    //
    // O PERÍODO SAIU (Etapa 84, pedido do PO): a busca e os filtros de lista
    // ficam. O que a tela olha é dito ao lado do título da caixa.
    var busca = '<input type="search" class="filtro busca-na-fila" data-filtro="busca"'
      + ' id="busca-na-fila" autocomplete="off"'
      + ' placeholder="Buscar neste canal e apertar Enter"'
      + ' aria-label="Buscar neste canal"'
      + ' value="' + escapar(filtrosEscolhidos.busca || '') + '">';

    return Moldura.caixaDeFiltros(
      busca
        + caixas.join('')
        + Moldura.botaoLimparFiltros('limpar-filtros')
        + FiltroMultiplo.etiquetas(resumo.filtrosDisponiveis, filtrosEscolhidos),
      resumo.total + ' de ' + resumo.totalNoPeriodo
        + ' casos · ' + (resumo.buscaNaPlanilhaToda
          // A busca procura na planilha toda (Etapa 69): a caixa diz onde.
          ? 'busca na planilha toda, de qualquer data'
          : oQueAAbaOlha()));
  }

  /** O que a fila desta aba olha — o recado ao lado do título dos filtros. */
  function oQueAAbaOlha() {
    if (resumo.subAbas && resumo.subAbas.atual === 1) return 'planilha toda';
    return resumo.truncada
      ? 'os ' + Number(resumo.teto).toLocaleString('pt-BR') + ' mais recentes'
      : 'planilha toda';
  }

  /** Como a fila está ordenada — o recado em cima da tabela. */
  function ordemDaFila() {
    if (!resumo.subAbas) return 'mais recentes';
    var datas = resumo.subAbas.ordem === 'antigos'
      ? 'do mais antigo para o mais recente' : 'do mais recente para o mais antigo';
    return resumo.subAbas.comPrioridade ? 'por prioridade do status, ' + datas : datas;
  }

  /**
   * A fila como a tela sempre a desenhou, a partir da forma compacta em que
   * ela atravessa do servidor: só os valores, e o nome e o "é status" de cada
   * coluna tirados de `colunas`, na mesma ordem. Ver compactarFila_.
   */
  function expandirFila(compacta, colunas) {
    return (compacta || []).map(function (caso) {
      return {
        id: caso.id,
        celulas: (caso.v || []).map(function (grupo, g) {
          var doGrupo = (colunas[g] && colunas[g].colunas) || [];
          return grupo.map(function (bruto, c) {
            var coluna = doGrupo[c] || {};
            var comAlerta = Object.prototype.toString.call(bruto) === '[object Array]';
            return {
              cabecalho: coluna.cabecalho || '',
              valor: comAlerta ? bruto[0] : bruto,
              ehStatus: coluna.ehStatus === true,
              alerta: comAlerta ? bruto[1] : '',
              tomDoAlerta: comAlerta ? bruto[2] : ''
            };
          });
        }),
        situacao: caso.situacao,
        tom: caso.tom,
        sla: caso.sla,
        sinais: caso.sinais
      };
    });
  }

  /** Quantos casos aparecem agora: a escolha da pessoa, ou o padrão (5). */
  function limiteDaFila() {
    var veio = resumo.fila.length;
    if (quantosNaFila === 'todos') return veio;
    return Math.min(quantosNaFila || resumo.mostrarNaFila.padrao, veio);
  }

  /** A fila inteira — `total` —, e não só os casos que vieram para a tela. */
  function totalDaFila() {
    return typeof resumo.total === 'number' ? resumo.total : resumo.fila.length;
  }

  /**
   * As quantidades que fazem sentido para ESTA fila — pedido do PO: "limitando
   * nas opções que eu informei, caso tenha a quantidade". Com 12 casos: 5, 10
   * e todos. Uma opção que não é menor que o total seria o "todos" com outro
   * nome; com 5 casos ou menos, não há o que escolher.
   */
  function opcoesDeMostrar(total, opcoes) {
    var cabem = opcoes.filter(function (quantos) { return quantos < total; });
    return cabem.length ? cabem.concat('todos') : [];
  }

  /**
   * A barra em cima da tabela: quantos aparecem, de quantos, e os botões para
   * mostrar mais. Até 100 é na hora; "Todos" busca o resto no servidor.
   */
  function barraDeMostrar(visiveis) {
    var total = totalDaFila();
    var opcoes = opcoesDeMostrar(total, resumo.mostrarNaFila.opcoes);
    if (!opcoes.length) return '';

    var botoes = opcoes.map(function (quantos) {
      var ligado = quantos === 'todos' ? visiveis === total : quantos === visiveis;
      return '<button type="button" class="mostrar-quantos" data-mostrar="' + quantos + '"'
        + ' aria-pressed="' + ligado + '">'
        + (quantos === 'todos' ? 'Todos (' + total + ')' : quantos) + '</button>';
    }).join('');

    return '<div class="fila-mostrar">'
      + '<span class="fila-mostrando">' + (visiveis < total
        ? (resumo.subAbas ? 'Mostrando ' + visiveis + ' de ' + total + ' · ' + ordemDaFila()
          : 'Mostrando os ' + visiveis + ' casos mais recentes de ' + total)
        : 'Mostrando todos os ' + total + ' casos') + '</span>'
      + '<div class="mostrar-grupo" role="group" aria-label="Quantos casos mostrar na fila">'
      + '<span>Mostrar</span>' + botoes + '</div></div>';
  }

  function desenharFila() {
    if (!resumo.fila.length && resumo.buscaNaPlanilhaToda) {
      return '<div class="cartao vazio">'
        + '<strong>Nenhum caso para mostrar aqui.</strong>'
        + '<p>' + (resumo.totalNoPeriodo
          ? 'A busca achou ' + resumo.totalNoPeriodo + ' casos na planilha toda, mas '
            + 'nenhum passa pelos filtros escolhidos.'
          : 'A busca não achou nenhum caso com esse texto na planilha toda, de '
            + 'qualquer data.') + '</p></div>';
    }
    if (!resumo.fila.length) {
      var ondeOlhou = resumo.subAbas
        ? 'em "' + escapar(resumo.subAbas.nomes[resumo.subAbas.atual - 1]) + '"' : 'neste canal';
      return '<div class="cartao vazio">'
        + '<strong>Nenhum caso para mostrar aqui.</strong>'
        + '<p>' + (resumo.totalNoPeriodo
          ? 'Há ' + resumo.totalNoPeriodo + ' casos ' + ondeOlhou + ', mas nenhum passa '
            + (filtrosEscolhidos.busca ? 'pela busca e pelos filtros escolhidos.'
              : 'pelos filtros escolhidos.')
          : 'Nenhum caso ' + ondeOlhou + '.') + '</p></div>';
    }

    var cabecalho = resumo.colunas.map(function (grupo) {
      return '<th>' + escapar(grupo.titulo) + '</th>';
    }).join('') + '<th class="acoes-coluna">Ações</th>';

    // A fila veio inteira, o mais recente em cima; aparecem só os primeiros.
    var visiveis = limiteDaFila();
    var linhas = resumo.fila.slice(0, visiveis).map(function (caso) {
      var celulas = caso.celulas.map(function (grupo, i) {
        // O selo do SLA mora junto da situação, no primeiro grupo: é onde o
        // olho já procura "como este caso está".
        return '<td>' + desenharGrupo(grupo, caso, i === 0)
          + (i === 0 ? seloDoSla(caso.sla) + selosDePrazo(caso.sinais) : '') + '</td>';
      }).join('');

      return '<tr>' + celulas + '<td class="acoes-coluna">'
        + acoesDaLinha(caso) + '</td></tr>';
    }).join('');

    // A barra vem EM CIMA da tabela: é o primeiro lugar que o olho vê, e com
    // cinco linhas e um cartão dizendo 37, ela explica a diferença antes que
    // pareça defeito.
    return '<div class="cartao sem-forro">'
      + barraDeMostrar(visiveis)
      + '<div class="rolagem-tabela"><table class="fila agrupada">'
      + '<thead><tr>' + cabecalho + '</tr></thead>'
      + '<tbody>' + linhas + '</tbody></table></div></div>';
  }

  /**
   * Um grupo de colunas dentro de uma célula.
   *
   * A primeira linha do grupo é a que salta — é o que a pessoa procura ao
   * varrer a fila: o protocolo, o nome do cliente. As de baixo vêm menores,
   * porque são o que ela confere depois de já ter achado a linha.
   */
  function desenharGrupo(grupo, caso, ehOPrimeiro) {
    return grupo.map(function (celula, i) {
      if (celula.ehStatus) {
        return '<span class="situacao tom-' + escapar(caso.tom || 'neutro') + '">'
          + escapar(celula.valor || '—') + '</span>';
      }
      var classe = (i === 0 && !ehOPrimeiro) ? 'principal' : 'apoio';

      // A COR vem do servidor já resolvida — a tela não conhece o limite de
      // 18 meses nem o de 25,5%. Vermelho é o alerta de sempre; amarelo e
      // verde são as outras duas faixas da vigência do VG, pedido do PO. A
      // dica leva o motivo, e o texto INTEIRO: o destaque não quebra linha.
      if (celula.alerta) {
        classe += { atencao: ' em-atencao', bom: ' em-bom' }[celula.tomDoAlerta]
          || ' em-alerta';
      }

      return '<span class="' + classe + '" title="'
        + escapar(Moldura.dicaDaCelula(celula))
        + '">' + escapar(celula.valor || '—') + '</span>';
    }).join('');
  }

  /**
   * As ações da linha, nesta ordem — pedido do PO, igual em todos os canais:
   *
   *   Trabalhar no caso   abre o caso JÁ NO FORMULÁRIO. Era "Ver detalhes",
   *                       que abria uma leitura e pedia mais um clique para
   *                       editar; "não tem necessidade do sistema apenas
   *                       mostrar o caso", e a leitura saiu do sistema.
   *   Alterar status      no lugar do lápis. É o gesto mais frequente, e o
   *                       único que não depende do formulário inteiro — por
   *                       isso funciona mesmo num caso que veio da base antiga
   *                       com a proposta ou a apólice pela metade.
   *   Excluir             por último, longe da mão: apaga de vez, e pergunta
   *                       antes num aviso de atenção.
   *
   * As duas primeiras aparecem só para quem pode editar: o servidor recusaria,
   * e botão que a chamada recusa ensina a pessoa a desconfiar da tela.
   */
  function acoesDaLinha(caso) {
    var botoes = '';

    if (resumo.podeEditar) {
      botoes += '<button type="button" class="acao" data-trabalhar="'
        + escapar(caso.id) + '">' + Moldura.icone('editar')
        + ' Trabalhar no caso</button>'
        + '<button type="button" class="acao-icone" data-status-do-caso="'
        + escapar(caso.id) + '" title="Alterar status" aria-label="Alterar status">'
        + Moldura.icone('trocarSituacao') + '</button>';
    }

    // Sem condição de permissão: qualquer pessoa cadastrada exclui, em
    // qualquer canal. É o que o PO pediu, e o servidor combina com isto.
    botoes += '<button type="button" class="acao-icone perigo" data-excluir="'
      + escapar(caso.id) + '" title="Excluir caso" aria-label="Excluir caso">'
      + Moldura.icone('ocultar') + '</button>';

    return botoes;
  }

  var focarABusca = false;

  /**
   * O selo do SLA — pedido do PO para a Mesa Diamante: "No prazo · faltam
   * 2h10" em verde, "Fora do prazo · 1h30 além" em vermelho; caso já
   * respondido, "SLA cumprido" ou "SLA estourado". A conta é do servidor; a
   * tela só pinta, e a dica diz até onde o prazo foi contado.
   * Canal sem SLA não manda nada, e não aparece nada.
   */
  var ATE_ONDE_O_SLA_CONTOU = {
    resposta: 'contado até a primeira resposta',
    encerramento: 'contado até o encerramento: o caso foi encerrado sem a primeira resposta',
    agora: 'ainda correndo: o caso não teve a primeira resposta'
  };

  function seloDoSla(sla) {
    if (!sla) return '';
    return '<span class="selo-sla tom-' + escapar(sla.tom) + '"'
      + ' title="' + escapar(sla.texto) + ' — SLA de '
      + escapar(String(sla.prazo / 60).replace('.', ','))
      + ' horas úteis, de segunda a sexta, no expediente, '
      + escapar(ATE_ONDE_O_SLA_CONTOU[sla.parouEm] || '') + '">'
      + escapar(sla.texto) + '</span>';
  }

  /*
    OS SINALIZADORES DE PRAZO, embaixo da situação: verde dentro do prazo,
    amarelo no último dia, vermelho depois. A cor sozinha não basta — quem
    não distingue verde de vermelho perde o aviso —, então o selo diz também
    o que a cor quer dizer, e a dica traz a regra por extenso.
  */
  var LEITURA_DO_TOM_DO_PRAZO = {
    bom: 'dentro do prazo', atencao: 'atenção: perto de vencer', ruim: 'fora do prazo'
  };

  function selosDePrazo(sinais) {
    return (sinais || []).map(function (sinal) {
      return '<span class="selo-prazo tom-' + escapar(sinal.tom) + '"'
        + ' title="' + escapar(sinal.texto) + ' — ' + escapar(sinal.regra)
        + ', de segunda a sexta, no expediente. '
        + (sinal.encerrado ? 'Contado até o caso chegar a um status final.'
          : sinal.naoComecou ? 'Ainda não começou: conta da primeira mudança de status.'
            : 'Ainda correndo: o caso não chegou a um status final.') + '">'
        + escapar(sinal.texto)
        + '<span class="so-leitor"> (' + escapar(LEITURA_DO_TOM_DO_PRAZO[sinal.tom] || '')
        + ')</span></span>';
    }).join('');
  }

  /*
    O AVISO DOS CASOS PERTO DE VENCER.

    Pedido do PO: "todo canal que tiver com a SLA próxima deve ter um pop-up
    sinalizando qual caso está próximo de vencer". Perto de vencer é o AMARELO
    do sinalizador — o "amarelo quando faltar…" que cada canal declara em
    Configurações › Sinalizadores. O vermelho já venceu, e o caso parado em
    "Não trabalhado" na RET está com o prazo cheio: nenhum dos dois entra.

    Sai da MESMA resposta que desenhou a fila: são os casos que esta pessoa
    enxerga (o alcance do nível já cortou o resto), sem ir ao servidor de novo.
    Canal sem sinalizador ligado, ou sem nenhum caso no amarelo, não abre nada.
  */
  function casosPertoDeVencer(fila) {
    var achados = [];
    (fila || []).forEach(function (caso) {
      (caso.sinais || []).forEach(function (sinal) {
        if (sinal.tom === 'atencao' && !sinal.encerrado) {
          achados.push({ caso: caso, sinal: sinal });
        }
      });
    });
    return achados;
  }

  /**
   * Como o caso aparece no aviso: a 1ª coluna do 2º grupo da fila — a mesma
   * regra da Produtividade (na RET, a proposta; na Mesa, o título do e-mail).
   * Vazia, fica o Id.
   */
  function rotuloDoCaso(caso) {
    var grupo = caso.celulas.length > 1 ? caso.celulas[1] : caso.celulas[0];
    var valor = grupo && grupo[0] ? String(grupo[0].valor || '').trim() : '';
    return valor || String(caso.id);
  }

  function avisarDosQueVencem() {
    // Os perto de vencer vêm à parte, da fila INTEIRA: a fila que veio para a
    // tela são só os 100 mais recentes.
    var achados = casosPertoDeVencer(resumo && (resumo.pertoDeVencer || resumo.fila));
    if (!achados.length || document.getElementById('dialogo-prazo')) return;

    var nomeDoCanal = resumo.canal && resumo.canal.nome ? resumo.canal.nome : '';
    var caixa = document.createElement('div');
    caixa.className = 'dialogo';
    caixa.id = 'dialogo-prazo';
    // O número é o da fila inteira; a lista vem com até 100 (ver o servidor).
    var quantos = Math.max(Number(resumo.quantosPertoDeVencer) || 0, achados.length);
    var sobram = quantos - achados.length;
    caixa.innerHTML = '<div class="dialogo-caixa aviso-de-prazo" role="alertdialog"'
      + ' aria-modal="true" aria-labelledby="titulo-prazo" aria-describedby="texto-prazo">'
      + '<h3 id="titulo-prazo">' + quantos
      + (quantos === 1 ? ' caso perto de vencer' : ' casos perto de vencer')
      + (nomeDoCanal ? ' · ' + escapar(nomeDoCanal) : '') + '</h3>'
      + '<p id="texto-prazo">Estão no amarelo do prazo. Trabalhe antes que fiquem vermelhos.</p>'
      + '<ul class="lista-de-prazo">'
      + achados.map(function (um) {
        var rotulo = rotuloDoCaso(um.caso);
        // O Id embaixo só quando o rótulo não é o próprio Id.
        var detalhes = (rotulo !== String(um.caso.id) ? [String(um.caso.id)] : [])
          .concat(um.caso.situacao ? [um.caso.situacao] : []);
        return '<li><span class="caso-do-prazo"><strong>' + escapar(rotulo)
          + '</strong><small>' + escapar(detalhes.join(' · ') || ' ') + '</small></span>'
          + '<span class="selo-prazo tom-atencao">' + escapar(um.sinal.texto) + '</span>'
          + '<button type="button" class="botao-secundario pequeno" data-trabalhar-do-aviso="'
          + escapar(um.caso.id) + '">Trabalhar no caso</button></li>';
      }).join('')
      + '</ul>'
      + (sobram > 0 ? '<p class="config-explica">E mais ' + sobram + (sobram === 1
        ? ' caso' : ' casos') + ' no amarelo. Estes são os mais recentes; a fila mostra '
        + 'o selo de prazo em cada um.</p>' : '')
      + '<div class="config-acoes"><button type="button" class="botao" id="fechar-aviso-de-prazo">'
      + 'Entendi</button></div></div>';
    document.body.appendChild(caixa);

    function sair() {
      if (caixa.parentNode) caixa.parentNode.removeChild(caixa);
      document.removeEventListener('keydown', aoTeclar);
    }
    function aoTeclar(evento) {
      if (evento.key === 'Escape') { evento.preventDefault(); sair(); }
    }
    document.addEventListener('keydown', aoTeclar);
    document.getElementById('fechar-aviso-de-prazo').addEventListener('click', sair);
    caixa.addEventListener('mousedown', function (evento) {
      if (evento.target === caixa) sair();
    });
    var botoes = caixa.querySelectorAll('[data-trabalhar-do-aviso]');
    for (var i = 0; i < botoes.length; i++) {
      botoes[i].addEventListener('click', function () {
        var idDoCaso = this.getAttribute('data-trabalhar-do-aviso');
        sair();
        CasoEmModal.abrir(canalEscolhido, idDoCaso, carregar);
      });
    }
    document.getElementById('fechar-aviso-de-prazo').focus();
  }

  /**
   * A busca achou mais casos do que o painel lê de uma vez (Etapa 69): vieram
   * os mais recentes. O aviso do período não serve — a busca não tem período.
   */
  function avisoDaBusca() {
    if (!resumo.truncada) return '';
    return '<p class="aviso-janela" role="status"><strong>A busca achou mais casos do que '
      + 'o painel lê de uma vez</strong>: estes números e esta fila são dos mais recentes. '
      + 'Escreva um texto mais específico, ou use Buscar Caso para o histórico inteiro.</p>';
  }

  function desenharPainel() {
    // O aviso mora no ALTO, e não junto da fila, porque não é só a fila que
    // está parcial: os cartões contam o mesmo recorte. O texto antigo, colado
    // na fila, dava a entender que os números em cima estavam completos.
    elemento('painel').innerHTML =
      (resumo.buscaNaPlanilhaToda ? avisoDaBusca() : Moldura.avisoDeJanela(resumo, 'Estes números e esta fila'))
      + desenharCartoes() + desenharFiltros() + desenharFila();
    // Os números das abas vêm na mesma resposta (Etapa 84).
    if (resumo.subAbas) {
      subAbasConhecidas[canalEscolhido] = resumo.subAbas;
      desenharAbas();
    }
    ligarPainel();
    var busca = elemento('busca-na-fila');
    if (focarABusca && busca) {
      busca.focus();
      busca.setSelectionRange(busca.value.length, busca.value.length);
    }
    focarABusca = false;
    // O "Mostrar" redesenha a fila; o foco volta para o botão escolhido.
    var mostrar = focarNoMostrar
      && document.querySelector('[data-mostrar="' + focarNoMostrar + '"]');
    if (mostrar) mostrar.focus();
    focarNoMostrar = '';
  }

  /* ---------------------------------------------------------- comportamento */

  // `recado` é o texto da espera ("Trazendo os 5000 casos…"). Só vale texto:
  // `carregar` também é passado como "depois de salvar" ao modal do caso, que
  // o chama com outra coisa.
  function carregar(recado) {
    var meuPedido = ++pedidoDoPainel;
    var painel = elemento('painel');
    if (painel) painel.innerHTML = '<p class="carregando-campos">'
      + escapar(typeof recado === 'string' ? recado : 'Somando os casos…') + '</p>';

    // O aviso de prazo lê os casos abertos da planilha toda (Etapa 70): só se
    // pede quando ele vai abrir, na primeira carga do canal.
    Servidor.chamar('resumoDoCanal', canalEscolhido, filtrosEscolhidos, null,
      quantosNaFila || '', avisarQuandoChegar, subAbaDoCanal(canalEscolhido))
      .entao(function (resposta) {
        if (meuPedido !== pedidoDoPainel) return;   // um pedido mais novo já saiu (F6)
        resumo = resposta;
        if (resposta.filaCompacta) {
          resumo.fila = expandirFila(resposta.fila, resposta.colunas);
          resumo.pertoDeVencer = expandirFila(resposta.pertoDeVencer, resposta.colunas);
        }
        desenharPainel();
        if (avisarQuandoChegar) {
          avisarQuandoChegar = false;
          jaAvisouNoCanal[canalEscolhido] = true;
          avisarDosQueVencem();
        }
      })
      .senao(function (erro) {
        if (meuPedido !== pedidoDoPainel) return;
        elemento('painel').innerHTML = '<p class="carregando-campos erro-carga">'
          + escapar(erro.message || String(erro)) + '</p>';
      });
  }

  function ligarPainel() {
    FiltroMultiplo.ligar(elemento('painel'), resumo.filtrosDisponiveis, filtrosEscolhidos,
      function (chave, valores) {
        filtrosEscolhidos[chave] = valores;
        carregar();
      });
    var caixas = document.querySelectorAll('.filtro');
    for (var i = 0; i < caixas.length; i++) {
      caixas[i].addEventListener('change', function () {
        if (this.getAttribute('data-filtro') === 'busca') { buscar(this); return; }
        filtrosEscolhidos[this.getAttribute('data-filtro')] = this.value.trim();
        carregar();
      });
    }

    // O "x" do campo de busca apaga o texto sem disparar o `change` — sem
    // isto, a fila continuava filtrada pelo termo que a pessoa acabou de
    // apagar, até ela clicar fora. O evento `search` vem do "x" e do Enter.
    var campoDaBusca = elemento('busca-na-fila');
    if (campoDaBusca) {
      campoDaBusca.addEventListener('search', function () { buscar(this); });
    }

    // O estado inicial (Etapa 56): sem busca, sem cartão, sem filtro de lista.
    // O "Mostrar" e a sub-aba ficam: não são filtro.
    var limpar = elemento('limpar-filtros');
    if (limpar) {
      limpar.addEventListener('click', function () {
        filtrosEscolhidos = {};
        carregar();
      });
    }

    var cartoes = document.querySelectorAll('.indicador.clicavel');
    for (var c = 0; c < cartoes.length; c++) {
      cartoes[c].addEventListener('click', function () {
        var id = this.getAttribute('data-cartao-da-fila');
        // Clicar de novo no mesmo cartão — ou no "Total" — desliga o filtro.
        filtrosEscolhidos.cartao = (this.getAttribute('data-cartao-total') === 'sim'
          || String(filtrosEscolhidos.cartao || '') === id) ? '' : id;
        carregar();
      });
    }

    // O "Mostrar": até 100 só redesenha, sem ir ao servidor — os 100 mais
    // recentes já vieram. "Todos" com mais casos do que vieram busca o resto.
    ligarCliques('[data-mostrar]', function (botao) {
      var escolha = botao.getAttribute('data-mostrar');
      quantosNaFila = escolha === 'todos' ? 'todos' : Number(escolha);
      focarNoMostrar = escolha;
      // Faltam casos na tela (o "Todos", ou — numa aba grande, Etapa 84 — o 50 e
      // o 100): o servidor traz o resto.
      var querMais = escolha === 'todos' || Number(escolha) > resumo.fila.length;
      if (querMais && resumo.fila.length < totalDaFila()) {
        carregar('Trazendo os ' + (escolha === 'todos' ? totalDaFila()
          : Math.min(Number(escolha), totalDaFila())) + ' casos…');
        return;
      }
      desenharPainel();
    });

    ligarCliques('[data-trabalhar]', function (botao) {
      CasoEmModal.abrir(canalEscolhido, botao.getAttribute('data-trabalhar'), carregar);
    });
    ligarCliques('[data-status-do-caso]', function (botao) {
      CasoEmModal.trocarSituacao(canalEscolhido,
        botao.getAttribute('data-status-do-caso'), carregar);
    });
    ligarCliques('[data-excluir]', function (botao) {
      var idDoCaso = botao.getAttribute('data-excluir');
      Formulario.confirmarExclusao(idDoCaso, function () {
        Servidor.chamar('excluirCaso', canalEscolhido, idDoCaso)
          .entao(carregar)
          .senao(function (erro) { Moldura.toast(erro.message || String(erro), 'ruim'); });
      });
    });
  }

  /**
   * Aplica o termo digitado. O Enter dispara dois eventos (`change` e
   * `search`); o termo igual ao que já está valendo não vai ao servidor de
   * novo.
   */
  function buscar(campo) {
    var termo = campo.value.trim();
    if (termo === (filtrosEscolhidos.busca || '')) return;
    filtrosEscolhidos.busca = termo;
    // A busca redesenha a caixa inteira; o cursor volta para ela, para a
    // pessoa poder corrigir o termo sem clicar de novo.
    focarABusca = true;
    carregar();
  }

  function ligarCliques(seletor, oQueFazer) {
    var botoes = document.querySelectorAll(seletor);
    for (var i = 0; i < botoes.length; i++) {
      botoes[i].addEventListener('click', function () { oQueFazer(this); });
    }
  }

  function ligar() {
    SeletorDeCanal.ligar(function (idDoCanal) {
      canalEscolhido = idDoCanal;
      filtrosEscolhidos = {};
      Aplicacao.remontar();
    });
    desenharAbas();
    if (abaDaMesa === 'reunioes') { carregarAgenda(); return; }
    // A primeira carga do canal traz o aviso dos que vencem; as seguintes
    // (filtro, gravação, período) não.
    avisarQuandoChegar = !jaAvisouNoCanal[canalEscolhido];
    carregar();
  }

  // `opcoesDeMostrar` sai para o teste: é a regra do PO, "caso tenha a
  // quantidade", e vale conferir sem desenhar a tela. `casosPertoDeVencer` e
  // `rotuloDoCaso` também: decidem o que entra no aviso e como o caso aparece.
  return { montar: montar, ligar: ligar, opcoesDeMostrar: opcoesDeMostrar,
    casosPertoDeVencer: casosPertoDeVencer, rotuloDoCaso: rotuloDoCaso,
    expandirFila: expandirFila };
})();
</script>
