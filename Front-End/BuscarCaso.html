<script>
/* ============================================================================
   PGO — BuscarCaso.html · achar um caso que a fila não mostra mais
   ============================================================================
   O Trabalho mostra os últimos 30 dias, de propósito. Quando o cliente liga
   citando um protocolo de abril, é aqui que se procura.

   A tela é uma caixa de busca e nada mais até alguém procurar algo. Não
   carrega lista, não pré-carrega base: abrir esta tela não custa nada, e é
   por isso que dá para deixá-la aberta o dia inteiro.

   O resultado vem separado POR ORIGEM — cada canal, e a base legada — porque
   um caso da Mesa Diamante e uma linha do sistema antigo não são a mesma
   coisa e não devem aparecer misturados numa lista só.
   ============================================================================ */

var TelaBuscarCaso = (function () {

  var opcoes = null;
  var canaisEscolhidas = {};     // id → true
  var incluirLegado = false;
  var procurando = false;
  var ultimoTermo = '';
  var podeEditar = false;        // vem com a resposta da busca
  // O termo que veio da busca da barra superior, para a tela já abrir
  // procurando. Vale uma vez: é usado e esquecido.
  var termoPedido = '';

  function escapar(texto) { return Moldura.escapar(texto); }
  function elemento(id) { return document.getElementById(id); }

  /* --------------------------------------------------------------- montar */

  function montar() {
    return '<div class="cartao busca-caixa">'
      + '<form id="form-da-busca" novalidate>'
      + '<div class="busca-linha">'
      + '<input type="search" id="termo-da-busca" autocomplete="off"'
      + ' placeholder="Protocolo, apólice, proposta, CPF ou nome"'
      + ' aria-label="O que procurar">'
      + '<button type="submit" class="botao" id="botao-buscar">'
      + Moldura.icone('buscarCaso') + ' Buscar</button>'
      + '</div>'
      + '<div id="onde-procurar" class="busca-onde"></div>'
      + '</form></div>'
      + '<div id="resultado-da-busca"></div>';
  }

  function desenharOnde() {
    var caixas = opcoes.canais.map(function (canal) {
      return '<label class="config-chave">'
        + '<input type="checkbox" data-canal-da-busca="' + escapar(canal.id) + '"'
        + (canaisEscolhidas[canal.id] ? ' checked' : '') + '>'
        + '<span>' + escapar(canal.nome)
        + '<em>procura em: ' + escapar(canal.procuraEm.join(', ') || 'nada declarado')
        + '</em></span></label>';
    });

    if (opcoes.legado.ligado) {
      caixas.push('<label class="config-chave">'
        + '<input type="checkbox" id="incluir-legado"'
        + (incluirLegado ? ' checked' : '') + '>'
        + '<span>' + escapar(opcoes.legado.rotulo)
        + '<em>a planilha do sistema anterior, em leitura</em></span></label>');
    }

    elemento('onde-procurar').innerHTML = '<span class="busca-rotulo">'
      + 'Onde procurar</span>' + caixas.join('')
      + (opcoes.legado.ligado ? ''
        : '<span class="busca-dica">Não há base legada apontada. '
          + 'Um administrador aponta em Configurações → Estrutura.</span>');

    ligarOnde();
  }

  function ligarOnde() {
    var caixas = document.querySelectorAll('[data-canal-da-busca]');
    for (var i = 0; i < caixas.length; i++) {
      caixas[i].addEventListener('change', function () {
        canaisEscolhidas[this.getAttribute('data-canal-da-busca')] = this.checked;
      });
    }
    var legado = elemento('incluir-legado');
    if (legado) {
      legado.addEventListener('change', function () { incluirLegado = this.checked; });
    }
  }

  /* -------------------------------------------------------------- procurar */

  function procurar() {
    if (procurando) return;
    var termo = elemento('termo-da-busca').value.trim();
    ultimoTermo = termo;

    var onde = [];
    Object.keys(canaisEscolhidas).forEach(function (id) {
      if (canaisEscolhidas[id]) onde.push(id);
    });

    procurando = true;
    elemento('botao-buscar').disabled = true;
    elemento('resultado-da-busca').innerHTML =
      '<p class="carregando-campos">Procurando…</p>';

    Servidor.chamar('buscarCasos', termo, onde, incluirLegado)
      .entao(function (resposta) {
        procurando = false;
        elemento('botao-buscar').disabled = false;
        desenharResultado(resposta);
      })
      .senao(function (erro) {
        procurando = false;
        elemento('botao-buscar').disabled = false;
        elemento('resultado-da-busca').innerHTML =
          '<div class="cartao vazio"><strong>'
          + escapar(erro.message || String(erro)) + '</strong></div>';
      });
  }

  function desenharResultado(resposta) {
    if (!resposta.total) {
      elemento('resultado-da-busca').innerHTML = '<div class="cartao vazio">'
        + '<strong>Nada encontrado para "' + escapar(resposta.termo) + '".</strong>'
        + '<p>Procurei em: ' + escapar(resposta.origens.map(function (origem) {
          return origem.nome;
        }).join(', ')) + '. A comparação ignora pontos e traços, então '
        + '<code>123.456.789-01</code> e <code>12345678901</code> acham a mesma '
        + 'coisa. Se o caso é antigo e não está aqui, ele pode estar na base '
        + 'legada — marque-a acima.</p>'
        + avisosDe(resposta.origens) + '</div>';
      return;
    }

    podeEditar = resposta.podeEditar === true;
    elemento('resultado-da-busca').innerHTML =
      '<p class="busca-contagem">' + resposta.total + ' caso(s) para "'
      + escapar(resposta.termo) + '"</p>'
      + resposta.origens.map(desenharOrigem).join('');
    ligarResultado();
  }

  function avisosDe(origens) {
    return origens.filter(function (origem) { return origem.aviso; })
      .map(function (origem) {
        return '<p class="aviso-fila">' + escapar(origem.nome) + ': '
          + escapar(origem.aviso) + '</p>';
      }).join('');
  }

  function desenharOrigem(origem) {
    var cabeca = '<header class="origem-cabeca">'
      + (origem.icone ? SeletorDeCanal.icone(origem.icone) : '')
      + '<h3>' + escapar(origem.nome) + '</h3>'
      + '<span class="quantos">' + origem.casos.length + '</span>'
      + (origem.somenteLeitura
        ? '<span class="etiqueta-leitura">só leitura</span>' : '')
      + '</header>';

    if (!origem.casos.length) {
      return '<section class="cartao origem vazia">' + cabeca
        + '<p>' + (origem.aviso
          ? escapar(origem.aviso)
          : 'Nada encontrado aqui.') + '</p></section>';
    }

    return '<section class="cartao sem-forro origem">' + cabeca
      + (origem.aviso
        ? '<p class="aviso-fila">' + escapar(origem.aviso) + '</p>' : '')
      + (origem.tipo === 'legado'
        ? tabelaDoLegado(origem) : tabelaDoCanal(origem))
      + '</section>';
  }

  function tabelaDoCanal(origem) {
    var cabecalho = origem.colunas.map(function (grupo) {
      return '<th>' + escapar(grupo.titulo) + '</th>';
    }).join('') + '<th class="acoes-coluna">Ações</th>';

    var linhas = origem.casos.map(function (caso) {
      var celulas = caso.celulas.map(function (grupo, i) {
        return '<td>' + grupo.map(function (celula, j) {
          if (celula.ehStatus) {
            return '<span class="situacao tom-' + escapar(caso.tom || 'neutro')
              + '">' + escapar(celula.valor || '—') + '</span>';
          }
          var classe = (j === 0 && i !== 0) ? 'principal' : 'apoio';
          // Passar o cursor mostra o texto inteiro — o que é cortado com "…".
          return '<span class="' + classe + '" title="'
            + escapar(Moldura.dicaDaCelula(celula)) + '">'
            + escapar(celula.valor || '—') + '</span>';
        }).join('') + '</td>';
      }).join('');

      return '<tr>' + celulas + '<td class="acoes-coluna">'
        + acoesDoAchado(caso, origem) + '</td></tr>';
    }).join('');

    return '<div class="rolagem-tabela"><table class="fila agrupada">'
      + '<thead><tr>' + cabecalho + '</tr></thead>'
      + '<tbody>' + linhas + '</tbody></table></div>';
  }

  /**
   * A tabela do legado é outra coisa: não temos contrato sobre aquela
   * planilha, então mostramos as colunas que ela tiver, com os nomes que ela
   * usa. E sem botão de abrir — uma linha de histórico não é um caso do
   * sistema, e prometer edição ali seria mentira.
   */
  function tabelaDoLegado(origem) {
    var cabecalho = origem.cabecalhos.map(function (nome) {
      return '<th>' + escapar(nome) + '</th>';
    }).join('');

    var linhas = origem.casos.map(function (caso) {
      return '<tr>' + caso.celulas[0].map(function (celula) {
        return '<td>' + escapar(celula.valor || '—') + '</td>';
      }).join('') + '</tr>';
    }).join('');

    return '<p class="aviso-fila">Estas linhas vêm da planilha do sistema '
      + 'anterior, como ela está. Elas não abrem nem se editam por aqui.</p>'
      + '<div class="rolagem-tabela"><table class="fila legado">'
      + '<thead><tr>' + cabecalho + '</tr></thead>'
      + '<tbody>' + linhas + '</tbody></table></div>';
  }

  /**
   * As MESMAS três ações da fila do Trabalho, na mesma ordem: quem acha um
   * caso aqui quer fazer com ele o que faria lá, e aprender duas telas para o
   * mesmo caso é uma a mais do que o necessário. Ver `acoesDaLinha`, no
   * Trabalho.
   */
  function acoesDoAchado(caso, origem) {
    var ids = '="' + escapar(caso.id) + '" data-canal="' + escapar(origem.id) + '"';
    return (podeEditar
      ? '<button type="button" class="acao" data-achado' + ids + '>'
        + Moldura.icone('editar') + ' Trabalhar no caso</button>'
        + '<button type="button" class="acao-icone" data-status-do-achado' + ids
        + ' title="Alterar status" aria-label="Alterar status">'
        + Moldura.icone('trocarSituacao') + '</button>'
      : '')
      + '<button type="button" class="acao-icone perigo" data-excluir-achado' + ids
      + ' title="Excluir caso" aria-label="Excluir caso">'
      + Moldura.icone('ocultar') + '</button>';
  }

  function ligarResultado() {
    // Mexeu no caso, a busca roda de novo: o resultado mostra o que ficou.
    function procurarDeNovo() { if (ultimoTermo) procurar(); }

    cliques('[data-achado]', function (canal, caso) {
      CasoEmModal.abrir(canal, caso, procurarDeNovo);
    }, 'data-achado');
    cliques('[data-status-do-achado]', function (canal, caso) {
      CasoEmModal.trocarSituacao(canal, caso, procurarDeNovo);
    }, 'data-status-do-achado');
    cliques('[data-excluir-achado]', function (canal, caso) {
      Formulario.confirmarExclusao(caso, function () {
        Servidor.chamar('excluirCaso', canal, caso)
          .entao(procurarDeNovo)
          .senao(function (erro) { window.alert(erro.message || String(erro)); });
      });
    }, 'data-excluir-achado');
  }

  function cliques(seletor, oQueFazer, atributoDoCaso) {
    var botoes = document.querySelectorAll(seletor);
    for (var i = 0; i < botoes.length; i++) {
      botoes[i].addEventListener('click', function () {
        oQueFazer(this.getAttribute('data-canal'), this.getAttribute(atributoDoCaso));
      });
    }
  }

  /* ---------------------------------------------------------------- ligar */

  function ligar() {
    elemento('form-da-busca').addEventListener('submit', function (evento) {
      evento.preventDefault();
      procurar();
    });

    Servidor.chamar('opcoesDaBusca')
      .entao(function (resposta) {
        opcoes = resposta;
        // Todas os canais marcadas por padrão: quem procura um protocolo
        // raramente sabe de antemão em qual canal ele está.
        opcoes.canais.forEach(function (canal) { canaisEscolhidas[canal.id] = true; });
        desenharOnde();
        elemento('termo-da-busca').focus();
        if (termoPedido) {
          elemento('termo-da-busca').value = termoPedido;
          termoPedido = '';
          procurar();
        }
      })
      .senao(function (erro) {
        elemento('onde-procurar').innerHTML =
          '<span class="busca-dica erro-carga">'
          + escapar(erro.message || String(erro)) + '</span>';
      });
  }

  /** Chamado pela busca da barra superior, antes de abrir esta tela. */
  function procurarPor(termo) { termoPedido = String(termo || '').trim(); }

  return { montar: montar, ligar: ligar, procurarPor: procurarPor };
})();
</script>
