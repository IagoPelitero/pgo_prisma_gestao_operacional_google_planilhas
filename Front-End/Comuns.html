    // gravação está a caminho — nem o X, nem o "Fechar".
    Formulario.comecouAGravar(elemento('modal-salvar'), elemento('modal-do-caso'));

    Servidor.chamar('editarCaso', canalAtual, idAtual, Formulario.valores(corpo))
      .entao(function () {
        salvando = false;
        mudouAlgo = true;
        /*
          O MODAL FECHA depois de gravar.

          Pedido do PO: "depois de salvar o ajuste precisa fechar o modal
          senão fica ruim seguir trabalhando". `fechar` avisa o Trabalho,
          porque `mudouAlgo` está marcado: a fila volta já com o que acabou de
          ser gravado.
        */
        destravarOsBotoes();
        fechar();
      })
      .senao(function (erro) {
        salvando = false;
        destravarOsBotoes();
        recado(erro.message || String(erro), 'ruim');
        if (erro.problemas) Formulario.mostrarProblemas(corpo, erro.problemas);
      });
  }

  /**
   * Devolve os botões do modal ao normal.
   *
   * Nos dois caminhos — gravou e deu erro —, e por isso num lugar só: a
   * primeira versão destravava em dois lugares, e bastaria esquecer um para o
   * modal ficar com tudo apagado depois de um erro.
   */
  function destravarOsBotoes() {
    Formulario.acabouDeGravar(elemento('modal-salvar'), elemento('modal-do-caso'));
  }

  /* ================================================== alterar o status */

  var abrindoOStatus = false;

  /**
   * O diálogo de alterar o status, que é o gesto mais frequente da operação.
   *
   * Mora na FILA, ao lado de "Trabalhar no caso", desde que o PO trocou o
   * lápis por ele: é o caminho curto que não depende do formulário inteiro.
   * O formulário confere todos os campos ao salvar; este diálogo mexe só no
   * status, e por isso funciona mesmo num caso que veio da base antiga com a
   * proposta ou a apólice pela metade.
   */
  function trocarSituacao(idDoCanal, idDoCaso, quandoMudar) {
    // Um clique enquanto o primeiro ainda busca as opções não abre dois
    // diálogos um em cima do outro.
    if (abrindoOStatus || elemento('dialogo-situacao')) return;
    abrindoOStatus = true;

    Servidor.chamar('situacoesParaTrocar', idDoCanal, idDoCaso)
      .entao(function (resposta) {
        abrindoOStatus = false;
        var caixa = document.createElement('div');
        caixa.className = 'dialogo';
        caixa.id = 'dialogo-situacao';
        caixa.innerHTML = '<div class="dialogo-caixa" role="dialog"'
          + ' aria-modal="true" aria-labelledby="titulo-situacao">'
          + '<h3 id="titulo-situacao">Alterar status</h3>'
          + '<p>Caso ' + escapar(idDoCaso) + '</p>'
          + '<form id="form-situacao">'
          + '<label class="config-campo"><span>Status</span>'
          + '<select id="situacao-nova">'
          + resposta.opcoes.map(function (opcao) {
            return '<option value="' + escapar(opcao.valor) + '"'
              + (opcao.valor === resposta.atual ? ' selected' : '') + '>'
              + escapar(opcao.rotulo) + '</option>';
          }).join('')
          + '</select></label>'
          + '<p class="dialogo-erro" id="erro-situacao" hidden></p>'
          + '<div class="config-acoes">'
          + '<button type="submit" class="botao" id="salvar-situacao">Salvar</button>'
          + '<button type="button" class="botao vazado" id="cancelar-situacao">'
          + 'Cancelar</button></div></form></div>';
        document.body.appendChild(caixa);

        var gravando = false;
        function sair() {
          if (gravando) return;
          if (caixa.parentNode) caixa.parentNode.removeChild(caixa);
          document.removeEventListener('keydown', aoTeclarNoStatus);
        }
        function aoTeclarNoStatus(evento) {
          if (evento.key === 'Escape') { evento.preventDefault(); sair(); }
        }
        document.addEventListener('keydown', aoTeclarNoStatus);
        elemento('cancelar-situacao').addEventListener('click', sair);
        caixa.addEventListener('mousedown', function (evento) {
          if (evento.target === caixa) sair();
        });
        elemento('situacao-nova').focus();

        elemento('form-situacao').addEventListener('submit', function (evento) {
          evento.preventDefault();
          if (gravando) return;
          gravando = true;
          // Os três pontinhos, e nada clicável até a resposta: dois cliques
          // gravariam duas mudanças, e o contador de mudanças contaria duas.
          Formulario.comecouAGravar(elemento('salvar-situacao'), caixa);
          Servidor.chamar('alterarSituacaoDoCaso', idDoCanal, idDoCaso,
            elemento('situacao-nova').value)
            .entao(function () {
              gravando = false;
              sair();
              if (quandoMudar) quandoMudar();
            })
            .senao(function (erro) {
              gravando = false;
              Formulario.acabouDeGravar(elemento('salvar-situacao'), caixa);
              var aviso = elemento('erro-situacao');
              aviso.textContent = erro.message || String(erro);
              aviso.hidden = false;
            });
        });
      })
      .senao(function (erro) {
        abrindoOStatus = false;
        window.alert(erro.message || String(erro));
      });
  }

  return { abrir: abrir, fechar: fechar, trocarSituacao: trocarSituacao };
})();
</script>

<script>
/* ============================================================================
   PGO — Graficos.html · os desenhos, num lugar só
   ============================================================================
   Duas telas desenham gráficos: a Produtividade RECC e Minha Performance. Elas
   não têm duas cópias disto — pela mesma razão que já custou caro aqui:
   regra copiada em dois lugares é regra que um dia diverge, e num gráfico a
   divergência não dá erro. Vira uma barra um pouco mais alta do que devia, e
   alguém decide alguma coisa com base nela.

   SVG escrito à mão, sem biblioteca de fora: o Apps Script serve a página num
   quadro isolado, e cada dependência externa é mais um ponto que pode não
   carregar. Gráfico que não carrega é pior que gráfico nenhum — deixa um
   buraco na tela.

   TRÊS REGRAS DE LEITURA, e todas têm motivo:

     UM EIXO SÓ. "Barras com linha" não são duas escalas. A linha é a média
     móvel da própria barra, na mesma altura: ela mostra a tendência por cima
     do ruído do dia a dia. Dois eixos fariam a mesma altura significar duas
     coisas — é o erro de gráfico mais comum que existe.

     COR PARA IDENTIDADE, TOM ÚNICO PARA MAGNITUDE. A pizza responde "de que
     tipo são" e usa cores; as barras respondem "quanto de cada" e usam um tom
     só. Seis cores para dizer "quanto" enterra a informação.

     O NÚMERO SEMPRE VISÍVEL. Todo desenho traz rótulo direto, e quem chama
     oferece a tabela por baixo. Cor é a segunda leitura, nunca a única — nem
     todo mundo enxerga cor, e nenhuma tela de trabalho pode depender disso.

   O QUE ENTRA: um "componente" no formato que o servidor devolve —
   { titulo, tipo, largura, unidade, agregacao, pontos:[{chave, rotulo, valor,
   casos, tom, serie, ehOutros}], tendencia }.
   ============================================================================ */

var Graficos = (function () {

  function escapar(texto) { return Moldura.escapar(texto); }

  function numero(valor, unidade) {
    if (unidade === 'dinheiro') {
      return 'R$ ' + (Math.round(valor * 100) / 100)
        .toFixed(2).replace('.', ',').replace(/\B(?=(\d{3})+(?!\d))/g, '.');
    }
    var arredondado = Math.round(valor * 100) / 100;
    return String(arredondado).replace('.', ',');
  }

  function porcento(parte, todo) {
    if (!todo) return '0%';
    return Math.round((parte / todo) * 100) + '%';
  }

  /* --------------------------------------------------------------- montar */

  function classeDoPonto(ponto) {
    if (ponto.tom) return 'tom-' + ponto.tom;
    if (ponto.serie) return 'serie-' + ponto.serie;
    return 'serie-magnitude';
  }

  function dica(componente, ponto) {
    return escapar(ponto.rotulo) + ': '
      + escapar(numero(ponto.valor, componente.unidade))
      + (componente.agregacao === 'contagem' ? ' caso(s)'
        : ' · ' + ponto.casos + ' caso(s)');
  }

  /* -- pizza --------------------------------------------------------------- */

  /**
   * Rosca, e não pizza cheia: o buraco do meio recebe o total, que é o número
   * que a pessoa procura primeiro. Cada fatia tem um anel da cor do fundo em
   * volta, para duas fatias vizinhas nunca se fundirem numa só mancha.
   */
  function desenharPizza(componente) {
    var total = componente.pontos.reduce(function (soma, ponto) {
      return soma + ponto.valor;
    }, 0);
    if (!total) return '<p class="grafico-vazio">Tudo zerado no período.</p>';

    var centro = 92;
    var raio = 76;
    var buraco = 46;
    var anguloAtual = -Math.PI / 2;   // começa no topo

    var fatias = componente.pontos.map(function (ponto) {
      var fracao = ponto.valor / total;
      var angulo = fracao * Math.PI * 2;
      var caminho = arcoDaRosca(centro, centro, raio, buraco, anguloAtual,
        anguloAtual + angulo);
      anguloAtual += angulo;

      return '<path d="' + caminho + '" class="fatia ' + classeDoPonto(ponto) + '"'
        + ' data-ponto="' + escapar(ponto.chave) + '"'
        + ' data-dica="' + dica(componente, ponto) + '"'
        + ' tabindex="0" role="button"'
        + ' aria-label="' + dica(componente, ponto) + '"></path>';
    }).join('');

    var legenda = componente.pontos.map(function (ponto) {
      return '<button type="button" class="legenda-item" data-ponto="'
        + escapar(ponto.chave) + '">'
        + '<span class="marca ' + classeDoPonto(ponto) + '"></span>'
        + '<span class="nome">' + escapar(ponto.rotulo) + '</span>'
        + '<span class="valor">' + escapar(numero(ponto.valor, componente.unidade))
        + '<em>' + porcento(ponto.valor, total) + '</em></span></button>';
    }).join('');

    return '<div class="grafico-corpo pizza">'
      + '<svg viewBox="0 0 184 184" class="desenho" role="img"'
      + ' aria-label="' + escapar(componente.titulo) + '">'
      + fatias
      + '<text x="92" y="86" class="rosca-numero">' + total + '</text>'
      + '<text x="92" y="104" class="rosca-rotulo">no total</text>'
      + '</svg>'
      + '<div class="legenda">' + legenda + '</div></div>';
  }

  /** O caminho de uma fatia de rosca, em coordenadas de SVG. */
  function arcoDaRosca(cx, cy, raio, buraco, de, ate) {
    // Uma fatia que é o círculo inteiro não pode fechar em si mesma, ou o
    // navegador não desenha nada. Tiramos um fio de grau dela.
    if (ate - de >= Math.PI * 2) ate = de + Math.PI * 2 - 0.001;

    var grande = (ate - de) > Math.PI ? 1 : 0;
    var x1 = cx + raio * Math.cos(de), y1 = cy + raio * Math.sin(de);
    var x2 = cx + raio * Math.cos(ate), y2 = cy + raio * Math.sin(ate);
    var x3 = cx + buraco * Math.cos(ate), y3 = cy + buraco * Math.sin(ate);
    var x4 = cx + buraco * Math.cos(de), y4 = cy + buraco * Math.sin(de);

    return 'M ' + x1.toFixed(2) + ' ' + y1.toFixed(2)
      + ' A ' + raio + ' ' + raio + ' 0 ' + grande + ' 1 '
      + x2.toFixed(2) + ' ' + y2.toFixed(2)
      + ' L ' + x3.toFixed(2) + ' ' + y3.toFixed(2)
      + ' A ' + buraco + ' ' + buraco + ' 0 ' + grande + ' 0 '
      + x4.toFixed(2) + ' ' + y4.toFixed(2) + ' Z';
  }

  /* -- barras em pé -------------------------------------------------------- */

  function desenharBarras(componente) {
    var maior = maiorValor(componente.pontos);
    var largura = larguraDoDesenho(componente);
    var altura = 240;
    var pe = 46;          // espaço do rótulo embaixo
    var topo = 22;        // espaço do número em cima
    var faixa = largura / componente.pontos.length;
    var grossura = Math.min(faixa - 10, 64);

    var barras = componente.pontos.map(function (ponto, i) {
      var alto = maior ? (ponto.valor / maior) * (altura - pe - topo) : 0;
      var x = i * faixa + (faixa - grossura) / 2;
      var y = altura - pe - alto;

      return '<g class="barra ' + classeDoPonto(ponto) + '"'
        + ' data-ponto="' + escapar(ponto.chave) + '"'
        + ' data-dica="' + dica(componente, ponto) + '"'
        + ' tabindex="0" role="button"'
        + ' aria-label="' + dica(componente, ponto) + '">'
        + '<rect x="' + x.toFixed(1) + '" y="' + y.toFixed(1) + '"'
        + ' width="' + grossura.toFixed(1) + '" height="'
        + Math.max(alto, 2).toFixed(1) + '" rx="4"></rect>'
        + '<text x="' + (x + grossura / 2).toFixed(1) + '" y="'
        + (y - 7).toFixed(1) + '" class="valor-da-barra">'
        + escapar(numero(ponto.valor, componente.unidade)) + '</text>'
        + '<text x="' + (x + grossura / 2).toFixed(1) + '" y="'
        + (altura - pe + 18) + '" class="rotulo-da-barra">'
        + escapar(encurtar(ponto.rotulo, 14)) + '</text>'
        + '</g>';
    }).join('');

    return '<div class="grafico-corpo">'
      + '<svg viewBox="0 0 ' + largura + ' ' + altura + '" class="desenho"'
      + ' role="img" aria-label="' + escapar(componente.titulo) + '">'
      + '<line x1="0" y1="' + (altura - pe) + '" x2="' + largura + '" y2="'
      + (altura - pe) + '" class="regua"></line>'
      + barras + '</svg></div>';
  }

  /* -- barras deitadas ----------------------------------------------------- */

  /**
   * Deitadas porque o rótulo é comprido. Em pé, "Aumento do prêmio na
   * renovação" vira uma escadinha ilegível ou é cortado no meio.
   */
  function desenharBarrasDeitadas(componente) {
    var maior = maiorValor(componente.pontos);
    var largura = larguraDoDesenho(componente);
    var alturaDaLinha = 34;
    var altura = componente.pontos.length * alturaDaLinha + 8;
    var areaDoRotulo = componente.largura === 2 ? 240 : 152;
    var areaDoValor = 62;
    var comprimentoMaximo = largura - areaDoRotulo - areaDoValor;

    var barras = componente.pontos.map(function (ponto, i) {
      var comprimento = maior ? (ponto.valor / maior) * comprimentoMaximo : 0;
      var y = i * alturaDaLinha + 8;

      return '<g class="barra deitada ' + classeDoPonto(ponto) + '"'
        + ' data-ponto="' + escapar(ponto.chave) + '"'
        + ' data-dica="' + dica(componente, ponto) + '"'
        + ' tabindex="0" role="button"'
        + ' aria-label="' + dica(componente, ponto) + '">'
        + '<text x="' + (areaDoRotulo - 10) + '" y="' + (y + 14)
        + '" class="rotulo-deitado">'
        + escapar(encurtar(ponto.rotulo, componente.largura === 2 ? 38 : 22))
        + '</text>'
        + '<rect x="' + areaDoRotulo + '" y="' + y + '" width="'
        + Math.max(comprimento, 2).toFixed(1) + '" height="18" rx="4"></rect>'
        + '<text x="' + (areaDoRotulo + Math.max(comprimento, 2) + 8).toFixed(1)
        + '" y="' + (y + 14) + '" class="valor-deitado">'
        + escapar(numero(ponto.valor, componente.unidade)) + '</text>'
        + '</g>';
    }).join('');

    return '<div class="grafico-corpo">'
      + '<svg viewBox="0 0 ' + largura + ' ' + altura + '" class="desenho"'
      + ' role="img" aria-label="' + escapar(componente.titulo) + '">'
      + barras + '</svg></div>';
  }

  /* -- linha, e barras com linha ------------------------------------------- */

  function desenharLinha(componente, comBarras) {
    var pontos = componente.pontos;
    var maior = maiorValor(pontos);
    var largura = larguraDoDesenho(componente);
    var altura = componente.largura === 2 ? 300 : 240;
    var pe = 40;
    var topo = 20;
    var faixa = pontos.length > 1 ? largura / pontos.length : largura;

    function xDe(i) { return i * faixa + faixa / 2; }
    function yDe(valor) {
      return altura - pe - (maior ? (valor / maior) * (altura - pe - topo) : 0);
    }

    var barras = '';
    if (comBarras) {
      var grossura = Math.min(faixa - 6, 34);
      barras = pontos.map(function (ponto, i) {
        var y = yDe(ponto.valor);
        return '<rect class="barra-de-fundo" x="'
          + (xDe(i) - grossura / 2).toFixed(1) + '" y="' + y.toFixed(1)
          + '" width="' + grossura.toFixed(1) + '" height="'
          + Math.max(altura - pe - y, 2).toFixed(1) + '" rx="4"></rect>';
      }).join('');
    }

    var serie = comBarras ? componente.tendencia : pontos;
    var caminho = serie.map(function (ponto, i) {
      return (i ? 'L' : 'M') + xDe(i).toFixed(1) + ' ' + yDe(ponto.valor).toFixed(1);
    }).join(' ');

    // Só alguns rótulos no eixo: um por ponto vira uma parede de texto em 30
    // dias, e nenhum deles é lido.
    var deQuantosEm = Math.max(1, Math.ceil(pontos.length / 8));
    var ultimo = pontos.length - 1;
    // O último rótulo entra sempre — menos quando cairia em cima do vizinho
    // que já foi desenhado. Duas datas sobrepostas não são duas datas: são
    // um borrão que não se lê.
    var cabeOUltimo = (ultimo % deQuantosEm) === 0
      || (ultimo - (ultimo - (ultimo % deQuantosEm))) >= deQuantosEm / 2;
    var rotulos = pontos.map(function (ponto, i) {
      if (i % deQuantosEm !== 0 && !(i === ultimo && cabeOUltimo)) return '';
      return '<text x="' + xDe(i).toFixed(1) + '" y="' + (altura - pe + 18)
        + '" class="rotulo-da-barra">' + escapar(ponto.rotulo) + '</text>';
    }).join('');

    var marcas = pontos.map(function (ponto, i) {
      return '<g class="ponto-da-linha" data-ponto="' + escapar(ponto.chave) + '"'
        + ' data-dica="' + dica(componente, ponto) + '"'
        + ' tabindex="0" role="button"'
        + ' aria-label="' + dica(componente, ponto) + '">'
        // Alvo invisível e largo: acertar um círculo de 5px com o mouse é
        // uma tarefa, e ninguém deveria ter de mirar num gráfico.
        + '<rect class="alvo" x="' + (xDe(i) - faixa / 2).toFixed(1) + '" y="0"'
        + ' width="' + faixa.toFixed(1) + '" height="' + (altura - pe) + '"></rect>'
        + '<circle cx="' + xDe(i).toFixed(1) + '" cy="'
        + yDe(ponto.valor).toFixed(1) + '" r="5" class="marcador"></circle>'
        + '</g>';
    }).join('');

    return '<div class="grafico-corpo">'
      + '<svg viewBox="0 0 ' + largura + ' ' + altura + '" class="desenho"'
      + ' role="img" aria-label="' + escapar(componente.titulo) + '">'
      + '<line x1="0" y1="' + (altura - pe) + '" x2="' + largura + '" y2="'
      + (altura - pe) + '" class="regua"></line>'
      + barras
      + '<path d="' + caminho + '" class="linha-do-grafico"></path>'
      + marcas + rotulos + '</svg>'
      + (comBarras
        ? '<p class="grafico-legenda-linha">As barras são o dia; a linha é a '
          + '<strong>média dos 7 dias anteriores</strong>, na mesma escala — '
          + 'ela mostra a tendência por cima do sobe e desce do dia a dia.</p>'
        : '')
      + '</div>';
  }

  /**
   * A largura do desenho, em unidades do viewBox.
   *
   * O cartão largo recebe um desenho largo, e não o mesmo desenho esticado:
   * esticado, um gráfico de 480 por 240 num cartão de 1200px fica com 600px
   * de altura e letras do tamanho de um título. A proporção tem de nascer
   * certa, não ser corrigida depois.
   */
  function larguraDoDesenho(componente) {
    return componente.largura === 2 ? 960 : 480;
  }

  function maiorValor(pontos) {
    return pontos.reduce(function (maior, ponto) {
      return Math.max(maior, ponto.valor);
    }, 0);
  }

  function encurtar(texto, quantos) {
    var limpo = String(texto || '');
    return limpo.length > quantos ? limpo.substring(0, quantos - 1) + '…' : limpo;
  }

  /* --------------------------------------------------------- comportamento */

  /* --------------------------------------------------------- a porta única */

  /** O desenho de um componente, seja ele qual for. */
  function desenhar(componente) {
    if (componente.aviso) {
      return '<p class="grafico-aviso">' + escapar(componente.aviso) + '</p>';
    }
    if (!componente.pontos || !componente.pontos.length) {
      return '<p class="grafico-vazio">Nenhum caso no período para somar aqui.</p>';
    }
    if (componente.tipo === 'pizza') return desenharPizza(componente);
    if (componente.tipo === 'barrasDeitadas') return desenharBarrasDeitadas(componente);
    if (componente.tipo === 'linha') return desenharLinha(componente, false);
    if (componente.tipo === 'barrasComLinha') return desenharLinha(componente, true);
    return desenharBarras(componente);
  }

  /** A tabela de números — a leitura de reserva, sem cor nenhuma. */
  function tabela(componente) {
    return '<div class="rolagem-tabela"><table class="fila numeros">'
      + '<thead><tr><th>' + escapar(componente.dimensao || 'Item') + '</th>'
      + '<th class="direita">' + (componente.agregacao === 'contagem'
        ? 'Casos' : escapar(componente.medida || 'Valor')) + '</th>'
      + '<th class="direita">Casos</th></tr></thead><tbody>'
      + componente.pontos.map(function (ponto) {
        return '<tr><td>' + escapar(ponto.rotulo) + '</td>'
          + '<td class="direita">' + escapar(numero(ponto.valor, componente.unidade))
          + '</td><td class="direita">' + ponto.casos + '</td></tr>';
      }).join('')
      + '</tbody>' + rodapeComTotal(componente) + '</table></div>';
  }

  /**
   * A linha do TOTAL, no pé da tabela de números.
   *
   * Pedido do PO junto do gráfico de valor por situação: ele quer as partes e
   * quer o total. Vale para toda tabela, porque a pergunta "e no todo, quanto
   * é?" é a mesma em todas — e somar cinco linhas de cabeça é onde o erro
   * entra.
   *
   * MÉDIA NÃO TEM TOTAL, e por isso a guarda existe: somar médias dá um número
   * que não quer dizer nada — "média de 200 + média de 150 = 350" não é a
   * média de nada. Um número sem significado numa linha chamada "Total" é
   * pior que linha nenhuma, porque alguém vai usá-lo.
   */
  function rodapeComTotal(componente) {
    if (componente.agregacao === 'media') return '';
    if (!componente.pontos.length) return '';

    var total = componente.pontos.reduce(function (soma, ponto) {
      return soma + ponto.valor;
    }, 0);
    var casos = componente.pontos.reduce(function (soma, ponto) {
      return soma + ponto.casos;
    }, 0);

    return '<tfoot><tr><td><strong>Total</strong></td>'
      + '<td class="direita"><strong>'
      + escapar(numero(total, componente.unidade)) + '</strong></td>'
      + '<td class="direita"><strong>' + casos + '</strong></td></tr></tfoot>';
  }

  /**
   * A dica que segue o mouse. Uma só, reaproveitada por todos os gráficos da
   * página — uma por marca seriam centenas de elementos à toa.
   */
  function ligarDica(raiz) {
    var dicaNaTela = document.querySelector('.dica-do-grafico');
    if (!dicaNaTela) {
      dicaNaTela = document.createElement('div');
      dicaNaTela.className = 'dica-do-grafico';
      dicaNaTela.hidden = true;
      document.body.appendChild(dicaNaTela);
    }

    var comDica = (raiz || document).querySelectorAll('[data-dica]');
    for (var i = 0; i < comDica.length; i++) {
      comDica[i].addEventListener('mouseenter', function (evento) {
        dicaNaTela.innerHTML = this.getAttribute('data-dica');
        dicaNaTela.hidden = false;
        posicionarDica(dicaNaTela, evento);
      });
      comDica[i].addEventListener('mousemove', function (evento) {
        posicionarDica(dicaNaTela, evento);
      });
      comDica[i].addEventListener('mouseleave', function () {
        dicaNaTela.hidden = true;
      });
      // Pelo teclado também: a dica é informação, não enfeite de mouse.
      comDica[i].addEventListener('focus', function () {
        dicaNaTela.innerHTML = this.getAttribute('data-dica');
        dicaNaTela.hidden = false;
        var caixa = this.getBoundingClientRect();
        dicaNaTela.style.left = (caixa.left + caixa.width / 2) + 'px';
        dicaNaTela.style.top = (caixa.top - 10) + 'px';
      });
      comDica[i].addEventListener('blur', function () { dicaNaTela.hidden = true; });
    }
  }

  function posicionarDica(dicaNaTela, evento) {
    // Presa à janela, para nunca escapar pela borda numa tela estreita.
    var largura = dicaNaTela.offsetWidth || 160;
    var x = Math.min(Math.max(evento.clientX, largura / 2 + 8),
      window.innerWidth - largura / 2 - 8);
    dicaNaTela.style.left = x + 'px';
    dicaNaTela.style.top = (evento.clientY - 14) + 'px';
  }

  function tirarDica() {
    var dicaNaTela = document.querySelector('.dica-do-grafico');
    if (dicaNaTela) dicaNaTela.parentNode.removeChild(dicaNaTela);
  }

  return {
    desenhar: desenhar,
    tabela: tabela,
    numero: numero,
    porcento: porcento,
    classeDoPonto: classeDoPonto,
    encurtar: encurtar,
    ligarDica: ligarDica,
    tirarDica: tirarDica
  };
})();
</script>

<!-- ========================================================================
     PEÇA 7 de 7 · SeletorDePeriodo
     ======================================================================== -->

<script>
/* ============================================================================
   PGO — SeletorDePeriodo · as três maneiras de escolher o tempo
   ============================================================================
   TRÊS TELAS filtram por período — Trabalho, Minha Performance e Produtividade
   RECC — e as três oferecem as mesmas três maneiras:

     POR DIAS   "últimos 30 dias". É o do dia a dia, e é a abertura.
     POR DATA   duas datas, de/até. Responde uma pergunta específica.
     POR MÊS    "setembro de 2026". É como a operação REPORTA — e é diferente
                de "últimos 30 dias": no dia 20 de outubro, os últimos 30 dias
                pegam metade de setembro e metade de outubro.

   ESTÁ AQUI, E NÃO EM CADA TELA, pelo mesmo motivo do formulário: três cópias
   divergem no primeiro ajuste, e aí o mesmo "setembro" significa uma coisa
   numa tela e outra na vizinha — que é o jeito mais rápido de a operação parar
   de confiar nos dois números.

   QUEM CALCULA AS DATAS É O SERVIDOR. Esta peça só diz COMO a pessoa escolheu.
   Se ela calculasse, o dia que aparece na tela sairia do relógio do navegador
   de quem está olhando e o dia da conta sairia do relógio da planilha — e num
   fechamento de mês essa diferença é um dia inteiro de casos.
   ============================================================================ */

var SeletorDePeriodo = (function () {

  function escapar(texto) { return Moldura.escapar(texto); }

  /** O período de abertura: o atalho, com a janela que o servidor mandar. */
  function padrao() {
    return { tipo: 'dias', dias: 0, de: '', ate: '', mes: '' };
  }

  /**
   * Os controles, prontos para entrar na caixa de filtros.
   *
   * `resposta` é o que o servidor devolveu — ele traz o período resolvido e a
   * lista de meses. A primeira caixa escolhe QUAL maneira está valendo, e só
   * os controles dela ficam na tela: mostrar as três juntas deixaria três
   * períodos preenchidos e um só valendo, e ninguém olha isso e sabe qual é.
   */
  function desenhar(resposta) {
    var periodo = resposta.periodo || {};
    var tipo = periodo.tipo || 'dias';

    var comoEscolher = [['dias', 'Por dias'], ['intervalo', 'Por data'],
      ['mes', 'Por mês']].map(function (par) {
      return '<option value="' + par[0] + '"'
        + (tipo === par[0] ? ' selected' : '') + '>' + par[1] + '</option>';
    }).join('');

    return '<select class="filtro" data-periodo="como"'
      + ' aria-label="Como escolher o período">' + comoEscolher + '</select>'
      + (tipo === 'intervalo' ? deAte(periodo)
        : (tipo === 'mes' ? porMes(resposta) : porDias(periodo)));
  }

  function porDias(periodo) {
    var opcoes = [7, 15, 30, 60, 90, 180, 365].map(function (quantos) {
      return '<option value="' + quantos + '"'
        + (periodo.dias === quantos ? ' selected' : '') + '>'
        + 'Últimos ' + quantos + ' dias</option>';
    }).join('');

    return '<select class="filtro" data-periodo="dias" aria-label="Período">'
      + opcoes + '</select>';
  }

  /*
   * Campo de data do navegador (type="date"), e não texto com máscara: ele já
   * traz o calendário, já recusa 31/02 e já respeita o formato de quem está
   * olhando. O valor que ele guarda é sempre aaaa-mm-dd, que o servidor lê sem
   * ambiguidade — 03/04 é 3 de abril aqui e 4 de março em outros lugares, e
   * essa confusão não pode entrar num fechamento.
   */
  function deAte(periodo) {
    return '<input type="date" class="filtro" data-periodo="de"'
      + ' aria-label="Data inicial" value="' + escapar(paraOCampo(periodo.de)) + '">'
      + '<span class="ate-do-periodo">até</span>'
      + '<input type="date" class="filtro" data-periodo="ate"'
      + ' aria-label="Data final" value="' + escapar(paraOCampo(periodo.ate)) + '">';
  }

  function porMes(resposta) {
    var escolhido = (resposta.periodo || {}).mes;
    var opcoes = (resposta.mesesDisponiveis || []).map(function (mes) {
      return '<option value="' + escapar(mes.valor) + '"'
        + (escolhido === mes.valor ? ' selected' : '') + '>'
        + escapar(mes.rotulo) + '</option>';
    }).join('');

    return '<select class="filtro" data-periodo="mes" aria-label="Mês">'
      + opcoes + '</select>';
  }

  /**
   * Trata a mudança numa das caixas do período.
   *
   * Devolve o período NOVO quando a tela deve recarregar, `null` quando a
   * caixa não é do período, e `false` quando é do período mas ainda não está
   * pronta — o de/até com uma data só, que é o caso comum de quem acabou de
   * preencher a primeira.
   */
  function mudou(caixa, resposta, ondeProcurar) {
    var qual = caixa.getAttribute('data-periodo');
    if (!qual) return null;

    var periodo = resposta.periodo || {};

    if (qual === 'como') {
      var novo = { tipo: caixa.value, dias: periodo.dias, de: '', ate: '', mes: '' };
      if (novo.tipo === 'mes') {
        var meses = resposta.mesesDisponiveis || [];
        if (meses.length) novo.mes = meses[0].valor;   // o mês corrente
      }
      if (novo.tipo === 'intervalo') {
        // Abre já preenchido com o período que estava valendo, para a pessoa
        // ajustar uma ponta em vez de digitar as duas do zero.
        novo.de = periodo.de;
        novo.ate = periodo.ate;
      }
      return novo;
    }

    if (qual === 'dias') {
      return { tipo: 'dias', dias: Number(caixa.value), de: '', ate: '', mes: '' };
    }

    if (qual === 'mes') {
      return { tipo: 'mes', dias: 0, de: '', ate: '', mes: caixa.value };
    }

    // de/ATÉ: só recarrega com as DUAS datas. Recarregar na primeira mostraria
    // o resultado de um intervalo pela metade, que a pessoa leria como se
    // fosse a resposta — e ela vai preencher a segunda meio segundo depois.
    var raiz = document.getElementById(ondeProcurar) || document;
    var de = raiz.querySelector('[data-periodo="de"]');
    var ate = raiz.querySelector('[data-periodo="ate"]');
    var intervalo = {
      tipo: 'intervalo', dias: 0, mes: '',
      de: paraOServidor(de ? de.value : ''),
      ate: paraOServidor(ate ? ate.value : '')
    };
    return (intervalo.de && intervalo.ate) ? intervalo : false;
  }

  /** dd/mm/aaaa (como o servidor escreve) vira aaaa-mm-dd (como o campo lê). */
  function paraOCampo(texto) {
    var partes = String(texto || '').split('/');
    if (partes.length !== 3) return '';
    return partes[2] + '-' + partes[1] + '-' + partes[0];
  }

  /** aaaa-mm-dd (como o campo guarda) vira dd/mm/aaaa (como o servidor lê). */
  function paraOServidor(texto) {
    var partes = String(texto || '').split('-');
    if (partes.length !== 3) return '';
    return partes[2] + '/' + partes[1] + '/' + partes[0];
  }

  // `paraOCampo` e `paraOServidor` saem daqui porque QUALQUER tela com campo
  // de data precisa das duas: o servidor fala dd/mm/aaaa (que é como a
  // planilha guarda e como a operação lê) e o <input type="date"> só
  // entende aaaa-mm-dd. Uma segunda cópia divergiria na primeira correção.
  return {
    padrao: padrao, desenhar: desenhar, mudou: mudou,
    paraOCampo: paraOCampo, paraOServidor: paraOServidor
  };
})();
</script>
