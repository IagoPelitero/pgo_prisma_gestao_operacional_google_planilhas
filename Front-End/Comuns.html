<!-- ========================================================================
     PGO — Comuns.html · as peças que mais de uma tela usa
     ========================================================================
    Nenhuma destas é uma tela do menu. São as peças compartilhadas: a casca
    que aparece em todas, os dois diálogos que qualquer tela pode levantar,
    o formulário, o caso aberto por cima e os desenhos dos gráficos.

    Cada uma continua sendo um módulo fechado (var Nome = (function(){…})()),
    entao morar no mesmo arquivo não mistura o estado de nenhuma com o da
    outra — é exatamente o mesmo código, só que em um arquivo em vez de seis.

    O QUE TEM AQUI DENTRO, nesta ordem:

      1. Moldura
      2. SenhaDeAdministrador
      3. SeletorDeCanal
      4. Formulario
      5. CasoEmModal
      6. Graficos
      7. SeletorDePeriodo

    Procure pelo banner "PEÇA n de m" para pular de uma à outra.
     ======================================================================== -->

<!-- ========================================================================
     PEÇA 1 de 7 · Moldura
     Era o arquivo Front-End/Moldura.html antes de as peças
     compartilhadas serem agrupadas num arquivo só.
     ======================================================================== -->

<script>
/* ============================================================================
   RECC — Moldura.html · o menu lateral e a barra superior
   ============================================================================
   A moldura aparece em TODAS as telas e é a mesma em todas. Ela não é escrita
   à mão no HTML: é montada a partir do pacote de partida, porque o menu
   depende do nível de acesso de quem entrou. Menu fixo no HTML ficaria fora
   de sincronia com as permissões no primeiro dia.
   ============================================================================ */

var Moldura = (function () {

  /**
   * O desenho de cada item do menu.
   *
   * SVG escrito à mão, sem biblioteca de fora: o Apps Script serve a página
   * num quadro isolado, e cada dependência externa é mais um ponto que pode
   * não carregar — e um menu sem ícone nenhum é um menu quebrado.
   *
   * Todos partem da mesma grade de 24 por 24, com a mesma espessura de
   * traço. É o que faz sete desenhos diferentes parecerem um conjunto.
   */
  var DESENHOS = {
    // painel: quatro áreas iguais, como os cartões da tela
    trabalho:
      '<rect x="3.5" y="3.5" width="7" height="7" rx="1.6"></rect>'
      + '<rect x="13.5" y="3.5" width="7" height="7" rx="1.6"></rect>'
      + '<rect x="3.5" y="13.5" width="7" height="7" rx="1.6"></rect>'
      + '<rect x="13.5" y="13.5" width="7" height="7" rx="1.6"></rect>',

    // recarregar: um arco de QUASE uma volta, com a ponta de seta no fim.
    // Quase, e não a volta inteira: círculo fechado não tem começo nem fim, e
    // deixa de dizer "de novo".
    recarregar:
      '<path d="M20.4 12a8.4 8.4 0 1 1-2.46-5.94"></path>'
      + '<path d="M20.4 4.4v5.6h-5.6"></path>',

    // registrar: o mais, sem moldura. Acrescentar é o gesto mais simples do
    // sistema, e o desenho mais simples é o que se reconhece de relance.
    cadastrarCaso:
      '<path d="M12 4.6v14.8M4.6 12h14.8"></path>',

    // desempenho: a linha de pulso, que sobe e desce como o dia da operação
    minhaPerformance:
      '<path d="M3.2 12.4h3.6l2.4-7 4 14.2 2.6-7.2h5"></path>',

    // buscar: a lupa
    buscarCaso:
      '<circle cx="10.8" cy="10.8" r="6.4"></circle>'
      + '<path d="M15.5 15.5 20.4 20.4"></path>',

    // corretoras: o prédio, com as janelas e a porta
    tabelaCorretoras:
      '<path d="M4.4 20.6V4.9a1.5 1.5 0 0 1 1.5-1.5h6.8a1.5 1.5 0 0 1 1.5 1.5v15.7"></path>'
      + '<path d="M14.2 10.4h4a1.5 1.5 0 0 1 1.5 1.5v8.7"></path>'
      + '<path d="M2.9 20.6h18.2"></path>'
      + '<path d="M7.4 7.4h1.3M11 7.4h1.3M7.4 11.2h1.3M11 11.2h1.3"></path>'
      + '<path d="M9.2 20.6v-4.2h1.6v4.2"></path>',

    // análise: as barras em pé, sobre a régua
    // Importação: uma caixa despejando linhas para dentro de uma bandeja. A
    // ideia é "uma base inteira entrando de uma vez", que é o que a tela faz —
    // e não um "mais", que já é o Cadastrar Caso.
    importacao:
      '<path d="M3.4 13.6h4.2l1.4 2.6h6l1.4-2.6h4.2"></path>'
      + '<path d="M3.4 13.6 6 5.9a1.5 1.5 0 0 1 1.4-1h9.2a1.5 1.5 0 0 1 1.4 1l2.6 7.7'
      + 'v4.4a1.5 1.5 0 0 1-1.5 1.5H4.9a1.5 1.5 0 0 1-1.5-1.5z"></path>'
      + '<path d="M12 5.4v5.2M9.8 8.4 12 10.6l2.2-2.2"></path>',
    produtividade:
      '<path d="M3.6 20.4h16.8"></path>'
      + '<path d="M7.4 20.4v-6.2M12 20.4V6.8M16.6 20.4v-9.6"></path>',

    // configurações: a engrenagem — anel, dentes por fora e o eixo no meio.
    // Os dentes ENCOSTAM no anel: afastados, o desenho vira um sol.
    configuracoes:
      '<circle cx="12" cy="12" r="7.1"></circle>'
      + '<circle cx="12" cy="12" r="2.9"></circle>'
      + '<path d="M12 2.6v2.3M12 19.1v2.3M2.6 12h2.3M19.1 12h2.3'
      + 'M5.3 5.3 6.9 6.9M17.1 17.1l1.6 1.6M18.7 5.3 17.1 6.9M6.9 17.1l-1.6 1.6"></path>',

    // --- os desenhos das SEÇÕES de Configurações --------------------------
    // Um por seção, na mesma grade e na mesma espessura dos outros. O menu de
    // Configurações é a única lista longa do sistema: sem ícone, oito linhas
    // de texto viram um bloco só, e a pessoa lê todas para achar uma.

    // campos do formulário: a etiqueta em cima, a caixa de digitar, a dica
    campos:
      '<path d="M4.2 6.2h7.6"></path>'
      + '<rect x="3.4" y="9.4" width="17.2" height="5.6" rx="1.6"></rect>'
      + '<path d="M4.2 18.6h11.4"></path>',

    // usuários: duas pessoas, a de trás pela metade
    usuarios:
      '<circle cx="9.4" cy="8.4" r="3.4"></circle>'
      + '<path d="M3.4 19.8a6 6 0 0 1 12 0"></path>'
      + '<path d="M16.2 5.4a3.4 3.4 0 0 1 0 6"></path>'
      + '<path d="M17.8 14.2a6 6 0 0 1 2.8 5.6"></path>',

    // níveis de acesso: o escudo com o visto — o que passa e o que não passa
    niveis:
      '<path d="M12 3.2 19.4 6v6.1c0 4.3-3 7.5-7.4 8.7-4.4-1.2-7.4-4.4-7.4-8.7V6z"></path>'
      + '<path d="m8.9 11.9 2.3 2.3L15.4 10"></path>',

    // listas: os marcadores e as linhas
    catalogo:
      '<circle cx="4.7" cy="6.6" r="1.1"></circle>'
      + '<circle cx="4.7" cy="12" r="1.1"></circle>'
      + '<circle cx="4.7" cy="17.4" r="1.1"></circle>'
      + '<path d="M9 6.6h11.3M9 12h11.3M9 17.4h11.3"></path>',

    // canais de trabalho: a bancada, com o tampo e as duas pernas
    canais:
      '<rect x="2.9" y="6.2" width="18.2" height="4.2" rx="1.4"></rect>'
      + '<path d="M5.9 10.4v7.4M18.1 10.4v7.4"></path>'
      + '<path d="M5.9 14.1h12.2"></path>',

    // identidade: a gota de tinta — nome, logo e cor são a aparência do PGO
    identidade:
      '<path d="M12 3.2c3.5 4.1 5.6 6.8 5.6 9.5a5.6 5.6 0 0 1-11.2 0c0-2.7 2.1-5.4 5.6-9.5z"></path>'
      + '<path d="M9.2 13.4a2.8 2.8 0 0 0 2.8 2.8"></path>',

    // painéis: o recorte da tela — a faixa de cima e a coluna da esquerda
    paineis:
      '<rect x="3.4" y="3.9" width="17.2" height="16.2" rx="2"></rect>'
      + '<path d="M3.4 9.1h17.2"></path>'
      + '<path d="M10.2 9.1v11"></path>',

    // análises: a tabela dinâmica — a grade com a faixa de cima destacada
    analises:
      '<rect x="3.4" y="4.4" width="17.2" height="15.2" rx="1.8"></rect>'
      + '<path d="M3.4 9.2h17.2"></path>'
      + '<path d="M3.4 14.4h17.2"></path>'
      + '<path d="M9.4 9.2v10.4M15 9.2v10.4"></path>',

    // calendário: a folhinha de parede, com os dois furos de cima e um dia
    // marcado. É o desenho que já significa "data" para qualquer pessoa — e
    // esta seção fala de dias: férias, feriados, dias úteis.
    // estrutura e auditoria: a prancheta do laudo, com o visto
    estrutura:
      '<path d="M9 4.4H7.4A1.6 1.6 0 0 0 5.8 6v13.2a1.6 1.6 0 0 0 1.6 1.6h9.2a1.6 1.6 0 0 0 1.6-1.6V6a1.6 1.6 0 0 0-1.6-1.6H15"></path>'
      + '<rect x="9" y="2.8" width="6" height="3.2" rx="1"></rect>'
      + '<path d="m9.2 13.2 2 2 3.8-3.8"></path>',

    // --- os desenhos das AÇÕES, na mesma grade e na mesma espessura -------

    // filtrar: o funil, que é o desenho que todo mundo já lê como filtro
    filtro:
      '<path d="M3.6 5.1h16.8l-6.5 7.7v5.6l-3.8 2.1v-7.7z"></path>',

    // ver: o olho
    olho:
      '<path d="M2.4 12S6.2 5.4 12 5.4 21.6 12 21.6 12 17.8 18.6 12 18.6 2.4 12 2.4 12z"></path>'
      + '<circle cx="12" cy="12" r="3.1"></circle>',

    // editar: o lápis
    editar:
      '<path d="M16.4 3.9a2 2 0 0 1 2.8 2.8L8.4 17.5l-3.9 1.1 1.1-3.9z"></path>'
      + '<path d="M14.7 5.6 18.4 9.3"></path>',

    // trocar situação: as duas setas em círculo
    trocarSituacao:
      '<path d="M20.4 11.2a8.4 8.4 0 0 0-14.3-4.6L3.6 9"></path>'
      + '<path d="M3.6 4.6V9h4.4"></path>'
      + '<path d="M3.6 12.8a8.4 8.4 0 0 0 14.3 4.6L20.4 15"></path>'
      + '<path d="M20.4 19.4V15H16"></path>',

    // ocultar: a lixeira, com a tampa
    ocultar:
      '<path d="M4.4 6.8h15.2"></path>'
      + '<path d="M9.2 6.8V5.2a1.4 1.4 0 0 1 1.4-1.4h2.8a1.4 1.4 0 0 1 1.4 1.4v1.6"></path>'
      + '<path d="M6.4 6.8v12.4a1.4 1.4 0 0 0 1.4 1.4h8.4a1.4 1.4 0 0 0 1.4-1.4V6.8"></path>'
      + '<path d="M10.2 10.6v6M13.8 10.6v6"></path>'
  };

  var TEMAS = [
    { chave: 'padrao', nome: 'Padrão — azul Porto Seguro' },
    { chave: 'rosa', nome: 'Rosa' },
    { chave: 'dark', nome: 'Escuro' },
    { chave: 'brasil', nome: 'Brasil' }
  ];

  /**
   * O desenho de um item do menu ou de uma ação.
   *
   * Nome desconhecido cai no painel, e não em nada: um botão sem ícone,
   * ao lado de outros com ícone, parece um botão quebrado.
   */
  function icone(tela) {
    var desenho = DESENHOS[tela] || DESENHOS.trabalho;
    // Traço fino: 1,7 deixava os desenhos pesados ao lado de texto normal.
    return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor"'
      + ' stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"'
      + ' aria-hidden="true">' + desenho + '</svg>';
  }

  /**
   * A dica de uma célula da fila: o nome da coluna e o valor INTEIRO.
   *
   * Pedido do PO: texto grande cortado com "…" na fila — o título do e-mail,
   * um nome longo — tem de poder ser lido passando o cursor por cima. A dica
   * é a do próprio navegador (`title`): aparece em qualquer tela, sem peça
   * nova, e some sozinha quando o cursor sai.
   *
   * Mora aqui porque três filas desenham células — o Trabalho, a Busca e o
   * detalhamento da Produtividade — e três cópias divergiriam no primeiro
   * ajuste. O alerta (o vermelho do VG) vem junto, com o motivo: cor sozinha
   * não diz por quê.
   */
  function dicaDaCelula(celula) {
    // "Código origem da proposta + número da proposta" é a junção da fila;
    // na dica, lê-se melhor com "e".
    var coluna = String(celula.cabecalho || '').split(' + ').join(' e ');
    var valor = String(celula.valor || '').trim();
    var dica = valor ? coluna + ': ' + valor : coluna;
    return celula.alerta ? dica + ' — ' + celula.alerta : dica;
  }

  /** As iniciais do nome, para o círculo da barra superior. */
  function iniciais(nome) {
    var partes = String(nome || '').trim().split(/\s+/);
    if (!partes[0]) return '?';
    if (partes.length === 1) return partes[0].substring(0, 2).toUpperCase();
    return (partes[0].charAt(0) + partes[partes.length - 1].charAt(0)).toUpperCase();
  }

  function escapar(texto) {
    return String(texto === null || texto === undefined ? '' : texto)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

  /** A marca do topo do menu: a logo de CONFIG, ou o nome quando não há logo. */
  function marca(identidade) {
    if (identidade.logo) {
      return '<img src="' + escapar(identidade.logo) + '" alt="'
        + escapar(identidade.operacao || identidade.nome) + '">';
    }
    // Sem logo, o nome vira a marca. As duas últimas letras ganham a cor de
    // destaque — é o mesmo tratamento do "PGO" dos desenhos da tela.
    var nome = String(identidade.nome || 'RECC');
    var corte = Math.max(nome.length - 2, 1);
    return '<span class="escrito">' + escapar(nome.substring(0, corte))
      + '<em>' + escapar(nome.substring(corte)) + '</em></span>';
  }

  function montarLateral(pacote, telaAtual) {
    var itens = pacote.menu.map(function (item) {
      var atual = item.tela === telaAtual ? ' aria-current="page"' : '';
      return '<li><button type="button" class="lateral-item"'
        + ' data-tela="' + escapar(item.tela) + '"' + atual + '>'
        + icone(item.tela)
        + '<span class="rotulo">' + escapar(item.titulo) + '</span>'
        + '</button></li>';
    }).join('');

    var rodape = '';
    if (pacote.identidade.plataforma || pacote.identidade.fabricante) {
      rodape = '<div class="lateral-pe">'
        + '<div>' + escapar(pacote.identidade.plataforma) + '</div>'
        + '<div class="fabricante">' + escapar(pacote.identidade.fabricante) + '</div>'
        + '</div>';
    }

    return '<div class="lateral-marca">'
      + marca(pacote.identidade)
      + '<button type="button" class="lateral-encolher" id="encolher"'
      + ' title="Encolher o menu" aria-label="Encolher o menu">'
      + '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"'
      + ' stroke-linecap="round" aria-hidden="true">'
      + '<path d="M4 7h16M4 12h16M4 17h16"></path></svg>'
      + '</button>'
      + '</div>'
      + '<ul class="lateral-itens">' + itens + '</ul>'
      + rodape;
  }

  /**
   * A barra superior.
   *
   * A ordem foi pedida assim, e cada peça responde a uma pergunta diferente:
   *   identidade        que sistema é este, de que operação
   *   busca             achar um caso sem sair de onde se está
   *   bolinhas          a cor da tela, escolha de quem usa
   *   último registro   a base está atualizada?
   *   pessoa            quem sou eu aqui dentro, e com que cargo
   *
   * O nome da TELA não fica aqui: ele fica no topo do conteúdo, junto do que
   * ele nomeia.
   */
  function montarSuperior(pacote) {
    var bolinhas = TEMAS.map(function (tema) {
      var marcado = tema.chave === pacote.tema ? 'true' : 'false';
      return '<button type="button" class="tema tema-' + tema.chave + '"'
        + ' data-tema="' + tema.chave + '" aria-pressed="' + marcado + '"'
        + ' title="' + escapar(tema.nome) + '"'
        + ' aria-label="Tema ' + escapar(tema.nome) + '"></button>';
    }).join('');

    return ''
      + '<button type="button" class="abrir-menu" id="abrir-menu" aria-label="Abrir o menu">'
      + '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"'
      + ' stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"></path></svg>'
      + '</button>'

      + '<div class="identidade">'
      + '<h1>' + escapar(pacote.identidade.nome)
      + (pacote.identidade.nomeLongo
        ? ' — ' + escapar(pacote.identidade.nomeLongo) : '')
      + '</h1>'
      + '<p>' + escapar(pacote.identidade.operacao) + '</p>'
      + '</div>'

      + '<div class="busca">'
      + '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"'
      + ' stroke-linecap="round"><circle cx="11" cy="11" r="7"></circle>'
      + '<path d="M20 20l-4.2-4.2"></path></svg>'
      + '<input type="search" id="busca-global" autocomplete="off"'
      + ' placeholder="Buscar por apólice, segurado ou protocolo…"'
      + ' aria-label="Busca geral">'
      + '<kbd>Ctrl K</kbd>'
      + '</div>'

      // Recarregar a TELA, não a página.
      //
      // Recarregar a página num aplicativo do Apps Script custa o doGet
      // inteiro outra vez: nova execução, novo login, a página de 320 KB
      // descendo de novo. Este botão refaz só a chamada da tela em que a
      // pessoa está — que é o que ela quer ao pensar "atualiza aí".
      //
      // Fica em TODAS as telas porque a pergunta "isto está atualizado?"
      // aparece em todas: a planilha é editável à mão, e outra pessoa pode
      // ter mexido enquanto esta olhava.
      + '<button type="button" class="recarregar" id="recarregar"'
      + ' title="Atualizar esta tela" aria-label="Atualizar esta tela">'
      + icone('recarregar') + '</button>'

      + '<div class="temas" role="group" aria-label="Cor do sistema">' + bolinhas + '</div>'

      + ultimoRegistro(pacote.ultimoRegistro)

      + '<div class="pessoa">'
      + '<div class="iniciais" aria-hidden="true">'
      + escapar(iniciais(pacote.usuario.nome)) + '</div>'
      + '<div class="quem"><strong>' + escapar(pacote.usuario.nome) + '</strong>'
      + '<span>' + escapar(descricaoDaPessoa(pacote.usuario)) + '</span>'
      + '</div></div>';
  }

  /** "Analista RET · Vida Individual" — o cargo, e o canal quando existe. */
  function descricaoDaPessoa(usuario) {
    var cargo = usuario.cargo || usuario.nivelAcesso || '';
    return cargo;
  }

  /** A data do último registro, ou o aviso de que ainda não há nenhum. */
  function ultimoRegistro(dados) {
    var informacao = dados || { texto: 'Nenhum registro ainda', existe: false };
    var explicacao = informacao.existe && informacao.canal
      ? 'Último registro em ' + informacao.canal
      : 'Ainda não há registros nos canais';

    return '<div class="ultimo-registro' + (informacao.existe ? '' : ' vazio') + '"'
      + ' title="' + escapar(explicacao) + '">'
      + '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"'
      + ' stroke-linecap="round" aria-hidden="true">'
      + '<rect x="3.5" y="5" width="17" height="15" rx="2"></rect>'
      + '<path d="M3.5 10h17M8 3.5v3M16 3.5v3"></path></svg>'
      + '<span class="rotulo-data">' + escapar(informacao.texto) + '</span>'
      + '</div>';
  }

  /**
   * O aviso de que a tela leu só uma parte da base.
   *
   * Num lugar só porque são TRÊS telas dizendo a mesma coisa — Trabalho,
   * Produtividade RECC e Minha Performance —, e três textos diferentes para o
   * mesmo fato é como a operação aprende que um deles não é sério.
   *
   * A frase diz o que foi lido e o que fazer, nessa ordem. "Os números podem
   * estar incompletos" sozinho não ajuda ninguém: a pessoa precisa saber que
   * dá para aumentar a janela, e onde.
   */
  function avisoDeJanela(resposta, oQueEssaTelaMostra) {
    if (!resposta || !resposta.truncada) return '';
    var lidas = resposta.linhasLidas
      ? Number(resposta.linhasLidas).toLocaleString('pt-BR') : 'algumas';
    return '<p class="aviso-janela" role="status">'
      + '<strong>' + oQueEssaTelaMostra + ' vêm das ' + lidas + ' linhas mais '
      + 'recentes da base</strong>, que é o que o painel lê de uma vez. O canal '
      + 'tem mais que isso, então casos antigos do período podem ter ficado de '
      + 'fora. Para o histórico inteiro, use Buscar Caso; para aumentar a '
      + 'janela, ajuste <code>OPERACAO.LINHAS_DO_PAINEL</code> na aba CONFIG.'
      + '</p>';
  }

  /**
   * A caixa que envolve os filtros de uma tela.
   *
   * Três telas filtram — Trabalho, Minha Performance e Produtividade RECC — e
   * até aqui os controles ficavam soltos sobre o fundo da página, encostados
   * no conteúdo. Numa tela com cartão, gráfico e tabela, a pessoa não sabia
   * onde o recorte acabava e o resultado começava.
   *
   * A caixa resolve isso com fundo próprio e um título: o que está DENTRO
   * muda o que está FORA. É uma peça só, usada pelas três, para elas não
   * divergirem no primeiro ajuste — foi assim com o formulário.
   *
   * `contagem` é o texto do canto direito ("7 casos · últimos 30 dias"): ele é
   * o resultado do recorte, e por isso mora na mesma caixa que o recorte.
   */
  function caixaDeFiltros(conteudo, contagem) {
    return '<section class="caixa-de-filtros">'
      + '<header class="caixa-de-filtros-cabeca">'
      + '<h3>' + icone('filtro') + 'Filtros</h3>'
      + (contagem ? '<span class="contagem">' + contagem + '</span>' : '')
      + '</header>'
      + '<div class="filtros">' + conteudo + '</div>'
      + '</section>';
  }

  return {
    avisoDeJanela: avisoDeJanela,
    caixaDeFiltros: caixaDeFiltros,
    montarLateral: montarLateral,
    montarSuperior: montarSuperior,
    // Os desenhos são de todas as telas, e não só do menu: a fila usa o olho,
    // o lápis e a lixeira, e eles precisam vir da mesma grade e da mesma
    // espessura, senão a tela parece montada com peças de dois conjuntos.
    icone: icone,
    escapar: escapar,
    dicaDaCelula: dicaDaCelula,
    iniciais: iniciais
  };
})();
</script>

<!-- ========================================================================
     PEÇA 2 de 7 · SenhaDeAdministrador
     Era o arquivo Front-End/SenhaDeAdministrador.html antes de as peças
     compartilhadas serem agrupadas num arquivo só.
     ======================================================================== -->

<script>
/* ============================================================================
   PGO — SenhaDeAdministrador.html · a guarda das ações sem desfazer
   ============================================================================
   Um diálogo só, usado por todas as telas que fazem alguma coisa de alcance
   grande: criar coluna na planilha, mexer em nível de acesso, importar um
   lote de corretoras.

   Ele nasceu dentro de Configurações e saiu de lá quando a Importação passou
   a precisar do mesmo pedido. Dois diálogos de senha, escritos separados,
   viram duas regras: um dia um passa a liberar por 5 minutos e o outro por
   30, e ninguém percebe até alguém reclamar.

   COMO USAR:

       SenhaDeAdministrador.pedir(function () {
         // ... o que fazer DEPOIS que a senha foi aceita
       });

   A ação fica guardada enquanto a senha não vem, e só roda se ela for aceita.
   É isso que evita o pior atrito possível: preencher um formulário inteiro,
   apertar salvar, digitar a senha — e ter de preencher tudo de novo.
   ============================================================================ */

var SenhaDeAdministrador = (function () {

  var acaoPendente = null;

  function elemento(id) { return document.getElementById(id); }

  /**
   * Pede a senha e, se ela for aceita, roda a ação.
   *
   * `avisarSeNaoDefinida` é para quem JÁ SABE que não existe senha cadastrada
   * — a tela de Configurações sabe, porque o resumo dela diz. Aí o recado sai
   * antes, dizendo onde definir, em vez de a pessoa descobrir digitando uma
   * senha que não existe.
   */
  function pedir(acao, avisarSeNaoDefinida) {
    if (avisarSeNaoDefinida) {
      window.alert('Ainda não existe senha de administrador. Defina uma em '
        + 'Configurações › Identidade antes de fazer isto.');
      return;
    }
    acaoPendente = acao;
    abrir();
  }

  function abrir() {
    var caixa = document.createElement('div');
    caixa.className = 'dialogo';
    caixa.id = 'dialogo-senha';
    caixa.innerHTML = '<div class="dialogo-caixa" role="dialog" aria-modal="true"'
      + ' aria-labelledby="dialogo-titulo">'
      + '<h3 id="dialogo-titulo">Ação sem desfazer</h3>'
      + '<p>Isto escreve na planilha de produção. Confirme com a senha de '
      + 'administrador — ela libera as ações de estrutura por 5 minutos.</p>'
      + '<form id="form-dialogo">'
      + '<input type="password" id="senha-do-dialogo" autocomplete="off"'
      + ' placeholder="Senha de administrador" aria-label="Senha de administrador">'
      + '<p class="dialogo-erro" id="dialogo-erro" hidden></p>'
      + '<div class="config-acoes">'
      + '<button type="submit" class="botao">Confirmar</button>'
      + '<button type="button" class="botao vazado" id="dialogo-desistir">'
      + 'Desistir</button></div></form></div>';
    document.body.appendChild(caixa);

    var campo = elemento('senha-do-dialogo');
    campo.focus();

    elemento('dialogo-desistir').addEventListener('click', fechar);
    elemento('form-dialogo').addEventListener('submit', function (evento) {
      evento.preventDefault();
      Servidor.chamar('liberarComSenha', campo.value)
        .entao(function () {
          // A ação sai da gaveta ANTES de fechar: fechar limpa a gaveta.
          var acao = acaoPendente;
          fechar();
          if (acao) acao();
        })
        .senao(function (erro) {
          var aviso = elemento('dialogo-erro');
          aviso.textContent = erro.message || String(erro);
          aviso.hidden = false;
          campo.value = '';
          campo.focus();
        });
    });
  }

  function fechar() {
    var caixa = elemento('dialogo-senha');
    if (caixa) caixa.parentNode.removeChild(caixa);
    acaoPendente = null;
  }

  /**
   * Fecha o diálogo se ele estiver aberto.
   *
   * Quem troca de tela chama isto. Sem isso, o diálogo de senha ficaria
   * flutuando por cima da tela seguinte, esperando confirmar uma ação que
   * pertencia a uma tela que já não está mais lá.
   */
  return { pedir: pedir, fechar: fechar };

})();
</script>

<!-- ========================================================================
     PEÇA 3 de 7 · SeletorDeCanal
     Era o arquivo Front-End/SeletorDeCanal.html antes de as peças
     compartilhadas serem agrupadas num arquivo só.
     ======================================================================== -->

<script>
/* ============================================================================
   PGO — SeletorDeCanal.html · a escolha do canal de trabalho
   ============================================================================
   Aparece no Trabalho e no Cadastrar Caso, e é a mesma peça nos dois. Duas
   cópias divergiriam na primeira mudança — bastaria um canal nova ganhar
   ícone só num dos lugares.

   O desenho de cado canal vem da coluna `Icone`, na aba CANAIS: canal nova
   escolhe o dela sem passar por código.
   ============================================================================ */

var SeletorDeCanal = (function () {

  var DESENHOS = {
    // escudo com coração: proteger a vida de quem já é cliente
    escudo:
      '<path d="M12 3.2 4.8 6v6.2c0 4.4 3 7.6 7.2 8.9 4.2-1.3 7.2-4.5 7.2-8.9V6z"></path>'
      + '<path d="M12 15.4c-2-1.3-3.2-2.4-3.2-3.8a1.7 1.7 0 0 1 3.2-.9 1.7 1.7 0 0 1 3.2.9'
      + 'c0 1.4-1.2 2.5-3.2 3.8z"></path>',
    // diamante: o canal prioritária
    diamante:
      '<path d="M7.4 3.6h9.2l4 5.4L12 20.6 3.4 9z"></path>'
      + '<path d="M3.4 9h17.2M7.4 3.6 12 9l4.6-5.4M12 9v11.6"></path>',
    // grupo: três pessoas, uma à frente. É o VG — Vida em Grupo, onde o
    // segurado não é uma pessoa, é uma empresa com muitas vidas dentro.
    //
    // A chave tem de ser MINÚSCULA: o `icone` abaixo faz toLowerCase no nome
    // que vem da aba CANAIS. Um 'grupoDeVidas' aqui nunca seria encontrado, e
    // o canal sairia com o losango do diamante sem ninguém ser avisado.
    grupo:
      '<path d="M15.8 20.4v-1.8a3.6 3.6 0 0 0-3.6-3.6H6.8a3.6 3.6 0 0 0-3.6 3.6v1.8"></path>'
      + '<circle cx="9.5" cy="7.6" r="3.4"></circle>'
      + '<path d="M20.8 20.4v-1.8a3.6 3.6 0 0 0-2.7-3.5"></path>'
      + '<path d="M15.6 4.4a3.6 3.6 0 0 1 0 6.9"></path>'
  };

  /** Nome desconhecido cai no losango: melhor que botão sem desenho. */
  function icone(nome) {
    var desenho = DESENHOS[String(nome || '').toLowerCase()] || DESENHOS.diamante;
    return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor"'
      + ' stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"'
      + ' aria-hidden="true">' + desenho + '</svg>';
  }

  function montar(canais, idEscolhido) {
    return '<div class="canais" role="group" aria-label="Canal de trabalho">'
      + canais.map(function (canal) {
        var atual = canal.id === idEscolhido;
        return '<button type="button" class="canal' + (atual ? ' atual' : '') + '"'
          + ' data-canal="' + Moldura.escapar(canal.id) + '"'
          + ' aria-pressed="' + (atual ? 'true' : 'false') + '">'
          + icone(canal.icone)
          + '<span class="dizeres">'
          + '<strong>' + Moldura.escapar(canal.nome) + '</strong>'
          + '<span>' + Moldura.escapar(canal.descricao) + '</span>'
          + '</span></button>';
      }).join('')
      + '</div>';
  }

  function ligar(aoEscolher) {
    var botoes = document.querySelectorAll('.canal');
    for (var i = 0; i < botoes.length; i++) {
      botoes[i].addEventListener('click', function () {
        aoEscolher(this.getAttribute('data-canal'));
      });
    }
  }

  /**
   * Os nomes dos desenhos que existem, para a tela de Configurações oferecer.
   *
   * Sai DAQUI, da mesma chave que `icone` consulta, e não de uma lista escrita
   * à parte: uma segunda lista deixaria oferecer um ícone que não tem desenho,
   * e o canal nasceria com o losango sem ninguém entender por quê.
   */
  function nomesDosIcones() {
    return Object.keys(DESENHOS);
  }

  return {
    montar: montar, ligar: ligar, icone: icone,
    nomesDosIcones: nomesDosIcones
  };
})();
</script>

<!-- ========================================================================
     PEÇA 4 de 7 · Formulario
     Era o arquivo Front-End/Formulario.html antes de as peças
     compartilhadas serem agrupadas num arquivo só.
     ======================================================================== -->

<script>
/* ============================================================================
   PGO — Formulario.html · o formulário, desenhado num lugar só
   ============================================================================
   Duas telas montam o mesmo formulário: Cadastrar Caso e a edição dentro do
   modal do Trabalho. Elas não têm duas cópias disto.

   A razão é a mesma que já custou caro neste projeto: regra copiada em dois
   lugares é regra que um dia diverge. A máscara do CPF, o seletor vazio que
   vira caixa de texto, a marcação de erro campo a campo — tudo mora aqui, e
   quem quiser um formulário pede um.

   O PREFIXO existe porque o formulário pode aparecer DUAS VEZES na mesma
   página — a tela de cadastro atrás e o modal de edição na frente. Sem ele,
   os dois teriam elementos com o mesmo id, e o navegador entregaria sempre o
   primeiro: editar um caso escreveria no formulário de cadastro.

   A máscara vive aqui, e só aqui: é aparência. O que sai daqui para o
   servidor é o que a pessoa digitou; quem limpa e confere é o servidor.
   ============================================================================ */

var Formulario = (function () {

  function escapar(texto) { return Moldura.escapar(texto); }

  function texto(valor) {
    return String(valor === null || valor === undefined ? '' : valor);
  }

  /* ---------------------------------------------------------------- máscara */

  /**
   * Aplica a máscara enquanto a pessoa digita.
   * Cada `0` da máscara é um dígito; o resto é enfeite que o servidor descarta.
   */
  function aplicarMascara(valor, mascara) {
    var digitos = String(valor || '').replace(/\D/g, '');
    if (!mascara) return digitos;
    if (mascara.indexOf('|') >= 0) mascara = mascaraEmQueCabe(digitos, mascara);

    var saida = '';
    var proximo = 0;
    for (var i = 0; i < mascara.length && proximo < digitos.length; i++) {
      if (mascara.charAt(i) === '0') {
        saida += digitos.charAt(proximo);
        proximo++;
      } else {
        saida += mascara.charAt(i);
      }
    }
    return saida;
  }

  /**
   * Entre máscaras alternativas — "000.000.000-00|00.000.000/0000-00" —, a
   * primeira em que os dígitos cabem.
   *
   * Pedido do PO para a Mesa: o campo do CPF aceita CNPJ também. Até 11
   * dígitos ele se desenha como CPF; do 12º em diante vira CNPJ. Sem isto, um
   * CNPJ colado com pontos e barra era cortado em 11 dígitos e virava um CPF
   * que não existe — sem erro nenhum na tela.
   */
  function mascaraEmQueCabe(digitos, mascara) {
    var opcoes = String(mascara).split('|');
    for (var i = 0; i < opcoes.length; i++) {
      var cabem = (opcoes[i].match(/0/g) || []).length;
      if (digitos.length <= cabem) return opcoes[i];
    }
    return opcoes[opcoes.length - 1];
  }

  function usaMascara(campo) {
    return !!campo.mascara
      && (campo.tipo === 'documento' || campo.tipo === 'identificador'
        || campo.tipo === 'telefone');
  }

  /* --------------------------------------------------------------- dinheiro */

  /** Até onde o campo de valor vai: R$ 999.999.999,99. */
  var DIGITOS_DO_DINHEIRO = 11;   // nove inteiros + dois centavos

  /**
   * O valor em dinheiro, formatado enquanto a pessoa digita.
   *
   * SÓ DÍGITO ENTRA. Não é preferência de estilo: um "aprox. 1200" ou um "1200
   * reais" digitado no campo de prêmio chega ao servidor, não vira número, e a
   * célula fica vazia — o caso é gravado com o valor faltando, sem ninguém
   * notar, e o Power BI soma menos do que deveria. Impedir a letra de entrar é
   * mais barato que descobrir isso num relatório três meses depois.
   *
   * O número CRESCE DA DIREITA, como numa maquininha de cartão: digitar 1, 2,
   * 3 mostra R$ 0,01 → R$ 0,12 → R$ 1,23. É como se digita valor a vida
   * inteira, e evita a dúvida de "preciso digitar a vírgula?".
   *
   * Nove casas inteiras contemplam de uma apólice de R$ 12,90 a uma de
   * R$ 999.999.999,99 — que é o que a operação pediu.
   */
  function aplicarMascaraDeDinheiro(valor) {
    var digitos = String(valor || '').replace(/\D/g, '');
    // Zeros à esquerda saem, senão digitar e apagar deixa "R$ 000,05" na tela.
    digitos = digitos.replace(/^0+/, '');
    if (!digitos) return '';
    if (digitos.length > DIGITOS_DO_DINHEIRO) {
      digitos = digitos.substring(0, DIGITOS_DO_DINHEIRO);
    }

    while (digitos.length < 3) digitos = '0' + digitos;   // garante os centavos

    var centavos = digitos.slice(-2);
    var inteiros = digitos.slice(0, -2).replace(/\B(?=(\d{3})+(?!\d))/g, '.');
    return 'R$ ' + inteiros + ',' + centavos;
  }

  /**
   * Campo de dinheiro não usa a máscara comum, que é de posição fixa.
   *
   * A do CPF tem onze dígitos sempre, nas mesmas casas. A de dinheiro cresce
   * da direita e muda de tamanho a cada tecla — são duas máquinas diferentes,
   * e tentar fazer uma servir às duas foi o que me fez escrever esta.
   */
  function ehCampoDeDinheiro(campo) {
    return campo.tipo === 'moeda';
  }

  /* -------------------------------------------------------------- desenhar */

  function desenharCampo(campo, prefixo, colunaDaData) {
    var id = prefixo + 'campo-' + campo.chave;
    var obrigatorio = campo.obrigatorio ? ' <span class="exigido">*</span>' : '';
    /*
      O asterisco é VISUAL. Quem usa leitor de tela não o ouve como "campo
      obrigatório" — ouve "asterisco", ou nada. `aria-required` é o que diz
      isso de verdade, e custa um atributo.

      Não é `required` do HTML: o formulário é `novalidate` de propósito,
      porque quem valida é o servidor, e o balão nativo do navegador
      atropelaria a nossa mensagem — que é mais específica e diz o que fazer.
      `aria-required` anuncia sem impedir o envio.
    */
    var exigido = campo.obrigatorio ? ' aria-required="true"' : '';
    var travado = campo.somenteLeitura ? ' disabled' : '';
    var controle;

    // Seletor sem opção nenhuma vira caixa de texto: uma lista vazia na tela
    // é um campo que não dá para preencher, e ninguém entenderia por quê.
    if (campo.tipo === 'seletor' && !campo.opcoes.length) {
      controle = '<input type="text" id="' + id + '"'
        + ' data-chave="' + escapar(campo.chave) + '" autocomplete="off"'
        + ' placeholder="A lista ainda está vazia — digite o valor"'
        + exigido + travado + '>';

    } else if (campo.tipo === 'seletor') {
      var opcoes = ['<option value="">Selecione uma opção</option>'];
      campo.opcoes.forEach(function (opcao) {
        opcoes.push('<option value="' + escapar(opcao.valor) + '">'
          + escapar(opcao.rotulo) + '</option>');
      });
      controle = '<select id="' + id + '" data-chave="' + escapar(campo.chave) + '"'
        + exigido + travado + '>' + opcoes.join('') + '</select>';

    } else if (campo.tipo === 'simOuNao') {
      controle = '<select id="' + id + '" data-chave="' + escapar(campo.chave) + '"'
        + exigido + travado + '>'
        + '<option value="">Selecione</option>'
        + '<option value="SIM">Sim</option>'
        + '<option value="NAO">Não</option></select>';

    } else if (campo.tipo === 'textoLongo') {
      controle = '<textarea id="' + id + '" rows="3"' + exigido
        + ' data-chave="' + escapar(campo.chave) + '"' + travado + '></textarea>';

    } else {
      var htmlTipo = 'text';
      if (campo.tipo === 'data') htmlTipo = 'date';
      else if (campo.tipo === 'hora') htmlTipo = 'time';
      else if (campo.tipo === 'email') htmlTipo = 'email';
      else if (campo.tipo === 'numero' || campo.tipo === 'moeda'
        || campo.tipo === 'percentual') htmlTipo = 'text';

      var dinheiro = ehCampoDeDinheiro(campo);
      // inputmode="decimal" faz o celular abrir o teclado NUMÉRICO. Sem isso a
      // pessoa abre o alfabético, procura o número e digita errado com mais
      // frequência — e metade da operação trabalha no telefone.
      controle = '<input type="' + htmlTipo + '" id="' + id + '"'
        + ' data-chave="' + escapar(campo.chave) + '"'
        + (dinheiro ? ' data-dinheiro="sim" inputmode="decimal"' : '')
        + (dinheiro ? ' placeholder="R$ 0,00"' : '')
        + (campo.mascara ? ' data-mascara="' + escapar(campo.mascara) + '"' : '')
        // Duas máscaras ("CPF|CNPJ") aparecem como as duas formas aceitas.
        + (campo.mascara ? ' placeholder="'
          + escapar(campo.mascara.split('|').join(' ou ')) + '"' : '')
        // A coluna de data do canal: é dela que o selo da proposta tira o mês.
        + (colunaDaData && campo.cabecalho === colunaDaData
          ? ' data-data-do-caso="sim"' : '')
        + ' autocomplete="off"' + exigido + travado + '>';
    }

    var ajuda = campo.descricao
      ? '<small class="ajuda">' + escapar(campo.descricao) + '</small>' : '';
    var selo = campo.chave === 'susep'
      ? '<div class="selo-susep" id="' + prefixo + 'selo-susep" hidden></div>' : '';
    // O selo da proposta usa a MESMA aparência do da SUSEP — o PO pediu "tipo
    // os das SUSEPs bloqueadas". Ver consultarProposta.
    if (campo.chave === 'numerodaproposta') {
      selo = '<div class="selo-susep" id="' + prefixo + 'selo-proposta" hidden></div>';
    }

    // A condição de visibilidade viaja no HTML, e não numa variável do
    // módulo: o formulário é desenhado em dois lugares — a tela de cadastro e
    // o caso aberto por cima — e o que estiver só na memória de um não vale
    // para o outro.
    var condicao = campo.mostrarSe
      ? ' data-mostrar-se-campo="' + escapar(campo.mostrarSe.campo) + '"'
        + ' data-mostrar-se-valor="' + escapar(campo.mostrarSe.valor) + '"'
      : '';

    // Travado pelo cargo não é o mesmo que somente leitura do nível, e a
    // pessoa merece saber qual dos dois é. Sem essa frase, um analista lê o
    // campo cinza como defeito da tela.
    var porQueTravado = campo.travadoPeloCargo
      ? '<small class="ajuda">Preenchido com o seu nome. Cadastrar em nome de '
        + 'outra pessoa depende do seu nível de acesso.</small>' : '';

    return '<div class="campo largura-' + campo.largura + '" data-campo="'
      + escapar(campo.chave) + '"' + condicao + '>'
      + '<label for="' + id + '">' + escapar(campo.rotulo) + obrigatorio + '</label>'
      + controle + ajuda + porQueTravado + selo
      + '<small class="erro" hidden></small>'
      + '</div>';
  }

  /**
   * O AVISO DE ATENÇÃO antes de excluir, escrito num lugar só.
   *
   * Pedido do PO: excluir apaga o caso DEFINITIVAMENTE da planilha, e por isso
   * "deve ter um pop up de atenção". Antes era a caixinha do navegador
   * (`window.confirm`): cinza, com o botão OK no lugar de sempre, igual a
   * qualquer outra pergunta boba — o tipo de caixa que a mão confirma antes de
   * o olho ler.
   *
   * Agora é um aviso do próprio sistema, que diz em letras o que vai
   * acontecer, e foi desenhado para o clique distraído não apagar nada:
   *   · o foco nasce em CANCELAR — Enter e espaço cancelam;
   *   · o botão que apaga é vermelho e diz "Excluir definitivamente";
   *   · Esc e clicar fora também cancelam.
   *
   * `aoConfirmar` só é chamado se a pessoa escolher excluir. Mora aqui porque
   * mais de uma tela pergunta — a fila do Trabalho e a Busca —, e duas cópias
   * divergiriam no dia em que só uma fosse corrigida.
   */
  function confirmarExclusao(idDoCaso, aoConfirmar) {
    if (document.getElementById('dialogo-exclusao')) return;

    var caixa = document.createElement('div');
    caixa.className = 'dialogo';
    caixa.id = 'dialogo-exclusao';
    caixa.innerHTML = '<div class="dialogo-caixa atencao" role="alertdialog"'
      + ' aria-modal="true" aria-labelledby="titulo-exclusao"'
      + ' aria-describedby="texto-exclusao">'
      + '<h3 id="titulo-exclusao">' + Moldura.icone('ocultar')
      + ' Atenção: excluir o caso ' + Moldura.escapar(idDoCaso) + '</h3>'
      + '<div id="texto-exclusao">'
      + '<p><strong>O caso será apagado definitivamente da planilha.</strong> '
      + 'Não dá para desfazer, nem por um administrador.</p>'
      + '<p>O que havia no caso fica registrado na auditoria — quem excluiu, '
      + 'quando, e o que estava gravado.</p></div>'
      + '<div class="config-acoes">'
      + '<button type="button" class="botao vazado" id="cancelar-exclusao">'
      + 'Cancelar</button>'
      + '<button type="button" class="botao perigo" id="confirmar-exclusao">'
      + 'Excluir definitivamente</button>'
      + '</div></div>';
    document.body.appendChild(caixa);

    function sair() {
      if (caixa.parentNode) caixa.parentNode.removeChild(caixa);
      document.removeEventListener('keydown', aoTeclar);
    }
    function aoTeclar(evento) {
      if (evento.key === 'Escape') { evento.preventDefault(); sair(); }
    }
    document.addEventListener('keydown', aoTeclar);
    document.getElementById('cancelar-exclusao').addEventListener('click', sair);
    caixa.addEventListener('mousedown', function (evento) {
      if (evento.target === caixa) sair();
    });
    document.getElementById('confirmar-exclusao').addEventListener('click', function () {
      sair();
      if (aoConfirmar) aoConfirmar();
    });
    document.getElementById('cancelar-exclusao').focus();
  }

  /**
   * Põe os valores padrão e acende/apaga os campos condicionais.
   *
   * Roda ao desenhar o formulário vazio. No caso já gravado quem manda é o
   * valor do caso — ver preencher —, porque um padrão sobrescrevendo o que
   * está na planilha seria perda silenciosa de dado.
   */
  function aplicarPadroes(raiz, formulario) {
    formulario.secoes.forEach(function (secao) {
      secao.campos.forEach(function (campo) {
        if (!campo.valorPadrao) return;
        var caixa = raiz.querySelector('[data-chave="' + campo.chave + '"]');
        if (caixa && !caixa.value) caixa.value = campo.valorPadrao;
      });
    });
    aplicarCondicoes(raiz);
  }

  /**
   * Mostra cada campo condicional só quando o campo de que ele depende
   * estiver com o valor combinado.
   *
   * "Nome de quem transferiu" só faz sentido quando o canal de origem é a
   * Central; "dados do pagamento", só para uma forma específica. Deixar os
   * dois sempre visíveis enche o formulário de campos que quase nunca se
   * preenche — e campo que quase nunca se preenche ensina a pular campo.
   */
  /**
   * Dois textos são o mesmo, ignorando acento e caixa.
   *
   * A condição é escrita por quem configura ("CENTRAL"), e o valor vem de uma
   * lista que alguém pode ter cadastrado como "Central". Comparar cru faria a
   * regra funcionar hoje e parar de funcionar no dia em que a lista fosse
   * reescrita — sem erro nenhum, só o campo que nunca mais aparece.
   */
  function mesmoTexto(um, outro) {
    function limpar(texto) {
      return String(texto || '').trim().toLowerCase()
        .normalize('NFD').replace(/[\u0300-\u036f]/g, '');
    }
    return limpar(um) === limpar(outro);
  }

  function aplicarCondicoes(raiz) {
    var condicionais = raiz.querySelectorAll('[data-mostrar-se-campo]');
    for (var i = 0; i < condicionais.length; i++) {
      var bloco = condicionais[i];
      var deQuem = bloco.getAttribute('data-mostrar-se-campo');
      var esperado = bloco.getAttribute('data-mostrar-se-valor');
      var caixa = raiz.querySelector('[data-chave="' + deQuem + '"]');
      var valor = caixa ? String(caixa.value || '') : '';
      var mostrar = mesmoTexto(valor, esperado);
      bloco.hidden = !mostrar;
      if (!mostrar) {
        // Esconder sem limpar deixaria um valor invisível ser gravado.
        var dentro = bloco.querySelector('[data-chave]');
        if (dentro) dentro.value = '';
      }
    }
  }

  /** Todas as seções do formulário, prontas para entrar num elemento. */
  function desenhar(formulario, prefixo) {
    return formulario.secoes.map(function (secao) {
      return '<fieldset class="secao">'
        + '<legend>' + escapar(secao.nome) + '</legend>'
        + '<div class="grade">'
        + secao.campos.map(function (campo) {
          return desenharCampo(campo, prefixo || '',
            formulario.canal && formulario.canal.colunaDaData);
        }).join('')
        + '</div></fieldset>';
    }).join('');
  }

  /* --------------------------------------------------------- comportamento */

  /**
   * Liga as máscaras e o selo da SUSEP dentro de um pedaço da página.
   *
   * Recebe a RAIZ, e não procura na página inteira: com o modal aberto por
   * cima da tela de cadastro, procurar na página inteira ligaria os dois.
   */
  function ligar(raiz, prefixo, idDoCanal, comSeloDaSusep, idDoCasoAberto) {
    /*
     * O CAMPO DE DINHEIRO.
     *
     * `keypress` barra a tecla que não é dígito ANTES de ela entrar; `input`
     * reformata o que sobrou. Os dois são necessários: o keypress não pega
     * colar nem ditado, e o input sozinho deixaria a letra piscar na tela
     * antes de sumir.
     *
     * O cursor vai sempre para o fim porque o número cresce da direita — se
     * ele ficasse no meio, digitar o próximo dígito inseriria no lugar errado.
     */
    var deDinheiro = raiz.querySelectorAll('[data-dinheiro]');
    for (var d = 0; d < deDinheiro.length; d++) {
      deDinheiro[d].addEventListener('keypress', function (evento) {
        if (evento.key && evento.key.length === 1 && !/\d/.test(evento.key)) {
          evento.preventDefault();
        }
      });
      deDinheiro[d].addEventListener('input', function () {
        this.value = aplicarMascaraDeDinheiro(this.value);
        this.selectionStart = this.selectionEnd = this.value.length;
      });
    }

    var comMascara = raiz.querySelectorAll('[data-mascara]');
    for (var i = 0; i < comMascara.length; i++) {
      comMascara[i].addEventListener('input', function () {
        var posicaoNoFim = this.selectionStart === this.value.length;
        this.value = aplicarMascara(this.value, this.getAttribute('data-mascara'));
        if (posicaoNoFim) {
          this.selectionStart = this.selectionEnd = this.value.length;
        }
      });
    }

    /*
      O SELO DA SUSEP, e quando ele NÃO entra.

      Pedido do PO: "em ver detalhes do diamante não precisa buscar a susep;
      apenas na RET se faz necessário para controle" — hoje é o "Trabalhar no
      caso", que abre direto a edição. Ao EDITAR um caso que já
      existe, a corretora já está preenchida e a consulta só adiciona espera.

      No CADASTRO ele continua em todo canal — é dele que sai o nome da
      corretora preenchido automaticamente, que o PO pediu para a Mesa.

      `comSeloDaSusep` não informado vale SIM: é o cadastro, e é quem chama de
      fora sem saber desta regra. O lado seguro é o selo existir.
    */
    var susep = comSeloDaSusep === false
      ? null : raiz.querySelector('[data-chave="susep"]');
    if (susep) {
      var conferir = function () {
        consultarSusep(raiz, prefixo, susep.value, idDoCanal);
      };
      susep.addEventListener('change', conferir);
      susep.addEventListener('blur', conferir);
    }

    /*
      O SELO DA PROPOSTA: a mesma proposta já cadastrada no mesmo mês, e com
      quem ela está. Pedido do PO para a RET — e só aparece onde o formulário
      tem o campo da proposta, que hoje é só a RET.

      Só no `change`, e não no `blur` como a SUSEP: na edição a pessoa passa
      pelo campo sem mexer nele o tempo todo, e cada passada seria uma ida ao
      servidor para responder o que já se sabia.

      Trocar a DATA do caso troca o mês, e a resposta pode mudar — por isso a
      data também confere de novo, quando já há proposta escrita.
    */
    var proposta = raiz.querySelector('[data-chave="numerodaproposta"]');
    if (proposta) {
      var conferirProposta = function () {
        consultarProposta(raiz, prefixo, idDoCanal, idDoCasoAberto);
      };
      proposta.addEventListener('change', conferirProposta);
      var dataDoCaso = raiz.querySelector('[data-data-do-caso]');
      if (dataDoCaso) {
        dataDoCaso.addEventListener('change', function () {
          if (String(proposta.value || '').trim()) conferirProposta();
        });
      }
    }

    // Os campos condicionais reagem ao campo de que dependem. O ouvinte fica
    // no campo que MANDA, e não no que obedece: quem obedece pode estar
    // escondido, e elemento escondido não recebe evento.
    var condicionais = raiz.querySelectorAll('[data-mostrar-se-campo]');
    var jaOuvidos = {};
    for (var k = 0; k < condicionais.length; k++) {
      var deQuem = condicionais[k].getAttribute('data-mostrar-se-campo');
      if (jaOuvidos[deQuem]) continue;
      jaOuvidos[deQuem] = true;
      var manda = raiz.querySelector('[data-chave="' + deQuem + '"]');
      if (!manda) continue;
      manda.addEventListener('change', function () { aplicarCondicoes(raiz); });
      manda.addEventListener('input', function () { aplicarCondicoes(raiz); });
    }
    aplicarCondicoes(raiz);
  }

  /**
   * O selo da SUSEP.
   *
   * "Não encontrada" é resposta, não erro: é uma corretora que o cadastro não
   * conhece, e quem está atendendo precisa saber disso antes de seguir.
   *
   * A SUSEP TEM LETRA — "RET00J", palavra do PO. A guarda abaixo olhava só
   * dígito (`replace(/\D/g, '')`): uma SUSEP sem nenhum número sairia dali
   * como texto vazio, o selo se esconderia e NUNCA consultaria o servidor.
   * Não daria erro — o campo ficaria só sem selo, para sempre, e ninguém
   * ligaria isso à letra.
   */
  function consultarSusep(raiz, prefixo, valor, idDoCanal) {
    var selo = raiz.querySelector('#' + (prefixo || '') + 'selo-susep');
    if (!selo) return;

    if (!String(valor || '').trim()) {
      selo.hidden = true;
      return;
    }

    selo.hidden = false;
    selo.className = 'selo-susep conferindo';
    selo.textContent = 'Conferindo…';

    // O CANAL VAI JUNTO: é ele que decide se a lista de SUSEPs bloqueadas é
    // consultada. A Mesa Diamante não consulta, a pedido do PO, e quem sabe
    // disso é a coluna do canal — não esta tela.
    Servidor.chamar('consultarSusep', valor, idDoCanal)
      .entao(function (resposta) {
        var aparencia = {
          OK: 'liberada', BLOQUEADA: 'bloqueada',
          NAO_ENCONTRADA: 'desconhecida', VAZIA: 'conferindo'
        }[resposta.situacao] || 'conferindo';

        selo.className = 'selo-susep ' + aparencia;
        selo.textContent = resposta.mensagem
          + (resposta.segmento && resposta.situacao === 'OK'
            ? ' · ' + resposta.segmento : '');

        preencherCorretoraDaSusep(raiz, resposta);
      })
      .senao(function () {
        selo.className = 'selo-susep conferindo';
        selo.textContent = 'Não consegui conferir a SUSEP agora.';
      });
  }

  /**
   * O selo da proposta.
   *
   * SINALIZA, NÃO IMPEDE: vermelho quando a mesma proposta já existe no mês,
   * dizendo com quem ela está; verde quando não há outra. O cadastro segue
   * nos dois casos — quem decide é quem está atendendo.
   *
   * A resposta que chega DEPOIS de a pessoa trocar a proposta é descartada:
   * duas propostas digitadas em seguida voltam em qualquer ordem, e a
   * resposta da primeira não pode pintar o selo da segunda.
   */
  function consultarProposta(raiz, prefixo, idDoCanal, idDoCasoAberto) {
    var selo = raiz.querySelector('#' + (prefixo || '') + 'selo-proposta');
    var campo = raiz.querySelector('[data-chave="numerodaproposta"]');
    if (!selo || !campo) return;

    var perguntada = String(campo.value || '').trim();
    if (!perguntada) {
      selo.hidden = true;
      return;
    }

    var data = raiz.querySelector('[data-data-do-caso]');
    selo.hidden = false;
    selo.className = 'selo-susep conferindo';
    selo.textContent = 'Conferindo a proposta…';

    Servidor.chamar('conferirPropostaRepetida', perguntada, idDoCanal,
      data ? data.value : '', idDoCasoAberto || '')
      .entao(function (resposta) {
        if (String(campo.value || '').trim() !== perguntada) return;
        if (resposta.situacao === 'REPETIDA' || resposta.situacao === 'UNICA') {
          selo.className = 'selo-susep '
            + (resposta.situacao === 'REPETIDA' ? 'bloqueada' : 'liberada');
          selo.textContent = resposta.mensagem;
        } else {
          // Proposta pela metade, ou canal sem proposta: nada a dizer. O
          // formato errado é recusado ao salvar, com a explicação inteira.
          selo.hidden = true;
        }
      })
      .senao(function () {
        if (String(campo.value || '').trim() !== perguntada) return;
        selo.className = 'selo-susep conferindo';
        selo.textContent = 'Não consegui conferir a proposta agora.';
      });
  }

  /*
    A corretora, preenchida pela SUSEP.

    Pedido do PO: "o formulário da mesa deve buscar pela susep o nome da
    corretora automaticamente". A resposta do selo já traz o nome — ela vem do
    cadastro de Corretoras Diamante —, então isto NÃO custa uma ida a mais ao
    servidor: é aproveitar o que já voltou.

    QUANDO PREENCHE: quando o campo está vazio, ou quando o que está nele foi
    este mesmo preenchimento automático que colocou. Escrever por cima do que
    a pessoa digitou apagaria uma correção feita de propósito — e trocar a
    SUSEP tem de atualizar a corretora, senão sobra o nome da anterior, que é
    pior que nome nenhum.

    Guardar o que foi preenchido no próprio campo (`data-veio-da-susep`) é o
    que distingue os dois casos sem guardar estado solto na tela.
  */
  function preencherCorretoraDaSusep(raiz, resposta) {
    var campo = raiz.querySelector('[data-chave="corretora"]');
    if (!campo || campo.disabled) return;

    var nome = String((resposta && resposta.corretora) || '').trim();
    var agora = String(campo.value || '').trim();
    var oQueEuPreenchi = campo.getAttribute('data-veio-da-susep') || '';

    if (agora !== '' && agora !== oQueEuPreenchi) return;
    if (!nome) {
      // SUSEP sem corretora conhecida: limpa só o que eu mesmo escrevi.
      if (agora === oQueEuPreenchi && agora !== '') campo.value = '';
      campo.removeAttribute('data-veio-da-susep');
      return;
    }

    campo.value = nome;
    campo.setAttribute('data-veio-da-susep', nome);
  }

  /* -------------------------------------------------------------- valores */

  function valores(raiz) {
    var lidos = {};
    var controles = raiz.querySelectorAll('[data-chave]');
    for (var i = 0; i < controles.length; i++) {
      if (controles[i].disabled) continue;
      lidos[controles[i].getAttribute('data-chave')] = controles[i].value;
    }
    return lidos;
  }

  /**
   * Preenche o formulário com o que o caso tem hoje.
   *
   * A data chega do servidor em dd/mm/aaaa, que é como a pessoa lê; a caixa
   * de data do navegador só entende aaaa-mm-dd. A conversão é aqui, e não no
   * servidor, porque é uma exigência do controle e não do dado.
   */
  function preencher(raiz, valoresDoCaso) {
    var controles = raiz.querySelectorAll('[data-chave]');
    for (var i = 0; i < controles.length; i++) {
      var chave = controles[i].getAttribute('data-chave');
      var valor = texto(valoresDoCaso[chave]);

      if (controles[i].type === 'date') valor = paraCaixaDeData(valor);
      // O dinheiro volta do servidor como NÚMERO — 1234.56 —, porque é assim
      // que ele mora na célula. Na tela ele tem de aparecer como a pessoa
      // digitou: R$ 1.234,56. Sem esta linha, abrir um caso para editar
      // mostraria "1234.56" no campo, e salvar de novo gravaria 123456.
      if (controles[i].getAttribute('data-dinheiro')) {
        valor = comoDinheiroQueVeioGravado(valor);
      }
      controles[i].value = valor;

      // Valor que não está entre as opções: o seletor ficaria em branco e a
      // pessoa gravaria vazio sem perceber. Acrescentamos a opção, marcada.
      if (controles[i].tagName === 'SELECT' && valor && controles[i].value !== valor) {
        var solta = document.createElement('option');
        solta.value = valor;
        solta.textContent = valor + ' (fora da lista)';
        controles[i].appendChild(solta);
        controles[i].value = valor;
      }
    }
  }

  /**
   * O dinheiro QUE VEIO DA PLANILHA, como ele aparece no campo.
   *
   * Diferente da máscara de digitação em um ponto só, e o ponto importa: o
   * ZERO.
   *
   * `aplicarMascaraDeDinheiro` devolve vazio para "000" de propósito — sem
   * isso, digitar e apagar deixaria "R$ 0,00" piscando no campo. Mas aqui o
   * valor não está sendo digitado: ele JÁ ESTÁ GRAVADO na planilha. E zero
   * gravado é dado — na RET quer dizer "não retido", que é diferente de "não
   * preenchido".
   *
   * O DEFEITO QUE ISTO CONSERTA foi visto no navegador, num caso da RET com
   * prêmio retido zerado: os dois campos de retido abriam EM BRANCO. Quem
   * abrisse o caso para corrigir outro campo e salvasse trocava o zero por
   * vazio na planilha, sem ver — e vazio e zero não somam igual no Power BI.
   *
   * Campo vazio na planilha continua vazio na tela: `comoNumeroEmCentavos`
   * devolve texto vazio para ele, e é só aí que o campo abre em branco.
   */
  function comoDinheiroQueVeioGravado(valor) {
    var centavos = comoNumeroEmCentavos(valor);
    if (centavos === '') return '';
    return aplicarMascaraDeDinheiro(centavos) || 'R$ 0,00';
  }

  /**
   * Um valor de dinheiro, venha como vier, vira CENTAVOS — "128490".
   *
   * A máscara conta em centavos, da direita para a esquerda. Mandar "1234.56"
   * direto para ela daria R$ 1.234,56 por sorte — os dígitos são os mesmos —,
   * mas "1234.5" daria R$ 123,45 em vez de R$ 1.234,50, e "1234" daria
   * R$ 12,34 em vez de R$ 1.234,00.
   *
   * O DEFEITO QUE ISTO CONSERTA, relatado pela operação: "ao clicar em editar
   * o caso continua não trazendo o valor do prêmio mensal, total e o retido".
   *
   * O servidor manda o dinheiro JÁ FORMATADO — "R$ 1.284,90" —, e a versão
   * anterior desta função só sabia ler número cru. Com o "R$" na frente a
   * conta dava NaN, e a função devolvia vazio: o campo abria EM BRANCO. Quem
   * fosse só corrigir outro campo e salvasse, apagava o valor sem ver.
   *
   * Os quatro formatos que chegam aqui, e o que cada um tem de virar:
   *
   *   "R$ 1.284,90"   formatado pelo servidor      -> 128490
   *   "1.284,90"      brasileiro, digitado         -> 128490
   *   "1284.9"        número cru da célula         -> 128490
   *   "1284"          inteiro                      -> 128400
   *
   * A regra que separa os dois mundos é a VÍRGULA: onde ela existe, ela é o
   * decimal e o ponto é separador de milhar. Onde não existe, o ponto é o
   * decimal. Tentar adivinhar de outro jeito é o que fazia "1.284,90" virar
   * NaN na versão anterior.
   */
  function comoNumeroEmCentavos(valor) {
    // Fora tudo o que não é número nem separador: "R$", espaço, letra.
    var limpo = String(valor === null || valor === undefined ? '' : valor)
      .trim().replace(/[^\d.,-]/g, '');
    if (!limpo) return '';

    var emPonto = limpo.indexOf(',') >= 0
      ? limpo.replace(/\./g, '').replace(',', '.')   // brasileiro
      : limpo;                                       // já com ponto decimal

    var numero = Number(emPonto);
    if (!isFinite(numero)) return '';
    return String(Math.round(numero * 100));
  }

  function paraCaixaDeData(valor) {
    var brasileira = /^(\d{2})\/(\d{2})\/(\d{4})$/.exec(String(valor || ''));
    if (!brasileira) return valor;
    return brasileira[3] + '-' + brasileira[2] + '-' + brasileira[1];
  }

  /* ---------------------------------------------------------------- erros */

  function limparErros(raiz) {
    var marcados = raiz.querySelectorAll('.campo.com-erro');
    for (var i = 0; i < marcados.length; i++) {
      marcados[i].classList.remove('com-erro');
      var aviso = marcados[i].querySelector('.erro');
      if (aviso) { aviso.hidden = true; aviso.textContent = ''; }
    }
  }

  /**
   * Marca cada campo com o problema dele.
   *
   * O servidor devolve TODOS os problemas de uma vez, e a tela mostra todos.
   * Um erro por vez faria a pessoa corrigir, salvar, descobrir o segundo,
   * corrigir e salvar de novo.
   */
  function mostrarProblemas(raiz, problemas) {
    limparErros(raiz);
    (problemas || []).forEach(function (problema) {
      var caixa = raiz.querySelector('[data-campo="' + problema.campo + '"]');
      if (!caixa) return;
      caixa.classList.add('com-erro');
      var aviso = caixa.querySelector('.erro');
      aviso.textContent = problema.erro;
      aviso.hidden = false;
    });
    var primeiro = raiz.querySelector('.campo.com-erro input, .campo.com-erro select');
    if (primeiro) primeiro.focus();
  }

  /* -------------------------------------------------- o botão que grava */

  /**
   * O primeiro campo obrigatório que ainda está vazio — ou nada, se já dá
   * para gravar.
   *
   * Pedido do PO: "quando eu estiver na aba cadastrar caso o botão deve ficar
   * inativo até os campos obrigatórios serem devidamente preenchidos".
   *
   * QUEM DIZ QUE O CAMPO É OBRIGATÓRIO é o `aria-required` que o próprio
   * desenho do campo põe — e não uma segunda lista escrita aqui. Duas listas
   * da mesma regra é regra que um dia diverge: alguém marcaria o campo como
   * obrigatório em Configurações e o botão continuaria liberando o cadastro
   * sem ele, sem ninguém entender por quê.
   *
   * DOIS CAMPOS NÃO CONTAM, e por motivos diferentes:
   *
   *   TRAVADO     o que o servidor preenche com o nome de quem entrou. A
   *               pessoa não tem como digitar nele, e esperar por ele
   *               deixaria o botão morto para sempre.
   *   ESCONDIDO   o campo condicional que não é a vez dele. Está vazio porque
   *               não se aplica — e `aplicarCondicoes` limpa o que sobrou.
   */
  function faltaPreencher(raiz) {
    if (!raiz) return null;
    var exigidos = raiz.querySelectorAll('[aria-required="true"]');
    for (var i = 0; i < exigidos.length; i++) {
      var campo = exigidos[i];
      if (campo.disabled) continue;
      var bloco = campo.closest ? campo.closest('[data-campo]') : null;
      if (bloco && bloco.hidden) continue;
      if (!String(campo.value || '').trim()) return campo;
    }
    return null;
  }

  /**
   * Trava o botão enquanto faltar campo obrigatório, e o libera quando não
   * faltar mais.
   *
   * O OUVINTE FICA NA RAIZ do formulário, e não um em cada campo: `input` e
   * `change` sobem até ela, então o campo condicional que aparece depois já
   * nasce vigiado. Um ouvinte por campo teria de ser religado a cada vez que
   * o formulário mudasse de forma — e o dia em que alguém esquecesse de
   * religar, o botão liberaria o cadastro incompleto.
   *
   * Enquanto grava, ele não mexe no botão: ali quem manda é `comecouAGravar`,
   * e duas mãos no mesmo botão acenderiam o nome de volta no meio da
   * gravação.
   */
  function vigiarObrigatorios(raiz, botao) {
    if (!raiz || !botao) return;

    function conferir() {
      if (botao.getAttribute('data-gravando') === 'sim') return;
      var falta = faltaPreencher(raiz);
      botao.disabled = !!falta;
      botao.title = falta
        ? 'Preencha os campos obrigatórios (marcados com *) para cadastrar.'
        : '';
    }

    // Religar na mesma raiz duplicaria o ouvinte: "Limpar" redesenha o corpo
    // do formulário, mas o elemento que o guarda continua sendo este.
    if (raiz.getAttribute('data-obrigatorios-vigiados') !== 'sim') {
      raiz.setAttribute('data-obrigatorios-vigiados', 'sim');
      raiz.addEventListener('input', conferir);
      raiz.addEventListener('change', conferir);
    }
    conferir();
  }

  /**
   * Põe e tira os três pontinhos do botão que está gravando, e trava todos os
   * botões da área enquanto isso.
   *
   * Pedido do PO: "quando clicar em cadastrar caso ele deve ficar nos 3
   * pontinhos para que indique esta gravando (...) não deve permitir clicar
   * botões enquanto grava".
   *
   * TRAVAR TODOS OS BOTÕES DA ÁREA tem motivo de dado, e não de enfeite:
   * clicar duas vezes em "Cadastrar caso" grava DOIS casos, e apertar
   * "Desistir" no meio da gravação fecha o formulário com a gravação a
   * caminho — ela acontece, e quem mandou não vê.
   *
   * No fim, destravamos SÓ O QUE FOMOS NÓS QUE TRAVAMOS (`data-travei`): um
   * botão que já estava inativo antes — o "Cadastrar caso" esperando os
   * campos obrigatórios — não pode acordar liberado por causa disto.
   *
   * `area` é o pedaço da página que está gravando, e não a página inteira: a
   * tela de cadastro pode estar atrás do caso aberto, e travar os botões dela
   * por causa de uma gravação no modal travaria o que ninguém pediu.
   */
  function mexerNoBotaoQueGrava(botao, estaGravando, area) {
    if (botao) {
      if (estaGravando && botao.getAttribute('data-gravando') !== 'sim') {
        botao.setAttribute('data-nome-de-volta', botao.innerHTML);
        botao.setAttribute('data-gravando', 'sim');
        botao.setAttribute('aria-busy', 'true');
        // Leitor de tela não enxerga pontinho. A ele dizemos com palavra.
        botao.setAttribute('aria-label', 'Gravando');
        botao.innerHTML = '<span class="tres-pontinhos" aria-hidden="true">'
          + '<i></i><i></i><i></i></span>';
      } else if (!estaGravando
        && botao.getAttribute('data-gravando') === 'sim') {
        botao.innerHTML = botao.getAttribute('data-nome-de-volta') || '';
        botao.removeAttribute('data-nome-de-volta');
        botao.removeAttribute('data-gravando');
        botao.removeAttribute('aria-busy');
        botao.removeAttribute('aria-label');
      }
    }

    if (!area) return;
    var botoes = area.querySelectorAll('button');
    for (var i = 0; i < botoes.length; i++) {
      if (estaGravando) {
        if (botoes[i].disabled) continue;
        botoes[i].setAttribute('data-travei', 'sim');
        botoes[i].disabled = true;
      } else if (botoes[i].getAttribute('data-travei') === 'sim') {
        botoes[i].removeAttribute('data-travei');
        botoes[i].disabled = false;
      }
    }
  }

  // Dois nomes para os dois momentos, em vez de um sim/não no meio da
  // chamada: quem lê `comecouAGravar(botao, area)` entende sem procurar o que
  // o `true` significava.
  function comecouAGravar(botao, area) {
    mexerNoBotaoQueGrava(botao, true, area);
  }

  function acabouDeGravar(botao, area) {
    mexerNoBotaoQueGrava(botao, false, area);
  }

  return {
    aplicarMascara: aplicarMascara,
    aplicarMascaraDeDinheiro: aplicarMascaraDeDinheiro,
    ehCampoDeDinheiro: ehCampoDeDinheiro,
    usaMascara: usaMascara,
    desenhar: desenhar,
    ligar: ligar,
    aplicarPadroes: aplicarPadroes,
    confirmarExclusao: confirmarExclusao,
    valores: valores,
    preencher: preencher,
    limparErros: limparErros,
    mostrarProblemas: mostrarProblemas,
    faltaPreencher: faltaPreencher,
    vigiarObrigatorios: vigiarObrigatorios,
    comecouAGravar: comecouAGravar,
    acabouDeGravar: acabouDeGravar
  };
})();
</script>

<!-- ========================================================================
     PEÇA 5 de 7 · CasoEmModal
     Era o arquivo Front-End/CasoEmModal.html antes de as peças
     compartilhadas serem agrupadas num arquivo só.
     ======================================================================== -->

<script>
/* ============================================================================
   PGO — CasoEmModal.html · o caso aberto para trabalhar, por cima da fila
   ============================================================================
   "Trabalhar no caso", na fila, não leva a pessoa para outra tela: abre o
   caso por cima, JÁ NO FORMULÁRIO, e fechar devolve a fila exatamente como
   estava — mesma rolagem, mesmo filtro, mesma linha. Sair e voltar faria
   perder o lugar dezenas de vezes por dia.

   NÃO HÁ MAIS UM ESTADO DE LEITURA. Pedido do PO: "não tem necessidade do
   sistema apenas mostrar o caso". O modal tinha dois estados — ler e editar —
   e quem abria um caso quase sempre ia trabalhar nele: eram dois cliques e
   uma ida a mais ao servidor para chegar ao formulário. Agora abrir é editar.

   O que a leitura mostrava e o formulário não pergunta — as colunas que o
   sistema escreve, como a origem da importação e os carimbos de contato —
   vem embaixo do formulário, como leitura (ver `casoParaEditar`).

   O formulário é o mesmo de Cadastrar Caso, montado pelo Formulario, já
   preenchido. Com PREFIXO, porque a tela de cadastro pode estar atrás e os
   dois não podem disputar os mesmos ids.

   Fechar com Esc, com o X, com o botão e clicando fora. Quatro saídas: modal
   que prende é modal que a pessoa aprende a não abrir.
   ============================================================================ */

var CasoEmModal = (function () {

  var canalAtual = '';
  var idAtual = '';
  var formulario = null;
  /*
    O FORMULÁRIO DE CADA CANAL, GUARDADO.

    `formularioDoCanal` devolve a mesma coisa enquanto ninguém mexe em
    Configurações › Cadastrar Caso. Buscá-lo a cada caso aberto é uma ida ao
    servidor por caso — e abrir dez casos seguidos, que é o trabalho normal da
    operação, eram dez idas para receber dez vezes a mesma resposta.

    A memória dura enquanto a página estiver aberta. Quem mexer no formulário
    recarrega a tela, e é o que ele já faz hoje para ver a mudança.
  */
  var formularioDeCadaCanal = {};
  var salvando = false;
  var aoFechar = null;        // o que a tela quer fazer quando algo mudou
  var mudouAlgo = false;

  function escapar(texto) { return Moldura.escapar(texto); }
  function elemento(id) { return document.getElementById(id); }
  function corpoDaEdicao() { return elemento('corpo-da-edicao'); }

  /* ------------------------------------------------------------- abrir */

  /**
   * Abre o caso para trabalhar. `quandoMudar` é chamado no fim, e só se algo
   * foi gravado — assim a fila recarrega quando precisa, e fica quieta quando
   * a pessoa abriu e fechou.
   */
  function abrir(idDoCanal, idDoCaso, quandoMudar) {
    canalAtual = idDoCanal;
    idAtual = idDoCaso;
    aoFechar = quandoMudar || null;
    mudouAlgo = false;
    salvando = false;

    desenharCasca();
    abrirEdicao();
  }

  function desenharCasca() {
    fechar(true);

    var caixa = document.createElement('div');
    caixa.className = 'dialogo';
    caixa.id = 'modal-do-caso';
    caixa.innerHTML = '<div class="dialogo-caixa larga" role="dialog"'
      + ' aria-modal="true" aria-labelledby="titulo-do-caso">'
      + '<header class="modal-cabeca">'
      + '<div><h3 id="titulo-do-caso">Caso ' + escapar(idAtual) + '</h3>'
      + '<p id="modal-subtitulo">Abrindo…</p></div>'
      + '<button type="button" class="modal-fechar" id="modal-x"'
      + ' aria-label="Fechar">✕</button>'
      + '</header>'
      + '<div class="modal-corpo" id="modal-corpo">'
      + '<form class="formulario no-modal" id="form-do-caso" novalidate>'
      + '<div id="corpo-da-edicao"><p class="carregando-campos">'
      + 'Abrindo o caso…</p></div></form>'
      + '<div id="modal-do-sistema"></div></div>'
      // "Salvar" nasce TRAVADO e só destrava com o formulário preenchido. É a
      // regra que o PO pediu para o cadastro: botão que aparece antes do
      // formulário é botão que alguém clica — e aqui gravaria um caso vazio.
      + '<footer class="modal-pe" id="modal-pe">'
      + '<span class="recado" id="recado-do-modal" hidden></span>'
      + '<button type="button" class="botao vazado" id="modal-fechar">Fechar</button>'
      + '<button type="button" class="botao" id="modal-salvar" disabled>'
      + 'Salvar alterações</button></footer>'
      + '</div>';
    document.body.appendChild(caixa);

    elemento('modal-x').addEventListener('click', function () { fechar(); });
    elemento('modal-fechar').addEventListener('click', function () { fechar(); });
    elemento('modal-salvar').addEventListener('click', salvar);
    caixa.addEventListener('mousedown', function (evento) {
      // Só o véu fecha. Um arrasto que começa dentro e termina fora não é
      // "clicar fora" — e fechar ali perderia o que a pessoa digitou.
      //
      // E nada fecha no meio da gravação: a saída pelo véu é a mesma coisa
      // que o X, e o X está travado. Ver `mexerNoBotaoQueGrava`.
      if (salvando) return;
      if (evento.target === caixa) fechar();
    });
    document.addEventListener('keydown', aoTeclar);
  }

  function aoTeclar(evento) {
    if (!elemento('modal-do-caso')) return;
    // Com um diálogo POR CIMA do caso (o de status, o de excluir), o teclado
    // é dele: o Esc fecha o de cima, e não o caso inteiro por baixo.
    if (elemento('dialogo-situacao') || elemento('dialogo-exclusao')) return;
    /*
      ENQUANTO GRAVA, O TECLADO TAMBÉM ESPERA.

      O PO pediu que nenhum botão possa ser clicado durante a gravação. Deixar
      o Esc passar seria a mesma porta com outro nome: o modal sairia da tela
      com a gravação a caminho, e aí o Trabalho não recarregaria — `fechar`
      zera o aviso de "mudou algo" antes de a resposta chegar. A pessoa veria
      a fila velha e acharia que o ajuste não foi gravado.

      A espera é de uma gravação, não eterna: ela termina em sucesso, que
      fecha o modal, ou em erro, que destrava tudo e mostra o motivo.
    */
    if (salvando) return;
    if (evento.key === 'Escape') { evento.preventDefault(); fechar(); return; }
    if ((evento.ctrlKey || evento.metaKey) && evento.key === 'Enter') {
      evento.preventDefault();
      salvar();
    }
  }

  function fechar(semAvisar) {
    var caixa = elemento('modal-do-caso');
    if (caixa) caixa.parentNode.removeChild(caixa);
    document.removeEventListener('keydown', aoTeclar);

    if (!semAvisar && mudouAlgo && aoFechar) aoFechar();
    if (!semAvisar) { aoFechar = null; mudouAlgo = false; }
  }

  /* ------------------------------------------------------------- edição */

  function abrirEdicao() {
    /*
      AS DUAS CHAMADAS SAEM JUNTAS, e não uma depois da outra.

      Elas não dependem uma da outra: o formulário é do CANAL, os valores são
      do CASO. Encadeadas, a tela esperava a primeira voltar para só então
      perguntar a segunda — duas viagens em fila, e no Apps Script cada
      viagem é o que a pessoa sente como demora. Juntas, a espera é a da mais
      lenta das duas, não a soma.

      E o formulário vem da memória quando já foi buscado neste canal: do
      segundo caso em diante sobra uma viagem só. Antes desta versão ainda
      havia uma TERCEIRA na frente das duas — a da tela de leitura, que o
      lápis também pagava —, e ela saiu junto com a leitura.

      As duas precisam ter chegado antes de preencher — preencher antes de
      desenhar não escreve em lugar nenhum, e é o tipo de erro que só aparece
      com a rede lenta. Por isso `quandoAsDuasChegarem`.
    */
    var guardado = formularioDeCadaCanal[canalAtual];
    var oFormulario = null;
    var osValores = null;
    var deuErro = false;

    function quandoAsDuasChegarem() {
      if (deuErro || !oFormulario || !osValores) return;
      var corpo = corpoDaEdicao();
      if (!corpo) return;   // a pessoa fechou antes de chegar
      formulario = oFormulario;
      elemento('modal-subtitulo').textContent = 'Trabalhar no caso · '
        + (osValores.canal || oFormulario.canal.nome || '');
      corpo.innerHTML = Formulario.desenhar(oFormulario, 'editar-');
      // Só o canal que confere a SUSEP ganha o selo na EDIÇÃO. Ver `ligar`.
      // O Id do caso vai junto para o selo da proposta: na edição, o próprio
      // caso não conta como repetição dele mesmo.
      Formulario.ligar(corpo, 'editar-', canalAtual,
        oFormulario.canal.confereSusepBloqueada !== false, idAtual);
      Formulario.preencher(corpo, osValores.valores);
      elemento('modal-do-sistema').innerHTML = desenharDoSistema(osValores.doSistema);
      elemento('modal-salvar').disabled = false;
    }

    function falhou(erro) {
      deuErro = true;
      mostrarRecadoDeErro(erro);
    }

    if (guardado) {
      oFormulario = guardado;
    } else {
      Servidor.chamar('formularioDoCanal', canalAtual)
        .entao(function (definicao) {
          formularioDeCadaCanal[canalAtual] = definicao;
          oFormulario = definicao;
          quandoAsDuasChegarem();
        })
        .senao(falhou);
    }

    Servidor.chamar('casoParaEditar', canalAtual, idAtual)
      .entao(function (caso) {
        osValores = caso;
        quandoAsDuasChegarem();
      })
      .senao(falhou);
  }

  /*
    O que está na planilha e o formulário não pergunta, embaixo, como leitura.

    Atrás de um aviso, e não misturado aos campos: quem lê precisa saber que
    aquilo o sistema escreveu, e que não se edita no formulário. Sem o aviso,
    "Quem mudou o status" pareceria um campo que a pessoa esqueceu de
    preencher.
  */
  function desenharDoSistema(linhas) {
    if (!linhas || !linhas.length) return '';
    return '<section class="modal-pares">'
      + '<p class="pares-do-sistema">Também está na planilha — escrito pelo '
      + 'sistema, não se edita no formulário.</p>'
      + linhas.map(function (linha) {
        return '<div class="par-do-caso do-sistema">'
          + '<span>' + escapar(linha.rotulo) + '</span>'
          + '<strong>' + escapar(linha.valor) + '</strong></div>';
      }).join('')
      + '</section>';
  }

  /**
   * O caso não abriu: o motivo no lugar do formulário, e só o Fechar.
   *
   * O motivo vai no CORPO, e não só no rodapé. "Abrindo o caso…" parado no
   * meio da tela, com o motivo escondido num canto, é o que se lê como "a tela
   * travou".
   */
  function mostrarRecadoDeErro(erro) {
    var corpo = corpoDaEdicao();
    if (!corpo) return;
    corpo.innerHTML = '<p class="carregando-campos erro-carga">'
      + escapar(erro.message || String(erro)) + '</p>';
    var subtitulo = elemento('modal-subtitulo');
    if (subtitulo) subtitulo.textContent = 'Não deu para abrir';
    var salvarBotao = elemento('modal-salvar');
    if (salvarBotao) salvarBotao.disabled = true;
  }

  function recado(texto, tipo) {
    var caixa = elemento('recado-do-modal');
    if (!caixa) return;
    caixa.className = 'recado ' + (tipo || '');
    caixa.textContent = texto;
    caixa.hidden = !texto;
  }

  function salvar() {
    if (salvando) return;
    var corpo = corpoDaEdicao();
    // Formulário ainda não chegou: o botão está travado, e o Ctrl+Enter não
    // pode ser a porta dos fundos que grava um caso vazio.
    if (!corpo || elemento('modal-salvar').disabled) return;

    salvando = true;
    Formulario.limparErros(corpo);
    recado('Gravando…', '');
    // Os três pontinhos no botão, e nenhum botão do modal clicável enquanto a
