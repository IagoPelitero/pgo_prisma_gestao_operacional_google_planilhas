<script>
/* ============================================================================
   PGO — Aplicacao.html · a ponte com o servidor, o roteador e as telas
   ============================================================================
   Três coisas moram aqui:

     Servidor   embrulha o google.script.run, que é como o navegador conversa
                com o Apps Script. Ele é ASSÍNCRONO e não devolve promessa por
                conta própria — por isso o embrulho, para o resto do código
                poder escrever `.entao(...)` em vez de empilhar retornos.

     Rotas      o que cada item do menu mostra. Trocar de tela não recarrega a
                página: o Apps Script serve UMA página, e o miolo é trocado.

     Aplicacao  liga tudo: pede o pacote de partida, monta a moldura, cuida do
                tema e do teclado.
   ============================================================================ */

/* ------------------------------------------------------------- o servidor */
var Servidor = (function () {

  /*
    QUANTAS VEZES A TELA JÁ TROCOU.

    O Apps Script responde quando responde, e ninguém espera parado: dá tempo
    de sobra para clicar em Configurações, achar que demorou, e ir para o
    Trabalho antes de a resposta chegar. Quando ela chega, o código que ia
    desenhá-la procura um elemento que não existe mais e estoura com
    "Cannot set properties of null" — um erro que não diz nada sobre o que a
    pessoa fez, e que só aparece para quem está com o console aberto.

    O contador resolve isso sem ninguém precisar lembrar: a resposta só é
    entregue se a tela que perguntou ainda for a tela da vez. Descartar aqui
    não esconde erro nenhum — é uma resposta para uma pergunta que ninguém
    está mais fazendo.
  */
  var geracaoDaTela = 0;

  /*
    QUANTO TEMPO ESPERAR ANTES DE DESISTIR.

    O Apps Script tem seis minutos de teto por execução, e as chamadas do dia
    a dia não chegam perto: abrir uma tela, gravar um caso, buscar. Para elas,
    quarenta segundos é folga de sobra — e é o que separa "está demorando" de
    "não vem mais".

    ISTO EXISTE PORQUE HÁ FALHA QUE NÃO CHEGA AO withFailureHandler. Quando a
    função não existe, quando a resposta não consegue atravessar a fronteira,
    quando a execução morre do outro lado — em alguns desses casos nada volta,
    nem sucesso nem erro. A tela fica no "Lendo o cadastro…" para sempre, sem
    uma linha no console, e o sintoma não diz nada sobre a causa.

    Uma tela parada é o pior estado possível: ela não funciona e não avisa.
    Desistir e explicar é melhor do que esperar para sempre.
  */
  var SEGUNDOS_ATE_DESISTIR = 40;

  /*
    E AS CHAMADAS QUE TRABALHAM DE VERDADE — importar, arquivar a auditoria,
    gerar uma análise, rodar o diagnóstico — esperam o teto do Apps Script
    (6 minutos) e mais uma folga. Com 40 segundos, uma importação de 2.000
    linhas num horário cheio era dada como perdida enquanto o servidor
    terminava de gravar — e quem tentasse de novo importava duas vezes.
    Quem chama assim é `Servidor.chamarSemPressa`.
  */
  var SEGUNDOS_DAS_CHAMADAS_LONGAS = 380;

  /** Chamada pelo roteador, toda vez que o miolo é remontado. */
  function trocouDeTela(tela) {
    geracaoDaTela++;
    if (tela) telaDaVez = tela;
    // A tela que esperava saiu: a resposta dela será descartada, e o aviso de
    // demora dela sai junto (F14).
    chamadasDemoradas = {};
    atualizarAvisoDeDemora();
  }

  /*
    O AVISO DE DEMORA (Etapa 88, F14).

    Passando de 8 segundos (o mesmo SEGUNDOS_DA_CHAMADA_LENTA que já vai para a
    aba ERROS), a pessoa via só a tela parada, e clicava de novo. Agora aparece,
    na pilha dos avisos do canto, o texto pedido pelo PO. Ele fica enquanto
    houver chamada demorada esperando e sai quando a última termina; se ela
    termina em erro, sai ANTES de a tela mostrar o erro, que toma o lugar dele.

    É só um relógio no navegador: nenhuma chamada nova ao servidor. Os botões
    e o envio único seguem como estavam. As chamadas sem pressa (importar,
    diagnóstico, medir a velocidade) ficam de fora: demoram de propósito, e a
    tela delas já diz isso.
  */
  var TEXTO_DA_DEMORA = 'A consulta está demorando mais que o normal. O Prisma continua '
    + 'aguardando a resposta. Não é necessário clicar novamente.';
  var chamadasDemoradas = {};
  var ultimaChamada = 0;

  function atualizarAvisoDeDemora() {
    try {
      var aviso = document.getElementById('aviso-de-demora');
      var esperando = Object.keys(chamadasDemoradas).length > 0;
      if (!esperando) {
        if (aviso && aviso.parentNode) aviso.parentNode.removeChild(aviso);
        return;
      }
      if (aviso) return;
      var pilha = document.getElementById('avisos-flutuantes');
      if (!pilha) {
        pilha = document.createElement('div');
        pilha.id = 'avisos-flutuantes';
        pilha.className = 'avisos-flutuantes';
        pilha.setAttribute('aria-live', 'polite');
        document.body.appendChild(pilha);
      }
      aviso = document.createElement('div');
      aviso.id = 'aviso-de-demora';
      aviso.className = 'aviso-flutuante tom-atencao aviso-de-demora';
      aviso.setAttribute('role', 'status');
      aviso.textContent = TEXTO_DA_DEMORA;
      pilha.appendChild(aviso);
    } catch (erro) {
      // o aviso de demora não pode virar outro erro
    }
  }

  /*
    O ERRO QUE A PESSOA NÃO VÊ VAI PARA A ABA ERROS (Etapa 64).

    Um erro de JavaScript deixa um pedaço da tela em branco, e o único
    vestígio era o console, que ninguém abre. Agora a tela avisa o servidor,
    sem esperar resposta e sem atrapalhar ninguém. O mesmo erro, uma vez por
    página; no máximo dez por página — uma tela em laço não enche a aba.
  */
  var telaDaVez = '';
  var errosJaAvisados = {};
  var errosAvisadosNestaPagina = 0;
  var MAXIMO_DE_ERROS_POR_PAGINA = 10;

  var SEGUNDOS_DA_CHAMADA_LENTA = 8;

  function avisarSeDemorou(nomeDaFuncao, milissegundos) {
    if (milissegundos < SEGUNDOS_DA_CHAMADA_LENTA * 1000) return;
    avisarErro('lento', 'A tela esperou ' + Math.round(milissegundos / 1000) + ' s por "'
      + nomeDaFuncao + '"', '');
  }

  function avisarErro(tipo, mensagem, detalhe) {
    try {
      var texto = String(mensagem || 'Erro sem mensagem').slice(0, 1000);
      var chave = tipo + '|' + texto;
      if (errosJaAvisados[chave] || errosAvisadosNestaPagina >= MAXIMO_DE_ERROS_POR_PAGINA) return;
      errosJaAvisados[chave] = true;
      errosAvisadosNestaPagina++;
      if (typeof google === 'undefined' || !google.script || !google.script.run) return;
      var corrida = google.script.run.withFailureHandler(function () {});
      if (typeof corrida.registrarErroDaTela !== 'function') return;
      corrida.registrarErroDaTela({
        tela: telaDaVez, tipo: tipo, mensagem: texto,
        detalhe: String(detalhe || '').slice(0, 3000)
      });
    } catch (erro) {
      // avisar o erro não pode virar outro erro
    }
  }

  /**
   * Chama uma função do Apps Script.
   *
   *   Servidor.chamar('pacoteDePartida')
   *     .entao(function (resposta) { ... })
   *     .senao(function (erro) { ... });
   *
   * Fora do Apps Script (na prévia navegável), google.script não existe: o
   * gerador de prévia coloca um substituto no lugar. Por isso a checagem.
   */
  function chamar(nomeDaFuncao) {
    return chamarComPrazo(SEGUNDOS_ATE_DESISTIR, nomeDaFuncao,
      Array.prototype.slice.call(arguments, 1));
  }

  /** A mesma `chamar`, para o que demora: ver SEGUNDOS_DAS_CHAMADAS_LONGAS. */
  function chamarSemPressa(nomeDaFuncao) {
    return chamarComPrazo(SEGUNDOS_DAS_CHAMADAS_LONGAS, nomeDaFuncao,
      Array.prototype.slice.call(arguments, 1));
  }

  function chamarComPrazo(segundosAteDesistir, nomeDaFuncao, argumentos) {
    var aoDarCerto = null;
    var aoDarErrado = null;
    var minhaGeracao = geracaoDaTela;

    function aTelaAindaEAMesma() {
      if (geracaoDaTela === minhaGeracao) return true;
      console.info('Resposta de ' + nomeDaFuncao + ' descartada: a tela que '
        + 'perguntou já saiu.');
      return false;
    }

    var acompanhamento = {
      entao: function (funcao) { aoDarCerto = funcao; return acompanhamento; },
      senao: function (funcao) { aoDarErrado = funcao; return acompanhamento; }
    };

    if (typeof google === 'undefined' || !google.script || !google.script.run) {
      setTimeout(function () {
        if (aoDarErrado) {
          aoDarErrado(new Error('Esta página não está sendo servida pelo Apps '
            + 'Script, então não há servidor para chamar.'));
        }
      }, 0);
      return acompanhamento;
    }

    // O relógio de desistência. Quem responder primeiro — servidor ou relógio
    // — vence; o segundo é ignorado, para a tela não receber duas respostas.
    var jaRespondeu = false;

    // O relógio do aviso de demora (F14): só nas chamadas do dia a dia.
    var minhaChamada = ++ultimaChamada;
    var relogioDaDemora = segundosAteDesistir === SEGUNDOS_ATE_DESISTIR
      ? setTimeout(function () {
        if (jaRespondeu || geracaoDaTela !== minhaGeracao) return;
        chamadasDemoradas[minhaChamada] = true;
        atualizarAvisoDeDemora();
      }, SEGUNDOS_DA_CHAMADA_LENTA * 1000)
      : null;
    function encerrarADemora() {
      if (relogioDaDemora) clearTimeout(relogioDaDemora);
      if (!chamadasDemoradas[minhaChamada]) return;
      delete chamadasDemoradas[minhaChamada];
      atualizarAvisoDeDemora();
    }

    var relogio = setTimeout(function () {
      if (jaRespondeu) return;
      jaRespondeu = true;
      encerrarADemora();
      if (!aTelaAindaEAMesma()) return;
      // A causa mais comum é DEMORA — a planilha ocupada com outras gravações
      // ou lenta —, e não arquivo faltando (análise de 29/10, Etapa 59). Quem
      // estava gravando pode repetir: o envio único não grava duas vezes.
      var erro = new Error('O servidor não respondeu "' + nomeDaFuncao + '" em '
        + segundosAteDesistir + ' segundos. Quase sempre é demora: a planilha '
        + 'ocupada com outras gravações, ou lenta.\n\n'
        + 'Se você estava gravando, pode clicar de novo: o PGO reconhece o mesmo '
        + 'envio e não grava duas vezes. Se acontece em toda tela, mesmo com '
        + 'pouca gente usando, pode ser um arquivo .gs que não foi copiado — '
        + 'execute diagnosticoRECC() no editor, que lista o que falta.');
      avisarErro('tempo', 'O servidor não respondeu "' + nomeDaFuncao + '" em '
        + segundosAteDesistir + ' segundos', '');
      if (aoDarErrado) aoDarErrado(erro);
      else console.error(erro);
    }, segundosAteDesistir * 1000);

    // A outra metade do cronômetro (Etapa 71): quanto A TELA esperou. Tela
    // lenta com servidor rápido é fila do Google, e não a planilha.
    var saiuAs = Date.now();
    function responder(oQueFazer, valor) {
      if (jaRespondeu) return;
      jaRespondeu = true;
      clearTimeout(relogio);
      encerrarADemora();   // antes de a tela desenhar a resposta ou o erro
      // As chamadas sem pressa (importar, diagnóstico) demoram de propósito.
      if (segundosAteDesistir === SEGUNDOS_ATE_DESISTIR) avisarSeDemorou(nomeDaFuncao, Date.now() - saiuAs);
      if (!aTelaAindaEAMesma()) return;
      if (oQueFazer) oQueFazer(valor);
      else if (valor instanceof Error) console.error(valor);
    }

    var corrida = google.script.run
      .withSuccessHandler(function (resposta) { responder(aoDarCerto, resposta); })
      .withFailureHandler(function (erro) { responder(aoDarErrado, erro); });

    /*
      O DISPARO PRECISA DE TRY, e não é zelo excessivo.

      Quando a função NÃO EXISTE no servidor — o arquivo .gs ficou para trás na
      cópia, ou alguém renomeou a função e a tela não acompanhou —,
      `corrida[nomeDaFuncao]` é undefined e o `.apply` estoura AQUI, na hora,
      antes de o navegador falar com o servidor.

      Sem este try o erro escapa por fora do caminho de falha: o `.senao` nem
      chegou a ser registrado ainda (ele é chamado depois, no encadeamento), a
      tela fica parada no "Lendo o cadastro…" para sempre, e o único vestígio
      é uma linha no console que ninguém abre. Foi exatamente assim que
      apareceu, e o sintoma não tem nada a ver com a causa.

      O setTimeout é obrigatório pelo mesmo motivo: chamar aoDarErrado agora
      não adiantaria, porque `.senao` só vai ser chamado quando esta função
      retornar.
    */
    try {
      if (typeof corrida[nomeDaFuncao] !== 'function') {
        clearTimeout(relogio);
        encerrarADemora();
        throw new Error('A função "' + nomeDaFuncao + '" não existe no '
          + 'servidor. Ou o arquivo .gs dela não foi copiado para o projeto '
          + 'do Apps Script, ou ela foi renomeada lá e a tela continua '
          + 'chamando o nome antigo. Configurações › Estrutura › Rodar '
          + 'diagnóstico lista todas de uma vez.');
      }
      corrida[nomeDaFuncao].apply(corrida, argumentos);
    } catch (erro) {
      avisarErro('servidor', erro.message, nomeDaFuncao);
      setTimeout(function () {
        if (aoDarErrado) aoDarErrado(erro);
        else console.error(erro);
      }, 0);
    }
    return acompanhamento;
  }

  /**
   * Um CÓDIGO DE ENVIO novo (Etapa 59). O formulário guarda o mesmo código
   * até a gravação dar certo: o servidor não grava duas vezes o mesmo código,
   * e é isso que deixa clicar de novo depois dos 40 segundos sem duplicar.
   */
  function novoEnvio() {
    return Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 12);
  }

  return {
    chamar: chamar, chamarSemPressa: chamarSemPressa, trocouDeTela: trocouDeTela,
    novoEnvio: novoEnvio, avisarErro: avisarErro
  };
})();

// Todo erro de JavaScript que escapar de uma tela, e toda promessa recusada
// sem quem a tratasse, vão para a aba ERROS (Etapa 64).
if (typeof window !== 'undefined' && window.addEventListener) {
  window.addEventListener('error', function (evento) {
    // "ResizeObserver loop…" é um aviso do navegador, e não um erro da tela:
    // nada quebra. Na aba ERROS do PO eram 23 linhas de ruído (Etapa 76).
    if (/^ResizeObserver loop/.test(String(evento.message || ''))) return;
    var pilha = evento.error && evento.error.stack ? evento.error.stack : '';
    Servidor.avisarErro('javascript', evento.message,
      (evento.filename || '') + ':' + (evento.lineno || '') + (pilha ? '\n' + pilha : ''));
  });
  window.addEventListener('unhandledrejection', function (evento) {
    var motivo = evento.reason;
    Servidor.avisarErro('javascript', motivo && motivo.message ? motivo.message : String(motivo),
      motivo && motivo.stack ? motivo.stack : '');
  });
}

/* ----------------------------------------------------------------- rotas */
var Rotas = (function () {

  var TELAS = {
    trabalho: {
      titulo: 'Trabalho',
      subtitulo: 'Visão do dia: indicadores e a fila de trabalho da sua equipe.',
      montar: function (pacote) { return TelaTrabalho.montar(pacote); },
      ligar: function (pacote) { TelaTrabalho.ligar(pacote); }
    },
    cadastrarCaso: {
      titulo: 'Cadastrar Caso',
      subtitulo: 'Registro de um caso novo, com o formulário montado pelo canal.',
      montar: function (pacote) { return TelaCadastrarCaso.montar(pacote); },
      ligar: function (pacote) { TelaCadastrarCaso.ligar(pacote); },
      desligar: function () { TelaCadastrarCaso.desligar(); },
      // Antes de sair com o formulário preenchido, pergunta (Etapa 87, F2).
      podeSair: function (seguir) { return TelaCadastrarCaso.podeSair(seguir); }
    },
    buscarCaso: {
      titulo: 'Buscar Caso',
      subtitulo: 'Encontre um caso pelo protocolo, pela apólice ou pelo segurado.',
      montar: function (pacote) { return TelaBuscarCaso.montar(pacote); },
      ligar: function (pacote) { TelaBuscarCaso.ligar(pacote); }
    },
    tabelaCorretoras: {
      titulo: 'Tabela de Corretoras',
      subtitulo: 'Canais, corretores e agentes, com segmento e situação da SUSEP.',
      montar: function (pacote) { return TelaTabelaCorretoras.montar(pacote); },
      ligar: function (pacote) { TelaTabelaCorretoras.ligar(pacote); },
      desligar: function () { TelaTabelaCorretoras.desligar(); }
    },
    importacao: {
      titulo: 'Importação',
      subtitulo: 'Traga uma base inteira de outra planilha e divida entre os analistas.',
      montar: function (pacote) { return TelaImportacao.montar(pacote); },
      ligar: function (pacote) { TelaImportacao.ligar(pacote); }
    },
    produtividade: {
      titulo: 'Produtividade RECC',
      subtitulo: 'Explore dados e identifique oportunidades para a operação.',
      montar: function (pacote) { return TelaProdutividade.montar(pacote); },
      ligar: function (pacote) { TelaProdutividade.ligar(pacote); },
      desligar: function () { TelaProdutividade.desligar(); }
    },
    configuracoes: {
      titulo: 'Configurações',
      subtitulo: 'Personalize o sistema de acordo com a realidade da sua operação.',
      montar: function (pacote) { return TelaConfiguracoes.montar(pacote); },
      ligar: function (pacote) { TelaConfiguracoes.ligar(pacote); },
      desligar: function () { TelaConfiguracoes.desligar(); }
    }
  };

  function existe(tela) { return Object.prototype.hasOwnProperty.call(TELAS, tela); }
  function pegar(tela) { return TELAS[tela]; }

  return { existe: existe, pegar: pegar };
})();

/* ------------------------------------------------------------- aplicação */
var Aplicacao = (function () {
  var pacote = null;
  var telaAtual = '';

  function elemento(id) { return document.getElementById(id); }

  /**
   * O nome que a tela tem HOJE, que é o mesmo que o menu mostra.
   *
   * O título do menu é configurável desde que o PO renomeou "Trabalho" para
   * "Trabalho" — mas o cabeçalho da página vinha da tabela de rotas, escrito à
   * mão. O resultado era um menu dizendo "Trabalho" e a página, logo ao lado,
   * dizendo "Trabalho": duas respostas para a mesma pergunta, na mesma tela.
   *
   * O título da rota continua servindo de reserva, para o caso de uma tela que
   * o servidor não listou (sem permissão de ver, por exemplo).
   */
  function tituloDaTela(tela, seNaoAchar) {
    var achado = (pacote.menu || []).filter(function (item) {
      return item.tela === tela;
    })[0];
    return achado && achado.titulo ? achado.titulo : seNaoAchar;
  }

  /* -- tema -------------------------------------------------------------- */
  function aplicarTema(tema) {
    document.documentElement.setAttribute('data-tema', tema);
    if (pacote) pacote.tema = tema;
    var bolinhas = document.querySelectorAll('.tema');
    for (var i = 0; i < bolinhas.length; i++) {
      bolinhas[i].setAttribute('aria-pressed',
        bolinhas[i].getAttribute('data-tema') === tema ? 'true' : 'false');
    }
  }

  function trocarTema(tema) {
    aplicarTema(tema);
    // Guarda no servidor para o tema seguir a pessoa em qualquer computador.
    // Falhar aqui não pode desfazer a troca na tela: é preferência, não dado.
    Servidor.chamar('salvarTemaDoUsuario', tema).senao(function (erro) {
      console.warn('Não consegui guardar o tema: ' + erro.message);
    });
  }

  /* -- navegação --------------------------------------------------------- */
  function podeVer(tela) {
    for (var i = 0; i < pacote.menu.length; i++) {
      if (pacote.menu[i].tela === tela) return true;
    }
    return false;
  }

  /**
   * Troca a tela do miolo.
   *
   * A guarda de rota vive AQUI, e não no menu: esconder o item não impede
   * ninguém de digitar o endereço da tela. E o servidor confere de novo em
   * cada função — esconder botão nunca foi segurança.
   */
  function irPara(tela, semHistorico, semPerguntar) {
    /*
      A TELA QUE SAI PODE PEDIR PARA PERGUNTAR ANTES (Etapa 87, F2): o
      Cadastrar Caso com o formulário preenchido. Vale para todo caminho que
      passa por aqui — o menu, a busca do alto, o voltar do navegador (o
      endereço volta a ser o desta tela) e o botão de recarregar a tela.
      Vem antes de tudo: trocar de tela descartaria as respostas a caminho.
    */
    if (!semPerguntar && telaAtual && Rotas.existe(telaAtual)) {
      var saindo = Rotas.pegar(telaAtual);
      if (saindo.podeSair && !saindo.podeSair(function () { irPara(tela, false, true); })) {
        if (location.hash !== '#' + telaAtual) location.hash = telaAtual;
        return;
      }
    }

    // Antes de qualquer coisa: o que estava a caminho era para a tela antiga.
    Servidor.trocouDeTela(tela);

    if (!Rotas.existe(tela) || !podeVer(tela)) {
      tela = pacote.menu.length ? pacote.menu[0].tela : 'trabalho';
    }

    // A tela que sai precisa poder se despedir: quem registrou atalho de
    // teclado tem de removê-lo, senão o Ctrl+Enter do cadastro continuaria
    // valendo dentro da Produtividade RECC.
    if (telaAtual && Rotas.existe(telaAtual)) {
      var anterior = Rotas.pegar(telaAtual);
      if (anterior.desligar) anterior.desligar();
    }
    telaAtual = tela;

    var definicao = Rotas.pegar(tela);
    var comoSeChama = tituloDaTela(tela, definicao.titulo);

    elemento('superior').innerHTML = Moldura.montarSuperior(pacote);
    elemento('lateral').innerHTML = Moldura.montarLateral(pacote, tela);
    // As marcas que o CSS lê no lugar de `:has()`: qual tela está no miolo,
    // e que a casca (com o menu) está na frente — o diálogo, que mora fora
    // dela, se centra à direita do menu por isso.
    elemento('miolo').setAttribute('data-tela', tela);
    document.body.classList.add('com-casca');
    elemento('miolo').innerHTML = '<div class="cabecalho-da-tela">'
      + '<div class="titulo-da-tela">'
      + '<h2>' + Moldura.escapar(comoSeChama) + '</h2>'
      + '<p>' + Moldura.escapar(definicao.subtitulo) + '</p>'
      + '</div></div>'
      + definicao.montar(pacote);
    // O seletor de canal sobe para a linha do título (Etapa 90, proposta
    // aprovada). Ele continua sendo o mesmo: as telas o procuram pela classe.
    var seletor = elemento('miolo').querySelector(':scope > .canais');
    if (seletor) elemento('miolo').querySelector('.cabecalho-da-tela').appendChild(seletor);
    document.title = pacote.identidade.nome + ' — ' + comoSeChama;
    medirABarraSuperior();

    ligarMoldura();
    if (definicao.ligar) definicao.ligar(pacote);
    fecharMenu();
    elemento('miolo').focus();

    if (!semHistorico && location.hash !== '#' + tela) {
      location.hash = tela;
    }
  }

  /*
    A ALTURA DA BARRA DE CIMA (Etapa 90): o cabeçalho fixo da fila (V3) gruda
    logo abaixo dela, e ela muda de altura quando o título quebra em duas
    linhas. Medida a cada tela e a cada mudança do tamanho da janela.
  */
  var jaMedeAoRedimensionar = false;
  function medirABarraSuperior() {
    var barra = elemento('superior');
    if (barra) document.documentElement.style.setProperty('--altura-da-barra-superior', barra.offsetHeight + 'px');
    if (!jaMedeAoRedimensionar) {
      jaMedeAoRedimensionar = true;
      window.addEventListener('resize', medirABarraSuperior);
    }
  }

  function telaDoEndereco() {
    return String(location.hash || '').replace(/^#/, '');
  }

  /* -- menu em tela estreita --------------------------------------------- */
  function abrirMenu() { elemento('aplicacao').classList.add('menu-aberto'); }
  function fecharMenu() { elemento('aplicacao').classList.remove('menu-aberto'); }

  function alternarEncolhido() {
    var aplicacao = elemento('aplicacao');
    var encolhida = aplicacao.classList.toggle('encolhida');
    document.body.classList.toggle('menu-encolhido', encolhida);
    try {
      localStorage.setItem('recc.menuEncolhido', encolhida ? 'sim' : 'nao');
    } catch (erro) {
      // Navegador com armazenamento bloqueado: o menu volta ao normal na
      // próxima abertura, e só. Não vale derrubar a tela por causa disso.
    }
  }

  function restaurarEncolhido() {
    try {
      if (localStorage.getItem('recc.menuEncolhido') === 'sim') {
        elemento('aplicacao').classList.add('encolhida');
        document.body.classList.add('menu-encolhido');
      }
    } catch (erro) { /* idem */ }
  }

  /* -- eventos da moldura, religados a cada troca de tela ---------------- */
  function ligarMoldura() {
    var itens = document.querySelectorAll('.lateral-item');
    for (var i = 0; i < itens.length; i++) {
      itens[i].addEventListener('click', function () {
        irPara(this.getAttribute('data-tela'));
      });
    }

    var bolinhas = document.querySelectorAll('.tema');
    for (var t = 0; t < bolinhas.length; t++) {
      bolinhas[t].addEventListener('click', function () {
        trocarTema(this.getAttribute('data-tema'));
      });
    }

    var encolher = elemento('encolher');
    if (encolher) encolher.addEventListener('click', alternarEncolhido);

    var abrir = elemento('abrir-menu');
    if (abrir) abrir.addEventListener('click', abrirMenu);

    // A busca da barra: Enter leva ao Buscar Caso, que já abre procurando.
    var buscaGlobal = elemento('busca-global');
    if (buscaGlobal) buscaGlobal.addEventListener('keydown', function (evento) {
      if (evento.key !== 'Enter') return;
      evento.preventDefault();
      var termo = this.value.trim();
      if (!termo) return;
      TelaBuscarCaso.procurarPor(termo);
      irPara('buscarCaso');
    });

    var recarregar = elemento('recarregar');
    if (recarregar) recarregar.addEventListener('click', function () {
      // remontar() refaz a tela atual pelo mesmo caminho de sempre: a tela
      // pede os dados dela ao servidor outra vez. Não é location.reload(),
      // que recomeçaria pelo doGet e custaria uma viagem inteira a mais.
      this.classList.add('girando');
      Aplicacao.remontar();
    });

    var veu = elemento('veu');
    if (veu) veu.addEventListener('click', fecharMenu);
  }

  function ligarTeclado() {
    document.addEventListener('keydown', function (evento) {
      if ((evento.ctrlKey || evento.metaKey) && evento.key === 'k') {
        evento.preventDefault();
        var busca = elemento('busca-global');
        if (busca) busca.focus();
      }
      if (evento.key === 'Escape') fecharMenu();
    });
    window.addEventListener('hashchange', function () {
      var tela = telaDoEndereco();
      if (tela && tela !== telaAtual) irPara(tela, true);
    });
  }

  /* -- abertura ---------------------------------------------------------- */
  function recusar(motivo) {
    elemento('carregando').hidden = true;
    elemento('recusado').hidden = false;
    elemento('recusado-motivo').textContent = motivo;
  }

  /**
   * O pacote que veio dentro da página, se veio.
   *
   * O doGet o entrega junto com o HTML, e é o que evita uma viagem inteira ao
   * servidor só para repetir o que ele acabou de calcular. Mas a tela NÃO
   * depende disso: se a injeção falhar — arquivo antigo no Apps Script, um
   * JSON que não fecha, qualquer coisa —, ela pergunta ao servidor como
   * sempre fez. Atalho sem volta vira um jeito novo de quebrar.
   */
  function pacoteQueVeioNaPagina() {
    try {
      var pronto = window.PGO_PACOTE_DE_PARTIDA;
      if (pronto && typeof pronto === 'object' && 'disponivel' in pronto) {
        return pronto;
      }
    } catch (erro) {
      // Página servida sem a injeção. Segue pelo caminho longo.
    }
    return null;
  }

  function iniciar() {
    var pronto = pacoteQueVeioNaPagina();
    if (pronto) { abrirCom(pronto); return; }

    Servidor.chamar('pacoteDePartida')
      .entao(function (resposta) {
        if (!resposta || !resposta.disponivel) {
          // Nunca deixar a falha virar um menu vazio: menu vazio é lido como
          // "não tenho acesso" e manda a pessoa procurar no lugar errado.
          recusar((resposta && resposta.motivo)
            || 'O servidor não explicou o motivo.');
          return;
        }
        abrirCom(resposta);
      })
      .senao(function (erro) {
        recusar(erro && erro.message ? erro.message : String(erro));
      });
  }

  /** Monta a casca a partir do pacote, tenha ele vindo por onde tiver vindo. */
  function abrirCom(resposta) {
    if (!resposta || !resposta.disponivel) {
      // Nunca deixar a falha virar um menu vazio: menu vazio é lido como
      // "não tenho acesso" e manda a pessoa procurar no lugar errado.
      recusar((resposta && resposta.motivo)
        || 'O servidor não explicou o motivo.');
      return;
    }
    pacote = resposta;
    if (pacote.identidade && pacote.identidade.corPrimaria) {
      // Em --cor-da-operacao, e não em --destaque: escrever direto no
      // destaque pintaria os quatro temas com a cor da operação, e o
      // rosa ficaria com botões azuis.
      document.documentElement.style.setProperty(
        '--cor-da-operacao', pacote.identidade.corPrimaria);
    }
    elemento('carregando').hidden = true;
    elemento('aplicacao').hidden = false;
    restaurarEncolhido();
    aplicarTema(pacote.tema || 'padrao');
    irPara(telaDoEndereco() || 'trabalho', true);
    ligarTeclado();
  }

  /**
   * Redesenha a tela atual — usada quando ela mesma muda de estado.
   * `semPerguntar`: a tela já perguntou antes de pedir (o Cadastrar, ao trocar
   * de canal). O botão de recarregar do alto chama sem, e pergunta.
   */
  function remontar(semPerguntar) {
    if (telaAtual) irPara(telaAtual, true, semPerguntar === true);
  }

  return {
    iniciar: iniciar,
    irPara: irPara,
    remontar: remontar
  };
})();

document.addEventListener('DOMContentLoaded', Aplicacao.iniciar);
</script>
