<script>
/* ============================================================================
   PGO — CadastrarCaso.html · a tela que grava
   ============================================================================
   A tela não sabe quais campos existem. Ela pergunta ao servidor, recebe a
   definição e pede ao Formulario que desenhe. Campo criado em Configurações
   aparece aqui sozinho; campo escondido para o nível nem chega a ser enviado.

   Quem desenha, mascara e marca erro é o Formulario — o mesmo que o modal de
   edição do Trabalho usa. Duas cópias do mesmo formulário divergiriam no
   primeiro ajuste.
   ============================================================================ */

var TelaCadastrarCaso = (function () {

  var canalEscolhido = '';
  var salvando = false;
  // O código de envio deste caso (Etapa 59): o mesmo até gravar, para o clique
  // repetido depois dos 40 segundos não cadastrar o caso duas vezes.
  var envio = '';

  function escapar(texto) { return Moldura.escapar(texto); }
  function elemento(id) { return document.getElementById(id); }
  function corpo() { return elemento('corpo-do-formulario'); }

  /* --------------------------------------------------------------- montar */

  /*
    NA MESA, DOIS FORMULÁRIOS (Etapa 79, pedido do PO): o do caso e o da reunião
    com corretor — "um formulário diferente em Cadastrar Caso". A reunião vai
    para a Agenda, na segunda base, e não para a base de casos.
  */
  var oQueCadastrar = 'caso';
  var temAgenda = false;
  var envioDaReuniao = '';
  // O pacote de partida: as permissões dizem que botões o cadastro concluído
  // oferece (Etapa 86).
  var pacoteDaTela = null;

  /*
    NÃO PERDER O QUE FOI DIGITADO (Etapa 87, F2).

    Trocar de canal, trocar entre Caso e Reunião, ir para outra tela do
    Prisma ou recarregar e fechar a página jogavam fora o formulário sem
    perguntar. O retrato abaixo é o formulário como ele acabou de montar
    (com os padrões); havendo diferença, pergunta antes — a mesma pergunta do
    "Trabalhar no caso". Fica SÓ na memória da página: nada de rascunho no
    navegador, nem CPF, nem nome (decisão do PO). null: não há formulário
    (carregando, ou o cadastro concluído no lugar dele).
  */
  var retratoDoCadastro = null;

  function retratoDoCadastroAgora() {
    if (oQueCadastrar === 'reuniao') {
      var daReuniao = elemento('corpo-da-reuniao');
      var acoesDaReuniao = elemento('acoes-da-reuniao');
      if (!daReuniao || !acoesDaReuniao || acoesDaReuniao.hidden) return null;
      return JSON.stringify(Agenda.valores(daReuniao));
    }
    var acoes = elemento('acoes-do-caso');
    if (!corpo() || !acoes || acoes.hidden) return null;
    return JSON.stringify(Formulario.valores(corpo()));
  }

  function guardarRetratoDoCadastro() { retratoDoCadastro = retratoDoCadastroAgora(); }

  function temAlteracaoNoCadastro() {
    if (retratoDoCadastro === null) return false;
    var agora = retratoDoCadastroAgora();
    return agora !== null && agora !== retratoDoCadastro;
  }

  /** Segue já, ou depois de a pessoa escolher descartar. */
  function depoisDePerguntar(seguir) {
    if (!temAlteracaoNoCadastro()) { seguir(); return; }
    Formulario.confirmarDescarte(function () {
      retratoDoCadastro = null;
      seguir();
    });
  }

  /**
   * A moldura pergunta antes de trocar de tela (Aplicacao.irPara): true, pode
   * sair; false, a pergunta está na tela e `seguir` é chamado se descartar.
   */
  function podeSair(seguir) {
    if (!temAlteracaoNoCadastro()) return true;
    depoisDePerguntar(seguir);
    return false;
  }

  /** Recarregar ou fechar a página: o aviso do próprio navegador. */
  function aoSairDaPagina(evento) {
    if (!temAlteracaoNoCadastro()) return undefined;
    evento.preventDefault();
    evento.returnValue = '';
    return '';
  }

  function abasDaMesa() {
    if (!temAgenda) return '';
    return '<div class="config-abas" role="tablist" aria-label="O que cadastrar">'
      + [['caso', 'Caso'], ['reuniao', 'Reunião com corretor']].map(function (aba) {
        var atual = oQueCadastrar === aba[0];
        return '<button type="button" role="tab" class="config-aba' + (atual ? ' atual' : '') + '"'
          + ' aria-selected="' + atual + '" data-o-que-cadastrar="' + aba[0] + '">' + aba[1] + '</button>';
      }).join('') + '</div>';
  }

  function montarReuniao() {
    return '<div class="cartao formulario" id="formulario-da-reuniao">'
      + '<div id="corpo-da-reuniao"><p class="carregando-campos" role="status">Montando o formulário…</p></div>'
      + '<div class="acoes" id="acoes-da-reuniao" hidden>'
      + '<button type="button" class="botao" id="registrar-reuniao-nova">Registrar reunião</button>'
      + '<span class="falta-preencher" id="falta-na-reuniao-nova" aria-live="polite"></span>'
      + '</div></div>';
  }

  function ligarReuniao() {
    var camposDaReuniao = [];
    Servidor.chamar('formularioDaReuniao', canalEscolhido)
      .entao(function (resposta) {
        camposDaReuniao = resposta.campos;
        elemento('corpo-da-reuniao').innerHTML = Agenda.formulario(resposta.campos, null);
        elemento('acoes-da-reuniao').hidden = false;
        guardarRetratoDoCadastro();
      })
      .senao(function (erro) {
        elemento('corpo-da-reuniao').innerHTML = '<p class="carregando-campos erro-carga" role="alert">'
          + escapar(erro.message || String(erro)) + '</p>';
      });

    elemento('registrar-reuniao-nova').addEventListener('click', function () {
      var botao = this;
      var aviso = elemento('falta-na-reuniao-nova');
      var lidos = Agenda.valores(elemento('corpo-da-reuniao'));
      var falta = Agenda.oQueFalta(camposDaReuniao, lidos);
      aviso.textContent = falta.length ? 'Falta preencher: ' + falta.join(', ') : '';
      if (falta.length) return;

      botao.disabled = true;
      if (!envioDaReuniao) envioDaReuniao = Servidor.novoEnvio();
      Servidor.chamar('registrarReuniao', canalEscolhido, lidos, envioDaReuniao)
        .entao(function () {
          envioDaReuniao = '';
          botao.disabled = false;
          Moldura.toast('Reunião registrada na Agenda.', 'bom');
          elemento('corpo-da-reuniao').innerHTML = Agenda.formulario(camposDaReuniao, null);
          guardarRetratoDoCadastro();
        })
        .senao(function (erro) {
          botao.disabled = false;
          aviso.textContent = erro.message || String(erro);
        });
    });
  }

  function montar(pacote) {
    pacoteDaTela = pacote;
    if (!canalEscolhido && pacote.canais.length) canalEscolhido = pacote.canais[0].id;
    temAgenda = Agenda.ehDaMesa(pacote.canais, canalEscolhido);
    if (!temAgenda) oQueCadastrar = 'caso';

    if (oQueCadastrar === 'reuniao') {
      return SeletorDeCanal.montar(pacote.canais, canalEscolhido) + abasDaMesa() + montarReuniao();
    }
    return SeletorDeCanal.montar(pacote.canais, canalEscolhido)
      + abasDaMesa()
      // As seções em blocos, com o índice ao lado (Etapa 90, proposta aprovada).
      + '<div class="cadastro-em-blocos">'
      + '<nav class="indice-do-cadastro" id="indice-do-cadastro" aria-label="Seções do formulário" hidden></nav>'
      + '<form class="cartao formulario" id="formulario-do-caso" novalidate>'
      + '<div id="corpo-do-formulario"><p class="carregando-campos" role="status">'
      + 'Montando o formulário…</p></div>'
      // As ações nascem ESCONDIDAS e só aparecem com o formulário montado.
      // Pedido do PO: nos testes, a equipe via "Cadastrar caso" e "Limpar"
      // enquanto o formulário ainda carregava e achava que devia clicar.
      + '<div class="acoes" id="acoes-do-caso" hidden>'
      + '<button type="submit" class="botao" id="salvar-caso">Cadastrar caso</button>'
      + '<button type="button" class="botao-secundario" id="limpar-caso">Limpar</button>'
      + '<span class="atalho">ou <kbd>Ctrl</kbd> + <kbd>Enter</kbd></span>'
      // O que ainda falta para o botão acender (Etapa 75).
      + '<span class="falta-preencher" id="falta-no-caso" aria-live="polite"></span>'
      + '<span class="recado" id="recado-do-caso" hidden></span>'
      + '</div></form></div>';
  }

  /*
    O ÍNDICE DAS SEÇÕES (Etapa 90, proposta aprovada pelo PO). As seções vêm
    de Configurações (o campo "Seção do formulário"); o índice só as mostra,
    com ✓ quando nada obrigatório falta nela e "N obrigatório(s)" quando
    falta. Quem diz o que falta é a mesma regra do botão (camposQueFaltam).
  */
  // A seção onde está o cursor: o índice a mostra em destaque (aprovado).
  var secaoAtual = '';
  function desenharIndice() {
    var indice = elemento('indice-do-cadastro');
    var secoes = corpo() ? corpo().querySelectorAll('fieldset.secao') : [];
    if (!indice || secoes.length < 2) { if (indice) indice.hidden = true; return; }
    var faltam = Formulario.camposQueFaltam(corpo());
    var itens = Array.prototype.map.call(secoes, function (secao, i) {
      secao.id = secao.id || 'secao-do-cadastro-' + (i + 1);
      var quantos = faltam.filter(function (campo) { return secao.contains(campo); }).length;
      var preenchido = Array.prototype.some.call(secao.querySelectorAll('[data-chave]'),
        function (campo) { return !campo.disabled && String(campo.value || '').trim() !== ''; });
      var comErro = !!secao.querySelector('.campo.com-erro');
      secao.classList.toggle('com-erro', comErro);
      var nome = secao.querySelector('legend') ? secao.querySelector('legend').textContent : 'Seção ' + (i + 1);
      var atual = secao.id === secaoAtual;
      return '<li><button type="button" class="indice-item' + (comErro ? ' com-erro' : '') + (atual ? ' atual' : '')
        + '"' + (atual ? ' aria-current="true"' : '') + ' data-ir-para-secao="' + secao.id + '">'
        + '<span class="indice-numero">' + (i + 1) + '</span>'
        + '<span class="indice-nome">' + escapar(nome) + '</span>'
        + (quantos ? '<span class="indice-falta">' + quantos + (quantos === 1 ? ' obrigatório' : ' obrigatórios') + '</span>'
          : (preenchido ? '<span class="indice-ok" aria-label="completa">' + Moldura.icone('confirmado') + '</span>' : ''))
        + '</button></li>';
    });
    var html = '<ol>' + itens.join('') + '</ol>'
      + '<p class="indice-nota">As seções e os campos vêm de Configurações › Cadastrar Caso.</p>';
    indice.hidden = false;
    // Só redesenha quando mudou: o "change" de quem sai de um campo para
    // clicar no índice chega no meio do clique, e trocar o botão debaixo do
    // mouse perderia o clique.
    if (indice.getAttribute('data-desenhado') !== html) {
      indice.innerHTML = html;
      indice.setAttribute('data-desenhado', html);
    }
    if (indice.getAttribute('data-clique-ligado') === 'sim') return;
    indice.setAttribute('data-clique-ligado', 'sim');
    // Um ouvinte só, no índice: vale para os botões de qualquer redesenho.
    // Com o mouse, age no "mousedown" — antes de o campo que se deixa perder
    // o foco (o que pode marcar o erro e redesenhar o índice debaixo do
    // clique). Pelo teclado (Enter, Espaço), o "click" de sempre.
    function botaoDo(evento) {
      return evento.target && evento.target.closest ? evento.target.closest('[data-ir-para-secao]') : null;
    }
    indice.addEventListener('mousedown', function (evento) {
      var botao = botaoDo(evento);
      if (!botao || evento.button !== 0) return;
      evento.preventDefault();
      irParaASecao(botao);
    });
    indice.addEventListener('click', function (evento) {
      var botao = botaoDo(evento);
      if (botao && evento.detail === 0) irParaASecao(botao);
    });
  }

  function irParaASecao(botao) {
    var secao = document.getElementById(botao.getAttribute('data-ir-para-secao'));
    if (!secao) return;
    secao.scrollIntoView({ block: 'start' });
    // O primeiro campo À VISTA: o condicional escondido não recebe o cursor.
    var campos = secao.querySelectorAll('input:not([disabled]), select:not([disabled]), textarea:not([disabled])');
    for (var c = 0; c < campos.length; c++) {
      var bloco = campos[c].closest('[data-campo]');
      if (bloco && bloco.hidden) continue;
      if (campos[c].type === 'hidden') continue;
      campos[c].focus({ preventScroll: true });
      break;
    }
  }

  /*
    V4 (Etapa 90, aprovado): o erro no próprio campo. O botão fica apagado até
    os obrigatórios estarem preenchidos (pedido do PO), então o aviso não
    espera a tentativa de cadastrar: ao sair de um obrigatório vazio, o campo
    fica vermelho com "é obrigatório", a seção e o índice também; preencheu,
    sai. Os problemas que o servidor devolve continuam marcados como antes.
  */
  var AVISO_DE_OBRIGATORIO = 'é obrigatório';
  function vigiarOCampoVazio() {
    var raiz = corpo();
    if (!raiz || raiz.getAttribute('data-campo-vazio-vigiado') === 'sim') return;
    raiz.setAttribute('data-campo-vazio-vigiado', 'sim');
    raiz.addEventListener('focusout', function (evento) {
      var campo = evento.target;
      if (!campo || campo.getAttribute('aria-required') !== 'true' || campo.disabled) return;
      var bloco = campo.closest ? campo.closest('[data-campo]') : null;
      if (!bloco || bloco.hidden || String(campo.value || '').trim()) return;
      var aviso = bloco.querySelector('.erro');
      bloco.classList.add('com-erro');
      campo.setAttribute('aria-invalid', 'true');
      if (aviso) { aviso.textContent = AVISO_DE_OBRIGATORIO; aviso.hidden = false; }
      desenharIndice();
    });
    function conferir(evento) {
      var campo = evento.target;
      var bloco = campo && campo.closest ? campo.closest('[data-campo]') : null;
      var aviso = bloco ? bloco.querySelector('.erro') : null;
      if (bloco && aviso && aviso.textContent === AVISO_DE_OBRIGATORIO && String(campo.value || '').trim()) {
        bloco.classList.remove('com-erro');
        campo.removeAttribute('aria-invalid');
        aviso.textContent = ''; aviso.hidden = true;
      }
      desenharIndice();
    }
    raiz.addEventListener('input', conferir);
    raiz.addEventListener('change', conferir);
    raiz.addEventListener('focusin', function (evento) {
      var secao = evento.target && evento.target.closest ? evento.target.closest('fieldset.secao') : null;
      if (secao && secao.id && secao.id !== secaoAtual) { secaoAtual = secao.id; desenharIndice(); }
    });
  }

  /* ----------------------------------------------------------- comportamento */

  function carregarFormulario() {
    corpo().innerHTML = '<p class="carregando-campos" role="status">Montando o formulário…</p>';
    mostrarAsAcoes(false);

    Servidor.chamar('formularioDoCanal', canalEscolhido)
      .entao(function (resposta) {
        corpo().innerHTML = Formulario.desenhar(resposta, '');
        Formulario.ligar(corpo(), '', canalEscolhido);
        // Só no cadastro NOVO. No caso já gravado quem manda é o valor da
        // planilha — um padrão por cima dele seria perda silenciosa de dado.
        Formulario.aplicarPadroes(corpo(), resposta);
        /*
          O BOTÃO NASCE INATIVO.

          Pedido do PO: "o botão deve ficar inativo até os campos obrigatórios
          serem devidamente preenchidos". Quem acende e apaga é o Formulario,
          olhando os campos marcados com * — ver `vigiarObrigatorios`.

          Ligado DEPOIS dos padrões de propósito: campo que já nasce
          preenchido conta como preenchido, e o botão acende sozinho quando o
          formulário não tem mais nada a pedir.
        */
        Formulario.vigiarObrigatorios(corpo(), elemento('salvar-caso'), elemento('falta-no-caso'));
        vigiarOCampoVazio();
        desenharIndice();
        // Só AGORA o formulário está inteiro — desenhado, ligado e com os
        // padrões. Se der erro na carga, os botões continuam escondidos: não
        // há o que cadastrar, e o recado do erro é o que importa ler.
        mostrarAsAcoes(true);
        guardarRetratoDoCadastro();
        var primeiro = corpo().querySelector(
          'input:not([disabled]), select:not([disabled])');
        if (primeiro) primeiro.focus();
      })
      .senao(function (erro) {
        corpo().innerHTML = '<p class="carregando-campos erro-carga" role="alert">'
          + escapar(erro.message || String(erro)) + '</p>';
      });
  }

  function mostrarAsAcoes(mostrar) {
    var acoes = elemento('acoes-do-caso');
    if (acoes) acoes.hidden = !mostrar;
  }

  function recado(texto, tipo) {
    var caixa = elemento('recado-do-caso');
    caixa.className = 'recado ' + (tipo || '');
    caixa.textContent = texto;
    caixa.hidden = !texto;
  }

  function salvar() {
    if (salvando) return;
    // Formulário ainda carregando: os botões estão escondidos, e o Ctrl+Enter
    // não pode ser a porta dos fundos que manda um cadastro vazio.
    if (elemento('acoes-do-caso').hidden) return;

    /*
      A CONFERÊNCIA DOS OBRIGATÓRIOS FICA AQUI, e não só no botão.

      O botão inativo barra o clique, mas ele não é a única porta: o Enter
      dentro de um campo envia o formulário, e o Ctrl+Enter chama esta função
      direto. Sem esta guarda, as duas passariam por cima do botão travado e o
      cadastro incompleto sairia para o servidor.
    */
    var falta = Formulario.faltaPreencher(corpo());
    if (falta) {
      recado('Preencha os campos obrigatórios (marcados com *).', 'ruim');
      falta.focus();
      return;
    }

    salvando = true;
    Formulario.limparErros(corpo());
    recado('Gravando…', '');
    // Os três pontinhos no botão, e nenhum botão do formulário clicável
    // enquanto a gravação está a caminho — dois cliques gravariam dois casos.
    Formulario.comecouAGravar(elemento('salvar-caso'),
      elemento('formulario-do-caso'));

    if (!envio) envio = Servidor.novoEnvio();
    Servidor.chamar('cadastrarCaso', canalEscolhido, Formulario.valores(corpo()), envio)
      .entao(function (resposta) {
        salvando = false;
        envio = '';
        Formulario.acabouDeGravar(elemento('salvar-caso'),
          elemento('formulario-do-caso'));
        mostrarCadastroConcluido(resposta);
      })
      .senao(function (erro) {
        salvando = false;
        Formulario.acabouDeGravar(elemento('salvar-caso'),
          elemento('formulario-do-caso'));
        recado(erro.message || String(erro), 'ruim');
        if (erro.problemas) Formulario.mostrarProblemas(corpo(), erro.problemas);
        desenharIndice();   // a seção e o índice acompanham o campo com erro (V4)
      });
  }

  /*
    CADASTRO CONCLUÍDO: A PESSOA ESCOLHE O PRÓXIMO PASSO (Etapa 86, F7 + F12).

    Antes, gravar levava direto ao Trabalho (pedido do PO, "após gravar vá para
    a tela trabalho"). Mas lá, na aba 1, o caso novo entra no fim da ordem e a
    fila mostra 5: ele não aparecia, e quem cadastra vários em sequência voltava
    pelo menu e escolhia o canal de novo. Agora, no lugar do formulário:
      · TRABALHAR NO CASO abre o caso recém-cadastrado — só para quem pode
        editar; o servidor confere de novo (alcance incluído) ao abrir;
      · CADASTRAR OUTRO CASO traz o formulário limpo, no MESMO canal;
      · IR PARA O TRABALHO continua lá, para quem quer a fila.
    Nada abre sozinho: o caso só abre com o clique.
  */
  function mostrarCadastroConcluido(resposta) {
    // O índice é do formulário; com o cadastro concluído no lugar, ele sai.
    var indiceDoCadastro = elemento('indice-do-cadastro');
    if (indiceDoCadastro) indiceDoCadastro.hidden = true;
    var permissoes = (pacoteDaTela && pacoteDaTela.permissoes) || {};
    var acoes = permissoes.acoes || [];
    var telas = permissoes.telas || [];
    var podeTrabalhar = acoes.indexOf('editar') >= 0;
    var podeIrAoTrabalho = telas.indexOf('trabalho') >= 0;
    var id = String((resposta && resposta.id) || '');

    recado('', '');
    mostrarAsAcoes(false);
    corpo().innerHTML = '<div class="cadastro-concluido" id="cadastro-concluido" role="status" tabindex="-1">'
      + '<span class="cadastro-concluido-icone" aria-hidden="true">✓</span>'
      + '<div class="cadastro-concluido-texto">'
      + '<h3>Caso <strong>' + escapar(id) + '</strong> cadastrado'
      + (resposta && resposta.canal ? ' · ' + escapar(resposta.canal) : '') + '</h3>'
      + '<p>O que você quer fazer agora?</p>'
      + '<div class="cadastro-concluido-acoes">'
      + (podeTrabalhar && id
        ? '<button type="button" class="botao" id="trabalhar-no-cadastrado">Trabalhar no caso</button>' : '')
      + '<button type="button" class="botao-secundario" id="cadastrar-outro">Cadastrar outro caso</button>'
      + (podeIrAoTrabalho
        ? '<button type="button" class="botao-secundario" id="ir-para-o-trabalho">Ir para o Trabalho</button>' : '')
      + '</div></div></div>';

    var trabalhar = elemento('trabalhar-no-cadastrado');
    if (trabalhar) trabalhar.addEventListener('click', function () {
      CasoEmModal.abrir(canalEscolhido, id, null);
    });
    elemento('cadastrar-outro').addEventListener('click', function () {
      envio = '';   // formulário limpo é caso novo
      carregarFormulario();
    });
    var irAoTrabalho = elemento('ir-para-o-trabalho');
    if (irAoTrabalho) irAoTrabalho.addEventListener('click', function () {
      Aplicacao.irPara('trabalho');
    });
    (trabalhar || elemento('cadastrar-outro')).focus();
  }

  function ligar() {
    SeletorDeCanal.ligar(function (idDoCanal) {
      depoisDePerguntar(function () {
        canalEscolhido = idDoCanal;
        Aplicacao.remontar(true);   // já perguntou: a moldura não pergunta de novo
      });
    });
    var abas = document.querySelectorAll('[data-o-que-cadastrar]');
    for (var i = 0; i < abas.length; i++) {
      abas[i].addEventListener('click', function () {
        var qual = this.getAttribute('data-o-que-cadastrar');
        depoisDePerguntar(function () {
          oQueCadastrar = qual;
          Aplicacao.remontar(true);
        });
      });
    }
    retratoDoCadastro = null;
    window.addEventListener('beforeunload', aoSairDaPagina);
    if (oQueCadastrar === 'reuniao') { ligarReuniao(); return; }

    elemento('formulario-do-caso').addEventListener('submit', function (evento) {
      evento.preventDefault();
      salvar();
    });
    elemento('limpar-caso').addEventListener('click', function () {
      recado('', '');
      envio = '';   // formulário limpo é caso novo
      carregarFormulario();
    });
    document.addEventListener('keydown', atalhoDeSalvar);

    carregarFormulario();
  }

  function atalhoDeSalvar(evento) {
    if ((evento.ctrlKey || evento.metaKey) && evento.key === 'Enter') {
      // Com o modal aberto, o Ctrl+Enter é dele — quem está na frente manda.
      if (document.querySelector('.dialogo')) return;
      if (elemento('formulario-do-caso')) {
        evento.preventDefault();
        salvar();
      }
    }
  }

  /** Chamado ao sair da tela, para o atalho não continuar valendo nas outras. */
  function desligar() {
    document.removeEventListener('keydown', atalhoDeSalvar);
    window.removeEventListener('beforeunload', aoSairDaPagina);
    retratoDoCadastro = null;
  }

  return { montar: montar, ligar: ligar, desligar: desligar, podeSair: podeSair };
})();
</script>
