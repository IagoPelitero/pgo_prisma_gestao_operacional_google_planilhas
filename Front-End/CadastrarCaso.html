<script>
/* ============================================================================
   PGO — CadastrarCaso.html · a tela que grava
   ============================================================================
   A tela não sabe quais campos existem. Ela pergunta ao servidor, recebe a
   definição e pede ao Formulario que desenhe. Campo criado em Configurações
   aparece aqui sozinho; campo escondido para o nível nem chega a ser enviado.

   Quem desenha, mascara e marca erro é o Formulario — o mesmo que o modal de
   edição do Trabalho usa. Duas cópias do mesmo formulário divergiriam no
   primeiro ajuste.
   ============================================================================ */

var TelaCadastrarCaso = (function () {

  var canalEscolhida = '';
  var salvando = false;

  function escapar(texto) { return Moldura.escapar(texto); }
  function elemento(id) { return document.getElementById(id); }
  function corpo() { return elemento('corpo-do-formulario'); }

  /* --------------------------------------------------------------- montar */

  function montar(pacote) {
    if (!canalEscolhida && pacote.canais.length) canalEscolhida = pacote.canais[0].id;

    return SeletorDeCanal.montar(pacote.canais, canalEscolhida)
      + '<form class="cartao formulario" id="formulario-do-caso" novalidate>'
      + '<div id="corpo-do-formulario"><p class="carregando-campos">'
      + 'Montando o formulário…</p></div>'
      + '<div class="acoes">'
      + '<button type="submit" class="botao" id="salvar-caso">Cadastrar caso</button>'
      + '<button type="button" class="botao-secundario" id="limpar-caso">Limpar</button>'
      + '<span class="atalho">ou <kbd>Ctrl</kbd> + <kbd>Enter</kbd></span>'
      + '<span class="recado" id="recado-do-caso" hidden></span>'
      + '</div></form>';
  }

  /* ----------------------------------------------------------- comportamento */

  function carregarFormulario() {
    corpo().innerHTML = '<p class="carregando-campos">Montando o formulário…</p>';

    Servidor.chamar('formularioDoCanal', canalEscolhida)
      .entao(function (resposta) {
        corpo().innerHTML = Formulario.desenhar(resposta, '');
        Formulario.ligar(corpo(), '');
        // Só no cadastro NOVO. No caso já gravado quem manda é o valor da
        // planilha — um padrão por cima dele seria perda silenciosa de dado.
        Formulario.aplicarPadroes(corpo(), resposta);
        var primeiro = corpo().querySelector(
          'input:not([disabled]), select:not([disabled])');
        if (primeiro) primeiro.focus();
      })
      .senao(function (erro) {
        corpo().innerHTML = '<p class="carregando-campos erro-carga">'
          + escapar(erro.message || String(erro)) + '</p>';
      });
  }

  function recado(texto, tipo) {
    var caixa = elemento('recado-do-caso');
    caixa.className = 'recado ' + (tipo || '');
    caixa.textContent = texto;
    caixa.hidden = !texto;
  }

  function salvar() {
    if (salvando) return;
    salvando = true;
    Formulario.limparErros(corpo());
    recado('Gravando…', '');
    elemento('salvar-caso').disabled = true;

    Servidor.chamar('cadastrarCaso', canalEscolhida, Formulario.valores(corpo()))
      .entao(function (resposta) {
        salvando = false;
        elemento('salvar-caso').disabled = false;
        recado('Caso ' + resposta.id + ' cadastrado em ' + resposta.canal + '.', 'bom');
        carregarFormulario();
      })
      .senao(function (erro) {
        salvando = false;
        elemento('salvar-caso').disabled = false;
        recado(erro.message || String(erro), 'ruim');
        if (erro.problemas) Formulario.mostrarProblemas(corpo(), erro.problemas);
      });
  }

  function ligar(pacote) {
    SeletorDeCanal.ligar(function (idDoCanal) {
      canalEscolhida = idDoCanal;
      Aplicacao.remontar();
    });

    elemento('formulario-do-caso').addEventListener('submit', function (evento) {
      evento.preventDefault();
      salvar();
    });
    elemento('limpar-caso').addEventListener('click', function () {
      recado('', '');
      carregarFormulario();
    });
    document.addEventListener('keydown', atalhoDeSalvar);

    carregarFormulario();
  }

  function atalhoDeSalvar(evento) {
    if ((evento.ctrlKey || evento.metaKey) && evento.key === 'Enter') {
      // Com o modal aberto, o Ctrl+Enter é dele — quem está na frente manda.
      if (document.querySelector('.dialogo')) return;
      if (elemento('formulario-do-caso')) {
        evento.preventDefault();
        salvar();
      }
    }
  }

  /** Chamado ao sair da tela, para o atalho não continuar valendo nas outras. */
  function desligar() {
    document.removeEventListener('keydown', atalhoDeSalvar);
  }

  return { montar: montar, ligar: ligar, desligar: desligar };
})();
</script>
