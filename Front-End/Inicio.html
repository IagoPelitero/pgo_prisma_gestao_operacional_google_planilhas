<script>
/* ============================================================================
   PGO — Inicio.html · a tela que abre o sistema (Etapa 67)
   ============================================================================
   Decisões do PO: abre o sistema, para todos, com quatro blocos:

     MEU DIA            por canal, os meus casos abertos, os perto de vencer e
                        os estourados;
     O DIA DA OPERAÇÃO  por canal, as entradas e os encerrados de hoje, e os
                        abertos, perto de vencer e estourados da equipe — só
                        para quem não tem o alcance restrito aos próprios casos;
     ATALHOS            as telas de uso diário que a pessoa pode abrir;
     NOVIDADES          o que mudou na última versão.

   Os números são os do Trabalho na abertura (do dia 1 do mês até hoje), e
   clicar num canal leva ao Trabalho daquele canal.
   ============================================================================ */

var TelaInicio = (function () {

  var pacoteDoSistema = null;
  var ATALHOS = ['cadastrarCaso', 'buscarCaso', 'importacao'];

  function escapar(texto) { return Moldura.escapar(texto); }
  function elemento(id) { return document.getElementById(id); }

  function montar(pacote) {
    pacoteDoSistema = pacote;
    return '<div id="inicio">' + Moldura.esqueleto('Preparando o seu dia…', 3) + '</div>';
  }

  function numero(valor, rotulo, tom) {
    return '<div class="inicio-numero' + (tom && valor ? ' tom-' + tom : '') + '">'
      + '<strong>' + escapar(String(valor)) + '</strong><span>' + escapar(rotulo) + '</span></div>';
  }

  function cartaoDoCanal(canal) {
    return '<button type="button" class="cartao inicio-canal" data-canal-do-inicio="'
      + escapar(canal.id) + '" title="Abrir o Trabalho de ' + escapar(canal.nome) + '">'
      + '<span class="inicio-canal-nome">' + SeletorDeCanal.icone(canal.icone)
      + escapar(canal.nome) + '</span>'
      + '<span class="inicio-bloco-titulo">Meu dia</span>'
      + '<span class="inicio-numeros">'
      + numero(canal.meuDia.abertos, 'meus abertos')
      + numero(canal.meuDia.pertoDeVencer, 'perto de vencer', 'atencao')
      + numero(canal.meuDia.estourados, 'estourados', 'ruim')
      + '</span>'
      + (canal.operacao
        ? '<span class="inicio-bloco-titulo">O dia da operação</span>'
          + '<span class="inicio-numeros">'
          + numero(canal.operacao.entradasHoje, 'entradas hoje')
          + numero(canal.operacao.encerradosHoje, 'encerrados hoje', 'bom')
          + numero(canal.operacao.abertos, 'abertos')
          + numero(canal.operacao.pertoDeVencer, 'perto de vencer', 'atencao')
          + numero(canal.operacao.estourados, 'estourados', 'ruim')
          + '</span>'
        : '')
      + '</button>';
  }

  function atalhos() {
    var meus = pacoteDoSistema.menu.filter(function (item) {
      return ATALHOS.indexOf(item.tela) >= 0;
    });
    if (!meus.length) return '';
    return '<section class="inicio-atalhos" aria-label="Atalhos">'
      + meus.map(function (item) {
        return '<button type="button" class="botao vazado inicio-atalho" data-atalho="'
          + escapar(item.tela) + '">' + Moldura.icone(item.tela)
          + '<span>' + escapar(item.titulo) + '</span></button>';
      }).join('') + '</section>';
  }

  function novidades(versao) {
    if (!versao || !versao.novidades || !versao.novidades.length) return '';
    return '<section class="cartao inicio-novidades">'
      + '<h3>Novidades da versão ' + escapar(versao.numero)
      + (versao.data ? ' <small>' + escapar(versao.data) + '</small>' : '') + '</h3>'
      + '<ul>' + versao.novidades.map(function (linha) {
        return '<li>' + escapar(linha) + '</li>';
      }).join('') + '</ul></section>';
  }

  function desenhar(resumo) {
    var caixa = elemento('inicio');
    if (!caixa) return;
    caixa.innerHTML = '<p class="inicio-saudacao">Olá, <strong>' + escapar(resumo.usuario)
      + '</strong>. Os números são de ' + escapar(resumo.periodo) + '.</p>'
      + atalhos()
      + '<div class="inicio-canais">' + resumo.canais.map(cartaoDoCanal).join('') + '</div>'
      + novidades(resumo.versao);
    ligarCliques();
  }

  function ligarCliques() {
    var canais = document.querySelectorAll('[data-canal-do-inicio]');
    for (var i = 0; i < canais.length; i++) {
      canais[i].addEventListener('click', function () {
        TelaTrabalho.abrirNoCanal(this.getAttribute('data-canal-do-inicio'));
      });
    }
    var botoes = document.querySelectorAll('[data-atalho]');
    for (var j = 0; j < botoes.length; j++) {
      botoes[j].addEventListener('click', function () {
        Aplicacao.irPara(this.getAttribute('data-atalho'));
      });
    }
  }

  function ligar() {
    Servidor.chamar('resumoDoInicio')
      .entao(desenhar)
      .senao(function (erro) {
        var caixa = elemento('inicio');
        if (caixa) {
          caixa.innerHTML = '<p class="carregando-campos erro-carga">'
            + escapar(erro.message || String(erro)) + '</p>' + atalhos();
          ligarCliques();
        }
      });
  }

  return { montar: montar, ligar: ligar };
})();
</script>
